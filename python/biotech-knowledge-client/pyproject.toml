[project]
name = "biotech-knowledge-client"
version = "0.1.0"
description = "Typed Python client for the BellLabs biotech knowledge executor: validates intents/receipts against the exported JSON Schemas and calls the HTTP API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pydantic>=2.9",
]

[project.scripts]
bks-py = "biotech_knowledge_client.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biotech_knowledge_client"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
