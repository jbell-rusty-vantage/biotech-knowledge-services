"""
Purpose: a regenerable score between two entities computed by a projection Activity under a method version (PLAN 6.1
"materialized"): evidence aggregate (compound X ↔ outcome or target Y with a per-evidence-kind breakdown),
surveillance disproportionality signal, co-occurrence, similarity, link-prediction lead. It is a retrieval and
ranking aid, never evidence, never a confidence, never an asserted edge between the two entities; any answer that
uses it shows the method version and its inputs. BellLabs-computed only: an external score (Open Targets, a producer's
FAERS statistic, a third-party ranking) is an Assertion by its producer and is never copied into an Association. It
implements Entity only: no question makes an Association the subject of an Assertion or an Assessment (a signal
interpretation ASSESSES the drug and the event and cites the signal's inputs). Only the projection job writes it
(WAS_GENERATED_BY a PROJECTION Activity whose methodVersion equals `methodVersion`); a recompute writes a new record
naming `supersedesUid` and closes the old one with `recordedTo`. A superseded Association is kept while any Report or
ReportItem cites it; otherwise the projection job may remove it (R-48). The score lives on this node only, never on
ASSOCIATES. Not Associations: discourse metrics (projection-cache properties on the measured node, R-49), rule-based
per-record classifications (CALCULATED Assertions, the NOVA pattern, R-51). D2's derived AFFECTS_MECHANISM stays a
traversal shortcut without a method score; Q-D2-18 ranks on EVIDENCE_AGGREGATE Associations (R-47).
Identity rule: (associationKind, sorted member uids, methodVersion, inputSetDigest). uid token: `association`
(hu:association:<opaque>). Questions: CQ-EV-02, CQ-AX-08, Q-D10-05, Q-D10-06, Q-D10-19.
"""
type Association implements Entity {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  createdAt: DateTime
  updatedAt: DateTime
  associationKind: AssociationKind!

  """
  uid of the member the score is oriented from (exposure, drug, compound); the other member is the partner. For symmetric kinds, the lower uid.
  """
  anchorUid: String!

  """
  The method's own score. Not a confidence, not a probability, not evidence (Open Targets states the same of its score).
  """
  score: Float!

  """
  Breakdown by evidence kind or data source, '<kind>=<value>' (e.g. literature=0.99, clinical=0.61).
  """
  components: [String!]

  """
  Named statistic for SIGNAL_DISPROPORTIONALITY (e.g. LLR, PRR, ROR), its value and the method's threshold.
  """
  statistic: String
  statisticValue: Float
  threshold: Float

  """
  Number of input records (assertions, studies, reports) behind the score.
  """
  inputCount: Int

  """sha256:<hex> over the sorted input uids and their contentHashes."""
  inputSetDigest: String!

  """
  Method and version (derivationRule), e.g. bl-assoc/evidence-aggregate@1, gds-nodesimilarity/jaccard@1.
  """
  methodVersion: String!
  computedAt: DateTime!

  """
  Staleness bound: after this time the record must be recomputed before an answer uses it.
  """
  staleAfter: DateTime
  recordedAt: DateTime!
  recordedTo: DateTime
  supersedesUid: String

  """
  class: derived (projection job; read-only, regenerable); cardinality: exactly_two (anchor and partner; anchorUid says which); no score on the edge (DerivedEdgeProperties.score stays null; the score is on the Association node only); superseded uncited Associations may be removed with their edges (R-48); one of the two registered domain edges to Subjectable (R-28); questions: Q-D10-05, Q-D10-06, Q-D10-19, CQ-EV-02.
  """
  members(where: SubjectableWhere, limit: Int, offset: Int, sort: [SubjectableSort!]): [Subjectable!]!
  membersConnection(where: AssociationMembersConnectionWhere, first: Int, after: String, sort: [AssociationMembersConnectionSort!]): AssociationMembersConnection!

  """
  class: structural (kernel DERIVED_FROM; the projection's citation set, written with the record); cardinality: many (bounded by inputCount; above 5,000 inputs only inputSetDigest is kept); questions: CQ-AX-08, Q-D10-05.
