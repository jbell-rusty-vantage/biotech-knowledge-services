  SYSTEMATIC
  SPONTANEOUS
  NOT_DESCRIBED
}

enum AeSeriousness {
  ANY
  SERIOUS
  NON_SERIOUS
}

"""Kind of agent (Biolink AgentTypeEnum)."""
enum AgentKind {
  MANUAL_AGENT
