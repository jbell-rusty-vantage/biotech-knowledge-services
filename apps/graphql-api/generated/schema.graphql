  SUBGROUP_POST_HOC
  EXPLORATORY
  SAFETY
}

enum AnalysisSetKind {
  INTENTION_TO_TREAT
  MODIFIED_INTENTION_TO_TREAT
  PER_PROTOCOL
  SAFETY_SET
  COMPLETERS
  OTHER
  NOT_REPORTED
}

