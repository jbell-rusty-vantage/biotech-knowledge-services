What a certification listing covers. 3 members. A facility-level listing (GMP registration) covers no typed target until
Facility is promoted (OQ-D8-03): its facility stays in scopeVerbatim and the operator is predicate-only
LISTING_COVERS_FACILITY_OF (05 predicateOnly).
"""
union CertificationCoverageTarget = Product | ProductVariant | Lot

