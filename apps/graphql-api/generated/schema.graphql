"""A date, represented as a 'yyyy-mm-dd' string"""
scalar Date

"""A date and time, represented as an ISO-8601 string"""
scalar DateTime

"""
Kind of process (00-DIRECTIVE section 4); finer steps go in Activity.operationKind.
"""
enum ActivityKind {
  RESEARCH
  INGESTION
  VETTING
  EVIDENCE_MISSION
  VERIFICATION
  PROJECTION
  ANSWER
}

"""verification.v1 adjudication decision (human review of a held result)."""
enum AdjudicationDecision {
  AFFIRM
  REJECT
  DEFER
}

"""
CAPTURE_FIDELITY judges the record against its declared span (feeds Assertion.status); SUPPORT judges whether located evidence supports the proposition (world question; never changes status).
"""
enum AdjudicationKind {
  CAPTURE_FIDELITY
  SUPPORT
}

"""
Route of administration as stated. IN_MEDIUM: added to the culture medium (cell-free and in-vitro work; amount basis MEDIUM_CONCENTRATION, R-58).
"""
