  """
  object(where: SubjectableWhere, limit: Int, offset: Int, sort: [SubjectableSort!]): [Subjectable!]!
  objectConnection(where: AssertionObjectConnectionWhere, first: Int, after: String, sort: [AssertionObjectConnectionSort!]): AssertionObjectConnection!

  """
  class: structural; cardinality: exactly_one (D7 Person or Organization, K Agent, a D3 Publication or D9 MediaWork for a multi-author work's own voice (R-15), or a D9 Channel with channelKind ACCOUNT when no person is identified; validated by the executor, P20); questions: Q-K-01, Q-K-09, Q-K-15.
  """
  assertedBy(where: SubjectableWhere, limit: Int, offset: Int, sort: [SubjectableSort!]): [Subjectable!]!
  assertedByConnection(where: AssertionAssertedByConnectionWhere, first: Int, after: String, sort: [AssertionAssertedByConnectionSort!]): AssertionAssertedByConnection!

  """
