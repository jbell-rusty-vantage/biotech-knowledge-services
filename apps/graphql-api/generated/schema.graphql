Who sponsors a work: the legal organization when the read or note names it, else the brand it names ('AG1', 'LMNT').
"""
union ContentSponsor = Organization | Brand

"""What an evidence context's group was exposed to."""
union ContextExposure = ChemicalSubstance | IngredientMaterial | Intervention

"""
What a declared composition line resolves to: a D1 ingredient material (incl. D1's unresolved-material sentinel), a D1 nutrient/constituent, or a D12 food item (prepared-food ingredient statements).
"""
union DeclaredComponentTarget = IngredientMaterial | Constituent | FoodItem

"""
Composition targets of FOOD_CONTAINS (2, both D1): a structure-defined substance (hydroxytyrosol, acrylamide) or a nutrient/class concept (energy, protein, vitamin B6, total polyphenols).
"""
union FoodComponentTarget = ChemicalSubstance | Constituent

"""
What a legal standing is the standing of. 4 members; a device clearance is the standing of the Product that DELIVERS the Device (R-72).
"""
union LegalStatusSubject = ChemicalSubstance | IngredientMaterial | Product | Patent

"""
What a lot is a lot of (variant when resolvable, else product). 2 members.
"""
union LotOfTarget = Product | ProductVariant

"""
Who can be projected as affecting a mechanism: a D1 substance (rolled up to active moiety) or a D5 non-substance intervention.
"""
union MechanismModulator = ChemicalSubstance | Intervention

"""
What an outcome definition measures: D4 metric or biomarker, D2 outcome (study-independent endpoint concept: all-cause mortality, lifespan, VO2max), D2 condition (incident disease and adverse-event terms).
"""
union OutcomeMeasureTarget = Metric | Biomarker | Outcome | Condition

"""
Members a PATTERN_COMPONENT edge may point at (3: two D12 types and the D1 nutrient concept for 'limit added sugars').
"""
union PatternComponentTarget = FoodItem | FoodCategory | Constituent

"""What a quality result row measures or states. 3 members."""
union QualityAnalyte = ChemicalSubstance | IngredientMaterial | Constituent

"""
What an authority record is about (besides the addressee): substance, ingredient material, product, lot. 4 members.
A device record concerns the D6 Product, which DELIVERS the D4 Device (R-72; Q-D8-23). A court or PTAB decision reaches
its patent through the LegalStatus it establishes (STATUS_FROM / STATUS_OF); an infringement-only holding is
predicate-only ADJUDICATES_PATENT (D8 register predicateOnly).
"""
union RegulatoryRecordTopic = ChemicalSubstance | IngredientMaterial | Product | Lot

"""The two kinds of record that state a per-source study element."""
union StatingRecord = RegistrationVersion | Publication

"""
Who or what holds a role toward a study: a D7 Organization, a D7 Person (sponsor-investigator: NCT04313634 lead sponsor 'Sundeep Khosla, M.D.'; investigators) or a D7 Award (FUNDING_AWARD).
"""
union StudyParty = Organization | Person | Award

"""
How progress toward a Target is measured (OPERATIONALIZED_BY): D4 Biomarker, D4 Metric, D2 Outcome (a
study-independent endpoint concept such as all-cause mortality or handgrip strength, the node D3 OutcomeDefinitions
MEASURE), or D2 Condition (incidence of this condition measures the target; the direction lives in the
vocab-targets rule). D2.Outcome added in the check stage at D2's request (D2 11-open-questions item 27); D2.Condition
added in synthesis (R-70: condition-coded outcomes reach a Target through a typed member, not a shared Identifier;
the pair is value 1 and carries a fixture request). 4 members.
"""
union TargetMeasure = Biomarker | Metric | Outcome | Condition

interface Entity {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  createdAt: DateTime
  updatedAt: DateTime
}

