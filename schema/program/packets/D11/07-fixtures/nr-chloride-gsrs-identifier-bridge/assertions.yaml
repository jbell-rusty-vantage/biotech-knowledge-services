bridgeCheck:   # identifier-bridges.yaml rows exercised; every bridge is co-attachment, no identifier->identifier edge exists
  B07: "UNII 8XM2XT8VWI -> CAS 23111-00-4, PubChem 90480033, GRN 635, InChIKey YABIFCKURFRPPO-IVOJBTPCSA-N: id01..id05 (one authority, one snapshot, version 18)"
  B08: "UNII salt -> UNII moiety: m01 (HAS_ACTIVE_MOIETY episode, GSRS /relationships/0)"
  B09: "PubChem CID <-> InChIKey confirmed structurally: id06, id08 (not via synonym strings)"
  B10: "free-text name -> ChEBI: hypothesis only; r01 proposal superseded by r02 (CONTRADICTED)"
  cypher: |
    // CQ-ID-04: which identifiers support the substance match, from which authority and which release
    MATCH (s:ChemicalSubstance {uid: 'hu:substance:unii-8xm2xt8vwi'})-[h:HAS_IDENTIFIER]->(id:Identifier)
    WHERE h.recordedTo IS NULL
    MATCH (a:Assertion {uid: h.assertionUid})-[:ASSERTED_BY]->(auth)
    MATCH (a)-[:HAS_EVIDENCE]->(loc:SourceLocator)<-[:HAS_LOCATOR]-(snap:SourceSnapshot)<-[:HAS_SNAPSHOT]-(src:Source)
    RETURN id.scheme, id.value, id.issuer, auth.name, src.canonicalUri, snap.retrievedAt, snap.contentHash, a.status
