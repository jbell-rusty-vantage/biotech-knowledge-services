# ------------------------------------------------------------------------------------------------------------
# Directive 3.8: question -> chunk (MENTIONS or vector) -> assertion(s) -> SourceLocator -> SourceSnapshot bytes
# ------------------------------------------------------------------------------------------------------------
retrievalPath:
  question: "Q-D11-03 — What material, form and dose did NCT02921659 administer, quoted from the paper with its locator?"
  snapshot: { ref: snap-jats-pmc5876407, contentHash: "sha256:dd620181966f862df7030f4bb7b09811befd90e8e67c2b94fc90f9c212664794", contentHashBasis: RAW_BYTES }
  chunks: "locators.yaml#chunks (6 D9 Chunks over the raw JATS: chunk-sec-design covers l-jats-dose and l-jats-mention-nrcl; chunk-sec-ethics covers l-jats-registered and l-jats-mention-nct)"
  chunkProperties: { textBasis: JATS_XML, extractorVersion: "europepmc-jats/raw", normalizationVersion: "none (raw code points; U+2009 and U+00A0 kept)", chunkerVersion: "fixture-chunker/1", embeddingModel: "(not computed in the fixture)", generatedBy: act-chunk }
  mentions:   # kernel Mention (span = locator, role CONTEXT) + D9 Chunk -[:MENTIONS {DerivedEdgeProperties}]-> entity, licensed by a RESOLUTION Assessment
    - { surfaceForm: "nicotinamide riboside chloride", locator: l-jats-mention-nrcl, chunk: chunk-sec-design, resolvedTo: { ref: sub-nrcl, type: ChemicalSubstance }, licensedBy: r01-resolve-nrcl, edge: "Chunk -[:MENTIONS {derivationRule: 'entity-link/v1', derivedFromAssessmentUids: [r01-resolve-nrcl]}]-> ChemicalSubstance" }
    - { surfaceForm: "NIAGEN", locator: l-jats-dose, chunk: chunk-sec-design, resolvedTo: { ref: mat-niagen, type: IngredientMaterial }, licensedBy: r02-resolve-niagen }
    - { surfaceForm: "NCT02921659", locator: l-jats-mention-nct, chunk: chunk-sec-ethics, resolvedTo: { ref: study-nr, type: Study }, licensedBy: r03-resolve-nct, note: "the identifier resolves by scheme NCT; the trial is reachable from the paper text only (CT.gov and PubMed hold no link, a06/a07)" }
  vectorEntry: { index: "chunk_embedding (D9 vector index over Chunk embeddings)", queryText: "nicotinamide riboside chloride dose twice per day capsules randomized crossover", expectedTopChunk: chunk-sec-design, note: "scores are not stored; the MENTIONS hop from the Study (via NCT) or the substance (via UNII) is the deterministic entry" }
  coversLocator: { chunk-sec-design: [l-jats-dose, l-jats-mention-nrcl], chunk-sec-ethics: [l-jats-registered, l-jats-mention-nct], chunk-sec-ae: [l-jats-ae], chunk-par-discussion: [l-jats-dose-caution], chunk-ack: [l-jats-ack], chunk-coi: [l-jats-coi] }
  assertionsReached: { l-jats-dose: [a01-administers, a02-dose-amount, a03-realizes], l-jats-registered: [a05-reports-on], l-jats-ae: [c01-tolerated], l-jats-dose-caution: [c02-dose-caution], l-jats-ack: [a08-role-material-provider, a09-role-funder], l-jats-coi: [a10-no-competing-interest] }
  verifierReselect: "for every locator: snapshot_text[startOffset:endOffset] == exact and sha256(exact) == quoteHash (offsetBasis CODE_POINT); re-run 2026-10-08 by build_locators.py on a fresh capture whose sha256 equals the research capture; adjudication ad01 records the result for a01"
  cypher: |
    // entry by MENTIONS from the Study (deterministic) — or replace the first MATCH with the vector SEARCH over chunk_embedding
    MATCH (st:Study)-[:HAS_IDENTIFIER]-(:Identifier {scheme: 'NCT', value: 'NCT02921659'})
    MATCH (st)<-[:MENTIONS]-(c0:Chunk)-[:CHUNK_OF]->(snap:SourceSnapshot)<-[:CHUNK_OF]-(c:Chunk)
    MATCH (c)-[:COVERS_LOCATOR]->(loc:SourceLocator)<-[ev:HAS_EVIDENCE]-(a:Assertion)
    WHERE a.recordedTo IS NULL AND ev.role = 'SUPPORTS' AND a.predicate IN ['ADMINISTERS', 'ADMINISTERED_AMOUNT']
    OPTIONAL MATCH (a)<-[:ASSESSES]-(adj:Adjudication {adjudicationKind: 'CAPTURE_FIDELITY'})
    OPTIONAL MATCH (a)-[:HAS_OBJECT]->(m:IngredientMaterial)-[:REALIZES_SUBSTANCE]->(s:ChemicalSubstance)
    RETURN a.predicate, a.valueNumber, a.unitCode, m.name, s.name, loc.exact, loc.startOffset, loc.endOffset,
           snap.contentHash, snap.retrievedAt, adj.verdict
    ORDER BY loc.startOffset

