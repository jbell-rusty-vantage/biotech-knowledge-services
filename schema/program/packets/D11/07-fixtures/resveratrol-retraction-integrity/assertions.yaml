taintPath:
  question: "Q-D11-05 — Which assertions rest on a source that has since been retracted, and since when do we know?"
  cypher: |
    MATCH (a:Assertion)-[ev:HAS_EVIDENCE]->(:SourceLocator)<-[:HAS_LOCATOR]-(:SourceSnapshot)<-[:HAS_SNAPSHOT]-(src:Source)
    WHERE a.recordedTo IS NULL AND ev.role = 'SUPPORTS'
    MATCH (src)-[:HAS_IDENTIFIER]->(id:Identifier)<-[:HAS_IDENTIFIER]-(w:Publication)
    MATCH (w)<-[rv:REVISES]-(notice:Publication)
    WHERE rv.revisionKind IN ['RETRACTION', 'WITHDRAWAL'] AND rv.recordedTo IS NULL
    RETURN a.uid, a.predicate, w.uid, notice.uid, collect(DISTINCT rv.assertionUid) AS revisionAssertions,
           min(rv.recordedFrom) AS knownSince, min(rv.validFrom) AS retractedOn
  note: "HAS_IDENTIFIER is stored holder -> Identifier (the kernel field Identifier.identifies reads it inversely); the Source and the Publication join through the shared Identifier node, never through an identifier->identifier edge. Also SourceSnapshot.revisionKind = RETRACTION on snap-aps-notice-rendition (revisesSnapshotRef snap-pubmed-12003802) answers the snapshot-level variant without D3"
  expected: { assertion: c01-precondition-claim, work: "hu:publication:pmid-12003802", notice: "hu:publication:pmid-22833916", revisionAssertions: [v01-revises-retraction-watch, v02-revises-nlm, v03-revises-publisher], retractedOn: "2012-06-01", knownSince: "the fixture commit time (2026-10-08)" }
