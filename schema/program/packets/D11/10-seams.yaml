version: 1
module: D11
# Model stage, A8, 2026-10-08. D11 declares no relationship field, so it has no declared seam (no D11 field targets a type
# outside the module). Section 1 lists the implicit seams: other modules' relationships and types that D11's retrieval
# patterns (03-retrieval-patterns.md) read, so the synthesizer sees the dependency and can tell when a rename breaks a
# D11 pattern. Type names follow the sibling SDLs as they stood on 2026-10-08 (A1 K/D10, A2 D1, A4 D3, A6 D6/D7, A7 D8,
# A8 D9). owner: other = the named module declares it.
seams:
