  - { type: REPORTS_ON, from: D3.Publication, to: D3.Study, questions: [Q-D11-02, Q-D11-08], direction: OUT, owner: other, note: "asserted, one record per asserter (paper text, registry references module, NLM DataBank); AssertedRecordedProperties: recorded time only (adversarial review); one-sided link flag" }
  - { type: REVISES, from: D3.Publication, to: D3.Publication, questions: [Q-D11-04, Q-D11-05, Q-D11-19], direction: OUT, owner: other, note: "retraction / correction / EoC notices and preprint→journal versions; RevisionEdgeProperties = AssertedRecordedProperties + revisionKind (no valid time): recordedFrom = since when BellLabs knows, notice.publishedAt = revision date, r.revisionKind per asserter (Q-D11-04 corrected in the adversarial review)" }
