  - { type: HAS_COMPONENT, from: D3.StudyArm, to: D3.InterventionComponent, questions: [Q-D11-03], direction: OUT, owner: other }
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D1.IngredientMaterial, questions: [Q-D11-03, CQ-PV-04, Q-D11-21], direction: OUT, owner: other, note: "AssertedRecordedProperties (recorded time only); quantity, unitCode, quantityBasis, scheduleText on the component" }
