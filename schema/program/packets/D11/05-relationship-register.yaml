version: 1
module: D11
# Model stage, A8, 2026-10-08; adversarial review 2026-10-08. D11 declares NO relationship type (0 / 14, 0 pairs / 35).
# Why: every D11 question traverses kernel relationships (HAS_IDENTIFIER, HAS_EVIDENCE, HAS_SNAPSHOT, HAS_LOCATOR,
# WAS_GENERATED_BY, WAS_ASSOCIATED_WITH, ASSESSES, MENTIONS) or other modules' relationships (D3 REPORTS_ON, REVISES,
# HAS_REGISTRATION_VERSION, ADMINISTERS; D1 HAS_ACTIVE_MOIETY, REALIZES_SUBSTANCE; D6 HAS_LABEL_VERSION,
# DECLARES_COMPONENT; D8 STATUS_OF, STATUS_FROM; D9 CHUNK_OF, COVERS_LOCATOR). The one D11 node type, CaptureAttempt,
# is reached by property filters and by the kernel's Activity.generated (WAS_GENERATED_BY). See 09-reasoning.md.
relationships: []

# Predicates D11 relies on that stay Assertion.predicate values (cost 0 in the executable). Each names the question
# that would promote it to a typed relationship and the module that would own it. SCREAMING_SNAKE like the kernel
# conventions (FIELD_NOT_REPORTED, HAS_REVISION_STATUS, RATES_CLAIM); renamed from lowercase in the adversarial review.
# Adversarial review (2026-10-08) also DROPPED four D11 predicates that duplicated sibling concepts, and re-pointed the
# patterns to the owners' shapes (10-seams.yaml section 2):
#   has_boxed_warning                  -> D5 USE_CONSTRAINED_IN (predicate) with qualifier section:BOXED_WARNING (Q-D11-11;
#                                         D5 asked to add BOXED_WARNING to its section list, 11-open-questions item 39)
#   recall_names_product               -> D8 RegulatoryRecord {recordKind: RECALL} -[:CONCERNS]-> Product | Lot (Q-D11-18)
#   adverse_event_report_names_product -> D5 CAUSES_ADVERSE_EFFECT (predicate, qualifier sourceKind:SPONTANEOUS_REPORT;
#                                         disclaimer = CAUTIONS Assertion, D5 Q-D5-20) (Q-D11-18)
#   label_version_of                   -> D6 HAS_LABEL_VERSION (Q-D11-12); DSLD labelRelationships stay D6 assertions
predicateOnly:
  - predicate: PROSPECTIVE_REGISTRATION_FLAG
    subject: D3.Study
    object: literal (valueBoolean; ICTRP "Prospective Registration")
    questions: [Q-D11-06]
    promoteWhen: "never as an edge; D3 may add a property on RegistrationVersion"
    owner: D3
  - predicate: DISCLOSES_SUPPORT_FROM
    subject: D3.Publication
    object: D7.Organization
    questions: [Q-D11-08]
    promoteWhen: "a question traverses publication → supporting organization → financial interest in one pattern (D7 financial-interest seam)"
    owner: D7
  - predicate: DECLARES_NO_COMPETING_INTEREST
    subject: D3.Publication
    object: "literal (polarity NEGATIVE, speechAct DENIES: the authors deny having competing interests, a denial in the sense of K 09 item 12, never a not-reported)"
    questions: [Q-D11-08]
    promoteWhen: "never; it is a statement to compare, not a link"
    owner: D7
  - predicate: FUNDED_BY
    subject: D3.Publication   # on a Study the typed form is D3 HAS_STUDY_ROLE {roleKind FUNDER} (fixture nr-trial-jats-unstructured a09)
    object: D7.Organization
    questions: [Q-D11-08]
    promoteWhen: "D3/D7 decide (Crossref funder and Europe PMC grantsList rows)"
    owner: D3 / D7
  - predicate: RECORD_LAST_UPDATED
    subject: kernel Source (registry or aggregator record)
    object: literal (valueString = the date the record prints)
    questions: [CQ-PV-05]
    promoteWhen: "never; staleness is computed from two literals"
    owner: D11 (convention) / K

deferred:
  - type: USED_TOOL / CAPTURED_WITH (Activity|SourceSnapshot → ToolCapability)
    reason: "the tool is CONFIG; SourceSnapshot.captureMethod (kernel) and CaptureAttempt.toolId carry the action-space id; a ~60-node tool vocabulary would be a fan-in hub with no question traversing past it"
  - type: ATTEMPTED_FOR (CaptureAttempt → Subjectable)
    reason: "subjectUid property (indexed) answers CQ-AX-04; an attempt may concern a subject that is not a node yet; promote if a GraphQL client must filter attempts from the entity side with nested filters"
  - type: YIELDED_SNAPSHOT (CaptureAttempt → SourceSnapshot)
    reason: "snapshotUid property, kernel precedent (revisesSnapshotUid); one-hop join by uid; no question goes further from the attempt"
  - type: SAME_AS / BRIDGES_TO (Identifier → Identifier)
    reason: "forbidden by the kernel rule: identity is (scheme, issuer, value); bridges are co-attachment through HAS_IDENTIFIER assertions from an authority snapshot, or RESOLUTION / EQUIVALENCE Assessments when inferred (identifier-bridges.yaml)"
  - type: FOR_COVERAGE_REQUIREMENT (pinned SourceDiscoveryRecord → SourceCoverageRequirement)
    reason: "coverage requirements are CONFIG (registry `domains` + packets' question source lists); no question traverses a requirement node"
  - type: DISCOVERED_SOURCE (pinned SourceDiscoveryRecord → Source)
    reason: "a successful discovery is a SourceSnapshot generated by the same Activity (WAS_GENERATED_BY); the attempt record is written only for non-captures"
  - type: ANNOTATED_BY / TEXT_MINED (Chunk|Source → entity, Europe PMC annotations)
    reason: "text-mined links are the kernel's derived MENTIONS (method-versioned) licensed by a RESOLUTION Assessment that cites the span (SourceLocator, role CONTEXT; the kernel has no Mention node); never stored as a separate edge type (00-DIRECTIVE 3.8)"
  - type: RENDITION_OF_RECORD (aggregator Source → primary Source)
    reason: "CQ-PV-05 joins renditions through a shared Identifier (NCT, SPL set id, DOI); D9 owns RENDITION_OF for editorial works; a typed source-to-source edge is not needed while identifiers bridge"
  - type: REGISTERED_AS (Publication → registration)
    reason: "D3 REPORTS_ON (asserted) plus the Study's NCT identifier answers Q-D11-02"
