# Identifier-bridge table for the kernel (packet D11, agent A8, research stage 2026-10-08)
#
# Purpose: decide which Identifier schemes the kernel supports (Identifier.scheme values), how each
# value is normalized (Identifier.normalizationRule), which authority issues it (Identifier.issuer),
# and which bridges between schemes exist, who asserts them, and where they do not exist.
#
# Rules this table follows (kernel facts, START_HERE + node card Identifier):
#  - Identity of an Identifier is (scheme, issuer, value); the same (scheme, value) from two issuers
#    never establishes identity.
#  - A bridge is never a stored "same-as" edge between identifiers. A bridge observed in an authority
#    record is an Assertion (HAS_IDENTIFIER on the entity, cited to a locator in the authority's
#    SourceSnapshot); a bridge inferred by BellLabs (name match, structure match) is a kernel
#    Assessment of kind RESOLUTION or EQUIVALENCE until adjudicated (the pinned ResolutionHypothesis
#    was merged into Assessment by the kernel, A1 2026-10-08).
#
# Model-stage update (A8, 2026-10-08): `kernelCode` aligns every row to the published kernel register
#  packets/K/identifier-schemes.yaml (A1). Where the research-stage spelling differs, the kernel code
#  wins (EU_CT → EUCT, DSLD_LABEL_ID → DSLD, MESH_UI → MESH, CIK → SEC_CIK). Rows the kernel register
#  does not have are requests (11-open-questions.md, owner kernel). Bridge rows keep the research
#  spellings in `from`/`to` for traceability to _notes/tool-log.md; read them through kernelCode.
# Cross-packet pass (A8, 2026-10-08): the GENERATED block at the end of this file (`reconciliation`, written by
#  _notes/action-space/build-action-space.mjs) reconciles every code of the K register v2 and every scheme listed in
#  the fourteen packets' 06-node-register.yaml identifierSchemes with this table and with the merged action space
#  (which registry entries emit each scheme, at what readiness). Codes missing from K are requests in
#  11-open-questions.md item 46. `authorityRoute` values below are merged-registry ids (tooling/action-space.yaml).
#  - `observed` rows cite captures made on 2026-10-08 (scratch raw/ file names; see _notes/tool-log.md).
#  - Normalization rules marked `proposed` are BellLabs conventions to adopt, not external facts.

version: 1
scoredAt: "2026-10-08"

schemes:
  # ---------------------------------------------------------------- literature
  - scheme: PMID
    kernelCode: PMID
    issuer: NLM (PubMed)
    pattern: '^[1-9][0-9]{0,8}$'
    normalizationRule: pmid-digits-v1 (proposed; strip 'PMID:' prefix and leading zeros)
    checkDigit: none
    authorityRoute: ncbi-eutils-pubmed
    observed: "29599478, 12003802, 22833916 (eutils-efetch-*.xml)"
    notes: "Versioned in XML (<PMID Version=\"1\">); retraction notices get their own PMID linked by CommentsCorrections RetractionOf/RetractionIn."
  - scheme: PMCID
    kernelCode: PMCID
    issuer: NLM (PubMed Central)
    pattern: '^PMC[0-9]+$'
    normalizationRule: pmcid-upper-v1 (proposed; uppercase 'PMC', strip version suffix '.1' into a separate field)
    checkDigit: none
    authorityRoute: pmc-idconv
    observed: "PMC5876407; JATS also carries pmcid-ver PMC5876407.1 (epmc-fulltext-PMC5876407.xml)"
    notes: "Europe PMC annotation API uses 'PMC:5876407' (prefix + colon, digits only) — a third spelling to normalize."
  - scheme: DOI
    kernelCode: DOI
    issuer: DOI registration agency (Crossref, DataCite, …)
    pattern: '^10\.[0-9]{4,9}/\S+$'
    normalizationRule: doi-lowercase-v1 (kernel example; strip https://doi.org/ and 'doi:' prefixes)
    checkDigit: none
    authorityRoute: crossref-rest
    observed: "10.1038/s41467-018-03421-7; 10.1152/ajpheart.01012.2001; retraction notice 10.1152/ajpheart.zh4-0450-retr.2012; preprint 10.1101/680462"
    notes: "OpenAlex returns DOIs as URLs ('https://doi.org/…'); Crossref JSON escapes '/' as '\\/'. A preprint DOI and its journal DOI are different works (bridge below)."
  - scheme: RW_RECORD
    kernelCode: RW_RECORD   # K register v2, status requested (by K); D11 asked for it as RETRACTION_WATCH_ID (aligned in the check stage)
    issuer: Retraction Watch (via Crossref)
    pattern: '^[0-9]+$'
    normalizationRule: digits-v1 (proposed)
    checkDigit: none
    authorityRoute: crossref-rest
    observed: "record-id 54 on the updated-by relation of 10.1152/ajpheart.01012.2001"
    notes: "Identifies the retraction record, not the paper."
