# Readiness adjudications (D11, 2026-10-08). D11-local scores stand unless listed here; non-D11 entries take the lower
# median of the packets' current scores unless listed here.
overrides:
  nih-ods-api:
    readiness: 2
    reason: "D1 and D5 (adversarial review): the fact-sheet page answers 200 to a browser User-Agent and to Tavily/Firecrawl; the ODS API itself stays 403. D11's research-stage 1 predates that re-test."
  certification-databases:
    readiness: 1
    reason: "D8 fixtures stage captured NSF listing pages by curl and Informed Sport through a rendering service; D6 scraped NSF Certified for Sport. Scrape-only (1), not blocked (0)."
  sec-edgar:
    readiness: 2
    reason: "D7, D8 and D13 adversarial reviews: EDGAR Archives HTML carries an injected per-client script tag, so raw-byte digests do not reproduce on re-fetch; identity needs a registered text projection (edgar-text/v5, h2t-v1) or a strip rule. JSON (submissions, Form 4/13G XML) stays agent-ready; the entry scores its weakest needed artifact."
  open-targets:
    readiness: 2
    reason: "D2 fixtures stage (final): the GraphQL schema drifts between releases (maximumClinicalTrialPhase removed), so API_RECORD paths need introspection and a pinned release; D10 scored 3 on a single pinned call."
  internet-archive-wayback:
    readiness: 2
    reason: "K, D5, D6, D7, D9: the only route to what a page said before; CDX intermittently 'Temporarily Offline' and replay can substitute another capture (verify memento-datetime and payload SHA1)."
  firecrawl-cli:
    readiness: 2
    reason: "Every packet: renditions are not byte-stable across fetches (D4, D6, D9, D12, D13); quotes re-anchor by context, digests do not. D7's '3 for static pages' holds for one fetch only."

# Custom tooling clusters. G1-G10 come from the D11-local registry (titles kept); G11+ from the other packets.
gaps:
  - id: G1
    title: "Self-observed registry versions (CT.gov history blocked) and an ISRCTN history-prose parser"
    entries: [ctgov-record-history, ctgov-v2-api, isrctn]
    requestedBy: [D3, D11, D13]
    owner: tooling
    build: "trials.observe_versions: poll CT.gov v2 by lastUpdatePostDate and snapshot every change as OBSERVED RegistrationVersions; ISRCTN 'Provided at time of registration / Updated as of / Amended' blocks and Editorial Notes → RECONSTRUCTED versions."
  - id: G2
    title: "Integrity checker (retraction, correction, expression of concern) reconciling Crossref updated-by, PubMed CommentsCorrections and Retraction Watch"
    entries: [crossref-rest, ncbi-eutils-pubmed, openalex, crossref-labs]
    requestedBy: [K, D3, D11, D13]
    owner: tooling
    build: "literature.check_integrity: one HAS_REVISION_STATUS Assertion per authority (K M6) and REVISES episodes when the notice is identified (D3); RW reasons from the CSV; status-only flags (OpenAlex is_retracted) never become REVISES. Blocked on the K/D3 REVISES vs HAS_REVISION_STATUS ruling (D3 open question 33)."
  - id: G3
    title: "Substance identity bridge with form awareness (GSRS authority; salt / moiety / quantity basis)"
    entries: [fda-gsrs, pubchem-pug-rest, nih-dsld, ebi-ols4-chebi, chembl-rest, nlm-rxnav]
    requestedBy: [D1, D11, D5]
    owner: tooling
    blocks: [Q-D1-26]
    build: "substances.resolve: DSLD row + form UNII → GSRS record → ACTIVE MOIETY, never a PubChem name→CID hit alone; RESOLUTION assessments as output; rule table for mw-ratio / nutrient-equivalent / daily-max pinned to a GSRS record version."
  - id: G4
    title: "Capture normalizer and text-projection registry (named, versioned JATS/SPL/HTML/PDF → text rules, UTF-8 + LF, NBSP/hyphen normalization, canonicalProjectionHash)"
    entries: [europepmc-fulltext-jats, dailymed-spl, ctgov-v2-api, html-text-projection, poppler-pdftotext, ncbi-eutils-pubmed, sec-edgar, firecrawl-cli, tavily-cli]
    requestedBy: [K, D2, D3, D4, D6, D7, D8, D10, D11, D13]
    owner: tooling
    build: "One registry of derivation rules (jats-xml2txt/v1, html2txt/v1, edgar-text/v5, h2t-v1, pdftotext -layout -enc UTF-8) with output encoding, newline convention and digest; shared normalization profile nbsp-nnbsp-hyphen/v1 with the verifier; the projection is part of the snapshot (kernel canonicalProjectionHash)."
  - id: G5
    title: "GTIN normalizer and listing resolver (UPC-A/EAN-13 → GTIN-14, check digit, ASIN/retailer id ↔ GTIN ↔ Package)"
    entries: [nih-dsld, openfda-food-enforcement, usda-fdc, brand-pages, shopify-storefront-json, amazon-pages, open-food-facts, gs1-verified]
    requestedBy: [D6, D11, D12]
    owner: tooling
    build: "gtin14-v1 normalizer applied to DSLD upcSku, openFDA free text, FDC gtinUpc, Shopify barcode, OFF barcodes; listing resolver emitting EQUIVALENCE assessments; recall-to-listing matching from free-text lot codes."
  - id: G6
    title: "Keys, quotas and service identity for team runs (data.gov, OpenAlex, Semantic Scholar, NCBI, Crossref polite pool, FDA Data Dashboard, USPTO, Companies House, Keepa)"
    entries: [usda-fdc, openalex, semantic-scholar, regulations-gov-api, ncbi-eutils-pubmed, crossref-rest, fda-data-dashboard, uspto-tsdr, companies-house, keepa-api, cas-common-chemistry]
    requestedBy: [D3, D6, D7, D8, D11, D12]
    owner: owner
    build: "A secret-store-backed service identity per provider (never printed, never in requestUri), quota accounting per run, and the repo .mcp.json servers loaded in agent sessions."
  - id: G7
    title: "Label image and PDF parsers (Supplement Facts / Nutrition Facts OCR, panel images, COA row parser, PDF table reconstruction with page-render cross-check)"
    entries: [brand-pages, nih-dsld, coa-pdf, company-report-pdf, consumer-test-vendor-pages, poppler-pdftoppm, poppler-pdftotext, regulations-gov-attachments]
    requestedBy: [D4, D6, D8, D11, D12]
    owner: tooling
    build: "OCR with BOUNDING_BOX selectors for label and panel images; COA row parser emitting resultBasis per row; PDF table reconstruction cross-checked against pdftoppm renders; page-addressed PDF_TEXT locators."
