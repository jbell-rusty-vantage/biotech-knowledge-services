# Cross-packet merge specification for tooling/action-space.yaml (packet D11, agent A8, 2026-10-08).
#
# Read by _notes/action-space/build-action-space.mjs together with:
#   - every packet's 08-sources-and-tools.md (the 12-column scored tables; K, D1-D13 from their worktrees),
#   - every packet's _notes/tool-log.md (lines matching `match` count as exercise evidence),
#   - every packet's 05-relationship-register.yaml (populatedBy -> questions) and 02-questions.md (value, sources column),
#   - D11's own packet-local registry _notes/action-space/d11-local-registry.yaml (D11's 59 scored entries, gaps G1-G10).
#
# Judgment lives here, mechanics live in the script. Every editorial decision (which local ids are the same tool, which
# readiness wins when packets disagree, which custom tooling clusters a gap) is a line in this file with its reason.
#
# rules: applied in order to every packet-local row id (prefix tool:/src:/job:/agent:/curation: stripped, star removed);
#   first match wins. `when` (optional, case-insensitive regex) must match the row's full text. `packets` restricts a rule.
#   A row id not matched by any rule is a build error (the script refuses to guess).
# entries: canonical entries that are not in the D11-local registry. D11-local ids are canonical by default (they are
#   already the toolId / captureMethod prefix vocabulary of D11's CaptureAttempt and fixtures).
# match: case-insensitive regex per canonical id; used on tool-log lines (exercise evidence) and on the `sources`
#   column of 02-questions.md (which questions need the tool). Canonical ids and alias local ids also match as whole
#   words (case-sensitive) in the sources column.
# overrides: readiness adjudications by D11 where sibling evidence revises a score; each carries its reason.
# gaps: the custom tooling clusters (G1-G10 from the D11-local registry, G11+ from the other packets' "custom tooling"
#   sections). `entries` are canonical ids; `blocks` adds question ids named in a packet's text.

