# Identifier-scheme detection on identifiersEmitted text (case-insensitive regex; codes not listed use the code itself
# as a word, underscores matching space/hyphen/underscore). A hit names a candidate authority route for the scheme in
# the identifier reconciliation; it is a pointer to verify, not a verified bridge.
schemeDetect:
  PMID: '\bPMIDs?\b'
  PMCID: '\bPMCIDs?\b|\bPMC id'
  DOI: '\bDOIs?\b'
  OPENALEX: 'OpenAlex'
  NCT: '\bNCT\b'
  EUCT: '\bEU CT\b|EUCT'
  EUDRACT: 'EudraCT'
  RW_RECORD: 'Retraction Watch'
  UNII: '\bUNII\b'
  CAS_RN: '\bCAS\b'
  PUBCHEM_CID: '\bCID\b'
  CHEBI: 'ChEBI'
  INCHIKEY: 'InChIKey'
  DRUGBANK: 'DrugBank'
  RXCUI: 'RxCUI'
  MESH: '\bMeSH\b'
  UNIPROT: 'UniProt'
  HGNC: '\bHGNC\b'
  NCBI_GENE: 'NCBI Gene|Entrez'
  ENSEMBL_GENE: 'Ensembl'
  REACTOME: 'Reactome|R-HSA'
  GO: '\bGO\b'
  MONDO: '\bMONDO\b'
  HPO: '\bHPO\b|\bHP:|\bHP\b'
  ICD10CM: 'ICD-?10'
  SNOMEDCT: 'SNOMED'
  LOINC: 'LOINC'
  GTIN: 'GTIN|\bUPC\b|\bEAN\b|barcode'
  ASIN: '\bASIN\b'
  SKU: '\bSKU\b'
  DSLD: 'DSLD (label )?id'
  FDC_ID: 'fdcId|\bFDC id'
  NDC: '\bNDC\b'
  FDA_APPLICATION: 'application_number|FDA application|\bNDA\b|\bANDA\b|\bBLA\b'
  NPN: '\bNPN\b'
  PATENT_PUB: 'patent (publication )?number|publication number|patent number'
  LEI: '\bLEI\b'
  SEC_CIK: '\bCIK\b'
  ROR: '\bROR\b'
  ORCID: 'ORCID'
  NPI: '\bNPI\b'
  WIKIDATA: 'Wikidata|\bQID'
  YOUTUBE_VIDEO: 'video id'
  PODCAST_GUID: '\bguid\b'
  PODCAST_INDEX_FEED: 'Podcast Index'
  NIHMS: 'NIHMS'
  NANOPUB: 'nanopub|trusty URI'
  UMLS_CUI: 'UMLS|\bCUI\b'
  CHEMBL: 'ChEMBL'
  CHEMSPIDER: 'ChemSpider'
  NCBI_TAXON: 'taxonomy id|\btaxid|NCBI Taxonomy|TaxId'
  CULTURE_COLLECTION: '\bATCC\b|DSMZ|deposit (number|id)'
  DSLD_INGREDIENT: 'ingredientId'
  LNHPD_INGREDIENT: 'medicinal ingredient'
  SUPPLIER_CODE: 'supplier (material )?code'
  FDC_NUTRIENT: 'nutrient ids?'
  WIKIPATHWAYS: 'WikiPathways|\bWP[0-9]'
  ORPHANET: 'Orphanet|ORPHA'
  OMIM: '\bOMIM\b'
  EFO: '\bEFO\b'
  KEGG_PATHWAY: 'KEGG|map ids'
  LAB_TEST_CODE: 'test code|order code|test number'
  CPT: '\bCPT\b'
  UDI_DI: '\bUDI'
  FDA_510K: '510\(?k\)?|\bK numbers?\b|k_number'
  FDA_PRODUCT_CODE: 'product code'
  RETAILER_ITEM_ID: 'retailer item'
  STOREFRONT_PRODUCT_ID: 'Shopify product|storefront product|product id'
  STOREFRONT_VARIANT_ID: 'variant id'
  MARKETPLACE_SELLER_ID: 'seller id'
  WEB_DOMAIN: 'web domain|registrable domain'
  COMPANY_NUMBER: 'company number|registration authority id|entity id'
  UEI: '\bUEI\b'
  CROSSREF_FUNDER: 'funder DOI|Funder Registry|funder id'
  AWARD_NUMBER: 'award (number|id)|grant ids?'
  NIH_PROJECT: 'project number|core project|appl_id|grant ids'
  NIH_PROFILE_ID: 'profile[ _]id'
  TICKER: 'ticker'
  SEC_ACCESSION: 'accession'
  FDA_NDI: '\bNDI'
  FDA_GRN: '\bGRN\b|GRAS notice'
  FDA_WARNING_LETTER: 'MARCS|warning letter'
  FDA_RECALL: 'recall_number|recall number'
  FDA_RECALL_EVENT: 'event_id|recall event'
  FDA_DOCKET: 'docket'
  FDA_FEI: '\bFEI\b'
  CELEX: 'CELEX'
  LNHPD_ID: 'lnhpd_id|licence id|LNHPD (product )?id'
  COURT_DOCKET: 'court docket|docket number|case number'
  PTAB_TRIAL: 'PTAB|\bIPR\b'
