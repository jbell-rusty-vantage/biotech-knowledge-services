  SPL_SET_ID: 'set[ _-]?id'
  EIN: '\bEIN\b'
  ORG_STUDY_ID: 'org(anization)? study id|orgStudyId'
  NCIT: '\bNCIt\b'
  NDB_NUMBER: '\bNDB\b'
  FNDDS_FOOD_CODE: 'FNDDS'
  FOODEX2: 'FoodEx ?2'
  FOODON: 'FoodOn'
  LANGUAL: 'LanguaL'
  WWEIA_CATEGORY: 'WWEIA'
  PHENOL_EXPLORER_FOOD: 'Phenol-?Explorer'

# Detection hits rejected on reading the packet rows (the word matched, the scheme is not what the tool emits).
schemeExclude:
  uniprot-rest: [SEC_ACCESSION]
  europepmc-fulltext-jats: [SEC_ACCESSION]
  iherb-pages: [FDA_PRODUCT_CODE, STOREFRONT_PRODUCT_ID]
  cafc-opinions: [FDA_DOCKET]
  fda-web-pages: [COURT_DOCKET]
  chembl-rest: [SPL_SET_ID]
  cms-open-payments: [NIH_PROFILE_ID]
  community-forums: [SUBSTACK_POST]
  reddit: [SUBSTACK_POST]

# Schemes an entry emits that its free-text identifiersEmitted names in another way (read from the packet rows).
schemeInclude:
  google-patents: [PATENT_APPLICATION]   # D8 row: "application number" next to the publication number
  iherb-pages: [RETAILER_ITEM_ID]        # D6 row: iHerb product code / item number
  retailer-partner-apis: [RETAILER_ITEM_ID]
