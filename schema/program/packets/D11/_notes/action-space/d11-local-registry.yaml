# MCP adopt / wrap / replace recommendation (first pass)
mcpRecommendation:
  adopt_for_discovery_only: [mcp-pubmed, mcp-clinicaltrials, mcp-biorxiv, firecrawl-research-index, exa-mcp]
  adopt_as_is: [icd10cm-pcs, nppes-npi]
  wrap_with_capture_adapter: [ncbi-eutils-pubmed, europepmc-fulltext-jats, crossref-rest, ctgov-v2-api, dailymed-spl, fda-gsrs, pubchem-pug-rest, nih-dsld, sec-edgar]
  build: ["ctgov-record-history (self-observed)", integrity-checker, gtin-normalizer, supplement-facts-parser, unit-normalizer]
  rationale: "Connector outputs are normalized renditions without bytes, hashes or stable locators (observed: PubMed MCP drops CommentsCorrections, CT MCP drops submission dates, research index drops retraction status). They are fine for finding things and wrong for capturing evidence."
