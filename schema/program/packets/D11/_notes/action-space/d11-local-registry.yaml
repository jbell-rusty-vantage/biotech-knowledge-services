# D11-LOCAL REGISTRY (input to build-action-space.mjs). Until the cross-packet pass (2026-10-08) this file was
# tooling/action-space.yaml; it now holds only D11's own scored entries, gaps G1-G10 and the MCP recommendation.
# The merged cross-packet registry is tooling/action-space.yaml, generated from this file, merge-spec.yaml and every
# packet's 08 / tool-log / 05 / 02. Edit D11's own scores here, then re-run the generator.
#
# BellLabs bio-medical tooling action space — registry (PLAN 6.3 schema)
# Packet D11, agent A8, first-tier scoring 2026-10-08 (Wave 1 research stage).
#
# Fields per entry (PLAN 6.3): id, domains, kind, provider, access, auth, rateLimits,
#   identifiersEmitted, locatorKinds, readiness (0-3), gap, priority, owner.
# Added fields (this registry): tier (1 = exercised by D11 itself; 2 = scored from a sibling
#   packet's tool log, cross-packet pass pending), exercised (date · route · result), evidence
#   (scratch capture name or packet tool-log row), notes.
#
# readiness: 0 blocked or licensed-out · 1 scrape only · 2 API without stable locators ·
#            3 agent-ready (API, stable identifiers, re-selectable locators)
# priority:  P0 blocks an essential (value-1) question now · P1 foundational · P2 expansion · P3 nice to have
# locatorKinds use the published kernel SelectorKind vocabulary (verification.v1 selector kinds, A1 2026-10-08):
#   TEXT_QUOTE, CHARACTER_POSITION, MULTI_FRAGMENT_TEXT, JSON_POINTER, HTML, PDF_TEXT, BOUNDING_BOX, TABLE,
#   MEDIA_TIMECODE, REPOSITORY, DATASET, API_RECORD, WHOLE_SNAPSHOT. The full selector is stored as canonical JSON
#   (SourceLocator.selectorJson). Model-stage mapping of the research-stage spellings: SECTION (JSON pointer) →
#   JSON_POINTER; SECTION (HTML id / XML element / JATS sec@id / SPL section@ID) → HTML (DOM selector on the markup;
#   verification.v1 has no separate XML kind, see 11-open-questions); PDF_PAGE → PDF_TEXT; IMAGE_REGION →
#   BOUNDING_BOX; TEXT_POSITION → CHARACTER_POSITION; SECTION (field name / GraphQL path) → API_RECORD.
# Capture failures observed for a tool are recorded in the graph as D11 CaptureAttempt nodes (toolId = entry id;
#   outcome, failureKind); successful captures carry SourceSnapshot.captureMethod = "<entry id>/<tool version>".
# owner: who builds the gap — "tooling" = the BellLabs tooling backlog fed by D11; a domain id = the
#   packet that needs it most.
# All facts below were observed on 2026-10-08 unless an evidence row says otherwise.

