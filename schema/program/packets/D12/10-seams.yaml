version: 1
module: D12
# Model stage (A2, 2026-10-08); check stage and adversarial-review pass the same day. Every reference from D12 SDL to a
# type outside the module (other than the kernel allowlist) is listed with owner: this; edges other modules declare INTO
# D12 types are listed with owner: other so the synthesizer can check both sides; predicate-level seams name subject and
# object separately (one row per predicate direction). D10's ASSOCIATES -> D12.FoodItem (D10 10-seams) is NOT accepted
# here: no D12 pattern reads a materialized Association and Q-D12-20 similarity is streamed, never stored (OQ-D12-29). Sibling names re-verified in the adversarial-review pass against
# the SDLs in worktrees A1 (K b2c2b1b0…, D10), A2 (D1), A4 (D3), A5 (D5 vocab-targets 0.2.1), A6 (D6), A7 (D8), A8 (D9).
seams:
  # ---- declared in D12 (owner: this) ----
  - { type: FOOD_CONTAINS, from: D12.FoodItem, to: D1.ChemicalSubstance, questions: [Q-D12-01, Q-D12-02, Q-D12-20, Q-D12-21, Q-D12-24], direction: OUT, owner: this, via: "union FoodComponentTarget; edge properties D12 FoodContentProperties" }
  - { type: FOOD_CONTAINS, from: D12.FoodItem, to: D1.Constituent, questions: [Q-D12-01, Q-D12-21, Q-D12-24], direction: OUT, owner: this, via: "union FoodComponentTarget; edge properties D12 FoodContentProperties" }
  - { type: HAS_REFERENCE_FOOD, from: D6.Product, to: D12.FoodItem, questions: [Q-D12-04, Q-D12-05, Q-D12-30, Q-D12-34, Q-D12-03], direction: IN, owner: this, note: "stored Product -> FoodItem; field FoodItem.referencedByProducts (direction IN) so the D6 hub gets no field" }
  - { type: IN_FOOD_CATEGORY, from: D6.Product, to: D12.FoodCategory, questions: [Q-D12-14, Q-D12-31, Q-D12-08], direction: IN, owner: this, note: "stored Product -> FoodCategory; field FoodCategory.memberProducts (direction IN). A D8 Lot reaches a category through LOT_OF -> Product (no Lot pair)" }
  - { type: PATTERN_COMPONENT, from: D12.DietaryPattern, to: D1.Constituent, questions: [Q-D12-11, Q-D12-08], direction: OUT, owner: this, via: "union PatternComponentTarget" }
  # ---- expected from other modules INTO D12 types (owner: other; listed so both sides are checked) ----
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D12.DietaryPattern, questions: [Q-D12-12, Q-D12-13, Q-D12-25], direction: OUT, owner: other, note: "declared by D3 (union AdministeredMaterial = IngredientMaterial | ProductVariant | Device | Intervention | FoodItem | DietaryPattern); path Study -HAS_ARM-> StudyArm -HAS_COMPONENT-> InterventionComponent -ADMINISTERS->; the union also holds D5 Intervention, so a diet can be minted twice until OQ-D12-03 is decided" }
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D12.FoodItem, questions: [Q-D12-12, Q-D12-09], direction: OUT, owner: other, note: "declared by D3" }
  - { type: DECLARES_COMPONENT, from: D6.LabelVersion, to: D12.FoodItem, questions: [Q-D12-07, Q-D12-05, Q-D12-18, Q-D12-30, Q-D12-31], direction: OUT, owner: other, note: "D6 union DeclaredComponentTarget = IngredientMaterial | Constituent | FoodItem; ComponentLineProperties carries amount, unitCode, amountBasis, lineRole — D12 reads a product's declared composition from this line (no CLAIMS_CONTENT / DECLARES_NUTRIENT predicate)" }
  - { type: STEP_USES, from: D5.ProtocolStep, to: D12.FoodItem, questions: [Q-D12-11], direction: OUT, owner: other, note: "declared by D5 (union StepMeans). DietaryPattern is NOT a StepMeans member (OQ-D12-03 / OQ-D5-06)" }
  - { type: ASSESSES, from: D10.ReportItem, to: D12.FoodItem, questions: [Q-D12-19], direction: OUT, owner: other, note: "D10 ReportItem.about (kernel ASSESSES -> Subjectable) for a published comparison row (Report COMPARISON); D10 10-seams lists D12.FoodItem; added in the adversarial review" }
  - { type: MENTIONS, from: D9.Chunk, to: K.Subjectable (FoodItem, FoodCategory, DietaryPattern), questions: [Q-D12-26, Q-D12-34], direction: OUT, owner: other, note: "kernel MENTIONS, derived, declared once by D9 against Subjectable; costs D12 nothing. The kernel has no Mention node since its adversarial review: a resolved surface form is a SourceLocator + a RESOLUTION Assessment" }
  - { type: ASSESSES, from: K.Assessment, to: K.Subjectable (FoodItem, FoodCategory, DietaryPattern), questions: [Q-D12-08, Q-D12-09, Q-D12-13, Q-D12-18, Q-D12-23, Q-D12-26, Q-D12-29, Q-D12-33, Q-D12-34], direction: OUT, owner: other, note: "kernel Assessment (not on the packet-check allowlist): EVIDENCE_SYNTHESIS / SAFETY_SIGNAL / VETTING / EQUIVALENCE / RESOLUTION with effectDirection; D12 subkinds and conclusionCode vocabularies in 09-reasoning.md (D12.claim-threshold-comparison, D12.food-equivalence)" }
  - { type: ASSESSES, from: K.Report, to: K.Subjectable (FoodItem, DietaryPattern), questions: [Q-D12-19, Q-D12-09], direction: OUT, owner: other, note: "kernel Report (COMPARISON for published rankings; EVIDENCE_REPORT for evidence missions on food claims)" }
  - { type: OCCURRENCE_OF, from: K.Assertion, to: K.Claim, questions: [Q-D12-09, Q-D12-10, Q-D12-22, Q-D12-29, Q-D12-33], direction: OUT, owner: other, note: "food claims and recommendations are kernel claim occurrences (speechAct RECOMMENDS) whose subject is a D12 node or a D6 Product" }
  - { type: HAS_IDENTIFIER, from: K.Identifier, to: K.Subjectable (FoodItem, FoodCategory, DietaryPattern), questions: [Q-D12-34, Q-D12-05], direction: IN, owner: other, note: "kernel IdentifierLinkProperties; schemes in 06-node-register.yaml" }
  - { type: QUALITY_RESULT_FOR, from: D8.QualityResult, to: "D6.Product | D8.Lot", questions: [Q-D12-03, Q-D12-06], direction: OUT, owner: other, note: "D8 renamed RESULT_FOR to QUALITY_RESULT_FOR in its adversarial review (D3 owns RESULT_FOR; corrected in the pattern-lint close-out 2026-10-09); measured contaminant levels in sold food (FDA acrylamide 428 ppb; WanaBana lead 2.18 ppm) are D8 results on the product/lot (MEASURES_ANALYTE to the D1 substance); D12 reaches them through HAS_REFERENCE_FOOD" }
  - { type: CONCERNS, from: D8.RegulatoryRecord, to: "D6.Product | D8.Lot", questions: [Q-D12-07, Q-D12-28, Q-D12-32], direction: OUT, owner: other, note: "recalls, warning letters, import alerts (recordFamily ENFORCEMENT, recordKind RECALL); a Lot reaches its Product through D8 LOT_OF" }
  # ---- predicate-level seams (no typed edge; Assertion subject/object only; one row per direction) ----
  - { type: "Assertion.predicate WORSENS_TARGET|IMPROVES_TARGET|NO_EFFECT_ON_TARGET|MIXED_EFFECT_ON_TARGET|INTENDED_FOR_TARGET", from: "D12.FoodItem | D12.FoodCategory | D12.DietaryPattern", to: D5.Target, questions: [Q-D12-08, Q-D12-09, Q-D12-13, Q-D12-23, Q-D12-26], direction: OUT, owner: other, note: "D5 seam rule; D5 10-seams lists D12.FoodItem and D12.DietaryPattern as subjects but not D12.FoodCategory (IARC 'processed meat', NOVA 4 statements are about groups) — request OQ-D12-28 (owner D5)" }
  - { type: "Assertion.predicate INTERACTS_WITH", from: "D1.ChemicalSubstance | D1.IngredientMaterial | D6.Product | D5.Intervention", to: D12.FoodItem, questions: [Q-D12-16], direction: OUT, owner: other, note: "D5 predicate; FoodItem is an object (grapefruit juice with CYP3A4 substrates); D5 UseConstraint rolls the Assertions up via derived RESOLVES_TO_CONSTRAINT" }
  - { type: "Assertion.predicate USE_CONSTRAINED_IN", from: D12.FoodItem, to: D2.Condition, questions: [Q-D12-16], direction: OUT, owner: other, note: "D5 predicate; FoodItem is the SUBJECT (D5 10-seams: subjects [..., D12.FoodItem, ...], object D2.Condition); split from the INTERACTS_WITH row in the adversarial review" }
  - { type: "Assertion.predicate CAUSES_ADVERSE_EFFECT", from: D1.ChemicalSubstance, to: D2.Condition, questions: [Q-D12-03, Q-D12-06], direction: OUT, owner: other, note: "D5 predicate (acrylamide fixture acr-05: FDA hazard statement, species:LABORATORY_ANIMALS, doseContext:ABOVE_DIETARY_EXPOSURE)" }
  - { type: "Assertion.predicate FORMS_DURING_PREPARATION", from: D1.ChemicalSubstance, to: "D12.FoodItem | D12.FoodCategory", questions: [Q-D12-03], direction: OUT, owner: this, note: "predicate-only" }
  - { type: "Assertion.predicate PREPARATION_CHANGES_CONTENT", from: D12.FoodItem, to: "D1.ChemicalSubstance | D1.Constituent", questions: [Q-D12-02], direction: OUT, owner: this, note: "predicate-only" }
  - { type: "Assertion.predicate FOOD_FROM_TAXON", from: D12.FoodItem, to: D1.Taxon, questions: [Q-D12-34], direction: OUT, owner: this, note: "predicate-only; renamed from DERIVED_FROM_TAXON (a D1 typed edge name) in the adversarial review — D1's seam row naming D12's DERIVED_FROM_TAXON predicate needs the rename (OQ-D12-30)" }
  - { type: "Assertion.predicate USED_FOOD_CLASSIFICATION | USED_COMPOSITION_DATABASE", from: D3.Study, to: "literal (valueString)", questions: [Q-D12-25], direction: OUT, owner: this, note: "predicate-only, registered by D12 until D3 takes them (OQ-D12-27)" }
  - { type: "Assertion.predicate HAS_REVISION_STATUS", from: K.Source, to: "literal (valueString SourceRevisionKind)", questions: [Q-D12-09, Q-D12-10], direction: OUT, owner: other, note: "kernel predicate convention, one Assertion per authority (PubMed/NLM, publisher NEJM) + SourceSnapshot.revisionKind cache; PREDIMED fixture pred-05/05b/06" }
sharedVocabularies:
  - { name: targets, ref: "packets/D5/vocab-targets.yaml@0.2.1", owner: D5, use: "objects of target-effect Assertions about foods, categories and patterns; population qualifier grammar `population:<PopulationGroup code | D3 StudyPopulation uid>` (0.2.0+); keys used: target:cardiometabolic-health, target:body-composition, target:longevity, target:glycemic-control, target:gut-health, target:sleep, target:mood" }
  - { name: frontiers, ref: "packets/D13/vocab-frontiers.yaml", owner: D13, use: "not consumed (no D12 question attaches a food to a frontier; foods reach frontiers only through D3 studies/D13 events)" }
  - { name: identifier-schemes, ref: "packets/K/identifier-schemes.yaml", owner: K, use: "FDC_ID, GTIN (via D6 Product), WIKIDATA, PMID, DOI; requested NDB_NUMBER, FNDDS_FOOD_CODE, FOODON, PHENOL_EXPLORER_FOOD, WWEIA_CATEGORY, FOODEX2, LANGUAL" }
  - { name: kernel-types, ref: "packets/K/04-schema-proposal.graphql", owner: K, use: "kernel types D12 references outside packet-check's allowlist (K rule 9): edge-property type AssertedRecordedProperties (PATTERN_COMPONENT; base of FoodContentProperties); enums PrivacyClass (Entity field on all 3 node types), EffectDirection and AssessmentKind (read through kernel Assessment records), SourceRevisionKind (HAS_REVISION_STATUS valueString); read-side only: Assessment, Report, Claim (ASSESSES, OCCURRENCE_OF), IdentifierLinkProperties (HAS_IDENTIFIER)" }
  - { name: ContentStatementKind, ref: "packets/D1/04-schema-proposal.graphql", owner: D1, use: "FoodContentProperties.statementKind (MEASURED_IN_SAMPLE, CALCULATED, TYPICAL_COMPOSITION_REPORTED, QUALITATIVE_PROVIDES); same tail as D1 ContentEdgeProperties" }
  - { name: AmountBasis, ref: "packets/D6/04-schema-proposal.graphql", owner: D6, use: "FoodContentProperties.amountBasis (PER_100G, PER_100ML, PER_SERVING) so reference composition and label declarations (ComponentLineProperties.amountBasis) share one basis vocabulary" }
