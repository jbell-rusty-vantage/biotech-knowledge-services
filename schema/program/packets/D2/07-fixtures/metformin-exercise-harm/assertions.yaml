  - { type: EXPOSED_TO, from: ctx-pla, to: aet, properties: { exposureRole: TESTED, orderIndex: 0 }, evidence: [L-m-06] }
  # Two arms per context: the paper pooled the carbohydrate and protein feeding arms (L-m-05). The register says
  # IN_STUDY_ARM is zero_or_one; the fixture needs zero_or_more (11-open-questions item 22).
  - { type: IN_STUDY_ARM, from: ctx-met, to: arm-met-cho, evidence: [L-m-05, L-m-12] }
