# Assertions for fixture metformin-exercise-harm (packet D2, fixtures stage, A3, 2026-10-08).
# Same conventions as ../nr-muscle-unstructured/assertions.yaml. Harm is never a property here: the harm reading is a
# kernel Assessment (effectDirection HARM on a D5 Target) that cites A-m-01 through DERIVED_FROM (seamRecords below).
# Deviation from the model-stage stub, with reason: the placebo-group context gets aerobic exercise training (AET) as its
# TESTED exposure (the SDL rule is "exactly one TESTED unless geneticManipulation is set"); in the metformin-group
# context AET is BACKGROUND and metformin is TESTED.
# Adversarial review (2026-10-08): (1) A-m-02 is scoped to the SUIT1 protocol (CIP, CI+FAOP: non-significant trend) and a
# new A-m-05 records the significant AET-induced increase in CI-linked respiration in the ADP-titration protocol, so AET →
# mitochondrial respiration projects MIXED; (2) sampleSize is the respiration-analysis n (Fig 2 legend: PLA 24, MET 26),
# the randomized n (26 / 27) stays in groupLabel; (3) both contexts are registered groups (IN_STUDY_ARM), so their dose of
# record is D3's InterventionComponent (seamRecords) and the context exposure fields are empty; (4) the metformin →
# complex I projection is gone (MolecularEntity pair cut): A-m-03 / A-m-04 answer Q-D2-08 directly.
fixture: metformin-exercise-harm
idNote: fixture-scoped ids (hu:<token>:fx-d2-...); mission/run ids are fixture ids, not Mission Control ids
producedBy: { missionId: "mission:ft-D2-fixtures", runId: "run:ft-D2-metformin-exercise-harm" }

