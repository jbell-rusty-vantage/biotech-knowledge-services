      identifiers: [ { scheme: CHEMBL, value: CHEMBL1431, note: "parent molecule; the ChEMBL mechanism record sits on the salt CHEMBL1703 (L-m-11); D1 rolls the salt up to the parent" } ] }
  - { ref: aet, type: D5.Intervention, uid: "hu:intervention:fx-d2-aerobic-exercise-training-12w", name: "aerobic exercise training (supervised, 12 weeks, 3 sessions/week)",
      note: "D5 owns Intervention (11-open-questions item 8); member of ContextExposure and MechanismModulator" }
  - { ref: m-mito-respiration, type: D2.Mechanism, uid: "hu:mechanism:fx-d2-mitochondrial-respiration", name: mitochondrial respiration, note: "declared in ../reactome-chembl-reference (BELLLABS_CURATED)" }
  - { ref: me-complex-i, type: D2.MolecularEntity, uid: "hu:molecular-entity:fx-d2-mitochondrial-complex-i", name: "Mitochondrial complex I (NADH dehydrogenase)",
      properties: { entityKind: PROTEIN_COMPLEX, organism: HUMAN, ncbiTaxonId: "9606" },
      identifiers: [ { scheme: CHEMBL, value: CHEMBL2363065, evidence: L-m-10, note: "ChEMBL target id; kernel identifier-schemes v2 folds CHEMBL_TARGET into CHEMBL (check stage)" } ] }
  - { ref: arm-met-cho, type: D3.StudyArm, uid: "hu:study-arm:fx-d2-nct02552355-metformin-carbohydrate", name: "NCT02552355 arm 'Metformin/Carbohydrate'", identifiers: [ { scheme: NCT, value: NCT02552355, evidence: L-m-12 } ] }
  - { ref: arm-met-pro, type: D3.StudyArm, uid: "hu:study-arm:fx-d2-nct02552355-metformin-protein", name: "NCT02552355 arm 'Metformin/Protein'", identifiers: [ { scheme: NCT, value: NCT02552355, evidence: L-m-13 } ] }
  - { ref: arm-pla-cho, type: D3.StudyArm, uid: "hu:study-arm:fx-d2-nct02552355-placebo-carbohydrate", name: "NCT02552355 arm 'Placebo/Carbohydrate'", identifiers: [ { scheme: NCT, value: NCT02552355, evidence: L-m-14 } ] }
  - { ref: arm-pla-pro, type: D3.StudyArm, uid: "hu:study-arm:fx-d2-nct02552355-placebo-protein", name: "NCT02552355 arm 'Placebo/Protein'", identifiers: [ { scheme: NCT, value: NCT02552355, evidence: L-m-15 } ],
      note: "registry description of this placebo arm says 'Daily oral administration of Metformin ...' (L-m-16): a registry inconsistency for D3" }
  - { ref: asserter-konopka2019, type: D7.Person, uid: "hu:person:fx-d2-konopka-ar", name: "Adam R. Konopka (first author, for the author group of PMID 30548390)" }
