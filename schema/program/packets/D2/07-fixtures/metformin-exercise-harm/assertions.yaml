# Records owned by other modules that complete the harm path (shape only; their owners decide final names).
seamRecords:
  - id: AS-m-01
    owner: "K Assessment, kind/subkind owned by D5 (D5.interaction-risk)"
    type: K.Assessment
    uid: "hu:assessment:fx-d2-metformin-blunts-aet"
    properties: { assessmentKind: SAFETY_SIGNAL, assessmentSubkind: "D5.interaction-risk", effectDirection: HARM, methodVersion: "fixture-illustration/v0" }
    about: { ref: t-endurance, type: D5.Target }       # ASSESSES
    derivedFrom: [A-m-01, A-m-02, A-m-05]               # DERIVED_FROM
    rationale: "Metformin taken during aerobic training abolished the training-induced increase in CI-linked muscle mitochondrial respiration that placebo showed in the ADP-titration protocol (significant vs pre) and reduced the change in CI+II&FAOP (between-group p < 0.05); in the SUIT1 protocol the within-placebo increase was only a trend (p = 0.07). Older adults; respiration n 24 placebo, 26 metformin."
    producedBy: { missionId: "mission:ft-D2-fixtures", runId: "run:ft-D2-metformin-exercise-harm" }
  # D3 dose of record for the registered metformin groups (adversarial review: D2 contexts no longer duplicate D3's dose
  # model). Shape only; D3 builds these from its own stating records (registry version or this publication).
  - id: IC-m-01
    owner: D3
    type: D3.InterventionComponent
    arm: arm-met-cho                                     # StudyArm -HAS_COMPONENT-> InterventionComponent
    administers: metformin                               # -ADMINISTERS-> (D1 roll-up from the administered material)
    properties: { componentRole: ACTIVE, materialTextVerbatim: "metformin", quantity: 2000, unitCode: "mg", quantityBasis: PER_DAY, route: ORAL, durationIso: P12W,
                  verbatimDoseText: "500 mg/day the first week and increased by 500 mg each week until reaching 2000 mg/day (1,000 mg twice daily) by week 4" }
    evidence: [L-m-03, L-m-12]
  - id: IC-m-02
    owner: D3
    type: D3.InterventionComponent
    arm: arm-met-pro
    administers: metformin
    properties: { componentRole: ACTIVE, materialTextVerbatim: "metformin", quantity: 2000, unitCode: "mg", quantityBasis: PER_DAY, route: ORAL, durationIso: P12W,
                  verbatimDoseText: "500 mg/day the first week and increased by 500 mg each week until reaching 2000 mg/day (1,000 mg twice daily) by week 4" }
    evidence: [L-m-03, L-m-13]

