sharedVocabularies:
  - vocabulary: targets
    owner: D5
    file: C:\Users\Pinda\Proyectos\Biotech\biotech-knowledge-services-A5\schema\program\packets\D5\vocab-targets.yaml
    use: >-
      Q-D8-18 reads products for target T through the D5 Assertion predicate INTENDED_FOR_TARGET (subject product, object
      Target hu:target:<slug>). Certifier category labels ("Sleep Aid", "Build Muscle") stay verbatim on
      CertificationListing.categoryLabelsVerbatim and reach a Target only through that same Assertion pattern. D8 declares no
      edge to Target (D5 seam rule).
  - vocabulary: frontiers
    owner: D13
    file: C:\Users\Pinda\Proyectos\Biotech\biotech-knowledge-services-A7\schema\program\packets\D13\vocab-frontiers.yaml
    use: >-
      Not consumed directly. D13's seam rule lets only Events and Studies attach to a Frontier; D8 records reach a frontier
      only through a D13 Event documented by them (approval, recall, adjudication).
  - vocabulary: identifier-schemes
    owner: K
    file: C:\Users\Pinda\Proyectos\Biotech\biotech-knowledge-services-A1\schema\program\packets\K\identifier-schemes.yaml
    use: >-
      Uses FDA_APPLICATION, NPN, PATENT_PUB, UNII, DSLD, NDC. Requests FDA_NDI, FDA_GRN, FDA_WARNING_LETTER, FDA_RECALL,
      FDA_RECALL_EVENT, FDA_DOCKET, FDA_FEI, CELEX, LNHPD_ID, COURT_DOCKET, PTAB_TRIAL, PATENT_APPLICATION, CERT_LISTING,
      LAB_REPORT, LOT_CODE (11-open-questions OQ-D8-08).
  - vocabulary: assessment-subkinds
    owner: K (registry), D8 (values)
    use: D8.coa-classification, D8.spec-conformance, D8.conditions-of-use, D8.licence-coverage, D8.gmp-signal, D8.regulatory-characterization
  - vocabulary: kernel-types
    owner: K
    file: C:\Users\Pinda\Proyectos\Biotech\biotech-knowledge-services-A1\schema\program\packets\K\04-schema-proposal.graphql
    use: >-
      Kernel types outside packet-check's allowlist that the D8 SDL uses as property types (K change 9): edge-property type
      AssertedRecordedProperties (ISSUED_BY, ADDRESSED_TO, CONCERNS, STATUS_FROM, LOT_OF, QUALITY_RESULT_FOR, MEASURES_ANALYTE) and
      enum PrivacyClass (the 7 Entity fields on all six D8 node types).
  - vocabulary: regulatory-pathways
    owner: D8
    file: C:\Users\Pinda\Proyectos\Biotech\biotech-knowledge-services-A7\schema\program\packets\D8\04-schema-proposal.graphql
    use: >-
      Published by D8 for the assembled schema (adversarial-review revision): enum RegulatoryPathway carries regulatory
      programmes, approval routes (US_DRUG_NDA, US_BLA, US_ACCELERATED_APPROVAL, US_EUA, US_DEVICE_510K, US_DEVICE_DE_NOVO,
      US_DEVICE_PMA, EU_CONDITIONAL_MA ...) and designation programmes (US_BREAKTHROUGH_THERAPY, US_FAST_TRACK, US_RMAT,
      US_ORPHAN_DESIGNATION, US_PRIORITY_REVIEW, US_PRIORITY_REVIEW_VOUCHER, EU_PRIME, EU_ORPHAN_DESIGNATION, JP_SAKIGAKE);
      LegalStatusKind and RegulatoryRecordKind say what a record or standing is. Consumers: D13 (drops ApprovalPathway and
      DesignationType and reads these values as Event qualifiers, OQ-D8-02), D4 (device clearance as of D, Q-D4-10).
