# nothing for them. Seam target names follow the sibling research notes as of 2026-10-08 (no sibling SDL existed yet):
# D1 ChemicalSubstance / IngredientMaterial / Constituent (A2 _notes/research-notes.md §2), D6 Product / ProductVariant
# (A6 D6 notes §2), D7 Organization (A6 D7 notes §3). A rename by the owner changes only the name here and in the unions.
# Check stage (2026-10-08): names re-confirmed against the sibling SDLs on disk (A2 D1, A6 D6, A6 D7); kernel property types
# moved from a pseudo-seam to sharedVocabularies kernel-types (K change 9).
# Adversarial-review revision (2026-10-08): RESULT_FOR -> QUALITY_RESULT_FOR (D3 owns RESULT_FOR); D4.Device added to CONCERNS
# and STATUS_OF (Q-D8-23, D4 Q-D4-08/-09/-10; D4 changes its two `status: requested` rows to declared); the COVERS ->
# D7.Organization row is removed (Organization left CertificationCoverageTarget; D7 drops its row); DOCUMENTED_BY_RECORD now
# matches D13's current declaration (typed, on Event). Read-only Cypher joins in 03 that D8 does not declare (no seam needed): D9 Chunk
# CHUNK_OF / COVERS_LOCATOR / MENTIONS (Q-D8-03), D6 HAS_VARIANT / HAS_PACKAGE / HAS_LABEL_VERSION / DECLARES_COMPONENT and D1
# REALIZES_SUBSTANCE (Q-D8-18).
