reobservation_protocol:
  purpose: 'Q-D8-08 harm variant: a lot drops off a certifier page between two observations'
  how: re-capture snap-nsfsport and snap-is (Firecrawl change tracking or scheduled capture); for each open COVERS episode whose lot is absent in the new snapshot,
    edge.close the open episode (recordedTo) and write a successor episode with validTo = the last observation date that showed it (validToBasis OBSERVATION_ONLY);
    never delete
  observed_today: 'two captures on 2026-10-08 (research: NSF 20:55 UTC, Informed Sport 21:01 UTC; fixtures: 21:38 UTC) list the same 24 Informed Sport batch rows
    and the same three NSF lots: no drop-off yet'
  note: Informed Sport removes a batch row at batch expiry by rule (loc-is-rule), so absence after expiry is NOT evidence of failure; absence before expiry is the
    signal worth an Assessment
