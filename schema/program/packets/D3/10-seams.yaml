version: 1
module: D3
# Model stage, A4, 2026-10-08. Every reference from a D3 type to a type outside the module (except packet-check's
# kernel allowlist), and every edge another module declares into a D3 type. Target names checked against the sibling
# SDLs in worktrees A2 (D1, D12), A3 (D2, D4), A5 (D5), A6 (D6, D7), A7 (D8, D13), A8 (D9) on 2026-10-08.
# owner: this = D3 declares the field (on a D3 type); other = the named module declares it.
# Adversarial-review stage (2026-10-08): re-checked against the sibling SDLs as they stand now (D5 TargetMeasure includes
# D2 Outcome; D5 vocab-targets 0.2.x withdrew APPLIES_TO_POPULATION; D1 owns MassBasis).
seams:
  # ---- declared by D3 ----
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D1.IngredientMaterial, questions: [CQ-ST-01, CQ-ST-02, CQ-EV-04, Q-D3-06], direction: OUT, owner: this, note: "D1 10-seams now lists ADMINISTERS from D3.InterventionComponent (union AdministeredMaterial, no ChemicalSubstance; substance-only statements resolve to an UNRESOLVED_MATERIAL IngredientMaterial, D1 rule) but names its edge-property type AssertedEdgeProperties; D3 uses the kernel's AssertedRecordedProperties (recorded-only) — D1 to correct its note (11-open-questions #26)" }
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D6.ProductVariant, questions: [CQ-ST-02, CQ-EV-04], direction: OUT, owner: this, note: "commercial product used as study material (ASPREE 100 mg enteric-coated aspirin); D6 10-seams lists it" }
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D4.Device, questions: [CQ-ST-01, Q-D3-04], direction: OUT, owner: this, note: "device arms" }
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D5.Intervention, questions: [CQ-ST-01, Q-D3-04, Q-D3-05], direction: OUT, owner: this, note: "lifestyle arms and named regimens; D5 10-seams lists it (Q-D5-25); replaces pinned FOLLOWS_INTERVENTION_DEFINITION" }
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D12.FoodItem, questions: [CQ-ST-01, Q-D3-04], direction: OUT, owner: this, note: "whole-food arms; D12 10-seams lists it" }
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D12.DietaryPattern, questions: [CQ-ST-01, Q-D3-04, Q-D3-05], direction: OUT, owner: this, note: "requested by D12 (Q-D12-12, Q-D12-13, Q-D12-25); took the union slot of D8 Lot" }
  - { type: MEASURES, from: D3.OutcomeDefinition, to: D4.Metric, questions: [Q-D3-04, CQ-ST-03], direction: OUT, owner: this, note: "clocks resolve through Metric (ALGORITHM_OUTPUT) → D4 AlgorithmVersion" }
  - { type: MEASURES, from: D3.OutcomeDefinition, to: D4.Biomarker, questions: [Q-D3-04, CQ-ST-03], direction: OUT, owner: this, note: "D4 10-seams lists it" }
  - { type: MEASURES, from: D3.OutcomeDefinition, to: D2.Outcome, questions: [Q-D3-04, Q-D3-05], direction: OUT, owner: this, note: "D2 10-seams lists it: D2 Outcome is the study-independent endpoint concept (all-cause mortality, lifespan, VO2max)" }
  - { type: MEASURES, from: D3.OutcomeDefinition, to: D2.Condition, questions: [Q-D3-05, CQ-ST-06], direction: OUT, owner: this, note: "incident disease and adverse-event terms (D5 maps adverse effects to D2 Condition; no AdverseEffect type exists)" }
  - { type: HAS_STUDY_ROLE, from: D3.Study, to: D7.Organization, questions: [Q-D3-08, Q-D3-09, Q-D3-02, Q-D3-10], direction: OUT, owner: this, note: "D7 10-seams lists it with roles; D7 declares no inverse (Organization hub split)" }
  - { type: HAS_STUDY_ROLE, from: D3.Study, to: D7.Person, questions: [Q-D3-08, Q-D3-09], direction: OUT, owner: this, note: "sponsor-investigator (NCT04313634 lead sponsor is a person), PRINCIPAL_INVESTIGATOR, RESPONSIBLE_PARTY" }
  - { type: HAS_STUDY_ROLE, from: D3.Study, to: D7.Award, questions: [Q-D3-08], direction: OUT, owner: this, note: "roleKind FUNDING_AWARD; answers D7's OQ-D7-04 request for Study → Award (FUNDED_BY_AWARD) inside the existing type" }
  - { type: INVESTIGATES, from: D3.Study, to: D2.Condition, questions: [Q-D3-10, Q-D3-04, Q-D3-17], direction: OUT, owner: this, note: "D2 10-seams lists it as declared by D3" }
  # ---- declared by other modules into D3 types ----
  - { type: ON_FRONTIER, from: D3.Study, to: D13.Frontier, questions: [Q-D3-10], direction: OUT, owner: other, note: "declared by D13 as Frontier.studies (direction IN); D3 spends no field; D10 also reads it" }
  - { type: IN_STUDY_ARM, from: D2.MechanismEvidenceContext, to: D3.StudyArm, questions: [Q-D3-04], direction: OUT, owner: other, note: "declared by D2 (MechanismEvidenceContext.studyArm, structural); with per-source arms D2 links the arm of the source its context came from" }
  - { type: MENTIONS, from: D9.Chunk, to: D3.Study, questions: [Q-D3-14], direction: OUT, owner: other, note: "D9 Chunk.mentions (kernel MENTIONS, derived, entity-link/vN), also to OutcomeDefinition, InterventionComponent, Publication; never evidence (00-DIRECTIVE 3.8)" }
  - { type: MENTIONS, from: D9.Chunk, to: D3.OutcomeDefinition, questions: [Q-D3-14], direction: OUT, owner: other }
  - { type: COVERS_LOCATOR, from: D9.Chunk, to: K.SourceLocator, questions: [Q-D3-14], direction: OUT, owner: other, note: "D9 derived chunk → locator span-overlap projection used by the U2E path" }
  - { type: ASSESSES, from: K.Assessment, to: D3.StudyResult, questions: [CQ-EV-04, CQ-ST-09, CQ-ST-10, CQ-AX-24, CQ-EV-03], direction: OUT, owner: other, note: "kernel field Assessment.about (Subjectable); kinds APPLICABILITY (D3.applicability, D3.applicability.dimension), EVIDENCE_SYNTHESIS, QUALITY (D3.evidence-strength: gradeScheme + grade + certainty), OTHER (D3.result-interpretation: effectDirection + conclusionCode), SAFETY_SIGNAL (D5); vocabularies in 09-reasoning.md" }
  - { type: ASSESSES, from: K.Assessment, to: D3.OutcomeDefinition, questions: [CQ-ST-03], direction: OUT, owner: other, note: "kind OTHER, subkind D3.endpoint-classification (pinned EndpointClassification): conclusionCode = endpoint class, facets bestCategory= / contextOfUse= (09-reasoning.md)" }
  - { type: ASSESSES, from: K.Assessment, to: D3.Study, questions: [CQ-EV-04, Q-D3-07, CQ-AX-24, Q-D3-04], direction: OUT, owner: other, note: "applicability of a study to a use context; risk of bias (QUALITY)" }
  - { type: ASSESSES, from: K.Assessment, to: D3.InterventionComponent, questions: [CQ-ST-02, CQ-EV-04, Q-D3-07], direction: OUT, owner: other, note: "EQUIVALENCE / APPLICABILITY of study material vs a product on sale; dose translation" }
  - { type: ASSESSES, from: K.Report, to: D3.Study, questions: [Q-D3-04], direction: OUT, owner: other, note: "published comparison or evidence report (D10 composition)" }
kernelTypesReferenced:
  - { type: SourceRevisionKind, kind: enum, usedOn: [RevisionEdgeProperties.revisionKind], owner: K, note: "adversarial-review stage: replaces D3's PublicationRevisionKind so REVISES and the kernel HAS_REVISION_STATUS convention share one vocabulary" }
  - { type: TimePrecision, kind: enum, usedOn: [RegistrationVersion.versionDatePrecision, RegistrationVersion.primaryCompletionDatePrecision, Publication.publishedAtPrecision, StudyRoleEdgeProperties], owner: K }
  - { type: ValidTimeBasis, kind: enum, usedOn: [StudyRoleEdgeProperties], owner: K, note: "StudyRoleEdgeProperties repeats AssertedEdgeProperties' fields verbatim" }
  - { type: StateEpisodeProperties, kind: relationshipProperties, usedOn: [HAS_REGISTRATION_VERSION], owner: K, note: "allowlisted" }
  - { type: AssertedRecordedProperties, kind: relationshipProperties, usedOn: [STATED_IN, ADMINISTERS, MEASURES, REPORTS_ON, INVESTIGATES], owner: K, note: "kernel M10 (recorded-only asserted edges); outside the packet-check allowlist, so also listed under sharedVocabularies kernel-types (K pattern change 9); base of RevisionEdgeProperties" }
  - { type: AssertedEdgeProperties, kind: relationshipProperties, usedOn: [HAS_STUDY_ROLE (as the base of StudyRoleEdgeProperties)], owner: K, note: "allowlisted" }
  - { type: StructuralEdgeProperties, kind: relationshipProperties, usedOn: [HAS_ARM, HAS_COMPONENT, HAS_POPULATION, HAS_OUTCOME, RESULT_FOR, RESULT_FOR_ARM], owner: K, note: "allowlisted" }
  - { type: Assessment, kind: node, usedOn: "ASSESSES into D3 types (kernel-declared)", owner: K }
  - { type: Report, kind: node, usedOn: "ASSESSES into D3.Study (kernel-declared)", owner: K }
moduleEdgePropertyTypes:
  - { type: StudyRoleEdgeProperties, usedOn: [HAS_STUDY_ROLE], base: AssertedEdgeProperties, adds: [roleKind], note: "kernel M11 superset rule; role label as printed is Assertion.qualifiers roleText:<label>" }
  - { type: RevisionEdgeProperties, usedOn: [REVISES], base: AssertedRecordedProperties, adds: [revisionKind], note: "kernel M11 superset rule; per-asserter reasons are Assertion.qualifiers reason:<text>" }
dependsOn:
  - { edge: OPERATIONALIZED_BY, from: D5.Target, to: "D4.Biomarker | D4.Metric | D2.Outcome", owner: D5, why: "the path from study evidence to a target (Q-D3-04): Target -OPERATIONALIZED_BY-> Metric|Biomarker|Outcome (D5 union TargetMeasure) <-MEASURES- OutcomeDefinition <-RESULT_FOR- StudyResult; clinical-event outcomes resolved to D2 Outcome (all-cause mortality, disability-free survival) reach a target; only outcomes resolved to D2 Condition (incident disease, adverse-event terms) do not (11-open-questions #8)" }
  - { edge: LOT_OF, from: D8.Lot, to: "D6.Product | D6.ProductVariant", owner: D8, why: "CQ-ST-02 SAME_LOT path (InterventionComponent.lotCodeVerbatim = Lot.lotCode, property join)" }
  - { edge: "HAS_LABEL_VERSION / DECLARES_COMPONENT", from: "D6.ProductVariant | D6.LabelVersion", to: D1.IngredientMaterial, owner: D6, why: "CQ-ST-02 SAME_MATERIAL path: the material on the label of the product on sale" }
  - { edge: REALIZES_SUBSTANCE, from: D1.IngredientMaterial, to: D1.ChemicalSubstance, owner: D1, why: "CQ-ST-02 SAME_SUBSTANCE_ONLY path; Q-D3-02 / Q-D3-03 / Q-D3-06 group by substance" }
  - { edge: "none (Assertion.qualifiers string population:<uid>)", from: K.Assertion, to: D3.StudyPopulation, owner: D5, why: "D5 target-effect assertions qualified by a study population name it by the kernel qualifier string population:<StudyPopulation uid> (D5 vocab-targets 0.2.0 withdrew the APPLIES_TO_POPULATION qualifier assertion); a string join, no edge, no D3 field" }
sharedVocabularies:
  - { name: kernel-types, file: "packets/K/04-schema-proposal.graphql (worktree A1)", owner: K, usedBy: [StudyRoleEdgeProperties, RevisionEdgeProperties, RegistrationVersion, Publication, STATED_IN, ADMINISTERS, MEASURES, REPORTS_ON, INVESTIGATES], how: "kernel types outside the packet-check allowlist used as property or edge-property types (K pattern change 9): AssertedRecordedProperties, SourceRevisionKind, TimePrecision, ValidTimeBasis, PrivacyClass; detail in kernelTypesReferenced above" }
  - { name: targets, file: "packets/D5/vocab-targets.yaml (worktree A5)", owner: D5, usedBy: [Q-D3-04, Q-D3-05], how: "study evidence reaches a Target only through OutcomeDefinition -MEASURES-> Metric|Biomarker|Outcome <-OPERATIONALIZED_BY- Target (D5 union TargetMeasure); target-effect claims are D5 Assertions (IMPROVES_TARGET … WORSENS_TARGET) whose qualifier population:<uid> may name a D3 StudyPopulation; no D3 node points at a Target" }
  - { name: frontiers, file: "packets/D13/vocab-frontiers.yaml (worktree A7)", owner: D13, usedBy: [Q-D3-10], how: "Study is one of the two types that attach to a Frontier (ON_FRONTIER, asserted by the curation agent with frontierVocabVersion); D13 declares the field" }
  - { name: identifier-schemes, file: "packets/K/identifier-schemes.yaml (worktree A1)", owner: K, usedBy: [Study, Publication], how: "NCT, ISRCTN, EUCT, EUDRACT on Study; DOI, PMID, PMCID, OPENALEX on Publication (also on their kernel Sources, which is the Source ↔ Publication join); requested: RETRACTION_WATCH, PROSPERO, ACTRN, CHICTR, DRKS, CTRI, JRCT, WHO_UTN" }
  - { name: SexScope, file: "this module (04-schema-proposal.graphql)", owner: D3, usedBy: [StudyPopulation.sexScope, "D2 MechanismEvidenceContext.sexScope (D2 10-seams)"], how: "D3 enum (ALL, FEMALE, MALE, NOT_REPORTED) reused by D2 as a property type; one copy, owned here (found in the check stage)" }
  - { name: EstimateDirection, file: "this module (04-schema-proposal.graphql)", owner: D3, usedBy: [StudyResult.direction], how: "adversarial-review stage: neutral direction of the point estimate (INCREASED, DECREASED, NO_CHANGE, MIXED, UNKNOWN) replaces the pinned OutcomeDirection (IMPROVED / WORSENED, directive 3.2); benefit / harm is kernel EffectDirection on Assessments or D5's target predicates (11-open-questions #13, #14 closed)" }
  - { name: MassBasis, file: "packets/D1/04-schema-proposal.graphql (worktree A2)", owner: D1, usedBy: [InterventionComponent.massBasis], how: "D1 enum (SALT_FORM, ACTIVE_MOIETY, NUTRIENT_EQUIVALENT, MATERIAL_AS_IS, UNSPECIFIED) used as a property type; D3 no longer declares its own copy (adversarial-review stage: the duplicate made the assembler abort); compile stub in scratch" }
