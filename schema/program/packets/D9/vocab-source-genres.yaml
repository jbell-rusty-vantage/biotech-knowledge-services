  - { source: S04 YouTube oEmbed, genre: PLATFORM_DIRECTORY_RECORD, WHAT_WAS_SAID: NOT_AUTHORITATIVE }
  - { source: S05 Spotify episode page, genre: PLATFORM_DIRECTORY_RECORD, WHAT_WAS_SAID: NOT_AUTHORITATIVE }
  - { source: S06 iTunes Search / Lookup, genre: PLATFORM_DIRECTORY_RECORD, WHAT_WAS_SAID: NOT_AUTHORITATIVE }
