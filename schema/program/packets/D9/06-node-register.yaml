version: 1
module: D9
# Model stage, A8, 2026-10-08; adversarial review 2026-10-08 (Chunk is projection output, no recordedTo). Three node types (budget 8). Identifier scheme codes from packets/K/identifier-schemes.yaml;
# schemes marked (requested) are asked for in 11-open-questions.md (K-8).
nodes:
  - name: Channel
    uidToken: channel
    identityKeys: [platform, platformAccountId]
    identityFallback: normalized feedUrl, else normalized homeUrl
    identifierSchemes: [PODCAST_INDEX_FEED, ISSN, WIKIDATA, YOUTUBE_CHANNEL (requested), APPLE_PODCAST (requested), SPOTIFY (requested), X_ACCOUNT (requested)]
    whyNode: >-
      CQ-CL-05 joins a statement to "the channel's" financial interest through predicate-only OPERATED_BY Assertions (subject
      Channel, valid time on the Assertion) and the channel's works' CONTENT_SPONSORED_BY; CQ-CL-07 / Q-D9-11 need a pseudonymous asserter that is not a Person (an ACCOUNT channel, as D7 asks);
      Q-D9-19 and Q-D9-14 score voices and authority per channel; Q-D9-16 coverage enumerates a channel's works. A property on
      MediaWork cannot be an asserter, an assessment target or the subject of an operator Assertion.
    filterProperties: [channelKind, platform, platformAccountId, handle, isPseudonymous, language]
    otherProperties: 2
    archetype: Entity
    implements: [Entity, Subjectable]
    mutations: { create: false, update: false, delete: false }
    mutationsNote: "@mutation(operations: []); the intent executor is the only writer (create + update through intents; nothing is deleted)"
  - name: MediaWork
    uidToken: media-work
    identityKeys: [channel, publisherItemKey]
    identityFallback: platform item id (YouTube video id, X post id, Substack post id, forum topic id), else normalized canonicalUrl
    identifierSchemes: [PODCAST_GUID, YOUTUBE_VIDEO, ISBN, DOI, WIKIDATA, X_POST (requested), SUBSTACK_POST (requested), SPOTIFY (requested)]
    whyNode: >-
      Every claim occurrence OCCURS_IN one work (CQ-CL-01, Q-D9-01, Q-D9-02 use its publishedAt as the statement time T);
      renditions (kernel Sources) diverge and are joined only here (Q-D9-06, CQ-PV-02); sponsorship episodes attach here
      (Q-D9-06, CQ-CL-08); re-cuts and clips carry republicationKind and a predicate-only REPUBLISHES Assertion to the original (CQ-CL-06, Q-D9-07); IMAGE works carry figure reuse
      and generation mode (Q-D9-17). Without it the container would be smeared across Sources (one per rendition) and the
      independence count would double-count every re-cut.
    filterProperties: [workKind, publishedAt, republicationKind, language, episodeNumber, generationMode]
    otherProperties: 6
    archetype: Entity
    implements: [Entity, Subjectable]
    mutations: { create: false, update: false, delete: false }
    mutationsNote: "@mutation(operations: []); executor writes through intents"
  - name: Chunk
    uidToken: chunk
    identityKeys: [snapshot, textVersionHash, chunkerVersion, chunkIndex]
    identifierSchemes: []
    whyNode: >-
      Q-D9-20 (directive 3.8 path): the vector and fulltext indexes need one node per retrieval span with its embedding; the
      path continues to the located assertions (COVERS_LOCATOR) and the mentioned entities (MENTIONS). A property cannot hold
      a vector index entry per span. Implements Entity only (pure retrieval structure; never a subject, never evidence).
    filterProperties: [textBasis, language, workUid, channelUid, publishedAt, chunkerVersion, textVersionHash, chunkIndex]
    otherProperties: 12
    archetype: Entity
    implements: [Entity]
    mutations: { create: false, update: false, delete: false }
    mutationsNote: "projection output, written only by the chunking/embedding projection Activity; a new chunkerVersion or text version rebuilds the chunks and deletes the old ones (derived structure, no recordedTo; adversarial review)"

deferred:
  - name: EpisodeSegment
    reason: >-
      Segment kind (sponsor read, editorial, intro, correction note) is a property of the span; carried as the occurrence
      qualifier `segment:<KIND>` until the kernel adds Assertion.segmentKind (K-5), and as MEDIA_TIMECODE locators. Promote only if
      a question must traverse one segment shared by many occurrences.
  - name: DiscourseAssessment
    reason: research-stage candidate; kernel Assessment kinds RETELLING_FIDELITY / CONFLICT_RELEVANCE / SOURCE_AUTHORITY cover it (A1's map)
  - name: PseudonymousActor
    reason: a handle is a Channel with channelKind ACCOUNT and isPseudonymous (D7 says handles are D9 accounts); kernel request K-6 admits it as an asserter
  - name: Community (offline)
    reason: no D9 question at value ≤ 2; online communities are Channels (FORUM)
  - name: GraphView
    reason: a saved view specification is application state, not knowledge; no question
  - name: MediaSuitabilityAssessment
    reason: no D9 question; if needed it is a kernel Assessment (QUALITY) about an IMAGE MediaWork
  - name: MediaRightsRecord
    reason: rights as captured are MediaWork.rightsStatementVerbatim; no question needs rights versions as nodes in pass one
  - name: ProductLabelRegion
    reason: label regions are kernel BOUNDING_BOX locators on a D6 label snapshot (A1's map); D6 owns label content
  - name: DocumentTextVersion
    reason: folded into Chunk properties (textBasis, textVersionHash, extractorVersion, normalizationVersion, textReviewNote); no question filters text versions without their chunks
  - name: Segmentation
    reason: folded into Chunk.chunkerVersion (operational envelope, not knowledge)
  - name: Publication (scholarly)
    reason: D3 owns scholarly works (agreed with A4's research notes); MediaWork excludes them

