# hypothesis is recorded. Profile fields of the posters (location, age) are deliberately not copied into the repo.
# Answers must label these as anecdotes (basisKind PERSONAL_EXPERIENCE), never as evidence of effect.
# Locator refs are ids in ./locators.yaml. producedBy ids are FIXTURE ids, not Mission Control ids.
