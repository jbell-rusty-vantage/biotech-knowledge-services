    asserter: p-attia
    speechAct: STATES
    basisKind: EXPERT_OPINION
    predicate: INTERPRETS_RESULT
    subject: cs-rapamycin
    valueString: "interesting but quite limited; not a death knell for rapamycin"
    qualifiers: ["stance:QUALIFIES (accepts the numbers, contests the implication)"]
    derivedFrom: [ret-conclusion]
    container: w-art
    evidence: [{ locator: a4, role: SUPPORTS }, { locator: a8, role: SUPPORTS }]
    validTime: { validFrom: null, validFromBasis: UNKNOWN, validTo: null, validToBasis: UNKNOWN }
    producedBy: { missionId: "mission:ft-D9-fixtures", runId: "run:ft-D9-rapa-ex-01-attia-retelling" }

  # ---------------- RETELLING_FIDELITY assessment (kernel Assessment; interim shape K-1/K-3/K-4) ----------------
  - id: rf-grip
    class: assessment
    assessmentKind: RETELLING_FIDELITY
    status: PROPOSED
    methodVersion: "fixture-manual/v0 (span-match numeric equality)"
    about: "Claim of orig-res (interim: ASSESSES the Claim; K-3 requests ASSESSES -> Assertion)"
    derivedFrom: [ret-grip, orig-res, orig-abs]
    verdict: DIRECTLY_SUPPORTED
    facets: ["retelling=ret-grip", "original=orig-res", "matchedSpan=j2 (RESULTS)", "amountChanged=false vs RESULTS", "amountChanged=true vs ABSTRACT (-1.19 vs -1.13)", "linkBasis=EXPLICIT_CITATION", "lostQualification=ci95 omitted (p kept)"]
    evidence: [{ locator: a2, role: SUPPORTS }, { locator: j2, role: SUPPORTS }, { locator: j1, role: CONTEXT }]
    producedBy: { missionId: "mission:ft-D9-fixtures", runId: "run:ft-D9-rapa-ex-01-attia-retelling" }
  - id: rf-safety
    class: assessment
    assessmentKind: RETELLING_FIDELITY
    status: PROPOSED
    methodVersion: "fixture-manual/v0"
    about: "Claim of orig-hba1c"
    derivedFrom: [ret-safety, orig-hba1c, orig-pneumonia]
    verdict: SUPPORTED_WITH_QUALIFICATION
    facets: ["safetyFindingAddedVsAbstract=HbA1c (results only, j3)", "safetyFindingKept=pneumonia (abstract, j4)", "amountChanged=dropped (+1.74 mmol/mol not retold)"]
    evidence: [{ locator: a3, role: SUPPORTS }, { locator: j3, role: SUPPORTS }, { locator: j4, role: SUPPORTS }]
    producedBy: { missionId: "mission:ft-D9-fixtures", runId: "run:ft-D9-rapa-ex-01-attia-retelling" }

  # ---------------- author interests stated in the paper (D7 episodes; Q-D9-13 researcher-influencer seam) ----------------
  - { id: d7-mk-ceo, class: asserted, relationship: "D7 HOLDS_ROLE", asserter: pub-rapaex, subject: p-kaeberlein, object: org-optispan, edgeProperties: { roleKind: EXECUTIVE_OFFICER, roleTitleVerbatim: "Chief Executive Officer" }, evidence: [{ locator: j5, role: SUPPORTS }], validTime: { validFrom: null, validFromBasis: UNKNOWN, validTo: null, validToBasis: UNKNOWN, note: "current at publication (April 2026)" }, resolution: res-initials, producedBy: { missionId: "mission:ft-D9-fixtures", runId: "run:ft-D9-rapa-ex-01-attia-retelling" } }
  - { id: d7-mk-equity, class: asserted, relationship: "D7 HOLDS_STAKE", asserter: pub-rapaex, subject: p-kaeberlein, object: org-optispan, edgeProperties: { stakeKind: EQUITY }, evidence: [{ locator: j5, role: SUPPORTS }], validTime: { validFrom: null, validFromBasis: UNKNOWN, validTo: null, validToBasis: UNKNOWN }, resolution: res-initials, producedBy: { missionId: "mission:ft-D9-fixtures", runId: "run:ft-D9-rapa-ex-01-attia-retelling" } }
  - { id: d7-bs-founder, class: asserted, relationship: "D7 HOLDS_ROLE", asserter: pub-rapaex, subject: p-stanfield, object: org-microvitamin, edgeProperties: { roleKind: FOUNDER }, evidence: [{ locator: j6, role: SUPPORTS }], validTime: { validFrom: null, validFromBasis: UNKNOWN, validTo: null, validToBasis: UNKNOWN }, resolution: res-initials, producedBy: { missionId: "mission:ft-D9-fixtures", runId: "run:ft-D9-rapa-ex-01-attia-retelling" } }
  - { id: d7-bs-adrevenue, class: asserted, relationship: "D7 RECEIVES_VALUE_FROM", asserter: pub-rapaex, subject: p-stanfield, object: "D9 Channel (his YouTube channel; not identified in the paper)", edgeProperties: { valueKind: UNSPECIFIED_PAYMENT, valueBucket: "advertising revenue from his YouTube channel" }, evidence: [{ locator: j6, role: SUPPORTS }], note: "target is a channel, not a D7 Organization: D7 seam open (11-open-questions)", producedBy: { missionId: "mission:ft-D9-fixtures", runId: "run:ft-D9-rapa-ex-01-attia-retelling" } }
