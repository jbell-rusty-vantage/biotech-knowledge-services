    summary: "Sirolimus and transplant rejection are disproportionately co-reported in FAERS: Open Targets reports an LRT logLR of 1895.665732409805 above its critical value (an Assertion by Open Targets), and BellLabs computes PRR 76.4 (95% CI 68.9 to 84.7; 372 reports) from openFDA counts (as-siro-rejection-prr). Transplant rejection is the condition sirolimus is labelled to prevent, and Open Targets warns that indications commonly appear among significant ADRs. Interpret as likely confounding by indication, not as evidence that sirolimus causes rejection."
