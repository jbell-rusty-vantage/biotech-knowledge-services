version: 1
module: D7
# Model stage (A6, 2026-10-08); reconciled in the check stage (A6, 2026-10-08) against the sibling packets' SDL and
# 10-seams.yaml as they stood that day (worktrees A1-A8). D7's SDL references no type outside the module except kernel
# allowlisted types (Entity, Subjectable, AssertedEdgeProperties, StructuralEdgeProperties) and the kernel edge-property
# type AssertedRecordedProperties plus kernel enums (listed under sharedVocabularies: kernel-types, per the K pattern
# "Kernel types a domain may reference without a seam"). Every seam below is an edge another module declares on its own
# type pointing at a D7 type (owner: other; the hub-split mechanism: Organization, Person, Brand and Award declare no
# inverse field), a kernel record D7 relies on, or a predicate-only role two modules both route through D7's anchor.
# Names, fields and union widths are the owners' SDL names (field in `field:`); questions are D7's.
# Adversarial review (A6, 2026-10-08): D7 no longer references kernel StructuralEdgeProperties (AWARDED_BY is asserted on
# AssertedRecordedProperties); added the D4 Device subject seam, the D13 Award / investor rules, the D10 property reference,
# the D5 inverse listing, the D7-published manufacturer/supplier and financing predicate sets, and pinned vocab versions.
seams:
  # ---- kernel records D7 relies on (not on the packet-check allowlist)
  - { type: ASSESSES, from: K.Assessment, to: D7.Person, questions: [CQ-CL-05, Q-D7-06, Q-D7-08, Q-D7-20, Q-D7-24], direction: OUT, owner: other, note: "Assessment kinds CONFLICT_RELEVANCE (subkind D7.conflict-relevance), EVIDENCE_SYNTHESIS (D7.role-agreement), QUALITY (D7.disclosure-coverage), INSIGHT (D7.undisclosed-tie-lead), RESOLUTION (D7.person-resolution); D7 owns the subkind vocabularies and questions" }
  - { type: ASSESSES, from: K.Assessment, to: D7.Organization, questions: [CQ-CL-05, Q-D7-08, CQ-EC-02], direction: OUT, owner: other, note: "RESOLUTION (D7.organization-resolution) and EQUIVALENCE hypotheses; never a merge" }
  - { type: ASSESSES, from: K.Assessment, to: K.Claim, questions: [CQ-CL-05, Q-D7-06], direction: OUT, owner: other, note: "the conflict-relevance assessment is about the Claim of the occurrence plus the speaker; the occurrence itself (an Assertion, not Subjectable) is cited by DERIVED_FROM" }
  - { type: DERIVED_FROM, from: K.Assessment, to: K.Assertion, questions: [CQ-CL-05, Q-D7-06, Q-D7-08], direction: OUT, owner: other, note: "conflict-relevance and role-agreement inputs: the claim occurrence and each interest Assertion" }
  - { type: ASSERTED_BY, from: K.Assertion, to: "D7.Person | D7.Organization (through K.Subjectable)", questions: [CQ-CL-05, Q-D7-06, Q-D7-07, Q-D7-24, CQ-AX-18], direction: OUT, owner: other, note: "kernel edge (allowlisted; listed for the D9 seam): a claim occurrence with speechAct RECOMMENDS names its speaker; the reachable financial interest is the D7 interest family from that Person (K 10-seams lists the same seam)" }
  - { type: HAS_SUBJECT, from: K.Assertion, to: "D4.Device (through K.Subjectable)", questions: [Q-D7-06, CQ-CL-05], direction: OUT, owner: other, note: "the recommended thing of a claim occurrence can be its subject (Attia fixture r-01: the CGM device category, D4 Device); Q-D7-06 and CQ-CL-05 read HAS_SUBJECT|HAS_OBJECT. No typed path links a D4 Device to its maker (D4 platform roles are predicate-only), so device-category relevance is read from the CONFLICT_RELEVANCE Assessment, never computed" }
  - { type: ASSOCIATES, from: D10.Association, to: "D7.Organization | D7.Person (through K.Subjectable)", questions: [Q-D7-22, Q-D7-23], direction: OUT, owner: other, note: "D10 derived projection (read-only, method-versioned); D7 declares no derived edges; evidence-backer concentration and tie leads may be materialized here, never as D7 edges" }
  # ---- D9 (sources, media, discourse): recommendations, speakers, containers
  - { type: MENTIONS, from: D9.Chunk, to: "D7.Organization | D7.Person | D7.Brand | D7.Award (through K.Subjectable)", field: Chunk.mentions, questions: [CQ-EC-03, CQ-CL-05], direction: OUT, owner: other, note: "derived retrieval projection with kernel meaning (DerivedEdgeProperties, entity-link/vN); FC1 unstructured-to-entity path" }
  - { type: APPEARS_IN, from: D7.Person, to: D9.MediaWork, field: MediaWork.appearances (direction IN), questions: [CQ-CL-05, Q-D7-06, Q-D7-24], direction: IN, owner: other, note: "who speaks in a work; D7 Person declares no inverse" }
  - { type: CONTENT_SPONSORED_BY, from: D9.MediaWork, to: "D7.Organization | D7.Brand (union ContentSponsor, 2 members)", field: MediaWork.sponsors, questions: [CQ-CL-05, Q-D7-07], direction: OUT, owner: other, note: "content sponsorship is D9's edge on the container; the money tie to a Person is D7 RECEIVES_VALUE_FROM (valueKind SPONSORSHIP_PAYMENT)" }
  - { type: OPERATED_BY, from: D9.Channel, to: "D7.Person | D7.Organization (union ChannelOperator, 2 members)", field: Channel.operators, questions: [CQ-CL-05, CQ-CL-07], direction: OUT, owner: other, note: "channel/podcast operator" }
  - { type: ASSESSES, from: K.Assessment, to: D9.Channel, questions: [CQ-CL-07], direction: OUT, owner: other, note: "a kernel RESOLUTION Assessment ASSESSES the D9 handle (Channel with platform handle) and the candidate D7 Person; PseudonymousActor is not a D7 type (OQ-D7-06)" }
  # ---- D3 (clinical and preclinical evidence): one role edge with a 3-member union StudyParty
  - { type: HAS_STUDY_ROLE, from: D3.Study, to: D7.Organization, field: Study.roles (union StudyParty = Organization | Person | Award), questions: [Q-D7-05, CQ-EC-04, Q-D7-22], direction: OUT, owner: other, note: "StudyRoleEdgeProperties.roleKind LEAD_SPONSOR, SPONSOR, COLLABORATOR, FUNDER, MATERIAL_PROVIDER, CRO, SITE" }
  - { type: HAS_STUDY_ROLE, from: D3.Study, to: D7.Person, field: Study.roles, questions: [CQ-EC-04, Q-D7-25], direction: OUT, owner: other, note: "PRINCIPAL_INVESTIGATOR, RESPONSIBLE_PARTY, sponsor-investigator" }
  - { type: HAS_STUDY_ROLE, from: D3.Study, to: D7.Award, field: Study.roles, questions: [Q-D7-05, Q-D7-15, Q-D7-22, CQ-EC-04], direction: OUT, owner: other, note: "roleKind FUNDING_AWARD; D3's answer to OQ-D7-04 (replaces the proposed FUNDED_BY_AWARD); exercised by the Elysium fixture (e-12..e-14: preclinical Study → three Awards)" }
  - { type: REPORTS_ON, from: D3.Publication, to: D3.Study, questions: [CQ-EC-04, Q-D7-22], direction: OUT, owner: other, note: "read only: author → employer paths start at the publication" }
  # ---- D6 (products and commerce)
  - { type: BRANDED_AS, from: D6.Product, to: D7.Brand, field: Product.brand, questions: [CQ-CL-05, CQ-EC-03, Q-D7-06, Q-D7-11, Q-D7-19, Q-D7-21, Q-D7-24, CQ-MF-01], direction: OUT, owner: other }
  - { type: SELLER_OF_RECORD, from: D6.Offer, to: D7.Organization, field: Offer.sellerOfRecord, questions: [Q-D7-19, CQ-EC-01], direction: OUT, owner: other, note: "no inverse field on Organization" }
  - { type: NAMES_RESPONSIBLE_PARTY, from: D6.LabelVersion, to: D7.Organization, field: LabelVersion.responsibleParty, questions: [Q-D7-19, CQ-MF-01], direction: OUT, owner: other, note: "'Manufactured for / Distributed by' party printed on a label" }
  # ---- manufacturer / supplier roles: the one predicate set D7 publishes (05 predicateOnly); D1, D6, D8 asked to adopt the names (OQ-D7-28)
  - { type: "MANUFACTURES (Assertion.predicate)", from: D7.Organization, to: "D6.Product | D1.IngredientMaterial", questions: [CQ-MF-01, Q-D7-18], direction: OUT, owner: this, note: "registered in D7 05; D6 already uses this name; D1 asked to rename MANUFACTURES_MATERIAL; no typed edge anywhere — OQ-D7-28" }
  - { type: "CONTRACT_MANUFACTURES_FOR (Assertion.predicate)", from: D7.Organization, to: D7.Organization, questions: [CQ-MF-01, Q-D7-18], direction: OUT, owner: this, note: "CMO → brand owner, qualifier product=; same name as D8's registration" }
  - { type: "SUPPLIES_MATERIAL (Assertion.predicate)", from: D7.Organization, to: D1.IngredientMaterial, questions: [CQ-MF-01, Q-D7-21], direction: OUT, owner: this, note: "qualifiers exclusivity=SOLE|NON_EXCLUSIVE|UNSTATED, buyer=; D6 (filing-channels-niagen-10k) and D7 (niagen n-19) write the Grace 10-K fact identically; D8 asked to fold SUPPLIES_INGREDIENT and EXCLUSIVE_SUPPLIER_OF into it; D1 declares IngredientMaterial.suppliers on promotion" }
  - { type: "MANUFACTURER_UNNAMED (Assertion.predicate)", from: D7.Organization, to: literal, questions: [CQ-MF-01, Q-D7-21], direction: OUT, owner: this, note: "an unnamed manufacturer described by a filing; D6 asked to rename MANUFACTURER_STATEMENT" }
  # ---- D8 (quality, regulation, IP)
  - { type: ISSUED_BY, from: D8.RegulatoryRecord, to: D7.Organization, field: RegulatoryRecord.issuedBy, questions: [Q-D7-07, Q-D7-13], direction: OUT, owner: other, note: "the regulator (FTC, FDA) issuing a warning letter or action" }
  - { type: ADDRESSED_TO, from: D8.RegulatoryRecord, to: D7.Organization, field: RegulatoryRecord.addressedTo, questions: [Q-D7-07, Q-D7-13, Q-D7-19], direction: OUT, owner: other, note: "the marketer or firm a warning letter or action names (replaces ACTION_AGAINST / RECORD_CONCERNS from the research notes)" }
  - { type: ISSUED_BY, from: D8.QualityResult, to: D7.Organization, field: QualityResult.issuedBy, questions: [CQ-MF-01], direction: OUT, owner: other, note: "testing lab issuing a COA" }
  - { type: ISSUED_BY, from: D8.CertificationListing, to: D7.Organization, field: CertificationListing.issuedBy, questions: [CQ-MF-01], direction: OUT, owner: other }
  - { type: COVERS, from: D8.CertificationListing, to: "D7.Organization (member of union CertificationCoverageTarget)", field: CertificationListing.covers, questions: [CQ-MF-01, Q-D7-10], direction: OUT, owner: other, note: "a certified facility is covered as an Organization until a Facility type exists (D8 declined Facility; OQ-D7-05)" }
  - { type: ASSIGNED_TO, from: D8.Patent, to: D7.Organization, field: Patent.assignees, questions: [CQ-EC-04, Q-D7-11], direction: OUT, owner: other, note: "patent assignee; an inventor's licensed-IP income is D7 RECEIVES_VALUE_FROM (INVENTOR_ON_LICENSED_IP)" }
  - { type: LICENSED_TO, from: D8.Patent, to: D7.Organization, field: Patent.licensees, questions: [CQ-EC-04, Q-D7-11], direction: OUT, owner: other }
  # ---- D4 (biomarkers, tests, devices)
  - { type: PERFORMED_BY_LAB, from: D4.AssayVersion, to: D7.Organization, field: AssayVersion.performingLab, questions: [CQ-EC-01], direction: OUT, owner: other, note: "lab neighbourhood only; no D7 question filters on it" }
  # ---- D13 (frontiers and breakthroughs)
  - { type: INVOLVES, from: D13.Event, to: D7.Organization, field: Event.involvedOrganizations, questions: [Q-D7-04, Q-D7-12, Q-D7-13], direction: OUT, owner: other, note: "EventRoleEdgeProperties role ISSUER, INVESTOR, LEAD_INVESTOR, LENDER, ACQUIRER, SPONSOR, REGULATOR …. Write rule (OQ-D7-33, shared with D13): round participation is INVOLVES {INVESTOR | LEAD_INVESTOR}; a persisting holding is D7 HOLDS_STAKE, written only when a source states it. Q-D7-04 and Q-D7-13 read both and label each row by basis" }
  - { type: INVOLVES, from: D13.Event, to: D7.Person, field: Event.involvedPeople, questions: [Q-D7-12], direction: OUT, owner: other, note: "public actors only" }
  - { type: "REPORTED_MARKET_MOVE (Assertion.predicate)", from: D13.Event, to: D7.Organization, questions: [Q-D7-13], direction: OUT, owner: other, note: "D13's registration (subject Event, object Organization); D7 removed its own listing in the adversarial review and stores no market-data series (OQ-D7-13)" }
  - { type: "FINANCING_AMOUNT | DATE_OF_FIRST_SALE | INVESTOR_COUNT (Assertion.predicate)", from: D13.Event, to: literal, questions: [Q-D7-04], direction: OUT, owner: this, note: "the D7 money pattern on the D13 FINANCING Event, registered in D7 05 (D13 05 / 10-seams assign the amount pattern to D7); FINANCING_AMOUNT keeps D13's name with qualifier amountKind=OFFERED|SOLD|REMAINING|ROUND_TOTAL|DEAL_VALUE" }
  - { type: "EVENT_ABOUT (Assertion.predicate)", from: D13.Event, to: D7.Award, questions: [Q-D7-05, Q-D7-15], direction: OUT, owner: other, note: "award rule (OQ-D7-32, D13 11-open-questions item 19): a grant, contract or prize record is a D7 Award (AWARDED_BY / AWARDED_TO, amounts on the Award); a D13 AWARD Event exists only as the announcement or frontier milestone, points at the Award by EVENT_ABOUT and carries no amount; D13 is asked to restrict EventRole AWARDING_BODY / AWARDEE to prizes with no Award record" }
  # ---- D5 (interventions, protocols; clinics)
  - { type: "OFFERS_INTERVENTION (Assertion.predicate)", from: "D6.Offer | D7.Organization", to: D5.Intervention, questions: [Q-D7-10], direction: OUT, owner: other, note: "predicate-only in D5 until D6/D7 decide; a clinic operator offering an intervention" }
  - { type: "PROTOCOL_AUTHORED_BY (Assertion.predicate)", from: D5.Protocol, to: "D7.Person | D7.Organization", questions: [Q-D7-06, Q-D7-11], direction: OUT, owner: other, note: "D5 reads the author's interest family (next entry)" }
  - { type: "HOLDS_ROLE | HOLDS_STAKE | RECEIVES_VALUE_FROM (read)", from: D7.Person, to: D7.Organization, questions: [Q-D5-13], direction: OUT, owner: this, note: "inverse listing for D5: the protocol author's financial interest is the D7 interest family, read with valid-time overlap against the protocol edition. D5 10-seams still names it HAS_INTEREST_IN (Shape A, not declared by any module); D5 asked to rename the seam and its Q-D5-13 pattern to -[r:HOLDS_ROLE|HOLDS_STAKE|RECEIVES_VALUE_FROM]-> (OQ-D7-29)" }
  # ---- D10 (vetting, decision criteria)
  - { type: "publisherUid (property reference)", from: D10.DecisionCriterion, to: D7.Organization, questions: [Q-D7-06], direction: OUT, owner: other, note: "D10 stores the criterion publisher's Organization uid as a property and reads the publisher's interest through D7 seams; D7 asks D10 to use the kernel ASSERTED_BY on the criterion's authorizing Assertion instead (a property reference has no episode and no trace) — OQ-D7-34" }
sharedVocabularies:
  - { name: kernel-types, source: packets/K/04-schema-proposal.graphql, used: [AssertedRecordedProperties, PrivacyClass, TimePrecision, ValidTimeBasis], rule: "AWARDED_BY and AWARDED_TO use AssertedRecordedProperties (K M10); the four D7 edge-property types copy AssertedEdgeProperties' eleven fields verbatim first (K M11 superset rule) and add no observation date (Assertion.validObservedAt is read through assertionUid); PrivacyClass on every node; TimePrecision / ValidTimeBasis in the episode fields and Award.datePrecision" }
  - { name: identifier-schemes, source: packets/K/identifier-schemes.yaml, codesUsed: [LEI, SEC_CIK, ROR, ORCID, NPI, WIKIDATA, OPENALEX, DOI], codesRequested: [COMPANY_NUMBER, UEI, CROSSREF_FUNDER, WEB_DOMAIN, AWARD_NUMBER, NIH_PROJECT, NIH_PROFILE_ID, TICKER] }
  - { name: targets, source: "packets/D5/vocab-targets.yaml@0.2.2", consumedBy: [Q-D7-24], note: "pinned to the current 0.2.2 (additive; D5 accepts 0.2.0 / 0.2.1 / 0.2.2 consumers)", rule: "D7 types never point at a Target; Q-D7-24 reaches a target through D9 claim occurrences and D6/D1 means asserted INTENDED_FOR_TARGET (kernel Assertion)" }
  - { name: frontiers, source: "packets/D13/vocab-frontiers.yaml@0.2.0", consumedBy: [], note: "pinned to the current 0.2.0 (0.2.0 only adds to 0.1.0)", rule: "Organizations and Persons never point at a Frontier; 'who is active on F' is computed through D13 Events they are INVOLVED in and D3 Studies they sponsor (D13 seam rule)" }
  - name: conflict-relevance-subkinds
    source: "this packet (09-reasoning.md 'Conflict relevance vocabulary'); encoded in the kernel Assessment slots (K M9): conclusionCode = relevanceLevel, facets = '<facet>=<value>'"
    consumers: [D4 (subkind D4.test-and-sell, assessmentKind CONFLICT_RELEVANCE, uses this conclusionCode list), D9 (claim-occurrence conflict reads)]
    assessmentSubkind: D7.conflict-relevance
    conclusionCode: [DIRECT, INDIRECT, NOT_RELEVANT, UNDETERMINED]
    facets:
      relevanceBasis: [SAME_PRODUCT, SAME_BRAND, SAME_ORGANIZATION, SAME_PRODUCT_CATEGORY, SAME_SERVICE_CATEGORY, SAME_SUBJECT_PROMOTED, COMPETITOR, UNRELATED]
      temporalOverlap: [OVERLAPS, DISJOINT, UNKNOWN]
      disclosureFinding: [DISCLOSED_IN_CONTAINER, DISCLOSED_IN_LATER_REVISION, DISCLOSED_ELSEWHERE, INADEQUATE_DISCLOSURE_PER_REGULATOR, NOT_DISCLOSED, NOT_FOUND_IN_PARTIAL_CAPTURE]
  - { name: other-d7-subkinds, values: { "D7.role-agreement": "EVIDENCE_SYNTHESIS; conclusionCode AGREE | CONFLICT_ON_KIND | CONFLICT_ON_INTERVAL | ONE_SIDED | ROLE_CLOSED; facets kindAgreement=<AGREE|CONFLICT>, intervalAgreement=<AGREE|CONFLICT|ONE_SIDED>", "D7.disclosure-coverage": "QUALITY; conclusionCode COMPLETE_NONE_FOUND | NOT_FOUND_IN_PARTIAL_CAPTURE | SOURCE_DECLARED_INCOMPLETE; facets captureCompleteness=<COMPLETE|PARTIAL_EXCERPT|NOT_CAPTURABLE> per source searched","D7.undisclosed-tie-lead": "INSIGHT; score = leadScore, methodVersion d7-tie-leads/v1", "D7.person-resolution": "RESOLUTION", "D7.organization-resolution": "RESOLUTION" } }
