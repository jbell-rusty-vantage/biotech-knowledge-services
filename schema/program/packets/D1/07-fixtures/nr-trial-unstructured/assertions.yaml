# ------------------------------------------------------------------------------------------------------------
# Directive 3.8: question -> chunk (MENTIONS or vector) -> assertion(s) -> SourceLocator -> SourceSnapshot bytes
# ------------------------------------------------------------------------------------------------------------
retrievalPath:
  question: "Q-D1-08 — In Conze 2019 (PMID 31278280), are the reported 'mg NR' doses salt mass or moiety mass, and do paper and registry agree on material, dose and trial id?"
  snapshot: { ref: "snap-epmc-pmc6611812-fulltext", contentHash: "sha256:ae7b5a420c48282b6604bd3c6e22ac818dcd0fc5a9fbaba0d45abf62e34661d2", contentHashBasis: RAW_BYTES }
  chunks:   # D9 Chunk (retrieval structure, never a locator); offsets in raw-JATS code points of the snapshot above
    - { ref: chunk-sec6, module: D9, type: Chunk, chunkIndex: 6, startOffset: 28532, endOffset: 30482, textBasis: JATS_XML, textVersionHash: "sha256:ae7b5a420c48282b6604bd3c6e22ac818dcd0fc5a9fbaba0d45abf62e34661d2", spanDigest: "sha256:564450bdf895a217f0e67c08cfe56efa3ff2b0d86477285a7722d32d3473ff5f", extractorVersion: "europepmc-jats/raw", normalizationVersion: "none (raw code points; U+2009/U+00A0 kept)", chunkerVersion: "fixture-chunker/1 (one <sec>)", section: "Methods > Study product", generatedBy: act-chunk }
    - { ref: chunk-abstract, module: D9, type: Chunk, chunkIndex: 0, startOffset: 5578, endOffset: 6783, textBasis: JATS_XML, textVersionHash: "sha256:ae7b5a420c48282b6604bd3c6e22ac818dcd0fc5a9fbaba0d45abf62e34661d2", spanDigest: "sha256:2611154eb89e911617d3799a78beac7ceba5e2b4addfc3995f54d580fb072f7e", section: "Abstract", generatedBy: act-chunk }
    - { ref: chunk-sec3, module: D9, type: Chunk, chunkIndex: 3, startOffset: 20792, endOffset: 26638, textBasis: JATS_XML, textVersionHash: "sha256:ae7b5a420c48282b6604bd3c6e22ac818dcd0fc5a9fbaba0d45abf62e34661d2", spanDigest: "sha256:0dd656165cefed8333bd48d046f1901479074900cbcf97c30a223040b9a0e100", section: "Methods > Study design", generatedBy: act-chunk }
  mentions:   # surface form at a locator (HAS_EVIDENCE role CONTEXT on the RESOLUTION Assessment; the kernel has no Mention node since its adversarial review) + D9 derived MENTIONS (DerivedEdgeProperties) licensed by that assessment
    - { surfaceForm: "NR chloride", locator: l-sr-mention-nrcl, chunk: chunk-sec6, resolvedTo: { ref: sub-nrcl, type: ChemicalSubstance }, licensedBy: r01-resolve-nrcl, edge: "Chunk -[:MENTIONS {derivationRule: 'entity-link/v1', derivedFromAssessmentUids: [r01-resolve-nrcl]}]-> ChemicalSubstance" }
    - { surfaceForm: "NIAGEN", locator: l-sr-mention-niagen, chunk: chunk-abstract, resolvedTo: { ref: mat-niagen, type: IngredientMaterial }, licensedBy: r02-resolve-niagen }
  vectorEntry: { index: "chunk_embedding (D9; db.index.vector.queryNodes on Neo4j 5.26)", queryText: "capsule consisted of mg NR chloride purity active ingredient", expectedTopChunk: chunk-sec6, note: "embedding scores are not stored in the fixture; the MENTIONS hop is the deterministic entry" }
  coversLocator:   # D9 COVERS_LOCATOR (derived, span-overlap/v1): locator spans inside the chunk span of the same snapshot
    chunk-sec6: [l-sr-doses, l-sr-capsule, l-sr-arms, l-sr-mention-nrcl]
    chunk-abstract: [l-sr-abstract-niagen, l-sr-mention-niagen]
    chunk-sec3: [l-sr-registry]
  assertionsReached: { l-sr-capsule: [t02-administered-purity, t03-administers, t04-unit-dose], l-sr-arms: [t03-administers, t04-unit-dose, t05-arm-dose], l-sr-doses: [t05-arm-dose], l-sr-abstract-niagen: [t01-realizes], l-sr-registry: [t06-printed-registry-id] }
  verifierReselect: "for every locator: snapshot_text[startOffset:endOffset] == exact and sha256(exact) == quoteHash (offsetBasis CODE_POINT); re-run 2026-10-08 by build_locators.py on a fresh capture with identical sha256 (bytes unchanged since the research capture)"
  cypher: |
    // entry by MENTIONS (deterministic) — or replace the first MATCH with db.index.vector.queryNodes('chunk_embedding', 8, $embedding) (03 Q-D1-08)
    MATCH (s:ChemicalSubstance {uid: $nrChlorideUid})<-[:MENTIONS]-(c:Chunk)-[:CHUNK_OF]->(snap:SourceSnapshot)
    MATCH (c)-[:COVERS_LOCATOR]->(loc:SourceLocator)<-[ev:HAS_EVIDENCE]-(a:Assertion)
    WHERE a.recordedTo IS NULL AND ev.role = 'SUPPORTS'
    OPTIONAL MATCH (a)<-[:ASSESSES]-(adj:Adjudication {adjudicationKind: 'CAPTURE_FIDELITY'})
    RETURN c.uid, a.predicate, a.valueNumber, a.unitCode, loc.exact, loc.startOffset, loc.endOffset,
           snap.contentHash, snap.retrievedAt, adj.verdict
    ORDER BY loc.startOffset

