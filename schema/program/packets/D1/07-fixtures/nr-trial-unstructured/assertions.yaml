    verdict: SUPPORTED_WITH_QUALIFICATION
    summary: "The printed 'mg NR' doses are NR chloride masses: each capsule held 100 or 250 mg of NR chloride, and '1000 mg NR' = 4 capsules containing 250 mg. massBasis SALT_FORM; the cation equivalent is ~878 mg/d (c05). Qualification: the 99% purity means the salt content itself is ~990 mg."
