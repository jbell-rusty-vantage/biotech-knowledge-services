# Assertions for fixture nr-trial-unstructured (FIXTURES stage, A2, 2026-10-08) — directive 3.8 path.
# Kernel Assertion shape (packets/K/04-schema-proposal.graphql, A1); locators in locators.yaml (verified offsets).
# producedBy ids are FIXTURE ids (mission:ft-D1-fixtures / run:ft-D1-<fixture>), not live Mission Control ids.
# Seam types: D3 Study / InterventionComponent / ADMINISTERS (A4 worktree), D9 Chunk / CHUNK_OF / COVERS_LOCATOR / MENTIONS
# (A8 worktree), D7 Person / Organization. Nodes marked "same as <fixture>#<ref>" resolve to the node of that fixture.
# Adversarial review (2026-10-08): the ORCID formerly on person-conze belongs to Charles Brenner (JATS contrib-id inside
# Brenner's <contrib>; ORCID public API) and was removed; the trial-batch purity is a D3 FIELD Assertion (t02), not a
# MATERIAL_CONTAINS episode on the canonical NIAGEN material; t03 takes the paper's own study period (l-sr-period) and
# t03b the registry's start/completion dates (l-ctgov-start, l-ctgov-completion); ADMINISTERS is AssertedRecordedProperties
# in D3's SDL; the kernel has no Mention node any more (a surface form is a locator + RESOLUTION Assessment).
fixture: nr-trial-unstructured
producedBy: { missionId: "mission:ft-D1-fixtures", runId: "run:ft-D1-nr-trial-unstructured" }
