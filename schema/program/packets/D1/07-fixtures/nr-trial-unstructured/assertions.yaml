  - { ref: act-chunk, activityKind: PROJECTION, agent: "agent:d9-chunker", methodVersion: "fixture-chunker: one chunk per JATS <sec>/<abstract> (raw code points)", missionId: "mission:ft-D1-fixtures", runId: "run:ft-D1-nr-trial-unstructured" }
  - { ref: act-link, activityKind: PROJECTION, agent: "agent:entity-linker", methodVersion: "entity-link/v1 (d1_identity_fulltext exact-name match)", missionId: "mission:ft-D1-fixtures", runId: "run:ft-D1-nr-trial-unstructured" }
  - { ref: act-project, activityKind: PROJECTION, agent: "agent:d1-amount-projection", methodVersion: "d1-amounts/v1", missionId: "mission:ft-D1-fixtures", runId: "run:ft-D1-nr-trial-unstructured" }

