assessments:
  - id: r05-resolve-legacy-strain-name
    assessmentKind: RESOLUTION
    assessmentSubkind: "D1.strain-resolution"
    about: [ { ref: tax-lgg, type: Taxon } ]
    inputAssertions: [g05-species-parent-legacy, g06-deposit-atcc]
    evidence: [ { locator: l-dsld250851-notes, role: CONTEXT }, { locator: l-ncbi568703-equiv, role: SUPPORTS }, { locator: l-ncbi568703-name, role: SUPPORTS }, { locator: l-ncbi47715-auth2020, role: CONTEXT } ]
    score: 1.0
    verdict: DIRECTLY_SUPPORTED
    summary: "Q-D1-15: the label's 'Lactobacillus rhamnosus GG' (genus 'Lactobacillus' as printed) resolves to the deposited strain NCBI 568703 'Lacticaseibacillus rhamnosus GG' (EquivalentName 'Lactobacillus rhamnosus strain GG'; deposits ATCC 53103 = LMG 18243), not only to the species. Strain-specific evidence applies; the genus on the label is the pre-2020 name (closed PARENT_TAXON episode g05)."
    methodVersion: "d1-strain-resolve/v1"
    status: PROPOSED
    producedBy: { missionId: "mission:ft-D1-fixtures", runId: "run:ft-D1-lgg-strain-resolution" }
  - id: e02-same-material-two-labels
    assessmentKind: EQUIVALENCE
    assessmentSubkind: "D1.identity-level.SAME_BRANDED_MATERIAL"
    about: [ { ref: lv-us-250851, type: LabelVersion, module: D6 }, { ref: lv-us-273846, type: LabelVersion, module: D6 } ]
    inputAssertions: [g08-declares-250851, g09-count-250851, g10-declares-273846, g11-count-273846, g01-lgg-derived-from-strain]
    summary: "Both labels declare 40 mg of the LGG material (same mark, same strain). Counts differ (10 vs 12 billion CFU per 40 mg), so SAME_SPECIFICATION is not supported: the CFU density per mg of material differs or one label states an overage — a D6/D8 question, not a D1 identity split."
    methodVersion: "d1-equivalence/v1"
    status: PROPOSED
    producedBy: { missionId: "mission:ft-D1-fixtures", runId: "run:ft-D1-lgg-strain-resolution" }
