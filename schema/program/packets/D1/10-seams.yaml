version: 1
module: D1
# MODEL stage (Wave 2), A2, 2026-10-08; re-verified in the CHECK stage (2026-10-08) against the sibling SDLs in worktrees
# A1 (K sha256 790e7244…, D10), A3 (D2, D4), A4 (D3), A5 (D5), A6 (D6, D7), A7 (D8, D13), A8 (D9, D11) and A2 (D12).
# D1 declares NO relationship to a type outside the module: all seven D1 relationship types are D1 → D1. Every typed
# seam below is an edge another module declares INTO (or, for D2, stored from) a D1 type (owner: other), with the field,
# union and property type found in that module's 04-schema-proposal.graphql. `questions` lists the D1 questions that read
# the seam ([] when only the other module's questions use it; their ids resolve in their own 02-questions.md).
# Check-stage changes: D6 FormulationVersion → LabelVersion (no ChemicalSubstance target); D3 StudyArm → InterventionComponent;
# D8 PATENT_ABOUT / RegulatoryStatus → CONCERNS / LegalStatus; D4 HAS_ANALYTE structural; D2, D5, D8 MEASURES_ANALYTE and
# D12 PATTERN_COMPONENT added; kernel enums / edge-property types moved under sharedVocabularies `kernel-types` (K rule 9).
# Adversarial-review changes (2026-10-08, re-read in the A1, A4, A5, A6, A7 worktrees the same evening): D6 DECLARES_COMPONENT
# is asserted with massBasis (D1 MassBasis); D3 dropped its MassBasis copy; ADMINISTERS and D8 CONCERNS are
# AssertedRecordedProperties; the kernel cut the Mention node; HAS_UPPER_LIMIT needs D1.Constituent as a subject;
# MEASURES_ANALYTE and question lists trimmed to the questions whose 03 pattern traverses the seam.
seams:
  # ---- declared by other modules into D1 types (verified in their SDL) ----
  - { type: DECLARES_COMPONENT, from: D6.LabelVersion, to: "D1.IngredientMaterial | D1.Constituent", questions: [CQ-PF-01, Q-D1-05, CQ-ID-03, Q-D1-14, Q-D1-16, Q-D1-19, Q-D1-21, Q-D1-24, Q-D1-25], direction: OUT, owner: other, note: "field LabelVersion.components, union DeclaredComponentTarget = IngredientMaterial | Constituent | FoodItem (3). D6 adversarial review (A6 worktree, uncommitted at 22:00): asserted line, ComponentLineProperties = kernel AssertedRecordedProperties + orderIndex, parentOrderIndex, lineRole, declaredNameVerbatim, amount, unitCode, amountReferent, massBasis (D1 MassBasis), amountBasis, dailyValuePercent, formVerbatim, statementVerbatim; each line has its own Assertion (predicate DECLARES_COMPONENT), which D1's CALCULATED amounts cite in DERIVED_FROM. No ChemicalSubstance target: a chemical line resolves to a CHEMICALLY_DEFINED IngredientMaterial. OQ-D1-24 resolved" }
  - { type: HAS_LABEL_VERSION, from: D6.Package, to: D6.LabelVersion, questions: [Q-D1-02, Q-D1-03, Q-D1-05, Q-D1-25], direction: OUT, owner: other, note: "read-only for D1: StateEpisodeProperties episode = which label was current at $vt; path ProductVariant -HAS_PACKAGE-> Package -HAS_LABEL_VERSION-> LabelVersion" }
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D1.IngredientMaterial, questions: [CQ-ID-06, CQ-ST-02, Q-D1-14], direction: OUT, owner: other, note: "field InterventionComponent.administers, union AdministeredMaterial (6; no ChemicalSubstance), AssertedRecordedProperties (D3 04, verified 2026-10-08); dose on the component node (quantity, unitCode, quantityBasis, massBasis: D1 MassBasis — D3 removed its own copy in its adversarial review); path Study -HAS_ARM-> StudyArm -HAS_COMPONENT-> InterventionComponent. A trial-batch purity is a D3 FIELD Assertion on the component (fixture nr-trial-unstructured t02), never D1 MATERIAL_CONTAINS" }
  - { type: FOOD_CONTAINS, from: D12.FoodItem, to: "D1.ChemicalSubstance | D1.Constituent", questions: [Q-D1-22], direction: OUT, owner: other, note: "field FoodItem.components, union FoodComponentTarget (2). D12's adversarial review (same worktree, in progress at 22:00) moves statementKind (D1 ContentStatementKind), quantity and unitCode onto a D12-local FoodContentProperties (AssertedRecordedProperties superset) — the same field names as D1 ContentEdgeProperties, so material and food content filter with one shape (OQ-D1-22)" }
  - { type: PATTERN_COMPONENT, from: D12.DietaryPattern, to: D1.Constituent, questions: [], direction: OUT, owner: other, note: "union PatternComponentTarget (3), AssertedRecordedProperties ('limit added sugars'); serves D12's questions" }
  - { type: HAS_ANALYTE, from: D4.Biomarker, to: D1.ChemicalSubstance, questions: [], direction: OUT, owner: other, note: "field Biomarker.analytes, StructuralEdgeProperties; NAD+ and other small-molecule analytes are D1 substances; serves D4/D2 questions" }
  - { type: PARTICIPATES_IN, from: D1.ChemicalSubstance, to: D2.Mechanism, questions: [], direction: OUT, owner: other, note: "stored D1 → D2, declared on D2 only (field Mechanism.metaboliteParticipants, direction IN, MechanismReferenceProperties); endogenous metabolites (NAD+, NMN) are D1 substances; D1 gets no field" }
  - { type: AFFECTS_MECHANISM, from: D1.ChemicalSubstance, to: "D2.Mechanism | D2.MolecularEntity", questions: [Q-D1-28], direction: OUT, owner: other, note: "derived projection d2.affects-mechanism/v1 declared by D2 (Mechanism.affectedBy, union MechanismModulator; MolecularEntity.affectedBy), read-only; D1 declares nothing" }
  - { type: EXPOSED_TO, from: D2.MechanismEvidenceContext, to: "D1.ChemicalSubstance | D1.IngredientMaterial", questions: [], direction: OUT, owner: other, note: "union ContextExposure (3), structural ExposureRoleProperties; serves D2 questions" }
  - { type: STEP_USES, from: D5.ProtocolStep, to: "D1.ChemicalSubstance | D1.IngredientMaterial", questions: [], direction: OUT, owner: other, note: "union StepMeans (6), StructuralEdgeProperties; serves D5 questions" }
  - { type: CONCERNS, from: D8.Patent, to: "D1.ChemicalSubstance | D1.IngredientMaterial", questions: [Q-D1-17], direction: OUT, owner: other, note: "union PatentTopic (2), AssertedRecordedProperties (D8 04, verified 2026-10-08); crystal-form patents attach to the material carrying physicalForm (ChemicalForm cut; OQ-D1-04)" }
  - { type: CONCERNS, from: D8.RegulatoryRecord, to: "D1.ChemicalSubstance | D1.IngredientMaterial", questions: [], direction: OUT, owner: other, note: "union RegulatoryRecordTopic (5), AssertedRecordedProperties: determinations, warning letters, NDI notifications; serves D8 questions (Q-D1-18 reads STATUS_OF, not this edge)" }
  - { type: STATUS_OF, from: D8.LegalStatus, to: "D1.ChemicalSubstance | D1.IngredientMaterial", questions: [Q-D1-18], direction: OUT, owner: other, note: "union LegalStatusSubject (4), AssertedEdgeProperties episode (NMN: EXCLUDED_FROM_DEFINITION and its successor)" }
  - { type: MEASURES_ANALYTE, from: D8.QualityResult, to: "D1.ChemicalSubstance | D1.IngredientMaterial | D1.Constituent", questions: [], direction: OUT, owner: other, note: "union QualityAnalyte (3); lot/COA measured content is D8, never MATERIAL_CONTAINS; serves D8 questions (Q-D1-09's pattern reads MEASURED_CONTENT_IN_PRODUCT Assertions and only names this edge in a comment)" }
  - { type: MENTIONS, from: D9.Chunk, to: "K.Subjectable (ChemicalSubstance, IngredientMaterial, Constituent, Taxon)", questions: [Q-D1-08], direction: OUT, owner: other, note: "derived (DerivedEdgeProperties, entity-link/vN), declared on D9 Chunk.mentions against Subjectable, licensed by a RESOLUTION Assessment; the kernel cut its Mention node in its adversarial review (a surface form is a locator + RESOLUTION Assessment with surfaceForm= facets); never evidence; costs D1 nothing" }
  - { type: COVERS_LOCATOR, from: D9.Chunk, to: K.SourceLocator, questions: [Q-D1-08], direction: OUT, owner: other, note: "derived span-overlap/v1; the chunk → locator hop of the 00-DIRECTIVE 3.8 path (fixture nr-trial-unstructured); CHUNK_OF → SourceSnapshot" }
  - { type: ASSESSES, from: K.Assessment, to: "K.Subjectable (ChemicalSubstance, IngredientMaterial, Constituent, Taxon)", questions: [Q-D1-06, Q-D1-07, CQ-ID-06, Q-D1-08, Q-D1-12, Q-D1-15, Q-D1-27, Q-D1-28], direction: OUT, owner: other, note: "kernel Assessment (not on the packet-check allowlist): EQUIVALENCE (subkinds D1.identity-level.*), RESOLUTION, APPLICABILITY (D1.dose-mass-basis, D1.form-transfer), SAFETY_SIGNAL (D5 kind, effectDirection HARM)" }
  - { type: ASSESSES, from: K.Report, to: "K.Subjectable (ChemicalSubstance, IngredientMaterial, Constituent)", questions: [Q-D1-19], direction: OUT, owner: other, note: "published comparison (reportKind COMPARISON) of forms/products by derived amount; D10 method; also D10 ReportItem rows (D10 seams still name D1.Compound / D1.IngredientForm — rename to ChemicalSubstance / IngredientMaterial, OQ-D1-31)" }
  - { type: HAS_IDENTIFIER, from: K.Identifier, to: "K.Subjectable (ChemicalSubstance, IngredientMaterial, Constituent, Taxon)", questions: [CQ-ID-04, Q-D1-06, Q-D1-15, Q-D1-26], direction: IN, owner: other, note: "kernel IdentifierLinkProperties episode; schemes in 06-node-register.yaml; requests OQ-D1-07 (in identifier-schemes.yaml v2 as status requested)" }
  # ---- predicate-level seams (no typed edge; kernel Assertion subject/object only) ----
  - { type: "Assertion.predicate INTENDED_FOR_TARGET | IMPROVES_TARGET | WORSENS_TARGET | NO_EFFECT_ON_TARGET | MIXED_EFFECT_ON_TARGET", from: "D1.ChemicalSubstance | D1.IngredientMaterial", to: D5.Target, questions: [Q-D1-23], direction: OUT, owner: other, note: "D5 seam rule; population qualifier mandatory; no D1 field or property points at a Target" }
  - { type: "Assertion.predicate HAS_UPPER_LIMIT | HAS_AUTHORIZED_DOSE_RANGE | USE_CONSTRAINED_IN | INTERACTS_WITH | CAUSES_ADVERSE_EFFECT", from: "D1.ChemicalSubstance | D1.IngredientMaterial | D1.Constituent", to: "literal | D2.Condition | D1/D6/D12/D5 means", questions: [Q-D1-03, Q-D1-27], direction: OUT, owner: other, note: "D5 predicates. D1 uses HAS_UPPER_LIMIT with subject D1.Constituent (nutrient thresholds: UL 100 mg B6, TGA bands) and qualifier limitKind:<UL | MONOGRAPH_MAX | LABEL_MAX | SCHEDULING_THRESHOLD | LABEL_WARNING_THRESHOLD>; requested from D5: Constituent as subject + the last two limitKind values (OQ-D1-03). DOSE_THRESHOLD is no longer used" }
  - { type: "Assessment.facets plantPart=<D1 PlantPart>", from: "K.Assessment (SAFETY_SIGNAL, D5 kind)", to: "D1.Taxon | D1.IngredientMaterial | D1.ChemicalSubstance", questions: [Q-D1-12], direction: OUT, owner: other, note: "registered facet (kernel M9 facets slot; values from D1 PlantPart) that restricts a D5 safety signal to a plant part; a signal without it applies to every part; fixture ashwagandha-plant-part-harm s03 (plantPart=LEAF). D5 to register it for SAFETY_SIGNAL (OQ-D1-33)" }
  - { type: "Assertion.predicate SUPPLIES_MATERIAL | MANUFACTURES_MATERIAL", from: D7.Organization, to: D1.IngredientMaterial, questions: [Q-D1-16, Q-D1-17], direction: OUT, owner: this, note: "predicate-only in D1 and in D7 (OQ-D7-28); D7's SUPPLIED_BY row (IngredientMaterial → Organization, 'D1 or D8') is the same relation reversed — D1 keeps it predicate-only (OQ-D1-31)" }
  - { type: "Assertion.predicate MARKETED_UNDER_MARK", from: D1.IngredientMaterial, to: "D8 trademark record | D7.Organization", questions: [Q-D1-16], direction: OUT, owner: this, note: "predicate-only" }
  - { type: "Assertion.predicate MEASURED_CONTENT_IN_PRODUCT | CONTAINS_UNDECLARED_SUBSTANCE", from: "D6.ProductVariant | D8.Lot", to: D1.ChemicalSubstance, questions: [Q-D1-09, Q-D1-10], direction: OUT, owner: this, note: "analytical-survey findings that name no lot (OQ-D1-08); lot-level results are D8 MEASURES_ANALYTE" }
  - { type: "Assertion.predicate MOIETY_EQUIVALENT_AMOUNT | NUTRIENT_EQUIVALENT_AMOUNT | PER_MAX_DAILY_DOSE_AMOUNT | DECLARATION_STOICHIOMETRY_CHECK | EXCEEDS_DOSE_THRESHOLD", from: "D6.LabelVersion | D3.InterventionComponent", to: "D1.ChemicalSubstance | D1.Constituent", questions: [CQ-PF-01, Q-D1-02, Q-D1-03, Q-D1-05, Q-D1-19, Q-D1-20, Q-D1-24], direction: OUT, owner: this, note: "CALCULATED kernel Assertions written by the D1 PROJECTION Activity (d1-amounts/v1) with DERIVED_FROM inputs (the D6 line's own DECLARES_COMPONENT Assertion, MW fields, identity edges' assertions, the predicate-only NUTRIENT_EXPRESSED_AS Assertion); a threshold screen is one Assertion per (label version, threshold); never edges" }
  - { type: "Assertion.predicate NUTRIENT_EXPRESSED_AS", from: D1.Constituent, to: D1.ChemicalSubstance, questions: [Q-D1-02, Q-D1-19, Q-D1-20], direction: OUT, owner: this, note: "predicate-only since the adversarial review (05 predicateOnly): jurisdiction qualifier and valid time on the Assertion; read by the projection" }
  - { type: "Assertion.predicate ADMINISTERED_MATERIAL_PURITY", from: D3.InterventionComponent, to: literal, questions: [Q-D1-08, CQ-ID-06], direction: OUT, owner: other, note: "FIELD Assertion on the D3 component (purity of the batch as administered, e.g. 99 % NR chloride); requested from D3 (OQ-D1-26)" }
  - { type: "Assertion.predicate FORMS_DURING_PREPARATION | PREPARATION_CHANGES_CONTENT | DERIVED_FROM_TAXON", from: "D1.ChemicalSubstance | D12.FoodItem", to: "D12.FoodItem | D1.ChemicalSubstance | D1.Constituent | D1.Taxon", questions: [Q-D1-22], direction: OUT, owner: other, note: "D12 predicate-only seams (food → source taxon reuses the D1 DERIVED_FROM_TAXON name as a predicate, not a typed edge)" }
  - { type: "Assertion.predicate EVENT_ABOUT", from: D13.Event, to: D1.ChemicalSubstance, questions: [Q-D1-18], direction: OUT, owner: other, note: "D13 predicate-only (D13 seams still name D1.Compound, OQ-D1-31); compounds reach a frontier only through events and studies (D13 seam rule)" }

sharedVocabularies:
  - name: targets
    owner: D5
    ref: packets/D5/vocab-targets.yaml (A5 worktree)
    use: "objects of target-effect Assertions about D1 substances and materials (Q-D1-23). No D1 typed edge or property points at a Target."
  - name: frontiers
    owner: D13
    ref: packets/D13/vocab-frontiers.yaml (A7 worktree)
    use: "consumed only indirectly: compounds reach a frontier through the events they are involved in and the studies that test them; D1 declares nothing."
  - name: identifier-schemes
    owner: K
    ref: packets/K/identifier-schemes.yaml (A1 worktree, v2)
    use: "UNII, INCHIKEY, PUBCHEM_CID, CAS_RN, CHEBI, DRUGBANK, RXCUI, MESH, WIKIDATA; requested NCBI_TAXON, CULTURE_COLLECTION, DSLD_INGREDIENT, LNHPD_INGREDIENT, SUPPLIER_CODE, FDC_NUTRIENT (OQ-D1-07)"
  - name: kernel-types
    owner: K
    ref: packets/K/04-schema-proposal.graphql (sha256 790e7244…)
    use: "kernel types D1 references that are outside packet-check's allowlist (K rule 9): enums PrivacyClass (Entity field on all 4 node types), TimePrecision and ValidTimeBasis (ContentEdgeProperties base fields); edge-property type AssertedRecordedProperties (HAS_ACTIVE_MOIETY, COUNTS_TOWARD_NUTRIENT, REALIZES_SUBSTANCE, DERIVED_FROM_TAXON); read-side only: Assessment (ASSESSES; `facets` slot for plantPart=, Q-D1-12) and Report, IdentifierLinkProperties (HAS_IDENTIFIER episodes, CQ-ID-04). Re-compiled in the adversarial review against kernel sha256 b2c2b1b0… (Mention node cut)."

# Vocabularies D1 PROVIDES to other modules.
providedVocabularies:
  - { name: MassBasis, owner: D1, consumers: [D3, D6], note: "SALT_FORM | ACTIVE_MOIETY | NUTRIENT_EQUIVALENT | MATERIAL_AS_IS | UNSPECIFIED; the one mass-basis vocabulary: D3 InterventionComponent.massBasis (D3 deleted its duplicate enum MassBasis in its adversarial review) and D6 ComponentLineProperties.massBasis (D6 adversarial review; AmountReferent keeps only referent values). No D1 field uses it since the review (content mass basis is an Assertion qualifier). Duplicate declaration resolved: OQ-D1-32" }
  - { name: ContentStatementKind, owner: D1, consumers: [D12], note: "STANDARDIZATION_CLAIM | DEFINITIONAL_COMPOSITION | TYPICAL_COMPOSITION_REPORTED | MEASURED_IN_SAMPLE | QUALITATIVE_PROVIDES | CALCULATED; D12 FoodContentProperties.statementKind (D12 adversarial review, in progress)" }
  - { name: QuantityComparator, owner: D1, consumers: [], note: "EQ | APPROX | GTE | GT | LTE | LT | BETWEEN; spelling aligned with D5 ThresholdComparator (GTE/LTE) in the adversarial review; offered to D12 and D5; D8 SpecComparator (NOT_LESS_THAN …) is a third spelling for the synthesizer (OQ-D1-34)" }
  - { name: "derivation rules rule:mw-ratio.v1, rule:nutrient-equivalent.v1, rule:daily-max.v1", owner: D1, consumers: [D3, D5, D6, D10], note: "named derivation rules for CALCULATED Assertions; rule table versioned with the PROJECTION Activity methodVersion d1-amounts/v1 (OQ-D1-19)" }
