version: 1
module: K
# A1 model stage, 2026-10-08; adversarial review 2026-10-08: MENTIONS left the kernel SDL with Mention (D9 declares it
# on Chunk with kernel meaning and registers it) and Adjudication.considers was cut. One entry per relationship type
# declared in 04-schema-proposal.graphql (13 types, 32 fields = packet-check pairs; inverse fields of the same stored
# edge count once each, see 09-reasoning.md "Size").
# `declaredOn` lists the GraphQL fields that expose the type (OUT = stored direction from that type, IN = inverse).
# Tool ids in populatedBy are stable ids the fixtures stage lists in 08-sources-and-tools.md:
#   tool:kg-executor (biotech-knowledge-intent.v1 apply), tool:ks-verification (verification.v1 service and sealed bundles),
#   tool:mission-control (run identity), tool:ncbi-eutils, tool:pubmed-mcp, tool:crossref-rest, tool:wikidata-api,
#   tool:bioregistry-api, tool:tavily-search, tool:tavily-extract, tool:firecrawl-scrape, tool:http-capture,
#   tool:entity-link-projection (RESOLUTION Assessments and the derived D9 Chunk MENTIONS, method entity-link/vN).
relationships:
  - type: HAS_SNAPSHOT
    class: structural
    from: Source
    to: SourceSnapshot
    declaredOn: [Source.snapshots (OUT), SourceSnapshot.source (IN)]
    edgeProperties: StructuralEdgeProperties
    cardinality: one Source to one_or_more snapshots; each snapshot exactly_one Source
    temporal: recorded-only
    questions: [Q-K-02, Q-K-10, Q-K-17, Q-K-22, Q-K-26, CQ-TM-03]
    pattern: "03#Q-K-10"
    populatedBy: [tool:kg-executor, tool:ncbi-eutils, tool:crossref-rest, tool:http-capture, tool:firecrawl-scrape]
    fixture: 07-fixtures/retracted-sah-2017-stale-evidence
    nestedOperations: "[CREATE, CONNECT] on Source.snapshots; [CONNECT] on the inverse"
    aggregate: false
    rationale: >-
      A changed page is a new snapshot, never an edit; revision status (retraction) is read by comparing two snapshots of
      one Source, so the source → captures edge must be traversed. Replaces PRIOR_SNAPSHOT / RESULTING_SNAPSHOT /
      REVISES_SOURCE (revisionKind + revisesSnapshotUid on the later snapshot).
  - type: HAS_LOCATOR
    class: structural
    from: SourceSnapshot
    to: SourceLocator
    declaredOn: [SourceLocator.snapshot (IN)]
    edgeProperties: StructuralEdgeProperties
    cardinality: each locator exactly_one snapshot; a snapshot many locators
    temporal: recorded-only
    questions: [Q-K-01, Q-K-10, Q-K-14, Q-K-20, Q-K-28]
    pattern: "03#Q-K-01"
    populatedBy: [tool:kg-executor, tool:ks-verification]
    fixture: 07-fixtures/hubbard-2013-unstructured-to-entity
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: A locator is meaningful only on one captured representation (Web Annotation States; verification.v1 SourceFragment.captureId); every trace to bytes crosses this edge.
  - type: HAS_SUBJECT
    class: structural
    from: Assertion
    to: Subjectable
    declaredOn: [Assertion.subject (OUT)]
    edgeProperties: null
    cardinality: exactly_one per Assertion
    temporal: recorded-only
    questions: [Q-K-01, Q-K-02, Q-K-05, Q-K-15, Q-K-22, Q-K-27, CQ-AX-04]
    pattern: "03#Q-K-02"
    populatedBy: [tool:kg-executor]
    fixture: 07-fixtures/resveratrol-sirt1-evidence-mission
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: The kernel pattern's one any-entity subject edge (interface target, ≈0 cost per implementer); replaces the 144-member AssertionSubjectTarget union.
  - type: HAS_OBJECT
    class: structural
    from: Assertion
    to: Subjectable
    declaredOn: [Assertion.object (OUT)]
    edgeProperties: null
    cardinality: zero_or_one per Assertion (exclusive with the typed literal)
    temporal: recorded-only
    questions: [Q-K-01, Q-K-02, Q-K-04, Q-K-07]
    pattern: "03#Q-K-04"
    populatedBy: [tool:kg-executor]
    fixture: 07-fixtures/hubbard-2013-unstructured-to-entity
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: Binds the object of a relationship assertion; with HAS_SUBJECT it lets lineage find the asserted edge an Assertion authorized with both endpoints bound (no relationship scan).
  - type: ASSERTED_BY
    class: structural
    from: Assertion
    to: Subjectable
    declaredOn: [Assertion.assertedBy (OUT)]
    edgeProperties: null
    cardinality: exactly_one per Assertion (Person, Organization or Agent; executor-validated)
    temporal: recorded-only
    questions: [Q-K-01, Q-K-09, Q-K-11, Q-K-15, Q-K-22, Q-K-23, Q-K-27]
    pattern: "03#Q-K-23"
    populatedBy: [tool:kg-executor]
    fixture: 07-fixtures/seller-claim-occurrences
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: One asserter per Assertion (OPEN-QUESTIONS 6); asserter track records and interested-party checks traverse it. Not the producing software (that is the Activity's Agent).
  - type: HAS_EVIDENCE
    class: structural
    from: [Assertion, Adjudication, Assessment, Report]
    to: SourceLocator
    declaredOn: [Assertion.evidence, Adjudication.evidence, Assessment.evidence, Report.evidence]
    edgeProperties: EvidenceEdgeProperties
    cardinality: Assertion one_or_more (role SUPPORTS, origin DECLARED; never authority / independence / facet); Adjudication many (VERIFIER_FOUND, carries the verifier's authority / independence / facet); Assessment / Report many (a RESOLUTION Assessment cites the surface-form span with role CONTEXT)
    temporal: recorded-only
    questions: [Q-K-01, Q-K-09, Q-K-13, Q-K-14, Q-K-15, Q-K-16, Q-K-17, Q-K-20, Q-K-21, Q-K-30]
    pattern: "03#Q-K-14"
    populatedBy: [tool:kg-executor, tool:ks-verification]
    fixture: 07-fixtures/hubbard-2013-unstructured-to-entity
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: >-
      Mirrors verification.v1 EvidenceEdge (role, origin, expectedSelectedContentDigest, and now authority, independence,
      facet). Support and contradiction live here, record → locator, never document → entity (00-DIRECTIVE 3.8).
      Replaces SUPPORTED_BY, CONTRADICTED_BY, SUPPORTED_BY_CHUNK and locator → Mention MENTIONS (the surface-form span
      is now cited by the RESOLUTION Assessment directly). authority / independence / facet are written only on
      Adjudication edges (adversarial review), so the extractor's DECLARED edges are never rewritten by a verifier.
  - type: ASSESSES
    class: structural
    from: [Adjudication, Assessment, Report, Activity]
    to: [Assertion, Subjectable]
    declaredOn: [Adjudication.evaluates (OUT → Assertion), Assertion.adjudications (IN), Assessment.about (OUT → Subjectable), Report.about (OUT → Subjectable), Activity.about (OUT → Subjectable), Claim.assessments (IN), Claim.reports (IN)]
    edgeProperties: null
    cardinality: Adjudication one_or_more Assertions; Assessment and Report one_or_more; Activity zero_or_more (EVIDENCE_MISSION exactly one Claim)
    temporal: recorded-only
    questions: [Q-K-05, Q-K-08, Q-K-09, Q-K-11, Q-K-13, Q-K-16, Q-K-19, Q-K-23, Q-K-25, Q-K-26, CQ-AX-04]
    pattern: "03#Q-K-19"
    populatedBy: [tool:kg-executor, tool:ks-verification, tool:mission-control]
    fixture: 07-fixtures/resveratrol-sirt1-evidence-mission
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: >-
      One "judges / is about" type for every judgment and for the evidence mission's charter (Activity → Claim, added in
      the model stage so a mission is tied to the exact Claim it tests even when one vetting run queues many claims).
      Replaces EVALUATES, ABOUT, ASSESSES_SOURCE_AUTHORITY, PROPOSES_MATCH, COMPARES_IDENTITIES. D10 ReportItem may declare
      it with kernel meaning.
  - type: DERIVED_FROM
    class: structural
    from: [Assertion, Assessment, Report]
    to: [Assertion, Assessment]
    declaredOn: [Assertion.derivedFrom, Assessment.inputAssertions, Assessment.inputAssessments, Report.citesAssertions, Report.citesAssessments]
    edgeProperties: null
    cardinality: many
    temporal: recorded-only
    questions: [Q-K-06, Q-K-17, Q-K-18, Q-K-20, Q-K-21, Q-K-25, Q-K-30]
    pattern: "03#Q-K-06"
    populatedBy: [tool:kg-executor, tool:ks-verification]
    fixture: 07-fixtures/two-run-lineage
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: >-
      PROV wasDerivedFrom: inputs of calculated assertions, retellings (occurrence → primary occurrence, basisKind
      CITED_FROM_PRIOR_WORK), assessment inputs, report citations, computed-state inputs (domains declare it with kernel
      meaning; D10 ReportItem.citesAssociations also targets D10 Association). One type makes "what depends on mission
      M" a single variable-length pattern. Replaces DERIVED_FROM_ASSERTION, CONSIDERS_ASSESSMENT, CITES_ASSERTION,
      CITES_ASSESSMENT. Assessment.inputAssessments is instantiated by as-synthesis-general (fixture
      resveratrol-sirt1-evidence-mission) and by D1, D5 and D7 fixtures; Adjudication.considers was cut (deferred).
  - type: OCCURRENCE_OF
    class: structural
    from: Assertion
    to: Claim
    declaredOn: [Assertion.occurrenceOf (OUT), Claim.occurrences (IN)]
    edgeProperties: null
    cardinality: zero_or_one per Assertion (assertionKind CLAIM only); a Claim many occurrences
    temporal: recorded-only
    questions: [Q-K-09, Q-K-11, Q-K-19, Q-K-21, Q-K-23, Q-K-26]
    pattern: "03#Q-K-09"
    populatedBy: [tool:kg-executor]
    fixture: 07-fixtures/resveratrol-sirt1-evidence-mission
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: The claim lifecycle's join from who-said-it-where to the proposition (00-DIRECTIVE 3.4); the extractor knows which proposition it extracted, so it is structural, not a derived INSTANCE_OF.
  - type: WAS_GENERATED_BY
    class: structural
    from: [Assertion, Adjudication, Assessment, Report, Entity]
    to: Activity
    declaredOn: [Assertion.generatedBy, Adjudication.generatedBy, Assessment.generatedBy, Report.generatedBy, Activity.generated (IN, from Entity)]
    edgeProperties: null
    cardinality: one_or_more per node (create and every update; the creator is the earliest Activity)
    temporal: recorded-only
    questions: [Q-K-03, Q-K-04, Q-K-05, Q-K-06, Q-K-07, Q-K-08, Q-K-18, Q-K-20, Q-K-24, CQ-AX-07]
    pattern: "03#Q-K-07"
    populatedBy: [tool:kg-executor, tool:mission-control]
    fixture: 07-fixtures/two-run-lineage
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: The single lineage spine (00-DIRECTIVE 4); written on create and update (executor change P9) so "which missions touched X" and "what changed between runs" are answerable without a database as-of.
  - type: WAS_ASSOCIATED_WITH
    class: structural
    from: Activity
    to: Agent
    declaredOn: [Activity.agents (OUT)]
    edgeProperties: null
    cardinality: one_or_more per Activity
    temporal: recorded-only
    questions: [Q-K-03, Q-K-24]
    pattern: "03#Q-K-24"
    populatedBy: [tool:kg-executor, tool:ks-verification]
    fixture: 07-fixtures/two-run-lineage
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: Which model, prompt and skill version produced a run's records (producer error rate, replay); replaces ASSESSED_BY.
  - type: WAS_INFORMED_BY
    class: structural
    from: Activity
    to: Activity
    declaredOn: [Activity.informedBy (OUT)]
    edgeProperties: null
    cardinality: many
    temporal: recorded-only
    questions: [Q-K-06, Q-K-08]
    pattern: "03#Q-K-06"
    populatedBy: [tool:mission-control, tool:kg-executor]
    fixture: 07-fixtures/two-run-lineage
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: PROV wasInformedBy (vetting run → evidence mission, research → ingestion, mission → its VERIFICATION run); OpenLineage parent-run facet is the same idea.
  - type: HAS_IDENTIFIER
    class: asserted
    from: Subjectable
    to: Identifier
    declaredOn: [Identifier.identifies (IN)]
    edgeProperties: IdentifierLinkProperties
    cardinality: many (one episode per authorizing Assertion)
    temporal: episode
    questions: [Q-K-12, Q-K-29]
    pattern: "03#Q-K-12"
    populatedBy: [tool:kg-executor, tool:wikidata-api, tool:ncbi-eutils, tool:bioregistry-api]
    fixture: 07-fixtures/resveratrol-identifier-crosswalk
    nestedOperations: "[CONNECT]"
    aggregate: false
    rationale: Declared once on Identifier against the Subjectable interface so no domain re-declares it; assignment validity (GTIN reassigned, code deprecated) needs the episode.

predicateOnly:
  - predicate: RATES_CLAIM
    meaning: a third party's verdict on a Claim (ClaimReview, regulator finding); subject Claim, valueString rating, qualifier scale, asserter the reviewer
    promoteWhen: Q-K-27 needs GraphQL edge filters by reviewer across thousands of claims (today a Cypher join from the Claim)
  - predicate: HAS_REVISION_STATUS
    meaning: retraction / expression of concern / erratum status of a Source, one Assertion per authority (publisher, Retraction Watch, PubMed)
    promoteWhen: Q-K-22 has to rank authorities per Source in GraphQL without Cypher
  - predicate: FIELD_NOT_REPORTED
    meaning: the source was read for field F and does not report it (CQ-AX-04; D4 convention made kernel-wide)
    promoteWhen: never as an edge (it has no object)
  - predicate: CITES_AS_SUPPORT
    meaning: an occurrence's own reference list entry when the cited work cannot be resolved to an occurrence Assertion
    promoteWhen: Q-K-30 needs reference-list traversal for unresolved citations
  - predicate: HAS_CREDENTIAL
    meaning: a speaker's stated credential (checked by D7/D9)
    promoteWhen: Q-K-23 track records filtered by credential
  - predicate: HAS_IDENTIFIER
    meaning: the Assertion that authorizes each HAS_IDENTIFIER episode (written by identifier.attach)
    promoteWhen: already typed (HAS_IDENTIFIER edge); the predicate value is the authorization record
deferred:
  - { type: USED, reason: "PROV used; the claim a mission tests is Activity ASSESSES Claim, inputs of judgments are DERIVED_FROM; no question traverses generic usage" }
  - { type: TESTS_CLAIM, reason: "considered for mission → Claim in the model stage; ASSESSES with kernel meaning carries it without a 15th type" }
  - { type: SUPERSEDES, reason: "supersedesUid + recordedTo on the older record; no question walks chains deeper than one hop" }
  - { type: REANCHORS, reason: "SourceLocator.reanchorsLocatorUid + reanchorMatch" }
  - { type: PRIOR_SNAPSHOT, reason: "SourceSnapshot.revisesSnapshotUid" }
  - { type: RESULTING_SNAPSHOT, reason: "SourceSnapshot.revisionKind on the later capture" }
  - { type: ANNOUNCED_IN, reason: "the notice is its own Source; HAS_REVISION_STATUS assertion cites its locator" }
  - { type: REVISES_SOURCE, reason: "revisionKind + revisesSnapshotUid on the later snapshot of the same Source" }
  - { type: SUPPORTED_BY, reason: "HAS_EVIDENCE {role: SUPPORTS}" }
  - { type: CONTRADICTED_BY, reason: "HAS_EVIDENCE {role: CONTRADICTS}" }
  - { type: SUPPORTED_BY_CHUNK, reason: "a chunk is never evidence; D9 COVERS_LOCATOR (derived) then HAS_EVIDENCE" }
  - { type: EVALUATES, reason: "ASSESSES" }
  - { type: ABOUT, reason: "ASSESSES (W20 Document ABOUT → D9 decides for its containers)" }
  - { type: PROPOSES_MATCH, reason: "RESOLUTION Assessment ASSESSES the candidate and cites the surface-form span (HAS_EVIDENCE role CONTEXT)" }
  - { type: COMPARES_IDENTITIES, reason: "EQUIVALENCE Assessment ASSESSES both identities" }
  - { type: COMPETES_WITH, reason: "competing hypotheses are sibling RESOLUTION Assessments citing the same span" }
  - { type: RESOLVES_MENTION, reason: "the accepted RESOLUTION Assessment is the licence; the derived D9 Chunk MENTIONS names it in derivedFromAssessmentUids" }
  - { type: "MENTIONS on Mention (Mention.resolvedTo)", reason: "cut with Mention in the adversarial review: it restated what the RESOLUTION Assessment records; MENTIONS stays a kernel-meaning type declared and registered by D9 on Chunk" }
  - { type: "DERIVED_FROM on Adjudication (Adjudication.considers)", reason: "cut in the adversarial review: nothing populated it (verification.v1 Judgment carries fragments, not assessment inputs) and per-evidence authority is on HAS_EVIDENCE; promote when a question needs the assessments a judgment weighed (e.g. Q-K-15 reading a SOURCE_AUTHORITY register entry through the judgment)" }
  - { type: DERIVED_FROM_ASSERTION, reason: "DERIVED_FROM" }
  - { type: CONSIDERS_ASSESSMENT, reason: "DERIVED_FROM" }
  - { type: CITES_ASSERTION, reason: "DERIVED_FROM (W23)" }
  - { type: CITES_ASSESSMENT, reason: "DERIVED_FROM (W23)" }
  - { type: INSTANCE_OF, reason: "OCCURRENCE_OF (structural); re-clustering is an EQUIVALENCE Assessment" }
  - { type: ASSESSED_BY, reason: "the Activity's Agent (WAS_ASSOCIATED_WITH)" }
  - { type: ACTED_ON_BEHALF_OF, reason: "deferred to a D7 seam if a question asks which organization's agent asserted" }
  - { type: AUTHORIZED_BY, reason: "policyVersion string on Report and Activity; D10 promotes PolicyVersion if a question traverses it" }
  - { type: DECLARES_CRITERION, reason: "D10 (DecisionCriterion)" }
  - { type: QUALIFIED_BY, reason: "Assertion.qualifiers (verification.v1 qualifiers)" }
  - { type: OBSERVED_IN_CONTEXT, reason: "qualifier or D3/D4 context node owned by the domain" }
  - { type: LOCATES_REGION, reason: "BOUNDING_BOX selector in SourceLocator.selectorJson; regions of media assets are D9" }
  - { type: LOCATOR_IN_TEXT_VERSION, reason: "D9 Chunk carries textVersionHash; locator offsets carry their basis in selectorJson" }
  - { type: RESOLVES_TO_CHUNK, reason: "D9 COVERS_LOCATOR (derived)" }
  - { type: TEXT_OF_SNAPSHOT, reason: "D9 CHUNK_OF" }
  - { type: HAS_TEXT_VERSION, reason: "D9 (text version absorbed into Chunk properties)" }
  - { type: RENDITION_OF, reason: "D9 (MediaWork ← Source, declared on the D9 type)" }
  - { type: MENTIONS_ENTITY, reason: "MENTIONS (derived) from D9 Chunk" }
  - { type: ASSESSED_ON_SNAPSHOT, reason: "SOURCE_AUTHORITY Assessment HAS_EVIDENCE the snapshot's locator (WHOLE_SNAPSHOT)" }
  - { type: ASSESSES_SOURCE_AUTHORITY, reason: "ASSESSES (Assessment kind SOURCE_AUTHORITY → Source) plus per-evidence authority on HAS_EVIDENCE" }
  - { type: DISCOVERED_SOURCE, reason: "operational discovery log → D11 action-space registry" }
  - { type: FOR_COVERAGE_REQUIREMENT, reason: "operational coverage plan → D11 action-space registry" }
  - { type: "W20 HAS_CHUNK, HAS_SEGMENTATION, FROM_TEXT_VERSION, NEXT_CHUNK, OCCURS_IN_SEGMENT, AUTHORED_BY, PRESENTED_AT, SPONSORS_CONTENT", reason: "D9 (documents, chunks, containers, sponsorship)" }
