# has two snapshots of one Source: an Internet Archive capture of 2024-08-16 (no retraction) and the live 2026-10-08 page
# ("Retraction in:"), recorded as revisionKind RETRACTION on the later snapshot. Three authorities state the retraction, each
# as its own HAS_REVISION_STATUS Assertion (Retraction Watch via Crossref, NLM via PubMed, the publisher via its page and notice),
# and they disagree on the date. The occurrences extracted from the 2024 snapshot are not deleted: Q-K-10 lists them as stale,
# Q-K-17 flags the report that cites one, CQ-TM-02 shows the late-arriving valid time.
# Conventions: see ../resveratrol-sirt1-evidence-mission/assertions.yaml.

