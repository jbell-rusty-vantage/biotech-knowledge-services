# D6 — seams (model stage, A6, 2026-10-08; adversarial-review stage 2026-10-08)
# direction is from D6's point of view: out = D6 declares the field on its own type pointing at the other module;
# in = the other module declares the edge on its type pointing at a D6 type (D6 lists it so the synthesizer can check
# both sides). owner: this = D6 declares and registers it; other = the named module declares and registers it.
# Kernel allowlist types (Entity, Subjectable, Assertion, Source, SourceSnapshot, SourceLocator, Adjudication, Activity,
# Agent, Identifier, Mention, AssertedEdgeProperties, DerivedEdgeProperties, StructuralEdgeProperties,
# StateEpisodeProperties) need no seam. Kernel node types outside the allowlist that a D6 question traverses (Claim,
# Assessment, Report) are listed under seams; kernel edge-property types outside it and kernel enums are listed under
# sharedVocabularies: kernel-types (A1 pattern "Kernel types a domain may reference without a seam", change 9).

seams:
  # ---- declared by D6 (out) ----
  - { type: BRANDED_AS, from: D6.Product, to: D7.Brand, questions: [Q-D6-16, Q-D6-20, Q-D6-11, Q-D6-12], direction: out, owner: this, note: "D7 owns Brand and OWNS_BRAND (Organization → Brand, episode). D7 keeps Brand in its SDL and lists this seam with field Product.brand (OQ-D6-03 resolved, check stage)." }
  - { type: SELLER_OF_RECORD, from: D6.Offer, to: D7.Organization, questions: [CQ-CM-01, Q-D6-06, Q-D6-16, Q-D6-20], direction: out, owner: this, note: "no inverse field on Organization (D7 split map: commerce role edges live on D6 types)" }
  - { type: NAMES_RESPONSIBLE_PARTY, from: D6.LabelVersion, to: D7.Organization, questions: [Q-D6-16, Q-D6-04], direction: out, owner: this, note: "no inverse field on Organization" }
  - { type: DECLARES_COMPONENT, from: D6.LabelVersion, to: D1.IngredientMaterial, questions: [CQ-AX-25, CQ-PF-01, Q-D6-02, Q-D6-08, Q-D6-21], direction: out, owner: this, note: "member of union DeclaredComponentTarget; includes D1's unresolved-material sentinel. Asserted since the adversarial-review stage: one Assertion per line (predicate DECLARES_COMPONENT), ComponentLineProperties = kernel AssertedRecordedProperties + line qualifiers incl. massBasis (D1 MassBasis); D1 CALCULATED amounts cite the line Assertion in DERIVED_FROM (D1 OQ-D1-24, D6 OQ-D6-24 closed)" }
  - { type: DECLARES_COMPONENT, from: D6.LabelVersion, to: D1.Constituent, questions: [CQ-PF-01, Q-D6-09, Q-D6-11, Q-D6-12], direction: out, owner: this, note: "nutrient lines (Vitamin D, sodium, energy); type name follows D1's research notes (Constituent incl. Nutrient) — rename with D1's final name" }
  - { type: DECLARES_COMPONENT, from: D6.LabelVersion, to: D12.FoodItem, questions: [Q-D6-11, Q-D6-10, Q-D6-21], direction: out, owner: this, note: "prepared-food ingredient statements (beef patty, pickle slices); if D1/D12 make FoodItem an IngredientMaterial specialization the union shrinks to 2 (OQ-D6-04)" }

  # ---- declared by other modules into D6 (in) ----
  - { type: "OFFERS_INTERVENTION (Assertion.predicate)", from: "D6.Offer | D6.Product (kind SERVICE)", to: D5.Intervention, questions: [], direction: out, owner: this, note: "predicate-only, registered in D6 05 (adversarial-review stage); answers D5 OQ-D5-20 and matches D5/D7 seam rows (D5 Q-D5-17, D7 Q-D7-10): a sold clinic programme, telehealth plan or test service is a D6 Product of kind SERVICE with Offers, and what it delivers is a D5 Intervention through this predicate. No typed edge (no D6 question traverses it)" }
  - { type: OWNS_BRAND, from: D7.Organization, to: D7.Brand, questions: [Q-D6-16, Q-D6-11], direction: in, owner: other, note: "not a D6 edge; listed because Q-D6-16 traverses Product → BRANDED_AS → Brand ← OWNS_BRAND ← Organization" }
  - { type: HAS_REFERENCE_FOOD, from: D6.Product, to: D12.FoodItem, questions: [Q-D6-11], direction: in, owner: other, note: "D12 declares it on its side (direction IN on FoodItem, or on Product if the synthesizer prefers; D12's questions); episode (reformulation changes the mapping)" }
  - { type: IN_FOOD_CATEGORY, from: D6.Product, to: D12.FoodCategory, questions: [], direction: in, owner: other, note: "D12 (source-stated food groups: NOVA, WWEIA); no D6 pattern traverses it (Q-D6-12 filters declared %DV), listed for the synthesizer's two-sided check" }
  - { type: LOT_OF, from: D8.Lot, to: D6.ProductVariant, questions: [Q-D6-04, CQ-AX-19], direction: in, owner: other, note: "D8 declares Lot.lotOf with AssertedRecordedProperties, union LotOfTarget = Product | ProductVariant (checked against A7's D8 SDL, check stage). D6.Package not accepted yet (OQ-D6-13)" }
  - { type: LOT_OF, from: D8.Lot, to: D6.Product, questions: [Q-D6-04], direction: in, owner: other, note: "second member of D8's LotOfTarget (recalls naming only the product)" }
  - { type: CONCERNS, from: D8.RegulatoryRecord, to: D6.Product, questions: [Q-D6-04, Q-D6-05], direction: in, owner: other, note: "D8 names (check stage; was ACTION_CONCERNS from EnforcementAction): RegulatoryRecord with recordFamily ENFORCEMENT, union RegulatoryRecordTopic = ChemicalSubstance | IngredientMaterial | Product | Lot | Patent, AssertedRecordedProperties. Q-D6-21 traverses the IngredientMaterial member (a D8 -> D1 edge), not this row. D6 still asks for D6.Package (OQ-D6-13)" }
  - { type: QUALITY_RESULT_FOR, from: D8.QualityResult, to: D6.Product, questions: [], direction: in, owner: other, note: "D8 measured results (union QualityResultFor = Lot | Product); added in the check stage — D8's seams list it, D6's did not. D8 renamed RESULT_FOR -> QUALITY_RESULT_FOR (D3 owns RESULT_FOR; OQ-D8-30; row renamed in the close-out round). CQ-AX-19 reads QUALITY_RESULT_FOR on the Lot member, so no D6 pattern traverses this row (adversarial-review stage)" }
  - { type: COVERS, from: D8.CertificationListing, to: D6.Product, questions: [CQ-PF-03], direction: in, owner: other, note: "D8 union CertificationCoverageTarget = Product | ProductVariant | Lot | Organization (AssertedEdgeProperties). NSF 'Package Size 30, 60, 90' stays in scopeVerbatim until D8 accepts D6.Package (OQ-D6-13)" }
  - { type: COVERS, from: D8.CertificationListing, to: D6.ProductVariant, questions: [CQ-PF-03], direction: in, owner: other, note: "second D6 member of D8's CertificationCoverageTarget" }
  - { type: STATUS_OF, from: D8.LegalStatus, to: D6.Product, questions: [], direction: in, owner: other, note: "D8 names (check stage; was RegulatoryStatus): LegalStatus.statusOf, union LegalStatusSubject, AssertedEdgeProperties (episode); no D6 pattern traverses it today (D10 may when composing Q-D6-22)" }
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D6.ProductVariant, questions: [CQ-ID-02], direction: in, owner: other, note: "D3 declares ADMINISTERS on InterventionComponent (check stage; was StudyArm); study material identity vs sold variant is a kernel EQUIVALENCE Assessment" }
  - { type: STEP_USES, from: D5.ProtocolStep, to: D6.Product, questions: [], direction: in, owner: other, note: "D5 protocol steps that use a product; no D6 pattern traverses it (D5 questions do)" }
  - { type: DELIVERS, from: D6.Product, to: D4.LabTest, questions: [], direction: in, owner: other, note: "D4 declares it on LabTest.products (direction IN; stored Product → LabTest); a consumer test kit or test service is a D6 Product of kind SERVICE/DEVICE; no D6 question traverses it (D4 questions do). Added in the check stage — D4's seams list it, D6's did not. CONSTRAINS_USE_OF (D5) was removed here: D5 cut it (product constraints are Assertions with the product as subject, D5 OQ-D5-36)" }
  - { type: DELIVERS, from: D6.Product, to: D4.Device, questions: [], direction: in, owner: other, note: "D4 declares it on Device.products (direction IN); replaces pinned EMBODIES_MODEL" }
  - { type: "LINKS_TO_OFFER (Assertion.predicate)", from: D9.MediaWork, to: "D6.Offer | D6.MerchantListing", questions: [CQ-CM-04], direction: in, owner: other, note: "D9 keeps tracked/affiliate links predicate-only (no TrackedLink node; OQ-D6-07 resolved). Answer to D9's question D6-1: object = MerchantListing when the link lands on a product or store page with no displayed price (show-note affiliate URL); Offer only when the link carries a specific purchasable offer (promo-code price, subscription plan)" }

  # ---- kernel types outside the allowlist that D6 uses (no SDL field; listed per A1's rule) ----
  - { type: ASSESSES, from: K.Assessment, to: D6.LabelVersion, questions: [CQ-ID-05, CQ-PF-03, Q-D6-09], direction: in, owner: other, note: "assessmentKind OTHER / APPLICABILITY with assessmentSubkind D6.change-kind, D6.certification-scope, D6.max-intake-vs-reference, D6.blend-disclosure-rule; needs LabelVersion to implement Subjectable (OQ-D6-02)" }
