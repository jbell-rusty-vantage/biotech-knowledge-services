sharedVocabularies:
  - name: kernel-types
    owner: K
    source: C:\Users\Pinda\Proyectos\Biotech\biotech-knowledge-services-A1\schema\program\packets\K\04-schema-proposal.graphql
    types: [AssertedRecordedProperties, IdentifierLinkProperties, PrivacyClass]
    use: >-
      AssertedRecordedProperties is the edge-property type of NAMES_RESPONSIBLE_PARTY (asserted, recorded time only; A1
      M10) and the base of D6's ComponentLineProperties on DECLARES_COMPONENT (superset rule M11, adversarial-review
      stage). IdentifierLinkProperties carries the GTIN/ASIN/SKU episodes of kernel HAS_IDENTIFIER into D6 types (Q-D6-15).
      PrivacyClass is the Entity field listed verbatim on every D6 type. Kernel Assertion fields D6 relies on:
      unitCode `iso4217:<CODE>` for prices (OQ-D6-06 resolved) and validObservedAt for "as of" dates (OQ-D6-19).
      Kernel Assessment slot D6 uses for its subkinds: conclusionCode (OQ-D6-14 resolved; values under
      assessment-subkinds).
  - name: MassBasis
    owner: D1
    source: C:\Users\Pinda\Proyectos\Biotech\biotech-knowledge-services-A2\schema\program\packets\D1\10-seams.yaml
    use: >-
      ComponentLineProperties.massBasis (adversarial-review stage; answers D1 OQ-D1-24 with D1's vocabulary instead of
      D6's former AmountReferent values AS_SALT_FORM / AS_ACTIVE_MOIETY): SALT_FORM | ACTIVE_MOIETY | NUTRIENT_EQUIVALENT
      | MATERIAL_AS_IS | UNSPECIFIED. One owner (D1); D3 (InterventionComponent.massBasis) and D6 reference it, never
      re-declare it. D1's 04 header (adversarial-review stage, uncommitted on 2026-10-08) says MassBasis was removed from
      D1's SDL: the synthesizer must keep exactly one declaration (OQ-D6-26).
  - name: targets
    owner: D5
    source: C:\Users\Pinda\Proyectos\Biotech\biotech-knowledge-services-A5\schema\program\packets\D5\vocab-targets.yaml
    use: >-
      What a product is for or does to a target: kernel Assertion with subject D6.Product (D5's seam row names D6.Product only;
      a variant-level target claim is recorded on its Product with a qualifier), object the
      Target node (uid hu:target:<slug>), predicate from the closed list INTENDED_FOR_TARGET, IMPROVES_TARGET,
      WORSENS_TARGET, NO_EFFECT_ON_TARGET, MIXED_EFFECT_ON_TARGET, one asserter, a locator, a valid time and a mandatory
      population qualifier (UNSPECIFIED when the source names none). Brand target copy (Elysium product_type 'Cellular
      Aging', NSF 'Purpose/Goal') is INTENDED_FOR_TARGET asserted by the brand; weighed conclusions are D10 assessments
      with effectDirection. D6 declares no typed edge to Target. Questions: Q-D6-03, Q-D6-22.
  - name: frontiers
    owner: D13
    source: C:\Users\Pinda\Proyectos\Biotech\biotech-knowledge-services-A7\schema\program\packets\D13\vocab-frontiers.yaml
    use: >-
      Not consumed directly. Per D13's seam rule products never point at a frontier; a product reaches one only through
      D13 Events whose predicate-only EVENT_ABOUT assertions name it (D13 lists D6.Product among EVENT_ABOUT objects;
      D13's typed INVOLVES targets only Organization or Person) and through studies that test it. D6 declares nothing.
  - name: identifier-schemes
    owner: K
    source: C:\Users\Pinda\Proyectos\Biotech\biotech-knowledge-services-A1\schema\program\packets\K\identifier-schemes.yaml
    use: >-
      GTIN, ASIN, SKU, DSLD, NDC, NPN, FDC_ID, WIKIDATA as seeded; requested: RETAILER_ITEM_ID, STOREFRONT_PRODUCT_ID,
      STOREFRONT_VARIANT_ID, MARKETPLACE_SELLER_ID (OQ-D6-05).
  - name: predicates
    owner: K (registry), D6 (values)
    use: >-
      D6 predicate values listed in 05-relationship-register.yaml predicateOnly (OFFER_PRICE_*, MARKET_REFERENCE_PRICE,
      OFFER_AVAILABILITY, OFFER_SUBSCRIPTION_TERMS, CONTAINS_PACKAGE, SOLD_THROUGH_CHANNEL, AUTHORIZES_CHANNEL,
      RETAILER_DISCONTINUED, SUCCEEDED_BY, OFF_MARKET, OFFERS_INTERVENTION, BEARS_SEAL, CALCULATED_DAILY_MAX_INTAKE, ...).
      Used but registered elsewhere: SUPPLIES_MATERIAL (D1/D7; D6's former SOLE_SUPPLIER_OF is now this with qualifier
      exclusivity=SOLE). Provisional names requested from their owners (OQ-D6-27): SAMPLE_POSITIVE_OUTBREAK_STRAIN (D8),
      SOURCED_FROM_COUNTRY (D1/D8).
  - name: assessment-subkinds
    owner: K (assessmentKind), D6 (subkinds)
    use: >-
      Registered subkinds and their conclusionCode vocabularies (kernel Assessment.conclusionCode, A1 M9; adversarial-review
      stage: D6.label-claim-match dropped — a claim's verdict is the kernel SUPPORT Adjudication; three subkinds the
      fixtures used are now registered):
      D6.change-kind (OTHER): LABEL_ONLY | PACKAGE_ONLY | FORMULATION | IDENTITY | UNKNOWN.
      D6.listing-to-package (EQUIVALENCE): DIRECTLY_SUPPORTED | PROPOSED_MATCH | INSUFFICIENT_EVIDENCE | NOT_SAME.
      D6.identifier-equivalence (EQUIVALENCE): SAME_PACKAGE | DIFFERENT_PACKAGE | INSUFFICIENT_EVIDENCE.
      D6.recall-scope (OTHER): IN_SCOPE | NOT_IN_SCOPE | UNKNOWN.
      D6.authorized-channel (OTHER): AUTHORIZED | UNAUTHORIZED | UNKNOWN.
      D6.certification-scope (OTHER): SUPPORTED | SUPPORTED_WITH_QUALIFICATION | NOT_SUPPORTED | UNKNOWN.
      D6.max-intake-vs-reference (OTHER): EXCEEDS_REFERENCE | WITHIN_REFERENCE | NO_REFERENCE (effectDirection HARM only
      when the assessment is also ABOUT a D5 target).
      D6.study-material-match (EQUIVALENCE, with D3): SAME_MATERIAL | DIFFERENT_MATERIAL | UNKNOWN.
      D6.seller-account-to-organization (RESOLUTION): RESOLVED | PROPOSED_MATCH | UNRESOLVED.
      D6.blend-disclosure-rule (APPLICABILITY): BLEND_TOTAL_ONLY_PERMITTED | NON_COMPLIANT_DISCLOSURE | NOT_APPLICABLE.
      D6.recalled-product-harm (SAFETY_SIGNAL): CONTAMINATION_CONFIRMED | CONTAMINATION_SUSPECTED | NOT_CONFIRMED — about
      Product/Package; no effectDirection unless a D5 target is also ABOUT (kernel: harm is a direction on an assessment
      about a target).
