  - { type: ASSESSES, from: K.Assessment, to: D6.Package, questions: [CQ-CM-02, Q-D6-15], direction: in, owner: other, note: "EQUIVALENCE subkinds D6.listing-to-package, D6.identifier-equivalence; also D6.change-kind (fixture as01, as10) and SAFETY_SIGNAL D6.recalled-product-harm (as50) (adversarial-review stage: row added)" }
