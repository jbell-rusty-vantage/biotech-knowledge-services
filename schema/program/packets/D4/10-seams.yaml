version: 1
module: D4
# Every reference from or to a type outside D4 other than the packet-check kernel allowlist. owner: this = D4 declares
# the relationship field (on a D4 type); owner: other = the other module declares it and D4 only consumes it.
# Stub types used for the compile check (scratch only): D1.ChemicalSubstance, D2.Mechanism, D2.MolecularEntity, D6.Product, D7.Organization.
seams:
  # ---- declared by D4 ----
  - { type: HAS_ANALYTE, from: D4.Biomarker, to: D1.ChemicalSubstance, questions: [Q-D4-01, Q-D4-16], direction: OUT, owner: this, note: "D1 planned the same edge (D1 research notes); target name follows D1's SDL" }
  - { type: HAS_ANALYTE, from: D4.Biomarker, to: D2.MolecularEntity, questions: [Q-D4-01, Q-D4-16], direction: OUT, owner: this, note: "D2 model stage traverses Biomarker -HAS_ANALYTE-> MolecularEntity -PARTICIPATES_IN-> Mechanism (Q-D2-03 analyte-participant branch)" }
  - { type: REFLECTS_MECHANISM, from: D4.Biomarker, to: D2.Mechanism, questions: [Q-D4-01], direction: OUT, owner: this, note: "agreed with D2 (both research notes); D2 consumes it in Q-D2-03/04/22" }
  - { type: DELIVERS, from: D6.Product, to: D4.LabTest, questions: [Q-D4-01, Q-D4-10, Q-D4-13, Q-D4-18, Q-D4-24], direction: IN, owner: this, note: "declared on LabTest.products with direction IN; replaces pinned DELIVERS_LABTEST that D6 cut; D6 10-seams lists it as consumed (check stage), 11-open-questions #8 resolved; also the route from D8 records to a test" }
  - { type: DELIVERS, from: D6.Product, to: D4.Device, questions: [Q-D4-08, Q-D4-09, Q-D4-10, Q-D4-18, Q-D4-24], direction: IN, owner: this, note: "declared on Device.products with direction IN; replaces pinned EMBODIES_MODEL that D6 cut; D6 lists it as consumed; the route from D8 records (CONCERNS / STATUS_OF -> Product) to a device model" }
  - { type: PERFORMED_BY_LAB, from: D4.AssayVersion, to: D7.Organization, questions: [CQ-DX-01, CQ-DX-03, Q-D4-04], direction: OUT, owner: this }
  # ---- declared by other modules, consumed by D4 questions ----
  - { type: OPERATIONALIZED_BY, from: D5.Target, to: D4.Biomarker, questions: [Q-D4-17], direction: OUT, owner: other, note: "vocab-targets.yaml seam rule: Target-[OPERATIONALIZED_BY]->(Outcome|Biomarker), curated structural, owned by D5" }
  - { type: OPERATIONALIZED_BY, from: D5.Target, to: D4.Metric, questions: [Q-D4-17], direction: OUT, owner: other, note: "D5 SDL 2026-10-08 union TargetMeasure = Biomarker | Metric | Outcome. D4 position (adversarial-review pass, 11 #11): a Target points at a Metric directly only when the operationalization needs metric precision (method or compartment, e.g. RMSSD not SDNN); otherwise at the Biomarker" }
  - { type: STEP_USES, from: D5.ProtocolStep, to: D4.Metric, questions: [], direction: OUT, owner: other, note: "check stage: D5 SDL union StepMeans (a MEASURE step points at the Metric it measures); D5's own questions, no D4 question traverses it" }
  - { type: MEASURES, from: D3.OutcomeDefinition, to: D4.Biomarker, questions: [Q-D4-01, Q-D4-02, Q-D4-14], direction: OUT, owner: other, note: "D3 SDL 2026-10-08 union OutcomeMeasureTarget = Metric | Biomarker | Outcome | Condition" }
  - { type: MEASURES, from: D3.OutcomeDefinition, to: D4.Metric, questions: [Q-D4-01, Q-D4-02, Q-D4-14], direction: OUT, owner: other, note: "check stage: D3 accepted D4's request (11-open-questions #9); hop 3 of Q-D4-01 reads the study metric here" }
  - { type: ADMINISTERS, from: D3.InterventionComponent, to: D4.Device, questions: [], direction: OUT, owner: other, note: "check stage: declared in D3's 10-seams (a device used as the intervention); D3's own questions, no D4 question traverses it" }
  - { type: AFFECTS_MECHANISM, from: D1.ChemicalSubstance, to: D2.Mechanism, questions: [Q-D4-01], direction: OUT, owner: other, note: "D2 derived projection, hop 1 of the compound → mechanism → biomarker → test pattern" }
  - { type: CONCERNS, from: D8.RegulatoryRecord, to: D6.Product, questions: [Q-D4-09], direction: OUT, owner: other, note: "adversarial-review pass: replaces the requested CONCERNS -> D4.Device seam (withdrawn). D8 SDL union RegulatoryRecordTopic already admits Product; D4 reaches the device through Product -DELIVERS-> Device and disambiguates with the Device UDI-DI / 510(k) identifiers (fixture noninvasive-glucose-cgm-recall c04, c08, c09). Promote to a Device target only if recalls that cannot be attributed to a Product become common; D8 OQ-D8-29 can close with no union change" }
  - { type: STATUS_OF, from: D8.LegalStatus, to: D6.Product, questions: [Q-D4-10, Q-D4-18], direction: OUT, owner: other, note: "adversarial-review pass: replaces the requested STATUS_OF -> D4.Device seam (withdrawn). D8 LegalStatusSubject already admits Product; clearance of a device or test as of D through its Product" }
  - { type: ADDRESSED_TO, from: D8.RegulatoryRecord, to: D7.Organization, questions: [Q-D4-10], direction: OUT, owner: other, note: "D8 answer for LabTest (a 7th RegulatoryRecordTopic member is over the cap): CLIA / LDT standing reaches a test through its performing-lab Organization (AssayVersion -PERFORMED_BY_LAB->)" }
  - { type: ASSESSES, from: K.Assessment, to: D4.AssayVersion, questions: [CQ-DX-03, CQ-AX-21, Q-D4-02, Q-D4-11], direction: OUT, owner: other, note: "assessmentKind COMPARABILITY, assessmentSubkind D4.comparability, verdict in conclusionCode (was ComparabilityAssessment)" }
  - { type: ASSESSES, from: K.Assessment, to: D4.AlgorithmVersion, questions: [CQ-DX-05, Q-D4-05, Q-D4-06, Q-D4-15], direction: OUT, owner: other, note: "subkinds D4.comparability, D4.algorithm-equivalence, D4.change-detectability" }
  - { type: ASSESSES, from: K.Assessment, to: D4.ReferenceIntervalVersion, questions: [CQ-DX-06, Q-D4-12], direction: OUT, owner: other, note: "D4.comparability between interval versions" }
  - { type: ASSESSES, from: K.Assessment, to: D4.Metric, questions: [Q-D4-02, Q-D4-07, Q-D4-08, Q-D4-22, Q-D4-26], direction: OUT, owner: other, note: "D4.comparability between Metrics (compartment/method), SAFETY_SIGNAL for unauthorized measurement claims, RESOLUTION for free-text measurement names" }
  - { type: ASSESSES, from: K.Assessment, to: D4.Device, questions: [Q-D4-09], direction: OUT, owner: other, note: "SAFETY_SIGNAL D4.measurement-error-recall, effectDirection HARM (fixture noninvasive-glucose-cgm-recall s02)" }
  - { type: ASSESSES, from: K.Assessment, to: K.Claim, questions: [Q-D4-08, Q-D4-15], direction: OUT, owner: other, note: "SAFETY_SIGNAL D4.unauthorized-measurement and EVIDENCE_SYNTHESIS D4.bio-age-claim-disconfirmation are about a kernel Claim (kernel-to-kernel; listed because D4 patterns start there)" }
  - { type: ASSESSES, from: K.Assessment, to: D4.LabTest, questions: [Q-D4-05, Q-D4-13], direction: OUT, owner: other, note: "fixtures stage: D4.change-detectability (clock-noise-vs-retest-advice s01) and D4.test-and-sell (nr-nad-compound-to-test s02) are about a LabTest" }
  - { type: ASSESSES, from: D10.ReportItem, to: D4.LabTest, questions: [Q-D4-24], direction: OUT, owner: other, note: "adversarial-review pass (replaces K.Report -> D4.LabTest): the published comparison is a Report whose ReportItem rows ASSESS each option (kernel ASSESSES -> Subjectable, declared on D10 ReportItem.about) and cite Assertions with DERIVED_FROM; D10 10-seams lists D4.Device but not D4.LabTest yet (11-open-questions #38)" }
  - { type: ASSESSES, from: D10.ReportItem, to: D4.Device, questions: [Q-D4-24], direction: OUT, owner: other, note: "CGM comparisons; listed in D10 10-seams" }
  - { type: HAS_ITEM, from: D10.Report, to: D10.ReportItem, questions: [Q-D4-24], direction: OUT, owner: other, note: "D10-internal structural edge (declared on ReportItem.report, direction IN); listed because the Q-D4-24 pattern traverses it" }
  - { type: OCCURRENCE_OF, from: K.Assertion, to: K.Claim, questions: [Q-D4-05, Q-D4-08, Q-D4-15], direction: OUT, owner: other, note: "claim occurrences about D4 types are kernel records; D4 only supplies subjects/objects. Fixtures (adversarial-review pass): clock-noise b03, b06 and panel g28 are CLAIM-kind with occurrenceOf a kernel Claim" }
  - { type: MENTIONS, from: D9.Chunk, to: D4.Metric, questions: [Q-D4-22], direction: OUT, owner: other, note: "derived entity-link projection (Chunk.mentions → Subjectable); every D4 type is Subjectable" }
  - { type: DERIVED_FROM, from: K.Assessment, to: K.Assertion, questions: [CQ-DX-05, Q-D4-05], direction: OUT, owner: other, note: "assessments cite the REPORTS_RELIABILITY / RECOMMENDS_RETEST_INTERVAL assertions they weighed" }

registeredValues:
  # Values D4 registers on kernel fields (A1: kind values and questions belong to the owning domain). Check stage: the kernel
  # model stage added AssessmentKind COMPARABILITY and the shared slot Assessment.conclusionCode (K 09-reasoning M9, change 4),
  # so the interim "subkind:VERDICT" string encoding is retired; conclusionCodes below are the vocabulary per subkind
  # (also tabled in 09-reasoning.md "Registered assessment vocabulary").
  assessmentSubkinds:
    - { subkind: D4.comparability, assessmentKind: COMPARABILITY, about: "two AssayVersions | two AlgorithmVersions | two ReferenceIntervalVersions | two Metrics", conclusionCodes: [COMPARABLE, COMPARABLE_WITH_CONVERSION, NOT_COMPARABLE, UNKNOWN], questions: [CQ-DX-03, CQ-AX-21, Q-D4-02] }
    - { subkind: D4.algorithm-equivalence, assessmentKind: EQUIVALENCE, about: "vendor AlgorithmVersion + publication AlgorithmVersion", conclusionCodes: [SAME, DISTINCT, UNRESOLVED], questions: [Q-D4-06] }
    - { subkind: D4.change-detectability, assessmentKind: QUALITY, about: "AlgorithmVersion (+ the vendor advice Assertion as input)", conclusionCodes: [CHANGE_DETECTABLE, NOT_ESTABLISHED, NO_RELIABILITY_SOURCE], questions: [CQ-DX-05, Q-D4-05] }
    - { subkind: D4.bio-age-claim-disconfirmation, assessmentKind: EVIDENCE_SYNTHESIS, about: "Claim ('X reverses biological age')", conclusionCodes: "none (kernel Assessment.verdict, SemanticVerdict)", questions: [Q-D4-15] }
    - { subkind: D4.unauthorized-measurement, assessmentKind: SAFETY_SIGNAL, effectDirection: HARM, about: "Metric + Device (or Product, or the kernel Claim)", conclusionCodes: "none (kernel Assessment.verdict)", questions: [Q-D4-08, Q-D4-18] }
    - { subkind: D4.measurement-name-resolution, assessmentKind: RESOLUTION, about: "exactly two Metrics (one candidate pair: a vendor or free-text measure and a candidate Metric), or a Mention and its Metric candidates", conclusionCodes: [RESOLVED, CANDIDATE, AMBIGUOUS, NO_MATCH], questions: [Q-D4-22, Q-D4-26], note: "adversarial-review pass: CANDIDATE added (one name-level candidate; unit, method or code not stated) and used by fixture consumer-panel-and-blood-clock s01-s08 (one assessment per pair); Q-D4-26 accepts RESOLVED or CANDIDATE and labels the match" }
    # added in the fixtures stage (A3, 2026-10-08)
    - { subkind: D4.measurement-error-recall, assessmentKind: SAFETY_SIGNAL, effectDirection: HARM, about: "Device + the Metric it outputs", conclusionCodes: "none", questions: [Q-D4-09, Q-D4-17], note: "fixture noninvasive-glucose-cgm-recall s02" }
    - { subkind: D4.interference-risk, assessmentKind: SAFETY_SIGNAL, effectDirection: HARM, about: "AssayVersion + Metric (+ condition as text until D2 Condition is joined)", conclusionCodes: "none", questions: [Q-D4-11], note: "fixture hba1c-two-labs-interference s02" }
    - { subkind: D4.test-and-sell, assessmentKind: CONFLICT_RELEVANCE, effectDirection: HARM, about: "Organization + LabTest + ReferenceIntervalVersion", conclusionCodes: "D7's relevance-level vocabulary (K M9 maps conflict relevance to conclusionCode; D7 registers it)", questions: [Q-D4-12, Q-D4-13], note: "fixture nr-nad-compound-to-test s02; D7 owns financial interest, this is the measurement-side conflict" }
  assertionPredicates: "see 05-relationship-register.yaml predicateOnly (16 values in SCREAMING_SNAKE since the adversarial-review pass: 15 D4-owned + the kernel FIELD_NOT_REPORTED; REGULATORY_STATEMENT withdrawn in favour of the kernel RATES_CLAIM). D4 patterns also read D5 INTENDED_FOR_TARGET / IMPROVES_TARGET, D2 INCREASES_LEVEL_OF and kernel RATES_CLAIM"

sharedVocabularies:
  - { vocabulary: targets, file: "biotech-knowledge-services-A5/schema/program/packets/D5/vocab-targets.yaml", owner: D5, use: "Biomarker and Metric are admissible OPERATIONALIZED_BY targets (Q-D4-17; Metric only when metric precision matters, 11 #11). A Device, LabTest or Product never points at a Target: what a device is for is an Assertion (INTENDED_FOR_TARGET etc.) with the Target as object; D5 registers its subjects as Device and Product (not LabTest), so Q-D4-18 reaches a LabTest through its DELIVERS Product. Vendor composite scores as measures (OQ-T3) answered in 11-open-questions.md." }
  - { vocabulary: frontiers, file: "biotech-knowledge-services-A7/schema/program/packets/D13/vocab-frontiers.yaml", owner: D13, use: "none directly: D13 rules clocks are measures, not a frontier; a Study using a clock outcome attaches to frontier:aging-as-indication through D13 ON_FRONTIER" }
  - { vocabulary: identifier-schemes, file: "biotech-knowledge-services-A1/schema/program/packets/K/identifier-schemes.yaml", owner: K, use: "LOINC (Metric only); Biomarker carries none since the adversarial-review pass (analyte ids CHEBI / UNIPROT / HGNC / MESH live on the D1/D2 analyte); requested: LAB_TEST_CODE, CPT, UDI_DI, FDA_510K, FDA_PRODUCT_CODE" }
  - { vocabulary: population-descriptors, file: "biotech-knowledge-services-A4/schema/program/packets/D3/04-schema-proposal.graphql", owner: D3, use: "enum SexScope (ALL, FEMALE, MALE, NOT_REPORTED) for ReferenceIntervalVersion.sex, and the field names minAgeYears / maxAgeYears (adversarial-review pass; D4 PartitionSex removed, as D2 removed its own copy)" }
  - { vocabulary: compartment-ontology-ids, file: "(property convention, no file)", owner: "D4 with D2", use: "UBERON / CL CURIEs in Metric.systemOntologyId, AssayVersion.specimenOntologyIds and D2 context compartmentOntologyId; compared by equality (Q-D4-01, Q-D4-02, Q-D2-04)" }
  - { vocabulary: ucum-units, file: "(external: UCUM)", owner: D4, use: "Metric.canonicalUnitCode, AssayVersion.reportedUnitCode, ReferenceIntervalVersion.unitCode, kernel Assertion.unitCode" }
  - { vocabulary: kernel-types, file: "biotech-knowledge-services-A1/schema/program/packets/K/04-schema-proposal.graphql", owner: K, use: "edge-property type AssertedRecordedProperties (REFLECTS_MECHANISM, DERIVED_FROM_ALGORITHM_VERSION, DELIVERS; check stage); enum PrivacyClass (Entity field); AssessmentKind (COMPARABILITY, EQUIVALENCE, QUALITY, SAFETY_SIGNAL, RESOLUTION, CONFLICT_RELEVANCE, EVIDENCE_SYNTHESIS), EffectDirection, SemanticVerdict, BasisKind, SelectorKind used by D4 patterns through kernel records" }
