# ---- fragment D6 ----
# Module D6 — consumer products and commerce. Model stage (Wave 2) by A6, 2026-10-08; adversarial-review stage 2026-10-08
# (DECLARES_COMPONENT asserted on an AssertedRecordedProperties superset; massBasis = D1 MassBasis; OfferKind, Offer.currency
# and LabelVersion.hasUndeclaredBlendAmounts removed — 09-reasoning.md "Adversarial-review changes").
# Synthesis (S module editor, 2026-10-08; final/decision-report.md, final/_work/rulings.yaml modules.D6):
#   R-10  HAS_LABEL_VERSION uses AssertedEdgeProperties (StateEpisodeProperties retired); register field exclusive: true.
#   R-30  ComponentLineProperties loses declaredNameVerbatim, formVerbatim, statementVerbatim: the row as printed is the
#         authorizing Assertion's locator exact text, and qualifiers declaredName:, form:, statement: carry the parts.
#   R-58  AmountBasis is the one program-wide amount-basis enum (owner D6; consumers D2, D3, D5, D12): +10 values.
#   R-88  ProductKind PRESCRIPTION_DRUG, PanelKind PRESCRIBING_INFORMATION, ComponentLineRole ACTIVE_INGREDIENT.
#   R-08  CQ-PF-03 here is D6's CQ-PF-03b (certification-scope assessment, v2); D8 owns CQ-PF-03a.
#   R-18  LabelVersion keeps Subjectable (kernel Subjectable rule adopts D6's wording; OQ-D6-02 closed).
# Kernel pattern: packets/K/09-reasoning.md "## Kernel pattern for subject, object, identifier and mention edges"; final kernel SDL
# final/schema/kernel.graphql.
# Kernel types are referenced, never re-declared. Every @node: implements Entity & Subjectable, lists the 7 Entity fields
# verbatim, @query(aggregate: false) @mutation(operations: []). Every @relationship: aggregate: false, nestedOperations
# declared, @filterable(byValue: true, byAggregate: false), docstring "class: …; cardinality: …; questions: …".
#
# Size: 6 node types, 9 relationship types, 11 from→to pairs, widest union 3 (DeclaredComponentTarget).
#
# What is NOT here, on purpose (09-reasoning.md):
# - PriceObservation: a displayed price is a kernel Assertion with a typed literal (subject Offer, predicate OFFER_PRICE_<KIND>,
#   valueNumber, unitCode iso4217:<CODE>, valid instant, asserter = the merchant/tracker, one locator). Availability likewise
#   (predicate OFFER_AVAILABILITY, valueString from the ObservedAvailability vocabulary). A published reference price with no
#   seller (an index such as The Economist's Big Mac price) is a MARKET_REFERENCE_PRICE Assertion whose subject is the
#   Product, ProductVariant or Package it prices, never an Offer.
# - FormulationVersion: absorbed into LabelVersion (component lines on DECLARES_COMPONENT + compositionDigest). "Formulation
#   changed?" = compositionDigest differs between two label versions of one package (CQ-ID-05).
# - Bundle / BundleComponent: Package.packageKind KIT/MULTIPACK/BUNDLE + predicate-only CONTAINS_PACKAGE (Q-D6-14, value 3).
# - CommerceMatch: kernel Assessment (assessmentKind EQUIVALENCE/OTHER, assessmentSubkind D6.*).
# - Host and fulfiller organizations: MerchantListing.hostDomain and Offer.fulfillmentKind (properties; predicate-only edges).
# - Identifiers (GTIN, ASIN, SKU, DSLD, retailer ids), subjects/objects, mentions, lineage: kernel pattern, nothing declared.

# =====================================================================================================
# Edge-property type (D6-local; allowed by the kernel's superset rule M11 — base fields verbatim first; OQ-D6-01 resolved)
# Base: kernel AssertedRecordedProperties (adversarial-review stage; was StructuralEdgeProperties).
# =====================================================================================================

"""
Asserted line of a label's declared composition (one Supplement Facts / Nutrition Facts / ingredient-statement row).
Each line is authorized by its own Assertion (predicate DECLARES_COMPONENT, subject the LabelVersion, object the line
target, asserter the transcribing source, locator the panel row): the resolution of the printed row to a D1/D12 record is
attributable, can be adjudicated, keeps recorded-time history when D1 merges or splits materials, and is the input a D1
CALCULATED amount cites in DERIVED_FROM (adversarial-review stage; closes OQ-D6-24(2)). Superset of the kernel
AssertedRecordedProperties: its five fields come first, verbatim and in kernel order (A1 rule M11); the label version's
HAS_LABEL_VERSION episode carries valid time, so the line carries recorded time only. The qualifiers after the base fields
are the ones CQ-AX-25, CQ-PF-01, Q-D6-02, Q-D6-08 and Q-D6-12 filter on. Amounts are declarations, never measurements
(measured content is D8). The row as printed ('Niagen (as Nicotinamide Riboside Chloride)'), the form statement ('as
pyridoxine HCl') and a per-component allergen or preparation statement are not edge fields (M11: a field that only
reproduces the source's wording stays with the Assertion): they are the authorizing Assertion's locator exact text and
its qualifiers `declaredName:`, `form:` and `statement:` (R-30).
"""
type ComponentLineProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  recordedFrom: DateTime!
  recordedTo: DateTime
  lastWriterRunId: String
  "Panel order of this line (0-based); siblings under one parent are ordered by it."
  orderIndex: Int
  "orderIndex of the parent line (proprietary blend total, prepared-food sub-component such as 'Big Mac Sauce'); null at top level."
  parentOrderIndex: Int
  lineRole: ComponentLineRole!
  "Declared amount; null when the label states none (blend member, 'NP')."
  amount: Float
  "UCUM unit of amount (mg, ug, g, mL, kcal, {CFU})."
  unitCode: String
  amountReferent: AmountReferent
  "Mass basis of a declared chemical amount (D1 shared vocabulary MassBasis: SALT_FORM, ACTIVE_MOIETY, NUTRIENT_EQUIVALENT, MATERIAL_AS_IS, UNSPECIFIED). US 'Niagen (as NRC) 300 mg' is SALT_FORM; the Canadian 'nicotinamide riboside 263 mg' line is ACTIVE_MOIETY (CQ-PF-01, Q-D6-02)."
  massBasis: MassBasis
  amountBasis: AmountBasis
  "Percent Daily Value as printed; null when not stated."
  dailyValuePercent: Float
}

# =====================================================================================================
# Union (width 3)
# =====================================================================================================

"What a declared composition line resolves to: a D1 ingredient material (incl. D1's unresolved-material sentinel), a D1 nutrient/constituent, or a D12 food item (prepared-food ingredient statements)."
union DeclaredComponentTarget = IngredientMaterial | Constituent | FoodItem

# =====================================================================================================
# Enums (controlled vocabularies)
# =====================================================================================================

"What kind of thing is sold. Replaces the pinned ProductKind (adds PREPARED_FOOD, SERVICE; drops BIOLOGIC, which is D8/D3 territory). The pinned drug-pipeline ProductStatus is not used by D6 (market status is assertions on offers and packages)."
enum ProductKind {
  DIETARY_SUPPLEMENT
  CONVENTIONAL_FOOD
  PREPARED_FOOD
  BEVERAGE
  OTC_DRUG
  "A prescription drug product with a labeler of record (R-88); prescription-only status is a D8 LegalStatus (PRESCRIPTION_ONLY), scoped by jurisdiction."
  PRESCRIPTION_DRUG
  CONSUMER_DEVICE
  MEDICAL_DEVICE
  DIAGNOSTIC_TEST_SERVICE
  SERVICE
  COSMETIC
  OTHER
}

"Consumer-distinguishing dosage or serving form of a variant."
enum DosageForm {
  CAPSULE
  SOFTGEL
  TABLET
  GUMMY
  POWDER
  STICK_PACK
  LIQUID
  BAR
  MEAL_ITEM
  DEVICE
  KIT
  OTHER
}

"How a sellable package is composed."
enum PackageKind {
  "One container of one variant (a bottle of 30 capsules, a 350 g pouch)."
  CONTAINER
  "N identical containers sold as one item (two-bottle supply)."
  MULTIPACK
  "A seller-defined kit of different packages (brand SKU '-KIT')."
  KIT
  "A bundle across products or brands."
  BUNDLE
  "One served portion of a prepared food (a sandwich, a menu item); no container GTIN."
  SERVED_PORTION
  OTHER
}

"Which regulated or declared panel the label version is."
enum PanelKind {
  SUPPLEMENT_FACTS
  NUTRITION_FACTS
  DRUG_FACTS
  "Prescribing information (SPL / package insert) of a prescription drug (R-88)."
  PRESCRIBING_INFORMATION
  MENU_DECLARATION
  INGREDIENT_STATEMENT
  OTHER
}

"Declared allergens (FDA major food allergens plus the EU Annex II list)."
enum AllergenCode {
  MILK
  EGG
  FISH
  CRUSTACEAN_SHELLFISH
  TREE_NUTS
  PEANUTS
  WHEAT
  SOYBEANS
  SESAME
  CEREALS_CONTAINING_GLUTEN
  CELERY
  MUSTARD
  LUPIN
  MOLLUSCS
  SULPHITES
  OTHER
}

"Role the label prints for the responsible party ('Distributed by', 'Manufactured for', ...)."
enum ResponsiblePartyRole {
  MANUFACTURED_BY
  MANUFACTURED_FOR
  DISTRIBUTED_BY
  PACKED_FOR
  IMPORTED_BY
  MARKETED_BY
  UNSTATED
}

"Role of one declared composition line (absorbs the pinned DeclarationKind values that are composition rows)."
enum ComponentLineRole {
  "Active ingredient of a drug panel (Drug Facts, prescribing information) (R-88)."
  ACTIVE_INGREDIENT
  DIETARY_INGREDIENT
  NUTRIENT
  BLEND_TOTAL
  BLEND_MEMBER
  OTHER_INGREDIENT
  SOURCE_INGREDIENT
  SUB_COMPONENT
  ENERGY
}

"What entity the declared amount refers to (CQ-PF-01). The salt-vs-moiety mass basis is a separate dimension, ComponentLineProperties.massBasis (D1 MassBasis; adversarial-review stage, answers D1 OQ-D1-24)."
enum AmountReferent {
  AS_NAMED
  AS_NUTRIENT
  AS_EXTRACT_MASS
  AS_MARKER_CONSTITUENT
  BLEND_TOTAL
  NOT_DECLARED
}

"""
Basis of a stated amount. The one program-wide amount-basis enum (R-58), owned by D6: declared label lines (D6
ComponentLineProperties.amountBasis), administered doses (D3; replaces QuantityBasis), protocol and constraint doses
(D5; replaces DosePeriod), food amounts (D12), and cell-free exposure contexts (D2, MEDIUM_CONCENTRATION). Consumers
reference it and never re-declare it (R-56). Salt-vs-moiety mass basis is a separate dimension (D1 MassBasis).
"""
enum AmountBasis {
  PER_SERVING
  PER_UNIT
  PER_100G
  PER_100ML
  PER_PACKAGE
  PER_ITEM
  PER_DOSE
  PER_DAY
  PER_WEEK
  PER_CYCLE
  PER_KG_BODY_WEIGHT_PER_DAY
  PER_KG_DIET
  SINGLE_DOSE
  "Concentration in a culture or assay medium (D2 cell-free contexts, route IN_MEDIUM)."
  MEDIUM_CONCENTRATION
  NOT_STATED
  OTHER
}

"What kind of commerce page the listing is."
enum ListingKind {
  MARKETPLACE_DETAIL_PAGE
  RETAILER_ITEM
  DTC_PRODUCT_PAGE
  MENU_ITEM_PAGE
  OTHER
}

"How the offer is bought (absorbs the pinned SubscriptionPlan node and OfferKind PURCHASE/SUBSCRIPTION_ONLY)."
enum PurchaseMode {
  ONE_TIME
  SUBSCRIPTION
  ONE_TIME_OR_SUBSCRIPTION
  PREORDER
  SERVICE_BOOKING
  UNKNOWN
}

"Who ships the offer, as displayed (replaces the pinned FULFILLS_OFFER edge)."
enum FulfillmentKind {
  SELLER
  HOST
  THIRD_PARTY
  IN_STORE
  UNKNOWN
}

