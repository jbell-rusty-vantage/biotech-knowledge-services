uid token: `offer` (hu:offer:<opaque>).
Questions: CQ-CM-01, CQ-CM-02, CQ-CM-03, CQ-CM-05, CQ-AX-06, Q-D6-02, Q-D6-06, Q-D6-13, Q-D6-17, CQ-CM-04.
"""
