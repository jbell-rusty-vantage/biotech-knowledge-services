# =====================================================================================================
# Claim lifecycle and derived knowledge skeleton: Claim, Assessment, Report
# =====================================================================================================

"""
Purpose: the proposition itself, independent of who said it (00-DIRECTIVE 3.4): the unit that is vetted, monitored,
researched and reported on. Occurrences are Assertions (assertionKind CLAIM) pointing at it with OCCURRENCE_OF.
Identity rule: `propositionHash` = sha256 over the normalized proposition plus its structured binding (subject uid,
predicate, object uid or literal, qualifiers); near-duplicates are separate Claims linked by an EQUIVALENCE
Assessment, never merged by similarity. A qualified variant ("activates SIRT1 with hydrophobic-motif substrates")
is its own Claim; an EQUIVALENCE Assessment (`assessmentSubkind: K.claim-relation`, `conclusionCode: REFINES`)
ASSESSES both, and the narrower Claim
caches the broader one's uid in `refinesClaimUid`. Lifecycle (00-DIRECTIVE 3.4): occurrences (Assertion CLAIM,
OCCURRENCE_OF) → VETTING Assessment with disposition → EVIDENCE_MISSION Activity that ASSESSES the Claim → EVIDENCE_REPORT
Report that ASSESSES it with a lattice verdict. uid token: `claim`. Implements Subjectable so Assessments, Reports,
Activities and RATES_CLAIM Assertions can point at it. Questions: Q-K-08, Q-K-09, Q-K-11, Q-K-19, Q-K-21, Q-K-23,
Q-K-26, Q-K-27, Q-K-28.
"""
type Claim implements Entity & Subjectable
  @node(labels: ["Claim", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  "Short label."
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Normalized proposition text."
  proposition: String!
  propositionHash: String!
  claimType: ClaimType!
  "Projection cache maintained by the lifecycle projection; authority is the Assessments and Reports."
  lifecycleState: ClaimLifecycleState
  "Projection cache of the latest published evidence report's verdict."
  latestVerdict: SemanticVerdict
  "Projection cache: uid of the broader Claim this one refines (authority: the accepted EQUIVALENCE Assessment with conclusionCode REFINES)."
  refinesClaimUid: String
  "Discourse projection cache (R-49, CQ-CL-06): occurrences of this Claim whose asserter states it first-hand. Written by a PROJECTION Activity under discourseMethodVersion; authority is the occurrences (OCCURRENCE_OF) and their DERIVED_FROM / OCCURS_IN chains, never this value."
  discourseFirstHandCount: Int
  "Discourse projection cache (R-49, CQ-CL-06, Q-D9-08): occurrences that retell an earlier occurrence."
  discourseRetellingCount: Int
  "Discourse projection cache (R-49, CQ-CL-06, Q-D9-08): occurrences in re-published cuts of an earlier work."
  discourseRecutCount: Int
  "Discourse projection cache (R-49, CQ-CL-06): independent source families among the occurrences, under discourseMethodVersion."
  discourseIndependentCount: Int
  "Discourse projection cache (R-49, Q-D9-08): earliest valid time among the occurrences (first assertion)."
  discourseFirstOccurrenceAt: DateTime
  "Method version of the discourse projection cache (R-45 condition 3)."
  discourseMethodVersion: String @filterable(byValue: false) @sortable(byValue: false)
  "When the PROJECTION Activity derived the discourse cache (R-45 condition 3)."
  discourseDerivedAt: DateTime @filterable(byValue: false) @sortable(byValue: false)
  """class: structural (inverse); cardinality: many; questions: Q-K-09, Q-K-11."""
  occurrences: [Assertion!]!
    @relationship(type: "OCCURRENCE_OF", direction: IN, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural (inverse); cardinality: many (vetting, equivalence, insights); questions: Q-K-09, Q-K-19."""
  assessments: [Assessment!]!
    @relationship(type: "ASSESSES", direction: IN, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural (inverse); cardinality: many (evidence reports); questions: Q-K-08, Q-K-11."""
  reports: [Report!]!
    @relationship(type: "ASSESSES", direction: IN, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: an immutable, versioned, supersedable judgment asserted by an agent or analyst with named inputs (PLAN 6.1
"assessment"): claim vetting (with `disposition`), derived insight, evidence synthesis, safety signal, resolution
hypothesis (a surface form or handle at a located span → candidate entity: the span is HAS_EVIDENCE role CONTEXT,
the candidate is ASSESSES, and `surfaceForm=`, `normalizedForm=`, `typeHint=` go in facets; there is no Mention node),
equivalence of two identities, source authority per claim kind. An assessment that judges one occurrence (retelling
fidelity, conflict relevance) ASSESSES that occurrence's Claim (and the speaker) and is DERIVED_FROM the judged
occurrence(s), with `occurrence=<uid>` / `retelling=<uid>` / `original=<uid>` facets (R-20).
Domain-specific assessment kinds are values of `assessmentKind` with their detail in `assessmentSubkind`; a domain
needing typed, filterable properties on an assessment requests a kernel addition rather than declaring its own type.
Harm is `effectDirection: HARM` on an assessment about a target, never a property of an entity. Typed slots shared
by every domain (model stage): `gradeScheme` + `grade` + `certainty` (evidence grades, severity grades such as
CTCAE), `conclusionCode` (one categorical outcome from the vocabulary the owning domain registers for its subkind,
e.g. COMPARABLE, CONFIRMED_ASSOCIATION, REFINES for K.claim-relation), `facets` (registered `<facet>=<value>` codes). A third party's
verdict is never an Assessment (it is a RATES_CLAIM Assertion by that party).
Identity rule: (kind, subjects, methodVersion, inputs digest, recordedAt). uid token: `assessment`.
Questions: Q-K-06, Q-K-09, Q-K-11, Q-K-13, Q-K-15, Q-K-19, Q-K-21, Q-K-30.
"""
type Assessment implements Entity
  @node(labels: ["Assessment", "EvidenceAssessment"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  assessmentKind: AssessmentKind!
  "Domain detail of the kind, registered by the owning domain (e.g. D5.interaction-risk)."
  assessmentSubkind: String
  status: AssessmentStatus!
  methodVersion: String!
  "VETTING only."
  disposition: ClaimDisposition
  "When the assessment judges support of a proposition."
  verdict: SemanticVerdict
  effectDirection: EffectDirection
  "The method's own score (e.g. resolution score); never a truth value."
  score: Float
  "Named grading scheme (GRADE, OCEBM-2011, USPSTF-2012, CTCAE_V5, LIVERTOX-LIKELIHOOD, BELLLABS-<name>@<version>)."
  gradeScheme: String
  "Grade under gradeScheme, as the scheme spells it."
  grade: String
  certainty: CertaintyLevel
  "Categorical outcome from the vocabulary registered for assessmentSubkind by the owning domain."
  conclusionCode: String
  "Registered `<facet>=<value>` codes for further categorical facets (filter with includes)."
  facets: [String!]
  summary: String
  rationale: String
  "Latest evidence the assessment considered (as-of cutoff)."
  evidenceCutoffAt: DateTime
  "sha256:<hex> over the sorted input uids and their contentHashes."
  inputSetDigest: String
  recordedAt: DateTime!
  recordedTo: DateTime
  supersedesUid: String
  """class: structural; cardinality: one_or_more (Claim, domain entity, Source, Agent); questions: Q-K-09, Q-K-13, Q-K-19."""
  about: [Subjectable!]!
    @relationship(type: "ASSESSES", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many; questions: Q-K-06, Q-K-15."""
  inputAssertions: [Assertion!]!
    @relationship(type: "DERIVED_FROM", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many; questions: Q-K-06."""
  inputAssessments: [Assessment!]!
    @relationship(type: "DERIVED_FROM", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many (role per locator); questions: Q-K-11, Q-K-13."""
  evidence: [SourceLocator!]!
    @relationship(type: "HAS_EVIDENCE", direction: OUT, properties: "EvidenceEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: exactly_one; questions: Q-K-04, Q-K-06."""
  generatedBy: [Activity!]!
    @relationship(type: "WAS_GENERATED_BY", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: the in-graph skeleton of a published artifact (PLAN 6.1): evidence report (the outcome of an evidence
mission, with the verification.v1 verdict on the claim it tried to disqualify), published answer (absorbs
AnswerRecord), comparison report, profile, recommendation. The body lives in the store (`bodyUri`, `bodyDigest`);
the graph holds the minimum citation set: every Assertion and Assessment the content rests on (DERIVED_FROM),
every SourceLocator it quotes (HAS_EVIDENCE), what it is about (ASSESSES), and the composing Activity, which names
the PolicyVersion and the sealed bundle. Insert-only; a revision is a new Report naming `supersedesUid`. Minimum
citation set to publish: bodyDigest; ASSESSES → what it is about (the Claim for an evidence report); DERIVED_FROM →
every Assertion and Assessment a report sentence rests on (the sealed ledger's citations resolve to these); HAS_EVIDENCE
→ every SourceLocator it quotes; WAS_GENERATED_BY → the composing Activity (EVIDENCE_MISSION, ANSWER, or PROJECTION
for a PROFILE) carrying policyVersion and bundleDigest; citationCompleteness recorded. ASSESSES is required for an
EVIDENCE_REPORT (its Claim) and a COMPARISON (the compared entities); a PROFILE about the graph itself (D11
identifier coverage) has none. Report sentences stay in the ledger (ledgerDigest).
Identity rule: (reportKind, bodyDigest). uid token: `report`. Questions: Q-K-04, Q-K-06, Q-K-08, Q-K-11, Q-K-17,
Q-K-20, Q-K-21, Q-K-23, Q-K-25, Q-K-26.
"""
type Report implements Entity
  @node(labels: ["Report", "InformationArtifact"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  "Title."
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  reportKind: ReportKind!
  "D10 skeleton name and version (e.g. d10.compound-profile@1, d10.frontier-brief@1); refines reportKind without new enum values."
  skeletonKey: String
  status: AssessmentStatus!
  "EVIDENCE_REPORT: the verification.v1 lattice verdict on the Claim it ASSESSES (the exact proposition: that Claim's propositionHash), after the mission tried to disqualify it."
  verdict: SemanticVerdict
  "EVIDENCE_REPORT: verification.v1 world-correctness of the judged Claim (orthogonal to verdict; no aggregate erases either)."
  worldCorrectness: PropertyStatus
  policyOutcome: PolicyOutcome
  "PolicyVersion id the publication was admitted under (node in D10 if promoted)."
  policyVersion: String!
  "sha256:<hex> of the registered report bytes (verification-report-ledger.v1 reportArtifact)."
  bodyDigest: String!
  bodyUri: String
  "sha256:<hex> of the verification report ledger and of the sealed audit bundle."
  ledgerDigest: String
  bundleDigest: String
  "verification.v1 report-wide metrics: claimWeightedCitationCompleteness, citationCorrectness (nullable in v1)."
  citationCompleteness: Float
  citationCorrectness: Float
  "verification.v1 reportWide independentSourceFamilyCount / distinctSourceFamilyCount (independence of the cited evidence). Source family = the evidence's OCCURS_IN work, else its Source's RENDITION_OF work (D9 MediaWork or D3 Publication), else the Source (R-43)."
  independentSourceFamilyCount: Int
  distinctSourceFamilyCount: Int
  "Count of verification.v1 reportWide.unsupportedHighSeverityAssertionIds (a publication gate input)."
  unsupportedHighSeverityCount: Int
  "ANSWER: digest of the read intent (query shape) that produced it, for replay."
  queryDigest: String
  publishedAt: DateTime
  recordedAt: DateTime!
  "Written once when a revision (a new Report naming supersedesUid) or a withdrawal replaces this one."
  recordedTo: DateTime
  supersedesUid: String
  """class: structural; cardinality: zero_or_more (exactly one Claim for EVIDENCE_REPORT; one_or_more for COMPARISON; zero for a PROFILE about the graph); questions: Q-K-08, Q-K-11."""
  about: [Subjectable!]!
    @relationship(type: "ASSESSES", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: one_or_more (minimum citation set); questions: Q-K-06, Q-K-17."""
  citesAssertions: [Assertion!]!
    @relationship(type: "DERIVED_FROM", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many; questions: Q-K-06, Q-K-17."""
  citesAssessments: [Assessment!]!
    @relationship(type: "DERIVED_FROM", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many (every quoted span); questions: Q-K-17, Q-K-20."""
  evidence: [SourceLocator!]!
    @relationship(type: "HAS_EVIDENCE", direction: OUT, properties: "EvidenceEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: exactly_one (the composing Activity: EVIDENCE_MISSION, ANSWER, or PROJECTION for a PROFILE); questions: Q-K-04, Q-K-08."""
  generatedBy: [Activity!]!
    @relationship(type: "WAS_GENERATED_BY", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

# =====================================================================================================
# Lineage: Activity, Agent
# =====================================================================================================

"""
Purpose: the single lineage spine (00-DIRECTIVE 4). One Activity per Mission Control run (or verification run,
projection job, answer composition): `externalRunSystem` + `runId` unique. Everything the run writes points at it
(nodes by WAS_GENERATED_BY; edges by `lastWriterRunId` = runId). A verification.v1 run is an Activity of kind
VERIFICATION carrying its sealed `bundleDigest` (no VerificationRun node). An evidence mission is an Activity of kind
EVIDENCE_MISSION that ASSESSES the Claim it tries to disqualify and WAS_INFORMED_BY the VETTING activity whose
Assessment queued the claim. Granularity (model stage): one Activity per run, never per applied intent; the intents a
run applied are list-valued (`operationIds`, `intentDigests`, `planDigests`, `receiptIds`; each receipt is tied to its
graph effects by the executor's KsIntentMarker). Retries (Mission Control attempts) keep the run's identity and never
create another Activity. The Activity carries admission (`policyOutcome`) and times, never the KS operation state
machine (queued … quarantined), which stays in Mission Control / Knowledge Services. WAS_GENERATED_BY is written for
every node a run creates OR updates, so a node may point at several Activities; its creator is the earliest.
Identity rule: (externalRunSystem, runId). uid token: `activity`. Questions: Q-K-03, Q-K-04, Q-K-05, Q-K-06, Q-K-07,
Q-K-08, Q-K-19, Q-K-24, CQ-AX-07.
"""
type Activity implements Entity
  @node(labels: ["Activity", "Occurrence"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  activityKind: ActivityKind!
  "mission-control | ks-verification | projection | manual."
  externalRunSystem: String!
  "Mission Control run.runId (or verification run UUID); replaces externalRunId / mongoResearchRunId."
  runId: String!
  missionId: String
  activationId: String
  "Operation intent ids (Mission Control) or the Knowledge Services operation id(s) this run executed."
  operationIds: [String!]
  "The run's main step: knowledge.ingestion_apply, verification_claims, entity-link projection, ..."
  operationKind: String
  startedAt: DateTime
  endedAt: DateTime
  "Executor or method version that makes outputs interpretable."
  methodVersion: String
  "biotech-knowledge-intent.v1 digests and plan digests of the intents the run applied (ADR 0003), in apply order."
  intentDigests: [String!]
  planDigests: [String!]
  "biotech-knowledge-receipt.v1 ids (the references Mission Control stores), in apply order."
  receiptIds: [String!]
  "verification.v1 sealed audit bundle digest, when the run produced one."
  bundleDigest: String
  "verification.v1 policy outcome of the run, and the PolicyVersion id applied."
  policyOutcome: PolicyOutcome
  policyVersion: String
  """class: structural; cardinality: one_or_more; questions: Q-K-03."""
  agents: [Agent!]!
    @relationship(type: "WAS_ASSOCIATED_WITH", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many (the activity this one was started from: vetting → evidence mission, research → ingestion); questions: Q-K-06, Q-K-08."""
  informedBy: [Activity!]!
    @relationship(type: "WAS_INFORMED_BY", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: zero_or_more (EVIDENCE_MISSION: exactly one, the Claim under test; RESEARCH: the entities the mission was chartered for; written at run start from the Mission Control charter); questions: Q-K-05, Q-K-08, Q-K-19."""
  about: [Subjectable!]!
    @relationship(type: "ASSESSES", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural (inverse); cardinality: many (every node the run wrote, any module); questions: Q-K-04, Q-K-05, Q-K-07."""
  generated: [Entity!]!
    @relationship(type: "WAS_GENERATED_BY", direction: IN, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: a software or human-operated agent identity (executor, extraction model + prompt + skill, verifier,
analyst seat). Runs are Activities, not Agent properties. An Agent may be an asserter (implements Subjectable) or an
assessor (through the Activity). It is not a Person (D7) and not an Organization (D7).
Identity rule: (agentKind, model, promptVersion, skillVersion, toolVersion). uid token: `agent`. Questions: Q-K-03.
"""
type Agent implements Entity & Subjectable
  @node(labels: ["Agent", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  agentKind: AgentKind!
  model: String
  promptVersion: String
  skillVersion: String
  toolVersion: String
}

# =====================================================================================================
# Identity: Identifier (no Mention type: a surface form is a SourceLocator plus a RESOLUTION Assessment)
# =====================================================================================================

"""
Purpose: an external identifier string with scheme and issuer (PMID, DOI, NCT, UNII, CAS, GTIN, LOINC, ...; the
scheme register is packets/K/identifier-schemes.yaml). Identity rule: (scheme, issuer, normalized value), unique;
the same (scheme, value) from two issuers never establishes identity; names never establish identity; one Identifier
identifies at most one Subjectable, so no cross-type join runs through a shared Identifier (R-42). Trade-item
identifiers (GTIN, UPC, EAN, ASIN, SKU) are Identifiers with those schemes. uid token: `identifier`.
Questions: Q-K-12, Q-K-13.
"""
type Identifier implements Entity
  @node(labels: ["Identifier", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Scheme code from the register (upper case)."
  scheme: String!
  issuer: String!
  "Normalized value (normalizationRule applied)."
  value: String!
  normalizationRule: String
  "Scheme-level validity of the identifier string itself (e.g. a deprecated code)."
  validFrom: DateTime
  validTo: DateTime
  """class: asserted (inverse); cardinality: many (episodes carry assignment validity); questions: Q-K-12, Q-K-13."""
  identifies: [Subjectable!]!
    @relationship(type: "HAS_IDENTIFIER", direction: IN, properties: "IdentifierLinkProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}
