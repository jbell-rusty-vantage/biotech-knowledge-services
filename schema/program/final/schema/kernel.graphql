# =====================================================================================================
# Capture: Source → SourceSnapshot → SourceLocator
# =====================================================================================================

"""
Purpose: stable identity of one retrieval endpoint (one normalized canonicalUri): a page, registry record, PDF,
API record, feed item or media file. Identity rule: `canonicalUri` (normalized post-redirect endpoint; never an
identifier resolver). uid token: `source` (hu:source:<host-path-slug>). Implements Subjectable so identifiers
(DOI of the endpoint, NCT of a registry record page) and assertions about the endpoint (retracted, paywalled) attach
without a domain type. Editorial containers (MediaWork, Channel) are D9 types; scholarly publications are D3
Publications (R-09, R-71). A Source is grouped with its work by RENDITION_OF (kernel meaning, asserted, recorded time
only; declared IN on D9 MediaWork.renditions and D3 Publication.renditions; R-43). Its source family is the
OCCURS_IN work of the evidence, else its RENDITION_OF work, else the Source itself. Curation files (target and
frontier vocabularies, the D2 hallmark mapping) are Sources with one snapshot per version (R-26).
Questions: Q-K-01, Q-K-10, Q-K-20, Q-K-21.
"""
type Source implements Entity & Subjectable
  @node(labels: ["Source", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  "Title as displayed by the endpoint; presentation only."
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Normalized post-redirect endpoint; unique."
  canonicalUri: String!
  "Capture-level kind (verification.v1)."
  sourceKind: SourceKind!
  "Editorial genre (controlled string from the D9 source register: PEER_REVIEWED_PUBLICATION, TRIAL_REGISTRY_RECORD, PRESS_RELEASE, MARKETING_PAGE, PODCAST_TRANSCRIPT_PAGE, ...)."
  genre: String
  "verification.v1 VerificationSource.logicalIdentity when the verifier assigned one."
  logicalIdentity: String
  """class: structural; cardinality: many (one per capture); questions: Q-K-02, Q-K-10."""
  snapshots: [SourceSnapshot!]!
    @relationship(type: "HAS_SNAPSHOT", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CREATE, CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: immutable capture of a Source at a retrieval time (verification.v1 VerificationSourceCapture): the bytes
that every claim must trace to. Identity rule: (source, contentHash, retrievedAt); a changed page is a new
snapshot, never an edit. uid token: `snapshot`. Clocks: `retrievedAt` (BellLabs fetched; lower bound of any
citing assertion's recordedAt), `observedAt` (known displayed), `publishedAt` (issuer time). A publisher revision
(retraction, erratum) is recorded on the later snapshot (`revisionKind`, `revisesSnapshotUid`).
Questions: Q-K-01, Q-K-02, Q-K-10, Q-K-20.
"""
type SourceSnapshot implements Entity
  @node(labels: ["SourceSnapshot", "InformationArtifact"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "When BellLabs fetched the bytes."
  retrievedAt: DateTime!
  "When the content is known to have been displayed (archive capture time for a late source)."
  observedAt: DateTime
  "Issuer's date for this version."
  publishedAt: DateTime
  "sha256:<hex> of the captured artifact (verification.v1 contentArtifact digest); snapshot identity."
  contentHash: String!
  "Input of contentHash (R-35): RAW_BYTES | CANONICAL_PROJECTION (a registered projection id@version over stored raw bytes) | TOOL_RENDITION (Firecrawl / Tavily output; captureMethod names tool, version, options) | STORED_EXCERPT_TEXT | SYNTHETIC_FIXTURE."
  contentHashBasis: String!
  "sha256:<hex> of the canonical projection artifact when the verifier registered one; change detection across snapshots, not identity (R-37)."
  canonicalProjectionHash: String
  "verification.v1 captureMethod and version, e.g. firecrawl-scrape/2."
  captureMethod: String
  "COMPLETE | PARTIAL_EXCERPT | UNKNOWN; partial captures never support absence claims."
  captureCompleteness: String
  "Durable object-store key of the bytes (internal; R-37)."
  storageUri: String
  "External archive copy (web archive URI)."
  archiveUri: String
  mimeType: String
  "BCP 47 language tag."
  language: String
  "Publisher revision this snapshot records, if any (capture cache; the authority is the REVISES episode or HAS_REVISION_STATUS Assertion, R-44)."
  revisionKind: SourceRevisionKind
  "uid of the earlier snapshot this one revises (retraction notice, new version)."
  revisesSnapshotUid: String
  """class: structural (inverse); cardinality: exactly_one; questions: Q-K-01, Q-K-20."""
  source: [Source!]!
    @relationship(type: "HAS_SNAPSHOT", direction: IN, properties: "StructuralEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: reproducible selector for the exact span, cell, page region, JSON pointer or media time range of one
SourceSnapshot (verification.v1 SourceFragment + selector), the only evidence currency of the graph. A Chunk is
never a locator. Identity rule: (snapshot, selectorKind, selectorDigest). uid token: `locator`. Immutable; a newer
snapshot gets a new locator (`reanchorsLocatorUid` names the one it re-finds).
Questions: Q-K-01, Q-K-10, Q-K-13, Q-K-14, Q-K-20.
"""
type SourceLocator implements Entity
  @node(labels: ["SourceLocator", "InformationArtifact"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  selectorKind: SelectorKind!
  "sha256:<hex> over the canonical JSON of the verification.v1 selector; identity with the snapshot."
  selectorDigest: String!
  "Canonical JSON of the full verification.v1 selector (offset basis, normalization, table cell, JSON pointer, bbox); `basis` (projection id@version) is mandatory and normalization is part of the projection (R-38)."
  selectorJson: String!
  "Verbatim selected text (TextQuoteSelector.exact) when textual."
  exact: String
  prefix: String
  suffix: String
  "sha256:<hex> of exact after normalization."
  quoteHash: String
  startOffset: Int
  endOffset: Int
  "1-based page (PDF_TEXT, BOUNDING_BOX)."
  page: Int
  "Media time on the captured rendition's own timeline (MEDIA_TIMECODE)."
  mediaStartSeconds: Float
  mediaEndSeconds: Float
  "Speaker label printed beside the span (what the source printed, not attribution)."
  speakerLabelInSource: String
  "uid of the older-snapshot locator this one re-finds (exact or fuzzy, in reanchorMatch)."
  reanchorsLocatorUid: String
  reanchorMatch: String
  """class: structural (inverse); cardinality: exactly_one; questions: Q-K-01, Q-K-20."""
  snapshot: [SourceSnapshot!]!
    @relationship(type: "HAS_LOCATOR", direction: IN, properties: "StructuralEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

# =====================================================================================================
# Assertion, Adjudication
# =====================================================================================================

"""
Purpose: one attributable proposition (verification.v1 Assertion): exactly one subject, exactly one object or one
typed literal, exactly one asserter, at least one located span (HAS_EVIDENCE role SUPPORTS origin DECLARED). It
authorizes every asserted edge (AssertedEdgeProperties.assertionUid). A claim occurrence is an Assertion with
`assertionKind: CLAIM` (stored with the `Assertion` label only, no extra label; F-05) and one OCCURRENCE_OF edge to its Claim; a
recommendation is a claim occurrence with `speechAct: RECOMMENDS` (00-DIRECTIVE 3.9). Bitemporal: valid time
declared (validFrom/validTo, half-open), recorded time service-assigned (recordedAt; recordedTo written once on
supersession; the successor names it in `supersedesUid`, same asserter only, R-23). `status` is capture fidelity,
never truth. An Assertion that authorizes a typed edge has assertionKind RELATIONSHIP; only propositions entering the
Claim lifecycle are CLAIM; a node property read as a fact is written under a FIELD Assertion (registered field
predicate) and the node value is a cache (R-14, R-19).
Asserter (R-15, R-16): the issuer the document presents; a multi-author work (D3 Publication, D9 MediaWork) for what
it states in its own voice; else the Source's publisher Organization with qualifier `asserterBasis:PUBLISHER_DEFAULT`;
the BellLabs Agent only for BellLabs statements; an inferred speaker with `asserterBasis:INFERRED` plus a RESOLUTION
Assessment citing the span.
Kernel predicate conventions, registered once by K in final/vocabularies/predicates.yaml (R-52; values of `predicate`,
no typed relationship): RATES_CLAIM (a third party's verdict on a Claim: subject the Claim, valueString the rating
text, qualifier `scale=<...>`, asserter the rater, optional HAS_OBJECT the rating instrument record; never our
Assessment; its lattice mapping is a versioned D10 query-time rule, R-31), HAS_REVISION_STATUS (subject a Source,
valueString a SourceRevisionKind value, one Assertion per authority; only for non-scholarly Sources and for status
flags with no identified notice; an identified notice or new version is D3 REVISES, never both for one asserter and
notice, R-44), FIELD_NOT_REPORTED (subject the entity the field would describe, valueString the field the source was
read for, locator the section read or WHOLE_SNAPSHOT), CORRECTS (a correction occurrence, plus DERIVED_FROM the
corrected occurrence, R-20), CITES_AS_SUPPORT, HAS_CREDENTIAL, and HAS_IDENTIFIER (the authorization of each
HAS_IDENTIFIER episode, written by identifier.attach). A qualification is HAS_EVIDENCE {role QUALIFIES} plus qualifier
prefixes (R-20).
A retelling (an occurrence restating someone else's finding) has `basisKind: CITED_FROM_PRIOR_WORK` and DERIVED_FROM
the primary occurrence. A measured null is a positive statement of no change (`polarity: POSITIVE` with a
NO_CHANGE / NO_EFFECT predicate and `basisKind: DIRECT_MEASUREMENT`); NEGATIVE is a denial, never "not reported".
Identity rule: (subject, predicate, object or literal, asserter, locator set, validity) per intent; uid token:
`assertion`. Questions: Q-K-01, Q-K-02, Q-K-06, Q-K-07, Q-K-09, Q-K-10, Q-K-11, Q-K-15, Q-K-16, Q-K-20, Q-K-21,
Q-K-22, Q-K-27, Q-K-30, CQ-TM-02.
"""
type Assertion implements Entity
  @node(labels: ["Assertion"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Registered predicate; equals the edge type for an asserted edge."
  predicate: String!
  assertionKind: AssertionKind!
  "Required when assertionKind is CLAIM (verification.v1 rule)."
  claimType: ClaimType
  status: AssertionStatus!
  polarity: Polarity
  speechAct: SpeechAct
  basisKind: BasisKind
  "Natural-language proposition (verification.v1 proposition) when the record is not a typed literal."
  proposition: String
  "verification.v1 qualifiers (population, dose, condition) that must survive any retelling; registered prefixes such as `segment:<KIND>` (D9 segment of a media work: SPONSOR_READ, EDITORIAL, ...), `population:<code>`, `rendition:<source uid>`, `asserterBasis:PUBLISHER_DEFAULT|INFERRED` (R-16), `sourceRecordRemovedAt:<date>` (the source's own record time, R-24)."
  qualifiers: [String!]
  valueString: String
  valueNumber: Float
  valueBoolean: Boolean
  "UCUM unit of valueNumber, or an ISO 4217 currency written `iso4217:<CODE>` for a price."
  unitCode: String
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis
  validToBasis: ValidTimeBasis
  "Date at which the source states the fact held when it gives no bounds (validFromBasis OBSERVATION_ONLY keeps validFrom null)."
  validObservedAt: DateTime
  "Precision of validObservedAt (R-24)."
  validObservedAtPrecision: TimePrecision
  "Service-assigned commit time (recorded-time start); never before the cited snapshot's retrievedAt."
  recordedAt: DateTime!
  "Written once on supersession."
  recordedTo: DateTime
  "sha256:<hex> over the canonical immutable content."
  contentHash: String
  "uid of the Assertion this one supersedes (newer → older); same asserter only (R-23)."
  supersedesUid: String
  "Named rule for a CALCULATED assertion or an INFERRED bound."
  derivationRule: String
  "Extraction dimension of confidence; interpretable only with the generating Activity's methodVersion."
  extractionConfidence: Float
  "verification.v1 riskClass (low|medium|high|critical) when the producer declared one."
  riskClass: String
  "verification.v1 assertionId when the verifier saw this record."
  verificationAssertionId: String
  """class: structural; cardinality: exactly_one; questions: Q-K-01, Q-K-02, Q-K-05."""
  subject: [Subjectable!]!
    @relationship(type: "HAS_SUBJECT", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: zero_or_one (exclusive with the literal values); questions: Q-K-01, Q-K-02."""
  object: [Subjectable!]!
    @relationship(type: "HAS_OBJECT", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: exactly_one (D7 Person or Organization, K Agent, a D3 Publication or D9 MediaWork for a multi-author work's own voice (R-15), or a D9 Channel with channelKind ACCOUNT when no person is identified; validated by the executor, P20); questions: Q-K-01, Q-K-09, Q-K-15."""
  assertedBy: [Subjectable!]!
    @relationship(type: "ASSERTED_BY", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: one_or_more (role SUPPORTS, origin DECLARED); questions: Q-K-01, Q-K-10, Q-K-20."""
  evidence: [SourceLocator!]!
    @relationship(type: "HAS_EVIDENCE", direction: OUT, properties: "EvidenceEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: exactly_one; questions: Q-K-03, Q-K-04, Q-K-07."""
  generatedBy: [Activity!]!
    @relationship(type: "WAS_GENERATED_BY", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many (inputs of a CALCULATED assertion, or the primary occurrence a retelling restates); questions: Q-K-06, Q-K-18, Q-K-21, Q-K-30."""
  derivedFrom: [Assertion!]!
    @relationship(type: "DERIVED_FROM", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: zero_or_one (assertionKind CLAIM only); questions: Q-K-08, Q-K-09, Q-K-11."""
  occurrenceOf: [Claim!]!
    @relationship(type: "OCCURRENCE_OF", direction: OUT, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural (inverse); cardinality: many; questions: Q-K-01, Q-K-16."""
  adjudications: [Adjudication!]!
    @relationship(type: "ASSESSES", direction: IN, nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: one verification.v1 judgment about one Assertion, immutable (a re-review is a new node naming
`supersedesUid`). CAPTURE_FIDELITY judges the record against its declared span and feeds Assertion.status through
the verdict mapping; SUPPORT judges whether located evidence supports the proposition and never changes status.
The judge's evidence (supporting, contradicting, qualifying, context fragments) is HAS_EVIDENCE with a role. The
five orthogonal properties are stored separately; no aggregate erases a component. The verification run is the
generating Activity (activityKind VERIFICATION, bundleDigest), not a node of its own.
Identity rule: verification.v1 judgmentId when present, else (assertion, kind, methodVersion, recordedAt).
uid token: `adjudication`. Questions: Q-K-01, Q-K-08, Q-K-11, Q-K-16.
"""
type Adjudication implements Entity
  @node(labels: ["Adjudication", "EvidenceAssessment"])
  @query(aggregate: false)
  @mutation(operations: []) {
