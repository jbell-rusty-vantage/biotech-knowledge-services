# =====================================================================================================
# Interfaces
# =====================================================================================================

"""
Every node type of every module implements Entity and lists these fields verbatim (GraphQL requires the listing;
a module never changes their type, nullability or directives). `uid` (`hu:<token>:<opaque>`) is identity;
`id` is the opaque segment; `name` is presentation only. `lastWriterRunId` is the Mission Control run id of the
last intent that wrote the node (replaces `mongoResearchRunId`); authoritative lineage is WAS_GENERATED_BY an
Activity with that `runId`. `createdAt`/`updatedAt` are executor-set (updatedAt is the precondition clock).
Target of Activity.generated (WAS_GENERATED_BY). Questions: Q-K-03, Q-K-04, Q-K-05.
"""
interface Entity @query(aggregate: false) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
}

"""
The thin interface for anything an Assertion can be about, an Identifier can identify, a D9 Chunk can mention, an
Assessment, Report or Activity can assess, or an asserter can be. Every domain entity type implements
`Entity & Subjectable`; kernel implementers are Source, Agent and Claim. A versioned state that carries a registry
identifier, or that is the subject or object of an Assertion or the target of an Assessment, implements
`Entity & Subjectable`; other payload and retrieval structures implement `Entity` only (R-18). The subject of an
Assertion is the most specific record the source speaks about; evidence rolls up to the parent through the state
episodes. It declares no relationship fields: the kernel edges that target it (HAS_SUBJECT, HAS_OBJECT, ASSERTED_BY,
HAS_IDENTIFIER, ASSESSES) are declared once, on kernel types, and D9 declares MENTIONS (derived) on Chunk, so adding
an implementer costs one enum value in the executable schema. Domain edges that target it: kernel-meaning types
(ASSESSES, DERIVED_FROM, MENTIONS) plus two registered exceptions, D10 ASSOCIATES (derived) and D5 STEP_USES
(structural, executor-checked type list); any other domain edge to Subjectable needs a kernel amendment (R-28).
Questions: Q-K-01, Q-K-12, Q-K-14.
"""
interface Subjectable @query(aggregate: false) {
  uid: String!
  name: String
}

# =====================================================================================================
# Edge-property types (the only ones a domain module uses)
# =====================================================================================================

"""
Asserted edge episode (bitemporal). One relationship per recorded-time episode, authorized by exactly one
Assertion (`assertionUid`; its predicate equals the edge type, its subject/object equal the endpoints). Valid
bounds, precisions and bases are copied from the Assertion (half-open; null = unknown, never 'ongoing');
`recordedFrom` is service-assigned at commit; `recordedTo` is written once when the episode closes; nothing is
deleted. Every field is executor-set. `lastWriterRunId` names the writing Mission Control run.
An edge is projected only from a current POSITIVE Assertion (types registered with `projectionGate: SUPPORT` also
need a SUPPORT Adjudication); one episode per (from, to, type, asserter), other Assertions corroborate (R-22).
Entity → versioned-state attachments (formulation, label version, protocol edition, registration version) use this
type; a relationship type registered with `exclusive: true` may not overlap in valid and recorded time (an open
episode is closed before the next opens), enforced by the executor per relationship type (R-10).
"""
type AssertedEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  lastWriterRunId: String
}

"""
Derived edge (recorded time only): a regenerable, read-only projection rebuilt by a projection Activity. Exactly
one citation form: `projectionOfAssertionUid` (1:1), or `derivationRule` + `derivedFromAssertionUids`, or
`derivationRule` + `derivedFromAssessmentUids`. `derivationRule` names method and version (e.g.
`entity-link/v2`). A base type of the domain-local superset rule (M11, R-47).
"""
type DerivedEdgeProperties @relationshipProperties {
  projectionOfAssertionUid: String
  derivationRule: String
  derivedFromAssertionUids: [String!]
  derivedFromAssessmentUids: [String!]
  "Retrieval score of the method only (entity-link confidence, span overlap); never evidence, never a truth value, and never set on an edge between two domain entities (00-DIRECTIVE 3.6; executor-validated null there)."
  score: Float
  derivedAt: DateTime
  lastWriterRunId: String
}

"""
Structural edge (recorded time only): internal shape of one captured or composed record; needs no Assertion.
`orderIndex` orders siblings when the source orders them.
"""
type StructuralEdgeProperties @relationshipProperties {
  orderIndex: Int
  lastWriterRunId: String
}

"""
Asserted edge, recorded time only (added in the model stage, 00-DIRECTIVE rule 9): one relationship per
recorded-time episode, authorized by exactly one Assertion (`assertionUid`), for asserted edges whose valid time no
question reads (the authorizing Assertion still carries any valid time the source states). Same rules as
AssertedEdgeProperties without the valid-time fields; switching an edge to AssertedEdgeProperties later is additive.
"""
type AssertedRecordedProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  recordedFrom: DateTime!
  recordedTo: DateTime
  lastWriterRunId: String
}

"""
Kernel-internal. HAS_IDENTIFIER episode: every AssertedEdgeProperties field verbatim and in order, then `isPrimary`
(the verbatim-base-prefix rule of 09-reasoning applies to kernel types too). The validity of the ASSIGNMENT
of an identifier to a record lives here; the Identifier node holds only the string's own scheme-level validity.
"""
type IdentifierLinkProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  lastWriterRunId: String
  isPrimary: Boolean
}

"""
Kernel-internal. HAS_EVIDENCE qualifier, mirroring verification.v1 EvidenceEdge: `role` (how the located span
bears on the record) and `origin` (declared by the producer, or found by the verifier). This is where support and
contradiction live: always record → SourceLocator, never document → entity (00-DIRECTIVE 3.8). `authority` and
`independence` copy two axes of the verifier's per-evidence SourceAuthorityVector (directness, freshness and
applicability stay in the sealed bundle); `facet` is the verification.v1 metric evidence binding (null for
non-metric records). All three are written only on an Adjudication's VERIFIER_FOUND edges by the adjudication ingest
(an Assessment or Report may copy them onto its own edges); an Assertion's DECLARED edges never carry them, so a
verification run never rewrites the extractor's evidence record. Readers take them from the current Adjudications
of the assertion, on the spans the assertion declared (03 Q-K-15, Q-K-21).
"""
type EvidenceEdgeProperties @relationshipProperties {
  role: EvidenceRole!
  origin: EvidenceOrigin!
  expectedSelectedContentDigest: String
  authority: EvidenceAuthority
  independence: EvidenceIndependence
  facet: EvidenceFacet
  lastWriterRunId: String
}

