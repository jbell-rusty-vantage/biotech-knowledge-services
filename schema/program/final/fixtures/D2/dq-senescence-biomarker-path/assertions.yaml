# Assertions for fixture dq-senescence-biomarker-path (packet D2 with D4, fixtures stage, A3, 2026-10-08).
# Same conventions as ../nr-muscle-unstructured/assertions.yaml. This fixture carries the compound -> mechanism ->
# biomarker -> test path (Q-D2-03 / Q-D4-01) across D2 and D4 in one source. D4-owned records (Biomarker, Metric,
# REFLECTS_MECHANISM, QUANTIFIES, AssayVersion) are typed D4.* and use the D4 SDL names in this worktree (2026-10-08).
# Deviation from the model-stage stub, with reason: the D+Q effect is asserted with the combination regimen as subject
# (D5.Intervention "D+Q", a MechanismModulator member) and both drugs as TESTED exposures of the context; it is NOT
# projected onto dasatinib or quercetin alone, because the source never tested either alone (attributing it would
# overclaim). Single-substance questions reach the finding through EXPOSED_TO.
# Structural edges without their own producedBy use the file-level producedBy.
# Adversarial review (2026-10-08): the three contexts are one registered group (IN_STUDY_ARM NCT02848131 'Group 2'), so
# their dose of record is D3's InterventionComponent, one per drug (seamRecords IC-dq-01, IC-dq-02), which also resolves
# the one-amount-per-context problem for this combination (11 item 24); the context exposure fields are empty. The
# D+Q → IL-6 (MolecularEntity) projection is gone (pair cut); A-dq-05 still answers Q-D2-22 directly.
# Close-out FU-03 (2026-10-09, S fixture editor): R-15 asserter of A-dq-01..07 = the D3 Publication pub-hickson2019
# (multi-author paper; was the first author as a D7 Person); R-47 derived-edge fields (below); R-59 prose DECREASED.
