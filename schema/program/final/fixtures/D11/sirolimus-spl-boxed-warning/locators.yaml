  - id: "l-ofda-bw"
    snapshot: "snap-openfda-label-19880f51"
    selectorKind: "JSON_POINTER"
    jsonPointer: "/results/0/boxed_warning/0"
    pointerValue: "WARNING: IMMUNOSUPPRESSION, USE IS NOT RECOMMENDED IN LIVER OR LUNG TRANSPLANT PATIENTS Increased susceptibility to infection and the possible development of lymphoma and other malignancies may result from immunosuppression Increased susceptibility to infection and the possible development of lymphoma may result from immunosuppression. Only physicians experienced in immunosuppressive therapy and management of renal transplant patients should use sirolimus for prophylaxis of organ rejection in patients receiving renal transplants. Patients receiving the drug should be managed in facilities equipped and staffed with adequate laboratory and supportive medical resources. The physician responsible for maintenance therapy should have complete information requisite for the follow-up of the patient [ see Warnings and Precautions ( 5.1 ) ]. The safety and efficacy of sirolimus as immunosuppressive therapy have not been established in liver or lung transplant patients, and therefore, such use is not recommended [ see Warnings and Precautions ( 5.2 , 5.3 ) ]. Liver Transplantation \u2013 Excess Mortality, Graft Loss, and Hepatic Artery Thrombosis (HAT) The use of sirolimus in combination with tacrolimus was associated with excess mortality and graft loss in a study in de novo liver transplant patients. Many of these patients had evidence of infection at or near the time of death. In this and another study in de novo liver transplant patients, the use of sirolimus in combination with cyclosporine or tacrolimus was associated with an increase in HAT; most cases of HAT occurred within 30 days post-transplantation and most led to graft loss or death [ see Warnings and Precautions ( 5.2 ) ]. Lung Transplantation \u2013 Bronchial Anastomotic Dehiscence Cases of bronchial anastomotic dehiscence, most fatal, have been reported in de novo lung transplant patients when sirolimus has been used as part of an immunosuppressive regimen [see Warnings and Precautions ( 5.3 ) ]. WARNING: IMMUNOSUPPRESSION, USE IS NOT RECOMMENDED IN LIVER OR LUNG TRANSPLANT PATIENTS See full prescribing information for complete boxed warning. Increased susceptibility to infection and the possible development of lymphoma and other malignancies may result from immunosuppression ( 5.1 ). Only physicians experienced in immunosuppressive therapy and management of renal transplant patients should use sirolimus for prophylaxis of organ rejection in patients receiving renal transplants. The safety and efficacy of sirolimus as immunosuppressive therapy have not been established in liver or lung transplant patients, and therefore, such use is not recommended ( 5.2 , 5.3 ). \u2212 Liver Transplantation \u2013 Excess mortality, graft loss, and hepatic artery thrombosis ( 5.2 ). \u2212 Lung Transplantation \u2013 Bronchial anastomotic dehiscence ( 5.3 )."
