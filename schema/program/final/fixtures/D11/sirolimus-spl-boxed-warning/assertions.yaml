queries:
  Q-D11-11: |
    // from a UNII to every current label version that carries a boxed warning (Research; not medical advice)
    // same as 03-retrieval-patterns.md Q-D11-11: the D5 use constraint in the boxed-warning section of the label snapshot
    MATCH (s:ChemicalSubstance)-[:HAS_IDENTIFIER]->(:Identifier {scheme: 'UNII', value: 'W36ZG6FT64'})
    MATCH (s)<-[:REALIZES_SUBSTANCE]-(:IngredientMaterial)<-[:DECLARES_COMPONENT]-(lv:LabelVersion)<-[e:HAS_LABEL_VERSION]-(p:Package)
    WHERE e.recordedTo IS NULL
    MATCH (ha:Assertion {uid: e.assertionUid})-[:HAS_EVIDENCE]->(:SourceLocator)<-[:HAS_LOCATOR]-(snap:SourceSnapshot)
    MATCH (a:Assertion {predicate: 'USE_CONSTRAINED_IN'})-[:HAS_EVIDENCE {role: 'SUPPORTS'}]->(loc:SourceLocator)<-[:HAS_LOCATOR]-(snap)
    WHERE 'section:BOXED_WARNING' IN a.qualifiers AND a.recordedTo IS NULL AND loc.selectorKind = 'HTML'
    RETURN DISTINCT p.uid, lv.labelVersionCode, e.validFrom, a.proposition, a.valueString, loc.selectorJson, snap.publishedAt, snap.retrievedAt
  CQ-PV-05: |
    // is this source primary or a rendition, and how stale: Sources sharing the SPL set id
    // OWNER-GATED: a shared Identifier across Subjectables conflicts with R-42; no RENDITION_OF target exists for a label (see i02 note)
    MATCH (src:Source {uid: $openfdaSourceUid})-[:HAS_IDENTIFIER]->(id:Identifier)<-[:HAS_IDENTIFIER]-(other:Source)
    WHERE other <> src
    MATCH (src)-[:HAS_SNAPSHOT]->(s1:SourceSnapshot), (other)-[:HAS_SNAPSHOT]->(s2:SourceSnapshot)
    RETURN src.genre, other.genre, id.scheme, id.value, s1.retrievedAt, s2.publishedAt, s2.retrievedAt
