# producedBy ids are FIXTURE ids (mission:ft-D1-fixtures / run:ft-D1-<fixture>), not live Mission Control ids.
# Harm (liver injury) is a D5 SAFETY_SIGNAL Assessment about the Taxon and the preparations, never a material property.
# Adversarial review (2026-10-08): MATERIAL_CONTAINS edges carry only statementKind, quantity, comparator (GTE/LT spelling)
# and unitCode (content basis is an Assertion qualifier); WITHAFERIN A cites the stable GSRS full record (L6DO3QW4K5 v8)
# instead of the search response, whose bytes change per request; s03 restricts a signal to a plant part with the
# Assessment facet plantPart=LEAF (Q-D1-12).
