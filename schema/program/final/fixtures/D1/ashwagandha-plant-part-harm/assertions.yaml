assessments:
  - id: r04-resolve-ashwagandha
    assessmentKind: RESOLUTION
    assessmentSubkind: "D1.common-name-resolution"
    about: [ { ref: tax-ws, type: Taxon } ]
    evidence: [ { locator: l-ncbi126910-common, role: SUPPORTS }, { locator: l-dsld306237-form, role: CONTEXT } ]
    score: 1.0
    summary: "'Ashwagandha' (label group and form name) -> Withania somnifera (NCBI 126910, CommonName ashwagandha)."
    methodVersion: "d1-resolve/v1"
    status: PROPOSED
    producedBy: { missionId: "mission:ft-D1-fixtures", runId: "run:ft-D1-ashwagandha-plant-part-harm" }
  - id: q01-identity-granularity
    assessmentKind: QUALITY
    assessmentSubkind: "D1.identity-granularity"
    about: [ { ref: mat-ksm66, type: IngredientMaterial }, { ref: sub-ws-root, type: ChemicalSubstance } ]
    inputAssertions: [w03-ksm66-realizes-root]
    evidence: [ { locator: l-dsld306237-row, role: SUPPORTS, note: "branded row uniiCode sentinel '0'" }, { locator: l-dsld306237-form, role: SUPPORTS }, { locator: l-gsrsv038-part, role: CONTEXT } ]
    summary: "The extract (KSM-66) carries the UNII of the whole-root substance; GSRS has no record for this extract. Substance-level joins (all root products) are valid; extract-level joins (same ratio, same marker spec) are not. The branded row's uniiCode '0' is a sentinel, not an identifier."
    methodVersion: "d1-identity-quality/v1"
    status: PROPOSED
    producedBy: { missionId: "mission:ft-D1-fixtures", runId: "run:ft-D1-ashwagandha-plant-part-harm" }
  - id: s02-ashwagandha-liver-signal
    assessmentKind: SAFETY_SIGNAL
    assessmentSubkind: "D5.hepatotoxicity"
    about: [ { ref: tax-ws, type: Taxon }, { ref: sub-ws-root, type: ChemicalSubstance } ]
    effectDirection: HARM
    evidence: [ { locator: l-tga-ash-avoid, role: SUPPORTS }, { locator: l-tga-ash-cases, role: SUPPORTS } ]
    summary: "TGA: very rare risk of liver injury; products containing W. somnifera should be avoided in individuals with existing liver disorders; 11 possible liver-injury cases reported to TGA. About the organism and its root preparations; never stored as a property of KSM-66 or any product. No plantPart facet: the signal applies to every plant part (Q-D1-12)."
    methodVersion: "d5-safety-signal/v1 (fixture)"
    status: PROPOSED
    module: D5
    producedBy: { missionId: "mission:ft-D1-fixtures", runId: "run:ft-D1-ashwagandha-plant-part-harm" }
  - id: s03-ashwagandha-leaf-restriction
    assessmentKind: SAFETY_SIGNAL
    assessmentSubkind: "D5.regulatory-restriction"
    about: [ { ref: tax-ws, type: Taxon } ]
    effectDirection: HARM
    facets: ["plantPart=LEAF", "jurisdiction=IN"]
    evidence: [ { locator: l-tga-ash-leafban, role: SUPPORTS }, { locator: l-tga-ash-rootpermitted, role: CONTEXT }, { locator: l-tga-ash-part, role: CONTEXT } ]
    summary: "TGA reports that the use of W. somnifera leaves was recently banned in India while the roots remain permitted, subject to prescribed limits. The signal is restricted to a plant part by the kernel Assessment facet plantPart=LEAF (value from D1 PlantPart), so Q-D1-12 returns leaf preparations and not KSM-66 or the dried-root extract (plantPart ROOT). Secondary report: the Indian advisory itself was not fetched; TGA is the asserter of record."
    methodVersion: "d5-safety-signal/v1 (fixture)"
    status: PROPOSED
    module: D5
    producedBy: { missionId: "mission:ft-D1-fixtures", runId: "run:ft-D1-ashwagandha-plant-part-harm" }
  - id: ap02-plant-part-relevance
    assessmentKind: APPLICABILITY
    assessmentSubkind: "D1.preparation-relevance"
    about: [ { ref: mat-ksm66, type: IngredientMaterial }, { ref: mat-ws-tincture, type: IngredientMaterial } ]
    inputAssessments: [s02-ashwagandha-liver-signal]
    inputAssertions: [w02-ksm66-root-only, w07-tincture-ratio, w04-ksm66-withanolides]
    evidence: [ { locator: l-tga-ash-part, role: SUPPORTS }, { locator: l-tga-ash-extraction, role: SUPPORTS }, { locator: l-ecfr-plantpart, role: CONTEXT } ]
    summary: "Composition (withanolides) depends on leaf vs root and on extraction method and ratio, so a signal for one preparation transfers to another only through plantPart, preparationType and ratio — which is why these are IngredientMaterial properties (enum plantPart) that Q-D1-12 filters on. US labels must name the plant part (21 CFR 101.36)."
    methodVersion: "d1-preparation-relevance/v1"
    status: PROPOSED
    producedBy: { missionId: "mission:ft-D1-fixtures", runId: "run:ft-D1-ashwagandha-plant-part-harm" }
