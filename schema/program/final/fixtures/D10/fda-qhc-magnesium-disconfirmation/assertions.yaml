    assessmentSubkind: D10.fidelity.unit
    status: PROPOSED
    methodVersion: "bl-fidelity/unit@1 (fixture; adversarial-review stage: compares against the same primary, not a secondary)"
    verdict: PARTIALLY_SUPPORTED
    summary: "The letter is internally inconsistent. On p. 23 it gives the whole range of magnesium intakes studied as '181 mg/day to 960 g/day'; on p. 22 it gives 181 mg/day to 960 mg/day for the 18 studies that showed a benefit and 240 mg/day to 720 mg/day for the 20 that did not, so the whole range is 181 to 960 mg/day and 'g/day' is a unit slip. The lower bound is supported; the unit of the upper bound is contradicted by the letter itself."
    unsupportedFacets: ["unit of the upper bound (g/day; the letter's own p. 22 says mg/day)"]
    about: [{ ref: e-claim, type: K.Claim }]
    inputAssertions: [a-unit-slip, a-dose-range-benefit, a-dose-range-nobenefit]
    evidence:
      - { locator: loc-unit-slip, role: CONTEXT, origin: DECLARED }
