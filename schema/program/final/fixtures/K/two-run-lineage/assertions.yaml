# Activity (one Activity per run; 09-reasoning "Lineage spine"). The records the runs wrote live in the sibling fixtures; this
# file defines the Activities and Agents, the lineage edges between Activities, the R2 correction of an R1 record, and the
# expected answers of the four lineage questions (Q-K-04 .. Q-K-07). `lineage-index.yaml` (generated by scratch
# ft/K/fixtures/tools/finalize_k.py from the six assertions.yaml files) lists every record with the run that created or updated it.
# All mission / run / operation ids and uids are FIXTURE ids; times are fixture clock values; nothing was written to a graph.

