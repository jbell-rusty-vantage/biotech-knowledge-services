# has two snapshots of one Source: an Internet Archive capture of 2024-08-16 (no retraction) and the live 2026-10-08 page
# ("Retraction in:"), recorded as revisionKind RETRACTION on the later snapshot (capture cache). Three authorities state the
# retraction, each as its own D3 REVISES Assertion notice -> article (R-44: the revising notice is identified, PMID 40613201 /
# DOI 10.3892/mmr.2025.13603; Retraction Watch via Crossref, NLM via PubMed, the publisher via its page and notice), and they
# disagree on the date. The captured Sources reach the two D3 Publications by asserted RENDITION_OF (R-43/R-26), so the K
# patterns read Source -RENDITION_OF-> Publication <-REVISES- notice; PMID/DOI sit on the Publications (R-42).
# Close-out FU-03/FU-13 (2026-10-09): the three revision-status FIELD rows -> REVISES; MAY_IMPROVE_PROGNOSIS_OF ->
# IMPROVES_TARGET with a D5 Target (R-83); DIRECTLY_ACTIVATES -> ACTIVATES; claim-sah propositionHash recomputed. The occurrences extracted from the 2024 snapshot are not deleted: Q-K-10 lists them as stale,
# Q-K-17 flags the report that cites one, CQ-TM-02 shows the late-arriving valid time.
# Conventions: see ../resveratrol-sirt1-evidence-mission/assertions.yaml.

