# Kind: harm (authority and independence). Interested parties restate the resveratrol-SIRT1 proposition:
#  - a reagent vendor's catalog page states it as present fact and cites the 2003 paper (a retelling: DERIVED_FROM the primary
#    occurrence, basisKind CITED_FROM_PRIOR_WORK; the cited work does say it, in 2003; the page omits the later disconfirmation);
#  - a supplement brand's blog accurately retells the 2010 disconfirmation while selling resveratrol (accuracy and interest
#    are orthogonal);
#  - the verification.v1 benchmark twin (internal) shows CAPTURE_FIDELITY rejecting an interested-party statement mutated into
#    "an independent clinical trial establishes ...".
