- ref: crit-filter-moiety
  uid: hu:decision-criterion:fx-xfx-pc-bl-nr-declared-amount-convertible-to-moiety-1
  criterionKey: bl:nr:declared-amount-convertible-to-moiety
  version: '1'
  criteriaSetKey: bl:compare:nr-products
  criteriaSetVersion: '1'
  criterionKind: FILTER
  direction: NOT_ORDERED
  evaluationOrder: 2
  definition: An option enters the ranked set only if its declared NR amount converts to nicotinamide riboside (the cation, UNII 0I8H2M0L7N) under rule:mw-ratio.v1 (FIXTURE-ILLUSTRATIVE).
  rule: PASS if the latest label version's NR line has massBasis ACTIVE_MOIETY, or SALT_FORM with a REALIZES_SUBSTANCE salt that HAS_ACTIVE_MOIETY NR and MOLECULAR_WEIGHT assertions
    for salt and moiety (so a MOIETY_EQUIVALENT_AMOUNT exists); otherwise NOT_EVALUATED with missingFactKeys. PROPOSED inputs are allowed and flagged on the row.
  inputPredicates:
  - DECLARES_COMPONENT
  - REALIZES_SUBSTANCE
  - HAS_ACTIVE_MOIETY
  - MOLECULAR_WEIGHT
  - MOIETY_EQUIVALENT_AMOUNT
  - FIELD_NOT_REPORTED
  publisherUid: hu:org:fx-xfx-pc-belllabs
  recordedAt: '2026-10-09T05:00:00Z'
  generatedBy: act-compare
