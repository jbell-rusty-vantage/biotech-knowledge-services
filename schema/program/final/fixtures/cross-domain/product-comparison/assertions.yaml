# Record of truth for this fixture (R-40). Generated by scratch bin/build_fixture.py + bin/emit.py, which check every record
# against final/schema/final_biotech_schema_v2.ir.json (node types, property names, enum values, typed (type, from, to)
# triples, edge-property names) and recompute every CALCULATED number from the numbers inside the cited locator quotes.
# Shapes follow the kernel pattern (packets/K/09-reasoning.md): one subject, one object or a typed literal, one asserter,
# locators via HAS_EVIDENCE {role SUPPORTS, origin DECLARED}; an asserted typed edge carries the Assertion's uid in its
# edge properties. CALCULATED assertions cite DERIVED_FROM inputs instead of locators. Type prefixes name the owning module.
# Asserter rule: R-16 (labeler of record for label lines, NIH ODS for DSLD curation, BellLabs agents only for curation and
# CALCULATED values). Research, not medical advice; the criteria set is fixture-illustrative, not a BellLabs policy.
