  uid: hu:decision-criterion:fx-xfx-pc-bl-nr-block-no-current-certification-1
  criterionKey: bl:nr:block-no-current-certification
  version: '1'
  criteriaSetKey: bl:compare:nr-products
  criteriaSetVersion: '1'
  criterionKind: BLOCK
  direction: NOT_ORDERED
  evaluationOrder: 1
  definition: Block an option that no third-party certification listing covers at the evaluation time (FIXTURE-ILLUSTRATIVE, not a BellLabs policy).
  rule: BLOCKED if no CertificationListing with status LISTED has an open COVERS episode at T to the option's Product, its ProductVariant, or a Lot that is LOT_OF either; NOT_EVALUATED
    if no certifier source was read for the option.
  inputPredicates:
  - COVERS
  - LOT_OF
  - ISSUED_BY
