  step1_findChunk:
    viaMentions: "derived MENTIONS (kernel type, D9 Chunk.mentions, DerivedEdgeProperties) from ch-active to hu:org:metrobiotech-international, hu:org:edenroc-sciences-companies, hu:org:segterra, hu:org:life-biosciences-llc (entity linking, method version on the projection Activity)"
    viaVector: "D9 chunk embedding index, query text 'NAD boosters' -> ch-active (the only chunk containing the phrase)"
    cypher: |
      MATCH (o:Organization {uid: 'hu:org:metrobiotech-international'})<-[:MENTIONS]-(ch:Chunk)-[:CHUNK_OF]->(snap:SourceSnapshot)
      WHERE ch.recordedTo IS NULL
      RETURN ch.uid, ch.startOffset, ch.endOffset, ch.textVersionHash, snap.uid        // D9 SDL names (Chunk.mentions, Chunk.snapshot); adversarial-review rewrite
  step2_assertionsInChunk:
    rule: "Assertions whose SUPPORTS locator the chunk covers (D9 derived COVERS_LOCATOR, projection span-overlap/v1 over chunk and locator offsets in the same snapshot); the offset test is the fallback when the projection has not run"
    cypher: |
      MATCH (ch:Chunk {uid: $chunk})-[:COVERS_LOCATOR]->(loc:SourceLocator)<-[ev:HAS_EVIDENCE {role:'SUPPORTS'}]-(a:Assertion)
      RETURN a.uid, a.predicate, loc.exact
      // fallback: MATCH (ch:Chunk {uid: $chunk})-[:CHUNK_OF]->(snap:SourceSnapshot)-[:HAS_LOCATOR]->(loc:SourceLocator)<-[:HAS_EVIDENCE {role:'SUPPORTS'}]-(a:Assertion)
      //           WHERE loc.startOffset >= ch.startOffset AND loc.endOffset <= ch.endOffset RETURN a.uid, a.predicate, loc.exact
    expected: { ch-active: [a-01, a-02, a-03, a-04, a-05, a-06, a-07, a-08, a-09, a-10], ch-consumer: [a-11, a-12] }
  step3_interestPath:
    cypher: |
      MATCH (p:Person {uid: 'hu:person:david-a-sinclair'})-[r:HOLDS_ROLE|HOLDS_STAKE|RECEIVES_VALUE_FROM]->(g:Organization)
            -[c:PARENT_OF]->(m:Organization {uid: 'hu:org:metrobiotech-international'})
      WHERE r.recordedTo IS NULL AND c.recordedTo IS NULL            // c.controlKind = GROUP_MEMBER_UNSPECIFIED is opted in here
      RETURN type(r), coalesce(r.stakeKind, r.roleKind) AS kind, g.name, c.controlKind, r.assertionUid, c.assertionUid
    expected: "EQUITY (a-07), INVESTOR_UNSPECIFIED (a-08), FOUNDER (a-09) at group level -> EdenRoc Sciences companies -> PARENT_OF GROUP_MEMBER_UNSPECIFIED (a-10) -> MetroBiotech International"
  step4_locatorToBytes:
    rule: "TRACE (03-retrieval-patterns.md): a.uid -> HAS_EVIDENCE -> SourceLocator (selectorJson, exact) -> SourceSnapshot (contentHash sha256:4a360dd31a561a81b4a6fc70ec16f890322f6dcbe860aab7e31b78ff69688f3f) -> bytes in the object store"
    verifierReselect: "verification.v1 re-applies loc.selectorJson to the same snapshot bytes: text[1811:1928] (after U+00A0 -> U+0020) equals loc-sin-metrobiotech.exact and text[1665:1705] equals loc-sin-edenroc.exact; checked in this stage by the scratch re-selection script (RUNLOG)"
