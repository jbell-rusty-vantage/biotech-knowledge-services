# 4. SDL binding (every value below is checked against final/schema/final_biotech_schema_v2.graphql)
# ---------------------------------------------------------------------------------------------
sdlEnums:
  ReportKind: [EVIDENCE_REPORT, ANSWER, COMPARISON, PROFILE, RECOMMENDATION]
  AssociationKind: [EVIDENCE_AGGREGATE, SIGNAL_DISPROPORTIONALITY, CO_OCCURRENCE, SIMILARITY, LINK_PREDICTION]
  ActivityKind: [RESEARCH, INGESTION, VETTING, EVIDENCE_MISSION, VERIFICATION, PROJECTION, ANSWER]
recordsByKind:   # node types of the final SDL that carry each kind's payload (K Report / Assessment / Assertion, D10 ReportItem / Association)
  published: [Report, ReportItem]
  assessment: [Assessment]
  materialized: [Association, Assertion]
  retrieved: [Assertion]
replay: "an ANSWER Report carries queryDigest (digest of the read intent) for replay (K Report)"

