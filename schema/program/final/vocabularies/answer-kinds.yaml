# Answer kinds — final vocabulary (synthesis, VOCABULARIES stage, 2026-10-09).
# What the main payload of an answer IS: the record a user would cite back (directive 3.5, 3.6; PLAN 6.1).
# Method and rulings: packets/D10/answer-kind-table.md (owner D10, A1), adopted by final/decision-report.md R-50
# (with R-08 for the CQ-PF-03 split and R-49 for the discourse metrics). Every count below was recomputed from that
# table by scratch synth/vocab/answer-kind-counts.mjs (final/_runlog/vocabularies.md) and matches the table's own summary.
# Research is not medical advice; an answer kind says how an answer is produced and cited, not whether it is right.

version: 1
status: synthesis-final-candidate
published: 2026-10-09
owner: D10 (method and per-question rulings); K (the records each kind lands in)
sources:
  - packets/D10/answer-kind-table.md (sections Summary, Disagreements, Shared ids, Method, Table)
  - packets/D10/report-skeletons.md (skeleton names carried in Report.skeletonKey)
  - packets/K/09-reasoning.md (Report skeleton minimum citation set; projection caches)
  - fast-track/00-DIRECTIVE.md 3.5 (computed vs published comparisons), 3.6 (association / derived insight / evidence report)
  - final/decision-report.md R-08, R-45, R-49, R-50
  - final/schema/final_biotech_schema_v2.graphql (enums ReportKind, AssessmentKind, AssociationKind, ActivityKind)

# ---------------------------------------------------------------------------------------------
# 1. The four kinds. Apply per (packet, question id), first match wins: published → assessment → materialized → retrieved.
#    Default: the packet's declared kind stands; D10 overrides only where a rule clearly applies (table "Method").
# ---------------------------------------------------------------------------------------------
kinds:
  - value: published
    rule: R1
    definition: >-
      BellLabs signs the payload for an audience at a time under a policy version: evidence reports, comparison
      reports, profiles, protocol reviews, published answers. A question whose payload is the content or verdict of a
      published Report is published; a question about the live status of many Reports (stale-report queue, reverse
      citations) is retrieved.
    record: "kernel Report (reportKind: EVIDENCE_REPORT | ANSWER | COMPARISON | PROFILE | RECOMMENDATION; skeletonKey names the D10 skeleton) with D10 ReportItem rows"
    trace: "Report → ReportItem → DERIVED_FROM cited Assertions/Assessments → HAS_EVIDENCE locators → snapshots; bodyDigest + policyVersion + composing Activity (EVIDENCE_MISSION, ANSWER, or PROJECTION for a PROFILE)"
    freshness: "frozen at publishedAt; listed by the stale-report queue (Q-D10-13) and the re-review queue (Q-D10-24) when an input changes"
    insertOnly: "a revision is a new Report naming supersedesUid (K)"
  - value: assessment
    rule: R2
    definition: >-
      The payload is a judgment that could be wrong, has a producer who answers for it, weighs named inputs and must be
      supersedable: synthesis, strength, harm causality, vetting, identity and applicability matches, retelling
      fidelity, signal interpretation, comparability.
    record: "kernel Assessment (assessmentKind; domain detail in assessmentSubkind; status PROPOSED | ACCEPTED | SUPERSEDED | WITHDRAWN)"
    trace: "STRACE = Assessment → DERIVED_FROM inputs → TRACE, plus its own HAS_EVIDENCE spans and producing Agent / Activity"
    freshness: "until superseded (show recordedAt); re-assess when a DERIVED_FROM input is superseded"
  - value: materialized
    rule: R3
    definition: >-
      The computation is expensive or graph-global (GDS over a projection, a score over thousands of assertions, a
      derived number reused by many questions) and reused across queries. Cheap bounded aggregates and threshold
      filters are retrieved; GDS results streamed per request and never written are retrieved.
    record: >-
      D10 Association (pair score under a method version, associationKind), kernel CALCULATED Assertion or computed
      state, a derived edge (MENTIONS), a stored GDS output, or projection-cache properties on the measured node
      (R-45; the form R-49 rules for the discourse metrics CQ-CL-06, Q-D9-08, Q-D9-19)
    trace: "record → DERIVED_FROM inputs (inputSetDigest) → TRACE, with methodVersion and the PROJECTION Activity"
    freshness: "method bound (staleAfter / refresh cadence) and stale as soon as an input is superseded (CQ-AX-08 audit)"
    gate: "materialize only when a fixture-graph p95 exceeds 200 ms, or the read is graph-global and reused by >= 2 questions; run the latency test before a projection is made permanent (R-50)"
  - value: retrieved
    rule: R4
    definition: >-
      Otherwise: asserted facts, or a cheap deterministic computation over them under declared criteria. Every ad hoc
      ranking, comparison or avoid-list is retrieved (computed under DecisionCriterion@version, Q-D10-01), with a
      published variant only when BellLabs signs it. Integrity audits over derived or published records are retrieved
      (an audit must read current inputs; a stored audit goes stale).
    record: "kernel Assertion (and the domain records and edges it authorizes), or computed rows × DecisionCriterion@version (D10)"
    trace: "TRACE = Assertion → HAS_EVIDENCE → SourceLocator → SourceSnapshot (+ Adjudication, producing Activity)"
    freshness: "live; as fresh as the latest capture of each input (current-state answers carry lastObservedAt, CQ-AX-06)"

publishedVariant: >-
  A retrieved ranking, comparison or avoid-list may also be published as a signed Report (COMPARISON, or an avoidance
  Report) for an audience; the default answer stays retrieved. Six rows carry a published variant (counts.publishedVariants).
neverAKind:
  - "a plain edge between two domain entities with a confidence number (directive 3.6): an association is materialized, a derived insight is an assessment, an evidence report is published"
  - "a stored comparison or ranking that is not a published Report (directive 3.5)"

