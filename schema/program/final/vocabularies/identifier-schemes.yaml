bridgeTable:
  - id: B01
    from:
      - PMID
    to:
      - PMCID
      - DOI
    fromAsWritten: PMID
    toAsWritten:
      - PMCID
      - DOI
    via: pmc-idconv (authority); europepmc-rest; openalex (aggregator)
    kind: authority-asserted
    readiness: 3
    failureModes: No PMCID for non-OA papers; OpenAlex returns PMID as a URL.
  - id: B02
    from:
      - DOI
    to:
      - PMID
    fromAsWritten: DOI
    toAsWritten:
      - PMID
    via: ncbi-eutils-pubmed (ELocationID doi), crossref-rest (no PMID), openalex ids
    kind: authority-asserted (NLM)
    readiness: 3
    failureModes: Crossref does not carry PMIDs; DOI case variants.
  - id: B03
    from:
      - NCT
    to:
      - PMID
      - DOI
    fromAsWritten: NCT
    toAsWritten:
      - PMID
      - DOI
    via: publication full text (JATS ext-link-type pmc:clinical-trial); PubMed DataBank/[si] when deposited; CT.gov referencesModule when the sponsor enters it
    kind: source-asserted in the paper; registry/index links are optional deposits
    readiness: 2
    gap: G4 (JATS ext-link extractor) — action-space
    failureModes: The bridge exists only inside the paper's text for this trial. Any registry-first or index-first agent concludes 'no publication'.
  - id: B04
    from:
      - NCT
    to:
      - EUCT
      - EUDRACT
      - ISRCTN
      - ORG_STUDY_ID
    fromAsWritten: NCT
    toAsWritten:
      - EU_CT
      - EudraCT
      - ISRCTN
      - ORG_STUDY_ID
    via: ctgov-v2-api secondaryIdInfos; who-ictrp secondary ids; eu-ctis-public
    kind: registry-asserted (sponsor-entered)
    readiness: 2
    failureModes: Sponsor-entered, often missing; ICTRP copy can be years stale (Last refreshed 12 December 2016).
  - id: B05
    from:
      - DOI
    to:
      - DOI
    fromAsWritten: DOI (preprint)
    toAsWritten: DOI (journal article)
    via: biorxiv-api published_doi; crossref-rest relation is-preprint-of / has-preprint
    kind: authority-asserted (server), incomplete
    readiness: 2
    failureModes: Missing links; never infer by title alone without a hypothesis.
  - id: B06
    from:
      - DOI
    to:
      - DOI
    fromAsWritten: DOI (article)
    toAsWritten: DOI (retraction / correction notice)
    via: crossref-rest updated-by (source retraction-watch or publisher); ncbi-eutils-pubmed CommentsCorrections
    kind: authority-asserted
    readiness: 3
    failureModes: Discovery tools (Firecrawl research index, PubMed MCP) do not surface it.
  - id: B07
    from:
      - UNII
    to:
      - CAS_RN
      - PUBCHEM_CID
      - FDA_GRN
      - NCIT
      - INCHIKEY
    fromAsWritten: UNII
    toAsWritten:
      - CAS_RN
      - PUBCHEM_CID
      - FDA_GRN
      - NCIt
      - INCHIKEY
    via: fda-gsrs codes[] and structure
    kind: authority-asserted (FDA GSRS, record version 18)
    readiness: 3
    failureModes: GSRS codes are curated per form; the moiety UNII has its own set.
  - id: B08
    from:
      - UNII
    to:
      - UNII
    fromAsWritten: UNII (salt / form)
    toAsWritten: UNII (active moiety)
    via: fda-gsrs relationships (ACTIVE MOIETY, PARENT->SALT/SOLVATE)
    kind: authority-asserted
    readiness: 3
    failureModes: "A study administered NR chloride (JATS Par30: 'nicotinamide riboside chloride (NIAGEN®; 500 mg, twice per day …)') and the DSLD row is the branded ingredient 'Niagen' (row uniiCode null) with nested form 'Nicotinamide Riboside Chloride' (uniiCode 8XM2XT8VWI), 300 mg → the form is known but the mass basis of 300 mg (salt vs moiety) is not stated; this is a quantity-basis risk (CQ-PV-04)."
  - id: B09
    from:
      - PUBCHEM_CID
    to:
      - UNII
      - CAS_RN
    fromAsWritten: PUBCHEM_CID
    toAsWritten:
      - UNII
      - CAS_RN
    via: pubchem-pug-rest synonyms (untyped strings) and xrefs RegistryID
    kind: aggregator (depositor-supplied)
    readiness: 2
    failureModes: Untyped synonym strings; pattern matching required; depositor errors propagate.
  - id: B10
    from:
      - name
    to:
      - PUBCHEM_CID
      - CHEBI
      - RXCUI
    fromAsWritten: name (free text)
    toAsWritten:
      - PUBCHEM_CID
      - CHEBI
      - RXCUI
    via: pubchem-pug-rest name endpoint; ebi-ols4-chebi; nlm-rxnav; europepmc-annotations
    kind: hypothesis only (CQ-AX-14)
    readiness: 1
    failureModes: Form loss and outright mislinks.
  - id: B11
    from:
      - RXCUI
    to:
      - UNII
    fromAsWritten: RXCUI
    toAsWritten: UNII
    via: nlm-rxnav property UNII_CODE
    kind: authority-asserted (NLM)
    readiness: 3
  - id: B12
    from:
      - SPL_SET_ID
    to:
      - UNII
      - NDC
      - RXCUI
    fromAsWritten: SPL_SET_ID
    toAsWritten:
      - UNII
      - NDC
      - RXCUI
    via: dailymed-spl XML; openfda-drug-label openfda block
    kind: authority-asserted (labeler SPL) / harmonized (openFDA)
    readiness: 3
  - id: B13
    from:
      - DSLD
    to:
      - GTIN
      - UNII
      - DSLD
    fromAsWritten: DSLD_LABEL_ID
    toAsWritten:
      - GTIN
      - UNII
      - DSLD_LABEL_ID (other versions)
    via: nih-dsld upcSku, ingredientRows[].uniiCode and ingredientRows[].forms[].uniiCode, labelRelationships
    kind: authority-asserted (NIH ODS transcription of the label)
    readiness: 2
    failureModes: UNII sits on the nested form, not on the branded ingredient row; GTIN printed with spaces; label versions share GTIN.
  - id: B14
    from:
      - GTIN
    to:
      - FDC_ID
      - DSLD
      - merchant listing
    fromAsWritten: GTIN
    toAsWritten:
      - FDC_ID
      - DSLD_LABEL_ID
      - merchant listing
    via: usda-fdc gtinUpc (blocked today), nih-dsld upcSku, Shopify <handle>.js barcode (D6), Open Food Facts by barcode (D6)
    kind: aggregator joins on a normalized key
    readiness: 1
    failureModes: Requires gtin14-v1 normalization on both sides; GS1 registry itself not open.
  - id: B15
    from:
      - GTIN
    to:
      - UDI_DI
    fromAsWritten: GTIN
    toAsWritten: UDI_DI
    via: fda-gudid (GS1-issued DIs are GTINs)
    kind: identity by issuer rule (same GS1 number)
    readiness: 3
  - id: B16
    from:
      - product brand string
    to:
      - GTIN
      - DSLD
    fromAsWritten: product brand string (free text)
    toAsWritten:
      - GTIN
      - DSLD_LABEL_ID
    via: openfda-caers products.name_brand; openfda-food-enforcement product_description
    kind: hypothesis only
    readiness: 1
    failureModes: Adverse-event and recall records cannot be joined to a product version by identifier.
  - id: B17
    from:
      - LOINC
    to:
      - UCUM
    fromAsWritten: LOINC
    toAsWritten: UCUM
    via: LOINC table EXAMPLE_UCUM_UNITS (licensed download); NLM Clinical Tables (partial)
    kind: authority-asserted (Regenstrief)
    readiness: 1
    failureModes: Lab vendor test codes ↔ LOINC mappings live on vendor test menus (scrape).
  - id: B18
    from:
      - SEC_CIK
    to:
      - LEI
    fromAsWritten: CIK
    toAsWritten: LEI
    via: none authoritative (EDGAR submissions.lei null; GLEIF has no CIK)
    kind: hypothesis (legal name + jurisdiction + registration number match)
    readiness: 1
    failureModes: Renames not propagated to GLEIF; lapsed registrations.
  - id: B19
    from:
      - SEC_CIK
    to:
      - TICKER
    fromAsWritten: CIK
    toAsWritten: ticker
    via: sec-edgar company_tickers.json
    kind: authority-asserted, time-varying
    readiness: 3
  - id: B20
    from:
      - person name
    to:
      - NPI
      - ORCID
    fromAsWritten: person name
    toAsWritten:
      - NPI
      - ORCID
    via: nppes-npi search; europepmc authorIdList; JATS contrib-id
    kind: hypothesis only
    readiness: 1
    failureModes: Wrong-person attribution (credentials, conflicts of interest).
  - id: B21
    from:
      - CT.gov condition string
    to:
      - ICD10CM
      - MONDO
      - EFO
    fromAsWritten: CT.gov condition string
    toAsWritten:
      - ICD10CM
      - MONDO/EFO
    via: icd10cm-pcs; ebi-ols4
    kind: hypothesis (mapping)
    readiness: 1
  - id: B22
    from:
      - organization
    to:
      - funding / competing-interest disclosure
    fromAsWritten: organization (sponsor/collaborator)
    toAsWritten: funding / competing-interest disclosure
    via: ctgov collaborators; JATS <ack>; JATS competing interests; Europe PMC grantsList; Crossref funder
    kind: source-asserted, inconsistent across sources
    readiness: 2
    failureModes: An index-only agent reports no industry involvement.
noBridge:
  - NCT ↔ PMID from PubMed or the registry for NCT02921659 (only the paper's full text carries it).
  - CIK ↔ LEI (no authority carries both).
  - GTIN ↔ formulation version (GTIN persists across label changes; DSLD 295562 → 323170 share it).
  - CAERS / recall product strings ↔ GTIN or UNII.
  - Person name ↔ NPI/ORCID without a second key.
  - "Label amount ↔ mass basis: DSLD gives the NR form (UNII 8XM2XT8VWI) but not whether 300 mg is salt or moiety basis."
  - Registry version history (no public API; see action-space ctgov-record-history).
notRegistered:
  - code: NCIT
    reason: optional in D11 (observed on GSRS); R-42 adds only SPL_SET_ID, EIN, ORG_STUDY_ID and the seven D12 food schemes; request again with a question id
  - code: UCUM
    reason: a unit vocabulary (Assertion.unitCode), not an Identifier scheme (D11 schemes row UCUM)
unusedByNodeRegister:
  - CHEMSPIDER
  - EIN
  - FDA_FEI
  - NANOPUB
  - NIHMS
  - ORG_STUDY_ID
  - RW_RECORD
  - SPL_SET_ID
  - TICKER
  - UMLS_CUI
