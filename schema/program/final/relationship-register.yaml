    rationale: "\"Who is active on frontier F\" (Q-D13-03, value 1) and \"who financed after a readout\" (Q-D13-06) traverse Frontier ← Event → Organization with a role filter. D7 asked D13 to own the event-role edge and declares no inverse (D7 research notes §1, §3; R-67). Merges pinned INVOLVES, HOSTS_EVENT, SPEAKS_AT, ATTENDS, EXHIBITS_AT into one type with an EventRole enum; a presentation at a meeting is INVOLVES {PRESENTER} (R-81). Two typed fields instead of a 2-member union (same pairs, no union input family). Kernel M11(3): the only qualifier on the superset type is `role`, which Q-D13-03/06/14/33 filter; the printed title stays in Assertion.qualifiers. Roles REGULATOR, APPLICANT and ISSUER are written only while no D8 RegulatoryRecord documents the event (a hold, a submission, a designation known only from the sponsor); once DOCUMENTED_BY_RECORD exists the regulator, applicant and issuer are the record's ISSUED_BY / ADDRESSED_TO, and the executor enforces this (R-66). Funder and recipient of an award are D7 Award edges, not roles (R-69). Round participation is INVOLVES {INVESTOR | LEAD_INVESTOR}; D7 HOLDS_STAKE is written only when a source states the holding, never inferred from round participation (R-69). Authors and publisher of a retracted work are not roles: they are reached through the D3 Publication (AUTHORED_BY, R-44/R-80)."
