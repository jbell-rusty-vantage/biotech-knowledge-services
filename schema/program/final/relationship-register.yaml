moduleExtras:
  D2:
    stage: model (Wave 2), A3, 2026-10-08; revised after the adversarial review (2026-10-08); synthesis S module editor 2026-10-08
  D12:
    qualifierGrammar:
      rule: Every entry of Assertion.qualifiers is `key:VALUE` — no space after the colon, key lowerCamel, VALUE an enum value when the key names an enum (so `('key:' + $value) IN a.qualifiers` matches exactly), otherwise a token without spaces (numbers, ISO 8601 durations, uids). Free text a source prints goes under a key ending in `Verbatim` (`preparationVerbatim:frying (repeated)`), which no pattern filters on. One entry per value; repeat the key for several values (`preparationMethod:FRIED_DEEP`, `preparationMethod:FRIED_PAN`).
      keys:
        - key: preparationMethod
          value: D12 PreparationMethod value
          usedBy:
            - PREPARATION_CHANGES_CONTENT
            - FORMS_DURING_PREPARATION
          filteredBy:
            - Q-D12-02
            - Q-D12-03
        - key: preparationVerbatim
          value: source wording (free text)
          usedBy:
            - PREPARATION_CHANGES_CONTENT
            - FORMS_DURING_PREPARATION
        - key: temperatureC
          value: number
          usedBy:
            - PREPARATION_CHANGES_CONTENT
        - key: duration
          value: ISO 8601 duration
          usedBy:
            - PREPARATION_CHANGES_CONTENT
        - key: cycles
          value: integer, or `<=N` for 'up to N'
          usedBy:
            - PREPARATION_CHANGES_CONTENT
        - key: direction
          value: INCREASE | DECREASE | NO_CHANGE
          usedBy:
            - PREPARATION_CHANGES_CONTENT
        - key: changeLow
          value: percent (signed)
          usedBy:
            - PREPARATION_CHANGES_CONTENT
        - key: changeHigh
          value: percent (signed)
          usedBy:
            - PREPARATION_CHANGES_CONTENT
        - key: comparator
          value: "D1 QuantityComparator value: GT | GTE | LT | LTE | APPROX | BETWEEN (R-57; absent = EQ)"
          usedBy:
            - FOOD_CONTAINS
            - PREPARATION_CHANGES_CONTENT
        - key: range
          value: <low>-<high>
          usedBy:
            - FOOD_CONTAINS
        - key: portion
          value: portion label, spaces as '_' (medium_serving)
          usedBy:
            - FOOD_CONTAINS
            - HAS_PORTION_WEIGHT
        - key: derivation
          value: source derivation code, FDC:A | FDC:NC | ...
          usedBy:
            - FOOD_CONTAINS
        - key: dataPoints
          value: integer
          usedBy:
            - FOOD_CONTAINS
        - key: min
          value: number
          usedBy:
            - FOOD_CONTAINS
        - key: max
          value: number
          usedBy:
            - FOOD_CONTAINS
        - key: dataType
          value: FOUNDATION | SR_LEGACY | SURVEY | ANALYTICAL_DB
          usedBy:
            - FOOD_CONTAINS
        - key: role
          value: INCLUDES | EMPHASIZES | LIMITS | EXCLUDES (PATTERN_COMPONENT keeps it in valueString; the key is for predicate-only pattern statements)
          usedBy: []
        - key: frequency
          value: PER_DAY | PER_WEEK
          usedBy:
            - PATTERN_COMPONENT
        - key: population
          value: D5 PopulationGroup code or D3 StudyPopulation uid (D5 vocab-targets 0.2.x requiredQualifiers)
          usedBy:
            - WORSENS_TARGET
            - IMPROVES_TARGET
            - NO_EFFECT_ON_TARGET
            - MIXED_EFFECT_ON_TARGET
            - CAUSES_ADVERSE_EFFECT
          filteredBy:
            - Q-D12-08
            - Q-D12-26
            - Q-D12-28
          note: required qualifier of the D5 predicates (registrar D5, R-52)
        - key: populationVerbatim
          value: source wording of the population
          usedBy:
            - WORSENS_TARGET
            - CAUSES_ADVERSE_EFFECT
        - key: outcome
          value: D4 Metric | D4 Biomarker | D2 Outcome uid, or outcomeVerbatim:<text>
          usedBy:
            - WORSENS_TARGET
            - CAUSES_ADVERSE_EFFECT
        - key: species
          value: NCBI taxon uid or HUMAN | LABORATORY_ANIMALS
          usedBy:
            - CAUSES_ADVERSE_EFFECT
        - key: doseContext
          value: ABOVE_DIETARY_EXPOSURE | AT_DIETARY_EXPOSURE | NOT_STATED
          usedBy:
            - CAUSES_ADVERSE_EFFECT
        - key: issueDate
          value: ISO date (print issue of a notice)
          usedBy:
            - HAS_REVISION_STATUS
          note: HAS_REVISION_STATUS registrar K (R-52), only for a flag with no identified notice; an identified notice is D3 REVISES (R-44)
