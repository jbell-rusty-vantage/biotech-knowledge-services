# Merge rulings: machine-readable edits per module (chief synthesizer, 2026-10-08).
# Source of truth for the reasoning: schema/program/final/decision-report.md, section "Merge rulings" (R-01 to R-94).
# Each edit cites its ruling. Op vocabulary:
#   add-field, remove-type, remove-enum, add-enum-values, remove-enum-values, retype-field, remove-field, rename-field,
#   change-union, remove-union, change-edge-properties, change-edge-class, remove-edge-property-type,
#   add-relationship-field, change-labels, change-interface, register-predicate, rename-predicate,
#   remove-predicate, extend-predicate, add-seam, remove-seam, edit-seam, edit-docstring, edit-pattern,
#   edit-register, edit-question, edit-text, edit-fixture, close-oq, request-fixture, confirm (no change).
