    - { ruling: R-01, rule: "Budget pairs on the collapsed count: unions expanded per member, interface targets once, inverse fields not doubled, kernel-meaning types (ASSESSES, DERIVED_FROM, MENTIONS, RENDITION_OF) once in K. size-report and 00-SUMMARY print collapsed and expanded counts; the pinned 3,940 is re-counted the same way. Owner decides." }
    - { ruling: R-02, rule: "L1 @filterable(byAggregate:false) and L2 @mutation(operations:[]) stay on every type and relationship. L3 and excludeDeprecatedFields are not adopted unless the owner decides." }
    - { ruling: R-03, rule: "nestedOperations: intra-module structural [CREATE, CONNECT]; structural edges to another module's or a kernel record [CONNECT]; asserted [CONNECT]; derived []. Node-register 'mutations' is read as { graphql: none, executor: [...] }." }
    - { ruling: R-04, rule: "No @fulltext/@vector in any SDL; indexes live in deployment DDL listed in migration-notes and the handoff." }
    - { ruling: R-05, rule: "A union is owned by the module declaring the relationship; foreign members are seam rows; width <= 6." }
    - { ruling: R-06, rule: "A typed pair survives only with a fixture; an unfixtured pair whose deciding question is value 1 survives with a numbered request in final/requests.md; unfixtured value-2/3 pairs are cut (fall back to a predicate if a fixture needs the fact)." }
    - { ruling: R-08, rule: "A shared catalog id has one row carrying the lowest value any packet declares; non-owners cite <packet>:<id>. CQ-PF-03 splits into CQ-PF-03a (D8, v1, retrieved) and CQ-PF-03b (D6, v2, assessment)." }
    - { ruling: R-14, rule: "A node property read as a fact is written under a FIELD Assertion (registered field predicate, HAS_EVIDENCE, ASSERTED_BY issuer); the node value is a cache." }
    - { ruling: R-16, rule: "Asserter defaults: the issuer the document presents; else the Source publisher with asserterBasis:PUBLISHER_DEFAULT; the BellLabs Agent only for BellLabs statements; inferred speakers asserterBasis:INFERRED + RESOLUTION Assessment." }
    - { ruling: R-17, rule: "Stored label Entity only on Subjectable implementers and Identifier; lineage patterns traverse WAS_GENERATED_BY and never scan :Entity." }
    - { ruling: R-18, rule: "Versioned state/record implements Entity & Subjectable only if it carries a registry identifier or is a subject/object of an Assertion or target of an Assessment; else Entity only." }
    - { ruling: R-22, rule: "Edges project only from current POSITIVE Assertions; projectionGate: SUPPORT types also need a supporting Adjudication; one episode per (from,to,type,asserter)." }
    - { ruling: R-23, rule: "supersedesUid links records of the same asserter only." }
    - { ruling: R-26, rule: "Links between independently identified records are asserted; structural only for parts minted with their parent from the same capture and for citation sets." }
    - { ruling: R-42, rule: "One (scheme, issuer, normalized value) identifies at most one Subjectable; no cross-type joins through a shared Identifier." }
    - { ruling: R-45, rule: "A cache needs: authority reachable by edges, executor/projection-maintained, methodVersion + derivedAt, answers cite the authority, a question filters it; rewritten in the authority's transaction." }
    - { ruling: R-46, rule: "uid-valued properties only as frozen identity keys, operational pointers outside the evidence chain, or caches; never the only provenance path." }
    - { ruling: R-50, rule: "Answer kinds per packets/D10/answer-kind-table.md rulings; materialize only on p95 > 200 ms on the fixture graph or graph-global reuse by >= 2 questions." }
    - { ruling: R-52, rule: "One predicate registry (final/vocabularies/predicates.yaml), SCREAMING_SNAKE, no module prefix; registrar = K for kernel conventions, else the owner of the controlled family, else the owner of the subject type (existing registrar when subjects span modules); executor rejects unregistered predicates." }
    - { ruling: R-53, rule: "One meaning and one property schema per relationship type name; only kernel-meaning types (DERIVED_FROM, ASSESSES, MENTIONS, RENDITION_OF) are declared by several modules; no predicateOnly value equals a relationship type name (the authorizing predicate of a typed edge is not a predicateOnly entry)." }
    - { ruling: R-54, rule: "One assessment-vocabularies register; OTHER only with a registered subkind." }
    - { ruling: R-56, rule: "Each enum declared once; assembly runs an enum/type-name collision check." }
    - { ruling: R-94, rule: "Final seams.yaml separates relationship seams from predicateSeams (checked against the predicate registry)." }
