version: 1
module: D4
# Source: packets/D4/10-seams.yaml (sha256 01a278ca…), edited by the S module editor for D4, 2026-10-08, per
# final/decision-report.md and final/_work/rulings.yaml (modules.D4 + global). Every entry keeps the 01-PACKET-CONTRACT
# fields (type, from, to, questions, direction, owner), adds `module: D4`, and carries `status: accepted | cut` with the
# `ruling` that decides it (R-94 = seam hygiene: both sides named, final names, no other ruling changes the row).
# Synthesis edits:
#   R-26  PERFORMED_BY_LAB is asserted (AssertedRecordedProperties); D5 OPERATIONALIZED_BY is asserted, recorded time only,
#         basisKind CURATOR_CLASSIFICATION (R-25).
#   R-70  D5 TargetMeasure = Biomarker | Metric | Outcome | Condition; D3 OutcomeMeasureTarget = Metric | Biomarker | Outcome | Condition.
#   R-72  one Device path (Product -DELIVERS-> Device). Row ADMINISTERS D3.InterventionComponent -> D4.Device cut; the D8
#         CONCERNS / STATUS_OF -> D6.Product rows are resolved (D4 11 #12 closed, D8 OQ-D8-29 closed by D8's union change).
#   R-94  HAS_ITEM `from` is K.Report; StepMeans dropped (STEP_USES targets K.Subjectable, R-28); the RESOLUTION note reads
#         "surface-form SourceLocator" (Mention retired, R-09); relationship seams and `predicateSeams` are separate lists.
#   R-52  FIELD_NOT_REPORTED is read as a kernel convention (registrar K): predicateSeams row.
#   R-55  D4.test-and-sell reuses the D7.conflict-relevance conclusion codes.
#   R-60  vocabulary references point at final/vocabularies/ (pins: targets 0.2.2, frontiers 0.2.1).
# Stub types used for the compile check (scratch only): D1.ChemicalSubstance, D2.Mechanism, D2.MolecularEntity, D6.Product,
# D7.Organization, D3 enum SexScope.
seams:
  # ---- declared by D4 ----
  - { type: HAS_ANALYTE, module: D4, from: D4.Biomarker, to: D1.ChemicalSubstance, questions: [Q-D4-01, Q-D4-16], direction: OUT, owner: this, status: accepted, ruling: R-94, note: "D1 planned the same edge (D1 research notes); target name follows D1's SDL; structural only if the attach Assertion cites the defining span (R-26)" }
  - { type: HAS_ANALYTE, module: D4, from: D4.Biomarker, to: D2.MolecularEntity, questions: [Q-D4-01, Q-D4-16], direction: OUT, owner: this, status: accepted, ruling: R-94, note: "D2 traverses Biomarker -HAS_ANALYTE-> MolecularEntity -PARTICIPATES_IN-> Mechanism (Q-D2-03 analyte-participant branch); structural only if the attach Assertion cites the defining span (R-26)" }
  - { type: REFLECTS_MECHANISM, module: D4, from: D4.Biomarker, to: D2.Mechanism, questions: [Q-D4-01], direction: OUT, owner: this, status: accepted, ruling: R-94, note: "agreed with D2 (both research notes); asserted, AssertedRecordedProperties; D2 consumes it in Q-D2-03/04/22 (Q-D2-03 = Q-D4-01 joint pattern)" }
  - { type: DELIVERS, module: D4, from: D6.Product, to: D4.LabTest, questions: [Q-D4-01, Q-D4-10, Q-D4-13, Q-D4-18, Q-D4-24], direction: IN, owner: this, status: accepted, ruling: R-72, note: "declared on LabTest.products with direction IN; replaces pinned DELIVERS_LABTEST that D6 cut; D6 lists it as consumed (11 #8 resolved); also the route from D8 records to a test" }
  - { type: DELIVERS, module: D4, from: D6.Product, to: D4.Device, questions: [Q-D4-08, Q-D4-09, Q-D4-10, Q-D4-18, Q-D4-24], direction: IN, owner: this, status: accepted, ruling: R-72, note: "declared on Device.products with direction IN; replaces pinned EMBODIES_MODEL that D6 cut; the single route from D8 records (CONCERNS / STATUS_OF -> Product) to a device model (R-72)" }
  - { type: PERFORMED_BY_LAB, module: D4, from: D4.AssayVersion, to: D7.Organization, questions: [CQ-DX-01, CQ-DX-03, Q-D4-04], direction: OUT, owner: this, status: accepted, ruling: R-26, note: "asserted, AssertedRecordedProperties, [CONNECT]; a curator inference of the performing organization uses basisKind CURATOR_CLASSIFICATION (answers 11 #42); the role edge lives on the asking module's type (R-67)" }
  # ---- declared by other modules, consumed by D4 questions ----
  - { type: OPERATIONALIZED_BY, module: D4, from: D5.Target, to: D4.Biomarker, questions: [Q-D4-17], direction: OUT, owner: other, status: accepted, ruling: R-70, note: "D5 union TargetMeasure = Biomarker | Metric | Outcome | Condition (R-70); asserted, AssertedRecordedProperties, basisKind CURATOR_CLASSIFICATION (R-26, R-25); vocabulary final/vocabularies/ targets@0.2.2 (R-60)" }
  - { type: OPERATIONALIZED_BY, module: D4, from: D5.Target, to: D4.Metric, questions: [Q-D4-17], direction: OUT, owner: other, status: accepted, ruling: R-70, note: "D4 position (11 #11): a Target points at a Metric directly only when the operationalization needs metric precision (method or compartment, e.g. RMSSD not SDNN); otherwise at the Biomarker" }
  - { type: STEP_USES, module: D4, from: D5.ProtocolStep, to: D4.Metric, questions: [], direction: OUT, owner: other, status: accepted, ruling: R-28, note: "STEP_USES targets K.Subjectable (union StepMeans dropped, R-94); D4.Metric is on D5's admitted-types list, executor-enforced; D5's own questions, no D4 question traverses it (11 #34)" }
  - { type: MEASURES, module: D4, from: D3.OutcomeDefinition, to: D4.Biomarker, questions: [Q-D4-01, Q-D4-02, Q-D4-14], direction: OUT, owner: other, status: accepted, ruling: R-70, note: "D3 union OutcomeMeasureTarget = Metric | Biomarker | Outcome | Condition" }
  - { type: MEASURES, module: D4, from: D3.OutcomeDefinition, to: D4.Metric, questions: [Q-D4-01, Q-D4-02, Q-D4-14], direction: OUT, owner: other, status: accepted, ruling: R-70, note: "D3 accepted D4's request (11 #9); hop 3 of Q-D4-01 reads the study metric here" }
  - { type: ADMINISTERS, module: D4, from: D3.InterventionComponent, to: D4.Device, questions: [], direction: OUT, owner: other, status: cut, ruling: R-72, note: "D3 removed Device from AdministeredMaterial (now IngredientMaterial | ProductVariant | Intervention | FoodItem | DietaryPattern); a device used as a trial intervention is a ProductVariant or a D5 Intervention" }
  - { type: AFFECTS_MECHANISM, module: D4, from: D1.ChemicalSubstance, to: D2.Mechanism, questions: [Q-D4-01], direction: OUT, owner: other, status: accepted, ruling: R-47, note: "D2 derived projection (stays; D10 Association does not replace it), hop 1 of the compound → mechanism → biomarker → test pattern" }
  - { type: CONCERNS, module: D4, from: D8.RegulatoryRecord, to: D6.Product, questions: [Q-D4-09], direction: OUT, owner: other, status: accepted, ruling: R-72, note: "resolved (11 #12 closed): D8 RegulatoryRecordTopic = ChemicalSubstance | IngredientMaterial | Product | Lot; D4 reaches the device through Product -DELIVERS-> Device and disambiguates with the Device UDI-DI / 510(k) identifiers (fixture noninvasive-glucose-cgm-recall c04, c08, c09)" }
  - { type: STATUS_OF, module: D4, from: D8.LegalStatus, to: D6.Product, questions: [Q-D4-10, Q-D4-18], direction: OUT, owner: other, status: accepted, ruling: R-72, note: "resolved (11 #12 closed): D8 LegalStatusSubject = ChemicalSubstance | IngredientMaterial | Product | Patent; clearance of a device or test as of D through its Product (Q-D8-23 reads STATUS_OF Product -DELIVERS-> Device)" }
  - { type: ADDRESSED_TO, module: D4, from: D8.RegulatoryRecord, to: D7.Organization, questions: [Q-D4-10], direction: OUT, owner: other, status: accepted, ruling: R-67, note: "role edge on D8's type (R-67); CLIA / LDT standing reaches a test through its performing-lab Organization (AssayVersion -PERFORMED_BY_LAB->)" }
  - { type: ASSESSES, module: D4, from: K.Assessment, to: D4.AssayVersion, questions: [CQ-DX-03, CQ-AX-21, Q-D4-02, Q-D4-11], direction: OUT, owner: other, status: accepted, ruling: R-94, note: "kernel meaning (through K.Subjectable); assessmentKind COMPARABILITY, assessmentSubkind D4.comparability, verdict in conclusionCode" }
  - { type: ASSESSES, module: D4, from: K.Assessment, to: D4.AlgorithmVersion, questions: [CQ-DX-05, Q-D4-05, Q-D4-06, Q-D4-15], direction: OUT, owner: other, status: accepted, ruling: R-94, note: "subkinds D4.comparability, D4.algorithm-equivalence, D4.change-detectability" }
  - { type: ASSESSES, module: D4, from: K.Assessment, to: D4.ReferenceIntervalVersion, questions: [CQ-DX-06, Q-D4-12], direction: OUT, owner: other, status: accepted, ruling: R-94, note: "D4.comparability between interval versions" }
  - { type: ASSESSES, module: D4, from: K.Assessment, to: D4.Metric, questions: [Q-D4-02, Q-D4-07, Q-D4-08, Q-D4-22, Q-D4-26], direction: OUT, owner: other, status: accepted, ruling: R-94, note: "D4.comparability between Metrics (compartment/method), SAFETY_SIGNAL for unauthorized measurement claims, RESOLUTION for free-text measurement names" }
  - { type: ASSESSES, module: D4, from: K.Assessment, to: D4.Device, questions: [Q-D4-09], direction: OUT, owner: other, status: accepted, ruling: R-94, note: "SAFETY_SIGNAL D4.measurement-error-recall, effectDirection HARM (fixture noninvasive-glucose-cgm-recall s02)" }
  - { type: ASSESSES, module: D4, from: K.Assessment, to: K.Claim, questions: [Q-D4-08, Q-D4-15], direction: OUT, owner: other, status: accepted, ruling: R-94, note: "SAFETY_SIGNAL D4.unauthorized-measurement and EVIDENCE_SYNTHESIS D4.bio-age-claim-disconfirmation are about a kernel Claim (kernel-to-kernel; listed because D4 patterns start there)" }
  - { type: ASSESSES, module: D4, from: K.Assessment, to: D4.LabTest, questions: [Q-D4-05, Q-D4-13], direction: OUT, owner: other, status: accepted, ruling: R-94, note: "D4.change-detectability (clock-noise-vs-retest-advice s01) and D4.test-and-sell (nr-nad-compound-to-test s02) are about a LabTest" }
  - { type: ASSESSES, module: D4, from: D10.ReportItem, to: D4.LabTest, questions: [Q-D4-24], direction: OUT, owner: other, status: accepted, ruling: R-94, note: "kernel ASSESSES -> Subjectable declared on D10 ReportItem.about; D10 10-seams lists D4.LabTest (R-94 verified, 11 #38 closed on this point); ReportItem rows cite Assertions with DERIVED_FROM" }
  - { type: ASSESSES, module: D4, from: D10.ReportItem, to: D4.Device, questions: [Q-D4-24], direction: OUT, owner: other, status: accepted, ruling: R-94, note: "CGM comparisons; listed in D10 10-seams" }
  - { type: HAS_ITEM, module: D4, from: K.Report, to: D10.ReportItem, questions: [Q-D4-24], direction: "OUT (declared on D10.ReportItem.report with direction IN)", owner: other, status: accepted, ruling: R-94, note: "from is the kernel Report (R-94); structural part minted with its parent (R-26); listed because the Q-D4-24 pattern traverses it" }
  - { type: OCCURRENCE_OF, module: D4, from: K.Assertion, to: K.Claim, questions: [Q-D4-05, Q-D4-08, Q-D4-15], direction: OUT, owner: other, status: accepted, ruling: R-94, note: "claim occurrences about D4 types are kernel records; D4 only supplies subjects/objects. Fixtures: clock-noise b03, b06 and panel g28 are CLAIM-kind with occurrenceOf a kernel Claim" }
  - { type: MENTIONS, module: D4, from: D9.Chunk, to: D4.Metric, questions: [Q-D4-22], direction: OUT, owner: other, status: accepted, ruling: R-27, note: "kernel meaning, derived entity-link projection (Chunk.mentions -> Subjectable), licensed by its entity-link/vN derivationRule; a RESOLUTION Assessment only when a binding rests on the surface form" }
  - { type: DERIVED_FROM, module: D4, from: K.Assessment, to: K.Assertion, questions: [CQ-DX-05, Q-D4-05], direction: OUT, owner: other, status: accepted, ruling: R-11, note: "kernel meaning; assessments cite the REPORTS_RELIABILITY / RECOMMENDS_RETEST_INTERVAL assertions they weighed" }

predicateSeams:
  # Assertion.predicate values the D4 patterns and fixtures read that another module registers (R-94; registrar per R-52).
  - { predicate: FIELD_NOT_REPORTED, module: D4, registrar: K, subjects: ["any D4 type (the entity the field describes, R-16)"], object: "literal (MeasurementField value)", questions: [CQ-DX-01, Q-D4-04], owner: other, status: accepted, ruling: R-52, note: "kernel convention; D4 removed its registration; cites the notReported list (fixtures clock-noise-vs-retest-advice b07, hba1c-two-labs-interference d15/d16, nr-nad-compound-to-test e14, wearable-hrv-algorithm-changes f11)" }
  - { predicate: RATES_CLAIM, module: D4, registrar: K, subjects: [K.Claim], object: "literal (valueString rating); optional HAS_OBJECT = rating instrument record (R-31)", questions: [Q-D4-08], owner: other, status: accepted, ruling: R-52, note: "regulator verdict on a Claim (fixture noninvasive-glucose-cgm-recall c01-c03, asserter FDA)" }
  - { predicate: INTENDED_FOR_TARGET, module: D4, registrar: D5, subjects: [D4.Device, D6.Product], object: D5.Target, questions: [Q-D4-18], owner: other, status: accepted, ruling: R-52, note: "a LabTest is reached through the Product that DELIVERS it (11 #39)" }
  - { predicate: IMPROVES_TARGET, module: D4, registrar: D5, subjects: ["recommended means"], object: D5.Target, questions: [Q-D4-13], owner: other, status: accepted, ruling: R-52 }
  - { predicate: INCREASES_LEVEL_OF, module: D4, registrar: D2, subjects: ["means or D2.Mechanism | D2.MolecularEntity"], object: "D1 metabolite | D2.MolecularEntity | D2.Outcome | D4.Biomarker", questions: [Q-D4-13], owner: other, status: accepted, ruling: R-52 }

registeredValues:
  # Values D4 registers on kernel fields; S emits them into final/vocabularies/assessment-vocabularies.yaml (R-54).
  assessmentSubkinds:
    - { subkind: D4.comparability, assessmentKind: COMPARABILITY, about: "two AssayVersions | two AlgorithmVersions | two ReferenceIntervalVersions | two Metrics", conclusionCodes: [COMPARABLE, COMPARABLE_WITH_CONVERSION, NOT_COMPARABLE, UNKNOWN], questions: [CQ-DX-03, CQ-AX-21, Q-D4-02] }
    - { subkind: D4.algorithm-equivalence, assessmentKind: EQUIVALENCE, about: "vendor AlgorithmVersion + publication AlgorithmVersion", conclusionCodes: [SAME, DISTINCT, UNRESOLVED], questions: [Q-D4-06] }
    - { subkind: D4.change-detectability, assessmentKind: QUALITY, about: "AlgorithmVersion (+ the vendor advice Assertion as input)", conclusionCodes: [CHANGE_DETECTABLE, NOT_ESTABLISHED, NO_RELIABILITY_SOURCE], questions: [CQ-DX-05, Q-D4-05] }
    - { subkind: D4.bio-age-claim-disconfirmation, assessmentKind: EVIDENCE_SYNTHESIS, about: "Claim ('X reverses biological age')", conclusionCodes: "none (kernel Assessment.verdict, SemanticVerdict)", questions: [Q-D4-15] }
    - { subkind: D4.unauthorized-measurement, assessmentKind: SAFETY_SIGNAL, effectDirection: HARM, about: "Metric + Device (or Product, or the kernel Claim)", conclusionCodes: "none (kernel Assessment.verdict)", questions: [Q-D4-08, Q-D4-18] }
    - { subkind: D4.measurement-name-resolution, assessmentKind: RESOLUTION, about: "exactly two Metrics (one candidate pair: a vendor or free-text measure and a candidate Metric), or a surface-form SourceLocator and its Metric candidates", conclusionCodes: [RESOLVED, CANDIDATE, AMBIGUOUS, NO_MATCH], questions: [Q-D4-22, Q-D4-26], note: "R-94: the surface form is a SourceLocator (cited with role CONTEXT), not a Mention. CANDIDATE = one name-level candidate whose unit, method or code the source does not state; fixture consumer-panel-and-blood-clock s01-s08 (one assessment per pair); Q-D4-26 accepts RESOLVED or CANDIDATE and labels the match" }
    - { subkind: D4.measurement-error-recall, assessmentKind: SAFETY_SIGNAL, effectDirection: HARM, about: "Device + the Metric it outputs", conclusionCodes: "none", questions: [Q-D4-09, Q-D4-17], note: "fixture noninvasive-glucose-cgm-recall s02" }
    - { subkind: D4.interference-risk, assessmentKind: SAFETY_SIGNAL, effectDirection: HARM, about: "AssayVersion + Metric (+ condition as text until D2 Condition is joined)", conclusionCodes: "none", questions: [Q-D4-11], note: "fixture hba1c-two-labs-interference s02" }
    - { subkind: D4.test-and-sell, assessmentKind: CONFLICT_RELEVANCE, effectDirection: HARM, about: "Organization + LabTest + ReferenceIntervalVersion", conclusionCodes: [DIRECT, INDIRECT, NOT_RELEVANT, UNDETERMINED], conclusionCodesRegistrar: D7, questions: [Q-D4-12, Q-D4-13], ruling: R-55, note: "R-55: reuses the D7.conflict-relevance codes (registrar D7); D4 adds no codes. Fixture nr-nad-compound-to-test s02; D7 owns financial interest, this is the measurement-side conflict" }
  assertionPredicates: "see D4.relationship.yaml predicateOnly (15 values, registrar D4; FIELD_NOT_REPORTED removed under R-52 and read as a kernel convention). D4 patterns also read the predicateSeams above (K FIELD_NOT_REPORTED and RATES_CLAIM, D5 INTENDED_FOR_TARGET / IMPROVES_TARGET, D2 INCREASES_LEVEL_OF)"

sharedVocabularies:
  - { vocabulary: targets, file: "final/vocabularies/ (D5 targets @0.2.2, R-60)", owner: D5, use: "Biomarker and Metric are admissible OPERATIONALIZED_BY targets (Q-D4-17; Metric only when metric precision matters, 11 #11). A Device, LabTest or Product never points at a Target: what a device is for is an Assertion (INTENDED_FOR_TARGET etc.) with the Target as object; D5 registers its subjects as Device and Product (not LabTest), so Q-D4-18 reaches a LabTest through its DELIVERS Product. Vendor composite scores as measures (OQ-T3) answered in 11-open-questions.md." }
  - { vocabulary: frontiers, file: "final/vocabularies/ (D13 frontiers @0.2.1, R-60)", owner: D13, use: "none directly: D13 rules clocks are measures, not a frontier; a Study using a clock outcome attaches to frontier:aging-as-indication through D13 ON_FRONTIER" }
  - { vocabulary: identifier-schemes, file: "final/vocabularies/ (K identifier-schemes, R-42)", owner: K, use: "LOINC (Metric only, R-70); Biomarker carries none (analyte ids CHEBI / UNIPROT / HGNC / MESH live on the D1/D2 analyte); requested: LAB_TEST_CODE, CPT, UDI_DI, FDA_510K, FDA_PRODUCT_CODE" }
  - { vocabulary: population-descriptors, file: "final/schema/D3.graphql", owner: D3, use: "enum SexScope (ALL, FEMALE, MALE, NOT_REPORTED) for ReferenceIntervalVersion.sex, and the field names minAgeYears / maxAgeYears; declared once by D3 (R-56)" }
  - { vocabulary: compartment-ontology-ids, file: "(property convention, no file)", owner: "D4 with D2", use: "UBERON / CL CURIEs in Metric.systemOntologyId, AssayVersion.specimenOntologyIds and D2 context compartmentOntologyId; compared by equality (Q-D4-01, Q-D4-02, Q-D2-04)" }
  - { vocabulary: ucum-units, file: "(external: UCUM)", owner: D4, use: "Metric.canonicalUnitCode, AssayVersion.reportedUnitCode, ReferenceIntervalVersion.unitCode, kernel Assertion.unitCode" }
  - { vocabulary: assessment-vocabularies, file: "final/vocabularies/assessment-vocabularies.yaml (R-54)", owner: "K register; D4 entries above; D7.conflict-relevance codes (R-55)", use: "D4 subkinds and conclusion codes" }
  - { vocabulary: kernel-types, file: "final/schema/kernel.graphql", owner: K, use: "edge-property types AssertedRecordedProperties (REFLECTS_MECHANISM, DERIVED_FROM_ALGORITHM_VERSION, DELIVERS, PERFORMED_BY_LAB), AssertedEdgeProperties, StructuralEdgeProperties; enum PrivacyClass (Entity field); AssessmentKind (COMPARABILITY, EQUIVALENCE, QUALITY, SAFETY_SIGNAL, RESOLUTION, CONFLICT_RELEVANCE, EVIDENCE_SYNTHESIS), EffectDirection, SemanticVerdict, BasisKind (incl. CURATOR_CLASSIFICATION, R-25), SelectorKind used by D4 patterns through kernel records" }
