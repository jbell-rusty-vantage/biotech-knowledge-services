version: 1
module: D12
# Source: packets/D12/10-seams.yaml (sha256 285c0a45…), edited by the S module editor 2026-10-08 per
# final/decision-report.md and final/_work/rulings.yaml (global + modules.D12). Every entry keeps the 01-PACKET-CONTRACT
# fields (type, from, to, questions, direction, owner) and adds `module: D12` and `status` (accepted | cut, with the
# ruling id). Names are the final names (R-52, R-53, R-94). Synthesis edits:
#   R-94  relationship seams and predicate seams are separate lists (`seams`, `predicateSeams`); RESULT_FOR ->
#         QUALITY_RESULT_FOR; the StepMeans note is dropped (STEP_USES targets K.Subjectable; DietaryPattern and
#         FoodCategory are admissible targets, R-28, R-63); D10 drops ASSOCIATES -> D12.FoodItem (OQ-D12-29 closed).
#   R-72  D3 AdministeredMaterial = IngredientMaterial | ProductVariant | Intervention | FoodItem | DietaryPattern;
#         D8 RegulatoryRecordTopic = ChemicalSubstance | IngredientMaterial | Product | Lot.
#   R-73  QUALITY_RESULT_FOR -> D6.Product is cut (QualityResult.resultFor typed Lot); a lot-less survey row is the D1
#         predicate MEASURED_CONTENT_IN_PRODUCT. CONTESTED for D12: fixture acrylamide-fried-potato-harm acr-03 writes
#         QualityResult -> Product for value-1 Q-D12-03 / Q-D12-06 (see the row note; chief or owner decides).
#   R-63  DietaryPattern is the only eating-pattern node (OQ-D12-03 closed).
#   R-52, R-85  the D5 predicates are consumed (registrar D5); D12.FoodCategory admitted as subject of the target
#         predicates and INTERACTS_WITH, D12.FoodItem | D12.FoodCategory of CAUSES_ADVERSE_EFFECT (OQ-D12-28 closed).
#   R-93  HAS_ACTION_LEVEL / HAS_CLAIM_CONDITION (registrar D8) replace the Q-D12-06 / Q-D12-18 placeholders (OQ-D12-31 closed).
#   R-87  D6 DECLARES_COMPONENT lines are asserted, one Assertion per line, so a ranked row cites its line (OQ-D12-32 closed).
#   R-43, R-44  PREDIMED revision: Source -RENDITION_OF-> D3.Publication <-REVISES- notice (identified notice);
#         HAS_REVISION_STATUS (registrar K) only for flags with no identified notice.
#   R-53  FOOD_FROM_TAXON (D1 renames its seam row; OQ-D12-30 closed).
#   R-60  targets pinned @0.2.2; vocabulary files point at final/vocabularies/.
#   R-56, R-57, R-58  shared enums: D1 ContentStatementKind, D1 QuantityComparator (qualifier values), D6 AmountBasis.
seams:
  # ---- declared in D12 (owner: this) ----
  - { type: FOOD_CONTAINS, module: D12, from: D12.FoodItem, to: D1.ChemicalSubstance, questions: [Q-D12-01, Q-D12-02, Q-D12-20, Q-D12-21, Q-D12-24], direction: OUT, owner: this, status: "accepted (R-05 foreign union member; R-64)", via: "union FoodComponentTarget; edge properties D12 FoodContentProperties", note: "fixture olive-oil-polyphenols-preparation (olive-01, olive-02); cross-module read [:MATERIAL_CONTAINS|FOOD_CONTAINS] (R-64)" }
  - { type: FOOD_CONTAINS, module: D12, from: D12.FoodItem, to: D1.Constituent, questions: [Q-D12-01, Q-D12-21, Q-D12-24], direction: OUT, owner: this, status: "accepted (R-05; R-64)", via: "union FoodComponentTarget; edge properties D12 FoodContentProperties", note: "fixture mcdonalds-fries-prepared-food (mcd-02..04)" }
  - { type: HAS_REFERENCE_FOOD, module: D12, from: D6.Product, to: D12.FoodItem, questions: [Q-D12-04, Q-D12-05, Q-D12-30, Q-D12-34, Q-D12-03], direction: IN, owner: this, status: "accepted (R-62)", note: "stored Product -> FoodItem; field FoodItem.referencedByProducts (direction IN) so the D6 hub gets no field; the only Product-FoodItem link, never a merge; licensed by a RESOLUTION Assessment when a resolver chose it (R-62); fixture mcd-01" }
  - { type: IN_FOOD_CATEGORY, module: D12, from: D6.Product, to: D12.FoodCategory, questions: [Q-D12-14, Q-D12-31, Q-D12-08], direction: IN, owner: this, status: "accepted (R-51, R-62)", note: "stored Product -> FoodCategory; field FoodCategory.memberProducts (direction IN). A D8 Lot reaches a category through LOT_OF -> Product (no Lot pair). Computed NOVA = CALCULATED Assertion (nova-markers/vN) authorizing this edge (R-51); fixtures mcd-08, acr-02" }
  - { type: PATTERN_COMPONENT, module: D12, from: D12.DietaryPattern, to: D1.Constituent, questions: [Q-D12-11, Q-D12-08], direction: OUT, owner: this, status: "accepted (R-05)", via: "union PatternComponentTarget", note: "fixture predimed-retraction-disconfirmation (pred-03, LIMITS total fat)" }
  # ---- declared by other modules INTO D12 types, or read by D12 patterns (owner: other) ----
  - { type: ADMINISTERS, module: D12, from: D3.InterventionComponent, to: D12.DietaryPattern, questions: [Q-D12-12, Q-D12-13, Q-D12-25], direction: OUT, owner: other, status: "accepted (R-63, R-72)", note: "declared by D3 (union AdministeredMaterial = IngredientMaterial | ProductVariant | Intervention | FoodItem | DietaryPattern after R-72; AssertedRecordedProperties); path Study -HAS_ARM-> StudyArm -HAS_COMPONENT-> InterventionComponent -ADMINISTERS->; an eating pattern is administered as a DietaryPattern, never as a D5 Intervention (R-63)" }
  - { type: ADMINISTERS, module: D12, from: D3.InterventionComponent, to: D12.FoodItem, questions: [Q-D12-12, Q-D12-09], direction: OUT, owner: other, status: "accepted (R-72)", note: "declared by D3" }
  - { type: DECLARES_COMPONENT, module: D12, from: D6.LabelVersion, to: D12.FoodItem, questions: [Q-D12-07, Q-D12-05, Q-D12-18, Q-D12-30, Q-D12-31], direction: OUT, owner: other, status: "accepted (R-87)", note: "D6 union DeclaredComponentTarget = IngredientMaterial | Constituent | FoodItem; ComponentLineProperties carries amount, unitCode, amountBasis, lineRole (verbatim name/form/statement move to the Assertion, R-30); one asserted Assertion per declared line, so a ranked row cites its line (R-87, OQ-D12-32 closed). D12 reads a product's declared composition from this line (no CLAIMS_CONTENT / DECLARES_NUTRIENT predicate)" }
  - { type: STEP_USES, module: D12, from: D5.ProtocolStep, to: "K.Subjectable (D12.FoodItem, D12.DietaryPattern, D12.FoodCategory)", questions: [Q-D12-11], direction: OUT, owner: other, status: "accepted (R-28, R-63, R-94)", note: "declared by D5 against Subjectable (one of the two registered domain exceptions, R-28); D5 05 lists the admissible target types, including DietaryPattern and FoodCategory, and the executor enforces the list. The packet's StepMeans note is dropped (R-94)" }
  - { type: ASSESSES, module: D12, from: D10.ReportItem, to: D12.FoodItem, questions: [Q-D12-19], direction: OUT, owner: other, status: "accepted (kernel meaning; counted once in K, R-01)", note: "D10 ReportItem.about (kernel ASSESSES -> Subjectable) for a published comparison row (Report COMPARISON)" }
  - { type: MENTIONS, module: D12, from: D9.Chunk, to: "K.Subjectable (D12.FoodItem, D12.FoodCategory, D12.DietaryPattern)", questions: [Q-D12-26, Q-D12-34], direction: OUT, owner: other, status: "accepted (R-27)", note: "kernel meaning, derived, declared once by D9 against Subjectable; licensed by its entity-link/vN derivationRule; a RESOLUTION Assessment only when a binding rests on the surface form (R-27); never evidence" }
  - { type: ASSESSES, module: D12, from: K.Assessment, to: "K.Subjectable (D12.FoodItem, D12.FoodCategory, D12.DietaryPattern)", questions: [Q-D12-08, Q-D12-09, Q-D12-13, Q-D12-18, Q-D12-23, Q-D12-26, Q-D12-29, Q-D12-33, Q-D12-34], direction: OUT, owner: other, status: "accepted (kernel)", note: "EVIDENCE_SYNTHESIS / SAFETY_SIGNAL / VETTING / EQUIVALENCE / RESOLUTION with effectDirection; D12 subkinds (D12.claim-threshold-comparison, D12.food-equivalence) go to final/vocabularies/assessment-vocabularies.yaml (R-54)" }
  - { type: ASSESSES, module: D12, from: K.Report, to: "K.Subjectable (D12.FoodItem, D12.DietaryPattern)", questions: [Q-D12-19, Q-D12-09], direction: OUT, owner: other, status: "accepted (kernel)", note: "kernel Report (COMPARISON for published rankings; EVIDENCE_REPORT for evidence missions on food claims)" }
  - { type: OCCURRENCE_OF, module: D12, from: K.Assertion, to: K.Claim, questions: [Q-D12-09, Q-D12-10, Q-D12-22, Q-D12-29, Q-D12-33], direction: OUT, owner: other, status: "accepted (kernel)", note: "food claims and recommendations are kernel claim occurrences (speechAct RECOMMENDS) whose subject is a D12 node or a D6 Product; OCCURS_IN the MediaWork when the evidence is in one (R-19)" }
  - { type: HAS_IDENTIFIER, module: D12, from: K.Identifier, to: "K.Subjectable (D12.FoodItem, D12.FoodCategory, D12.DietaryPattern)", questions: [Q-D12-34, Q-D12-05], direction: IN, owner: other, status: "accepted (R-42)", note: "kernel IdentifierLinkProperties; schemes in D12.node.yaml (the seven D12 food schemes added by K, R-42); one (scheme, issuer, normalized value) identifies at most one Subjectable" }
  - { type: RENDITION_OF, module: D12, from: K.Source, to: D3.Publication, questions: [Q-D12-09, Q-D12-10], direction: OUT, owner: other, status: "accepted (R-43, R-44)", note: "added in synthesis: kernel meaning, asserted recorded-only, registered by D3; the PREDIMED PubMed/NEJM Sources reach the work through it" }
  - { type: REVISES, module: D12, from: D3.Publication, to: D3.Publication, questions: [Q-D12-09, Q-D12-10], direction: OUT, owner: other, status: "accepted (R-44)", note: "added in synthesis: the PREDIMED retraction-and-republication notice is identified, so the fixture moves from HAS_REVISION_STATUS to D3 REVISES (revisionKind typed by K SourceRevisionKind), asserted per asserter; never both for one (asserter, notice)" }
  - { type: QUALITY_RESULT_FOR, module: D12, from: D8.QualityResult, to: D8.Lot, questions: [Q-D12-03, Q-D12-06], direction: OUT, owner: other, status: "accepted (R-53 rename from RESULT_FOR; R-73)", note: "a lot-identified contaminant measurement in a sold food is a D8 QualityResult on the Lot (MEASURES_ANALYTE to the D1 substance); D12 reaches it through Lot -LOT_OF-> Product <-HAS_REFERENCE_FOOD- FoodItem" }
  - { type: QUALITY_RESULT_FOR, module: D12, from: D8.QualityResult, to: D6.Product, questions: [Q-D12-03, Q-D12-06], direction: OUT, owner: other, status: "cut (R-73) — contested", note: "R-73 removes the Product member (QualityResult.resultFor typed Lot) on the premise that no fixture writes it, citing D8 fixtures only. D12 fixture acrylamide-fried-potato-harm acr-03 writes QualityResult -> Product (FDA survey, 428 ug/kg, 'one individual purchased product; no lot') for Q-D12-03 and Q-D12-06, both value 1. Under R-73's fallback this row becomes the D1 predicate MEASURED_CONTENT_IN_PRODUCT (predicateSeams below) and acr-03 is re-keyed; R-73's 'until a survey fixture promotes the Product member' and R-06 (value-1 fixtured pair survives) argue for keeping it. Chief or owner decides" }
  - { type: CONCERNS, module: D12, from: D8.RegulatoryRecord, to: "D6.Product | D8.Lot", questions: [Q-D12-07, Q-D12-28, Q-D12-32], direction: OUT, owner: other, status: "accepted (R-72)", note: "recalls, warning letters, import alerts (recordFamily ENFORCEMENT, recordKind RECALL); RegulatoryRecordTopic = ChemicalSubstance | IngredientMaterial | Product | Lot after R-72; a Lot reaches its Product through D8 LOT_OF" }
  - { type: ASSOCIATES, module: D12, from: D10.Association, to: D12.FoodItem, questions: [Q-D12-20], direction: OUT, owner: other, status: "cut (R-94)", note: "listed by D10 and never accepted by D12; D10 drops the row and the Q-D12-20 citation (OQ-D12-29 closed); Q-D12-20 similarity is streamed from FOOD_CONTAINS quantities, never stored" }
predicateSeams:
  # Assertion.predicate values (no typed edge; Assertion subject/object only), checked against final/vocabularies/predicates.yaml (R-52, R-94)
  - { predicate: "INTENDED_FOR_TARGET | IMPROVES_TARGET | WORSENS_TARGET | NO_EFFECT_ON_TARGET | MIXED_EFFECT_ON_TARGET", module: D12, registrar: D5, subjects: [D12.FoodItem, D12.FoodCategory, D12.DietaryPattern, D6.Product], objects: [D5.Target], questions: [Q-D12-08, Q-D12-09, Q-D12-13, Q-D12-23, Q-D12-26], owner: other, status: "accepted (R-52, R-85)", note: "D5 sole registrar; required qualifier population:<code|uid> (population:UNSPECIFIED explicit); R-85 admits D12.FoodCategory as subject (IARC 'processed meat', NOVA 4), closing OQ-D12-28; never a typed edge from a means to a Target" }
  - { predicate: INTERACTS_WITH, module: D12, registrar: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial, D6.Product, D5.Intervention, D12.FoodCategory], objects: [D12.FoodItem], questions: [Q-D12-16], owner: other, status: "accepted (R-52, R-85)", note: "FoodItem is an object (grapefruit juice with CYP3A4 substrates); R-85 adds D12.FoodCategory as a subject; D5 UseConstraint rolls the Assertions up via derived RESOLVES_TO_CONSTRAINT" }
  - { predicate: USE_CONSTRAINED_IN, module: D12, registrar: D5, subjects: [D12.FoodItem], objects: [D2.Condition], questions: [Q-D12-16], owner: other, status: "accepted (R-52)", note: "FoodItem is the SUBJECT" }
  - { predicate: CAUSES_ADVERSE_EFFECT, module: D12, registrar: D5, subjects: [D1.ChemicalSubstance, D12.FoodItem, D12.FoodCategory], objects: [D2.Condition], questions: [Q-D12-03, Q-D12-06], owner: other, status: "accepted (R-52, R-84, R-85)", aliases: [REPORTS_ADVERSE_EXPERIENCE], note: "D5 sole registrar (D12 drops its registration); R-85 adds D12.FoodItem and D12.FoodCategory as subjects, sourceKind REFERENCE_MONOGRAPH | SPONTANEOUS_REPORT; acrylamide fixture acr-05 (FDA hazard statement, species:LABORATORY_ANIMALS, doseContext:ABOVE_DIETARY_EXPOSURE)" }
  - { predicate: HAS_ACTION_LEVEL, module: D12, registrar: D8, subjects: [D1.ChemicalSubstance], objects: [D12.FoodCategory, D12.FoodItem], questions: [Q-D12-06], owner: other, status: "accepted (R-93)", note: "valueNumber + unitCode; qualifiers status=PROPOSED|ADOPTED, jurisdiction, basis; asserted by the regulator; replaces the Q-D12-06 placeholder (OQ-D12-31 closed)" }
  - { predicate: HAS_CLAIM_CONDITION, module: D12, registrar: D8, subjects: [D8.RegulatoryRecord, K.Claim], objects: ["literal (valueString condition)"], questions: [Q-D12-18], owner: other, status: "accepted (R-93)", note: "subject the authorizing RegulatoryRecord; a condition on a product class takes the Claim as subject with qualifier productClass=; replaces the Q-D12-18 placeholder (OQ-D12-31 closed)" }
  - { predicate: MEASURED_CONTENT_IN_PRODUCT, module: D12, registrar: D1, subjects: [D6.Product, D6.ProductVariant], objects: [D1.ChemicalSubstance], questions: [Q-D12-03, Q-D12-06], owner: other, status: "accepted (R-73)", note: "a survey row that names no lot (FDA acrylamide 2004, 428 ug/kg); the fallback for the cut QUALITY_RESULT_FOR -> Product row above (contested)" }
  - { predicate: HAS_REVISION_STATUS, module: D12, registrar: K, subjects: [K.Source], objects: ["literal (valueString SourceRevisionKind)"], questions: [Q-D12-09, Q-D12-10], owner: other, status: "accepted (R-44, R-52)", note: "kernel convention, one Assertion per authority, only for non-scholarly Sources and flags with no identified notice (e.g. the PubMed flag); the identified NEJM notice is D3 REVISES (seams above); never both for one (asserter, notice)" }
  - { predicate: FORMS_DURING_PREPARATION, module: D12, registrar: D12, subjects: [D1.ChemicalSubstance], objects: [D12.FoodItem, D12.FoodCategory], questions: [Q-D12-03], owner: this, status: "accepted (R-52)", note: "predicate-only" }
  - { predicate: PREPARATION_CHANGES_CONTENT, module: D12, registrar: D12, subjects: [D12.FoodItem], objects: [D1.ChemicalSubstance, D1.Constituent], questions: [Q-D12-02], owner: this, status: "accepted (R-52)", note: "predicate-only" }
  - { predicate: FOOD_FROM_TAXON, module: D12, registrar: D12, subjects: [D12.FoodItem], objects: [D1.Taxon], questions: [Q-D12-34], owner: this, status: "accepted (R-53)", aliases: [DERIVED_FROM_TAXON], note: "predicate-only; D1 renames its seam row (R-53, R-94; OQ-D12-30 closed)" }
  - { predicate: HAS_RECIPE_INGREDIENT, module: D12, registrar: D12, subjects: [D12.FoodItem, D6.Product], objects: [D12.FoodItem], questions: [Q-D12-05], owner: this, status: "accepted (R-62)", aliases: [PREPARED_WITH], note: "the one recipe-ingredient predicate; D6 removes PREPARED_WITH and uses this with subject Product" }
  - { predicate: "USED_FOOD_CLASSIFICATION | USED_COMPOSITION_DATABASE", module: D12, registrar: D12, subjects: [D3.Study], objects: ["literal (valueString)", D12.FoodCategory], questions: [Q-D12-25], owner: this, status: "accepted (registrar D12 kept: no ruling moves them; R-52 rule 3 (subject owner) would name D3; OQ-D12-27 open)", note: "registered by D12 until D3 takes them (OQ-D12-27)" }
sharedVocabularies:
  - { name: targets, owner: D5, file: final/vocabularies/targets.yaml, version: "0.2.2", use: "objects of target-effect Assertions about foods, categories and patterns; population qualifier grammar population:<PopulationGroup code | D3 StudyPopulation uid>; keys used: target:cardiometabolic-health, target:body-composition, target:longevity, target:glycemic-control, target:gut-health, target:sleep, target:mood (re-pinned from 0.2.1, R-60)" }
  - { name: frontiers, owner: D13, file: final/vocabularies/frontiers.yaml, version: "0.2.1", use: "not consumed (no D12 question attaches a food to a frontier; only Event and Study attach, R-91)" }
  - { name: identifier-schemes, owner: K, file: final/vocabularies/identifier-schemes.yaml, use: "FDC_ID, GTIN (via D6 Product), WIKIDATA, PMID, DOI; NDB_NUMBER, FNDDS_FOOD_CODE, FOODON, PHENOL_EXPLORER_FOOD, WWEIA_CATEGORY, FOODEX2, LANGUAL added by K (R-42)" }
  - { name: kernel-types, owner: K, file: final/schema/kernel.graphql, use: "edge-property types AssertedEdgeProperties (IN_FOOD_CATEGORY, HAS_REFERENCE_FOOD) and AssertedRecordedProperties (PATTERN_COMPONENT; base of FoodContentProperties, kernel M11); enums PrivacyClass, EffectDirection, AssessmentKind, BasisKind (CALCULATED for computed NOVA, R-51), SourceRevisionKind (R-44); read-side Assessment, Report, Claim, IdentifierLinkProperties" }
  - { name: predicates, owner: S, file: final/vocabularies/predicates.yaml, use: "one predicate registry (R-52); D12 is registrar of the 11 entries in D12.relationship.yaml predicateOnly" }
  - { name: assessment-vocabularies, owner: S, file: final/vocabularies/assessment-vocabularies.yaml, use: "D12 subkinds D12.claim-threshold-comparison and D12.food-equivalence (R-54)" }
  - { name: ContentStatementKind, owner: D1, ref: final/schema/D1.graphql, use: "FoodContentProperties.statementKind (MEASURED_IN_SAMPLE, CALCULATED, TYPICAL_COMPOSITION_REPORTED, QUALITATIVE_PROVIDES); declared once by D1 (R-56)" }
  - { name: QuantityComparator, owner: D1, ref: final/schema/D1.graphql, use: "values of the Assertion qualifier comparator: (GT, GTE, LT, LTE, APPROX, BETWEEN; absent = EQ) on FOOD_CONTAINS and PREPARATION_CHANGES_CONTENT Assertions (R-57)" }
  - { name: AmountBasis, owner: D6, ref: final/schema/D6.graphql, use: "FoodContentProperties.amountBasis (D12 writes PER_100G, PER_100ML, PER_SERVING) so reference composition and label declarations share one basis vocabulary; declared once by D6 (R-56, R-58)" }
