  - { pinned: SourceSnapshot, into: "K.SourceSnapshot" }
  - { pinned: SourceLocator, into: "K.SourceLocator" }
  - { pinned: SourceRevisionEvent, into: "K.SourceSnapshot.revisionKind + revisesSnapshotUid (capture cache); identified notice = D3 REVISES; status flag per authority without a notice = HAS_REVISION_STATUS Assertion (R-44)" }
