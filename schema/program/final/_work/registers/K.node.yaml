  - { pinned: Adjudication, into: "K.Adjudication (15-value verdict lattice, five orthogonal properties)" }
  - { pinned: ResolutionHypothesis, into: "K.Assessment (assessmentKind RESOLUTION; HAS_EVIDENCE role CONTEXT to the surface-form SourceLocator; ASSESSES the candidate)" }
