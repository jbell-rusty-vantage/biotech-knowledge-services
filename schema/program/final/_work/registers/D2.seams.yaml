version: 1
module: D2
# Source: packets/D2/10-seams.yaml (sha256 ebd97e2d…), edited by the S module editor 2026-10-08 per
# final/decision-report.md and final/_work/rulings.yaml (modules.D2 + global). Every entry keeps the 01-PACKET-CONTRACT
# fields (type, from, to, questions, direction, owner) and adds `module: D2`, `status` (accepted | cut) and `ruling`.
# Rows no ruling changes cite R-94 (seam hygiene: checked on both sides) or R-06 (fixtured pair) as their acceptance.
# Synthesis edits:
#   R-47  AFFECTS_MECHANISM rows: unscored facet shortcut, score null; Q-D2-18 moves to the ASSOCIATES row.
#   R-70  OPERATIONALIZED_BY D5.Target -> D2.Outcome (union text) and new row D5.Target -> D2.Condition (direction IN).
#   R-29  OBSERVED_IN_CONTEXT: declared IN on the domain type, structural, same intent as the Assertion.
#   R-86  EXPOSED_TO rows confirmed; R-06 exception: EXPOSED_TO -> D1.IngredientMaterial has no fixture and survives on
#         value-1 CQ-MX-04 with a fixture request (final/requests.md, to be numbered by the requests owner).
#   R-07  INVESTIGATES carries Q-D2-06 on D3's side.
#   R-27  MENTIONS / COVERS_LOCATOR notes. R-28 ASSOCIATES is a registered domain exception targeting Subjectable.
#   R-94  relationship seams and predicateSeams are separate lists; predicate names checked against the R-52 registrars.
#   R-55  conflict relevance is the single D7.conflict-relevance entry (D2.conflict-relevance retired).
#   R-84, R-85, R-88  predicateSeams: USE_CONSTRAINED_IN and CAUSES_ADVERSE_EFFECT split; HAS_APPROVED_INDICATION added.
#   R-60  vocabulary pins targets 0.2.2, frontiers 0.2.1; R-58 / R-59 / R-56 shared enums re-homed (AmountBasis D6,
#         EstimateDirection D3, ModelOrganism D2).
# Original note (A3): every reference from D2's SDL to a type outside the module (beyond packet-check's kernel allowlist)
# and every edge another module declares into a D2 type. owner: this = declared in final/schema/D2.graphql; other =
# declared by the named module (D2 consumes it). Foreign types re-checked against final/schema/{kernel,D3,D4,D5,D9,D10}
# .graphql on 2026-10-08 (S module editor).
seams:
  # ---- declared by D2 (owner: this) ----
  - { type: PARTICIPATES_IN, module: D2, from: D1.ChemicalSubstance, to: D2.Mechanism, questions: [Q-D2-11, Q-D2-03], direction: "IN (field Mechanism.metaboliteParticipants; stored D1 → D2)", owner: this, status: accepted, ruling: R-06, note: "asserted (MechanismReferenceProperties ⊇ AssertedRecordedProperties); endogenous metabolites (NAD+, NAAD, NMN) are D1 ChemicalSubstances; D1's hub gets no field; fixture reactome-chembl-reference" }
  - { type: AFFECTS_MECHANISM, module: D2, from: D1.ChemicalSubstance, to: D2.Mechanism, questions: [CQ-MX-05, Q-D2-02, Q-D2-03, Q-D2-06, Q-D2-26], direction: "IN (field Mechanism.affectedBy, union MechanismModulator)", owner: this, status: accepted, ruling: R-47, note: "derived, read-only; projection d2.affects-mechanism/v1; unscored facet shortcut (score null, executor-validated; nNoChangeContexts removed; direction D3 EstimateDirection, R-59); Q-D2-18 ranking reads D10 Association records instead" }
  - { type: AFFECTS_MECHANISM, module: D2, from: D5.Intervention, to: D2.Mechanism, questions: [Q-D2-02, Q-D2-10], direction: "IN (field Mechanism.affectedBy, union MechanismModulator)", owner: this, status: accepted, ruling: R-47, note: "non-substance means (exercise, fasting, D+Q combination); D5 lists the reverse seam (owner: other); fixtures dq-senescence-biomarker-path, metformin-exercise-harm" }
  - { type: EXPOSED_TO, module: D2, from: D2.MechanismEvidenceContext, to: D1.ChemicalSubstance, questions: [CQ-MX-02, Q-D2-04, Q-D2-09], direction: OUT, owner: this, status: accepted, ruling: R-86, note: "structural (R-26); substance-level mechanistic exposure; written alongside IN_STUDY_ARM where single-substance reach is needed" }
  - { type: EXPOSED_TO, module: D2, from: D2.MechanismEvidenceContext, to: D1.IngredientMaterial, questions: [CQ-MX-04], direction: OUT, owner: this, status: accepted, ruling: "R-86, R-06", note: "no D2 fixture writes this pair; kept under the R-06 value-1 exception (CQ-MX-04 v1) with a fixture request in final/requests.md (RQ-06)" }
  - { type: EXPOSED_TO, module: D2, from: D2.MechanismEvidenceContext, to: D5.Intervention, questions: [Q-D2-09], direction: OUT, owner: this, status: accepted, ruling: R-86, note: "BACKGROUND co-exposure such as aerobic exercise training (FC-3); fixture metformin-exercise-harm" }
  - { type: IN_STUDY_ARM, module: D2, from: D2.MechanismEvidenceContext, to: D3.StudyArm, questions: [CQ-MX-02, Q-D2-06, Q-D2-27, Q-D2-04], direction: OUT, owner: this, status: accepted, ruling: R-06, note: "a registered group's dose of record is read through it: StudyArm -HAS_COMPONENT-> InterventionComponent -ADMINISTERS-> material (D3); fixtures dq-senescence-biomarker-path, metformin-exercise-harm, nr-muscle-unstructured" }
  - { type: OBSERVED_IN_CONTEXT, module: D2, from: K.Assertion, to: D2.MechanismEvidenceContext, questions: [CQ-MX-01, CQ-MX-02, CQ-MX-03], direction: "IN (field MechanismEvidenceContext.assertions)", owner: this, status: accepted, ruling: R-29, note: "structural; allowed because declared IN on the domain type; written in the same intent as the Assertion and corrected only by superseding it; K verification.v1 entityBinding role `context`; D2 mechanism Assertions only (not D5 adverse-effect Assertions); K lists the mirror row (owner: other)" }
  # ---- declared by other modules into D2 types (owner: other) ----
  - { type: REFLECTS_MECHANISM, module: D2, from: D4.Biomarker, to: D2.Mechanism, questions: [Q-D2-03, Q-D2-04, Q-D2-22], direction: "OUT from Biomarker (declared by D4)", owner: other, status: accepted, ruling: R-94, note: "asserted, recorded only in the D4 SDL (AssertedRecordedProperties, one Assertion per marker paper); the D2 → D4 hop of the compound → mechanism → biomarker → test path" }
  - { type: HAS_ANALYTE, module: D2, from: D4.Biomarker, to: D2.MolecularEntity, questions: [Q-D2-03, Q-D2-04, Q-D2-22], direction: "OUT from Biomarker (declared by D4)", owner: other, status: accepted, ruling: R-94, note: "structural in the D4 SDL (field Biomarker.analyteEntities); protein biomarkers (IL-6); metabolite biomarkers use Biomarker.analytes → D1.ChemicalSubstance; replaces pinned ENCODES" }
  # INDICATES (D4.Biomarker → D2.Condition) is NOT a seam: D4 deferred it to the Assertion predicate indicates_condition
  # (D4 05-register deferred list, checked 2026-10-08). Q-D2-14 reads biomarker → condition links as Assertions (kernel HAS_OBJECT).
  - { type: MEASURES, module: D2, from: D3.OutcomeDefinition, to: D2.Outcome, questions: [Q-D2-07, Q-D2-26], direction: "OUT (declared by D3, union OutcomeMeasureTarget = Metric | Biomarker | Outcome | Condition)", owner: other, status: accepted, ruling: R-70, note: "OutcomeDefinition is what a study declares; Outcome is the concept it measures" }
  - { type: MEASURES, module: D2, from: D3.OutcomeDefinition, to: D2.Condition, questions: [Q-D2-07, Q-D2-15], direction: "OUT (declared by D3, same union)", owner: other, status: accepted, ruling: "R-70, R-84", note: "incident disease and adverse-event endpoints" }
  - { type: INVESTIGATES, module: D2, from: D3.Study, to: D2.Condition, questions: [Q-D2-06], direction: "OUT (declared by D3)", owner: other, status: accepted, ruling: R-07, note: "D3 adds Q-D2-06 to INVESTIGATES.questions" }
  - { type: OPERATIONALIZED_BY, module: D2, from: D5.Target, to: D2.Outcome, questions: [Q-D2-26], direction: "IN (declared by D5 OUT on Target, union TargetMeasure = Biomarker | Metric | Outcome | Condition)", owner: other, status: accepted, ruling: R-70, note: "asserted, recorded only (AssertedRecordedProperties, R-26), basis CURATOR_CLASSIFICATION for curator operationalizations (R-25); closes D2 11 item 27" }
  - { type: OPERATIONALIZED_BY, module: D2, from: D5.Target, to: D2.Condition, questions: [Q-D3-04, Q-D3-05, Q-D5-20], direction: "IN (declared by D5 OUT on Target, union TargetMeasure)", owner: other, status: accepted, ruling: R-70, note: "added in synthesis: incidence of this condition measures the target (direction lives in D5's vocab-targets rule); unfixtured value-1 pair kept with a fixture request (R-06: ASPREE hemorrhage or dementia → a target); no shared-Identifier join (R-42)" }
  - { type: ASSOCIATES, module: D2, from: D10.Association, to: "D2.Mechanism | D2.Outcome | D2.Condition (via Subjectable)", questions: [Q-D2-14, Q-D2-18], direction: "OUT from Association (declared by D10, kernel Subjectable target)", owner: other, status: accepted, ruling: "R-47, R-28", note: "derived (DerivedEdgeProperties, no score on the edge, R-48); one of the two registered domain exceptions targeting Subjectable (R-28); EVIDENCE_AGGREGATE records (one per modulator × mechanism) carry the Q-D2-18 ranking; D10 withdraws its claim to replace AFFECTS_MECHANISM (R-47); replaces D2's INFLUENCES_OUTCOME (demoted)" }
  - { type: HAS_SUBJECT, module: D2, from: K.Assertion, to: "D2.Mechanism | D2.MolecularEntity | D2.Condition | D2.Outcome (via Subjectable)", questions: [Q-D2-14, Q-D2-20], direction: "declared by K", owner: other, status: accepted, ruling: R-94 }
  - { type: HAS_OBJECT, module: D2, from: K.Assertion, to: "D2.Mechanism | D2.MolecularEntity | D2.Condition | D2.Outcome (via Subjectable)", questions: [CQ-MX-01, Q-D2-01, Q-D2-05], direction: "declared by K", owner: other, status: accepted, ruling: R-94 }
  - { type: ASSESSES, module: D2, from: K.Assessment, to: "D2 Subjectable types (e.g. EVIDENCE_SYNTHESIS about a mechanism claim)", questions: [Q-D2-16, CQ-MX-04], direction: "declared by K", owner: other, status: accepted, ruling: "R-53, R-54, R-55", note: "kernel-meaning type (counted once in K, R-01); D2 subkind D2.marketing-mechanism-support (EVIDENCE_SYNTHESIS) is registered in final/vocabularies/assessment-vocabularies.yaml (R-54); conflict relevance uses the single entry D7.conflict-relevance (registrar D7, R-55), not a D2 subkind" }
  - { type: OCCURRENCE_OF, module: D2, from: K.Assertion, to: K.Claim, questions: [Q-D2-28, Q-D2-16], direction: "declared by K", owner: other, status: accepted, ruling: R-94, note: "mechanism claims in marketing/podcasts are claim occurrences whose object is a D2 type" }
  - { type: MENTIONS, module: D2, from: D9.Chunk, to: "D2 Subjectable types", questions: [Q-D2-24, Q-D2-23], direction: "declared by D9 (derived)", owner: other, status: accepted, ruling: R-27, note: "kernel meaning; method-versioned entity-link/vN projection, never evidence" }
  - { type: COVERS_LOCATOR, module: D2, from: D9.Chunk, to: K.SourceLocator, questions: [Q-D2-24], direction: "declared by D9 (derived span-overlap/v1)", owner: other, status: accepted, ruling: R-27, note: "D2's chunk → assertion hop (00-DIRECTIVE 3.8); never support: answers cite HAS_EVIDENCE; D2 no longer recomputes offset overlap" }

# Assertion-level seams: predicates whose subject or object crosses a module boundary (kernel HAS_SUBJECT / HAS_OBJECT
# against Subjectable, so no typed edge and no union). Not relationship types; checked against the R-52 registry
# (final/vocabularies/predicates.yaml) per R-94; listed so owners keep the types Subjectable.
predicateSeams:
  - { predicate: USE_CONSTRAINED_IN, module: D2, registeredBy: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial, D6.Product, D5.Intervention, D12.FoodItem], object: D2.Condition, questions: [Q-D2-15], status: accepted, ruling: "R-52, R-84", note: "contraindication scope is a Condition (conditionKind PHENOTYPE/DISEASE); population scope is D5's qualifier, never a D2 context" }
  - { predicate: CAUSES_ADVERSE_EFFECT, module: D2, registeredBy: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial, D6.Product, D5.Intervention, D12.FoodItem, D12.FoodCategory], object: D2.Condition, questions: [Q-D2-15], status: accepted, ruling: "R-84, R-85", note: "one adverse-effect predicate, object D2 Condition; no AdverseEffect node (closes OQ-D5-03); REPORTS_ADVERSE_EXPERIENCE retired" }
  - { predicate: EVENT_ABOUT, module: D2, registeredBy: D13, subjects: [D13.Event], object: D2.Condition, questions: [Q-D2-27], status: accepted, ruling: R-84 }
  - { predicate: HAS_APPROVED_INDICATION, module: D2, registeredBy: D8, subjects: [D6.Product, D1.ChemicalSubstance], object: D2.Condition, questions: [], status: accepted, ruling: "R-88, R-84", note: "added in synthesis: names a D2 type as object; no D2 question reads it" }
  - { predicate: MEDIATES_TARGET, module: D2, registeredBy: D2, subjects: [D2.Mechanism], object: D5.Target, questions: [Q-D2-10], status: accepted, ruling: R-83, note: "admitted by R-83 (Mechanism subject); accepted by D5 (OQ-D5-37, D5 10-seams predicateSeams)" }
  - { predicate: DEVELOPS_THERAPY_TARGETING, module: D2, registeredBy: D2, subjects: [D7.Organization], objects: [D2.Mechanism, D2.MolecularEntity], questions: [Q-D2-17], status: accepted, ruling: R-52, note: "registrar kept as in the packet; R-52 rule 3 (owner of the subject type) would name D7 — for the predicate-registry editor" }

sharedVocabularies:
  - { name: targets, module: D2, ref: "final/vocabularies/targets.yaml@0.2.2", ruling: R-60, use: "object of predicate MEDIATES_TARGET (Q-D2-10; accepted by D5, OQ-D5-37); D5 Target OPERATIONALIZED_BY → D2.Outcome | D2.Condition (D5 TargetMeasure, R-70)" }
  - { name: frontiers, module: D2, ref: "final/vocabularies/frontiers.yaml@0.2.1", ruling: R-60, use: "Q-D2-27 path Frontier ← ON_FRONTIER − Study → arm → context (only Event and Study attach, R-91); frontier `scope.anchors.mechanisms` names map to Mechanism keys by curation (no edge, D13 rule)" }
  - { name: identifier-schemes, module: D2, ref: "final/vocabularies/identifier-schemes.yaml", ruling: R-42, use: "REACTOME, GO, UNIPROT, HGNC, NCBI_GENE, ENSEMBL_GENE, MONDO, HPO, ICD10CM, SNOMEDCT, MESH, WIKIDATA; CHEMBL (compound and target ids, one namespace), WIKIPATHWAYS, ORPHANET, OMIM, EFO, KEGG_PATHWAY (status requested; CHEMBL_TARGET folded into CHEMBL); one (scheme, issuer, normalized value) identifies at most one Subjectable; no LOINC on Outcome (R-70)" }
  - { name: kernel-types, module: D2, ref: "final/schema/kernel.graphql", ruling: "R-47, R-25", use: "enum BasisKind on MechanismProjectionProperties.bestBasis (CURATOR_CLASSIFICATION for the hallmark mapping, one kernel basis order); AssertedRecordedProperties as the base of MechanismReferenceProperties; DerivedEdgeProperties (an M11 base, R-47) as the base of MechanismProjectionProperties; StructuralEdgeProperties as the base of ExposureRoleProperties; enum PrivacyClass (Entity field)" }
  - { name: d3-enums, module: D2, ref: "final/schema/D3.graphql", ruling: "R-56, R-58, R-59", use: "SexScope (MechanismEvidenceContext.sexScope), AdministrationRoute (.route; IN_MEDIUM and INTRAPERITONEAL added, R-58), EstimateDirection (MechanismProjectionProperties.direction, R-59)" }
  - { name: d6-enums, module: D2, ref: "final/schema/D6.graphql", ruling: R-58, use: "AmountBasis (MechanismEvidenceContext.exposureBasis; MEDIUM_CONCENTRATION for cell-free contexts); replaces D3 QuantityBasis" }
  - { name: predicates, module: D2, ref: "final/vocabularies/predicates.yaml", ruling: R-52, use: "D2 is registrar of the 17 predicateOnly names in D2.relationship.yaml; the predicateSeams above cite other registrars" }
  - { name: assessment-vocabularies, module: D2, ref: "final/vocabularies/assessment-vocabularies.yaml", ruling: "R-54, R-55", use: "D2 subkind D2.marketing-mechanism-support; CONFLICT_RELEVANCE reads D7.conflict-relevance (registrar D7, R-55)" }
  - { name: compartment-ontology-ids, module: D2, ref: "UBERON / CL / Cellosaurus CURIEs (value convention shared with D4 Metric.systemOntologyId and AssayVersion.specimenOntologyIds)", use: "Q-D2-03 / Q-D2-04 compartment equality check across D2 contexts and D4 metrics" }
  - { name: ModelOrganism, module: D2, ref: "final/schema/D2.graphql (D2 enum; declared once, D2 owns, R-56)", ruling: "R-56, R-90", use: "organism filter on contexts (CQ-MX-03, Q-D2-13, Q-D2-20); species joins D3 populations by ncbiTaxonId equality (R-90)" }
