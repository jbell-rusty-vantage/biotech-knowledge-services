version: 1
module: K
# Source: packets/K/10-seams.yaml (sha256 47d2e171…), edited by the S kernel editor 2026-10-08 per final/decision-report.md
# and final/_work/rulings.yaml (modules.K). Every entry keeps the 01-PACKET-CONTRACT fields (type, from, to, questions,
# direction, owner) and adds `module: K`. Synthesis edits:
#   R-09  removed rows DERIVED_FROM D10.ReportItem -> D10.Association (citesAssociations cut, R-48) and BLOCKED_BY
#         D10.ReportItem -> K.Assertion (D10 retargeted it to D5.UseConstraint); vocabulary files point at final/.
#   R-94  relationship seams and predicate seams are separate lists (`seams`, `predicateSeams`).
#   R-15  ASSERTED_BY admits D3.Publication and D9.MediaWork; Q-K-15 / Q-K-23 read AUTHORED_BY (predicate, D3) and
#         Q-K-15 reads HOLDS_ROLE (D7).
#   R-19  OCCURS_IN on every Assertion whose evidence is in a MediaWork, not only CLAIM occurrences.
#   R-27  MENTIONS licensed by its entity-link/vN derivationRule.
#   R-43  RENDITION_OF kernel meaning, asserted recorded-only; new row K.Source -> D3.Publication.
#   R-44  Q-K-10 / Q-K-17 / Q-K-22 read D3 REVISES (Source -RENDITION_OF-> Publication <-REVISES- notice).
#   R-60  vocabulary pins: targets 0.2.2, frontiers 0.2.1.
# Original note (A1, adversarial review): the K SDL references no type outside the kernel: every kernel edge that
# reaches a domain node targets the Subjectable or Entity interface. The entries record (1) every edge an OTHER module
# declares onto a kernel type (owner: other) and (2) the domain edges the K retrieval patterns read (owner: other) or
# the kernel edges whose targets are domain types through Subjectable (owner: this). Assertion.predicate values are not
# relationship seams: a predicate the K patterns read and another module registers is a `predicateSeams` row (R-94),
# checked against final/vocabularies/predicates.yaml (R-52).
seams:
  # ---- D9 (A8): retrieval structure, containers, renditions
  - { type: MENTIONS, module: K, from: D9.Chunk, to: K.Subjectable, questions: [Q-K-14, Q-K-05], direction: OUT, owner: other, note: "kernel meaning (derived, DerivedEdgeProperties); licensed by its entity-link/vN derivationRule, optional derivedFromAssessmentUids; a RESOLUTION Assessment only when a binding rests on the surface form (R-27); never evidence; D9 Chunk.mentions is the only MENTIONS field" }
  - { type: COVERS_LOCATOR, module: K, from: D9.Chunk, to: K.SourceLocator, questions: [Q-K-14, Q-K-20], direction: OUT, owner: other, note: "never support: answers cite HAS_EVIDENCE (R-27)" }
  - { type: CHUNK_OF, module: K, from: D9.Chunk, to: K.SourceSnapshot, questions: [Q-K-14], direction: OUT, owner: other }
  - { type: OCCURS_IN, module: K, from: K.Assertion, to: D9.MediaWork, questions: [Q-K-09, Q-K-21, CQ-CL-01, Q-D9-01, Q-D9-02], direction: "OUT (declared on D9.MediaWork.occurrences with direction IN)", owner: other, note: "the container of every Assertion whose evidence is in a MediaWork, not only CLAIM occurrences (exactly one; the work where the act of asserting was first published; R-19). Statement time T = the container's publishedAt, snapshot fallback. K Q-K-09 reads it as the container and Q-K-21 as the primary's source family" }
  - { type: RENDITION_OF, module: K, from: K.Source, to: D9.MediaWork, questions: [Q-K-21], direction: "OUT (declared on D9.MediaWork.renditions with direction IN)", owner: other, note: "kernel meaning (R-43): asserted, AssertedRecordedProperties, recorded-only (regrouping is a supersession, R-26); source family = OCCURS_IN work, else RENDITION_OF work, else Source; never a second container path" }
  - { type: RENDITION_OF, module: K, from: K.Source, to: D3.Publication, questions: [Q-K-21, Q-K-10, Q-K-17, Q-K-22, CQ-EV-05], direction: "OUT (declared on D3.Publication.renditions with direction IN)", owner: other, note: "added in synthesis (R-43): kernel meaning, asserted, AssertedRecordedProperties, [CONNECT]; registered by D3 with the K resveratrol PMC/PubMed renditions fixture; the scholarly-work branch of the source family and of the revision patterns (R-44)" }
  # ---- D3 (A4): scholarly revisions read by the kernel revision patterns
  - { type: REVISES, module: K, from: D3.Publication, to: D3.Publication, questions: [Q-K-10, Q-K-17, Q-K-22], direction: OUT, owner: other, note: "added in synthesis (R-44): K patterns read Source -RENDITION_OF-> Publication <-REVISES- notice; asserted per asserter, revisionKind typed by K SourceRevisionKind; HAS_REVISION_STATUS only for non-scholarly Sources and flags without an identified notice, never both for one (asserter, notice)" }
  # ---- D10 (A1): report composition, criteria, associations
  - { type: HAS_ITEM, module: K, from: K.Report, to: D10.ReportItem, questions: [Q-K-17, Q-D10-02, Q-D10-14], direction: "OUT (declared on D10.ReportItem.report with direction IN)", owner: other }
  - { type: USES_CRITERION, module: K, from: K.Report, to: D10.DecisionCriterion, questions: [Q-D10-02, CQ-RC-01], direction: "OUT (declared on D10.DecisionCriterion.usedByReports with direction IN)", owner: other }
  - { type: ASSESSES, module: K, from: D10.ReportItem, to: K.Subjectable, questions: [Q-K-05], direction: OUT, owner: other, note: "kernel meaning (09 pattern item 11)" }
  - { type: DERIVED_FROM, module: K, from: D10.ReportItem, to: K.Assertion, questions: [Q-K-06, Q-K-17], direction: OUT, owner: other }
  - { type: DERIVED_FROM, module: K, from: D10.ReportItem, to: K.Assessment, questions: [Q-K-06, Q-K-17], direction: OUT, owner: other, note: "ReportItem.citesAssessments" }
  - { type: DERIVED_FROM, module: K, from: D10.Association, to: K.Assertion, questions: [Q-K-06, CQ-AX-08], direction: OUT, owner: other, note: "an Association is WAS_GENERATED_BY a PROJECTION Activity; superseded and uncited Associations may be removed (R-48)" }
  - { type: BLOCKED_BY, module: K, from: D10.ReportItem, to: K.Assessment, questions: [Q-K-17, Q-D10-08], direction: OUT, owner: other, note: "ReportItem.blockedByAssessments; structural citation set (R-26)" }
  - { type: ASSOCIATES, module: K, from: D10.Association, to: K.Subjectable, questions: [Q-D10-05, Q-D10-06], direction: OUT, owner: other, note: "derived projection; one of the two registered domain exceptions targeting Subjectable (R-28); no score on the edge (R-48)" }
  # ---- D5 (A5): the other registered domain exception targeting Subjectable
  - { type: STEP_USES, module: K, from: D5.ProtocolStep, to: K.Subjectable, questions: [Q-D5-06], direction: OUT, owner: other, note: "added in synthesis (R-28): structural; D5 05 lists the admitted types and the executor enforces the list; any further domain edge to Subjectable needs a K amendment" }
  # ---- D2 (A3), D5 (A5): domain context and constraint records hung on kernel Assertions (declared IN on the domain type, R-29)
  - { type: OBSERVED_IN_CONTEXT, module: K, from: K.Assertion, to: D2.MechanismEvidenceContext, questions: [Q-D2-04, CQ-MX-01], direction: "OUT (declared on D2.MechanismEvidenceContext.assertions with direction IN)", owner: other, note: "structural: written in the same intent as the Assertion, corrected only by superseding it (R-29)" }
  - { type: RESOLVES_TO_CONSTRAINT, module: K, from: K.Assertion, to: D5.UseConstraint, questions: [Q-D5-03, CQ-RC-06], direction: "OUT (declared on D5.UseConstraint.resolvedFrom with direction IN; derived)", owner: other, note: "derived; never feeds adjudication (R-29). UseConstraint is a projection-minted grouping of safety Assertions, not a Claim, never vetted (R-76)" }
  # ---- D7 (A6), D6 (A6), D3, D9: asserters and their interests (read by Q-K-15, Q-K-23)
  - { type: ASSERTED_BY, module: K, from: K.Assertion, to: "D7.Person | D7.Organization | D3.Publication | D9.MediaWork | D9.Channel (channelKind ACCOUNT) (through K.Subjectable)", questions: [Q-K-15, Q-K-23], direction: OUT, owner: this, note: "D9 ACCOUNT channels admitted in the adversarial review (D9 request K-6); D3 Publication and D9 MediaWork admitted in synthesis for a multi-author work's own voice (R-15); executor change P20" }
  - { type: HOLDS_ROLE, module: K, from: D7.Person, to: D7.Organization, questions: [Q-K-15], direction: OUT, owner: other, note: "added in synthesis (R-15): Q-K-15 reads the asserter's (or the work's authors') roles" }
  - { type: HOLDS_STAKE, module: K, from: "D7.Person | D7.Organization", to: D7.Organization, questions: [Q-K-15], direction: OUT, owner: other }
  - { type: RECEIVES_VALUE_FROM, module: K, from: D7.Person, to: D7.Organization, questions: [Q-K-15], direction: OUT, owner: other }
  - { type: OWNS_BRAND, module: K, from: D7.Organization, to: D7.Brand, questions: [Q-K-15], direction: "OUT (declared on D7.Brand.owners with direction IN)", owner: other }
  - { type: SELLER_OF_RECORD, module: K, from: D6.Offer, to: D7.Organization, questions: [Q-K-15], direction: OUT, owner: other }
  # ---- computed states of every domain, D11 lineage
  - { type: DERIVED_FROM, module: K, from: "domain computed states (D1, D2, D6 …)", to: K.Assertion, questions: [Q-K-18], direction: OUT, owner: other }
  - { type: ASSESSES, module: K, from: K.Assessment, to: "domain types through K.Subjectable (D3, D4, D5, D7, D9, D13 kinds)", questions: [Q-K-13, Q-K-21], direction: OUT, owner: this }
  - { type: WAS_GENERATED_BY, module: K, from: D11.CaptureAttempt, to: K.Activity, questions: [CQ-AX-04, Q-K-04], direction: "OUT (declared once on K Activity.generated)", owner: this, note: "CaptureAttempt is an operational record, not a second lineage mechanism (R-41); label [CaptureAttempt, Occurrence] (R-17); read only for 'blocked' (PARTIAL | FAILED), 'not reported' is FIELD_NOT_REPORTED (R-09)" }
predicateSeams:
  # Assertion.predicate values the K patterns read that another module registers (R-94; registrar per R-52)
  - { predicate: AUTHORED_BY, module: K, registrar: D3, subjects: [D3.Publication, D5.Protocol, D5.ProtocolEdition], objects: [D7.Person, D7.Organization], questions: [Q-K-15, Q-K-23], owner: other, note: "R-15 / R-80: asserter (multi-author work) -[AUTHORED_BY predicate]-> Person -> D7 interest edges" }
sharedVocabularies:
  - name: identifier-schemes
    owner: K
    file: final/vocabularies/identifier-schemes.yaml
    role: "K owns the register (source packets/K/identifier-schemes.yaml); states the uniqueness rule (one (scheme, issuer, normalized value) identifies at most one Subjectable) and normalizationRule ids (R-42); every domain names its schemes in its node register identifierSchemes; D11 (A8) supplies the bridge table"
  - name: kernel-types
    owner: K
    file: final/schema/kernel.graphql
    role: "edge-property types (AssertedEdgeProperties, AssertedRecordedProperties, DerivedEdgeProperties, StructuralEdgeProperties, IdentifierLinkProperties, EvidenceEdgeProperties; the M11 bases are AssertedEdgeProperties, AssertedRecordedProperties, StructuralEdgeProperties and DerivedEdgeProperties, R-47) and enums (PrivacyClass, SemanticVerdict, EffectDirection, AssessmentKind, CertaintyLevel, BasisKind, SourceRevisionKind, TimePrecision, ...). StateEpisodeProperties removed in synthesis (R-10): versioned-state attachments use AssertedEdgeProperties plus register field exclusive: true. Other non-additive removals: Mention, Adjudication.considers (R-09; owner confirms)"
  - name: predicates
    owner: S
    file: final/vocabularies/predicates.yaml
    role: "one predicate registry (R-52); K is registrar of the kernel conventions FIELD_NOT_REPORTED, HAS_REVISION_STATUS, RATES_CLAIM, CORRECTS, HAS_IDENTIFIER, CITES_AS_SUPPORT, HAS_CREDENTIAL and of the qualifiers asserterBasis:, sourceRecordRemovedAt: (R-16, R-24)"
  - name: assessment-vocabularies
    owner: S
    file: final/vocabularies/assessment-vocabularies.yaml
    role: "one register of assessment subkinds, conclusionCode and facet vocabularies (R-54), including K.claim-relation (REFINES) and the input:<uid>= facets (R-34)"
  - name: targets
    owner: D5
    file: final/vocabularies/targets.yaml
    version: "0.2.2"
    role: "hosted, not consumed by K patterns: the closed target predicates (INTENDED_FOR_TARGET, IMPROVES_TARGET, WORSENS_TARGET, NO_EFFECT_ON_TARGET, MIXED_EFFECT_ON_TARGET, registrar D5) are values of K Assertion.predicate; weighed conclusions are K Assessments with effectDirection (pin R-60)"
  - name: frontiers
    owner: D13
    file: final/vocabularies/frontiers.yaml
    version: "0.2.1"
    role: "hosted, not consumed by K patterns: a Frontier is an admissible Assertion subject/object and Assessment target through K.Subjectable; the classification Assertion carries the qualifier frontierVocabVersion and basis CURATOR_CLASSIFICATION (pin R-60; R-25)"
