sharedVocabularies:
  - name: kernel-types
    ref: final/schema/kernel.graphql (sha256 ec981e2a…6c71)
    role: consumer
    uses: "enums SpeechAct (ProtocolStep.speechAct; Q-D5-27, CQ-PR-02), PrivacyClass (Entity field on every D5 type), BasisKind CURATOR_CLASSIFICATION (OPERATIONALIZED_BY authorizing Assertions, R-25); interface Subjectable as the STEP_USES target (R-28); edge-property types AssertedEdgeProperties (HAS_EDITION, R-10), AssertedRecordedProperties (OPERATIONALIZED_BY, R-26), StructuralEdgeProperties, DerivedEdgeProperties"
  - name: quantity-comparator
    ref: "D1 enum QuantityComparator (final/schema/D1.graphql)"
    role: consumer (ProtocolStep.thresholdComparator, UseConstraint.doseComparator; replaces D5 ThresholdComparator, R-57)
  - name: amount-basis
    ref: "D6 enum AmountBasis (final/schema/D6.graphql)"
    role: consumer (ProtocolStep.dosePeriod, UseConstraint.dosePeriod; replaces D5 DosePeriod, R-58)
  - name: targets
    ref: final/vocabularies/targets.yaml
    version: "0.2.2"
    role: owner (D5 publishes; consumed by K, D1, D2, D3, D4, D6, D7, D8, D9, D10, D12, D13; D11 removed from the consumer list, R-85)
    seamRule: "Assertion.predicate (5 closed predicates, registrar D5) for every means; Target-[OPERATIONALIZED_BY]->(D4 Biomarker | D4 Metric | D2 Outcome | D2 Condition) for measures (R-70); ProtocolStep.targetKeys for captured protocol purpose (D5-internal, 0.2.0 amendment); targetKeys string properties are also used by D13 Frontier.targetKeys and D10 DecisionCriterion.targetKeys (vocab-targets.yaml exception; D10 acknowledges, R-60)"
    ruling: R-60
  - name: identifier-schemes
    ref: final/vocabularies/identifier-schemes.yaml
    role: "consumer (MESH, WIKIDATA, SNOMEDCT, ISBN, DOI; MESH and SNOMEDCT with domain D5, OQ-D5-11 closed); one (scheme, issuer, normalized value) identifies at most one Subjectable (R-42)"
  - name: predicates
    ref: final/vocabularies/predicates.yaml
    role: "registrar of INTENDED_FOR_TARGET, IMPROVES_TARGET, WORSENS_TARGET, NO_EFFECT_ON_TARGET, MIXED_EFFECT_ON_TARGET, CAUSES_ADVERSE_EFFECT, HAS_UPPER_LIMIT, HAS_AUTHORIZED_DOSE_RANGE, USE_CONSTRAINED_IN, INTERACTS_WITH, INTERVENTION_INCLUDES and the required qualifier population: (R-52)"
  - name: assessment-vocabularies
    ref: final/vocabularies/assessment-vocabularies.yaml
    role: "D5 subkinds (D5.safety-signal, D5.surveillance-trend, D5.applicability, D5.step-evidence, D5.target-effect, D5.interaction-risk) and their conclusionCode / gradeScheme values (R-54)"
  - name: frontiers
    ref: final/vocabularies/frontiers.yaml
    version: "0.2.1"
    role: not consumed by D5 types; D13 Frontier.targetKeys references D5 target keys (D13 is the consumer; R-60)
