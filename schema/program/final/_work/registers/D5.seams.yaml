# Synthesis edits:
#   R-94  relationship seams (`seams`) and Assertion.predicate seams (`predicateSeams`) are separate lists; the latter
#         are checked against final/vocabularies/predicates.yaml (R-52). OFFERS_INTERVENTION moves to predicateSeams.
#   R-70  new row OPERATIONALIZED_BY D5.Target -> D2.Condition (owner this; fixture requested); the Outcome row is now
#         two-sided (D2 adds the IN row; D3 lists Outcome and Condition) - OQ-D5-43 closed.
#   R-75  BLOCKED_BY reversed: D10.ReportItem -> D5.UseConstraint (owner other); the old -> K.Assertion row is cut, and
#         K.Report ASSESSES D5.UseConstraint (CQ-RC-06) is cut (OQ-D5-39 reversed).
#   R-78  HOLDS_ROLE | HOLDS_STAKE | RECEIVES_VALUE_FROM replace HAS_INTEREST_IN (OQ-D7-29; OQ-D5-42 closed).
#   R-80  PROTOCOL_AUTHORED_BY -> AUTHORED_BY (registrar D3; subjects include D5.Protocol, D5.ProtocolEdition).
#   R-82  a stated non-affiliation is DISCLOSES_INTEREST (registrar D9) with polarity NEGATIVE, speechAct DENIES
#         (OQ-D5-44 closed).
#   R-83  RECOMMENDS_AGAINST registered by D9 (never with a Target object); MEDIATES_TARGET (D2) admitted.
#   R-84  CAUSES_ADVERSE_EFFECT object D2.Condition (OQ-D5-03, OQ-D5-41 closed).
#   R-85  subjects added (D1.Constituent, D12.FoodItem, D12.FoodCategory); D11 removed from the targets consumer list.
#   R-88  USE_CONSTRAINED_IN section BOXED_WARNING.
#   R-28  STEP_USES -> Subjectable is a registered domain exception; the admitted list is executor-enforced; D1, D4, D12
#         notes no longer say "union StepMeans" (OQ-D5-48 closed by R-94).
#   R-60  vocabulary pins: targets 0.2.2, frontiers 0.2.1.
#   R-10  kernel edge-property types: StateEpisodeProperties removed; HAS_EDITION uses AssertedEdgeProperties.
