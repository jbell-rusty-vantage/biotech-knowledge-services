version: 1
module: D3
# Source: packets/D3/10-seams.yaml (sha256 e8986aeb…), edited by the S module editor for D3 2026-10-08 per
# final/decision-report.md and final/_work/rulings.yaml (modules.D3, global). Every entry keeps the 01-PACKET-CONTRACT
# fields (type, from, to, questions, direction, owner), adds `module: D3`, and carries `status` (accepted | cut) with
# the deciding `ruling` (R-94: every seam on both sides or ruled; "packet" = accepted as published, no ruling changed it).
# Names are the final ones. Relationship seams and predicate seams are separate lists (R-94); predicate seams are
# checked against final/vocabularies/predicates.yaml (R-52), not against relationship types.
# Synthesis edits:
#   R-72  ADMINISTERS -> D4.Device cut (union AdministeredMaterial 6 -> 5).
#   R-70  MEASURES -> D2.Condition reaches a D5 Target (TargetMeasure = Biomarker | Metric | Outcome | Condition);
#         dependsOn OPERATIONALIZED_BY lists D2.Outcome and D2.Condition.
#   R-43  new row RENDITION_OF K.Source -> D3.Publication (direction IN, owner this).
#   R-07  INVESTIGATES questions add Q-D2-06.
#   R-10  kernelTypesReferenced: StateEpisodeProperties -> AssertedEdgeProperties (HAS_REGISTRATION_VERSION, exclusive).
#   R-44  SourceRevisionKind also types Publication.revisionStatus; PublicationRevisionStatus removed.
#   R-58  AmountBasis (D6) consumed by InterventionComponent.quantityBasis; QuantityBasis removed.
#   R-59  EstimateDirection (D3) also types D2 MechanismProjectionProperties.direction.
#   R-80, R-82, R-52  predicate seams: AUTHORED_BY, FUNDED_BY, ADMINISTERED_MATERIAL_PURITY (registrar D3),
#         DISCLOSES_INTEREST (registrar D9, replaces COMPETING_INTEREST_STATED).
#   R-44, R-71  D13 EVENT_ABOUT -> D3.Publication (predicate seam, owner other).
seams:
  # ---- declared by D3 ----
  - { type: ADMINISTERS, module: D3, from: D3.InterventionComponent, to: D1.IngredientMaterial, questions: [CQ-ST-01, CQ-ST-02, CQ-EV-04, Q-D3-06], direction: OUT, owner: this, status: accepted, ruling: R-94, note: "union AdministeredMaterial (5 members after R-72; no ChemicalSubstance: substance-only statements resolve to an UNRESOLVED_MATERIAL IngredientMaterial, D1 rule); AssertedRecordedProperties (recorded-only); D1's seam note is corrected to AssertedRecordedProperties by R-94 (D3 #26)" }
  - { type: ADMINISTERS, module: D3, from: D3.InterventionComponent, to: D6.ProductVariant, questions: [CQ-ST-02, CQ-EV-04], direction: OUT, owner: this, status: accepted, ruling: packet, note: "commercial product used as study material (ASPREE 100 mg enteric-coated aspirin); also the path for a device used as a trial intervention (the D6 Product DELIVERS the D4 Device, R-72); D6 10-seams lists it" }
  - { type: ADMINISTERS, module: D3, from: D3.InterventionComponent, to: D4.Device, questions: [CQ-ST-01, Q-D3-04], direction: OUT, owner: this, status: cut, ruling: R-72, note: "removed from AdministeredMaterial (6 -> 5): one device path, D6 Product -DELIVERS-> D4 Device; a device used as a trial intervention is a ProductVariant or a D5 Intervention; no fixture used the pair (R-06); D4 closes #12" }
  - { type: ADMINISTERS, module: D3, from: D3.InterventionComponent, to: D5.Intervention, questions: [CQ-ST-01, Q-D3-04, Q-D3-05], direction: OUT, owner: this, status: accepted, ruling: R-63, note: "lifestyle arms and named regimens (an eating pattern, including time-restricted eating, is administered as a D12 DietaryPattern, R-63); D5 10-seams lists it (Q-D5-25); replaces pinned FOLLOWS_INTERVENTION_DEFINITION" }
  - { type: ADMINISTERS, module: D3, from: D3.InterventionComponent, to: D12.FoodItem, questions: [CQ-ST-01, Q-D3-04], direction: OUT, owner: this, status: accepted, ruling: packet, note: "whole-food arms; D12 10-seams lists it" }
  - { type: ADMINISTERS, module: D3, from: D3.InterventionComponent, to: D12.DietaryPattern, questions: [CQ-ST-01, Q-D3-04, Q-D3-05], direction: OUT, owner: this, status: accepted, ruling: R-63, note: "requested by D12 (Q-D12-12, Q-D12-13, Q-D12-25); took the union slot of D8 Lot; R-63 keeps both Intervention and DietaryPattern in AdministeredMaterial" }
  - { type: MEASURES, module: D3, from: D3.OutcomeDefinition, to: D4.Metric, questions: [Q-D3-04, CQ-ST-03], direction: OUT, owner: this, status: accepted, ruling: R-70, note: "clocks resolve through Metric (ALGORITHM_OUTPUT) → D4 AlgorithmVersion; LOINC belongs to D4 Metric only (R-70)" }
  - { type: MEASURES, module: D3, from: D3.OutcomeDefinition, to: D4.Biomarker, questions: [Q-D3-04, CQ-ST-03], direction: OUT, owner: this, status: accepted, ruling: R-70, note: "D4 10-seams lists it" }
  - { type: MEASURES, module: D3, from: D3.OutcomeDefinition, to: D2.Outcome, questions: [Q-D3-04, Q-D3-05], direction: OUT, owner: this, status: accepted, ruling: R-70, note: "D2 Outcome kept (R-70): the study-independent endpoint concept (all-cause mortality, lifespan, VO2max) that an OutcomeDefinition measures; D2 10-seams lists it" }
  - { type: MEASURES, module: D3, from: D3.OutcomeDefinition, to: D2.Condition, questions: [Q-D3-05, CQ-ST-06], direction: OUT, owner: this, status: accepted, ruling: R-70, note: "incident disease and adverse-event terms (D5 maps adverse effects to D2 Condition; no AdverseEffect type exists); a Condition-coded outcome reaches a D5 Target through TargetMeasure's Condition member (R-70: OPERATIONALIZED_BY -> Condition = 'incidence of this condition measures the target'; fixture request ASPREE hemorrhage or dementia in final/requests.md)" }
  - { type: HAS_STUDY_ROLE, module: D3, from: D3.Study, to: D7.Organization, questions: [Q-D3-08, Q-D3-09, Q-D3-02, Q-D3-10], direction: OUT, owner: this, status: accepted, ruling: R-82, note: "D7 10-seams lists it with roles; D7 declares no inverse (Organization hub split); funding of a Study is the typed HAS_STUDY_ROLE {FUNDER} (R-82)" }
  - { type: HAS_STUDY_ROLE, module: D3, from: D3.Study, to: D7.Person, questions: [Q-D3-08, Q-D3-09], direction: OUT, owner: this, status: accepted, ruling: packet, note: "sponsor-investigator (NCT04313634 lead sponsor is a person), PRINCIPAL_INVESTIGATOR, RESPONSIBLE_PARTY" }
  - { type: HAS_STUDY_ROLE, module: D3, from: D3.Study, to: D7.Award, questions: [Q-D3-08], direction: OUT, owner: this, status: accepted, ruling: packet, note: "roleKind FUNDING_AWARD; answers D7's OQ-D7-04 request for Study → Award (FUNDED_BY_AWARD) inside the existing type" }
  - { type: INVESTIGATES, module: D3, from: D3.Study, to: D2.Condition, questions: [Q-D3-10, Q-D3-04, Q-D3-17, Q-D2-06], direction: OUT, owner: this, status: accepted, ruling: R-07, note: "D2 10-seams lists it as declared by D3; Q-D2-06 (v1) added to the register's questions in synthesis (R-07)" }
  - { type: RENDITION_OF, module: D3, from: K.Source, to: D3.Publication, questions: [Q-K-21], direction: IN, owner: this, status: accepted, ruling: R-43, note: "added in synthesis: kernel meaning (Source -> D9 MediaWork | D3 Publication), asserted, AssertedRecordedProperties, [CONNECT]; declared on D3 Publication.renditions (direction IN) and registered by D3; K.seams lists the same pair (owner other). Source family = OCCURS_IN work, else RENDITION_OF work, else the Source; the scholarly branch of the revision patterns (Source -RENDITION_OF-> Publication <-REVISES- notice, R-44: Q-K-10, Q-K-17, Q-K-22, CQ-EV-05)" }
  # ---- declared by other modules into D3 types ----
  - { type: ON_FRONTIER, module: D3, from: D3.Study, to: D13.Frontier, questions: [Q-D3-10], direction: OUT, owner: other, status: accepted, ruling: R-91, note: "declared by D13 as Frontier.studies (direction IN, K AssertedRecordedProperties); D3 spends no field; D10 also reads it; only Event and Study attach to a Frontier (R-91)" }
  - { type: IN_STUDY_ARM, module: D3, from: D2.MechanismEvidenceContext, to: D3.StudyArm, questions: [Q-D3-04], direction: OUT, owner: other, status: accepted, ruling: packet, note: "declared by D2 (MechanismEvidenceContext.studyArm, structural); with per-source arms D2 links the arm of the source its context came from" }
  - { type: MENTIONS, module: D3, from: D9.Chunk, to: D3.Study, questions: [Q-D3-14], direction: OUT, owner: other, status: accepted, ruling: R-27, note: "D9 Chunk.mentions (kernel meaning, derived, licensed by its entity-link/vN derivationRule; R-27), also to OutcomeDefinition, InterventionComponent, Publication through Subjectable; never evidence (00-DIRECTIVE 3.8)" }
  - { type: MENTIONS, module: D3, from: D9.Chunk, to: D3.OutcomeDefinition, questions: [Q-D3-14], direction: OUT, owner: other, status: accepted, ruling: R-27 }
  - { type: COVERS_LOCATOR, module: D3, from: D9.Chunk, to: K.SourceLocator, questions: [Q-D3-14], direction: OUT, owner: other, status: accepted, ruling: R-27, note: "D9 derived chunk → locator span-overlap projection used by the U2E path; never support (answers cite HAS_EVIDENCE)" }
  - { type: ASSESSES, module: D3, from: K.Assessment, to: D3.StudyResult, questions: [CQ-EV-04, CQ-ST-09, CQ-ST-10, CQ-AX-24, CQ-EV-03], direction: OUT, owner: other, status: accepted, ruling: R-54, note: "kernel field Assessment.about (Subjectable); kinds APPLICABILITY (D3.applicability, D3.applicability.dimension), EVIDENCE_SYNTHESIS, QUALITY (D3.evidence-strength: gradeScheme + grade + certainty), OTHER (D3.result-interpretation: effectDirection + conclusionCode), SAFETY_SIGNAL (D5); subkinds in final/vocabularies/assessment-vocabularies.yaml (R-54)" }
  - { type: ASSESSES, module: D3, from: K.Assessment, to: D3.OutcomeDefinition, questions: [CQ-ST-03], direction: OUT, owner: other, status: accepted, ruling: R-54, note: "kind OTHER, subkind D3.endpoint-classification (pinned EndpointClassification): conclusionCode = endpoint class, facets bestCategory= / contextOfUse=" }
  - { type: ASSESSES, module: D3, from: K.Assessment, to: D3.Study, questions: [CQ-EV-04, Q-D3-07, CQ-AX-24, Q-D3-04], direction: OUT, owner: other, status: accepted, ruling: packet, note: "applicability of a study to a use context; risk of bias (QUALITY)" }
  - { type: ASSESSES, module: D3, from: K.Assessment, to: D3.InterventionComponent, questions: [CQ-ST-02, CQ-EV-04, Q-D3-07], direction: OUT, owner: other, status: accepted, ruling: packet, note: "EQUIVALENCE / APPLICABILITY of study material vs a product on sale; dose translation" }
  - { type: ASSESSES, module: D3, from: K.Report, to: D3.Study, questions: [Q-D3-04], direction: OUT, owner: other, status: accepted, ruling: packet, note: "kernel field Report.about (Subjectable); published comparison or evidence report (D10 composition)" }
predicateSeams:
  # Assertion.predicate values on D3 subjects or objects, or read by D3 patterns, that cross a module line (R-94).
  # owner: this = D3 is the registrar; other = another module registers it. Checked against final/vocabularies/predicates.yaml.
  - { predicate: AUTHORED_BY, module: D3, registrar: D3, subjects: [D3.Publication, D5.Protocol, D5.ProtocolEdition], objects: [D7.Person, D7.Organization], questions: [Q-D3-03, Q-D3-08, Q-D5-13, Q-K-15, Q-K-23, Q-D9-13], owner: this, status: accepted, ruling: R-80, note: "one authorship predicate; aliases AUTHORED (D7, inverse) and PROTOCOL_AUTHORED_BY (D5) retired; D9 keeps typed APPEARS_IN {AUTHOR} for MediaWorks; D13 drops its AUTHOR role (R-44); K reads asserter (Publication) -> AUTHORED_BY -> Person -> D7 interest edges (R-15); author identity through RESOLUTION Assessments" }
  - { predicate: FUNDED_BY, module: D3, registrar: D3, subjects: [D3.Publication], objects: [D7.Organization], questions: [Q-D3-08, Q-D11-08], owner: this, status: accepted, ruling: R-82, note: "paper-level funding statement; FUNDER_ROLE_STATEMENT folded in as qualifier roleText:<statement>; D11's FUNDED_BY merged here; funding of a Study is typed HAS_STUDY_ROLE {FUNDER}" }
  - { predicate: MATERIAL_PROVIDED_BY, module: D3, registrar: D3, subjects: [D3.InterventionComponent], objects: [D7.Organization], questions: [Q-D3-08], owner: this, status: accepted, ruling: packet, note: "which component a supplier provided (ChromaDex NR in the ITP); the study-level role is HAS_STUDY_ROLE {MATERIAL_PROVIDER}" }
  - { predicate: ADMINISTERED_MATERIAL_PURITY, module: D3, registrar: D3, subjects: [D3.InterventionComponent], objects: ["literal valueNumber"], questions: [Q-D1-08, CQ-ID-06], owner: this, status: accepted, ruling: R-52, note: "FIELD Assertion: purity of the batch as administered (99 % NR chloride); requested by D1 (OQ-D1-35); read by D1" }
  - { predicate: DISCLOSES_INTEREST, module: D3, registrar: D9, subjects: [D3.Publication, D7.Person], objects: [D7.Organization], questions: [Q-D3-08], owner: other, status: accepted, ruling: R-82, note: "replaces D3's COMPETING_INTEREST_STATED; subject the discloser or the work, object an Organization; 'no competing interest' = polarity NEGATIVE, speechAct DENIES; statements about individual authors are asserted by the named D7 Person (R-15); the typed interest (Person -> organization, patents) is D7's" }
  - { predicate: "MOIETY_EQUIVALENT_AMOUNT | NUTRIENT_EQUIVALENT_AMOUNT | PER_MAX_DAILY_DOSE_AMOUNT | DECLARATION_STOICHIOMETRY_CHECK | EXCEEDS_DOSE_THRESHOLD", module: D3, registrar: D1, subjects: [D6.LabelVersion, D3.InterventionComponent], objects: [D1.ChemicalSubstance, D1.Constituent], questions: [CQ-PF-01, Q-D1-02, Q-D1-03], owner: other, status: accepted, ruling: packet, note: "CALCULATED Assertions written by the D1 projection (d1-amounts/v1) on the D3 component's stated dose (quantity, unitCode, quantityBasis = D6 AmountBasis, massBasis = D1 MassBasis); D1 10-seams row" }
  - { predicate: "USED_FOOD_CLASSIFICATION | USED_COMPOSITION_DATABASE", module: D3, registrar: D12, subjects: [D3.Study], objects: ["literal valueString"], questions: [Q-D12-25], owner: other, status: accepted, ruling: packet, note: "D12 registers them until D3 takes them (OQ-D12-27); no ruling moved them" }
  - { predicate: EVENT_ABOUT, module: D3, registrar: D13, subjects: [D13.Event], objects: [D3.Study, D3.Publication], questions: [Q-D13-05, CQ-EV-05], owner: other, status: accepted, ruling: R-44, note: "a RETRACTION Event only as a curated frontier milestone: EVENT_ABOUT -> D3.Publication, its clock cites the notice's locator, no second date Assertion; authors and publisher through the Publication (AUTHORED_BY); D13 names D3.Publication (R-71)" }
  - { predicate: CONTINGENT_ON, module: D3, registrar: D13, subjects: [D13.Event], objects: [D3.Study], questions: [Q-D13-12], owner: other, status: accepted, ruling: packet }
  - { predicate: HAS_REVISION_STATUS, module: D3, registrar: K, subjects: [K.Source], objects: ["literal valueString (SourceRevisionKind)"], questions: [CQ-EV-05, Q-D3-03, Q-D3-11, Q-D3-12], owner: other, status: accepted, ruling: R-44, note: "kernel convention (R-52); only for non-scholarly Sources and status flags with no identified notice (OpenAlex is_retracted, PubMed); one Assertion per authority; never written both ways with REVISES for one (asserter, notice); Publication.revisionStatus caches both" }
  - { predicate: HAS_IDENTIFIER, module: D3, registrar: K, subjects: [D3.Study, D3.Publication], objects: [K.Identifier], questions: [CQ-ST-08, CQ-EV-05], owner: other, status: accepted, ruling: R-42, note: "authorizing predicate of K's typed HAS_IDENTIFIER (identifier.attach; a second asserter of a registration number, e.g. ISRCTN listing NCT01038583); one (scheme, issuer, normalized value) identifies at most one Subjectable" }
kernelTypesReferenced:
  - { type: SourceRevisionKind, kind: enum, usedOn: [RevisionEdgeProperties.revisionKind, Publication.revisionStatus], owner: K, note: "the one revision vocabulary (R-44); PublicationRevisionStatus removed; Publication.revisionStatus null = none known" }
  - { type: TimePrecision, kind: enum, usedOn: [RegistrationVersion.versionDatePrecision, RegistrationVersion.primaryCompletionDatePrecision, Publication.publishedAtPrecision, StudyRoleEdgeProperties], owner: K }
  - { type: ValidTimeBasis, kind: enum, usedOn: [StudyRoleEdgeProperties], owner: K, note: "StudyRoleEdgeProperties repeats AssertedEdgeProperties' fields verbatim" }
  - { type: AssertedEdgeProperties, kind: relationshipProperties, usedOn: [HAS_REGISTRATION_VERSION, "HAS_STUDY_ROLE (as the base of StudyRoleEdgeProperties)"], owner: K, note: "R-10: StateEpisodeProperties removed; HAS_REGISTRATION_VERSION uses AssertedEdgeProperties and its register entry carries exclusive: true" }
  - { type: AssertedRecordedProperties, kind: relationshipProperties, usedOn: [STATED_IN, ADMINISTERS, MEASURES, REPORTS_ON, INVESTIGATES, RENDITION_OF], owner: K, note: "kernel M10 (recorded-only asserted edges); M11 base of RevisionEdgeProperties; RENDITION_OF added by R-43" }
  - { type: StructuralEdgeProperties, kind: relationshipProperties, usedOn: [HAS_ARM, HAS_COMPONENT, HAS_POPULATION, HAS_OUTCOME, RESULT_FOR, RESULT_FOR_ARM], owner: K }
  - { type: Source, kind: node, usedOn: "Publication.renditions (RENDITION_OF, direction IN; R-43)", owner: K }
  - { type: Assessment, kind: node, usedOn: "ASSESSES into D3 types (kernel-declared)", owner: K }
  - { type: Report, kind: node, usedOn: "ASSESSES into D3.Study (kernel-declared)", owner: K }
moduleEdgePropertyTypes:
  - { type: StudyRoleEdgeProperties, usedOn: [HAS_STUDY_ROLE], base: AssertedEdgeProperties, adds: [roleKind], note: "kernel M11 superset rule; role label as printed is Assertion.qualifiers roleText:<label>" }
  - { type: RevisionEdgeProperties, usedOn: [REVISES], base: AssertedRecordedProperties, adds: [revisionKind], note: "kernel M11 superset rule; revisionKind typed by K SourceRevisionKind; per-asserter reasons are Assertion.qualifiers reason:<text>" }
dependsOn:
  - { edge: OPERATIONALIZED_BY, from: D5.Target, to: "D4.Biomarker | D4.Metric | D2.Outcome | D2.Condition", owner: D5, ruling: R-70, why: "the path from study evidence to a target (Q-D3-04, Q-D3-05, Q-D5-20): Target -OPERATIONALIZED_BY-> Metric|Biomarker|Outcome|Condition (D5 union TargetMeasure, R-70) <-MEASURES- OutcomeDefinition <-RESULT_FOR- StudyResult; asserted with recorded time only (R-26); a Condition-coded outcome means 'incidence of this condition measures the target', its direction in D5's vocab-targets rule (closes 11-open-questions #8)" }
  - { edge: LOT_OF, from: D8.Lot, to: "D6.Product | D6.ProductVariant", owner: D8, why: "CQ-ST-02 SAME_LOT path (InterventionComponent.lotCodeVerbatim = Lot.lotCode, property join)" }
  - { edge: "HAS_LABEL_VERSION / DECLARES_COMPONENT", from: "D6.ProductVariant | D6.LabelVersion", to: D1.IngredientMaterial, owner: D6, why: "CQ-ST-02 SAME_MATERIAL path: the material on the label of the product on sale" }
  - { edge: REALIZES_SUBSTANCE, from: D1.IngredientMaterial, to: D1.ChemicalSubstance, owner: D1, why: "CQ-ST-02 SAME_SUBSTANCE_ONLY path; Q-D3-02 / Q-D3-03 / Q-D3-06 group by substance" }
  - { edge: "none (Assertion.qualifiers string population:<uid>)", from: K.Assertion, to: D3.StudyPopulation, owner: D5, why: "D5 target-effect assertions qualified by a study population name it by the kernel qualifier string population:<StudyPopulation uid> (D5 vocab-targets withdrew the APPLIES_TO_POPULATION qualifier assertion); a string join, no edge, no D3 field" }
sharedVocabularies:
  - { name: kernel-types, file: final/schema/kernel.graphql, owner: K, usedBy: [StudyRoleEdgeProperties, RevisionEdgeProperties, RegistrationVersion, Publication, HAS_REGISTRATION_VERSION, STATED_IN, ADMINISTERS, MEASURES, REPORTS_ON, INVESTIGATES, RENDITION_OF], how: "kernel types used as property or edge-property types: AssertedEdgeProperties, AssertedRecordedProperties, StructuralEdgeProperties, SourceRevisionKind, TimePrecision, ValidTimeBasis, PrivacyClass; detail in kernelTypesReferenced above" }
  - { name: predicates, file: final/vocabularies/predicates.yaml, owner: S, usedBy: [predicateOnly, predicateSeams], how: "one registry (R-52); D3 registers AUTHORED_BY, FUNDED_BY, ADMINISTERED_MATERIAL_PURITY and its predicateOnly list; kernel conventions are K's" }
  - { name: assessment-vocabularies, file: final/vocabularies/assessment-vocabularies.yaml, owner: S, usedBy: ["ASSESSES into D3 types"], how: "D3 subkinds (D3.applicability, D3.applicability.dimension, D3.evidence-strength, D3.result-interpretation, D3.endpoint-classification) registered once (R-54)" }
  - { name: targets, file: final/vocabularies/targets.yaml, version: "0.2.2", owner: D5, usedBy: [Q-D3-04, Q-D3-05], how: "study evidence reaches a Target only through OutcomeDefinition -MEASURES-> Metric|Biomarker|Outcome|Condition <-OPERATIONALIZED_BY- Target (D5 union TargetMeasure, R-70); target-effect claims are D5 Assertions (IMPROVES_TARGET … WORSENS_TARGET) whose qualifier population:<uid> may name a D3 StudyPopulation; no D3 node points at a Target (pin R-60)" }
  - { name: frontiers, file: final/vocabularies/frontiers.yaml, version: "0.2.1", owner: D13, usedBy: [Q-D3-10], how: "Study is one of the two types that attach to a Frontier (ON_FRONTIER, asserted by the curation agent with frontierVocabVersion; R-91); D13 declares the field (pin R-60)" }
  - { name: identifier-schemes, file: final/vocabularies/identifier-schemes.yaml, owner: K, usedBy: [Study, Publication], how: "NCT, ISRCTN, EUCT, EUDRACT on Study; DOI, PMID, PMCID, OPENALEX on Publication and on their kernel Sources; the Source ↔ Publication grouping is RENDITION_OF (R-43), never a shared-Identifier join (R-42); requested: RETRACTION_WATCH, PROSPERO, ACTRN, CHICTR, DRKS, CTRI, JRCT, WHO_UTN" }
  - { name: SexScope, file: final/schema/D3.graphql, owner: D3, usedBy: [StudyPopulation.sexScope, "D2 MechanismEvidenceContext.sexScope"], how: "D3 enum (ALL, FEMALE, MALE, NOT_REPORTED) reused by D2; declared once, here (R-56)" }
  - { name: EstimateDirection, file: final/schema/D3.graphql, owner: D3, usedBy: [StudyResult.direction, "D2 MechanismProjectionProperties.direction"], how: "neutral direction of a point estimate (INCREASED, DECREASED, NO_CHANGE, MIXED, UNKNOWN); replaces D2 MechanismDirection (R-59); benefit / harm is kernel EffectDirection on Assessments, the only judgment vocabulary" }
  - { name: AdministrationRoute, file: final/schema/D3.graphql, owner: D3, usedBy: [InterventionComponent.route, "D2 cell-free fixture contexts (IN_MEDIUM)"], how: "R-58 adds IN_MEDIUM and INTRAPERITONEAL; D2 refills its cell-free contexts (route IN_MEDIUM, basis MEDIUM_CONCENTRATION)" }
  - { name: AmountBasis, file: final/schema/D6.graphql, owner: D6, usedBy: [InterventionComponent.quantityBasis], how: "the one amount-basis enum (R-58), replacing D3 QuantityBasis (all eight QuantityBasis values exist in AmountBasis); compile stub in scratch" }
  - { name: MassBasis, file: final/schema/D1.graphql, owner: D1, usedBy: [InterventionComponent.massBasis], how: "D1 enum (SALT_FORM, ACTIVE_MOIETY, NUTRIENT_EQUIVALENT, MATERIAL_AS_IS, UNSPECIFIED) used as a property type; declared once by D1 (R-56); compile stub in scratch" }
