version: 1
module: D1
# Source: packets/D1/10-seams.yaml (sha256 2ae098bb…), edited by the S module editor for D1, 2026-10-08, per
# final/decision-report.md and final/_work/rulings.yaml (global + modules.D1). Every row keeps the 01-PACKET-CONTRACT
# fields (type, from, to, questions, direction, owner), adds `module: D1`, and carries `status` (accepted | cut) with the
# `ruling` that decides it ("none" = no ruling touches the row; kept as the owner module published it). Synthesis edits:
#   R-94  relationship seams (`seams`) and Assertion.predicate rows (`predicateSeams`, checked against
#         final/vocabularies/predicates.yaml, registrar per R-52) are separate lists; MENTIONS from D9.Chunk;
#         D12 FOOD_FROM_TAXON (not DERIVED_FROM_TAXON); AFFECTS_MECHANISM → D2.MolecularEntity row cut; STEP_USES targets
#         K.Subjectable (no StepMeans union); ADMINISTERS reads AssertedRecordedProperties; stale D1.Compound remarks
#         dropped (D10 and D13 seams use the D1 names).
#   R-10  HAS_LABEL_VERSION is AssertedEdgeProperties + register exclusive: true (StateEpisodeProperties retired).
#   R-72  ADMINISTERS union AdministeredMaterial (5, no Device); RegulatoryRecordTopic and LegalStatusSubject (4, no Device).
#   R-73  CONCERNS D8.Patent → D1.IngredientMaterial cut (Patent.concerns typed ChemicalSubstance); measured content of
#         sold products: survey rows without a lot stay D1 predicates with subject D6 Product | ProductVariant;
#         SAMPLE_TESTED_POSITIVE_FOR (D8) takes D1.Taxon as object.
#   R-68  MANUFACTURES_MATERIAL → MANUFACTURES; MANUFACTURES and SUPPLIES_MATERIAL registered by D7.
#   R-52  target predicates and HAS_UPPER_LIMIT family registered by D5; ADMINISTERED_MATERIAL_PURITY by D3;
#         SOURCED_FROM_COUNTRY by D1.
#   R-85  HAS_UPPER_LIMIT / HAS_AUTHORIZED_DOSE_RANGE admit D1.Constituent; limitKind SCHEDULING_THRESHOLD and
#         LABEL_WARNING_THRESHOLD added (OQ-D1-03 closed); EXCEEDS_DOSE_THRESHOLD report-only.
#   R-54  plantPart= facet on D5 SAFETY_SIGNAL registered in final/vocabularies/assessment-vocabularies.yaml (OQ-D1-33).
#   R-88, R-93  D8 predicates HAS_APPROVED_INDICATION and HAS_ACTION_LEVEL take D1.ChemicalSubstance as subject (new rows).
#   R-60  vocabulary pins targets 0.2.2, frontiers 0.2.1; vocabulary files point at final/vocabularies/.
# D1 declares NO relationship to a type outside the module: all six D1 relationship types are D1 → D1. Every typed seam
# below is an edge another module (or the kernel) declares INTO a D1 type (owner: other). `questions` lists the D1
# questions that read the seam ([] when only the other module's questions use it).
seams:
  # ---- declared by other modules into D1 types ----
  - { type: DECLARES_COMPONENT, module: D1, from: D6.LabelVersion, to: "D1.IngredientMaterial | D1.Constituent", questions: [CQ-PF-01, Q-D1-05, CQ-ID-03, Q-D1-14, Q-D1-16, Q-D1-19, Q-D1-21, Q-D1-24, Q-D1-25], direction: OUT, owner: other, status: accepted, ruling: "R-87, R-30", note: "field LabelVersion.components, union DeclaredComponentTarget = IngredientMaterial | Constituent | FoodItem (3). Asserted label lines accepted (R-87): one Assertion per line (predicate DECLARES_COMPONENT), which D1's CALCULATED amounts cite in DERIVED_FROM. ComponentLineProperties = kernel AssertedRecordedProperties + orderIndex, parentOrderIndex, lineRole, amount, unitCode, amountReferent, massBasis (D1 MassBasis), amountBasis (D6 AmountBasis, R-58), dailyValuePercent; declaredNameVerbatim, formVerbatim and statementVerbatim move to the authorizing Assertion (locator text / qualifiers declaredName:, form:, statement:; R-30). No ChemicalSubstance target: a chemical line resolves to a CHEMICALLY_DEFINED IngredientMaterial" }
  - { type: HAS_LABEL_VERSION, module: D1, from: D6.Package, to: D6.LabelVersion, questions: [Q-D1-02, Q-D1-03, Q-D1-05, Q-D1-25], direction: OUT, owner: other, status: accepted, ruling: R-10, note: "read-only for D1: AssertedEdgeProperties episode with register exclusive: true (StateEpisodeProperties retired, R-10) = which label was current at $vt; path ProductVariant -HAS_PACKAGE-> Package -HAS_LABEL_VERSION-> LabelVersion" }
  - { type: ADMINISTERS, module: D1, from: D3.InterventionComponent, to: D1.IngredientMaterial, questions: [CQ-ID-06, CQ-ST-02, Q-D1-14], direction: OUT, owner: other, status: accepted, ruling: "R-72, R-94", note: "field InterventionComponent.administers, union AdministeredMaterial = IngredientMaterial | ProductVariant | Intervention | FoodItem | DietaryPattern (5; Device removed, R-72; no ChemicalSubstance), AssertedRecordedProperties (R-94, D3 #26); dose on the component node (quantity, unitCode, basis D6 AmountBasis (R-58), massBasis D1 MassBasis); path Study -HAS_ARM-> StudyArm -HAS_COMPONENT-> InterventionComponent. A trial-batch purity is the D3 FIELD predicate ADMINISTERED_MATERIAL_PURITY on the component (fixture nr-trial-unstructured t02), never D1 MATERIAL_CONTAINS" }
  - { type: FOOD_CONTAINS, module: D1, from: D12.FoodItem, to: "D1.ChemicalSubstance | D1.Constituent", questions: [Q-D1-22], direction: OUT, owner: other, status: accepted, ruling: R-64, note: "field FoodItem.components, union FoodComponentTarget (2). Kept as a separate type from D1 MATERIAL_CONTAINS with aligned qualifier names: D12 FoodContentProperties (AssertedRecordedProperties superset) uses statementKind (D1 ContentStatementKind), quantity and unitCode, like D1 ContentEdgeProperties; the cross-module read is [:MATERIAL_CONTAINS|FOOD_CONTAINS] (R-64; final query-patterns.md)" }
  - { type: PATTERN_COMPONENT, module: D1, from: D12.DietaryPattern, to: D1.Constituent, questions: [], direction: OUT, owner: other, status: accepted, ruling: none, note: "union PatternComponentTarget = FoodItem | FoodCategory | Constituent (3), AssertedRecordedProperties ('limit added sugars'); serves D12's questions" }
  - { type: HAS_ANALYTE, module: D1, from: D4.Biomarker, to: D1.ChemicalSubstance, questions: [], direction: OUT, owner: other, status: accepted, ruling: none, note: "field Biomarker.analytes, StructuralEdgeProperties; NAD+ and other small-molecule analytes are D1 substances; serves D4/D2 questions" }
  - { type: PARTICIPATES_IN, module: D1, from: D1.ChemicalSubstance, to: D2.Mechanism, questions: [], direction: OUT, owner: other, status: accepted, ruling: none, note: "stored D1 → D2, declared on D2 only (field Mechanism.metaboliteParticipants, direction IN, MechanismReferenceProperties); endogenous metabolites (NAD+, NMN) are D1 substances; D1 gets no field" }
  - { type: AFFECTS_MECHANISM, module: D1, from: D1.ChemicalSubstance, to: D2.Mechanism, questions: [Q-D1-28], direction: OUT, owner: other, status: accepted, ruling: "R-94, R-47", note: "derived projection d2.affects-mechanism/v1 declared by D2 (Mechanism.affectedBy, union MechanismModulator = ChemicalSubstance | Intervention; MechanismProjectionProperties, a DerivedEdgeProperties superset, direction typed EstimateDirection, R-59), read-only; it stays a typed projection (R-47 withdraws 'Association replaces AFFECTS_MECHANISM'); D1 declares nothing" }
  - { type: AFFECTS_MECHANISM, module: D1, from: D1.ChemicalSubstance, to: D2.MolecularEntity, questions: [], direction: OUT, owner: other, status: cut, ruling: R-94, note: "pair removed in D2's adversarial review (compound → molecular target is an Assertion hop plus PARTICIPATES_IN); row dropped" }
  - { type: EXPOSED_TO, module: D1, from: D2.MechanismEvidenceContext, to: "D1.ChemicalSubstance | D1.IngredientMaterial", questions: [], direction: OUT, owner: other, status: accepted, ruling: R-86, note: "union ContextExposure = ChemicalSubstance | IngredientMaterial | Intervention (3) unchanged (R-86: D1's material-resolution rule governs what a study administers, not what a mechanistic context was exposed to), structural ExposureRoleProperties; serves D2 questions" }
  - { type: STEP_USES, module: D1, from: D5.ProtocolStep, to: "K.Subjectable (admitted D1.ChemicalSubstance, D1.IngredientMaterial)", questions: [], direction: OUT, owner: other, status: accepted, ruling: "R-28, R-94", note: "structural, StructuralEdgeProperties; one of the two registered domain exceptions targeting Subjectable (R-28): D5 05 lists the admitted types and the executor enforces the list; no StepMeans union (R-94); serves D5 questions" }
  - { type: CONCERNS, module: D1, from: D8.Patent, to: D1.ChemicalSubstance, questions: [Q-D1-17], direction: OUT, owner: other, status: accepted, ruling: R-73, note: "Patent.concerns typed ChemicalSubstance (union PatentTopic removed, R-73), AssertedRecordedProperties; D8 fixture us8197807; a crystal-form patent concerns the substance, and Q-D1-17 reaches a material's patents through REALIZES_SUBSTANCE" }
  - { type: CONCERNS, module: D1, from: D8.Patent, to: D1.IngredientMaterial, questions: [Q-D1-17], direction: OUT, owner: other, status: cut, ruling: R-73, note: "unfixtured value-2 pair cut (R-06, R-73); OQ-D1-04 keeps the ChemicalForm / material-level patent request open" }
  - { type: CONCERNS, module: D1, from: D8.RegulatoryRecord, to: "D1.ChemicalSubstance | D1.IngredientMaterial", questions: [], direction: OUT, owner: other, status: accepted, ruling: R-72, note: "union RegulatoryRecordTopic = ChemicalSubstance | IngredientMaterial | Product | Lot (4; Device removed, R-72), AssertedRecordedProperties: determinations, warning letters, NDI notifications; serves D8 questions (Q-D1-18 reads STATUS_OF, not this edge)" }
  - { type: STATUS_OF, module: D1, from: D8.LegalStatus, to: "D1.ChemicalSubstance | D1.IngredientMaterial", questions: [Q-D1-18], direction: OUT, owner: other, status: accepted, ruling: R-72, note: "union LegalStatusSubject = ChemicalSubstance | IngredientMaterial | Product | Patent (4; Device removed, R-72), AssertedEdgeProperties episode (NMN: EXCLUDED_FROM_DEFINITION and its successor)" }
  - { type: MEASURES_ANALYTE, module: D1, from: D8.QualityResult, to: "D1.ChemicalSubstance | D1.IngredientMaterial | D1.Constituent", questions: [], direction: OUT, owner: other, status: accepted, ruling: "R-07, R-73", note: "union QualityAnalyte (3), AssertedRecordedProperties; kept (R-07; recorded as a first demotion candidate); a lot-identified measurement is a D8 QualityResult (resultFor typed Lot), never MATERIAL_CONTAINS or a D1 predicate (R-73); Taxon is not added to QualityAnalyte (R-73); serves D8 questions (Q-D1-09's pattern reads MEASURED_CONTENT_IN_PRODUCT Assertions)" }
  # ---- kernel-meaning and kernel edges onto D1 types (through K.Subjectable) ----
  - { type: MENTIONS, module: D1, from: D9.Chunk, to: "K.Subjectable (ChemicalSubstance, IngredientMaterial, Constituent, Taxon)", questions: [Q-D1-08], direction: OUT, owner: other, status: accepted, ruling: "R-27, R-94", note: "kernel meaning, derived (DerivedEdgeProperties), declared on D9 Chunk.mentions against Subjectable; licensed by its entity-link/vN derivationRule; a RESOLUTION Assessment only when a binding rests on the surface form (R-27); never evidence; costs D1 nothing" }
  - { type: COVERS_LOCATOR, module: D1, from: D9.Chunk, to: K.SourceLocator, questions: [Q-D1-08], direction: OUT, owner: other, status: accepted, ruling: R-27, note: "derived span-overlap/v1; the chunk → locator hop of the 00-DIRECTIVE 3.8 path (fixture nr-trial-unstructured); never support: answers cite HAS_EVIDENCE; CHUNK_OF → SourceSnapshot" }
  - { type: ASSESSES, module: D1, from: K.Assessment, to: "K.Subjectable (ChemicalSubstance, IngredientMaterial, Constituent, Taxon)", questions: [Q-D1-06, Q-D1-07, CQ-ID-06, Q-D1-08, Q-D1-12, Q-D1-15, Q-D1-27, Q-D1-28], direction: OUT, owner: other, status: accepted, ruling: none, note: "kernel meaning: EQUIVALENCE (subkinds D1.identity-level.*), RESOLUTION, APPLICABILITY (D1.dose-mass-basis, D1.form-transfer), SAFETY_SIGNAL (D5 kind, effectDirection HARM); subkinds and facets in final/vocabularies/assessment-vocabularies.yaml (R-54)" }
  - { type: ASSESSES, module: D1, from: "K.Report | D10.ReportItem", to: "K.Subjectable (ChemicalSubstance, IngredientMaterial, Constituent)", questions: [Q-D1-19], direction: OUT, owner: other, status: accepted, ruling: "R-50, R-85", note: "published comparison (reportKind COMPARISON) of forms/products by derived amount; D10 method; Q-D1-19 is retrieved with a published variant (R-50); EXCEEDS_DOSE_THRESHOLD is written only inside such a published Report (R-85)" }
  - { type: HAS_IDENTIFIER, module: D1, from: K.Identifier, to: "K.Subjectable (ChemicalSubstance, IngredientMaterial, Constituent, Taxon)", questions: [CQ-ID-04, Q-D1-06, Q-D1-15, Q-D1-26], direction: IN, owner: other, status: accepted, ruling: R-42, note: "kernel IdentifierLinkProperties episode; one (scheme, issuer, normalized value) identifies at most one Subjectable (R-42); schemes in D1.node.yaml; requested schemes have status requested in final/vocabularies/identifier-schemes.yaml (OQ-D1-07)" }

predicateSeams:
  # Assertion.predicate values D1 patterns or fixtures read or write that cross a module boundary (R-94); `registrar` per
  # R-52 (final/vocabularies/predicates.yaml). D1-registered predicates are listed in D1.relationship.yaml predicateOnly.
  - { predicate: INTENDED_FOR_TARGET, module: D1, registrar: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial], objects: [D5.Target], questions: [Q-D1-23], owner: other, status: accepted, ruling: R-52, note: "D5 seam rule; population qualifier mandatory; no D1 field or property points at a Target; D1 registration removed" }
  - { predicate: IMPROVES_TARGET, module: D1, registrar: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial], objects: [D5.Target], questions: [Q-D1-23], owner: other, status: accepted, ruling: R-52, note: "D5 target predicate; D1 registration removed" }
  - { predicate: WORSENS_TARGET, module: D1, registrar: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial], objects: [D5.Target], questions: [Q-D1-23], owner: other, status: accepted, ruling: R-52, note: "D5 target predicate; D1 registration removed" }
  - { predicate: NO_EFFECT_ON_TARGET, module: D1, registrar: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial], objects: [D5.Target], questions: [Q-D1-23], owner: other, status: accepted, ruling: R-52, note: "D5 target predicate; D1 registration removed" }
  - { predicate: MIXED_EFFECT_ON_TARGET, module: D1, registrar: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial], objects: [D5.Target], questions: [Q-D1-23], owner: other, status: accepted, ruling: R-52, note: "D5 target predicate; D1 registration removed" }
  - { predicate: HAS_UPPER_LIMIT, module: D1, registrar: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial, D1.Constituent], objects: [literal], questions: [Q-D1-03, Q-D1-27], owner: other, status: accepted, ruling: R-85, note: "nutrient thresholds on D1.Constituent (UL 100 mg B6, TGA bands), qualifier limitKind:<UL | MONOGRAPH_MAX | LABEL_MAX | SCHEDULING_THRESHOLD | LABEL_WARNING_THRESHOLD>; Constituent subject and the last two limitKind values added by R-85 (OQ-D1-03 closed). DOSE_THRESHOLD is not used" }
  - { predicate: HAS_AUTHORIZED_DOSE_RANGE, module: D1, registrar: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial, D1.Constituent], objects: [literal], questions: [Q-D1-03, Q-D1-27], owner: other, status: accepted, ruling: R-85, note: "D1.Constituent subject added by R-85" }
  - { predicate: USE_CONSTRAINED_IN, module: D1, registrar: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial, D1.Constituent], objects: [D2.Condition, "none (population-only scope)"], questions: [Q-D1-27], owner: other, status: accepted, ruling: "R-52, R-88", note: "D5 predicate; valueString a ConstraintLevel code; qualifier section=BOXED_WARNING added (R-88)" }
  - { predicate: INTERACTS_WITH, module: D1, registrar: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial, D1.Constituent], objects: ["co-exposure means (D1 / D6 / D12 / D5)"], questions: [Q-D1-27], owner: other, status: accepted, ruling: "R-52, R-85", note: "D5 predicate (subject = affected means); D12.FoodCategory admitted as subject (R-85)" }
  - { predicate: CAUSES_ADVERSE_EFFECT, module: D1, registrar: D5, subjects: [D1.ChemicalSubstance, D1.IngredientMaterial, D1.Constituent], objects: [D2.Condition], questions: [Q-D1-27], owner: other, status: accepted, ruling: R-84, note: "adverse effect = D2 Condition (R-84; REPORTS_ADVERSE_EXPERIENCE retired)" }
  - { predicate: MANUFACTURES, module: D1, registrar: D7, subjects: [D7.Organization], objects: [D1.IngredientMaterial, D6.Product], questions: [Q-D1-16, Q-D1-17], owner: other, status: accepted, ruling: R-68, note: "renamed from D1 MANUFACTURES_MATERIAL (exclusive crystalline-form manufacture); D1 registration removed; D1 fixtures re-key to MANUFACTURES" }
  - { predicate: SUPPLIES_MATERIAL, module: D1, registrar: D7, subjects: [D7.Organization], objects: [D1.IngredientMaterial], questions: [Q-D1-17], owner: other, status: accepted, ruling: R-68, note: "qualifiers exclusivity=SOLE|NON_EXCLUSIVE|UNSTATED and buyer=; fixture nr-salt-moiety-us-canada p02 (10-K: single supplier W.R. Grace for NRC); D1 registration removed; D7's SUPPLIED_BY row (IngredientMaterial → Organization) is the same relation reversed and stays undeclared (OQ-D1-31)" }
  - { predicate: MARKETED_UNDER_MARK, module: D1, registrar: D1, subjects: [D1.IngredientMaterial], objects: [D7.Organization, literal], questions: [Q-D1-16], owner: this, status: accepted, ruling: R-52, note: "D1 predicate; D8 Trademark is deferred in D8 05, so the object is the mark owner or the mark as a literal" }
  - { predicate: MEASURED_CONTENT_IN_PRODUCT, module: D1, registrar: D1, subjects: [D6.Product, D6.ProductVariant], objects: [D1.ChemicalSubstance], questions: [Q-D1-09], owner: this, status: accepted, ruling: R-73, note: "analytical-survey rows that name no lot (subject Product | ProductVariant; D8.Lot removed); lot-identified results are D8 QualityResult MEASURES_ANALYTE; unfixtured (OQ-D1-30)" }
  - { predicate: CONTAINS_UNDECLARED_SUBSTANCE, module: D1, registrar: D1, subjects: [D6.Product, D6.ProductVariant], objects: [D1.ChemicalSubstance], questions: [Q-D1-10], owner: this, status: accepted, ruling: R-73, note: "survey rows that name no lot; an undeclared drug is also a D8 record with violationCategory UNDECLARED_DRUG_INGREDIENT; unfixtured (OQ-D1-30)" }
  - { predicate: MOIETY_EQUIVALENT_AMOUNT, module: D1, registrar: D1, subjects: [D6.LabelVersion, D3.InterventionComponent], objects: [D1.ChemicalSubstance], questions: [CQ-PF-01, Q-D1-02, Q-D1-05, Q-D1-24], owner: this, status: accepted, ruling: none, note: "CALCULATED (COMPUTATION) Assertion written by the D1 PROJECTION Activity (d1-amounts/v1), rule:mw-ratio.v1, DERIVED_FROM inputs (the D6 line's own DECLARES_COMPONENT Assertion, MW fields, HAS_ACTIVE_MOIETY assertion); never an edge" }
  - { predicate: NUTRIENT_EQUIVALENT_AMOUNT, module: D1, registrar: D1, subjects: [D6.LabelVersion, D3.InterventionComponent], objects: [D1.Constituent], questions: [CQ-PF-01, Q-D1-02, Q-D1-19], owner: this, status: accepted, ruling: none, note: "CALCULATED, rule:nutrient-equivalent.v1, cites the NUTRIENT_EXPRESSED_AS Assertion; never an edge" }
  - { predicate: PER_MAX_DAILY_DOSE_AMOUNT, module: D1, registrar: D1, subjects: [D6.LabelVersion, D3.InterventionComponent], objects: [D1.ChemicalSubstance, D1.Constituent], questions: [Q-D1-02, Q-D1-03, Q-D1-19], owner: this, status: accepted, ruling: R-85, note: "CALCULATED, rule:daily-max.v1; the materialized daily amount that query-time threshold screens read (R-85)" }
  - { predicate: DECLARATION_STOICHIOMETRY_CHECK, module: D1, registrar: D1, subjects: [D6.LabelVersion, D3.InterventionComponent], objects: [D1.ChemicalSubstance, D1.Constituent], questions: [Q-D1-20], owner: this, status: accepted, ruling: none, note: "CALCULATED check (valueBoolean + residual); never a fraud finding" }
  - { predicate: EXCEEDS_DOSE_THRESHOLD, module: D1, registrar: D1, subjects: [D6.LabelVersion, D3.InterventionComponent], objects: [D1.ChemicalSubstance, D1.Constituent], questions: [Q-D1-03], owner: this, status: accepted, ruling: R-85, note: "report-only: not stored as a graph Assertion; computed at query time (Q-D1-03 retrieved, R-50) and written only inside a published Report; threshold from D5 HAS_UPPER_LIMIT, rule:threshold-compare.v1 (D5)" }
  - { predicate: NUTRIENT_EXPRESSED_AS, module: D1, registrar: D1, subjects: [D1.Constituent], objects: [D1.ChemicalSubstance], questions: [Q-D1-02, Q-D1-19, Q-D1-20], owner: this, status: accepted, ruling: none, note: "D1-internal predicate read by the projection (jurisdiction qualifier, valid time on the Assertion)" }
  - { predicate: SOURCED_FROM_COUNTRY, module: D1, registrar: D1, subjects: [D1.IngredientMaterial], objects: [literal], questions: [], owner: this, status: accepted, ruling: R-52, note: "material origin; registered by D1 at D6's request (OQ-D6-27); D6 fixture recall-moringa-mogo e17 keeps the name" }
  - { predicate: ADMINISTERED_MATERIAL_PURITY, module: D1, registrar: D3, subjects: [D3.InterventionComponent], objects: [literal], questions: [Q-D1-08, CQ-ID-06], owner: other, status: accepted, ruling: R-52, note: "FIELD Assertion on the D3 component (purity of the batch as administered, e.g. 99 % NR chloride); registered by D3 (OQ-D1-35 closed)" }
  - { predicate: FORMS_DURING_PREPARATION, module: D1, registrar: D12, subjects: [D1.ChemicalSubstance], objects: [D12.FoodItem, D12.FoodCategory], questions: [Q-D1-22], owner: other, status: accepted, ruling: none, note: "D12 predicate-only seam" }
  - { predicate: PREPARATION_CHANGES_CONTENT, module: D1, registrar: D12, subjects: [D12.FoodItem], objects: [D1.ChemicalSubstance, D1.Constituent], questions: [Q-D1-22], owner: other, status: accepted, ruling: none, note: "D12 predicate-only seam" }
  - { predicate: FOOD_FROM_TAXON, module: D1, registrar: D12, subjects: [D12.FoodItem], objects: [D1.Taxon], questions: [Q-D1-22], owner: other, status: accepted, ruling: "R-53, R-94", note: "food → source taxon; renamed from DERIVED_FROM_TAXON, which is D1's typed IngredientMaterial → Taxon edge (no predicateOnly value equals a relationship type name)" }
  - { predicate: EVENT_ABOUT, module: D1, registrar: D13, subjects: [D13.Event], objects: [D1.ChemicalSubstance], questions: [Q-D1-18], owner: other, status: accepted, ruling: R-94, note: "D13 predicate-only; D13 seams name D1.ChemicalSubstance (R-94 verified); compounds reach a frontier only through events and studies (R-91)" }
  - { predicate: SAMPLE_TESTED_POSITIVE_FOR, module: D1, registrar: D8, subjects: [D6.Product, D8.Lot], objects: [D1.Taxon], questions: [], owner: other, status: accepted, ruling: R-73, note: "added in synthesis: agency-reported sample positive for a strain (D6 recall-moringa-mogo); serves D6/D8 questions" }
  - { predicate: HAS_APPROVED_INDICATION, module: D1, registrar: D8, subjects: [D6.Product, D1.ChemicalSubstance], objects: [D2.Condition], questions: [], owner: other, status: accepted, ruling: R-88, note: "added in synthesis; serves D8 questions" }
  - { predicate: HAS_ACTION_LEVEL, module: D1, registrar: D8, subjects: [D1.ChemicalSubstance], objects: [D12.FoodCategory, D12.FoodItem], questions: [], owner: other, status: accepted, ruling: R-93, note: "added in synthesis: valueNumber + unitCode; qualifiers status=PROPOSED|ADOPTED, jurisdiction, basis; asserted by the regulator; serves D12 questions (Q-D12-06, Q-D12-18)" }

facetSeams:
  # Assessment facets on D1 types registered in final/vocabularies/assessment-vocabularies.yaml (R-54); not predicates.
  - { facet: "plantPart=<D1 PlantPart>", module: D1, assessment: "K.Assessment SAFETY_SIGNAL (D5 kind)", targets: [D1.Taxon, D1.IngredientMaterial, D1.ChemicalSubstance], questions: [Q-D1-12], owner: other, status: accepted, ruling: R-54, note: "restricts a D5 safety signal to a plant part; a signal without it applies to every part; fixture ashwagandha-plant-part-harm s03 (plantPart=LEAF); OQ-D1-33 closed by registration" }

sharedVocabularies:
  - name: targets
    owner: D5
    file: final/vocabularies/targets.yaml
    version: "0.2.2"
    use: "objects of target-effect Assertions about D1 substances and materials (Q-D1-23). No D1 typed edge or property points at a Target (pin R-60)."
  - name: frontiers
    owner: D13
    file: final/vocabularies/frontiers.yaml
