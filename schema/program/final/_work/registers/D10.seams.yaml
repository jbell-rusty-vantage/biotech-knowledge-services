version: 1
module: D10
# Source: packets/D10/10-seams.yaml (sha256 a8f2c0bc…), edited by the S module editor for D10 on 2026-10-08 per
# final/decision-report.md and final/_work/rulings.yaml (global, modules.D10). Every entry keeps the 01-PACKET-CONTRACT
# fields (type, from, to, questions, direction, owner), adds `module: D10` and `status: accepted | cut` with the ruling
# that decides it. Names are the final names (type names checked against final/schema/kernel.graphql and the owners'
# 04 SDL on 2026-10-08). Synthesis edits:
#   R-94  relationship seams (`seams`) and Assertion.predicate seams (`predicateSeams`, checked against the R-52
#         registry) are separate lists; ASSOCIATES -> D12.FoodItem and the Q-D12-20 citation dropped (OQ-D12-29);
#         "CONCERNS / ADDRESSED_TO" split into one row per relationship type (both declared by D8).
#   R-75  BLOCKED_BY -> D5.UseConstraint | K.Assessment confirmed; D5 changes its seam and drops `K.Report ASSESSES
#         D5.UseConstraint`.
#   R-47  ASSOCIATES note: AFFECTS_MECHANISM stays a D2 unscored shortcut; Q-D2-18 ranks on Associations.
#   R-50  ASSOCIATES note: Q-D7-22 is retrieved, not materialized (no Association hosted for it).
#   R-60  vocabulary pins targets@0.2.2, frontiers@0.2.1, paths under final/vocabularies/; DecisionCriterion.targetKeys
#         is the acknowledged property exception (OQ-D5-47).
#   R-46  publisherUid property join is a cache; the authority path is the authorizing Assertion's ASSERTED_BY.
#   R-83  recommendation predicates registered by D9; D10's guideline branches read D5 target predicates.
# Kernel allowlist (final kernel): Entity, Subjectable, Assertion, Source, SourceSnapshot, SourceLocator, Adjudication,
# Activity, Agent, Identifier, AssertedEdgeProperties, AssertedRecordedProperties, DerivedEdgeProperties,
# StructuralEdgeProperties (Mention and StateEpisodeProperties removed, R-09, R-10). Section 2 lists the implicit
# seams: other modules' types D10 reaches only through the kernel Subjectable pattern or through a property join.
seams:
  # ---- 1. Kernel types outside the allowlist, and other modules' types, that D10 fields target
  - type: HAS_ITEM
    module: D10
    from: K.Report
    to: D10.ReportItem
    declaredOn: D10.ReportItem.report (direction IN)
    questions: [CQ-AX-01, CQ-RC-01, Q-D10-02, Q-D10-14]
    direction: K.Report -> D10.ReportItem
    owner: this
    status: accepted
    ruling: R-94
    note: "recorded on both sides (K seams row HAS_ITEM K.Report -> D10.ReportItem)"
  - type: USES_CRITERION
    module: D10
    from: K.Report
    to: D10.DecisionCriterion
    declaredOn: D10.DecisionCriterion.usedByReports (direction IN)
    questions: [CQ-RC-01, CQ-RC-02, CQ-RC-07, Q-D10-02]
    direction: K.Report -> D10.DecisionCriterion
    owner: this
    status: accepted
    ruling: R-94
    note: "recorded on both sides (K seams row); PolicyVersion stays a string (R-33)"
  - type: DERIVED_FROM
    module: D10
    from: D10.ReportItem
    to: K.Assessment
    declaredOn: D10.ReportItem.citesAssessments
    questions: [CQ-AX-11, CQ-RC-02, Q-D10-13, Q-D10-16]
    direction: D10.ReportItem -> K.Assessment
    owner: this
    status: accepted
    ruling: R-11
    note: "kernel relationship type used with kernel meaning (declaredBy K, D10); DERIVED_FROM -> Assertion (allowlisted) is internal; ReportItem -> D10.Association stays cut (R-48)"
  - type: BLOCKED_BY
    module: D10
    from: D10.ReportItem
    to: K.Assessment
    declaredOn: D10.ReportItem.blockedByAssessments
    questions: [CQ-RC-06, Q-D10-08]
    direction: D10.ReportItem -> K.Assessment
    owner: this
    status: accepted
    ruling: R-75
    note: "the blocking Assessment is typically a D5 interaction-risk assessment (assessmentSubkind D5.*) or a D10 harm-causality assessment, used when no source states a use concern; a citation set, structural (R-26)"
  - type: BLOCKED_BY
    module: D10
    from: D10.ReportItem
    to: D5.UseConstraint
    declaredOn: D10.ReportItem.blockedBy
    questions: [CQ-RC-06, Q-D10-08]
    direction: D10.ReportItem -> D5.UseConstraint
    owner: this
    status: accepted
    ruling: R-75
    note: "D5's shared blocking identity; trace UseConstraint <- RESOLVES_TO_CONSTRAINT (D5, derived; never feeds adjudication, R-29) <- Assertion -> HAS_EVIDENCE -> locator; the row cites the resolving Assertion through DERIVED_FROM. R-75: D5 reverses OQ-D5-39, changes its seam to BLOCKED_BY -> D5.UseConstraint (owner other) and deletes `K.Report ASSESSES D5.UseConstraint`. UseConstraint is not a Claim (R-76)"
  - type: ASSESSES
    module: D10
    from: D10.ReportItem
    to: K.Subjectable
    declaredOn: D10.ReportItem.about
    questions: [CQ-RC-01, CQ-RC-06, Q-D10-02, Q-D10-16]
    direction: D10.ReportItem -> Subjectable
    owner: this
    status: accepted
    ruling: R-53
    note: "kernel relationship type with kernel meaning (declaredBy K, D10; one meaning, no properties); K seams row ASSESSES D10.ReportItem -> K.Subjectable"

  # ---- 2. Implicit seams (no D10 field; reached through kernel Subjectable edges or property joins)
  - type: ASSESSES
    module: D10
    from: K.Report | K.Assessment | D10.ReportItem
    to: D5.Target
    via: kernel ASSESSES → Subjectable (Target implements Subjectable)
    questions: [Q-D10-01, Q-D10-03, Q-D10-08, CQ-RC-01]
    direction: out
    owner: other
    status: accepted
    ruling: R-83
    note: "'for target T' on a comparison, profile or harm assessment; no means → Target edge; D10 never declares FOR_TARGET; a recommendation's subject is the means, never a Target (goal in qualifier target:<key>, R-83); node name Target kept (R-61)"
  - type: ASSESSES
    module: D10
    from: D10.ReportItem
    to: [D1.ChemicalSubstance, D1.IngredientMaterial, D6.Product, D5.Intervention, D5.ProtocolStep, D12.FoodItem, D4.Device, D4.LabTest]
    via: kernel ASSESSES → Subjectable
    questions: [CQ-RC-01, CQ-RC-06, Q-D10-02, Q-D10-16]
    direction: out
    owner: other
    status: accepted
    ruling: R-53
    note: "the options a comparison row or protocol-review section is about (a ROW ASSESSES exactly its option); type names from the owners' SDL on 2026-10-08 (D1 has no Compound / IngredientForm; D4 has no PanelDefinition, a panel is a LabTest, verified R-94)"
  - type: ASSOCIATES
    module: D10
    from: D10.Association
    to: [D1.ChemicalSubstance, D1.IngredientMaterial, D2.Outcome, D2.Mechanism, D2.Condition, D2.MolecularEntity, D4.Biomarker, D5.Target, D5.Intervention, D7.Organization, D7.Person]
    via: Subjectable interface target (derived)
    questions: [Q-D10-05, Q-D10-06, Q-D10-19]
    direction: out
    owner: this
    status: accepted
    ruling: R-28
    note: "one of the two registered domain edges to Subjectable (K interface docstring); BellLabs-computed projections only; no score on the edge (R-48). Hosts the scored mechanism -> outcome / condition projections D2 handed over when it cut INFLUENCES_OUTCOME, and Q-D2-18's ranking (EVIDENCE_AGGREGATE, one per modulator × mechanism); D2's AFFECTS_MECHANISM stays an unscored traversal shortcut (R-47). Sibling projections it can host if materialized: D5 Q-D5-19 (intervention co-occurrence, d5-stack-cooccurrence/v1, members D5.Intervention; answers OQ-D5-21), D2 Q-D2-19, D7 Q-D7-23 (tie leads). Q-D7-22 is retrieved (R-50) and Q-D4-25 streams GDS results; neither writes an Association"
  - type: ASSOCIATES
    module: D10
    from: D10.Association
    to: D12.FoodItem
    via: Subjectable interface target (derived)
    questions: [Q-D12-20]
    direction: out
    owner: this
    status: cut
    ruling: R-94
    note: "dropped with the Q-D12-20 citation (OQ-D12-29): Q-D12-20 streams GDS results and writes nothing"
  - type: CONCERNS
    module: D10
    from: D8.RegulatoryRecord
    to: D6.Product
    via: D8 asserted edge (D8 RegulatoryRecord.concerns → union RegulatoryRecordTopic), read by Q-D10-25 (enforcement records about a compared product)
    questions: [Q-D10-25]
    direction: out
    owner: other
    status: accepted
    ruling: R-94
    note: "added in the adversarial-review stage; D10 declares nothing. Split from the packet row 'CONCERNS / ADDRESSED_TO' (R-94 seam hygiene). Regulatory acts reach a device only through Product -DELIVERS-> Device (R-72). No fixture for Q-D10-25 (packets/D10/11-open-questions #38)"
  - type: ADDRESSED_TO
    module: D10
    from: D8.RegulatoryRecord
    to: D7.Organization
    via: D8 asserted edge (RegulatoryRecord.addressedTo), read by Q-D10-25 (enforcement records addressed to a compared product's maker, maker through the D7-registered predicate MANUFACTURES, R-68)
    questions: [Q-D10-25]
    direction: out
    owner: other
    status: accepted
    ruling: R-94
    note: "split from the packet row 'CONCERNS / ADDRESSED_TO'; D10 declares nothing; no fixture for Q-D10-25 (11 #38)"
  - type: OCCURRENCE_OF
    module: D10
    from: K.Assertion (assertionKind CLAIM, speechAct RECOMMENDS) in D9 containers
    to: K.Claim
    via: kernel claim-occurrence pattern; container from OCCURS_IN (R-19, R-94); speakers D9; interest D7
    questions: [Q-D10-04, Q-D10-21, Q-D10-23, CQ-RC-05]
    direction: out
    owner: other
    status: accepted
    ruling: R-83
    note: "recommendations by people and company claims (predicates RECOMMENDS_USE / RECOMMENDS_AGAINST, registered by D9); D10 reads them, never stores RECOMMENDS. A multi-author work asserts in its own voice (R-15)"
  - type: ON_FRONTIER
    module: D10
    from: D13.Event | D3.Study
    to: D13.Frontier
    via: D13 asserted classification edge (basis CURATOR_CLASSIFICATION, R-25)
    questions: [Q-D10-20, Q-D10-22]
    direction: out
    owner: other
    status: accepted
    ruling: R-91
    note: "frontier-scoped rankings and clusters filter through D13's ON_FRONTIER; only Event and Study attach to Frontier (R-91); D10 declares nothing"

  # ---- added by the S integrator 2026-10-09 (contract rule 8): DERIVED_FROM -> K.Assertion was treated as internal
  #      ("allowlisted") but Assertion is a kernel type; K.seams.yaml rows 36 and 38 list both pairs.
  - { type: DERIVED_FROM, module: D10, from: D10.ReportItem, to: K.Assertion, declaredOn: D10.ReportItem.citesAssertions, questions: [CQ-AX-01, CQ-RC-02, Q-D10-13, Q-D10-16], direction: OUT, owner: this, status: accepted, ruling: "R-11; integration (decision-report I-01)", note: "kernel relationship type with kernel meaning (declaredBy K, D10); counted once in K (R-01)" }
  - { type: DERIVED_FROM, module: D10, from: D10.Association, to: K.Assertion, declaredOn: D10.Association.inputs, questions: [CQ-AX-08, Q-D10-05], direction: OUT, owner: this, status: accepted, ruling: "R-48; integration (decision-report I-01)", note: "an Association's inputs; > 5,000 inputs keep only inputSetDigest" }

predicateSeams:
  # Assertion.predicate values the D10 patterns read that another module registers (R-94; registrar per R-52).
  - { predicate: RECOMMENDS_USE, module: D10, registrar: D9, questions: [Q-D10-03, Q-D10-08, Q-D10-21], owner: other, status: accepted, ruling: R-83, note: "replaces D10's RECOMMENDS_FOR (merged); subject = the recommended means, goal in qualifier target:<key>" }
  - { predicate: RECOMMENDS_AGAINST, module: D10, registrar: D9, questions: [Q-D10-07], owner: other, status: accepted, ruling: R-83, note: "D10's registration dropped; subject = the means, never a Target object; Q-D10-07 lists it with grades (packets/D10/03 line 424). Q-D10-08's 'recommend against' branch moves to WORSENS_TARGET | NO_EFFECT_ON_TARGET / USE_CONSTRAINED_IN (03 line 453 is to be rewritten)" }
  - { predicate: WORSENS_TARGET, module: D10, registrar: D5, questions: [Q-D10-03, Q-D10-08], owner: other, status: accepted, ruling: R-83, note: "guideline branch with speechAct CAUTIONS | RECOMMENDS; registrar D5 (R-52)" }
  - { predicate: NO_EFFECT_ON_TARGET, module: D10, registrar: D5, questions: [Q-D10-03, Q-D10-08], owner: other, status: accepted, ruling: R-83, note: "guideline branch with speechAct CAUTIONS | RECOMMENDS; registrar D5 (R-52)" }
  - { predicate: USE_CONSTRAINED_IN, module: D10, registrar: D5, questions: [Q-D10-08, CQ-RC-06], owner: other, status: accepted, ruling: R-83, note: "population guidance; resolves to D5.UseConstraint (fixture livertox-green-tea-extract-harm, level AVOID)" }
  - { predicate: HAS_UPPER_LIMIT, module: D10, registrar: D5, questions: [CQ-RC-06], owner: other, status: accepted, ruling: R-52, note: "blocking upper limit read by BLOCK criteria (fixture mg-rankings-criteria-comparison)" }
  - { predicate: IMPROVES_TARGET, module: D10, registrar: D5, questions: [Q-D10-01], owner: other, status: accepted, ruling: R-52, note: "candidate set of a ranking for target T; criteria inputPredicates" }
  - { predicate: INTENDED_FOR_TARGET, module: D10, registrar: D5, questions: [Q-D10-01], owner: other, status: accepted, ruling: R-52, note: "candidate set of a ranking for target T" }
  - { predicate: MANUFACTURES, module: D10, registrar: D7, questions: [Q-D10-25], owner: other, status: accepted, ruling: R-68, note: "Organization -> D6.Product; the packet pattern names it D6's (03 line 829); registrar is D7 after R-68" }

sharedVocabularies:
  propertyJoins:   # not relationships; listed so the synthesizer sees the dependency
    - { from: D10.DecisionCriterion.publisherUid, to: D7.Organization.uid, questions: [Q-D10-10], status: accepted, ruling: R-46, note: "cache only; the authority is the criterion set's authorizing Assertion ASSERTED_BY the publisher (third-party) or WAS_GENERATED_BY the BellLabs Activity (our own); its commercial interest is read through D7 (stake / role edges)" }
  targets: final/vocabularies/targets.yaml@0.2.2      # DecisionCriterion.targetKeys (acknowledged property exception, OQ-D5-47); Report/Assessment ASSESSES Target; predicates IMPROVES_TARGET … read by criteria (R-60)
  frontiers: final/vocabularies/frontiers.yaml@0.2.1  # Q-D10-20, Q-D10-22 scope by frontier key (R-60)
  identifierSchemes: final/vocabularies/identifier-schemes.yaml   # D10 types carry no external identifiers; listed for completeness
  predicates: final/vocabularies/predicates.yaml      # R-52 registry: D10 predicateOnly entries (registrar D10) and the predicateSeams above
  assessmentVocabularies: final/vocabularies/assessment-vocabularies.yaml   # R-54; D10.strength subkind; input:<uid>= facets (R-34)
  verificationVerdicts: "K SemanticVerdict (verification.v1 lattice) on Report.verdict and Assessment.verdict; plus worldCorrectness, no new enum (R-32); third-party ratings map to the lattice by a versioned D10 query-time rule, never stored (R-31)"
  kernelEnums: [EffectDirection, ReportKind, AssessmentKind, SemanticVerdict, PolicyOutcome]   # read in patterns; not used as D10 property types
  kernelEnumsAsPropertyTypes: [PrivacyClass]   # the Entity-contract field privacyClass on DecisionCriterion, ReportItem and Association
