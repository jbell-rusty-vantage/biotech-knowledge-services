version: 1
module: D8
# Source: packets/D8/05-relationship-register.yaml (sha256 9e70e086…), edited by the S module editor for D8 2026-10-08 per
# final/decision-report.md and final/_work/rulings.yaml (global, modules.D8). Every entry keeps the 01-PACKET-CONTRACT fields
# and adds `module: D8`; fixtures point at final/fixtures/D8/<folder>. Synthesis edits:
#   R-72  CONCERNS and STATUS_OF lose the D4.Device member; a device act concerns / is the standing of the D6 Product that
#         DELIVERS the D4 Device (Q-D8-23).
#   R-73  QUALITY_RESULT_FOR -> D6.Product and CONCERNS Patent -> D1.IngredientMaterial cut (no fixture): QUALITY_RESULT_FOR
#         targets Lot, Patent CONCERNS targets D1.ChemicalSubstance. COVERS -> D6.ProductVariant (CQ-PF-03a, v1) and
#         STATUS_OF -> D6.Product (CQ-MF-02, v1) kept with fixture requests (`fixtureRequest`, final/requests.md).
#         SAMPLE_TESTED_POSITIVE_FOR registered here (subject D6.Product | Lot, object D1.Taxon).
#   R-07  ASSIGNED_TO, LICENSED_TO and MEASURES_ANALYTE recorded as first demotion candidates (`demotionCandidate`).
#   R-08  CQ-PF-03 -> CQ-PF-03a (D8's half: what a certification covers; v1, retrieved).
#   R-52  one predicate registry, no module prefix: the D8.<FIELD> literal predicates drop `D8.`; every predicateOnly row
#         names its registrar. Removed (registered elsewhere, read through D8.seams.yaml predicateSeams): RATES_CLAIM (K),
#         INTENDED_FOR_TARGET (D5).
#   R-68  removed MANUFACTURES, CONTRACT_MANUFACTURES_FOR, DISTRIBUTES (registrar D7); SUPPLIES_INGREDIENT and
#         EXCLUSIVE_SUPPLIER_OF -> D7 SUPPLIES_MATERIAL (EXCLUSIVE_SUPPLIER_OF = qualifier exclusivity=SOLE).
#   R-88  HAS_APPROVED_INDICATION: subject D6.Product | D1.ChemicalSubstance, object D2.Condition; registrar D8.
#   R-93  HAS_ACTION_LEVEL and HAS_CLAIM_CONDITION registered here (predicate-only).
#   R-53  checked: no predicateOnly value equals a relationship type name in any packet SDL or final/schema/kernel.graphql.
# Counts after synthesis (measured, final/_runlog/module-D8.md): 11 relationship types, 25 from→to pairs, widest union 4.
# MODEL stage, A7, 2026-10-08. 11 relationship types, 29 from→to pairs (union members counted), widest union 5.
# Every edge is asserted (one authorizing kernel Assertion per episode). Episodes (valid time declared,
# AssertedEdgeProperties) matter on STATUS_OF, COVERS, ASSIGNED_TO and LICENSED_TO; every other edge links two immutable
# records and carries recorded time only (kernel AssertedRecordedProperties, K change 1 / M10, adopted in the check stage
# 2026-10-08; any valid time the source states stays on the authorizing Assertion). Tool ids in populatedBy are rows of
# 08-sources-and-tools.md.
# Adversarial-review revision (2026-10-08): RESULT_FOR -> QUALITY_RESULT_FOR (D3 declares RESULT_FOR with another meaning;
# K: relationship names are unique to a module); D4.Device replaces Patent in CONCERNS' record-topic union and joins
# STATUS_OF; Organization leaves COVERS; every `questions` list now names only questions whose 03 pattern traverses the edge.
relationships:
  - type: ISSUED_BY
    module: D8
    class: asserted
    from: [RegulatoryRecord, QualityResult, CertificationListing]
    to: D7.Organization
    edgeProperties: AssertedRecordedProperties
    cardinality: exactly_one per RegulatoryRecord and CertificationListing; zero_or_one per QualityResult (a COA can name no issuer, OQ-D8-22)
    temporal: recorded-only
    questions: [CQ-MF-02, Q-D8-02, CQ-PF-03a, Q-D8-05, Q-D8-06, Q-D8-12, Q-D8-22, CQ-AX-19]
    pattern: 03#Q-D8-02
    populatedBy: [fda-web-pages, openfda-food-enforcement, fda-gras-inventory, regulations-gov-api, eurlex, health-canada-lnhpd, cafc-opinions, coa-pdf, certification-databases]
    fixture: final/fixtures/D8/imu-tek-warning-letter-recall
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      One accountable issuer per record (regulator, court, laboratory, certifier). Replaces the pinned RegulatoryAgency and
      TestingLaboratory node types and COA_ISSUED_BY / PERFORMED_BY_LAB / CONDUCTED_BY. A string issuer code would filter but
      not join: Q-D8-06 must reach the tester's financial interest (D7) and Q-D8-22 dedupes on the issuer's uid.
  - type: ADDRESSED_TO
    module: D8
    class: asserted
    from: RegulatoryRecord
    to: D7.Organization
    edgeProperties: AssertedRecordedProperties
    cardinality: one_or_more
    temporal: recorded-only
    questions: [Q-D8-02, Q-D8-03, Q-D8-17, CQ-EC-01, CQ-MF-06]
    pattern: 03#Q-D8-03
    populatedBy: [fda-web-pages, openfda-food-enforcement, regulations-gov-api, fda-gras-inventory, cafc-opinions, eurlex]
    fixture: final/fixtures/D8/imu-tek-warning-letter-recall
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      The party the act is addressed to (notifier, applicant, petitioner, licence holder, warned or recalling firm, litigant).
      Kept apart from CONCERNS because "which firms received warning letters" (Q-D8-02) and the firm's enforcement chain
      (Q-D8-03) filter on the addressee without returning products; Organization as a CONCERNS member would mix the two
      readings. (K change 2 would allow a role property on one edge; two types on one recorded-only base need no extra
      edge-property type.) Replaces SUBMITTED_BY.
  - type: CONCERNS
    module: D8
    class: asserted
    from: [RegulatoryRecord, Patent]
    to: [D1.ChemicalSubstance, D1.IngredientMaterial, D6.Product, Lot]
    edgeProperties: AssertedRecordedProperties
    cardinality: many (RegulatoryRecord -> union RegulatoryRecordTopic, 4 members; Patent -> D1.ChemicalSubstance only, R-73)
    temporal: recorded-only
    questions: [Q-D8-02, Q-D8-04, Q-D8-10, Q-D8-11, Q-D8-13, Q-D8-16, Q-D8-17, Q-D8-18, Q-D8-19, Q-D8-23, CQ-EC-01]
    pattern: 03#Q-D8-04
    populatedBy: [openfda-food-enforcement, fda-web-pages, regulations-gov-api, fda-gras-inventory, eurlex, health-canada-lnhpd, cafc-opinions, google-patents]
    fixture: final/fixtures/D8/imu-tek-warning-letter-recall
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      What a record or a patent is about. RegulatoryRecord → union RegulatoryRecordTopic (4: substance, ingredient material,
      product, lot); Patent → D1.ChemicalSubstance (union PatentTopic removed, R-73: the ingredient-material member had no
      fixture; fixture us8197807's CONCERNS object is a ChemicalSubstance), topical only — claim coverage is an
      APPLICABILITY assessment. One type for both because the meaning ("is about") is the same; replaces SUBMISSION_ABOUT,
      INSPECTED_FACILITY's product side, the recall→product/lot links and LICENSE_COVERS' topical half. Patent left the
      record-topic union in the adversarial review (Q-D8-12 reaches the court record through STATUS_OF / STATUS_FROM). The
      D4.Device member added then is removed in synthesis (R-72; no fixture writes CONCERNS → Device): a device recall
      concerns the D6 Product, which DELIVERS the D4 Device (D4 fixture noninvasive-glucose-cgm-recall reaches the Device
      through Product), so Q-D8-23 and D4 Q-D4-08 read RegulatoryRecord -CONCERNS-> Product -DELIVERS-> Device.
  - type: STATUS_OF
    module: D8
    class: asserted
    from: LegalStatus
    to: [D1.ChemicalSubstance, D1.IngredientMaterial, D6.Product, Patent]
    edgeProperties: AssertedEdgeProperties
    cardinality: exactly_one subject per status; many episodes
    temporal: episode
    questions: [CQ-MF-02, Q-D8-01, CQ-AX-23, CQ-PF-04, Q-D8-12, Q-D8-13, Q-D8-14, Q-D8-18, Q-D8-20, Q-D8-23]
    pattern: 03#Q-D8-01
    populatedBy: [regulations-gov-api, fda-gras-inventory, eurlex, health-canada-lnhpd, openfda-drugsfda, cafc-opinions]
    fixture: final/fixtures/D8/nmn-us-exclusion-reversal
    fixtureRequest: { id: RQ-03, pair: LegalStatus -> D6.Product, question: CQ-MF-02, item: "LNHPD NPN licence (Health Canada) as STATUS_OF a Product", ruling: R-73, file: final/requests.md }
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      The as-of edge. Standing changes (NMN excluded 2022-10-11 → not excluded 2025-09-29; EU data protection ended
      2025-02-20; claims held invalid 2023-02-13), and "what would the graph have said on date D as recorded then" (Q-D8-01)
      needs valid and recorded time on this edge. Replaces HAS_REGULATORY_STATUS, STATUS_OF (W13) and IP_STATUS_OF. A 510(k)
      clearance or De Novo / PMA authorisation as of date D is STATUS_OF the D6 Product that DELIVERS the D4 Device (R-72;
      Q-D8-23, D4 Q-D4-10); the Device member is removed. The D6.Product member is kept for CQ-MF-02 (v1) with a fixture
      request (LNHPD NPN licence, R-73).
  - type: STATUS_FROM
    module: D8
    class: asserted
    from: LegalStatus
    to: RegulatoryRecord
    edgeProperties: AssertedRecordedProperties
    cardinality: one_or_more
    temporal: recorded-only
    questions: [CQ-MF-02, Q-D8-01, CQ-AX-23, CQ-PF-04, Q-D8-12, Q-D8-20, Q-D8-23]
    pattern: 03#CQ-MF-02
    populatedBy: [regulations-gov-api, fda-gras-inventory, eurlex, health-canada-lnhpd, cafc-opinions]
    fixture: final/fixtures/D8/nmn-us-exclusion-reversal
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      Which record established (or confirmed, or ended) a standing — "filing is not capability": Q-D8-20 asks whether the
      latest record behind a status is a filing, an opinion or an act. Asserted rather than structural because reading a letter
      as establishing a status is an interpretation the verifier must be able to check against the record's locator. Replaces
      RESULTS_FROM_RESPONSE and SUBMISSION_HAS_RESPONSE.
  - type: LOT_OF
    module: D8
    class: asserted
    from: Lot
    to: [D6.Product, D6.ProductVariant]
    edgeProperties: AssertedRecordedProperties
    cardinality: exactly_one
    temporal: recorded-only
    questions: [Q-D8-04, CQ-AX-19, Q-D8-06, Q-D8-08, Q-D8-18]
    pattern: 03#Q-D8-04
    populatedBy: [openfda-food-enforcement, coa-pdf, certification-databases]
    fixture: final/fixtures/D8/imu-tek-warning-letter-recall
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      Lot is the join key across recalls, COAs, certifier tables and counterfeit reports; LOT_OF reaches the product, its
      label claims (D6 formulation) and its brand. Variant when the source distinguishes it, else product (union of 2).
      D6.Package is not a member (D6 OQ-D6-13 asks for it): a lot is a production batch packed into several sizes, and no D8
      source scopes a lot to one package; package size stays in productDescriptionVerbatim / scopeVerbatim (OQ-D8-04).
  - type: QUALITY_RESULT_FOR
    module: D8
    class: asserted
    from: QualityResult
    to: Lot
    edgeProperties: AssertedRecordedProperties
    cardinality: exactly_one
    temporal: recorded-only
    questions: [CQ-AX-19, Q-D8-05, Q-D8-06, Q-D8-09, Q-D8-18, Q-D8-19]
    pattern: 03#CQ-AX-19
    populatedBy: [coa-pdf, company-report-pdf, europepmc-fulltext-jats]
    fixture: final/fixtures/D8/eurofins-coa-quantity-by-input
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      A result row is for a lot (COA, certifier batch). The D6.Product member is cut (R-73: no fixture writes
      QUALITY_RESULT_FOR → Product; the eurofins-coa objects are all Lot): a survey row that names no lot stays the D1
      predicate MEASURED_CONTENT_IN_PRODUCT or CONTAINS_UNDECLARED_SUBSTANCE on the Product (D8.seams.yaml predicateSeams)
      until a survey fixture promotes the member; an undeclared drug is also a RegulatoryRecord with violationCategories
      UNDECLARED_DRUG_INGREDIENT. Replaces SAMPLE_FROM, TESTED_SAMPLE, PRODUCED_RESULT, INTERPRETS_TESTING_OF and SUMMARIZES_TESTING. Renamed from
      RESULT_FOR (adversarial review): D3 declares RESULT_FOR (StudyResult → OutcomeDefinition, structural) and Neo4j
      relationship-property indexes are per type, so one name would carry two property schemas (OQ-D8-30).
  - type: MEASURES_ANALYTE
    module: D8
    class: asserted
    from: QualityResult
    to: [D1.ChemicalSubstance, D1.IngredientMaterial, D1.Constituent]
    edgeProperties: AssertedRecordedProperties
    cardinality: zero_or_one
    temporal: recorded-only
    questions: [Q-D8-06, CQ-AX-19]
    pattern: 03#Q-D8-06
    populatedBy: [coa-pdf, company-report-pdf, europepmc-fulltext-jats]
    fixture: final/fixtures/D8/eurofins-coa-quantity-by-input
    demotionCandidate: { rank: first, ruling: R-07, note: "kept; step 7 demotes only when every question is value 3 and the candidate is over budget" }
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      "Products containing X measured far below claim" (Q-D8-06) starts from the analyte, not from free text; analyteVerbatim
      stays on the row. Union of 3 because COA rows name substances (lead, NMN), ingredient materials (root extract 450 mg)
      and constituent classes (total withanolides).
  - type: COVERS
    module: D8
    class: asserted
    from: CertificationListing
    to: [D6.Product, D6.ProductVariant, Lot]
    edgeProperties: AssertedEdgeProperties
    cardinality: zero_or_more; many episodes
    temporal: episode
    questions: [CQ-PF-03a, Q-D8-08, Q-D8-19]
    pattern: 03#Q-D8-08
    populatedBy: [certification-databases, firecrawl-change-tracking]
    fixture: final/fixtures/D8/certification-listing-lot-scope
    fixtureRequest: { id: RQ-02, pair: CertificationListing -> D6.ProductVariant, question: CQ-PF-03a, item: "NSF listing that names a size or flavour variant", ruling: R-73, file: final/requests.md }
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      Certifier pages change in place: a lot appears, a lot drops off, a listing lapses. The episode's valid time is the
      observed coverage window; recorded time is when BellLabs saw it. Organization was dropped as a member (adversarial
      review: no fixture, no fixtured question, and it overloaded "covers"): a facility-level listing keeps its facility in
      scopeVerbatim and names the operator through predicate-only LISTING_COVERS_FACILITY_OF until Facility is promoted
      (OQ-D8-03). Replaces COVERS (W12), HAS_CERTIFICATION_SCOPE, CERTIFIED_UNDER, PROGRAM_HAS_LISTING, CERTIFIES_RESULTS_FOR.
  - type: ASSIGNED_TO
    module: D8
    class: asserted
    from: Patent
    to: D7.Organization
    edgeProperties: AssertedEdgeProperties
    cardinality: one_or_more; many episodes
    temporal: episode
    questions: [Q-D8-10, Q-D8-11, CQ-EC-01]
    pattern: 03#Q-D8-11
    populatedBy: [google-patents, sec-edgar, cafc-opinions]
    fixture: final/fixtures/D8/us8197807-claims-held-invalid
    demotionCandidate: { rank: first, ruling: R-07, note: "kept; step 7 demotes only when every question is value 3 and the candidate is over budget" }
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      Who owns the right, and since when (assignments change). Kept split from LICENSED_TO for a measured size reason, not a
      kernel limit (K change 2 now allows a domain-local edge-property type): one HOLDS_PATENT_RIGHT edge with a
      PatentRightProperties superset (role, exclusive) printed +4,069 bytes and the same 309 input types against the current
      kernel (09-reasoning), and no D8 question filters by exclusivity (Q-D8-11 returns it). Replaces ASSIGNED_PATENT.
  - type: LICENSED_TO
    module: D8
    class: asserted
    from: Patent
    to: D7.Organization
    edgeProperties: AssertedEdgeProperties
    cardinality: many; many episodes
    temporal: episode
    questions: [Q-D8-11, Q-D8-21, CQ-EC-01]
    pattern: 03#Q-D8-11
    populatedBy: [sec-edgar, cafc-opinions]
    fixture: final/fixtures/D8/us8197807-claims-held-invalid
    demotionCandidate: { rank: first, ruling: R-07, note: "kept; step 7 demotes only when every question is value 3 and the candidate is over budget" }
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      Licences are granted and terminated; the episode is the licence's term, authorized by one Assertion whose qualifiers
      carry exclusivity, field of use and territory as disclosed. A change of terms that neither starts nor ends the licence
      (a royalty waiver after litigation) is a dated literal Assertion LICENCE_TERMS_AMENDED on the patent, never a new
      episode whose validFrom would read as the licence start (fixture us8197807 p05). Replaces the PatentLicense node,
      LICENSES_PATENT and GRANTS_PATENT_LICENSE.
predicateOnly:
  - predicate: REVISES_DETERMINATION_OF
    registrar: D8
    use: RegulatoryRecord → RegulatoryRecord (the 2025 citizen-petition response revises the 2022 NDI determinations)
    promoteWhen: Q-D8-01 needs record-to-record supersession chains that status episodes cannot show (more than one revising record per status)
  - predicate: CITES_AS_EVIDENCE
    registrar: D8
    use: RegulatoryRecord → D3 Study / RegulatoryRecord (FDA's NMN exclusion cites MIB-626 registrations)
    promoteWhen: Q-D8-15 becomes value 1 and is asked across many records ("which trials did FDA rely on for all exclusions")
  - predicate: CHARACTERIZES_REGULATORY_RECORD
    registrar: D8
    use: company claim occurrence (kernel Assertion CLAIM) whose object is a RegulatoryRecord; weighed by a RETELLING_FIDELITY assessment
    promoteWhen: CQ-MF-03 is asked as a ranking across many companies (then a D10 derived projection, not a stored edge)
  - predicate: REPORTED_COUNTERFEIT
    registrar: D8
    use: reporter Organization asserts subject Lot or D6.Product (indicators in qualifiers)
    promoteWhen: Q-D8-07 becomes value 1 or counterfeit reports become a structured feed
  - predicate: MARKED_WITH_PATENT
    registrar: D8
    use: D6.Product → Patent (patent-marking pages)
    promoteWhen: Q-D8-14 becomes value ≤ 2 and marking pages are captured routinely
  - predicate: CLAIMS_CGMP_COMPLIANCE
    registrar: D8
    use: D7.Organization or D6.Product self-claim, weighed by a QUALITY assessment (CQ-MF-06)
    promoteWhen: never as a typed edge (self-claims are claim occurrences)
  - predicate: HAS_CAPABILITY_STAGE
    registrar: D8
    use: D7.Organization → D1.IngredientMaterial with literal stage (OPERATING, PILOT, PLANNED, SUSPENDED, DISCONTINUED) and valid time
    promoteWhen: CQ-MF-04 rises above value 3 and a source states capacity with units
  - predicate: COMMISSIONED_TEST
    registrar: D8
    use: D7.Organization (brand) → QualityResult (who paid for the test, when the source says)
    promoteWhen: Q-D8-06 independence questions need it beyond the tester's D7 financial interests
  # Added in the adversarial-review revision (2026-10-08). The assembled predicateOnly lists are the predicate registry
  # (final/vocabularies/predicates.yaml, R-52).
  - predicate: HAS_APPROVED_INDICATION
    registrar: D8
    ruling: R-88
    use: >-
      regulator → indication: subject D6.Product or D1.ChemicalSubstance, object D2.Condition (the same Condition that
      CAUSES_ADVERSE_EFFECT and USE_CONSTRAINED_IN use, R-84), asserter the regulator (FDA, EMA), evidence the DRUG_APPLICATION_ACTION record or the approved label it cites; valid time = approval or label
      version. Named for D5 (OQ-D5-22, Q-D5-16 approved vs off-label); D5 reads it beside its target statements.
    promoteWhen: a question filters products by indication in GraphQL at value ≤ 2 (then D2 or D6 declares it; D8 owns neither end)
  - predicate: ADJUDICATES_PATENT
    registrar: D8
    use: RegulatoryRecord (COURT_DECISION / PTAB_DECISION) → Patent for holdings that establish no LegalStatus (infringement only); claim numbers in qualifiers
    promoteWhen: a question at value ≤ 2 lists infringement holdings per patent (Patent left RegulatoryRecordTopic in the adversarial review)
  - predicate: LISTING_COVERS_FACILITY_OF
    registrar: D8
    use: CertificationListing (coverageKind FACILITY, e.g. a GMP registration) → D7.Organization operating the facility; address in scopeVerbatim
    promoteWhen: Facility is promoted (OQ-D8-03; R-67 names D8 the future owner; trigger FDA Data Dashboard access plus a value-1 question joining two records through one FEI); then COVERS gains Facility
  # Added in synthesis (R-73, R-93; registrar D8 per R-52).
  - predicate: SAMPLE_TESTED_POSITIVE_FOR
    registrar: D8
    ruling: R-73
    use: >-
      tested sample → organism: subject D6.Product or Lot, object D1.Taxon (an outbreak strain or contaminating organism the
      regulator or laboratory reports a sample positive for); asserted by the issuer of the record. Replaces D6's provisional
      SAMPLE_POSITIVE_OUTBREAK_STRAIN (D6 fixture recall-moringa-mogo re-keys to this name). Taxon is not a QualityAnalyte member.
    promoteWhen: a value ≤ 2 question filters products or lots by organism in GraphQL
  - predicate: HAS_ACTION_LEVEL
    registrar: D8
    ruling: R-93
    use: >-
      regulatory threshold: subject D1.ChemicalSubstance, object D12.FoodCategory or D12.FoodItem, valueNumber + unitCode,
      qualifiers status=PROPOSED|ADOPTED, jurisdiction, basis; asserted by the regulator. Read by D12 Q-D12-06 / Q-D12-18.
    promoteWhen: a value-1 question filters action levels across many substances in GraphQL
  - predicate: HAS_CLAIM_CONDITION
    registrar: D8
    ruling: R-93
    use: >-
      condition of an authorised claim: subject the authorising RegulatoryRecord, condition in valueString with qualifiers; a
      condition on a product class takes the kernel Claim as subject with qualifier productClass=.
    promoteWhen: a value-1 question filters authorised claims by condition in GraphQL
  # Literal (property-provenance) predicates, formerly D8.<FIELD> (prefix dropped, R-52): the subject is a D8 node, the value is
  # a literal, the locator is the span that states it (OQ-D8-12); a predicate that backs a node property is the FIELD predicate
  # of that property (R-14: the node value is a cache). Never promoted to edges; they become node properties or stay literals.
  - predicate: INSPECTION_WINDOW
    registrar: D8
    use: RegulatoryRecord (warning letter) → literal start/end of the inspection it reports (Q-D8-03; fixture imu-tek i10)
    promoteWhen: never (backs inspectionStartedAt / inspectionEndedAt)
  - predicate: FORM_483_ISSUED_AND_RESPONSE
    registrar: D8
    use: RegulatoryRecord (warning letter) → literal 483 date and the firm's response date (Q-D8-03; imu-tek i11)
    promoteWhen: an inspection becomes a D13 Event or a FORM_483 record is captured on its own (OQ-D8-18)
  - predicate: CGMP_FINDING
    registrar: D8
    use: RegulatoryRecord → literal CFR citation and finding (CQ-MF-06; imu-tek i13, i14)
    promoteWhen: CQ-MF-06 filters findings by CFR section at value ≤ 2 (then a list property)
  - predicate: RECALL_INITIATED_BY_FIRM
    registrar: D8
    use: RegulatoryRecord (recall) → literal voluntary / mandated and initiation date (Q-D8-03; imu-tek i15)
    promoteWhen: never (record property provenance)
  - predicate: RECALL_STATUS
    registrar: D8
    use: RegulatoryRecord (recall) → literal status with the date it took effect (Q-D8-04; imu-tek i16)
    promoteWhen: never (backs recallStatus / terminatedAt)
  - predicate: ISSUED_AT
    registrar: D8
    use: RegulatoryRecord → literal date of record, with its basis (signature timestamp, docket postedDate) (Q-D8-01; nmn n19)
    promoteWhen: never (backs issuedAt)
  - predicate: ISSUED_AT_AS_PRINTED
    registrar: D8
    use: RegulatoryRecord → literal date as printed when it disagrees with the date of record ("September 29, 2029"; nmn n20)
    promoteWhen: never
  - predicate: CITED_TRIAL_ID_AS_PARSED
    registrar: D8
    use: RegulatoryRecord → literal identifier as a parser projection read it, kept to document a parser error (nmn n09, tool-log E6)
    promoteWhen: never
  - predicate: ENTRY_INTO_FORCE_COMPUTED
    registrar: D8
    use: RegulatoryRecord → literal date computed from the act's own rule (Article 4), kept beside the Annex's stated date (eu-nrcl e08, OQ-D8-27)
    promoteWhen: never (basisKind CALCULATED)
  - predicate: LOT_EXPIRY_AS_PRINTED
    registrar: D8
    use: Lot → literal expiry as printed when it does not parse to a day ("08/2027"; eurofins c15)
    promoteWhen: never (backs Lot.expiresAt with month precision)
  - predicate: DISTRICT_COURT_INVALIDITY
    registrar: D8
    use: Patent → literal lower-court holding and date as restated by the appellate opinion (Q-D8-12; us8197807 p14)
    promoteWhen: the district-court opinion is captured as its own COURT_DECISION record
  - predicate: ORGANIZATION_RENAMED
    registrar: D8
    use: D7.Organization → literal former name and effective date as a filing states it (us8197807 p15)
    promoteWhen: owned by D7 (name episodes); D8 hands it over (OQ-D8-26); registrar stays D8 until D7 registers it
  - predicate: LICENCE_TERMS_AMENDED
    registrar: D8
    use: Patent → literal amendment of an existing licence's terms with its date (Supplemental Agreement 2024-11-27, royalty waiver; Q-D8-21; us8197807 p05)
    promoteWhen: Q-D8-21 rises to value ≤ 2 and asks for terms as filters (then a licence node, 09 "twice the budget")
deferred:
  - type: SUPERSEDES_RECORD
    reason: status episodes plus REVISES_DETERMINATION_OF (predicate) answer Q-D8-01; no question traverses record chains
  - type: ADJUDICATES
    reason: a decision establishes a LegalStatus (CLAIMS_HELD_INVALID with claimNumbers) that is STATUS_OF the patent and STATUS_FROM the decision; infringement-only holdings are predicate-only ADJUDICATES_PATENT. CONCERNS no longer reaches Patent (adversarial review)
  - type: ACTION_AGAINST / ACTION_CONCERNS / RECORD_CONCERNS
    reason: research-stage names; EnforcementAction folded into RegulatoryRecord, so ADDRESSED_TO and CONCERNS cover them
  - type: HOLDS_IP_RIGHT / HOLDS_PATENT_RIGHT
    reason: re-decided after K change 2 (domain-local edge-property types allowed); measured against the current kernel, one HOLDS_PATENT_RIGHT with PatentRightProperties (role, exclusive) printed +4,069 bytes and the same input count as ASSIGNED_TO + LICENSED_TO, and no D8 question filters by exclusivity; split kept
  - type: TESTED_BY
    reason: merged into ISSUED_BY (the laboratory that reported the row is its issuer)
  - type: MANUFACTURES / CONTRACTS_MANUFACTURING / PERFORMS_PROCESS / HOSTS_PROCESS / INPUTS / OUTPUTS / PRODUCED_BY_PROCESS / USES_EQUIPMENT / USES_PLATFORM / HAS_STEP
    reason: W11 process graph; no D8 question traverses a process; manufacturer roles are predicate-only, registered by D7 (MANUFACTURES, CONTRACT_MANUFACTURES_FOR, SUPPLIES_MATERIAL, MANUFACTURER_UNNAMED, DISTRIBUTES; R-68)
  - type: CAPABILITY_FOR_MATERIAL / CAPABILITY_FOR_PROCESS / HAS_CAPABILITY_STATE
    reason: CQ-MF-04 is value 3; HAS_CAPABILITY_STAGE predicate with valid time
  - type: GOVERNED_BY_SPECIFICATION / VERSION_OF_SPECIFICATION / CRITERION_OF_SPECIFICATION / APPLIES_CRITERION / EVALUATED_AGAINST / MANUFACTURED_UNDER
    reason: specifications are not nodes; the criterion printed beside a result is inline on QualityResult, a regulator's specification is text on its record
  - type: SAMPLE_FROM / TESTED_SAMPLE / PRODUCED_RESULT / USED_METHOD / PERFORMED_BY_LAB / COA_ISSUED_BY / INTERPRETS_RESULT / INTERPRETS_TESTING_OF / SUMMARIZES_TESTING / SUPPORTED_BY / CERTIFIES_RESULTS_FOR
    reason: W12 test chain collapsed into one QualityResult row (QUALITY_RESULT_FOR, MEASURES_ANALYTE, ISSUED_BY); SUPPORTED_BY is kernel HAS_EVIDENCE
  - type: UNIT_FROM_LOT / MATCHES_COMMERCE_ITEM
    reason: no public source for individual units; commerce matching is a D6 EQUIVALENCE assessment
  - type: HAS_CERTIFICATION_SCOPE / CERTIFIED_UNDER / PROGRAM_HAS_LISTING
    reason: programme and scope are properties of CertificationListing; coverage is COVERS
  - type: FOLLOWS_PATHWAY / UNDER_PATHWAY / UNDER_LEGAL_BASIS / UNDER_LEGAL_BASIS_VERSION / HAS_PATHWAY_VERSION / HAS_REGULATORY_STEP / OVERSEES
    reason: pathway is an enum, legal basis a citation string; no question traverses a pathway node
  - type: SUBMITTED_BY / SUBMISSION_ABOUT / SUBMISSION_HAS_RESPONSE / SUPERSEDES_SUBMISSION / RESULTS_FROM_RESPONSE / HAS_REGULATORY_STATUS / CONDUCTED_BY / INSPECTED_FACILITY
    reason: submission and response are both RegulatoryRecords (ADDRESSED_TO, CONCERNS, STATUS_FROM); inspections are reported by the warning letter (inspection window properties) or are INSPECTION_CLASSIFICATION records
  - type: HAS_IDENTIFIER
    reason: kernel relationship; D8 lists its schemes in 06-node-register.yaml
  - type: FAMILY_HAS_APPLICATION / APPLICATION_GRANTED_AS / HAS_PATENT_CLAIM
    reason: family id and publication type are Patent properties; claim text stays in the snapshot; claim numbers on LegalStatus
  - type: ASSIGNED_PATENT / LICENSES_PATENT / GRANTS_PATENT_LICENSE / LICENSE_COVERS / IP_STATUS_OF
    reason: replaced by ASSIGNED_TO, LICENSED_TO (episodes), CONCERNS (topical) and STATUS_OF (LegalStatus)
  - type: OWNS_TRADEMARK / MARKETED_UNDER_MARK
    reason: Trademark deferred (no question at value ≤ 2; USPTO TSDR needs an API key); brand names are D6/D7 identifiers
  - type: DOCUMENTED_BY_RECORD
    reason: declared by D13 on Event (Event.regulatoryRecords, typed, AssertedRecordedProperties, since D13's adversarial-review pass); D8 declares no inverse because no D8 question traverses from an event
  - type: RESULT_FOR
    reason: renamed QUALITY_RESULT_FOR (D3 owns RESULT_FOR with another meaning and edge-property type)
  - type: CITED_AS_DRUG_CLAIM / MAKES_CLAIM (predicates)
    reason: replaced by the kernel conventions — a regulator's finding is RATES_CLAIM by the regulator; a quoted firm claim captured only inside the regulator's letter is a CLAIM occurrence asserted by the regulator as a retelling (basisKind CITED_FROM_PRIOR_WORK) until the firm's own page is captured
  - type: CONCERNS → D7.Organization / COVERS → D7.Organization / LOT_OF → D6.Package / COVERS → D6.Package / CONCERNS → D9.MediaWork / CONCERNS → D4.LabTest
    reason: union members considered and not added (addressee is ADDRESSED_TO; facility listing is predicate-only until Facility; Package not a lot or listing scope in any D8 source; MediaWork and LabTest would exceed the 5-member union or have no D8 question — D9 keeps CITES_CONTENT, D4 reaches CLIA/LDT standing through the laboratory Organization)
  # Cut in synthesis (union members without a fixture or with a single path elsewhere)
  - type: CONCERNS → D4.Device / STATUS_OF → D4.Device
    reason: R-72 — one path, regulatory acts concern the D6 Product, which DELIVERS the D4 Device; no fixture writes either Device pair; Device left both unions (OQ-D8-29 closed, two free slots)
  - type: QUALITY_RESULT_FOR → D6.Product
    reason: R-73 — no fixture writes it (Q-D8-06, v2); union QualityResultFor removed; a survey row without a lot is the D1 predicate MEASURED_CONTENT_IN_PRODUCT / CONTAINS_UNDECLARED_SUBSTANCE until a survey fixture promotes the member
  - type: CONCERNS Patent → D1.IngredientMaterial
    reason: R-73 — no fixture writes it (Q-D8-11, v2); union PatentTopic removed; Patent.concerns typed D1.ChemicalSubstance
