version: 1
module: D7
# Source: packets/D7/10-seams.yaml (sha256 16f6f33a…), edited by the S module editor for D7 2026-10-08 per
# final/decision-report.md and final/_work/rulings.yaml (global, modules.D7). Every entry keeps the 01-PACKET-CONTRACT
# fields (type, from, to, questions, direction, owner) and adds `module: D7`, `status` (accepted | cut) and `ruling` (the
# ruling that decided the row; `none` = no ruling touches it and the owner SDL was re-checked: field, type and union names
# match packets/<owner>/04-schema-proposal.graphql as of HEAD e484fd2). Synthesis edits:
#   R-94  relationship seams (`seams`) and Assertion.predicate rows (`predicateSeams`, checked against
#         final/vocabularies/predicates.yaml) are separate lists.
#   R-79  OPERATED_BY D9.Channel -> D7.Person | D7.Organization (union ChannelOperator) cut; OPERATED_BY is a D9 predicate.
#   R-67  COVERS D8.CertificationListing -> D7.Organization cut; CQ-MF-01 dropped from the ISSUED_BY rows.
#   R-46  publisherUid (property reference) cut; OQ-D7-34 closed (publisherUid is a cache; publisher via ASSERTED_BY).
#   R-80  PROTOCOL_AUTHORED_BY -> AUTHORED_BY (registrar D3). R-52 OFFERS_INTERVENTION registrar D6; SUCCEEDED_BY registrar D6
#         with D7's Organization -> Organization pair. R-92 FINANCING_AMOUNT / DATE_OF_FIRST_SALE / INVESTOR_COUNT and
#         REPORTED_MARKET_MOVE registrar D13 (owner other). R-69 EVENT_ABOUT -> D7.Award (registrar D13). R-83 RECOMMENDS_USE
#         registrar D9 (Attia fixture). R-82 DISCLOSES_INTEREST registrar D9 with the denial convention D7 accepts.
#   R-68  manufacturer / supplier predicate rows: D7 sole registrar, renames ruled.
#   R-78, R-53  HOLDS_* read by D5 Q-D5-13: D5 adopts the typed names. R-15 / R-89: also read by K Q-K-15 and D2 Q-D2-21.
#   R-55  conflict-relevance vocabulary: registrar D7, disclosure facets contributed by D9.
#   R-60  frontiers re-pinned @0.2.1; targets @0.2.2. Vocabulary files point at final/vocabularies/.
# D7's SDL references no type outside the module except kernel types (Entity, Subjectable, AssertedEdgeProperties,
# AssertedRecordedProperties, PrivacyClass, TimePrecision, ValidTimeBasis). Every seam below is an edge another module
# declares on its own type pointing at a D7 type (owner: other; the hub split: Organization, Person, Brand and Award declare
# no inverse field, R-67), a kernel record D7 relies on, or a D7 edge another module reads.
seams:
  # ---- kernel records D7 relies on
  - { type: ASSESSES, module: D7, from: K.Assessment, to: D7.Person, questions: [CQ-CL-05, Q-D7-06, Q-D7-08, Q-D7-20, Q-D7-24], direction: OUT, owner: other, status: accepted, ruling: R-55, note: "Assessment kinds CONFLICT_RELEVANCE (subkind D7.conflict-relevance, registrar D7, R-55), EVIDENCE_SYNTHESIS (D7.role-agreement), QUALITY (D7.disclosure-coverage), INSIGHT (D7.undisclosed-tie-lead), RESOLUTION (D7.person-resolution); D7 owns these subkind vocabularies in final/vocabularies/assessment-vocabularies.yaml (R-54)" }
  - { type: ASSESSES, module: D7, from: K.Assessment, to: D7.Organization, questions: [CQ-CL-05, Q-D7-08, CQ-EC-02], direction: OUT, owner: other, status: accepted, ruling: none, note: "RESOLUTION (D7.organization-resolution) and EQUIVALENCE hypotheses; never a merge" }
  - { type: ASSESSES, module: D7, from: K.Assessment, to: K.Claim, questions: [CQ-CL-05, Q-D7-06], direction: OUT, owner: other, status: accepted, ruling: R-20, note: "kernel convention (R-20; OQ-D7-15 closed): the conflict-relevance Assessment ASSESSES the Claim of the occurrence and the speaker, and is DERIVED_FROM the judged occurrence (facet occurrence=)" }
  - { type: DERIVED_FROM, module: D7, from: K.Assessment, to: K.Assertion, questions: [CQ-CL-05, Q-D7-06, Q-D7-08], direction: OUT, owner: other, status: accepted, ruling: R-20, note: "conflict-relevance and role-agreement inputs: the claim occurrence (facets occurrence= / retelling= / original=) and each interest Assertion; one DERIVED_FROM replaces the pinned citation types (R-11)" }
  - { type: ASSERTED_BY, module: D7, from: K.Assertion, to: "D7.Person | D7.Organization (through K.Subjectable)", questions: [CQ-CL-05, Q-D7-06, Q-D7-07, Q-D7-24, CQ-AX-18], direction: OUT, owner: other, status: accepted, ruling: R-15, note: "kernel edge: a claim occurrence with speechAct RECOMMENDS names its speaker; the reachable financial interest is the D7 interest family from that Person (K.seams lists the same seam). ASSERTED_BY also admits D3 Publication and D9 MediaWork for a multi-author work's own voice; the authors are then reached by the AUTHORED_BY predicate (R-15, R-80). Asserter defaults per R-16" }
  - { type: HAS_SUBJECT, module: D7, from: K.Assertion, to: "D4.Device (through K.Subjectable)", questions: [Q-D7-06, CQ-CL-05], direction: OUT, owner: other, status: accepted, ruling: R-83, note: "the recommended means of a claim occurrence is its subject, never a Target (R-83; Attia fixture r-01: the CGM device category, D4 Device); Q-D7-06 and CQ-CL-05 read HAS_SUBJECT|HAS_OBJECT. No typed path links a D4 Device to its maker (D4 platform roles are predicate-only), so device-category relevance is read from the CONFLICT_RELEVANCE Assessment, never computed" }
  - { type: ASSOCIATES, module: D7, from: D10.Association, to: "D7.Organization | D7.Person (through K.Subjectable)", questions: [Q-D7-22, Q-D7-23], direction: OUT, owner: other, status: accepted, ruling: R-28, note: "D10 derived projection (read-only, method-versioned), one of the two registered domain exceptions targeting Subjectable (R-28); D7 declares no derived edges; no score between two domain entities (R-47). Q-D7-22 is retrieved, not materialized (R-50)" }
  # ---- D9 (sources, media, discourse): speakers, containers
  - { type: MENTIONS, module: D7, from: D9.Chunk, to: "D7.Organization | D7.Person | D7.Brand | D7.Award (through K.Subjectable)", field: Chunk.mentions, questions: [CQ-EC-03, CQ-CL-05], direction: OUT, owner: other, status: accepted, ruling: R-27, note: "kernel meaning (DerivedEdgeProperties), licensed by its entity-link/vN derivationRule; never evidence (R-27); FC1 unstructured-to-entity path" }
  - { type: APPEARS_IN, module: D7, from: D7.Person, to: D9.MediaWork, field: MediaWork.appearances (direction IN), questions: [CQ-CL-05, Q-D7-06, Q-D7-24], direction: IN, owner: other, status: accepted, ruling: R-81, note: "who speaks in a work (an appearance in media is D9 APPEARS_IN, R-81); D7 Person declares no inverse" }
  - { type: CONTENT_SPONSORED_BY, module: D7, from: D9.MediaWork, to: "D7.Organization | D7.Brand (union ContentSponsor, 2 members)", field: MediaWork.sponsors, questions: [CQ-CL-05, Q-D7-07], direction: OUT, owner: other, status: accepted, ruling: R-67, note: "content sponsorship is D9's edge on the container (R-67); the money tie to a Person is D7 RECEIVES_VALUE_FROM (valueKind SPONSORSHIP_PAYMENT)" }
  - { type: OPERATED_BY, module: D7, from: D9.Channel, to: "D7.Person | D7.Organization (union ChannelOperator, 2 members)", field: Channel.operators, questions: [CQ-CL-05, CQ-CL-07], direction: OUT, owner: other, status: cut, ruling: R-79, note: "no typed edge: OPERATED_BY stays a D9 predicate with subject Channel (predicateSeams below); promotion trigger is a measured CQ-CL-05 latency" }
  - { type: ASSESSES, module: D7, from: K.Assessment, to: D9.Channel, questions: [CQ-CL-07], direction: OUT, owner: other, status: accepted, ruling: none, note: "a kernel RESOLUTION Assessment ASSESSES the D9 handle (Channel with platform handle) and the candidate D7 Person; PseudonymousActor is not a D7 type (OQ-D7-06)" }
  # ---- D3 (clinical and preclinical evidence): one role edge with the 3-member union StudyParty
  - { type: HAS_STUDY_ROLE, module: D7, from: D3.Study, to: D7.Organization, field: Study.roles (union StudyParty = Organization | Person | Award), questions: [Q-D7-05, CQ-EC-04, Q-D7-22], direction: OUT, owner: other, status: accepted, ruling: R-67, note: "StudyRoleEdgeProperties.roleKind LEAD_SPONSOR, SPONSOR, COLLABORATOR, FUNDER, MATERIAL_PROVIDER, CRO, SITE; study funding is HAS_STUDY_ROLE {FUNDER} (R-82); role edge-property type kept (R-77)" }
  - { type: HAS_STUDY_ROLE, module: D7, from: D3.Study, to: D7.Person, field: Study.roles, questions: [CQ-EC-04, Q-D7-25], direction: OUT, owner: other, status: accepted, ruling: R-67, note: "PRINCIPAL_INVESTIGATOR, RESPONSIBLE_PARTY, sponsor-investigator" }
  - { type: HAS_STUDY_ROLE, module: D7, from: D3.Study, to: D7.Award, field: Study.roles, questions: [Q-D7-05, Q-D7-15, Q-D7-22, CQ-EC-04], direction: OUT, owner: other, status: accepted, ruling: R-69, note: "roleKind FUNDING_AWARD (R-69: an Award carries amount, funders and recipients, with D3 HAS_STUDY_ROLE FUNDING_AWARD); exercised by the Elysium fixture (e-12..e-14: preclinical Study → three Awards)" }
  - { type: REPORTS_ON, module: D7, from: D3.Publication, to: D3.Study, questions: [CQ-EC-04, Q-D7-22], direction: OUT, owner: other, status: accepted, ruling: none, note: "read only: author → employer paths start at the publication (Publication.reportsOn)" }
  # ---- D6 (products and commerce)
  - { type: BRANDED_AS, module: D7, from: D6.Product, to: D7.Brand, field: Product.brand, questions: [CQ-CL-05, CQ-EC-03, Q-D7-06, Q-D7-11, Q-D7-19, Q-D7-21, Q-D7-24, CQ-MF-01], direction: OUT, owner: other, status: accepted, ruling: none }
  - { type: SELLER_OF_RECORD, module: D7, from: D6.Offer, to: D7.Organization, field: Offer.sellerOfRecord, questions: [Q-D7-19, CQ-EC-01], direction: OUT, owner: other, status: accepted, ruling: R-67, note: "no inverse field on Organization" }
  - { type: NAMES_RESPONSIBLE_PARTY, module: D7, from: D6.LabelVersion, to: D7.Organization, field: LabelVersion.responsibleParty, questions: [Q-D7-19, CQ-MF-01], direction: OUT, owner: other, status: accepted, ruling: R-67, note: "stays typed (R-67, closes OQ-D6-29); 'Manufactured for / Distributed by' party printed on a label, role in LabelVersion.responsiblePartyRole; a non-label distributor statement is the D7 predicate DISTRIBUTES (R-68)" }
  # ---- D8 (quality, regulation, IP)
  - { type: ISSUED_BY, module: D7, from: D8.RegulatoryRecord, to: D7.Organization, field: RegulatoryRecord.issuedBy, questions: [Q-D7-07, Q-D7-13], direction: OUT, owner: other, status: accepted, ruling: R-67, note: "the regulator (FTC, FDA) issuing a warning letter or action" }
  - { type: ADDRESSED_TO, module: D7, from: D8.RegulatoryRecord, to: D7.Organization, field: RegulatoryRecord.addressedTo, questions: [Q-D7-07, Q-D7-13, Q-D7-19], direction: OUT, owner: other, status: accepted, ruling: R-67, note: "the marketer or firm a warning letter or action names (replaces ACTION_AGAINST / RECORD_CONCERNS from the research notes)" }
  - { type: ISSUED_BY, module: D7, from: D8.QualityResult, to: D7.Organization, field: QualityResult.issuedBy, questions: [], direction: OUT, owner: other, status: accepted, ruling: R-67, note: "testing lab issuing a COA. R-67 dropped the CQ-MF-01 citation, so no D7 question reads this row; kept as an inbound edge onto D7.Organization declared by D8 (hub-split inventory). D8's questions carry it" }
  - { type: ISSUED_BY, module: D7, from: D8.CertificationListing, to: D7.Organization, field: CertificationListing.issuedBy, questions: [], direction: OUT, owner: other, status: accepted, ruling: R-67, note: "certifying body. R-67 dropped the CQ-MF-01 citation, so no D7 question reads this row; kept as an inbound edge onto D7.Organization declared by D8. A certified site is the operating Organization plus verbatim scope (D8 predicate LISTING_COVERS_FACILITY_OF)" }
  - { type: COVERS, module: D7, from: D8.CertificationListing, to: "D7.Organization (member of union CertificationCoverageTarget)", field: CertificationListing.covers, questions: [CQ-MF-01, Q-D7-10], direction: OUT, owner: other, status: cut, ruling: R-67, note: "stale: CertificationCoverageTarget = Product | ProductVariant | Lot has no Organization member (packets/D8/04:355; R-94); no Facility node (OQ-D7-05 closed)" }
  - { type: ASSIGNED_TO, module: D7, from: D8.Patent, to: D7.Organization, field: Patent.assignees, questions: [CQ-EC-04, Q-D7-11], direction: OUT, owner: other, status: accepted, ruling: R-07, note: "patent assignee; an inventor's licensed-IP income is D7 RECEIVES_VALUE_FROM (INVENTOR_ON_LICENSED_IP). R-07: kept; recorded as a first demotion candidate" }
  - { type: LICENSED_TO, module: D7, from: D8.Patent, to: D7.Organization, field: Patent.licensees, questions: [CQ-EC-04, Q-D7-11], direction: OUT, owner: other, status: accepted, ruling: R-07, note: "R-07: kept; recorded as a first demotion candidate" }
  # ---- D4 (biomarkers, tests, devices)
  - { type: PERFORMED_BY_LAB, module: D7, from: D4.AssayVersion, to: D7.Organization, field: AssayVersion.performingLab, questions: [CQ-EC-01], direction: OUT, owner: other, status: accepted, ruling: R-67, note: "lab neighbourhood only; no D7 question filters on it" }
  # ---- D13 (frontiers and breakthroughs)
  - { type: INVOLVES, module: D7, from: D13.Event, to: D7.Organization, field: Event.involvedOrganizations, questions: [Q-D7-04, Q-D7-12, Q-D7-13], direction: OUT, owner: other, status: accepted, ruling: R-69, note: "EventRoleEdgeProperties role ISSUER, INVESTOR, LEAD_INVESTOR, LENDER, ACQUIRER, SPONSOR, REGULATOR …. Write rule (R-69; OQ-D7-33 closed): round participation is INVOLVES {INVESTOR | LEAD_INVESTOR}; a persisting holding is D7 HOLDS_STAKE, written only when a source states it. Q-D7-04 and Q-D7-13 read both and label each row STATED_HOLDING or ROUND_PARTICIPANT" }
  - { type: INVOLVES, module: D7, from: D13.Event, to: D7.Person, field: Event.involvedPeople, questions: [Q-D7-12], direction: OUT, owner: other, status: accepted, ruling: R-81, note: "public actors only; a presentation at a meeting is INVOLVES {PRESENTER}, not SPEAKER (R-81)" }
  # ---- D7 edges other modules read
  - { type: "HOLDS_ROLE | HOLDS_STAKE | RECEIVES_VALUE_FROM (read)", module: D7, from: D7.Person, to: D7.Organization, questions: [Q-D5-13], direction: OUT, owner: this, status: accepted, ruling: R-78, note: "inverse listing for D5: the protocol author's financial interest is the D7 interest family, read with valid-time overlap against the protocol edition. D5 replaces HAS_INTEREST_IN with -[r:HOLDS_ROLE|HOLDS_STAKE|RECEIVES_VALUE_FROM]-> in its seams and Q-D5-13 (R-78, OQ-D7-29) and removes the three names from its predicateOnly (R-53). The same family is read by K Q-K-15 (R-15) and D2 Q-D2-21 (R-89)" }
  # ---- D10 (vetting, decision criteria)
  - { type: "publisherUid (property reference)", module: D7, from: D10.DecisionCriterion, to: D7.Organization, questions: [Q-D7-06], direction: OUT, owner: other, status: cut, ruling: R-46, note: "OQ-D7-34 closed: DecisionCriterion.publisherUid becomes a cache; Q-D10-10 reaches the publisher through the criterion set's authorizing Assertion (ASSERTED_BY the publisher for a third-party criterion — the ASSERTED_BY row above — or WAS_GENERATED_BY the BellLabs Activity for our own)" }
predicateSeams:
  # Assertion.predicate values D7 questions, patterns or fixtures read (R-94), checked against final/vocabularies/predicates.yaml;
  # registrar per R-52.
  # ---- registered by D7 (05 predicateOnly), the manufacturer / supplier set (R-68; OQ-D7-28)
  - { predicate: MANUFACTURES, module: D7, registrar: D7, aliases: [MANUFACTURES_MATERIAL], subjects: [D7.Organization], objects: [D6.Product, D1.IngredientMaterial], questions: [CQ-MF-01, Q-D7-18], owner: this, status: accepted, ruling: R-68, note: "D1 renames MANUFACTURES_MATERIAL; D1, D6 and D8 delete their registrations; no typed edge anywhere (CQ-MF-01 in Cypher over Assertions; GraphQL filter is a recorded gap)" }
  - { predicate: CONTRACT_MANUFACTURES_FOR, module: D7, registrar: D7, subjects: [D7.Organization], objects: [D7.Organization], qualifiers: ["product="], questions: [CQ-MF-01, Q-D7-18], owner: this, status: accepted, ruling: R-68, note: "CMO → brand owner; D8 deletes its registration" }
  - { predicate: SUPPLIES_MATERIAL, module: D7, registrar: D7, aliases: [SUPPLIES_INGREDIENT, EXCLUSIVE_SUPPLIER_OF, SOLE_SUPPLIER_OF], subjects: [D7.Organization], objects: [D1.IngredientMaterial], qualifiers: ["exclusivity=SOLE|NON_EXCLUSIVE|UNSTATED", "buyer="], questions: [CQ-MF-01, Q-D7-21], owner: this, status: accepted, ruling: R-68, note: "D6 (filing-channels-niagen-10k) and D7 (niagen n-19) write the Grace 10-K fact identically; D8 SUPPLIES_INGREDIENT → SUPPLIES_MATERIAL and EXCLUSIVE_SUPPLIER_OF → SUPPLIES_MATERIAL exclusivity=SOLE; D1 declares IngredientMaterial.suppliers on promotion" }
  - { predicate: MANUFACTURER_UNNAMED, module: D7, registrar: D7, aliases: [MANUFACTURER_STATEMENT], subjects: [D7.Organization], objects: [literal], qualifiers: ["manufacturingKind=CONTRACT|INGREDIENT|PACKAGING"], questions: [CQ-MF-01, Q-D7-21], owner: this, status: accepted, ruling: R-68, note: "an unnamed manufacturer described by a filing; D6 MANUFACTURER_STATEMENT → MANUFACTURER_UNNAMED (D6 re-keys its filing fixtures)" }
  # ---- registered by other modules
  - { predicate: OPERATED_BY, module: D7, registrar: D9, aliases: [OPERATES_CHANNEL (inverse)], subjects: [D9.Channel], objects: [D7.Person, D7.Organization], questions: [CQ-CL-05, CQ-CL-07], owner: other, status: accepted, ruling: R-79, note: "replaces the cut typed OPERATED_BY seam row; D7 deleted its inverse OPERATES_CHANNEL registration" }
  - { predicate: RECOMMENDS_USE, module: D7, registrar: D9, aliases: [RECOMMENDS_FOR, ENDORSES_PRODUCT], subjects: ["the recommended means (D4 Device, D6 Product, D1 Compound, D5 Intervention …)"], objects: [literal], questions: [CQ-CL-05, Q-D7-06], owner: other, status: accepted, ruling: R-83, note: "claim occurrence (speechAct RECOMMENDS) used by the Attia fixture; subject is the means, never a Target (goal in qualifier target:<key>); no stored RECOMMENDS edge (directive 3.9). D7 dropped its RECOMMENDS_USE and ENDORSES_PRODUCT registrations" }
  - { predicate: DISCLOSES_INTEREST, module: D7, registrar: D9, aliases: [COMPETING_INTEREST_STATED, DISCLOSES_SUPPORT_FROM, "DECLARES_NO_COMPETING_INTEREST (polarity NEGATIVE, speechAct DENIES)"], subjects: ["the discloser (D7.Person | D7.Organization) or the work"], objects: [D7.Organization], questions: [CQ-CL-05, Q-D7-20], owner: other, status: accepted, ruling: R-82, note: "D7 accepts the denial convention (polarity NEGATIVE, speechAct DENIES; OQ-D5-44); D7's DISCLOSES_INTERESTS_OF stays for third-party lists only" }
  - { predicate: AUTHORED_BY, module: D7, registrar: D3, aliases: [AUTHORED (inverse), PROTOCOL_AUTHORED_BY], subjects: [D3.Publication, D5.Protocol, D5.ProtocolEdition], objects: [D7.Person, D7.Organization], questions: [Q-D7-06, Q-D7-11], owner: other, status: accepted, ruling: R-80, note: "was PROTOCOL_AUTHORED_BY (D5) and D7 AUTHORED; D5 reads the author's interest family (HOLDS_* row above); D7 supplies author identity through RESOLUTION Assessments (K 11-OQ 29a)" }
  - { predicate: OFFERS_INTERVENTION, module: D7, registrar: D6, subjects: [D6.Offer, "D6.Product (SERVICE)", D7.Organization], objects: [D5.Intervention], questions: [Q-D7-10], owner: other, status: accepted, ruling: R-52, note: "a clinic operator offering an intervention; D6 sole registrar, D7.Organization admitted as subject (R-52, R-94)" }
  - { predicate: SUCCEEDED_BY, module: D7, registrar: D6, contributedPair: "D7.Organization -> D7.Organization", subjects: [D7.Organization], objects: [D7.Organization], questions: [Q-D7-09], owner: other, status: accepted, ruling: R-52, note: "was a D7 predicateOnly entry; D6 is registrar and adds D7's Organization → Organization pair. promoteWhen (D7): Q-D7-09 traverses merger chains deeper than one hop (else D13 M&A Event INVOLVES both)" }
  - { predicate: REPORTED_MARKET_MOVE, module: D7, registrar: D13, subjects: [D13.Event], objects: [D7.Organization], questions: [Q-D7-13], owner: other, status: accepted, ruling: R-92, note: "subject Event, stays with D13; D7 stores no market-data series (OQ-D7-13)" }
  - { predicate: FINANCING_AMOUNT, module: D7, registrar: D13, aliases: [FINANCING_AMOUNT_SOLD], subjects: [D13.Event], objects: [literal], qualifiers: ["amountKind= (D13's list plus ROUND_TOTAL)", "amountBasis= (D13's list plus REMAINING)"], questions: [Q-D7-04], owner: other, status: accepted, ruling: R-92, note: "D7 dropped its registration and retired FINANCING_AMOUNT_SOLD; valueNumber + unitCode iso4217:<CODE>; Form D totalOfferingAmount / totalAmountSold re-keyed to amountBasis OFFERED / SOLD (no D7 fixture writes it today)" }
  - { predicate: DATE_OF_FIRST_SALE, module: D7, registrar: D13, subjects: [D13.Event], objects: [literal], questions: [Q-D7-04], owner: other, status: accepted, ruling: R-92, note: "Form D dateOfFirstSale; D7 dropped its registration" }
  - { predicate: INVESTOR_COUNT, module: D7, registrar: D13, subjects: [D13.Event], objects: [literal], questions: [Q-D7-04], owner: other, status: accepted, ruling: R-92, note: "Form D totalNumberAlreadyInvested; D7 dropped its registration" }
  - { predicate: EVENT_ABOUT, module: D7, registrar: D13, subjects: [D13.Event], objects: [D7.Award], questions: [Q-D7-05, Q-D7-15], owner: other, status: accepted, ruling: R-69, note: "award rule (OQ-D7-32 closed): a grant, contract or prize record is a D7 Award (AWARDED_BY / AWARDED_TO, amounts on the Award); a D13 AWARD Event is only the announcement or milestone, points at the Award by EVENT_ABOUT and carries no amount; D13 lists the same row in its predicateSeams" }
sharedVocabularies:
  - { name: kernel-types, owner: K, file: final/schema/kernel.graphql, used: [AssertedEdgeProperties, AssertedRecordedProperties, PrivacyClass, TimePrecision, ValidTimeBasis], rule: "OWNS_BRAND uses AssertedEdgeProperties; AWARDED_BY and AWARDED_TO use AssertedRecordedProperties (K M10); the four D7 edge-property types copy AssertedEdgeProperties' eleven fields verbatim first (K M11 superset rule) and add only filterable qualifiers — no verbatim wording (R-30: roleText:, stakeClass: are Assertion qualifiers; unitCode iso4217:<CODE>) and no observation date (Assertion.validObservedAt / validObservedAtPrecision are read through assertionUid, R-19, R-24); PrivacyClass on every node; TimePrecision / ValidTimeBasis in the episode fields and Award.datePrecision" }
  - { name: identifier-schemes, owner: K, file: final/vocabularies/identifier-schemes.yaml, codesUsed: [LEI, SEC_CIK, ROR, ORCID, NPI, WIKIDATA, OPENALEX, DOI], codesRequested: [COMPANY_NUMBER, UEI, CROSSREF_FUNDER, WEB_DOMAIN, AWARD_NUMBER, NIH_PROJECT, NIH_PROFILE_ID, TICKER], rule: "one (scheme, issuer, normalized value) identifies at most one Subjectable (R-42)" }
  - { name: predicates, owner: S, file: final/vocabularies/predicates.yaml, role: "D7 is registrar of the manufacturer-role set MANUFACTURES, CONTRACT_MANUFACTURES_FOR, SUPPLIES_MATERIAL, MANUFACTURER_UNNAMED, DISTRIBUTES (R-68), of DISCLOSES_INTERESTS_OF (R-82), of the rest of its 05 predicateOnly list and of the authorizing predicates of its seven typed edges (R-53)" }
  - { name: targets, owner: D5, file: final/vocabularies/targets.yaml, version: "0.2.2", consumedBy: [Q-D7-24], ruling: R-60, rule: "D7 types never point at a Target; Q-D7-24 reaches a target through D9 claim occurrences and D6/D1 means asserted INTENDED_FOR_TARGET (registrar D5, R-52)" }
  - { name: frontiers, owner: D13, file: final/vocabularies/frontiers.yaml, version: "0.2.1", consumedBy: [], ruling: R-60, note: "re-pinned from 0.2.0 (R-60)", rule: "Organizations and Persons never point at a Frontier; only Event and Study attach (R-91); 'who is active on F' is computed through D13 Events they are INVOLVED in and D3 Studies they sponsor" }
  - name: conflict-relevance-subkinds
