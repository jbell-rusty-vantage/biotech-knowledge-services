version: 1
module: D5
# Source: packets/D5/05-relationship-register.yaml (sha256 8f3f903d…), edited by the S module editor for D5 2026-10-08 per
# final/decision-report.md and final/_work/rulings.yaml (global, modules.D5). Every entry keeps the 01-PACKET-CONTRACT
# fields and adds `module: D5`; fixtures point at final/fixtures/D5/<folder>. Synthesis edits:
#   R-10  HAS_EDITION: AssertedEdgeProperties (StateEpisodeProperties removed) + register field `exclusive: true`
#         (executor enforces non-overlapping episodes per relationship type).
#   R-26  OPERATIONALIZED_BY: class asserted, recorded time only, AssertedRecordedProperties; curator statements use basis
#         CURATOR_CLASSIFICATION (R-25). nestedOperations stays [CONNECT] (R-03: asserted -> [CONNECT]).
#   R-70  OPERATIONALIZED_BY target union TargetMeasure = D4.Biomarker | D4.Metric | D2.Outcome | D2.Condition; the Condition
#         pair is value 1 and unfixtured: kept with a fixture request in final/requests.md (R-06); Q-D5-20 uses this join
#         (no shared-Identifier join, R-42).
#   R-28  STEP_USES: admissible target list (incl. D12 DietaryPattern, FoodCategory) is executor-enforced; one of the two
#         registered domain exceptions targeting Subjectable.
#   R-47  DerivedEdgeProperties is a kernel M11 base; `score` stays null on STATES_CONSTRAINT and RESOLVES_TO_CONSTRAINT.
#   R-29  RESOLVES_TO_CONSTRAINT is declared IN on UseConstraint and never feeds adjudication.
#   R-52  D5 is sole registrar of INTENDED_FOR_TARGET, IMPROVES_TARGET, WORSENS_TARGET, NO_EFFECT_ON_TARGET,
#         MIXED_EFFECT_ON_TARGET, CAUSES_ADVERSE_EFFECT, HAS_UPPER_LIMIT, HAS_AUTHORIZED_DOSE_RANGE, USE_CONSTRAINED_IN,
#         INTERACTS_WITH (and of INTERVENTION_INCLUDES, subject owner). Entries carry `registrar: D5`.
#   R-85  subjects / values added (D1.Constituent, D12.FoodItem, D12.FoodCategory; limitKind SCHEDULING_THRESHOLD,
#         LABEL_WARNING_THRESHOLD; sourceKind REFERENCE_MONOGRAPH, SPONTANEOUS_REPORT confirmed); EXCEEDS_DOSE_THRESHOLD is
#         never stored (threshold screens are computed at query time).
#   R-88  USE_CONSTRAINED_IN qualifier section BOXED_WARNING.
#   R-84  CAUSES_ADVERSE_EFFECT object D2.Condition (conditionKind PHENOTYPE | DISEASE); REPORTS_ADVERSE_EXPERIENCE removed
#         (alias); no AdverseEffect node (OQ-D5-03 closed).
#   R-80  PROTOCOL_AUTHORED_BY removed: AUTHORED_BY is registered by D3 (D5.seams.yaml predicateSeams).
#   R-83  RECOMMENDS_AGAINST removed (registered by D9); the "rejected with a Target object" row stays as a rule note.
#   R-52  OFFERS_INTERVENTION removed (registered by D6, predicateSeams).
#   R-53  HOLDS_ROLE / HOLDS_STAKE / RECEIVES_VALUE_FROM removed from predicateOnly (D7 typed relationship types; seams).
# Model stage (Wave 2) by A5, 2026-10-08. Kernel pattern: packets/K/09-reasoning.md (A1). Six relationship types,
# 9 from->to pairs collapsed (R-01: union members counted, an interface target counts 1; packet 8 + 1 for the R-70
# Condition member). Every typed relationship below has a question, a pattern in 03-retrieval-patterns.md, a populating
# tool and a fixture (or, for the R-70 Condition pair, a numbered fixture request).
# Tool ids used here: tool:tavily-extract, tool:firecrawl-scrape, tool:wayback-cdx, tool:openfda-label,
# tool:dailymed-spl-history, tool:pubmed-eutils, tool:hc-nhpid, tool:ks-curation (BellLabs curator agent writing
# vocabulary mappings through intents), tool:ks-projection (Knowledge Services projection job; not yet built).
relationships:
  - type: HAS_EDITION
    module: D5
    class: asserted
    from: Protocol
    to: ProtocolEdition
    declaredOn: [Protocol.editions (OUT)]
    edgeProperties: AssertedEdgeProperties
    exclusive: true
    cardinality: "one_or_more (EXCLUSIVE per protocol: one open episode in valid x recorded time; register field exclusive: true, R-10)"
    temporal: episode
    questions: [Q-D5-10, CQ-PR-01, Q-D5-13, Q-D5-24]
    pattern: "03#Q-D5-10; 03#CQ-PR-01; 03#Q-D5-13"
    populatedBy: [tavily-cli, firecrawl-cli, internet-archive-wayback]
    fixture: final/fixtures/D5/sleep-toolkit-unstructured
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      The only D5 edge that needs a bitemporal episode: which edition of an in-place-versioned page was current when
      (valid time from dated captures, bounded by first/last observation; recorded time service-assigned). Attached by
      kernel state.attach; the authorizing Assertion cites the step locators. The edition node itself is immutable
      and carries no time. Answers "what did protocol P prescribe on date D" and lets D7 interest intervals be
      overlapped with edition intervals (Q-D5-13). Synthesis (R-10): AssertedEdgeProperties (identical field list to the
      removed StateEpisodeProperties); the non-overlap rule is the register field exclusive: true, enforced by the
      executor for this relationship type.

  - type: HAS_STEP
    module: D5
    class: structural
    from: ProtocolEdition
    to: ProtocolStep
    declaredOn: [ProtocolEdition.steps (OUT)]
    edgeProperties: StructuralEdgeProperties
    cardinality: "one_or_more (orderIndex = source order)"
    temporal: recorded-only
    questions: [Q-D5-10, CQ-PR-01, CQ-PR-02, Q-D5-11, Q-D5-12]
    pattern: "03#Q-D5-10; 03#CQ-PR-01; 03#Q-D5-12"
    populatedBy: [tavily-cli, firecrawl-cli, internet-archive-wayback]
    fixture: final/fixtures/D5/sleep-toolkit-unstructured
    nestedOperations: [CREATE, CONNECT]
    aggregate: false
    rationale: >-
      Internal shape of one immutable edition; every protocol question walks it. Recorded time only: the edition is
      immutable and its validity lives on HAS_EDITION. Steps are not shared across editions (a step's identity is
      (edition, stepKey)); unchanged steps are recognized by equal payloadHash, so the diff (CQ-PR-01) needs no edge.
      Structural under R-26 (parts minted with their parent from the same capture); intra-module [CREATE, CONNECT] (R-03).

  - type: STEP_USES
    module: D5
    class: structural
    from: ProtocolStep
    to: Subjectable   # kernel interface; one of the two registered domain exceptions (R-28)
    declaredOn: [ProtocolStep.uses (OUT)]
    admissibleTargets:   # executor-enforced (R-28); per stepKind: MEASURE -> D4.Metric; TAKE -> substance, material, product, food
      - D1.ChemicalSubstance
      - D1.IngredientMaterial
      - D6.Product
      - D12.FoodItem
      - D12.FoodCategory
      - D12.DietaryPattern
      - D5.Intervention
      - D4.Metric
      - D4.Device
    edgeProperties: StructuralEdgeProperties
    cardinality: "zero_or_more per step (one primary means; alternatives are sibling steps sharing alternativeGroup; informational OTHER and CONSULT steps may have none, as fixtures sleep-toolkit-unstructured s09/s12 and pregnancy-magnesium-upper-limit preg-01 show)"
    temporal: recorded-only
    questions: [Q-D5-06, Q-D5-10, Q-D5-11, Q-D5-12, Q-D5-19, CQ-PR-04]
    pattern: "03#Q-D5-12; 03#Q-D5-06; 03#Q-D5-11; 03#Q-D5-19"
    populatedBy: [tavily-cli, firecrawl-cli]
    fixture: final/fixtures/D5/pregnancy-magnesium-upper-limit
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      The join from protocol content to the means the rest of the graph knows about: "which protocols include X"
      (Q-D5-12), the dose-vs-limit comparison (Q-D5-06), the omitted-constraint check (Q-D5-11) and the GDS
      co-occurrence projection (Q-D5-19) all traverse it. Target: the kernel interface Subjectable (adversarial review;
      was union StepMeans of 6). The union cost +2.9 KB / +8 input types, sat at the 6-member limit and could not admit
      D12 DietaryPattern, so a diet had two homes (Intervention kind DIETARY_PATTERN and DietaryPattern); with the
      interface the executor validates the admissible types per stepKind and DIETARY_PATTERN is retired (09 D-05).
      Synthesis: R-28 registers STEP_USES as one of the two domain exceptions targeting Subjectable (K lists it in its
      interface table); the list above is the executor-enforced admissible set; any further domain edge to Subjectable
      needs a K amendment. An eating pattern is reached as D12 DietaryPattern only (R-63). Dose lives on the step node
      (filterable), not on the edge, so no custom edge-property type is needed.

  - type: STATES_CONSTRAINT
    module: D5
    class: derived
    from: ProtocolStep
    to: UseConstraint
    declaredOn: [ProtocolStep.statesConstraints (OUT)]
    edgeProperties: DerivedEdgeProperties
    cardinality: "many"
    temporal: recorded-only (derivedAt)
    questions: [Q-D5-11, CQ-PR-02, Q-D5-03]
    pattern: "03#Q-D5-11; 03#CQ-PR-02"
    populatedBy: [bks-projection-job]
    fixture: final/fixtures/D5/sleep-toolkit-unstructured
    nestedOperations: []
    aggregate: false
    derivationRule: "use-constraint-key/v2 (stated-by-step clause): for each protocol-author USE_CONSTRAINED_IN | INTERACTS_WITH | HAS_UPPER_LIMIT Assertion that cites the step's locatorUid (or a locator inside the step span on the same snapshot) and resolves to a UseConstraint, emit step -> that UseConstraint"
    rationale: >-
      Separates the cautions a protocol states itself ("Don't take theanine if ...", Blueprint's pregnancy avoid-list)
      from the constraints that apply to the same means elsewhere but that the protocol omits (Q-D5-11: an anti-join on
      this edge). Derived since the adversarial review: the edge pointed from immutable edition content to a node whose
      identity a regenerable projection mints, so a rule bump (v1 -> v2 here) would have orphaned it or changed edition
      payloads. Now the same projection that mints the UseConstraint emits the edge from the protocol author's caution
      Assertion whose locator is the step's own; the step payload hashes the verbatim caution fields (statedLevel,
      conditionText), never constraint uids. Replaces pinned HAS_CONSTRAINT -> Constraint and its ConstraintRole edge
      properties (role is derivable from stepKind + statedLevel). DerivedEdgeProperties.score stays null: the edge joins
      two domain entities (R-47).

  - type: RESOLVES_TO_CONSTRAINT
    module: D5
    class: derived
    from: K.Assertion
    to: UseConstraint
    declaredOn: [UseConstraint.resolvedFrom (IN)]
    edgeProperties: DerivedEdgeProperties
    cardinality: "zero_or_one per Assertion; one_or_more per UseConstraint"
    temporal: recorded-only
    questions: [Q-D5-03, Q-D5-04, Q-D5-05, Q-D5-21, Q-D5-23, CQ-RC-06, Q-D5-24, Q-D5-26]
    pattern: "03#Q-D5-23; 03#Q-D5-05; 03#Q-D5-04"
    populatedBy: [bks-projection-job]
    fixture: final/fixtures/D5/sirolimus-label-interactions-harm
    nestedOperations: []
    aggregate: false
    derivationRule: "use-constraint-key/v2"
    rationale: >-
      Groups many asserters' statements (label, clinic, monograph, protocol, forum) of one scoped concern under the
      shared blocking identity. Derived and regenerable (derivationRule use-constraint-key/v2: identity key computed
      from the Assertion's predicate, subject, object, population qualifiers, dose band, route, jurisdiction and timing
      window; v1 had no timing component, OQ-D5-29), so it never carries a level or a confidence; superseded assertions
      drop out by recordedTo. Declared on UseConstraint with direction IN (stored Assertion -> UseConstraint), as R-29
      requires for a domain edge hung on a kernel Assertion; it never feeds adjudication (R-29) and its score stays null
      (R-47). UseConstraint is a projection-minted grouping of safety Assertions, not a Claim, never vetted (R-76). Cut
      alternatives: typed CONSTRAINS_USE_OF (union 5) and CONSTRAINT_SCOPE (union 6) duplicated the resolving
      Assertions' HAS_SUBJECT / HAS_OBJECT (09-reasoning D-07).

  - type: OPERATIONALIZED_BY
    module: D5
    class: asserted
    from: Target
    to: [D4.Biomarker, D4.Metric, D2.Outcome, D2.Condition]   # union TargetMeasure (R-70), owned by D5 (R-05)
    declaredOn: [Target.operationalizedBy (OUT)]
    edgeProperties: AssertedRecordedProperties
    cardinality: "many"
    temporal: recorded-only
    questions: [Q-D5-01, Q-D5-14, Q-D5-20]
    crossPacketQuestions: [Q-D3-04, Q-D3-05, Q-D4-17]   # the main traversers (D3 study evidence -> target; D4 target -> metrics, tests, devices); Q-D3-05 added by R-70
    pattern: "03#Q-D5-01 (study branch, a UNION branch since the adversarial review); 03#Q-D5-20 (TargetMeasure join incl. the Condition member, R-70; the shared-identifier join is retired, R-42)"
    populatedBy: [bks-curation-agent]
    fixture: final/fixtures/D5/antioxidant-exercise-disconfirmation   # Target -> D4 Metric, D4 Biomarker and D2 Outcome
    fixtureRequests:
      - pair: "Target -> D2.Condition"
        ruling: R-70
        request: "final/requests.md RQ-01 (R-06 value-1 exception): condition-coded target join, ASPREE hemorrhage or incident dementia -> a Target"
    nestedOperations: [CONNECT]
    aggregate: false
    rationale: >-
      The only typed edge the targets vocabulary spends (vocab-targets.yaml measuresSeam): lets study evidence reach a
      target (StudyResult -[RESULT_FOR]-> OutcomeDefinition -[MEASURES]-> Metric|Biomarker|Outcome|Condition
      <-[OPERATIONALIZED_BY]- Target, D3 SDL names) and answers "how do I measure
      progress toward T". Curated vocabulary mapping, not an effect claim. Synthesis R-26: a link between independently
      identified records stated by a curator is asserted, with recorded time only (AssertedRecordedProperties); the
      authorizing Assertion carries basis CURATOR_CLASSIFICATION (R-25) and the curation file (vocab-targets) is a kernel
      Source with one snapshot per version. R-70: D2.Condition is the fourth member ("incidence of this condition measures
      the target"; the direction lives in the vocab-targets rule); D2 Outcome stays the endpoint concept D3
      OutcomeDefinition MEASURES. History: the model stage retargeted it from D2 Outcome to D4 Biomarker | Metric; the
      check stage restored D2.Outcome as a third member at D2's request.

predicateOnly:
  # Assertion.predicate values registered by D5 (R-52; kernel Assertion; subject/object through HAS_SUBJECT / HAS_OBJECT).
  # Qualifier syntax in Assertion.qualifiers: "<key>:<value>"; `population:<PopulationGroup code | D3 StudyPopulation uid>`
  # is a REQUIRED qualifier on every predicate below except INTERVENTION_INCLUDES (UNSPECIFIED when unnamed; R-52 names it).
  - predicate: INTENDED_FOR_TARGET
    registrar: D5
    subject: "any means (D1 ChemicalSubstance | IngredientMaterial, D6, D12 FoodItem | FoodCategory | DietaryPattern, D5 Intervention/Protocol/ProtocolEdition, D4 device-as-product)"
    object: D5.Target
    value: none (no effect implied)
    qualifiers: [population, claimClass (STRUCTURE_FUNCTION | DISEASE_CLAIM | APPROVED_INDICATION | PERMITTED_NHP_CLAIM | NONE_STATED)]
    requiredQualifiers: [population]
    questions: [Q-D5-15, Q-D5-01]
    promoteWhen: "never as a typed means->Target edge (vocab seamRule); a derived SERVES_TARGET projection only if Q-D5-01 latency needs it"
    ruling: "R-52 (sole registrar; D1, D6, D8, D12 registrations collapsed); R-85 (subject D12.FoodCategory)"
  - predicate: IMPROVES_TARGET
    registrar: D5
    subject: any means (as INTENDED_FOR_TARGET, incl. D12.FoodCategory)
    object: D5.Target
    qualifiers: [population, dose, duration, coExposure, outcomeUid]
    requiredQualifiers: [population]
    questions: [Q-D5-01, Q-D5-28]
    promoteWhen: same as INTENDED_FOR_TARGET
    ruling: "R-52; R-85"
  - predicate: WORSENS_TARGET
    registrar: D5
    subject: any means (as INTENDED_FOR_TARGET, incl. D12.FoodCategory)
    object: D5.Target
    qualifiers: [population, dose, duration, coExposure (e.g. coExposure:hu:intervention:endurance-training), outcomeUid]
    requiredQualifiers: [population]
    questions: [Q-D5-02, Q-D5-14, Q-D5-20]
    promoteWhen: same as INTENDED_FOR_TARGET
    note: "a guideline 'recommends against X for goal T' is WORSENS_TARGET | NO_EFFECT_ON_TARGET (or USE_CONSTRAINED_IN) with speechAct CAUTIONS | RECOMMENDS (R-83)"
    ruling: "R-52; R-85; R-83"
  - predicate: NO_EFFECT_ON_TARGET
    registrar: D5
    subject: any means (as INTENDED_FOR_TARGET, incl. D12.FoodCategory)
    object: D5.Target
    qualifiers: [population, dose, duration, outcomeUid]
    requiredQualifiers: [population]
    questions: [Q-D5-14, Q-D5-02]
    promoteWhen: same as INTENDED_FOR_TARGET
    ruling: "R-52; R-85"
  - predicate: MIXED_EFFECT_ON_TARGET
    registrar: D5
    subject: any means (as INTENDED_FOR_TARGET, incl. D12.FoodCategory)
    object: D5.Target
    qualifiers: [population, dose, coExposure, outcomeUid]
    requiredQualifiers: [population]
    questions: [Q-D5-02, Q-D5-14]
    promoteWhen: same as INTENDED_FOR_TARGET
    ruling: "R-52; R-85"
  - predicate: USE_CONSTRAINED_IN
    registrar: D5
    subject: means (substance, material, product, food, intervention)
    object: D2.Condition when the scope is a condition; none when the scope is only a population code
    value: "valueString = ConstraintLevel code (CONTRAINDICATED, AVOID, ...); proposition = verbatim directive"
    qualifiers: [population, section (CONTRAINDICATIONS | WARNINGS | PRECAUTIONS | CAUTIONS | BOXED_WARNING | PROTOCOL_TEXT ...), window, route, jurisdiction]
    requiredQualifiers: [population]
    resolvesTo: UseConstraint (kind CONDITION or POPULATION)
    questions: [Q-D5-03, Q-D5-11, Q-D5-21, Q-D5-23]
    promoteWhen: "a typed CONSTRAINS_USE_OF / CONSTRAINT_SCOPE pair if Q-D5-23 latency through Assertions exceeds budget (09 'twice the budget')"
    note: "a prescription-drug boxed warning is this predicate with section:BOXED_WARNING; the asserter is the labeler of record (R-88, R-23)"
    ruling: "R-52; R-88 (section BOXED_WARNING)"
  - predicate: INTERACTS_WITH
    registrar: D5
    subject: "affected means (victim, e.g. sirolimus); D12.FoodCategory admitted (R-85)"
    object: co-exposure means (perpetrator, e.g. grapefruit juice, St John's wort, an Intervention such as endurance training)
    value: "valueString = ConstraintLevel code; proposition = verbatim directive"
    qualifiers: [population, exposureChange (INCREASES_EXPOSURE | DECREASES_EXPOSURE | REDUCES_ABSORPTION | ADDITIVE_EFFECT | ANTAGONIZES_EFFECT | UNKNOWN; per asserter, never a UseConstraint property since the adversarial review), mechanism (free text, e.g. CYP3A4), window, stance (AVOID | DELIBERATE_USE)]
    requiredQualifiers: [population]
    resolvesTo: UseConstraint (kind INTERACTION)
    questions: [Q-D5-04, Q-D5-05, Q-D5-19, Q-D5-27]
    promoteWhen: same as USE_CONSTRAINED_IN
    ruling: "R-52; R-85"
  - predicate: HAS_UPPER_LIMIT
    registrar: D5
    subject: "substance or material (with intake scope); D1.Constituent admitted (R-85)"
    object: none (typed literal)
    value: "valueNumber + unitCode (UCUM, per day); valueString = DO_NOT_EXCEED_DOSE"
    qualifiers: [population, ageBand, intakeScope (SUPPLEMENTAL_ONLY | TOTAL_INTAKE | NOT_STATED), limitKind (UL | MONOGRAPH_MAX | LABEL_MAX | PROTOCOL_MAX | SCHEDULING_THRESHOLD | LABEL_WARNING_THRESHOLD; PROTOCOL_MAX = a protocol author's own ceiling, e.g. Blueprint "limit caffeine to 200 mg daily" in pregnancy)]
    requiredQualifiers: [population]
    resolvesTo: UseConstraint (kind DOSE_LIMIT, dose band GT value)
    questions: [Q-D5-06, Q-D5-09, Q-D5-21]
    promoteWhen: "never (a literal; the comparison is computed at query time over the materialized daily amounts; EXCEEDS_DOSE_THRESHOLD is never stored, only written inside a published Report, R-85)"
    ruling: "R-52; R-85 (subject D1.Constituent; limitKind SCHEDULING_THRESHOLD, LABEL_WARNING_THRESHOLD)"
  - predicate: HAS_AUTHORIZED_DOSE_RANGE
    registrar: D5
    subject: "substance or material; D1.Constituent admitted (R-85)"
    object: none (typed literal)
    value: "valueString = 'min-max unit/period' verbatim; qualifiers carry doseMin/doseMax/doseUnit/dosePeriod (dosePeriod value from D6 AmountBasis, R-58)"
    qualifiers: [population, use (e.g. 'all uses except jet lag'), jurisdiction]
    requiredQualifiers: [population]
    questions: [Q-D5-06, Q-D5-21]
    promoteWhen: never
    ruling: "R-52; R-85 (subject D1.Constituent)"
  - predicate: CAUSES_ADVERSE_EFFECT
    registrar: D5
    subject: "means (D1 ChemicalSubstance | IngredientMaterial, D6.Product, D5.Intervention); D12.FoodItem and D12.FoodCategory admitted (R-85)"
    object: "D2.Condition (conditionKind PHENOTYPE | DISEASE; adverse-effect term; MedDRA/MeSH/HPO ids attach to the Condition; R-84)"
    value: "valueString = frequency text as stated ('~5%', 'common'); valueNumber = frequency when numeric"
    qualifiers: [population, dose, schedule, route, severity (<scheme>:<grade>, scheme CTCAE_V5 | CTCAE_V6 | LABEL_TEXT | SOURCE_TEXT), context (OVERDOSE | ACCIDENTAL_INGESTION | THERAPEUTIC), sourceKind (LABEL | TRIAL_ARM | CASE_REPORT | SPONTANEOUS_REPORT | REFERENCE_MONOGRAPH | PROTOCOL_AUTHOR | COMMUNITY)]
    requiredQualifiers: [population]
    aliases: [REPORTS_ADVERSE_EXPERIENCE]
    questions: [Q-D5-07, Q-D5-09, Q-D5-20]
    promoteWhen: "never as a typed edge to an AdverseEffect node (none exists; OQ-D5-03 closed by R-84)"
    note: "the only adverse-effect predicate: a community report carries basisKind PERSONAL_EXPERIENCE and sourceKind:COMMUNITY and is aggregated only by a D5 safety-signal Assessment; SPONTANEOUS_REPORT confirmed for CAERS (R-84, R-85)"
    ruling: "R-52; R-84; R-85 (subjects D12.FoodItem, D12.FoodCategory; sourceKind REFERENCE_MONOGRAPH)"
  - predicate: INTERVENTION_INCLUDES
    registrar: D5
    subject: D5.Intervention (COMBINATION or named regimen)
    object: substance, product or Intervention
    qualifiers: [dose, role]
    questions: [Q-D5-25, Q-D5-28]
    promoteWhen: "Q-D5-25 identity matching needs component traversal (typed INTERVENTION_COMPONENT)"
    renamedFrom: "HAS_COMPONENT (adversarial review: same name as D3's typed StudyArm -HAS_COMPONENT-> InterventionComponent, which D5's own Q-D5-01 / Q-D5-25 traverse)"
    ruling: "R-52 rule 3 (owner of the subject type)"

# Rule notes kept after R-83 / R-84 (not registrations):
ruleNotes:
  - predicate: "RECOMMENDS_AGAINST with a D5.Target object"
    registrar: D9 (R-83)
    status: "rejected for goal statements: with a Target object use one of the five goal predicates (WORSENS_TARGET | NO_EFFECT_ON_TARGET, or USE_CONSTRAINED_IN for population/condition guidance) with speechAct RECOMMENDS or CAUTIONS; RECOMMENDS_AGAINST (D9) takes a means subject and never a Target object, a goal goes in the qualifier target:<key> (R-83; OQ-D5-40 closed)"
  - predicate: REPORTS_ADVERSE_EXPERIENCE
    status: "removed (R-84): alias of CAUSES_ADVERSE_EFFECT with basisKind PERSONAL_EXPERIENCE, qualifier sourceKind:COMMUNITY, object a D2 Condition"

# Removed from this register in synthesis (registered elsewhere; listed in D5.seams.yaml predicateSeams or seams):
removedPredicates:
  - {predicate: PROTOCOL_AUTHORED_BY, ruling: R-80, now: "AUTHORED_BY, registrar D3 (subjects D3.Publication | D5.Protocol | D5.ProtocolEdition; objects D7.Person | D7.Organization)"}
  - {predicate: OFFERS_INTERVENTION, ruling: "R-52, R-94", now: "registrar D6 (subjects D6.Offer | D6.Product(SERVICE) | D7.Organization; object D5.Intervention)"}
  - {predicate: "HOLDS_ROLE | HOLDS_STAKE | RECEIVES_VALUE_FROM", ruling: "R-53, R-78", now: "D7 typed relationship types (Shape B), each authorized by an Assertion with that predicate; cited as seams"}
  - {predicate: RECOMMENDS_AGAINST, ruling: R-83, now: "registrar D9"}
  - {predicate: REPORTS_ADVERSE_EXPERIENCE, ruling: R-84, now: "alias of CAUSES_ADVERSE_EFFECT"}

deferred:
  - {type: CONSTRAINS_USE_OF, reason: "UseConstraint -> subject means (union 5): duplicates the resolving Assertions' HAS_SUBJECT; every question reaches the subject through RESOLVES_TO_CONSTRAINT + HAS_SUBJECT (09 D-07)"}
  - {type: CONSTRAINT_SCOPE, reason: "UseConstraint -> condition / population / co-exposure (union 6+): duplicates HAS_OBJECT and the population qualifier; population codes are the scopePopulations property"}
