      - legacyElementId
      - legacyId
      - legacyLabel
      - legacyExportDigest
      - mapVersion
    writers:
      - bks_migrator (scripts/migration, packages/kg-ops/src/migration)
    projection: excluded
    agentWrite: forbidden
    typedReads: excluded
    source: migration/legacy-map.yaml policy.legacyPreservation.migratedFrom
properties:
  - name: legacyLabels
    "on": LegacyV0
    type: "[String!]"
    meaning: original legacy labels of the preserved node
    writers:
      - bks_migrator (scripts/migration, packages/kg-ops/src/migration)
    projection: excluded
    agentWrite: forbidden
    source: migration/legacy-map.yaml policy.legacyPreservation.relabel.effect
  - name: legacyExportDigest
    "on": LegacyV0 | MIGRATED_FROM
    type: String (sha256:...)
    meaning: digest of the verified legacy export the migration ran from (rollback / accounting key)
    writers:
      - bks_migrator (scripts/migration, packages/kg-ops/src/migration)
    projection: excluded
    agentWrite: forbidden
    source: migration/legacy-map.yaml policy.legacyPreservation
qualifierFamilies:
  - family: "legacy:"
    members:
      - legacy:recordedFrom=
      - legacy:extractedAt=
      - legacy:runId=
    meaning: source-stated legacy system metadata carried on migrated Assertions; never a v2 clock or run id
    writers:
      - bks_migrator (scripts/migration, packages/kg-ops/src/migration)
    projection: excluded
    agentWrite: forbidden
    source: migration/legacy-map.yaml (legacy:recordedFrom, legacy:runId; legacy:extractedAt for the legacy extraction time)
ddl:
  - name: ks_intent_marker_dispatch_id
    kind: index
    label: KsIntentMarker
    properties:
      - dispatchId
    purpose: "marker lookup by the Knowledge Services dispatch id that applied it (outbox consumer and official reads, R-SV11); not unique: uniqueness is ks_intent_marker_key because one dispatch names exactly one effect key and dispatch ids are unique per tenant only"
    source: "R-SV11 (Sprint V SV-11 dispatch consumer)"
  - name: ks_intent_marker_marker_digest
    kind: index
    label: KsIntentMarker
    properties:
      - markerDigest
    purpose: "marker lookup by the verified acknowledgment digest recorded in knowledge_verification.dispatch_outbox.ack_digest (R-SV11)"
    source: "R-SV11 (Sprint V SV-11 dispatch consumer)"
markerShapes:
  KsIntentMarker: "unique on markerKey (ks_intent_marker_key) = mk-<sha256(canonical{installationId, applicationId, tenantId, effectKey})> (S3 markerKeyOf); effectKey is the executor effect key or migration:<migrationRunId>:<batchId> for migration batches (indexed, ks_intent_marker_effect_key_lookup; no longer unique on its own); a migration batch is representable as markerKeyOf({installationId, applicationId: <migrator application id>, tenantId}, 'migration:<runId>:<batchId>'), so migrator markers share the executor's idempotence and must carry markerKey (Enterprise ks_intent_marker_key_exists); planRef = the plan ref, or the migrationRunId for migration batches (ks_intent_marker_plan_ref); persisted status applied|failed (applying is never committed; unresolved is a receipt outcome reconciled by lookup); also effectKey, scope, intentId, intentDigest, planDigest, attempts (JSON), receipt, receiptId, lastAttemptId, graphRevision; v2.2.0 (R-SV11) dispatch admission fields, written in the same apply transaction when a Knowledge Services dispatch applies the effect: markerSchemaVersion (bks-intent-marker.v2), dispatchId (index ks_intent_marker_dispatch_id), markerDigest (sha256 over canonical {payloadDigest, planDigest}; index ks_intent_marker_marker_digest), payloadDigest, boundEffectDigest, useDecisionRef, useDecisionDigest, revocationEpoch, appliedAt; a later dispatch of the same effect key never rewrites them (duplicate)"
  KsRevocationFence: "exactly one node {id: 'canonical', generation, updatedAt} (ks_revocation_fence_id; Enterprise ks_revocation_fence_generation_exists); the local revocation fence of the admission witness"
  KsReleaseMarker: "{releaseId (unique, ks_release_marker_release_id), schemaReleaseDigest, ddlDigest, installedAt (index ks_release_marker_installed), migrationRunId} written last by the migrator after DDL and migration checks; Enterprise existence constraints on releaseId, schemaReleaseDigest, ddlDigest, installedAt"
  KsWriteFence: "exactly one node {id: 'canonical', graphRevision, lockSeq, locked, lastEffectKey, lastWriterRunId, updatedAt} (ks_write_fence_id; Enterprise ks_write_fence_lock_seq_exists); every canonical write, migration batches included, takes the lock first with SET f.lockSeq = f.lockSeq + 1; graphRevision advances only when graph effects commit; locked is the executor's lock flag"
executorReconciliation:
  rule: ddl/required.cypher of the release is the single DDL authority; kg ensure-operations should apply loadRelease().ddl.required (and .enterprise on Enterprise) instead of its own operationalDdl() list
  source: packages/kg-ops/src/fence.ts operationalDdl() (S3)
  adopted:
    - s3: ks_write_fence_id
      release: ks_write_fence_id
      note: same name and definition
    - s3: ks_revocation_fence_id
      release: ks_revocation_fence_id
      note: same name and definition (new in v2.0.1)
    - s3: ks_intent_marker_key
      release: ks_intent_marker_key
      note: same name and definition (new in v2.0.1); the v2.0.0 uniqueness on effectKey (ks_intent_marker_effect_key) is replaced by the index ks_intent_marker_effect_key_lookup; ddl.json migrationCommands drops the old constraint on graphs that received v2.0.0 DDL
    - s3: rel_uid_<lowercase type> (relationshipUid per asserted type)
      release: rel_<TYPE>_uid
      note: same definition under the release naming scheme (rel_<TYPE>_assertion / _writer / _uid)
  notAdopted:
    - s3: ks_release_marker_id
      release: ks_release_marker_release_id
      reason: equivalent uniqueness already defined under the release name since v2.0.0; a second name would fail as an equivalent constraint
    - s3: identifier_scheme_issuer_value
      release: identifier_key
      reason: equivalent (scheme, issuer, value) uniqueness already defined (query-patterns D-1)
    - s3: claim_proposition_hash (index)
      release: claim_proposition_hash (uniqueness constraint)
      reason: the release defines Claim.propositionHash as UNIQUE under the same name; its backing index serves the lookup; S3's CREATE INDEX of the same name conflicts and must be dropped from operationalDdl()
    - s3: capture_attempt_subject
      release: capture_subject
      reason: equivalent index already defined (query-patterns D-1)
    - s3: activity_run (index on externalRunSystem, runId)
      release: activity_run (uniqueness constraint)
      reason: the release enforces (externalRunSystem, runId) uniqueness (kernel P2, one Activity per run) under the same name; the backing index serves the lookup
    - s3: uid_<lowercase label>
      release: entity_uid + uid_<Label>
      reason: equivalent per-label uid uniqueness already defined; release names are stable since v2.0.0
