types:
  Activity:
    identityKeys:
      - externalRunSystem
      - runId
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  Adjudication:
    identityKeys:
      - judgmentId
      - else (assertion, adjudicationKind, methodVersion, recordedAt)
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  Agent:
    identityKeys:
      - agentKind
      - model
      - promptVersion
      - skillVersion
      - toolVersion
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  AlgorithmVersion:
    identityKeys:
      - (familyKey, realization, versionLabel)
      - else (familyKey, realization, issuer, versionPinnedAt) with versionBasis
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  AssayVersion:
    identityKeys:
      - payloadHash (identity fields + performing lab uid; + snapshot digest when any identity field is NOT_REPORTED)
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  Assertion:
    identityKeys:
      - subject
      - predicate
      - object or literal
      - asserter
      - locator set
      - validity
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  Assessment:
    identityKeys:
      - assessmentKind
      - subjects
      - methodVersion
      - inputSetDigest
      - recordedAt
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  Association:
    identityKeys:
      - associationKind
      - memberUids
      - methodVersion
      - inputSetDigest
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  Award:
    identityKeys:
      - (award number, issuer as printed) as a kernel Identifier (AWARD_NUMBER / NIH_PROJECT)
      - (normalized title, start year, issuer as printed) when no number exists
    identifierSchemes:
      - AWARD_NUMBER
      - NIH_PROJECT
      - DOI
    activeIdentifierSchemes:
      - AWARD_NUMBER
      - NIH_PROJECT
      - DOI
    nameProperties:
      - name
  Biomarker:
    identityKeys:
      - curated slug (hu:biomarker:<slug>)
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  Brand:
    identityKeys:
      - (normalized brand name, brandKind, holder organization at first capture)
    identifierSchemes:
      - WIKIDATA
      - WEB_DOMAIN
    activeIdentifierSchemes:
      - WIKIDATA
    nameProperties:
      - name
  CaptureAttempt:
    identityKeys:
      - uid
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  CertificationListing:
    identityKeys:
      - issuedBy.uid
      - programme
      - listingId (else canonical listing URL)
    identifierSchemes:
      - CERT_LISTING
    activeIdentifierSchemes:
      - CERT_LISTING
    nameProperties:
      - name
  Channel:
    identityKeys:
      - platform
      - platformAccountId
    identifierSchemes:
      - PODCAST_INDEX_FEED
      - ISSN
      - WIKIDATA
      - YOUTUBE_CHANNEL
      - APPLE_PODCAST
      - SPOTIFY
      - X_ACCOUNT
    activeIdentifierSchemes:
      - WIKIDATA
      - APPLE_PODCAST
    nameProperties:
      - name
      - handle
  ChemicalSubstance:
    identityKeys:
      - UNII
      - INCHIKEY (when no UNII)
      - (normalized preferred name, substanceClass) provisional
    identifierSchemes:
      - UNII
      - INCHIKEY
      - PUBCHEM_CID
      - CAS_RN
      - CHEBI
      - DRUGBANK
      - RXCUI
      - MESH
      - WIKIDATA
    activeIdentifierSchemes:
      - UNII
      - INCHIKEY
      - PUBCHEM_CID
      - CHEBI
      - RXCUI
      - MESH
      - WIKIDATA
    nameProperties:
      - name
  Chunk:
    identityKeys:
      - snapshot
      - textVersionHash
      - chunkerVersion
      - chunkIndex
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  Claim:
    identityKeys:
      - propositionHash
    identifierSchemes: []
    activeIdentifierSchemes: []
    nameProperties:
      - name
  Condition:
    identityKeys:
      - MONDO identifier when present
      - key
    identifierSchemes:
      - MONDO
      - ICD10CM
      - HPO
      - SNOMEDCT
      - MESH
      - WIKIDATA
      - ORPHANET
      - OMIM
      - EFO
