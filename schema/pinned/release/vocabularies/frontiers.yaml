# (00-DIRECTIVE 3.7; 02-TEAM "Shared vocabularies"). Owner D13 (agent A7). Wave 0 publication.
# Consumers reference it in their 10-seams.yaml under `sharedVocabularies` as
#   frontiers: packets/D13/vocab-frontiers.yaml@0.2.1   (any @0.2.x is compatible: patch releases change no id)
# and NEVER re-declare a Frontier node, a frontier enum, an event-kind enum or an event-to-event edge.
# Choices, alternatives and the reasoning behind every section: _notes/vocab-frontiers-notes.md.
# Citations: section 0 (`citations:`), referenced by id (C01 ...). Every example is a NAME or a REGISTRY ID only;
