  C77: {url: "https://www.sec.gov/Archives/edgar/data/1157601/000119312522311537/d434336d8k.htm", title: "Madrigal Pharmaceuticals, Inc. Form 8-K filed 2022-12-23 (Items 1.01, 5.03, 7.01, 8.01, 9.01): loan milestone satisfied as a result of the MAESTRO-NASH topline announcement; equity financing (sha256 416740c7...)", retrieved: 2026-10-08}
  C78: {url: "https://ir.bioagelabs.com/news-releases/news-release-details/bioage-labs-announces-discontinuation-strides-phase-2-clinical", title: "BioAge Labs Announces Discontinuation of STRIDES Phase 2 Clinical Trial Evaluating Azelaprag in Combination with Tirzepatide for the Treatment of Obesity (2024-12-06; sha256 37feb9da...)", retrieved: 2026-10-08}
  C79: {url: "https://www.sec.gov/Archives/edgar/data/1157601/000119312524084797/d818318d8k.htm", title: "Madrigal Pharmaceuticals, Inc. Form 8-K 2024-04-02: underwriters' option exercise closing of the offering; no stated basis (sha256 b5fff676...)", retrieved: 2026-10-08}

# ---------------------------------------------------------------------------------------------
# 1. The node that carries the frontier vocabulary (proposal for the D13 SDL stage)
# ---------------------------------------------------------------------------------------------
node:
  type: Frontier
  labels: [Frontier, Entity]
  uidPattern: "hu:frontier:<slug>"   # slug = the part after "frontier:" in `id`
  idPattern: "frontier:<slug>"       # stable vocabulary key, stored as property `key`; never reused, never renamed
  identityKeys: [key]
  properties:                        # all scalar; the frontier itself declares no relationship fields except ON_FRONTIER (incoming)
    key: "String! unique (e.g. frontier:senolytics-in-humans)"
    label: "String! (stored in the kernel Entity field `name`; no separate label property in the SDL)"
    definition: "String! one paragraph: the goal, phrased as a capability not yet reliably achieved in humans"
    level: "Int (1 theme, 2 frontier); max 2 levels"
    parentKey: "String (null at level 1). Hierarchy is a property, no relationship type spent (same choice as D5 targets)"
    granularity: "FrontierGranularity enum THEME | MODALITY | MECHANISM | DISEASE_GOAL | REGULATORY_PATH | POPULATION"
    synonyms: "[String!] feeds fulltext FrontierSearch(label, synonyms, definition) for entity linking of frontier phrases"
    targetKeys: "[String!] curated relevance mapping to D5 target keys (vocabulary-to-vocabulary, NOT an effect claim; see seamRule)"
    curationStatus: "FrontierCurationStatus enum ACTIVE | DORMANT | MATURED | DEPRECATED (a curation decision recorded with a vocab version bump and a rationale citing events; never a judgment of success). MATURED (0.2.1) is a vocabulary-retirement state — the frontier stops admitting new milestone attachments — whose bump rationale must cite an accepted BREAKTHROUGH_JUDGMENT Assessment about the Frontier; it is never set by a progress computation and it is not a progress measure (notStoredOnFrontier)"
    replacedBy: "String (key of successor when DEPRECATED)"
    vocabVersion: "String! (version of this file at creation / last edit)"
  notStoredOnFrontier:
    - "stage / progress / 'furthest milestone reached' — computed from ON_FRONTIER events (QF-02); may be a materialized projection with a method version, never a curated property"
    - "breakthrough flag, hype score, investor sentiment, success probability — assessments (D10) or projections, never properties (directive 3.2, 3.6)"
    - "lists of organizations / compounds / trials — reached through events and studies (QF-03); the `examples` in this file are curation aids, not graph data"
  disambiguation:
    - "NOT a D5 Target: a target is what a person pursues (sleep, longevity); a frontier is what the field pursues (senolytics in humans). Mapped by `targetKeys`."
    - "NOT a Condition or Mechanism (D2): 'curing pancreatic cancer' is anchored on the condition but is a goal-state of the field; the condition stays in D2 and is named in `scope.anchors` only."
    - "NOT a therapeutic class or modality node: a modality (in vivo CAR-T) appears as a frontier only when the field tracks it as a goal with milestones still unreached."
    - "NOT a narrative arc (no NarrativeArc type in the final SDL): an arc is an assessment that selects and orders events into a story (D10 seam); a frontier is the stable bucket events attach to."
    - "NOT a market segment or index: no market size, no valuation on the frontier."

# ---------------------------------------------------------------------------------------------
# 2. Admission and granularity rules (how a frontier gets into, and out of, this list)
# ---------------------------------------------------------------------------------------------
admissionRule:
  mustAll:
    - "A goal phrased as a capability the field is pursuing and has not reliably achieved in humans (or in the named population), with at least one unreached rung on the milestone ladder (section 4)."
    - "Tracked by investors or researchers as a unit: at least two independent organizations or two registered trials active on it, evidenced by citations in `examples`."
    - "Answerable: at least one seed question (QF-01..QF-08) is worth asking about it."
    - "Distinct: an event would rarely need more than two frontiers; if two candidates share most events, merge them and keep the other as a synonym."
  granularity: >-
    Choose the level at which a milestone means the same thing for every member. A disease goal ('curing pancreatic
    cancer') when the milestones are disease outcomes; a modality ('in vivo CAR-T') when the milestones are modality
    firsts (first-in-human, first approval) regardless of disease; a mechanism ('senolytics') when the mechanism is
    what is being validated. Never a single product or a single company.
  hierarchy: "Two levels only. Level 1 themes group frontiers for browsing and aggregate timelines; an event attaches to a level-2 frontier (or a level-1 theme only when no child fits). Each frontier has one parent; cross-links use `related` (names only, no edge)."
  lifecycle: "Add, merge, deprecate or retire only by a version bump of this file with a rationale in _notes/vocab-frontiers-notes.md. Retiring a frontier as MATURED requires an accepted BREAKTHROUGH_JUDGMENT Assessment (kernel) that the bump cites; the frontier keeps its node and events, stops admitting new attachments, and its progress stays computed (QF-02), never stored."
  sizeTarget: "20-30 frontiers (brief: 20-40; coordinator: 12-25). Growth needs a question id; the vocabulary is curated, not crowd-sourced."

# ---------------------------------------------------------------------------------------------
# 3. The frontiers (7 themes + 18 frontiers = 25; 0.2.0 added frontier:mash-fibrosis-resolution)
#    examples: names and registry ids only, each with citation ids. events: dated examples for fixtures and
#    for checking that the milestone kinds fit; they are NOT graph data until captured as Assertions.
#    targetKeys: D5 target keys (final/vocabularies/targets.yaml@0.2.2; ids unchanged since 0.1.0).
# ---------------------------------------------------------------------------------------------
frontiers:

  # ===== Theme 1: geroscience =====
  - id: frontier:geroscience-in-humans
    label: Targeting the biology of aging in humans
    level: 1
    parent: null
    granularity: THEME
    definition: >-
      Interventions that act on hallmarks of aging (cellular senescence, epigenetic alteration, deregulated nutrient
      sensing, mitochondrial dysfunction and others) and show benefit in people on age-related function, multiple
      age-related diseases, or validated aging endpoints, rather than on one disease.
    scope:
      includes: [hallmark-targeted interventions in humans, aging as an indication, aging biomarkers as trial endpoints, veterinary lifespan drugs as translational signal]
      excludes: [single-disease therapies whose mechanism happens to be aging-related unless the sponsor frames them as aging-targeted, consumer supplements without a trial program]
      anchors: {mechanisms: [hallmarks of aging (C70)]}
    milestoneKinds: [ms:first-in-human, ms:randomized-readout, ms:pivotal-readout, ms:regulatory-path-accepted, ms:first-approval, ms:major-financing, ms:setback]
    targetKeys: [target:longevity]
    synonyms: [geroscience, longevity biotech, healthspan extension, anti-aging therapeutics, aging biology therapeutics]
    examples:
      papers: [{name: "Hallmarks of aging: An expanding universe", pmid: "36599349", cite: C70}]

  - id: frontier:senolytics-in-humans
    label: Senolytics in humans
    level: 2
    parent: frontier:geroscience-in-humans
    granularity: MECHANISM
    definition: >-
      Drugs that selectively eliminate senescent cells (senolytics) or suppress their secretory phenotype
      (senomorphics) producing clinical benefit in human age-related disease or function.
    scope:
      includes: [small-molecule senolytics (dasatinib + quercetin, fisetin, BCL-xL inhibitors), local senolytics (intravitreal, intra-articular), senomorphics in trials]
      excludes: [senolytic claims on consumer supplements without a registered trial (D6 product claims)]
      anchors: {mechanisms: [cellular senescence, BCL-2 family anti-apoptotic proteins]}
    milestoneKinds: [ms:first-in-human, ms:randomized-readout, ms:pivotal-readout, ms:first-approval, ms:setback]
    targetKeys: [target:longevity]
    synonyms: [senolytic therapy, senotherapeutics, senescent cell clearance, senomorphics]
    examples:
      organizations: [{name: Unity Biotechnology, cite: [C03, C04, C05]}, {name: Mayo Clinic, cite: [C06, C07]}]
      compounds: [{name: "foselutoclax (UBX1325)", cite: [C03, C04]}, {name: "dasatinib + quercetin", cite: [C06, C07]}]
      trials: [{nct: NCT05275205, cite: C03}, {nct: NCT06011798, cite: C04}, {nct: NCT02848131, cite: C06}]
      papers: [{name: "Senolytics in idiopathic pulmonary fibrosis: first-in-human pilot", pmid: "30616998", cite: C07}]
      events:
        - {date: 2025-05-05, kind: READOUT, what: "UNITY reports complete 36-week ASPIRE Phase 2b results for UBX1325 in DME", cite: C05}

  - id: frontier:partial-epigenetic-reprogramming
    label: Partial epigenetic reprogramming
    level: 2
    parent: frontier:geroscience-in-humans
    granularity: MODALITY
    definition: >-
      Transient or partial expression of reprogramming factors (for example OSK/OSKM subsets) or reprogramming-like
      interventions that restore youthful epigenetic state and tissue function without loss of cell identity,
      reaching human trials and showing safety and benefit.
    scope:
      includes: [in vivo gene-delivered reprogramming factors, mRNA/small-molecule reprogramming cocktails, ex vivo reprogrammed cell therapies framed as rejuvenation]
      excludes: [full iPSC reprogramming for cell manufacturing (regenerative medicine)]
      anchors: {mechanisms: [epigenetic alteration, Yamanaka factors]}
    milestoneKinds: [ms:regulatory-path-accepted, ms:first-in-human, ms:randomized-readout, ms:major-financing, ms:setback]
    targetKeys: [target:longevity]
    synonyms: [cellular rejuvenation, epigenetic rejuvenation, partial reprogramming, OSK therapy, rejuvenation biotech]
    examples:
      organizations: [{name: Life Biosciences, cite: [C08, C09, C10]}, {name: Retro Biosciences, cite: C12}, {name: NewLimit, cite: C13}]
      compounds: [{name: "ER-100 (OSK gene therapy)", cite: [C08, C09]}]
      trials: [{nct: NCT07290244, cite: C08}]
      papers: [{name: "Reprogramming to recover youthful epigenetic information and restore vision", pmid: "33268865", cite: C11}]
      events:
        - {date: 2026-01-28, kind: REGULATORY_ACCEPTANCE, what: "FDA clears IND for ER-100 (company: first partial epigenetic reprogramming therapy to reach human trials)", cite: C09}
        - {date: 2026-06-09, kind: TRIAL_START, what: "first participant dosed in ER-100 Phase 1", cite: C10}
        - {date: 2026-05-22, kind: FINANCING, what: "Retro Biosciences initial close of financing round", cite: C12}

  - id: frontier:mtor-inhibition-healthy-aging
    label: mTOR inhibition for healthy aging
    level: 2
    parent: frontier:geroscience-in-humans
    granularity: MECHANISM
    definition: >-
      Rapamycin, rapalogs or selective TORC1 inhibitors given to healthy or older people to slow aging-related
      decline (immune, muscle, metabolic, function), shown in randomized trials.
    scope:
      includes: [intermittent low-dose rapamycin, TORC1-selective inhibitors, everolimus in older adults]
      excludes: [mTOR inhibitors in oncology or transplant indications]
      anchors: {mechanisms: [deregulated nutrient sensing, mTORC1]}
    milestoneKinds: [ms:randomized-readout, ms:pivotal-readout, ms:setback]
    targetKeys: [target:longevity, target:immune-function, target:muscle-mass]
    synonyms: [rapamycin for longevity, rapalogs, TORC1 inhibition, mTOR geroprotection]
    examples:
      organizations: [{name: AgelessRx, cite: [C14, C15]}, {name: resTORbio, cite: C16}]
      compounds: [{name: rapamycin (sirolimus), cite: [C14, C15]}, {name: "RTB101", cite: C16}]
      trials: [{nct: NCT04488601, cite: C14}]
      papers: [{name: "PEARL trial results", pmid: "40188830", cite: C15}]
      events:
        - {date: null, kind: READOUT, what: "resTORbio PROTECTOR 1 Phase 3 (RTB101) failed its primary endpoint (disconfirmation example; date to capture from primary)", cite: C16}

  - id: frontier:nad-restoration
    label: NAD+ restoration
    level: 2
    parent: frontier:geroscience-in-humans
    granularity: MECHANISM
    definition: >-
      Raising NAD+ levels with precursors (nicotinamide riboside, nicotinamide mononucleotide) or enzyme modulators
      producing clinically meaningful benefit in aging or age-related disease in randomized human trials.
    scope:
      includes: [NR, NMN, NAD+ infusions in trials, CD38 inhibition framed as NAD restoration]
      excludes: [marketing claims without a trial (D6), niacin for dyslipidemia]
      anchors: {mechanisms: [NAD+ metabolism, mitochondrial dysfunction]}
    milestoneKinds: [ms:randomized-readout, ms:regulatory-status-change, ms:setback]
    targetKeys: [target:longevity, target:energy, target:cardiometabolic-health]
    synonyms: [NAD precursors, NAD boosters, NR, NMN, nicotinamide riboside, nicotinamide mononucleotide]
    examples:
      organizations: [{name: Washington University School of Medicine, cite: C17}, {name: Haukeland University Hospital, cite: C18}]
      compounds: [{name: nicotinamide mononucleotide, cite: [C17, C19]}, {name: nicotinamide riboside, cite: C18}]
      trials: [{nct: NCT04571008, cite: C17}, {nct: NCT03568968, cite: C18}]
      events:
        - {date: 2025-09-29, kind: POLICY_CHANGE, what: "FDA letters state NMN is not excluded from the dietary-supplement definition (as described by Venable; capture the FDA letter)", cite: C19}

  - id: frontier:aging-as-indication
    label: Aging as a regulatory indication and trial endpoint
    level: 2
    parent: frontier:geroscience-in-humans
    granularity: REGULATORY_PATH
    definition: >-
      A regulator accepting aging, healthspan or a composite of age-related diseases as an indication, or an aging
      biomarker as a surrogate endpoint, so that geroprotectors can be approved for aging itself.
    scope:
      includes: [composite-endpoint trials designed for regulators (TAME), aging biomarker validation programs, prize competitions with clinical milestones, veterinary precedents]
      excludes: [measurement methods themselves (D4 Biomarker / measurement method)]
      anchors: {programs: [TAME (C21), XPRIZE Healthspan (C20)]}
    milestoneKinds: [ms:regulatory-path-accepted, ms:randomized-readout, ms:major-financing, ms:policy-change]
    targetKeys: [target:longevity]
    synonyms: [aging as a disease, healthspan indication, geroprotector approval pathway, aging biomarkers as surrogate endpoints, TAME]
    related: [frontier:companion-animal-longevity-drugs]
    examples:
      organizations: [{name: American Federation for Aging Research (TAME sponsor), cite: C21}, {name: XPRIZE Foundation, cite: C20}]
      compounds: [{name: metformin (TAME), cite: C21}]
      trials: []     # TAME not found by ClinicalTrials.gov term search on 2026-10-08 (see notes)
      events:
        - {date: 2025-05-12, kind: AWARD, what: "XPRIZE Healthspan awards first milestone winners (top 40 of semifinalists)", cite: C20}

  - id: frontier:companion-animal-longevity-drugs
    label: Lifespan-extension drugs for companion animals
    level: 2
    parent: frontier:geroscience-in-humans
    granularity: REGULATORY_PATH
    definition: >-
      Drugs approved (conditionally or fully) by a veterinary regulator with a lifespan or healthy-lifespan claim in
      dogs or cats: the first regulatory precedent for an aging claim in any species.
    scope:
      includes: [FDA CVM conditional approval pathway (RXE, TAS, CMC technical sections), large pivotal dog studies]
      excludes: [veterinary drugs for single age-related diseases]
    milestoneKinds: [ms:regulatory-path-accepted, ms:first-approval, ms:pivotal-readout, ms:launch]
    targetKeys: [target:longevity]
    synonyms: [dog longevity drugs, canine lifespan extension, veterinary geroscience, LOY-002]
    related: [frontier:aging-as-indication]
    examples:
      organizations: [{name: Loyal, cite: [C22, C23]}]
      compounds: [{name: LOY-002, cite: [C22, C23]}]
      events:
        - {date: null, kind: REGULATORY_ACCEPTANCE, what: "FDA CVM accepts RXE technical section for LOY-002; TAS later accepted; CMC in progress (site status page)", cite: [C22, C23]}

  - id: frontier:gene-therapy-for-aging
    label: Gene therapy for aging
    level: 2
    parent: frontier:geroscience-in-humans
    granularity: MODALITY
    definition: >-
      Gene therapies intended to slow or reverse aging in otherwise healthy people (follistatin, klotho, telomerase,
      FGF21/TGF-beta receptor combinations and similar), tested under regulator oversight with captured safety data.
    scope:
      includes: [in vivo gene delivery framed as anti-aging, offshore or regulatory-arbitrage administrations (tracked as harm/risk events)]
      excludes: [gene therapies for monogenic disease (frontier:in-vivo-gene-editing), partial reprogramming (own frontier)]
    milestoneKinds: [ms:first-in-human, ms:randomized-readout, ms:regulatory-path-accepted, ms:safety-signal, ms:setback]
    targetKeys: [target:longevity, target:muscle-mass]
    synonyms: [longevity gene therapy, follistatin gene therapy, klotho gene therapy, anti-aging gene therapy]
    related: [frontier:in-vivo-gene-editing, frontier:partial-epigenetic-reprogramming]
    harmNote: "Most human use so far is outside regulated trials; the frontier exists so that safety signals, enforcement and unverified claims attach somewhere investors and biohackers will look."
    examples:
      organizations: [{name: Minicircle, cite: C24}, {name: Rejuvenate Bio, cite: C25}]
      compounds: [{name: "follistatin plasmid (FST-344)", cite: C24}]

  # ===== Theme 2: metabolic and incretin medicine =====
  - id: frontier:incretin-and-metabolic-medicine
    label: Incretin and metabolic medicine beyond weight loss
    level: 1
    parent: null
    granularity: THEME
    definition: >-
      Incretin-based and adjacent metabolic drugs (GLP-1, GIP, glucagon, amylin agonists and successors, thyroid-receptor
      agonists in MASH) proving benefit on hard outcomes and diseases beyond glycemia and body weight, in forms and
      at costs that reach large populations.
    scope:
      includes: [cardiovascular, kidney, liver (MASH), sleep apnea, neurodegeneration and addiction indications, oral and next-generation agents, body-composition quality of weight loss]
      excludes: [first-generation glycemic approvals as such]
    milestoneKinds: [ms:pivotal-readout, ms:first-approval, ms:label-expansion, ms:launch, ms:setback]
    targetKeys: [target:cardiometabolic-health, target:fat-loss, target:body-composition, target:glycemic-control]
    synonyms: [GLP-1 class, incretin therapies, obesity drugs, cardiometabolic drugs]

  - id: frontier:glp1-beyond-obesity
    label: GLP-1 class beyond obesity
    level: 2
    parent: frontier:incretin-and-metabolic-medicine
    granularity: DISEASE_GOAL
    definition: >-
      GLP-1 receptor agonists and multi-agonists approved or proven in outcome trials for diseases other than obesity
      and type 2 diabetes: cardiovascular events, chronic kidney disease, MASH, obstructive sleep apnea,
      Alzheimer's disease, addiction.
    scope:
      includes: [label expansions, outcome trials, failed indication trials (disconfirmation)]
      excludes: [weight-loss-only readouts (parent theme)]
    milestoneKinds: [ms:pivotal-readout, ms:label-expansion, ms:setback]
    targetKeys: [target:cardiometabolic-health, target:brain-fitness, target:sleep]
    synonyms: [GLP-1 beyond weight loss, semaglutide new indications, tirzepatide new indications, incretin label expansion]
    examples:
      organizations: [{name: Novo Nordisk, cite: [C26, C27, C28, C30]}, {name: Eli Lilly and Company, cite: C33}]
      compounds: [{name: semaglutide, cite: [C26, C27, C28, C29, C31, C32]}, {name: tirzepatide, cite: C33}]
      trials: [{nct: NCT03574597, cite: C26}, {nct: NCT03819153, cite: C27}, {nct: NCT04822181, cite: C28}, {nct: NCT04777396, cite: C31}, {nct: NCT04777409, cite: C32}]
      events:
        - {date: 2024-12-20, kind: APPROVAL, what: "FDA approves Zepbound for moderate-to-severe OSA in adults with obesity", cite: C33}
        - {date: 2025-08-15, kind: APPROVAL, what: "FDA accelerated approval of Wegovy for noncirrhotic MASH with moderate-to-advanced fibrosis (NDA 215256/S-024)", cite: [C29, C71]}
        - {date: 2025-11-24, kind: READOUT, what: "evoke and evoke+ (oral semaglutide, early Alzheimer's) did not show a statistically significant reduction in progression", cite: [C30, C31, C32]}

  - id: frontier:oral-small-molecule-incretins
    label: Oral small-molecule incretins
    level: 2
    parent: frontier:incretin-and-metabolic-medicine
    granularity: MODALITY
    definition: >-
      Non-peptide, orally dosed incretin receptor agonists matching injectable efficacy without food or water
      restrictions, approved and manufactured at population scale.
    scope:
      includes: [non-peptide GLP-1 agonists, oral multi-agonists]
      excludes: [oral peptide formulations (tracked under the parent theme)]
    milestoneKinds: [ms:pivotal-readout, ms:first-approval, ms:launch, ms:setback]
    targetKeys: [target:fat-loss, target:glycemic-control]
    synonyms: [GLP-1 pill, oral GLP-1, orforglipron, non-peptide GLP-1 agonist]
    examples:
      organizations: [{name: Eli Lilly and Company, cite: [C34, C35]}]
      compounds: [{name: "orforglipron (Foundayo)", cite: [C34, C35]}]
      trials: [{nct: NCT05869903, cite: C34}]
      events:
        - {date: 2026-04-01, kind: APPROVAL, what: "FDA approves Foundayo (orforglipron) for obesity / overweight with weight-related problems", cite: C35}

  - id: frontier:muscle-preserving-weight-loss
    label: Muscle-preserving weight loss
    level: 2
    parent: frontier:incretin-and-metabolic-medicine
    granularity: DISEASE_GOAL
    definition: >-
      Therapies that, alone or with incretins, shift weight loss toward fat mass while preserving or increasing lean
      mass and function (activin/myostatin pathway antibodies and others).
    scope:
      includes: [activin type II receptor antibodies, myostatin/GDF-8 inhibitors combined with incretins]
      excludes: [exercise and nutrition protocols (D5 interventions)]
      anchors: {mechanisms: [activin type II receptor signaling, myostatin]}
    milestoneKinds: [ms:randomized-readout, ms:pivotal-readout, ms:setback]
    targetKeys: [target:muscle-mass, target:body-composition, target:strength]
    synonyms: [quality weight loss, lean mass preservation, sarcopenic obesity drugs, bimagrumab]
    examples:
      organizations: [{name: Eli Lilly and Company, cite: C36}]
      compounds: [{name: bimagrumab, cite: C36}]
      trials: [{nct: NCT05616013, cite: C36}]

  - id: frontier:mash-fibrosis-resolution
    label: Resolving MASH and liver fibrosis
    level: 2
    parent: frontier:incretin-and-metabolic-medicine
    granularity: DISEASE_GOAL
    definition: >-
      Drugs that resolve metabolic dysfunction-associated steatohepatitis (MASH, formerly NASH) and halt or reverse liver
      fibrosis with proven clinical benefit (fewer progressions to cirrhosis, liver events or deaths), including in
      cirrhotic disease. The approvals recorded so far are accelerated approvals on liver histology whose continuation
      depends on confirmatory outcome trials (C75, C29).
    scope:
      includes: [thyroid hormone receptor-beta agonists, incretin and multi-agonist MASH indications, other MASH mechanisms in registrational trials, confirmatory outcome trials of approved MASH drugs]
      excludes: [weight-loss-only readouts (parent theme), liver diseases other than MASH]
      anchors: {conditions: [MASH (NASH), liver fibrosis, cirrhosis], mechanisms: [thyroid hormone receptor-beta agonism, GLP-1 receptor agonism]}
    milestoneKinds: [ms:pivotal-readout, ms:regulatory-filing-accepted, ms:expedited-designation, ms:first-approval, ms:label-expansion, ms:launch, ms:setback]
    targetKeys: [target:cardiometabolic-health]
    synonyms: [MASH, NASH, metabolic dysfunction-associated steatohepatitis, nonalcoholic steatohepatitis, MASH resolution, fibrosis regression, liver fibrosis drugs]
    examples:
      organizations: [{name: Madrigal Pharmaceuticals, cite: [C74, C75, C76]}, {name: Novo Nordisk, cite: [C29, C71]}]
      compounds: [{name: "resmetirom (Rezdiffra)", cite: [C74, C75, C76]}, {name: semaglutide, cite: [C29, C71]}]
      events:
        - {date: 2022-12-19, kind: READOUT, what: "MAESTRO-NASH Phase 3 topline; the sponsor states the dual primary endpoints were met", cite: C74}
        - {date: 2024-03-14, kind: APPROVAL, what: "FDA accelerated approval of Rezdiffra (resmetirom) for noncirrhotic NASH with moderate to advanced fibrosis; first approval on this frontier", cite: [C75, C76]}
        - {date: 2025-08-15, kind: APPROVAL, what: "FDA accelerated approval of Wegovy for noncirrhotic MASH with moderate-to-advanced fibrosis (NDA 215256/S-024); also attached to frontier:glp1-beyond-obesity", cite: [C29, C71]}
