# ---------------------------------------------------------------------------------------------
# 4. Milestone kinds: a LENS over events (event kind + qualifier + computed firstness), never a node type.
#    Per-frontier `milestoneKinds` lists which rungs mark progress on that frontier.
#    `firstness` (first-in-human for the frontier, first approval in the frontier) is COMPUTED at query time
#    (no earlier ON_FRONTIER event of the same milestone kind), never stored as a property.
# ---------------------------------------------------------------------------------------------
milestoneKinds:
  - {id: ms:regulatory-path-accepted, eventKinds: [REGULATORY_ACCEPTANCE, REGULATORY_DESIGNATION], qualifier: "an IND/CTA clearance, a veterinary technical-section acceptance, or a regulator agreeing an endpoint/indication", ladderRank: 1}
  - {id: ms:first-in-human, eventKinds: [TRIAL_START], qualifier: "first participant dosed with an intervention of the frontier's modality/mechanism (firstness computed)", ladderRank: 2}
  - {id: ms:expedited-designation, eventKinds: [REGULATORY_DESIGNATION], qualifier: "Breakthrough Therapy, RMAT, PRIME, Fast Track, priority voucher, Orphan", ladderRank: 3}
  - {id: ms:randomized-readout, eventKinds: [READOUT], qualifier: "randomized controlled trial readout, any phase (design from D3 Study)", ladderRank: 4}
  - {id: ms:pivotal-readout, eventKinds: [READOUT], qualifier: "registrational / Phase 3 readout (D3 Study phase or the sponsor's 'registrational' statement)", ladderRank: 5}
  - {id: ms:regulatory-filing-accepted, eventKinds: [REGULATORY_SUBMISSION, REGULATORY_ACCEPTANCE], qualifier: "NDA/BLA/MAA submitted or accepted for review", ladderRank: 6}
  - {id: ms:first-approval, eventKinds: [APPROVAL], qualifier: "first marketing authorization in any major jurisdiction for an intervention on the frontier (firstness computed; jurisdiction required)", ladderRank: 7}
  - {id: ms:diagnostic-clearance, eventKinds: [APPROVAL], qualifier: "device clearance/approval of a test that gates treatment on the frontier (approvalPathway US_DEVICE_510K, US_DEVICE_DE_NOVO, US_DEVICE_PMA; synthesis R-66)", ladderRank: 7}
  - {id: ms:launch, eventKinds: [LAUNCH], qualifier: "commercial availability after approval", ladderRank: 8}
  - {id: ms:label-expansion, eventKinds: [APPROVAL], qualifier: "new indication for an already-approved intervention (supplemental approval)", ladderRank: 8}
  - {id: ms:major-financing, eventKinds: [FINANCING, AWARD], qualifier: "a financing or prize the source quantifies (FINANCING_AMOUNT on a FINANCING Event; an AWARD Event's amount is the D7 Award it is about); size thresholds are assessments, not properties", ladderRank: null}
  - {id: ms:strategic-transaction, eventKinds: [ACQUISITION, PARTNERSHIP], qualifier: "a large company acquiring or partnering into the frontier", ladderRank: null}
  - {id: ms:policy-change, eventKinds: [POLICY_CHANGE, REGULATORY_STATUS_CHANGE], qualifier: "a regulator or legislature changes the rules that govern the frontier", ladderRank: null}
  - {id: ms:regulatory-status-change, eventKinds: [REGULATORY_STATUS_CHANGE, POLICY_CHANGE], qualifier: "lawful-status change of a substance or product class (e.g. supplement eligibility)", ladderRank: null}
  - {id: ms:safety-signal, eventKinds: [SAFETY_SIGNAL, RECALL, MARKET_WITHDRAWAL], qualifier: "a reported serious adverse event, death, boxed warning, recall or withdrawal on the frontier", ladderRank: null, polarity: harm-channel}
  - {id: ms:clinical-hold, eventKinds: [CLINICAL_HOLD, CLINICAL_HOLD_LIFTED], qualifier: "regulator hold and its resolution", ladderRank: null, polarity: harm-channel}
  - {id: ms:setback, eventKinds: [READOUT, REJECTION, PROGRAM_DISCONTINUATION, RETRACTION, CLINICAL_HOLD, ENFORCEMENT_ACTION], qualifier: "READOUT only when the source states the primary endpoint was not met; otherwise the kind itself is the setback", ladderRank: null, polarity: harm-channel}
  - {id: ms:guidance-slip, eventKinds: [], qualifier: "COMPUTED lens, not an event kind (0.2.0): a PLANNED event whose latest EVENT_SCHEDULED window starts after the first stated window ends, or whose window passed with no EVENT_OCCURRED (Q-D13-11). Guidance windows are half-open intervals with MONTH precision ('first half of 2023' = [2023-01-01, 2023-07-01)), so no HALF_YEAR precision is needed", ladderRank: null, polarity: harm-channel, computed: true}
ladderNote: >-
  ladderRank orders the generic path regulatory-path -> first-in-human -> designation -> randomized -> pivotal -> filing ->
  approval -> launch/expansion. "Furthest rung reached on F as of T" is QF-02 (computed). Calling a milestone
  a "breakthrough" is section 6, never a rung.

# ---------------------------------------------------------------------------------------------
# 5. Event kinds: ONE controlled enum on Event (`eventKind`), replacing the pinned pair
#    EventCategory (26 values) + eventType (free controlled string). `family` is derived from the kind
#    (a lookup, not a second stored field). Mapping to pinned values is given for migration.
#    clocks: which of the three Event clocks (CQ-TM-03) normally apply — startedAt (when it happened),
#    announcedAt (first public announcement by a party), effectiveFrom (legal/contractual effect).
# ---------------------------------------------------------------------------------------------
eventKinds:
  - {value: TRIAL_START, family: CLINICAL, definition: "first participant dosed or trial opened to enrollment, as stated by sponsor or registry", typicalSources: [press release, ClinicalTrials.gov status history], clocks: [startedAt, announcedAt], pinned: {eventCategory: CLINICAL_EVENT, eventType: OTHER}}
  - {value: READOUT, family: CLINICAL, definition: "first public disclosure of a trial's results (topline, interim, primary analysis). Qualifiers stated by the source: readoutStage (TOPLINE | INTERIM | PRIMARY | FINAL | LONG_TERM_FOLLOW_UP), primaryEndpointStatement (MET | NOT_MET | MIXED | NOT_STATED) — capture of the sponsor's statement, never BellLabs' judgment", typicalSources: [press release, 8-K Item 7.01/8.01, conference abstract], clocks: [startedAt, announcedAt], pinned: {eventCategory: DATA_READOUT_EVENT, eventType: TOPLINE_READOUT}}
  - {value: DATA_PRESENTATION, family: CLINICAL, definition: "presentation of fuller data at a named conference session (predicate PRESENTED_AT_CONFERENCE → D9 Channel with channelKind EVENT_SERIES; edition and session are Assertion qualifiers; no Conference node in D9 or D13)", typicalSources: [conference abstract, slide deck, press release], clocks: [startedAt], pinned: {eventCategory: CONFERENCE_EVENT, eventType: PRESENTATION}}
  # synthesis R-44: event kind PUBLICATION removed (a publication is a D3 Publication; see retiredEventKinds)
  - {value: RETRACTION, family: SCIENTIFIC_RECORD, definition: "A curated frontier milestone only (synthesis R-44): EVENT_ABOUT → D3 Publication; its clock cites the retraction notice's locator and no second date Assertion is written; the revision itself is D3 REVISES (or K HAS_REVISION_STATUS without an identified notice; SourceRevisionKind is the one revision vocabulary); authors and publisher are reached through the Publication. Was: retraction, expression of concern or major correction of a publication, the Event as its frontier-milestone view citing the same notice locators", typicalSources: [Crossref update metadata, Retraction Watch, publisher notice], clocks: [startedAt], pinned: {eventCategory: RESEARCH_EVENT, eventType: OTHER}}
  - {value: REGULATORY_SUBMISSION, family: REGULATORY, definition: "IND/CTA/NDA/BLA/MAA or veterinary technical section submitted (incl. rolling submission start)", typicalSources: [press release, 8-K], clocks: [startedAt, announcedAt], pinned: {eventCategory: REGULATORY_EVENT, eventType: FILING}, requires: [jurisdiction]}
  - {value: REGULATORY_ACCEPTANCE, family: REGULATORY, definition: "regulator accepts a filing for review, clears an IND/CTA, or accepts a technical section (e.g. FDA CVM RXE/TAS). A PDUFA goal date announced with the acceptance is an EVENT_SCHEDULED assertion on a separate PLANNED APPROVAL event (window [D, D+1 day), DAY), not a property of the acceptance (0.2.0, FC3)", typicalSources: [regulator letter, press release], clocks: [startedAt, announcedAt], pinned: {eventCategory: REGULATORY_EVENT, eventType: OTHER}, requires: [jurisdiction]}
  - {value: REGULATORY_DESIGNATION, family: REGULATORY, definition: "expedited or special designation granted: Breakthrough Therapy (C01), Fast Track, RMAT, PRIME, Orphan, priority review voucher. Qualifier designationType, typed by D8 RegulatoryPathway (synthesis R-66: US_BREAKTHROUGH_THERAPY, US_FAST_TRACK, US_RMAT, US_PRIORITY_REVIEW, US_PRIORITY_REVIEW_VOUCHER, EU_PRIME, JP_SAKIGAKE, US_ORPHAN_DESIGNATION, EU_ORPHAN_DESIGNATION)", typicalSources: [press release, regulator databases where public], clocks: [startedAt, announcedAt], pinned: {eventCategory: REGULATORY_EVENT, eventType: OTHER}, requires: [jurisdiction, designationType]}
  - {value: ADVISORY_COMMITTEE, family: REGULATORY, definition: "advisory committee meeting and vote", typicalSources: [FDA advisory calendar, briefing documents, minutes], clocks: [startedAt], pinned: {eventCategory: REGULATORY_EVENT, eventType: OTHER}, requires: [jurisdiction]}
  - {value: APPROVAL, family: REGULATORY, definition: "marketing authorization or device clearance. Qualifier approvalPathway, typed by D8 RegulatoryPathway (synthesis R-66; e.g. US_DRUG_NDA, US_BLA, US_ACCELERATED_APPROVAL, EU_CONDITIONAL_MA, US_DEVICE_510K, US_DEVICE_DE_NOVO, US_DEVICE_PMA, US_EUA; mapping from the retired ApprovalPathway values in synthesis.regulatoryPathwayMapping). The D8 RegulatoryRecord documents it (typed DOCUMENTED_BY_RECORD; regulator, holder and record date are the record's, 0.2.1)", typicalSources: [approval letter, Drugs@FDA/openFDA, EMA EPAR, press release], clocks: [startedAt, announcedAt, effectiveFrom], pinned: {eventCategory: REGULATORY_EVENT, eventType: "APPROVAL | CONDITIONAL_APPROVAL"}, requires: [jurisdiction]}
  - {value: REJECTION, family: REGULATORY, definition: "complete response letter, refusal to file, negative opinion, non-approval", typicalSources: [press release, 8-K, EMA CHMP minutes], clocks: [startedAt, announcedAt], pinned: {eventCategory: REGULATORY_EVENT, eventType: OTHER}, requires: [jurisdiction], harmChannel: true}
  - {value: CLINICAL_HOLD, family: REGULATORY, definition: "an order issued by FDA to the sponsor to delay a proposed clinical investigation or to suspend an ongoing investigation (21 CFR 312.42, C02); equivalent orders by other regulators", typicalSources: [press release, 8-K], clocks: [startedAt, announcedAt], pinned: {eventCategory: REGULATORY_EVENT, eventType: OTHER}, requires: [jurisdiction], harmChannel: true}
  - {value: CLINICAL_HOLD_LIFTED, family: REGULATORY, definition: "regulator removes a clinical hold (full or partial)", typicalSources: [press release, 8-K], clocks: [startedAt, announcedAt], pinned: {eventCategory: REGULATORY_EVENT, eventType: OTHER}, requires: [jurisdiction]}
  - {value: REGULATORY_STATUS_CHANGE, family: REGULATORY, definition: "change of lawful status of a substance/product class (scheduling, supplement eligibility, GRAS) — the status record is D8", typicalSources: [regulator letters, Federal Register], clocks: [startedAt, effectiveFrom], pinned: {eventCategory: REGULATORY_EVENT, eventType: OTHER}, requires: [jurisdiction]}
  - {value: ENFORCEMENT_ACTION, family: REGULATORY, definition: "warning letter, import alert, injunction, seizure against a party (record is D8)", typicalSources: [FDA warning letters, DOJ releases], clocks: [startedAt, announcedAt], pinned: {eventCategory: LEGAL_EVENT, eventType: OTHER}, requires: [jurisdiction], harmChannel: true}
  - {value: POLICY_CHANGE, family: POLICY, definition: "new guidance, rule, pathway or program from a regulator, legislature or payer that changes how a frontier is developed or reimbursed", typicalSources: [Federal Register, regulator press release], clocks: [startedAt, effectiveFrom], pinned: {eventCategory: POLICY_EVENT, eventType: OTHER}, requires: [jurisdiction]}
  - {value: LAUNCH, family: COMMERCIAL, definition: "commercial availability of an approved product in a jurisdiction. Often only PLANNED in the approval release ('expected to be available ... in April', FC3): an EVENT_SCHEDULED window until an occurrence is captured", typicalSources: [press release, earnings call], clocks: [startedAt, announcedAt], pinned: {eventCategory: PRODUCT_EVENT, eventType: LAUNCH}}
  - {value: RECALL, family: SAFETY, definition: "product recall (class stated by the regulator); record is D8", typicalSources: [FDA enforcement reports, openFDA recall API], clocks: [startedAt, announcedAt], pinned: {eventCategory: RECALL_EVENT, eventType: "RECALL_INITIATED | RECALL_CLASSIFIED"}, harmChannel: true}
  - {value: MARKET_WITHDRAWAL, family: SAFETY, definition: "product withdrawn from market (safety, efficacy or commercial reason stated)", typicalSources: [regulator notice, press release], clocks: [startedAt, effectiveFrom], pinned: {eventCategory: PRODUCT_EVENT, eventType: OTHER}, harmChannel: true}
  - {value: SAFETY_SIGNAL, family: SAFETY, definition: "publicly reported serious adverse event, death, dosing pause, boxed warning or safety communication. The event is the disclosure; any judgment of causality or frequency is a D5/D10 assessment", typicalSources: [press release, 8-K, FDA Drug Safety Communication, FAERS (aggregate, never an event by itself)], clocks: [startedAt, announcedAt], pinned: {eventCategory: SAFETY_EVENT, eventType: OTHER}, harmChannel: true}
  - {value: PROGRAM_DISCONTINUATION, family: CORPORATE, definition: "sponsor stops a program, deprioritizes an indication, terminates a trial, or winds down. Qualifier discontinuationScope TRIAL | PROGRAM | COMPANY (0.2.0): workforce reductions, dissolution and deregistration are COMPANY scope (FC7), so the dropped pinned CORPORATE/LEADERSHIP categories are not needed", typicalSources: [press release, 10-Q/10-K, ClinicalTrials.gov status TERMINATED/WITHDRAWN], clocks: [startedAt, announcedAt], pinned: {eventCategory: CORPORATE_EVENT, eventType: CANCELLATION}, harmChannel: true}
  - {value: FINANCING, family: FINANCIAL, definition: "equity, debt, royalty or grant financing; IPO; follow-on; at-the-market sales. Amounts are FINANCING_AMOUNT Assertions (D13 predicate, unitCode iso4217:<CODE>, qualifiers amountKind and amountBasis), not Event properties; the financed party is INVOLVES ISSUER or BORROWER", typicalSources: [press release, 8-K Item 1.01/3.02, Form D, S-1/424B], clocks: [startedAt, announcedAt, effectiveFrom], pinned: {eventCategory: FINANCING_EVENT, eventType: OTHER}}
  - {value: ACQUISITION, family: FINANCIAL, definition: "acquisition or merger: agreement (announcedAt/startedAt) and closing (effectiveFrom) are ONE event with two clocks, not two events", typicalSources: [press release, 8-K Item 1.01/2.01, SC TO], clocks: [startedAt, announcedAt, effectiveFrom], pinned: {eventCategory: MNA_EVENT, eventType: OTHER}}
  - {value: PARTNERSHIP, family: FINANCIAL, definition: "license, collaboration, co-development or option deal; upfront and milestones are Assertions", typicalSources: [press release, 8-K Item 1.01], clocks: [startedAt, announcedAt, effectiveFrom], pinned: {eventCategory: "PARTNERSHIP_EVENT | LICENSING_EVENT", eventType: OTHER}}
  - {value: AWARD, family: FINANCIAL, definition: "prize or competition milestone with money attached (e.g. XPRIZE milestone awards), as a frontier-milestone occurrence only: the Event points at the D7 Award (EVENT_ABOUT), whose funder (AWARDED_BY), recipients (AWARDED_TO) and amount are D7's; no AWARD-specific event role or amount", typicalSources: [organizer release], clocks: [startedAt, announcedAt], pinned: {eventCategory: OTHER, eventType: OTHER}}
  - {value: LEGAL_ACTION, family: CORPORATE, definition: "lawsuit, settlement, patent challenge outcome (patent records are D8)", typicalSources: [court dockets, 8-K Item 8.01, PTAB], clocks: [startedAt, announcedAt], pinned: {eventCategory: "LEGAL_EVENT | LITIGATION_EVENT", eventType: OTHER}}
  - {value: OTHER, family: OTHER, definition: "anything else; an OTHER value needs a description and is reviewed for a vocabulary bump", typicalSources: [], clocks: [startedAt], pinned: {eventCategory: OTHER, eventType: OTHER}}
retiredEventKinds:
  - {value: PUBLICATION, ruling: R-44, reason: "a peer-reviewed publication is a D3 Publication (on a kernel Source), never an Event; milestone timelines read D3 Publication dates; RETRACTION stays as a curated milestone"}
droppedPinnedCategories:
  note: "pinned EventCategory values with no investor/researcher question in D13: HIRING_EVENT, LEADERSHIP_EVENT, BOARD_EVENT, FACILITY_EVENT, MANUFACTURING_EVENT, MARKET_EVENT (share-price moves are D7 market data, not events), MEDIA_EVENT (D9), COMMERCIAL_EVENT (folded into LAUNCH), UNKNOWN (use OTHER). Promotable by a vocabulary bump with a question id."
eventFamilies: [CLINICAL, REGULATORY, SAFETY, SCIENTIFIC_RECORD, COMMERCIAL, FINANCIAL, CORPORATE, POLICY, OTHER]

# ---------------------------------------------------------------------------------------------
# 6. Breakthrough criteria: "breakthrough" is never a property or an event kind. It is either
#    (a) a criterion an event satisfies by definition (computed), or (b) a D10 assessment that cites the criterion.
# ---------------------------------------------------------------------------------------------
breakthroughCriteria:
  - {id: BC-DESIGNATION, rule: "event kind REGULATORY_DESIGNATION with designationType US_BREAKTHROUGH_THERAPY | US_RMAT | EU_PRIME | JP_SAKIGAKE (D8 RegulatoryPathway values, synthesis R-66; regulator's own definition, C01). Who can satisfy it: the sponsor's release for the grant date (FDA does not publish grants); the FDA Breakthrough Therapy approvals list (C76) corroborates only designated products that were later approved, without grant dates (0.2.0)", computed: true}
  - {id: BC-FIRST-IN-HUMAN, rule: "first TRIAL_START on a level-2 frontier (no earlier TRIAL_START ON_FRONTIER as of T)", computed: true}
  - {id: BC-FIRST-APPROVAL, rule: "first APPROVAL on a level-2 frontier in a jurisdiction (approvalPathway not US_DEVICE_510K unless the frontier is diagnostic; synthesis R-66)", computed: true}
  - {id: BC-FIRST-POSITIVE-PIVOTAL, rule: "first READOUT on the frontier with readoutStage in (TOPLINE, PRIMARY) on a registrational trial and primaryEndpointStatement = MET as stated by the sponsor", computed: true}
  - {id: BC-ANALYST, rule: "a kernel Assessment (assessmentKind BREAKTHROUGH_JUDGMENT, conclusionCode MEETS_CRITERION) by a named asserter citing located evidence and a method version; press language ('unprecedented', 'breakthrough') is a claim occurrence (kernel Assertion, assertionKind CLAIM; container D9 MediaWork), never this", computed: false}

# ---------------------------------------------------------------------------------------------
# 7. Event relation kinds (event -> event). Two are asserted typed relationships; one is computed.
#    None of them is ever inferred from temporal order alone (forbidden implication carried from pinned W18:
#    [FOLLOWS -> LEADS_TO]).
# ---------------------------------------------------------------------------------------------
eventRelations:
  - kind: LEADS_TO
    direction: "earlier (enabling) event -> later (enabled) event"
    replaces: "pinned CAUSED_BY (effect -> cause), direction flipped so chains read forward in time"
    semantics: >-
      A source states that the earlier event was a basis, precondition or input for the later one: a readout is the
      basis of a filing; a filing leads to an approval; a designation was granted on the basis of phase 1 data; a
      financing was raised on the strength of a result. Process/precondition, not agency.
    examples:
      - "READOUT RASolute 302 (2026-04-13) LEADS_TO REGULATORY_ACCEPTANCE NDA (2026-07-22) LEADS_TO APPROVAL (2026-08-26): the FDA approval page states efficacy was evaluated in RASolute 302 (C41)"
      - "READOUT MAESTRO-NASH topline (2022-12-19) LEADS_TO FINANCING (loan tranche eligibility): the 8-K states that 'as a result of the Company's announcement of Phase 3 MAESTRO-NASH clinical trial topline results' the lender confirmed the clinical milestone (C77; fixture madrigal-financing-after-readout)"
    whoAsserts: "the party to the later event (sponsor, regulator, acquirer) or a named reporting source; a BellLabs agent may assert it only when it can point to such a statement"
    evidenceRequired:
      - "one kernel Assertion (predicate LEADS_TO; subject = earlier event, object = later event; one asserter) with a SourceLocator whose exact quote states the link"
      - "speechAct STATES (corrected in 0.2.0: basisKind is not the gate; a party's statement about its own act or contract has no fitting BasisKind, see 11-open-questions.md); a SPECULATES / HYPOTHESIS link stays an Assertion and is never projected to the typed edge"
      - "temporal wording alone ('following', 'after') is adjudicated CONTEXT_ONLY by the SUPPORT adjudication and never projects; the pair is then a computed FOLLOWS (FC2: 'as a result of the Company's announcement' projects, 'secured following the positive topline readout' does not)"
      - "service check: object.startedAt >= subject.startedAt (or announcedAt when startedAt is unknown); a violation rejects the projection, not the assertion"
      - "SUPPORT Adjudication from verification.v1 before the edge counts in investor answers"
    edge: {class: asserted, pairs: ["Event -> Event"], cardinality: many-to-many, nestedOperations: [CONNECT], aggregate: false, temporal: recorded-only}
  - kind: RESPONDS_TO
    direction: "responding event -> stimulus event"
    semantics: >-
      A deliberate action by an agent (regulator, sponsor, investor, payer) that a source states was taken in reaction
      to an earlier event: a clinical hold responds to a safety signal; a dosing pause responds to an SAE; a program
      discontinuation responds to a failed readout; a retraction responds to an investigation. Carries agency.
    examples:
      - "PROGRAM_DISCONTINUATION STRIDES (2024-12-06) RESPONDS_TO SAFETY_SIGNAL (liver transaminitis): the sponsor-entered registry record states 'Dosing of both study drugs has been discontinued due to observation of liver transaminitis without clinically significant symptoms in some subjects receiving azelaprag' (ClinicalTrials.gov NCT06515418 whyStopped; fixture bioage-strides-discontinuation a12, locator l07, SUPPORT DIRECTLY_SUPPORTED)"
    counterExamples:   # 0.2.1: temporal wording only; adjudicated CONTEXT_ONLY, never projects
      - "BioAge's release lede: the decision to discontinue was made 'after liver transaminitis ... was observed' (C78; fixture bioage a14, CONTEXT_ONLY; the registry span above carries the basis)"
      - "Intellia: the clinical holds 'were imposed by the FDA on October 29, 2025, following the observation of Grade 4 liver transaminases' (C50, re-read 2026-10-08): 'following' alone; no 'due to' / 'as a result of' span from Intellia or the FDA has been captured, so CLINICAL_HOLD MAGNITUDE → SAFETY_SIGNAL stays a computed FOLLOWS"
    whoAsserts: "the responding party or a source quoting it; regulators' letters and sponsor releases are the usual locators"
    evidenceRequired: "same as LEADS_TO (one asserter, locator naming the stimulus, STATES speech act, time-order check, SUPPORT adjudication)"
    edge: {class: asserted, pairs: ["Event -> Event"], cardinality: many-to-many, nestedOperations: [CONNECT], aggregate: false, temporal: recorded-only}
  - kind: FOLLOWS
    direction: "later event -> earlier event within one scope (same frontier, same subject, or same organization)"
    replaces: "pinned FOLLOWED_BY (derived)"
    semantics: "pure temporal adjacency by the events' valid-time clocks; NEVER implies LEADS_TO or RESPONDS_TO; 'a financing followed a result' in the temporal sense is FOLLOWS, in the stated-basis sense is LEADS_TO"
    whoAsserts: nobody (computed)
    examples:
      - "Madrigal's 2024-04-02 offering closing (C79) FOLLOWS the 2024-03-14 approval: no source states a basis, so it is temporal only"
    evidenceRequired: "the two events' time assertions (timeAssertionUid); method valid-time-order-v1"
    edge: {class: computed, stored: false, note: "computed at query time by ORDER BY startedAt within the scope (QF-01); a materialized derived FOLLOWS projection is allowed only if a GDS path or latency question needs it, with method version and read-only directives"}
notEventRelations:
    - "CONTRADICTS: a retraction or failed readout contradicting earlier claims is kernel/D10 (Claim -> evidence Adjudication / assessment), never an event-to-event or event-to-claim edge (directive 3.8)"
    - "SUPERSEDES between events: corrections are new Assertions on the same Event (pinned rule), not a new event"
    - "agreement vs closing of one deal: one ACQUISITION event with two clocks, never two events linked by LEADS_TO"

# ---------------------------------------------------------------------------------------------
# 8. Seam rule: how events, studies, organizations, compounds and claims attach to a frontier
# ---------------------------------------------------------------------------------------------
seamRule:
  rule: >-
    Only Events (D13) and Studies (D3) attach to a Frontier directly, through one asserted classification edge
    ON_FRONTIER (Event|Study -> Frontier). Organizations, people, compounds and products never point at a frontier:
    they reach it through the events they are INVOLVED in / the subject of (predicate EVENT_ABOUT) and the studies they sponsor or test, so "who is
    active on F" is computed (optionally a read-only ACTIVE_ON_FRONTIER projection with a method version). Claims
    reach a frontier through the kernel subject/object pattern (the Frontier node is an admissible subject/object)
    and through the events and studies they are about. Frontier-to-target relevance is the property targetKeys;
    hierarchy is parentKey. Polarity (advance or setback) is never on the edge; it is the event kind or a D10 assessment.
  edges:
    - name: ON_FRONTIER
      from: [D13.Event, D3.Study]
      to: D13.Frontier
      class: asserted (classification)
      asserter: "a BellLabs curation agent or curator (Agent), with the frontier vocab version; the Assertion cites the event's or study's own supporting locator and states which frontier definition clause matched"
      evidenceRequired: "the classified entity's own located evidence + qualifier frontierVocabVersion=<semver> on the Assertion, basisKind CURATOR_CLASSIFICATION (synthesis R-25); re-classification on a vocab bump is a new Assertion that supersedes, never an edit"
      cardinality: "an event or study attaches to 1-2 level-2 frontiers (rarely 3); attach to a level-1 theme only when no child fits"
      edgeProperties: kernel AssertedRecordedProperties (relationshipUid, assertionUid, recordedFrom, recordedTo, lastWriterRunId; recorded time only, kernel M10, check stage 2026-10-08); the vocab version is on the Assertion (qualifier), because kernel edge-property types are never extended for one field (0.2.0)
      nestedOperations: [CONNECT]
      aggregate: false
      temporal: recorded-only
      pairs: 2
    - name: ACTIVE_ON_FRONTIER (optional, deferred)
      from: [D7.Organization, D1.ChemicalSubstance]
      to: D13.Frontier
      class: derived
      method: "frontier-activity-v1: participant/subject of an ON_FRONTIER event or sponsor/intervention of an ON_FRONTIER study within a window"
      nestedOperations: []
      settable: "onCreate false, onUpdate false"
      status: "not admitted in Wave 0; admit only if QF-03 latency or a GDS community question requires it"
  attachmentByType:
    Event: "direct ON_FRONTIER (asserted classification)"
    Study: "direct ON_FRONTIER (asserted classification; D13 declares the field as Frontier.studies, direction IN, and owns the type; D3 declares nothing) — seam D3"
    Organization: "indirect: Event -[INVOLVES {role}]-> Organization (D7 seam), Study sponsor (D3/D7)"
    Person: "indirect: Event INVOLVES Person (D7 seam)"
    ChemicalSubstance / Product / Intervention: "indirect: EVENT_ABOUT Assertion (subject the Event, object the entity; D1/D6/D5 seams; kernel subject pattern), Study arm components (D3 HAS_ARM → HAS_COMPONENT → ADMINISTERS)"
    Claim / claim occurrence (kernel Assertion, assertionKind CLAIM): "kernel subject/object = Frontier, or about an event/study subject; time-windowed against events (QF-05) — seam K/D9"
    Assessment (breakthrough, impact, narrative arc): "D10 assessment whose subject is an Event or Frontier (kernel pattern) — seam D10"
    Target: "property Frontier.targetKeys (vocabulary mapping, not an effect claim) — seam D5"
    Condition / Mechanism: "names in scope.anchors only (curation hints for the classifier); no edge in Wave 0 — seam D2"
  rejected:
    - {option: "typed FRONTIER edge from every domain type (Organization, Compound, Product, Person, Claim, Study, Event)", reason: "7+ pairs, a union target, and an organization 'on' a frontier is a judgment that goes stale; activity is better computed from dated events"}
    - {option: "frontier tags (property frontierKeys) on Event", reason: "loses asserter, vocab version and supersession; cannot be adjudicated; a classification is a claim by the curator"}
    - {option: "Assertion.predicate only (no typed edge)", reason: "the frontier timeline (QF-01) traverses it on every investor query; it earns a typed edge under rule 6"}
  consumerObligations:
    - "list `frontiers: final/vocabularies/frontiers.yaml@0.2.1` (synthesis R-60 / R-09; was packets/D13/vocab-frontiers.yaml@0.2.1; any @0.2.x) under sharedVocabularies in 10-seams.yaml; @0.1.0 references are stale"
    - "D3: declare nothing; D13 declares the Study side of ON_FRONTIER as Frontier.studies (direction IN); list it as a seam owned by D13; never a second frontier edge"
    - "D7/D9: use the eventKinds enum for any event you reference; never mint event kinds or event-to-event edges"
    - "D8: regulatory records DOCUMENT events (APPROVAL, REJECTION, REGULATORY_DESIGNATION, ENFORCEMENT_ACTION, RECALL, MARKET_WITHDRAWAL, REGULATORY_STATUS_CHANGE) through D13's typed DOCUMENTED_BY_RECORD (Event → RegulatoryRecord); the record (issuer, addressee, date) is D8, the occurrence is D13; D8 declares no inverse"
    - "K: retraction status stays the kernel HAS_REVISION_STATUS Assertion per authority + SourceSnapshot.revisionKind (kernel M6); D13 projects a RETRACTION Event only when it is a frontier milestone, citing the same notice locators"
    - "entity-link frontier phrases via synonyms; propose new frontiers in 11-open-questions.md, never mint nodes"

# ---------------------------------------------------------------------------------------------
# 9. Investor query shapes (pinned kernel names as placeholders; rebase on A1). Ids QF-nn are vocabulary
#    query shapes; the D13 questions file maps them to Q-D13-nn.
# ---------------------------------------------------------------------------------------------
queryShapes:
  - id: QF-01
    question: "What happened on frontier F in the last N days, in order, and which events led to or responded to which?"
    answerKind: retrieved
    cypher: |
      MATCH (f:Frontier) WHERE f.key = $frontierKey OR f.parentKey = $frontierKey
      MATCH (e:Event)-[r:ON_FRONTIER]->(f)
      WHERE r.recordedFrom <= $asOf AND (r.recordedTo IS NULL OR r.recordedTo > $asOf)
        AND coalesce(e.startedAt, e.announcedAt) >= datetime($asOf) - duration({days: $days})
      OPTIONAL MATCH (e)-[l:LEADS_TO]->(next:Event)
      OPTIONAL MATCH (e)-[rt:RESPONDS_TO]->(stim:Event)
      OPTIONAL MATCH (e)-[inv:INVOLVES]->(org)
      RETURN e.uid, e.eventKind, e.name, e.startedAt, e.announcedAt, e.effectiveFrom, e.jurisdiction,
             collect(DISTINCT org.name) AS who,
             collect(DISTINCT {leadsTo: next.uid, assertion: l.assertionUid}) AS leadsTo,
             collect(DISTINCT {respondsTo: stim.uid, assertion: rt.assertionUid}) AS respondsTo
      ORDER BY coalesce(e.startedAt, e.announcedAt)
    trace: "each event's timeAssertionUid / announcementAssertionUid -> Assertion -> SourceLocator -> SourceSnapshot; each LEADS_TO/RESPONDS_TO edge -> assertionUid -> locator"
  - id: QF-02
    question: "How far has frontier F got (furthest milestone rung reached, first-ever events) as of T?"
    answerKind: retrieved (or materialized projection with method frontier-ladder-v1)
    cypher: |
      MATCH (e:Event)-[r:ON_FRONTIER]->(f:Frontier {key: $frontierKey})
      WHERE r.recordedFrom <= $asOf AND (r.recordedTo IS NULL OR r.recordedTo > $asOf)
        AND coalesce(e.startedAt, e.announcedAt) <= $asOf
      WITH e ORDER BY coalesce(e.startedAt, e.announcedAt)
      WITH e.eventKind AS kind, collect(e)[0] AS first
      RETURN kind, first.uid, first.name, first.startedAt   // map kind+qualifiers -> milestoneKinds ladderRank in the service layer
  - id: QF-03
    question: "Who is active on frontier F (organizations, compounds, studies) and what is each one's latest milestone?"
    answerKind: retrieved (optional derived ACTIVE_ON_FRONTIER)
    cypher: |
      MATCH (f:Frontier {key: $frontierKey})<-[:ON_FRONTIER]-(e:Event)-[:INVOLVES]->(o:Organization)
      WITH o, e ORDER BY coalesce(e.startedAt, e.announcedAt) DESC
      WITH o, collect(e)[0] AS latest, count(e) AS nEvents
      OPTIONAL MATCH (f2:Frontier {key: $frontierKey})<-[:ON_FRONTIER]-(s:Study)-[sr:HAS_STUDY_ROLE]->(o) WHERE sr.roleKind IN ['LEAD_SPONSOR', 'SPONSOR']   // D3 published name
      RETURN o.name, latest.eventKind, latest.name, latest.startedAt, nEvents, collect(DISTINCT s.uid) AS studies
      ORDER BY latest.startedAt DESC
  - id: QF-04
    question: "Which events on F were breakthroughs by a stated definition (designation, first-in-human, first approval, first positive pivotal) rather than by press language?"
    answerKind: retrieved (BC-DESIGNATION..BC-FIRST-POSITIVE-PIVOTAL) + assessment (BC-ANALYST)
    pattern: "QF-02 restricted to breakthroughCriteria; press 'breakthrough' language is listed separately from claim occurrences (kernel Assertions, assertionKind CLAIM) so the two are never conflated"
  - id: QF-05
    question: "What is the chain from first readout to approval for compound X, and how long did each step take?"
    answerKind: retrieved
    cypher: |
      MATCH (x {uid: $compoundUid})<-[:HAS_OBJECT]-(:Assertion {predicate: 'EVENT_ABOUT'})-[:HAS_SUBJECT]->(start:Event {eventKind: 'READOUT'})
      MATCH p = (start)-[:LEADS_TO*1..6]->(end:Event {eventKind: 'APPROVAL'})
      RETURN [n IN nodes(p) | {uid: n.uid, kind: n.eventKind, at: coalesce(n.startedAt, n.announcedAt)}] AS chain,
             [r IN relationships(p) | r.assertionUid] AS linkEvidence
      ORDER BY length(p) LIMIT 5
  - id: QF-06
    question: "Which claims about frontier F (or its subjects) circulated before and after event E, and which were contradicted by it?"
    answerKind: retrieved + assessment
    pattern: "claim occurrences (kernel Assertions, assertionKind CLAIM, OCCURRENCE_OF a Claim; containers D9) whose claim subject/object is F or E's subjects, split by occurrence time < or >= E.announcedAt; contradiction comes from kernel Adjudication/assessment rows citing E's locators — seam K, D9, D10"
  - id: QF-07
    question: "What went wrong on frontier F: safety signals, holds, failed readouts, rejections, discontinuations, retractions, enforcement — and what did each lead to?"
    answerKind: retrieved
    polarity: harm
    cypher: |
      MATCH (e:Event)-[:ON_FRONTIER]->(:Frontier {key: $frontierKey})
      WHERE e.eventKind IN ['SAFETY_SIGNAL','CLINICAL_HOLD','REJECTION','PROGRAM_DISCONTINUATION','RETRACTION',
                            'ENFORCEMENT_ACTION','RECALL','MARKET_WITHDRAWAL']
         OR (e.eventKind = 'READOUT' AND e.primaryEndpointStatement IN ['NOT_MET', 'MIXED'])
      OPTIONAL MATCH (resp:Event)-[:RESPONDS_TO]->(e)
      RETURN e.eventKind, e.name, e.startedAt, collect({kind: resp.eventKind, uid: resp.uid, at: resp.startedAt}) AS responses
      ORDER BY e.startedAt DESC
  - id: QF-08
    question: "Which financings, acquisitions or partnerships followed a readout on F within N days, and which did a source state were based on it?"
    answerKind: retrieved
    pattern: "temporal pairs (FOLLOWS computed: same organization, deal.startedAt - readout.startedAt in [0, N days]) returned in one column, stated LEADS_TO pairs in another; never merged"
  - id: QF-09
    question: "Which frontiers does target T depend on, and what happened on them recently?"
    answerKind: retrieved
    cypher: |
      MATCH (f:Frontier) WHERE $targetKey IN f.targetKeys
      OPTIONAL MATCH (e:Event)-[:ON_FRONTIER]->(f)
      WITH f, e ORDER BY e.startedAt DESC
      RETURN f.key, f.name AS label, collect(e)[0..5] AS recentEvents   // synthesis: the label is Entity.name (no label property)
indexes:
  - "range :Frontier(key) unique; range :Frontier(parentKey); fulltext FrontierSearch(name, synonyms, definition) (name holds the label)"
  - "range :Event(eventKind, startedAt); range :Event(announcedAt)"
  - "Frontier.targetKeys list property (IN predicate); no index needed at 25 nodes"

