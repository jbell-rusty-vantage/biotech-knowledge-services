sharedVocabularies:
  - module: K
    name: identifier-schemes
    owner: K
    file: final/vocabularies/identifier-schemes.yaml
    role: K owns the register (source packets/K/identifier-schemes.yaml); states the uniqueness rule (one (scheme, issuer, normalized value) identifies at most one Subjectable) and normalizationRule ids (R-42); every domain names its schemes in its node register identifierSchemes; D11 (A8) supplies the bridge table
  - module: K
    name: kernel-types
    owner: K
    file: final/schema/kernel.graphql
    role: "edge-property types (AssertedEdgeProperties, AssertedRecordedProperties, DerivedEdgeProperties, StructuralEdgeProperties, IdentifierLinkProperties, EvidenceEdgeProperties; the M11 bases are AssertedEdgeProperties, AssertedRecordedProperties, StructuralEdgeProperties and DerivedEdgeProperties, R-47) and enums (PrivacyClass, SemanticVerdict, EffectDirection, AssessmentKind, CertaintyLevel, BasisKind, SourceRevisionKind, TimePrecision, ...). StateEpisodeProperties removed in synthesis (R-10): versioned-state attachments use AssertedEdgeProperties plus register field exclusive: true. Other non-additive removals: Mention, Adjudication.considers (R-09; owner confirms)"
  - module: K
    name: predicates
    owner: S
    file: final/vocabularies/predicates.yaml
    role: "one predicate registry (R-52); K is registrar of the kernel conventions FIELD_NOT_REPORTED, HAS_REVISION_STATUS, RATES_CLAIM, CORRECTS, HAS_IDENTIFIER, CITES_AS_SUPPORT, HAS_CREDENTIAL and of the qualifiers asserterBasis:, sourceRecordRemovedAt: (R-16, R-24)"
  - module: K
    name: assessment-vocabularies
    owner: S
    file: final/vocabularies/assessment-vocabularies.yaml
    role: one register of assessment subkinds, conclusionCode and facet vocabularies (R-54), including K.claim-relation (REFINES) and the input:<uid>= facets (R-34)
  - module: K
    name: targets
    owner: D5
    file: final/vocabularies/targets.yaml
    version: 0.2.2
    role: "hosted, not consumed by K patterns: the closed target predicates (INTENDED_FOR_TARGET, IMPROVES_TARGET, WORSENS_TARGET, NO_EFFECT_ON_TARGET, MIXED_EFFECT_ON_TARGET, registrar D5) are values of K Assertion.predicate; weighed conclusions are K Assessments with effectDirection (pin R-60)"
  - module: K
    name: frontiers
    owner: D13
    file: final/vocabularies/frontiers.yaml
    version: 0.2.1
    role: "hosted, not consumed by K patterns: a Frontier is an admissible Assertion subject/object and Assessment target through K.Subjectable; the classification Assertion carries the qualifier frontierVocabVersion and basis CURATOR_CLASSIFICATION (pin R-60; R-25)"
  - module: D1
    name: targets
    owner: D5
    file: final/vocabularies/targets.yaml
    version: 0.2.2
    use: objects of target-effect Assertions about D1 substances and materials (Q-D1-23). No D1 typed edge or property points at a Target (pin R-60).
  - module: D1
    name: frontiers
    owner: D13
    file: final/vocabularies/frontiers.yaml
    version: 0.2.1
    use: "consumed only indirectly: compounds reach a frontier through the events they are involved in and the studies that test them; D1 declares nothing (pin R-60; R-91)."
  - module: D1
    name: identifier-schemes
    owner: K
    file: final/vocabularies/identifier-schemes.yaml
    use: UNII, INCHIKEY, PUBCHEM_CID, CAS_RN, CHEBI, DRUGBANK, RXCUI, MESH, WIKIDATA; requested NCBI_TAXON, CULTURE_COLLECTION, DSLD_INGREDIENT, LNHPD_INGREDIENT, SUPPLIER_CODE, FDC_NUTRIENT (OQ-D1-07); uniqueness rule R-42
  - module: D1
    name: kernel-types
    owner: K
    file: final/schema/kernel.graphql
    use: "enums PrivacyClass (Entity field on all 4 node types), TimePrecision and ValidTimeBasis (ContentEdgeProperties base fields); edge-property types AssertedEdgeProperties (PARENT_TAXON; base of ContentEdgeProperties) and AssertedRecordedProperties (HAS_ACTIVE_MOIETY, COUNTS_TOWARD_NUTRIENT, REALIZES_SUBSTANCE, DERIVED_FROM_TAXON); read-side only: Assessment (ASSESSES; facets slot for plantPart=, Q-D1-12), Report, IdentifierLinkProperties (HAS_IDENTIFIER episodes, CQ-ID-04). StateEpisodeProperties is retired (R-10); D1 never used it. Compiled against final/schema/kernel.graphql sha256 ec981e2a…"
  - module: D1
    name: predicates
    owner: S
    file: final/vocabularies/predicates.yaml
    use: "one predicate registry (R-52): D1 registers the entries in D1.relationship.yaml predicateOnly (incl. the R-14 FIELD predicates and SOURCED_FROM_COUNTRY); predicateSeams cite other registrars"
  - module: D1
    name: assessment-vocabularies
    owner: S
    file: final/vocabularies/assessment-vocabularies.yaml
    use: D1 subkinds D1.identity-level.*, D1.dose-mass-basis, D1.form-transfer; facet plantPart= on D5 SAFETY_SIGNAL (R-54)
  - module: D2
    name: targets
    ref: final/vocabularies/targets.yaml@0.2.2
    ruling: R-60
    use: object of predicate MEDIATES_TARGET (Q-D2-10; accepted by D5, OQ-D5-37); D5 Target OPERATIONALIZED_BY → D2.Outcome | D2.Condition (D5 TargetMeasure, R-70)
  - module: D2
    name: frontiers
    ref: final/vocabularies/frontiers.yaml@0.2.1
    ruling: R-60
    use: Q-D2-27 path Frontier ← ON_FRONTIER − Study → arm → context (only Event and Study attach, R-91); frontier `scope.anchors.mechanisms` names map to Mechanism keys by curation (no edge, D13 rule)
  - module: D2
    name: identifier-schemes
    ref: final/vocabularies/identifier-schemes.yaml
    ruling: R-42
    use: REACTOME, GO, UNIPROT, HGNC, NCBI_GENE, ENSEMBL_GENE, MONDO, HPO, ICD10CM, SNOMEDCT, MESH, WIKIDATA; CHEMBL (compound and target ids, one namespace), WIKIPATHWAYS, ORPHANET, OMIM, EFO, KEGG_PATHWAY (status requested; CHEMBL_TARGET folded into CHEMBL); one (scheme, issuer, normalized value) identifies at most one Subjectable; no LOINC on Outcome (R-70)
  - module: D2
    name: kernel-types
    ref: final/schema/kernel.graphql
    ruling: R-47, R-25
    use: enum BasisKind on MechanismProjectionProperties.bestBasis (CURATOR_CLASSIFICATION for the hallmark mapping, one kernel basis order); AssertedRecordedProperties as the base of MechanismReferenceProperties; DerivedEdgeProperties (an M11 base, R-47) as the base of MechanismProjectionProperties; StructuralEdgeProperties as the base of ExposureRoleProperties; enum PrivacyClass (Entity field)
