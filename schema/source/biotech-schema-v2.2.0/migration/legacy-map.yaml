    requires: [from migrated, to migrated]
  - {type: AUTHORED_BY, from: Document, to: Organization, count: 2, disposition: retain-legacy, reason: Knowledge Services document lane (Document retained), properties: {}}
  - type: CONTAINS_COMPOUND_FORM
