  - type: LISTS
    from: Organization
    to: Listing
    count: 10
    disposition: migrate
    condition: "derivation hostMatchesLister"
    target: {kind: predicate-assertion, predicate: HOSTED_BY, subject: to, object: from}
    requires: [from migrated, to migrated]
    reason: the listing's host domain is the organization's own website domain, which is what HOSTED_BY states; seller of record is not stated (Offer held)
  - type: LISTS_PRODUCT
    from: Listing
    to: Product
    count: 10
