  - {type: HAS_SNAPSHOT, from: Listing, to: ListingSnapshot, count: 10, disposition: retain-legacy, reason: snapshot state caches are retained legacy}
  - {type: HAS_SNAPSHOT, from: Organization, to: OrganizationSnapshot, count: 1, disposition: retain-legacy, reason: snapshot state caches are retained legacy}
  - {type: HAS_SNAPSHOT, from: Product, to: ProductSnapshot, count: 10, disposition: retain-legacy, reason: snapshot state caches are retained legacy}
