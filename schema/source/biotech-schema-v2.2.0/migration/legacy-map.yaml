# Common legacy edge property dispositions (overridable per triple).
commonEdgeProperties:
  confidence: {disposition: migrate, to: Assertion.extractionConfidence}
  mongoResearchRunId: {disposition: migrate, to: "qualifier legacy:runId; legacy research Activity"}
  recordedFrom: {disposition: migrate, to: "qualifier legacy:recordedFrom", note: legacy record time kept verbatim}
  validFrom: {disposition: migrate, to: "Assertion.validFrom / episode validFrom (basis UNKNOWN)", transform: isoInstant}
  createdAt: {disposition: retain-legacy}
  role: {disposition: retain-legacy, note: verbatim role text stays on the legacy edge; the locator cites it}
  roleType: {disposition: retain-legacy, note: consumed by conditions/enum maps where listed}
  title: {disposition: retain-legacy}
  notes: {disposition: retain-legacy}

relationships:
