    reason: OD-43 maps a listing only to a single evidenced Package; no Package is evidenced
  - type: MEASURES
    from: LabTest
    to: Biomarker
    count: 45
    disposition: migrate
    target: {kind: asserted-relationship, type: MEASURES_METRIC, class: asserted, edgeProperties: AssertedEdgeProperties, direction: same}
    requires: [from migrated, to migrated]
    properties:
      method: {disposition: retain-legacy}
      methodRole: {disposition: retain-legacy}
