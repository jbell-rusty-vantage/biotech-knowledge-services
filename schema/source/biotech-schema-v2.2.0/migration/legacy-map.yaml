      mongoResearchRunId: {disposition: retain-legacy}
  RegulatoryStatus:
    count: 6
    disposition: migrate
    condition: "statusCode in enumMaps.statusCode"
    elseDisposition: quarantine
    elseReason: "LDT_CLIA_CAP_NOT_FDA_CLEARED_OR_APPROVED states an absence of FDA clearance plus CLIA/CAP laboratory accreditation; mapping it to a LegalStatusKind (e.g. ENFORCEMENT_DISCRETION) is a regulatory interpretation that needs a reviewed RegulatoryRecord"
    target: {type: LegalStatus, token: legal-status, labels: [LegalStatus, Entity], module: D8}
    fields: {statusKind: "enumMap statusCode", statusFamily: MARKET_ACCESS, jurisdiction: jurisdictionCode, pathway: null, statusVerbatim: statusCode, marketStatus: null, claimNumbers: null}
    enumMaps:
      statusCode:
        FDA_APPROVED: APPROVED
    identity: {keys: [statusOf, jurisdiction, pathway, statusKind, marketStatus, claimNumbers], tier: provisional, nameBasis: name}
    properties:
      description: {disposition: retain-legacy, note: LegalStatus has no description field}
      statusCode: {disposition: migrate, to: [statusKind, statusVerbatim], transform: [enumMap, copy]}
      jurisdictionCode: {disposition: migrate, to: jurisdiction}
      effectiveDate: {disposition: retain-legacy, note: String; the STATUS_OF episode takes the edge validFrom}
  Compound:
    count: 19
    disposition: migrate
    target: {type: ChemicalSubstance, token: substance, labels: [ChemicalSubstance, Entity], module: D1}
    reason: named substances without identifiers; the register's provisional identity tier (normalized preferred name, substanceClass) applies until UNII/InChIKey resolution
    fields: {substanceClass: null}
    identity: {keys: [UNII, INCHIKEY, "normalized preferred name", substanceClass], tier: provisional, nameBasis: name}
    heldWork: ["identifier resolution (UNII / INCHIKEY / PUBCHEM_CID)"]
    properties:
      description: {disposition: retain-legacy, note: ChemicalSubstance has no description field}
      searchText: {disposition: migrate, to: searchText}
      commonName: {disposition: retain-legacy, note: synonym; regenerated into searchText by the v2 writer}
  CompoundForm:
    count: 26
    disposition: migrate
    target: {type: IngredientMaterial, token: material, labels: [IngredientMaterial, Entity], module: D1}
    reason: product formulation ingredients; their defining substance and form are not resolved, which v2 records as materialKind UNRESOLVED
    fields: {materialKind: UNRESOLVED}
    identity: {keys: [materialKind, "defining substance", brandName, physicalForm, formDescriptor], tier: provisional, nameBasis: name}
    heldWork: ["REALIZES_SUBSTANCE -> ChemicalSubstance (resolution)"]
    properties:
      description: {disposition: retain-legacy, note: IngredientMaterial has no description field}
      searchText: {disposition: migrate, to: searchText}
      dosageForm: {disposition: quarantine, note: "product dosage-form text with per-serving counts; input to held label/variant work"}
  BellLabsSchemaDeploymentEvidence:
    count: 1
    disposition: retain-legacy
    reason: operational deployment attestation (not domain knowledge); kept as-is, tagged LegacyV0, never migrated
    properties:
      active: {disposition: retain-legacy}
      database: {disposition: retain-legacy}
      deployed_sdl_digest: {disposition: retain-legacy}
      deployment_id: {disposition: retain-legacy}
      deployment_succeeded: {disposition: retain-legacy}
      environment: {disposition: retain-legacy}
      event_kind: {disposition: retain-legacy}
