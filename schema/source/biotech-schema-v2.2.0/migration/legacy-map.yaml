    target: {kind: asserted-relationship, type: HOLDS_ROLE, class: asserted, edgeProperties: RoleEdgeProperties, roleKind: "enumMap role", direction: reversed}
    enumMaps:
      role:
        Employee: EMPLOYEE
        Chief Operating Officer: EXECUTIVE_OFFICER
        Chief Product Officer: EXECUTIVE_OFFICER
        General Counsel: OTHER
        Vice President of Communications and Brand Marketing: OTHER
