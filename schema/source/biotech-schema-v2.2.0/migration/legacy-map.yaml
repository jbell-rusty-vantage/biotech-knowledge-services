    condition: "roleType == DISTRIBUTOR"
    target: {kind: predicate-assertion, predicate: DISTRIBUTES, subject: from, object: to}
    requires: [from migrated, to migrated]
    reason: D7 registered predicate DISTRIBUTES (Organization -> Product) matches the stated roleType; rows without a roleType are held
  - {type: REPORTED_IN, from: Event, to: Document, count: 3, disposition: quarantine, reason: evidence pointer to a document without captured bytes; becomes HAS_EVIDENCE once Knowledge Services captures the document, properties: {aboutness: {disposition: quarantine}, salience: {disposition: quarantine}, extractedAt: {disposition: quarantine}, extractionMethod: {disposition: quarantine}, extractorVersion: {disposition: quarantine}, supportType: {disposition: quarantine}}}
  - {type: SPONSORED_BY, from: Study, to: Organization, count: 2, disposition: quarantine, reason: "role 'Sponsor / affiliated company' does not distinguish funding (FUNDED_BY) from affiliation"}
  - type: USES_PLATFORM
    from: LabTest
    to: TechnologyPlatform
    count: 10
    disposition: migrate
    target: {kind: asserted-relationship, type: PERFORMED_WITH_VERSION, class: asserted, edgeProperties: AssertedEdgeProperties, direction: same}
    requires: [from migrated, to migrated]
    reason: held with its platform when the platform is held (assay platform)
    properties:
      method: {disposition: retain-legacy}
      methodRole: {disposition: retain-legacy}
      sampleType: {disposition: retain-legacy}
      usageContext: {disposition: retain-legacy}
  - {type: USES_PLATFORM, from: Organization, to: TechnologyPlatform, count: 7, disposition: quarantine, reason: no registered v2 relationship for an organization using an algorithm version, properties: {usageContext: {disposition: quarantine}, method: {disposition: quarantine}, methodRole: {disposition: quarantine}, sampleType: {disposition: quarantine}}}

v1Policy:
  liveOccurrence: none (no relationship-type token ABOUT_CONDITION, ASSESSES_CLAIM_EVIDENCE, CLAIM_EVIDENCE_BASED_ON, DEPENDS_ON, HOSTS_CHANNEL, PART_OF_PLAN or USES_COMPONENT exists in the reference export tokens or data)
  authority: DECISIONS.md "Seven unmapped legacy relationships"; S1 hosts migration/v1-map.yaml for v1-shaped imports
  plannerBehaviour: an export containing any of these types fails coverage and must be planned with v1-map.yaml

operationalFindings:
  - id: KS-CHUNK-CONSTRAINTS
    finding: "Aura carries Knowledge Services Enterprise existence constraints on :Chunk (chunkId, chunkKey, index, text NOT NULL) and uniqueness on chunkId/chunkKey. The v2 D9 Chunk stores chunkIndex (not index) and no chunkId/chunkKey, so any v2 Chunk write on Aura fails these constraints."
    impact: no impact on this migration (no Chunk nodes exist or are created); blocks a future v2 Chunk writer and the optional native chunk-vector route
    owner: S1 DDL + lead/operator (production DDL change); recorded in OPTIONAL-CAPABILITIES.md
  - id: LEGACY-INDEXES
    finding: 46 legacy FULLTEXT/VECTOR indexes and 56 RANGE indexes target labels that v2 reuses (Biomarker, LabTest, Metric, Organization, Person, Product, Event, Study, Mechanism, Condition, Claim, Protocol, Chunk). After relabeling, legacy rows leave them and v2 rows with the same property names enter them.
    impact: no correctness impact on typed reads; S1 decides retain/replace in ddl.json; the migration never drops an index
