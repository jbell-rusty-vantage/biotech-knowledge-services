migrations:
  - from: comparator:GE
    to: comparator:GTE
    decision: MD-D12-02
    rule: R-57 spelling; explicit, not silent
  - from: comparator:LE
    to: comparator:LTE
    decision: MD-D12-02
    rule: R-57 spelling; explicit, not silent
  - from: comparator:hu:<arm uid>
    to: comparatorArm:hu:<arm uid>
    decision: MD-D12-02
    rule: "a uid after comparator: is an arm, not an operator (PREDIMED / UPF fixtures)"
  - from: comparator:<free text>
    to: "explicit fixture edit (FU-03): operator into comparator:, wording into the locator"
    decision: MD-D12-02
    rule: ambiguous values are migrated by hand, never guessed
  - from: roleText=<label>
    to: roleText:<label>
    decision: FU-14 a
    rule: one spelling per key; D13 docstrings and fixtures re-keyed
  - from: jurisdiction=<code>
    to: jurisdiction:<code>
    decision: FU-14 a
    rule: one spelling per key
  - from: context:OVERDOSE on a reference-source high-intake statement
    to: "intakeContext:HIGH_INTAKE_SOURCE_STATED (context: omitted)"
    decision: OD-29
    rule: high intake is not an overdose; fixture D5/pregnancy-magnesium-upper-limit is the known case (FU-03 edit)
  - from: "<key>: <free text with a space> on a key whose grammar is a code/uid/duration"
    to: <key>Verbatim:<text> or the locator's exact text
    decision: FU-14 a
    rule: "D12 grammar rule: no space after the separator; free text only under *Verbatim keys"
