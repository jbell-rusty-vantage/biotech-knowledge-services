format: bks-rules.v1
ruleSet: temporal
version: 1.0.0
closes:
  - OD-05
  - KN-05
  - MD-D8-05
definitions:
  AS-OF(x, $asOf): "x.recordedAt <= $asOf AND (x.recordedTo IS NULL OR x.recordedTo > $asOf); current = x.recordedTo IS NULL (records with recordedAt/recordedTo: Assertion, Adjudication, Assessment, Report, Association, DecisionCriterion)"
  EPISODE-AT(r, $asOf): r.recordedFrom <= $asOf AND (r.recordedTo IS NULL OR r.recordedTo > $asOf) on an asserted edge
  VALID-AT(x, $V): (x.validFrom IS NULL OR x.validFrom <= $V) AND (x.validTo IS NULL OR x.validTo > $V); half-open; a null bound is unknown, never ongoing, and is returned flagged
  recorded-only: edge carries recorded time only (recordedFrom/recordedTo); valid time, when needed, is read from the authorizing Assertion via r.assertionUid
  episode: edge carries valid time (validFrom/validTo with basis/precision) and recorded time
rules:
  - id: TM-01
    decision: OD-05 / KN-05
    rule: "Exclusive (non-overlapping) episodes are scoped to (subject, relationship/predicate slot, asserter): same-asserter overlap is rejected; different asserters coexist and cross-source disagreement is preserved. Separately defined global identity constraints are not weakened. K owns CQ-TM-05 and the exclusivity contract; module register rows supply slot policies (exclusive: true)."
  - id: TM-02
    decision: MD-D8-05
    rule: Each source date is retained with its semantic role and locator (e.g. article-effective date vs annex authorization date); no single event clock is chosen silently.
  - id: TM-03
    decision: MD-D11-01
    rule: Provider cache age and fetch metadata are recorded; fetched time is never called observed content time; stale or unknown content clocks remain explicit.
  - id: TM-04
    decision: EX-02
    rule: event-clock/v1 deterministically rematerializes accepted event clocks/status after assertion changes; SUPPORT gates causal edges (LEADS_TO / RESPONDS_TO projectionGate); accepted equivalence is required for event merging.
  - id: TM-05
    decision: OD-16
    rule: Registry history starts at the first retained observation; older versions are imported only from trustworthy captures; coverage start and unavailable historical intervals are shown, never implied complete.
  - id: TM-06
    decision: R-24
    rule: validObservedAt / source record times are the source's own clocks; recordedAt/recordedFrom are BellLabs recording times; the two are never interchanged.
