      - ICD10CM
      - HPO
      - SNOMEDCT
      - MESH
      - WIKIDATA
      - ORPHANET
      - OMIM
      - EFO
    requestedSchemes:
      - ORPHANET
      - OMIM
  Constituent:
    module: D1
    uidToken: constituent
    uidPattern: hu:constituent:<opaque>
    archetype: Entity
    identityKeys:
      - constituentKind
      - "normalized name (nutrients: authority nutrient list name, e.g. 21 CFR 101.9)"
      - CHEBI class id when one exists
    identifierSchemes:
      - CHEBI
      - MESH
      - FDC_NUTRIENT
  DecisionCriterion:
    module: D10
    uidToken: decision-criterion
    uidPattern: hu:decision-criterion:<opaque>
    archetype: Entity
    identityKeys:
      - criterionKey
      - version
    identifierSchemes: []
  Device:
    module: D4
    uidToken: device
    uidPattern: hu:device:<opaque>
    archetype: Entity & Subjectable
    identityKeys:
      - (maker, model designation, generation)
    identifierSchemes:
      - UDI_DI
      - FDA_510K
      - FDA_PRODUCT_CODE
    requestedSchemes:
      - UDI_DI
      - FDA_510K
      - FDA_PRODUCT_CODE
  DietaryPattern:
    module: D12
    uidToken: dietary-pattern
    uidPattern: hu:dietary-pattern:<opaque>
    archetype: Entity & Subjectable (definition concept)
    identityKeys:
      - definedBySourceUid
      - patternKey
      - version
    identifierSchemes:
      - WIKIDATA
    identityNote: "definedBySourceUid = kernel Source uid of the defining document (DOI / PMID / normalized URL); patternKey non-null; version '' when the source names none; definedBy (free-text citation) is presentation only (adversarial review 2026-10-08); definedBySourceUid is a frozen identity key, never the provenance path: the defined-by trace is the attach Assertion's HAS_EVIDENCE (R-46)"
  Event:
    module: D13
    uidToken: event
    uidPattern: hu:event:<opaque>
    archetype: Occurrence
    identityKeys:
      - eventKind
      - primarySubjectUid
      - jurisdiction
      - firstStatedTimeAtPrecision
      - discriminator
    identifierSchemes: []
    identityRule: "Adversarial-review pass. identityKey is a MINT-TIME key, written once when the Event is created and never recomputed: eventKind | primary subject uid | jurisdiction or '-' | the time anchor as first stated (startedAt, or the scheduled window, at its stated precision) | discriminator when required. Primary subject = the object of the one EVENT_ABOUT Assertion with qualifier primary=true; for FINANCING the ISSUER or BORROWER participant, for ACQUISITION the ACQUIREE, for PARTNERSHIP the party whose asset is licensed (the INVOLVES Assertion with primary=true). Discriminator, required when one subject can have several events of one kind on one day: FINANCING instrument (loan-tranche, registered-direct, atm-sales, ipo, follow-on, private-round, grant). Matching never compares key strings: a candidate shares eventKind, primary subject and jurisdiction and has an overlapping time window (scheduled window or occurrence at its precision); a sure match attaches the new Assertions, a doubtful one mints a new Event plus a proposed EQUIVALENCE Assessment, and Events merge only through an accepted EQUIVALENCE Assessment. So a re-guided window, PLANNED → OCCURRED, or a more precise later date is a new Assertion on the SAME Event (Q-D13-11), never a new Event. Several artifacts about one occurrence (8-K, press-release exhibit, registry change, regulator record) are several Assertions about ONE Event; an acquisition's agreement and closing are one Event with two clocks. Fixtures: every Event records `mintedFrom` (snapshot and assertions its key came from)."
  FoodCategory:
    module: D12
    uidToken: food-category
    uidPattern: hu:food-category:<opaque>
    archetype: Entity & Subjectable (classification concept)
    identityKeys:
      - system
      - systemVersion
      - code
    identifierSchemes:
      - WWEIA_CATEGORY
      - FOODEX2
      - LANGUAL
  FoodItem:
    module: D12
    uidToken: food
    uidPattern: hu:food:<opaque>
    archetype: Entity & Subjectable (reference concept)
    identityKeys:
      - definingSystem
      - sourceRecordId
    identifierSchemes:
      - FDC_ID
      - NDB_NUMBER
      - FNDDS_FOOD_CODE
      - FOODON
      - PHENOL_EXPLORER_FOOD
      - WIKIDATA
    identityNote: "(definingSystem, sourceRecordId) whenever the system issues a record id; only CURATED / OTHER records without one use (definingSystem, normalized descriptionVerbatim: NFC, case-folded, whitespace-collapsed) (adversarial review 2026-10-08: FDC descriptions change case and suffix across releases)"
  Frontier:
    module: D13
    uidToken: frontier
    uidPattern: hu:frontier:<opaque>
    archetype: Vocabulary
    identityKeys:
      - key
    identifierSchemes: []
    identityRule: vocabulary key frontier:<slug> from vocab-frontiers.yaml; never reused or renamed; DEPRECATED frontiers name replacedBy
  Identifier:
    module: K
    uidToken: identifier
    uidPattern: hu:identifier:<opaque>
    archetype: Entity
    identityKeys:
      - scheme
      - issuer
      - value
    identifierSchemes:
      - every scheme in identifier-schemes.yaml
  IngredientMaterial:
    module: D1
    uidToken: material
    uidPattern: hu:material:<opaque>
    archetype: Entity
    identityKeys:
      - materialKind
      - defining substance or source taxon
      - brandName
      - specification owner (D7 assertion)
      - physicalForm
      - formDescriptor
      - grade
      - plantPart
      - preparationType
      - extractRatioLow/High
      - extractionSolvent
      - viabilityState
    identifierSchemes:
      - SUPPLIER_CODE
      - DSLD_INGREDIENT
      - LNHPD_INGREDIENT
    requestedSchemes:
      - SUPPLIER_CODE
      - DSLD_INGREDIENT
      - LNHPD_INGREDIENT
  Intervention:
    module: D5
    uidToken: intervention
    uidPattern: hu:intervention:<opaque>
    archetype: Entity (concept)
    identityKeys:
      - normalizedName
      - kind
      - regimenQualifier
    identifierSchemes:
      - MESH
      - SNOMEDCT
      - WIKIDATA
  InterventionComponent:
    module: D3
    uidToken: intervention-component
    uidPattern: hu:intervention-component:<opaque>
    archetype: Entity
    identityKeys:
      - arm
      - materialTextVerbatim (normalized)
      - componentRole
      - payloadHash
    identifierSchemes: []
  LabelVersion:
    module: D6
    uidToken: label-version
    uidPattern: hu:label-version:<opaque>
    archetype: versioned state (content payload; time on the HAS_LABEL_VERSION episode)
    identityKeys:
      - responsibleBrandOrOrgUid (as printed on this version)
      - panelKind
      - jurisdiction
      - labelVersionCode (when printed) else contentDigest
    identifierSchemes:
      - DSLD
    identityNote: a label version is immutable, so its key never changes; a later re-resolution of the printed party changes the NAMES_RESPONSIBLE_PARTY assertion, not the LabelVersion
  LabTest:
    module: D4
    uidToken: lab-test
    uidPattern: hu:lab-test:<opaque>
    archetype: Entity & Subjectable
    identityKeys:
      - (issuer, issuer test code) via kernel Identifier scheme LAB_TEST_CODE (requested)
      - else (issuer, verbatim test name)
    identifierSchemes:
      - LAB_TEST_CODE
      - CPT
    requestedSchemes:
      - LAB_TEST_CODE
  LegalStatus:
    module: D8
    uidToken: legal-status
    uidPattern: hu:legal-status:<opaque>
    archetype: Entity & Subjectable (immutable state; time on the STATUS_OF episode)
    identityKeys:
      - statusOf.uid
      - jurisdiction
      - pathway
      - statusKind
      - marketStatus
      - claimNumbers
    identifierSchemes: []
  Lot:
    module: D8
    uidToken: lot
    uidPattern: hu:lot:<opaque>
    archetype: Entity & Subjectable
    identityKeys:
      - lotOf.uid
      - lotCode (normalized)
    identifierSchemes:
      - LOT_CODE
  Mechanism:
    module: D2
    uidToken: mechanism
    uidPattern: hu:mechanism:<opaque>
    archetype: vocabulary (curated, ~100–300 nodes; Reactome/GO mirrors added on demand)
    identityKeys:
      - key
    identifierSchemes:
      - REACTOME
      - GO
      - WIKIDATA
      - MESH
      - WIKIPATHWAYS
      - KEGG_PATHWAY
    requestedSchemes:
      - WIKIPATHWAYS
  MechanismEvidenceContext:
    module: D2
    uidToken: mech-context
    uidPattern: hu:mech-context:<opaque>
    archetype: occurrence / qualifier payload (implements Entity only; stored label MechanismEvidenceContext only, R-17; immutable; a correction is a new node)
    identityKeys:
      - contextKey
    identifierSchemes: []
  MediaWork:
    module: D9
    uidToken: media-work
    uidPattern: hu:media-work:<opaque>
    archetype: Entity
    identityKeys:
      - channel
      - publisherItemKey
    identifierSchemes:
      - PODCAST_GUID
      - YOUTUBE_VIDEO
      - ISBN
      - DOI
      - WIKIDATA
      - X_POST
      - SUBSTACK_POST
      - SPOTIFY
    requestedSchemes:
      - X_POST
      - SUBSTACK_POST
      - SPOTIFY
    identityFallback: platform item id (YouTube video id, X post id, Substack post id, forum topic id), else normalized canonicalUrl
  MerchantListing:
    module: D6
    uidToken: listing
    uidPattern: hu:listing:<opaque>
    archetype: enduring identity (host catalog entry)
    identityKeys:
