      - RETAILER_ITEM_ID
      - STOREFRONT_PRODUCT_ID
    requestedSchemes:
      - RETAILER_ITEM_ID
      - STOREFRONT_PRODUCT_ID
  Metric:
    module: D4
    uidToken: metric
    uidPattern: hu:metric:<opaque>
    archetype: Entity & Subjectable (definition node)
    identityKeys:
      - LOINC code via kernel Identifier when one exists
      - else (definitionSource, definitionIssuerName, verbatim name, canonicalUnitCode)
    identifierSchemes:
      - LOINC
