rules:
  - id: ID-01
    decision: R-42
    rule: One (scheme, issuer, normalized value) identifies at most one Subjectable; no join through a shared Identifier. Enforced by the identifier_key uniqueness constraint (Identifier scheme, issuer, value); an issuer-less match is reported as ambiguous.
  - id: ID-02
    decision: KN-06 / MD-X-01
    rule: An identifier scheme is writable only when vocabularies/identifier-schemes.yaml marks it active with namespace, issuer, normalization, uniqueness and rights definitions and an exercised capture route; requested schemes stay disabled for writes and keep their registry history.
  - id: ID-03
    decision: EX-04
    rule: "Source identity is a versioned canonical-URI digest (canonical-uri/v1): lowercase scheme and host, default port dropped, fragment dropped, semantic query keys preserved and sorted (e.g. YouTube `v`), only documented tracking keys stripped (utm_*, fbclid, gclid, mc_cid, mc_eid), per-host rules versioned. The canonical URI is retained; a digest collision with a different canonical URI is quarantined, never merged; legacy slug identities are migrated with collision checks."
  - id: ID-04
    decision: MD-D1-03
    rule: compositionDigest (D6 LabelVersion and D1 material composition) is computed over resolved D1 uids, normalized quantity/basis/unit and explicit unknown markers, sorted canonically; provisional names never establish cross-source equivalence; a spelling variant with the same resolved uids has the same digest, a changed formula a different one.
  - id: ID-05
    decision: MD-D5-04 / OD-27
    rule: ProtocolEdition identity hashes the normalized instruction payload per logical edition/section set, not the whole page; the page capture is preserved separately; sponsor/disclosure-only changes are excluded from the hash and do not mint an edition (D7 temporal interest assertions capture them); changed instructions or doses mint a new edition.
  - id: ID-06
    decision: MD-D5-07
    rule: A DOI or ISBN identifies the Publication; Protocol / ProtocolEdition link to their publication. No second identifier holder for the same namespace key.
  - id: ID-07
    decision: BM-06
    rule: ProtocolStep stepKey = section slug + normalized action-text hash with stepKeyAlignmentVersion; a changed or ambiguous alignment preserves the prior step identity and requires a recorded mapping decision (rename fixtures).
  - id: ID-08
    decision: BM-01
    rule: Equivalence scale and material boundaries per D1 (identity levels); a supplier-only change under the same evidenced specification does not create a new material; unresolved specification equivalence is held.
  - id: ID-09
    decision: BM-03
    rule: An extract is not equated to a plant-part UNII because a label database does; record Taxon, plant part and preparation; REALIZES_SUBSTANCE only when the exact source scope supports it.
  - id: ID-10
    decision: BM-05 / MD-D4-02
    rule: A vendor algorithm implementation is a distinct AlgorithmVersion until an accepted EQUIVALENCE assessment says otherwise; published algorithm identity and trademark/name stay separate.
  - id: ID-11
    decision: KN-13
    rule: A QualityResult is reused only when its stable semantic identity and source measurement are unchanged; a new snapshot/locator is retained; re-anchoring alone is not an identity proof; a changed result becomes a new or superseding sourced record.
  - id: ID-12
    decision: MD-D6-02
    rule: Two GTINs may identify one Package only when format, count and market equivalence is evidenced; otherwise separate candidates are retained and resolved; never split solely on sales channel.
  - id: ID-13
    decision: MD-D6-03
    rule: Differently named enforcement products stay distinct until an EQUIVALENCE Assessment supports merging; observed names and their source are stored.
  - id: ID-14
    decision: OD-43
    rule: A listing maps to a single evidenced Package only; ambiguous mappings become held resolution work.
  - id: ID-15
    decision: MD-D7-10 / MD-D11-04
    rule: A rename does not create a new Organization; sponsor names resolve through kernel RESOLUTION with time-aware aliases; no module-owned competing alias database.
  - id: ID-16
    decision: EX-03
    rule: Every capture attempt has a canonical request digest over method, normalized URI, body digest and behavior-affecting non-secret headers; secrets are referenced by credential identity/version, never by value.
types:
  Activity:
    module: K
    uidToken: activity
    uidPattern: hu:activity:<opaque>
    archetype: Occurrence
    identityKeys:
      - externalRunSystem
      - runId
    identifierSchemes: []
  Adjudication:
    module: K
    uidToken: adjudication
    uidPattern: hu:adjudication:<opaque>
    archetype: EvidenceAssessment
    identityKeys:
      - judgmentId
      - else (assertion, adjudicationKind, methodVersion, recordedAt)
    identifierSchemes: []
  Agent:
    module: K
    uidToken: agent
    uidPattern: hu:agent:<opaque>
    archetype: Entity
    identityKeys:
      - agentKind
      - model
      - promptVersion
      - skillVersion
      - toolVersion
    identifierSchemes: []
  AlgorithmVersion:
    module: D4
    uidToken: algorithm-version
    uidPattern: hu:algorithm-version:<opaque>
    archetype: Entity & Subjectable (versioned state; insert-only)
    identityKeys:
      - (familyKey, realization, versionLabel)
      - else (familyKey, realization, issuer, versionPinnedAt) with versionBasis
    identifierSchemes: []
  AssayVersion:
    module: D4
    uidToken: assay-version
    uidPattern: hu:assay-version:<opaque>
    archetype: Entity & Subjectable (versioned state; insert-only)
    identityKeys:
      - payloadHash (identity fields + performing lab uid; + snapshot digest when any identity field is NOT_REPORTED)
    identifierSchemes: []
  Assertion:
    module: K
    uidToken: assertion
    uidPattern: hu:assertion:<opaque>
    archetype: Assertion
    identityKeys:
      - subject
      - predicate
      - object or literal
      - asserter
      - locator set
      - validity
    identifierSchemes: []
  Assessment:
    module: K
    uidToken: assessment
    uidPattern: hu:assessment:<opaque>
    archetype: EvidenceAssessment
    identityKeys:
      - assessmentKind
      - subjects
      - methodVersion
      - inputSetDigest
      - recordedAt
    identifierSchemes: []
  Association:
    module: D10
    uidToken: association
    uidPattern: hu:association:<opaque>
    archetype: Entity
    identityKeys:
      - associationKind
      - memberUids
      - methodVersion
      - inputSetDigest
    identifierSchemes: []
  Award:
    module: D7
    uidToken: award
    uidPattern: hu:award:<opaque>
    archetype: Entity
    identityKeys:
      - (award number, issuer as printed) as a kernel Identifier (AWARD_NUMBER / NIH_PROJECT)
      - (normalized title, start year, issuer as printed) when no number exists
    identifierSchemes:
      - AWARD_NUMBER
      - NIH_PROJECT
      - DOI (award DOIs
      - Crossref grant ids)
    requestedSchemes:
      - NIH_PROJECT
  Biomarker:
    module: D4
    uidToken: biomarker
    uidPattern: hu:biomarker:<opaque>
    archetype: Entity & Subjectable (curated vocabulary node)
    identityKeys:
      - curated slug (hu:biomarker:<slug>)
    identifierSchemes: []
  Brand:
    module: D7
    uidToken: brand
    uidPattern: hu:brand:<opaque>
    archetype: Entity
    identityKeys:
      - (normalized brand name, brandKind, holder organization at first capture)
    identifierSchemes:
      - WIKIDATA
      - WEB_DOMAIN
    requestedSchemes:
      - WEB_DOMAIN
  CaptureAttempt:
    module: D11
    uidToken: capture-attempt
    uidPattern: hu:capture-attempt:<opaque>
    archetype: "Occurrence (implements Entity only; not Subjectable: nothing is asserted about an attempt). Stored labels [CaptureAttempt, Occurrence] per R-17: the :Entity label is only on Subjectable implementers and Identifier"
    identityKeys:
      - uid
    identifierSchemes: []
    identityRule: "uid = hu:capture-attempt:<sha256(runId of the generating Activity | toolId | requestDigest | attemptedAt)>; enforced by the kernel uid uniqueness constraint. runId is not a CaptureAttempt property; for an immutable attempt lastWriterRunId equals it (adversarial review: the earlier key list named generatingActivity.runId, which no constraint can see)"
  CertificationListing:
    module: D8
    uidToken: cert-listing
    uidPattern: hu:cert-listing:<opaque>
    archetype: Entity & Subjectable (authority record)
    identityKeys:
