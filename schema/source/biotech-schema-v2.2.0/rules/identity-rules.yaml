    module: D2
    uidToken: molecular-entity
    uidPattern: hu:molecular-entity:<opaque>
    archetype: reference entity (mirrors UniProt/HGNC; human default, orthologs only on demand)
    identityKeys:
      - ncbiTaxonId
      - primary identifier (UNIPROT for proteins, HGNC for human genes, NCBI_GENE / ENSEMBL_GENE otherwise)
    identifierSchemes:
      - UNIPROT
      - HGNC
      - NCBI_GENE
      - ENSEMBL_GENE
      - WIKIDATA
      - CHEMBL
  Offer:
    module: D6
    uidToken: offer
    uidPattern: hu:offer:<opaque>
    archetype: enduring identity (commercial proposition; prices are Assertions about it)
    identityKeys:
      - listingUid
      - sellerAccountIdVerbatim or 'host'
      - purchaseMode
      - jurisdiction
      - condition
    identifierSchemes:
      - MARKETPLACE_SELLER_ID (requested
      - attached to the seller Organization by D7 and echoed here)
  Organization:
    module: D7
    uidToken: org
    uidPattern: hu:org:<opaque>
    archetype: Entity
    identityKeys:
      - registry identifier (LEI | SEC_CIK | COMPANY_NUMBER (requested) | NPI for NPI-2 | ROR)
      - (normalized legal name, jurisdiction)
      - (group name as printed, entityKind CORPORATE_GROUP)
    identifierSchemes:
      - LEI
      - SEC_CIK
      - ROR
      - NPI
      - WIKIDATA
      - OPENALEX
      - COMPANY_NUMBER
      - UEI
      - CROSSREF_FUNDER
      - WEB_DOMAIN
    requestedSchemes:
      - COMPANY_NUMBER
      - UEI
      - CROSSREF_FUNDER
      - WEB_DOMAIN
  Outcome:
    module: D2
    uidToken: outcome
    uidPattern: hu:outcome:<opaque>
