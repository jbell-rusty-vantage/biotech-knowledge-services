    identifierSchemes: []
  Condition:
    module: D2
    uidToken: condition
    uidPattern: hu:condition:<opaque>
    archetype: vocabulary (MONDO-backed, loaded on demand)
    identityKeys:
      - MONDO identifier when present
      - key
    identifierSchemes:
