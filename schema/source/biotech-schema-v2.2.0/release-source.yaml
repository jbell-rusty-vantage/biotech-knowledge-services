createdAt: "2026-10-25T00:00:00.000Z"
description: "Minor release of biotech-schema-v2.1.0 (Sprint V SV-11, R-SV11): ReportKind STUDY_APPRAISAL (the second Knowledge Services report kind), nullable useDecisionDigest on kernel Activity and Assessment (exact use-decision record digest for official-read revalidation), and two operational KsIntentMarker lookup indexes (dispatchId, markerDigest) for the Knowledge Services dispatch outbox consumer. PostgreSQL (Knowledge Services common component) still owns runs, decisions and the outbox; the graph holds immutable references. No label or relationship type change."
