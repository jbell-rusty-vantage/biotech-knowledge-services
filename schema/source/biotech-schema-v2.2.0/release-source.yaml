releaseNotes:
  - "kernel ReportKind: STUDY_APPRAISAL added (Knowledge Services K08 report kinds evidence_report and study_appraisal; reportKindRef still refines the kind). Additive enum value; readers that switch exhaustively over ReportKind must accept it"
  - "kernel Activity and Assessment: useDecisionDigest (nullable) next to useDecisionRef; official reads compare it with the PostgreSQL authority's use_decision.digest"
  - "registers/node-register.yaml: otherProperties counts and notes for Activity and Assessment; no new filter property, relationship or index on domain labels"
  - "rules/operational-names.yaml: KsIntentMarker gains the dispatch admission fields (dispatchId, markerDigest, payloadDigest, useDecisionRef, useDecisionDigest, revocationEpoch, boundEffectDigest, appliedAt, markerSchemaVersion) and the declared operational DDL entries ks_intent_marker_dispatch_id and ks_intent_marker_marker_digest (RANGE indexes); uniqueness stays on ks_intent_marker_key because one dispatch names one effect key (outbox primary key) and dispatch ids are unique per tenant only"
  - "query-catalog/explain.json: EXPLAIN evidence inherited unchanged from biotech-schema-v2.1.0 (no query source changed, every template statement digest still matches); no new live-database EXPLAIN was run for v2.2.0"
