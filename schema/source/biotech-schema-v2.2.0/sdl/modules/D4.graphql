# ---- fragment D4 ----
# Module D4 — diagnostics, biomarkers and measurement. Model stage (Wave 2) by A3, 2026-10-08.
# Kernel pattern: packets/K/09-reasoning.md (A1, published 2026-10-08). Kernel types are referenced, never re-declared.
# Every @node: implements Entity & Subjectable, lists the 7 Entity fields verbatim, @query(aggregate: false) @mutation(operations: []).
# Every @relationship: aggregate: false, nestedOperations declared, @filterable(byValue: true, byAggregate: false).
# Not declared here (kernel does it once, against Subjectable): subject/object/asserter, identifiers (LOINC, UNIPROT, CHEBI, ...),
# mentions, lineage, assessments. Comparability (pinned ComparabilityAssessment) is a kernel Assessment
# (assessmentKind COMPARABILITY, assessmentSubkind "D4.comparability", verdict in conclusionCode; see 09-reasoning.md).
# Check stage (A3, 2026-10-08): asserted edges no question reads by valid time use the kernel AssertedRecordedProperties.
# Seam targets (stubs only in the scratch compile file): D1 ChemicalSubstance, D2 Mechanism, D2 MolecularEntity, D6 Product, D7 Organization.
# 7 node types · 13 relationship types · 17 from→to pairs · no unions (widest target 1).
# Adversarial-review pass (A3, 2026-10-08): Biomarker carries no identifier schemes (one (scheme, value) identifies one entity; analyte ids
# live on the D1/D2 analyte reached by HAS_ANALYTE); ReferenceIntervalVersion.sex uses D3's population enum SexScope (shared vocabulary,
# declared by D3, not re-declared here) with D3's field names minAgeYears / maxAgeYears; D8 records reach Device through the D6 Product.
# Synthesis (S module editor, 2026-10-08; final/decision-report.md, final/_work/rulings.yaml modules.D4 + global):
#   R-26  PERFORMED_BY_LAB is asserted (AssertedRecordedProperties, [CONNECT]); a curator inference of the performing
#         organization uses basisKind CURATOR_CLASSIFICATION (answers D4 11 #42). The remaining structural edges
#         (QUANTIFIES, HAS_ANALYTE, OUTPUTS_METRIC, REQUIRES_INPUT_METRIC, INTERVAL_FOR) are identity-defining
#         components and stay structural only if the record's attach Assertion cites the defining span.
#   R-72  one Device path: D8 records concern the D6 Product, which DELIVERS the Device (D4 11 #12 closed).
#   R-52  FIELD_NOT_REPORTED is a kernel convention (registrar K); D4 no longer registers it.
#   No type, field or pair is added or removed: 7 node types, 13 relationship types, 17 from->to pairs (packet-check count).

# =====================================================================================================
# Enums (controlled vocabularies; none encodes good/bad)
# =====================================================================================================

"""
Which descriptive fields a source was checked for and did NOT report (00-DIRECTIVE finding: 'not reported' is the
normal value on public artifacts). A field listed here is null by design; a null field not listed is not yet
extracted. Two records whose identity fields are NOT_REPORTED never merge (identity includes the source capture).
PERFORMING_LAB means no captured source names the performing laboratory (site); an organization-level PERFORMED_BY_LAB
edge may still exist as a curator inference: an asserted edge whose Assertion names the asserter and the rule, basisKind
CURATOR_CLASSIFICATION (R-26).
Shared by every D4 type: `notReported: [MeasurementField!]`.
"""
enum MeasurementField {
  METHOD_PRINCIPLE
  INSTRUMENT_MODEL
  REAGENT_KIT
  SOFTWARE_VERSION
  SPECIMEN
  CALIBRATION_TRACEABILITY
  PERFORMING_LAB
  UNIT
  MEASURAND_SYSTEM
  METRIC_METHOD
  VERSION_LABEL
  INPUT_PLATFORM
  INPUT_FEATURES
  TRAINING_POPULATION
  RELIABILITY
  INTERVAL_DERIVATION
  INTERVAL_PARTITION
  EFFECTIVE_DATE
  FIRMWARE_VERSION
}

"What kind of biological referent a Biomarker is."
enum BiomarkerKind {
  METABOLITE
  PROTEIN
  PROTEIN_MODIFICATION
  CELL_POPULATION
  DNA_METHYLATION_PATTERN
  GLYCAN_PROFILE
  PHYSIOLOGICAL_SIGNAL
  COMPOSITE_AGING_INDEX
  OTHER
}

"What a Metric defines: a terminology measurand, an algorithm output, a device estimate, a calculated quantity or a model feature."
enum MetricKind {
  MEASURAND
  ALGORITHM_OUTPUT
  DEVICE_ESTIMATE
  CALCULATED_QUANTITY
  MODEL_FEATURE
}

"Pinned DiagnosticResultKind: is a value measured, calculated from other values, or inferred by a model (DNAm surrogates, PPG-derived estimates)."
enum DiagnosticResultKind {
  MEASURED
  CALCULATED
  INFERRED
}

"Who defines the Metric: a terminology (LOINC), a vendor, a publication, or BellLabs (when no standard code exists)."
enum MetricDefinitionSource {
  LOINC
  VENDOR
  PUBLICATION
  BELLLABS
}

"LOINC scale."
enum MetricScale {
  QUANTITATIVE
  ORDINAL
  NOMINAL
  NARRATIVE
}

"An orderable/purchasable test as offered: one analyte, a panel of tests, or a report computed by algorithms."
enum LabTestKind {
  SINGLE
  PANEL
  ALGORITHM_REPORT
}

"How a test is ordered."
enum OrderChannel {
  CLINICIAN_ORDERED
  DIRECT_TO_CONSUMER
  BOTH
  RESEARCH_USE_ONLY
}

"How the specimen is collected."
enum CollectionMode {
  VENIPUNCTURE
  CAPILLARY_FINGERPRICK
  DRIED_BLOOD_SPOT
  SALIVA
  BUCCAL_SWAB
  URINE
  STOOL
  CONTINUOUS_SENSOR
  OTHER
}

"Method principle (absorbs pinned MeasurementMethod)."
enum MethodPrinciple {
  IMMUNOASSAY_TURBIDIMETRIC
  IMMUNOASSAY_OTHER
  ION_EXCHANGE_HPLC
  BORONATE_AFFINITY
  ENZYMATIC
  CAPILLARY_ELECTROPHORESIS
  LC_MS
  DNA_METHYLATION_ARRAY
  DNA_METHYLATION_SEQUENCING
  GLYCAN_CHROMATOGRAPHY
  ELECTROCHEMICAL_SENSOR
  OPTICAL_SENSOR
  OTHER
}

"Technology platform of a measurement or of an algorithm's required input (absorbs pinned TechnologyPlatform)."
enum MeasurementPlatform {
  ILLUMINA_450K
  ILLUMINA_EPIC_V1
  ILLUMINA_EPIC_V2
  ILLUMINA_MSA
  TARGETED_BISULFITE_SEQUENCING
  WHOLE_GENOME_BISULFITE_SEQUENCING
  LC_MS_TARGETED
  CLINICAL_CHEMISTRY_ANALYZER
  WEARABLE_PPG
  CGM_SENSOR
  OTHER
