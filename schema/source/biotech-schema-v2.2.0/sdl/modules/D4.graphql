# =====================================================================================================
# Node types
# =====================================================================================================

"""
Purpose: the biological referent a measurement is about (NAD+, glycated hemoglobin, IgG glycan profile, pace of
biological aging). The join point of the compound → mechanism → biomarker → test path: D1 analytes and D2 mechanisms
attach here, D3 outcome definitions and D5 targets (OPERATIONALIZED_BY) point here, and several Metrics QUANTIFY one
Biomarker without ever being merged into one series (HbA1c % vs DNAm logA1C).
Identity rule: curated BellLabs slug (`hu:biomarker:<slug>`). No identifiers of its own: a (scheme, value) such as a
ChEBI or UniProt id identifies the analyte (D1 ChemicalSubstance / D2 MolecularEntity, reached by HAS_ANALYTE), never
the Biomarker too. uid token: `biomarker`.
Questions: Q-D4-01, Q-D4-02, Q-D4-16, Q-D4-17, Q-D4-03, CQ-DX-01.
"""
type Biomarker implements Entity & Subjectable
  @node(labels: ["Biomarker", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  biomarkerKind: BiomarkerKind!
  description: String
  "Names, synonyms and analyte names for fulltext entity linking (Q-D4-22)."
  searchText: String
  """class: structural; cardinality: zero_or_one (the chemical analyte when the referent is a defined substance: NAD+, NAAD, 25-OH vitamin D); questions: Q-D4-01, Q-D4-16."""
  analytes: [ChemicalSubstance!]!
    @relationship(type: "HAS_ANALYTE", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: zero_or_one (the gene product when the referent is a protein or protein modification: IL-6, HbA1c's hemoglobin beta; D2 Q-D2-03 'analyte-participant' branch); questions: Q-D4-01, Q-D4-16."""
  analyteEntities: [MolecularEntity!]!
    @relationship(type: "HAS_ANALYTE", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (one Assertion each, citing the paper that establishes the marker, e.g. NAAD for NR utilization); questions: Q-D4-01."""
  reflectsMechanisms: [Mechanism!]!
    @relationship(type: "REFLECTS_MECHANISM", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: the measurand or feature definition — what exactly a number is: LOINC 4548-4 (HbA1c mass fraction in
blood), 'NAD+ in red blood cells (µM)', WHOOP 'hrv_rmssd_milli', Apple 'heartRateVariabilitySDNN', 'DunedinPACE
pace of aging'. Compartment (`systemOntologyId`) and method (`methodText`: RMSSD vs SDNN) live here, so two
measurements are comparable only if they share a Metric (or a COMPARABLE_WITH_CONVERSION assessment links them).
Identity rule: LOINC code when one exists (kernel Identifier, scheme LOINC); else (definitionSource,
definitionIssuerName, verbatim name, canonicalUnitCode). uid token: `metric`.
Questions: CQ-DX-01, CQ-DX-02, Q-D4-01, Q-D4-02, Q-D4-07, Q-D4-16, Q-D4-17, Q-D4-21, Q-D4-22, Q-D4-26.
"""
type Metric implements Entity & Subjectable
  @node(labels: ["Metric", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  metricKind: MetricKind!
  defaultResultKind: DiagnosticResultKind!
  definitionSource: MetricDefinitionSource!
  "Issuer named by the definition (LOINC, WHOOP, Apple, Belsky et al. 2022, BellLabs); presentation and identity only."
  definitionIssuerName: String
  "Verbatim definition text from the defining source."
  definitionText: String
  "LOINC property (e.g. MFr, SCnc) or the source's equivalent."
  propertyText: String
  "LOINC system / compartment as written (Bld, RBC, PBMC, Ser/Plas, wrist skin)."
  systemText: String
  "UBERON / CL id of the compartment (e.g. CL:0000232 erythrocyte, CL:0000842 PBMC); equality join with D2 contexts."
  systemOntologyId: String
  scale: MetricScale
  "LOINC time aspect or window (Pt, night, 24H)."
  timeAspect: String
  "Method inside the definition when it changes the number (RMSSD, SDNN, NGSP %, IFCC mmol/mol)."
  methodText: String
  "UCUM code of the canonical unit."
  canonicalUnitCode: String
  notReported: [MeasurementField!]
  "Names, LOINC long/short/consumer names, vendor field names and definition text for fulltext and vector linking (Q-D4-22)."
  searchText: String
  """class: structural; cardinality: one (curated; several Metrics may quantify one Biomarker); questions: CQ-DX-01, Q-D4-01, Q-D4-16, Q-D4-17."""
  quantifies: [Biomarker!]!
    @relationship(type: "QUANTIFIES", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CREATE, CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: the orderable or purchasable test as a laboratory or vendor offers it (Labcorp 001453 'Hemoglobin (Hb) A1c',
Quest 496, Jinfiniti Intracellular NAD test, TruAge report). Panels are LabTests of kind PANEL that INCLUDE other
LabTests (absorbs pinned PanelDefinition; composition changes are episodes). What it measures (MEASURES_METRIC) and
how (PERFORMED_WITH_VERSION) change over time and are therefore episodes; price and offers are D6.
Identity rule: (issuer, issuer's test code) via the kernel Identifier (scheme LAB_TEST_CODE, requested); else
(issuer, verbatim test name). uid token: `lab-test`.
Questions: CQ-DX-01, Q-D4-01, Q-D4-03, Q-D4-04, Q-D4-12, Q-D4-13, Q-D4-18, Q-D4-19, Q-D4-23, Q-D4-24, Q-D4-25.
"""
type LabTest implements Entity & Subjectable
  @node(labels: ["LabTest", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  testKind: LabTestKind!
  orderChannel: OrderChannel
  collectionModes: [CollectionMode!]
  "Specimen requirements as written (tube, volume, container)."
  specimenText: String
  "Patient preparation, stability and rejection criteria as written (Q-D4-19)."
  preAnalyticalText: String
  notReported: [MeasurementField!]
  """class: asserted; cardinality: one_or_more (episode: labs remap result codes to LOINC); questions: CQ-DX-01, Q-D4-01, Q-D4-03, Q-D4-17, Q-D4-25."""
  metrics: [Metric!]!
    @relationship(type: "MEASURES_METRIC", direction: OUT, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (episode: a method or instrument change closes one and opens the next; several open when regional labs differ); questions: CQ-DX-01, CQ-DX-03, Q-D4-01, Q-D4-02, Q-D4-11, Q-D4-23."""
  assayVersions: [AssayVersion!]!
    @relationship(type: "PERFORMED_WITH_VERSION", direction: OUT, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (episode: a report's algorithm implementation changes); questions: CQ-DX-02, CQ-DX-04, Q-D4-04, Q-D4-06, Q-D4-20, Q-D4-23."""
  algorithmVersions: [AlgorithmVersion!]!
    @relationship(type: "PERFORMED_WITH_VERSION", direction: OUT, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (PANEL only; episode = panel composition version); questions: Q-D4-03, Q-D4-25."""
  components: [LabTest!]!
    @relationship(type: "INCLUDES_TEST", direction: OUT, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (stored Product → LabTest; D6 Product is the purchasable item that delivers this test); questions: Q-D4-01, Q-D4-10, Q-D4-13, Q-D4-18, Q-D4-24."""
  products: [Product!]!
    @relationship(type: "DELIVERS", direction: IN, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: how one laboratory ran one measurement procedure — performing lab (exactly one), method principle,
instrument model, reagent kit, software version, specimen types, calibration traceability, reported unit — each
field null and listed in `notReported` when the source is silent. The unit a comparability judgment
(kernel Assessment, subkind D4.comparability) is about; absorbs pinned MeasurementMethod, Specimen and
ReferenceSystem as properties and the instrument as text.
Identity rule: payloadHash over the identity fields plus the performing lab uid; when any identity field is
NOT_REPORTED the capture's snapshot digest joins the hash, so two NOT_REPORTED versions never merge.
uid token: `assay-version`.
Questions: CQ-DX-01, CQ-DX-03, CQ-DX-06, CQ-AX-21, Q-D4-02, Q-D4-11, Q-D4-19, Q-D4-23.
"""
type AssayVersion implements Entity & Subjectable
  @node(labels: ["AssayVersion", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  methodPrinciple: MethodPrinciple
  "Method as written (e.g. 'Turbidimetric Inhibition Immunoassay', 'Roche Tina Quant')."
  methodText: String
  instrumentModelText: String
  "Reagent kit / package insert as written (e.g. 'Tina-quant Hemoglobin A1c Gen.3')."
  reagentKitText: String
  softwareVersion: String
  platform: MeasurementPlatform
  specimenKinds: [SpecimenKind!]
  "UBERON / CL ids of the specimen compartment(s); equality with Metric.systemOntologyId and D2 contexts."
  specimenOntologyIds: [String!]
  calibrationTraceability: CalibrationTraceability
  "UCUM code of the unit the lab reports."
  reportedUnitCode: String
  notReported: [MeasurementField!]
  "sha256:<hex> identity digest (see Identity rule)."
  payloadHash: String!
  """class: asserted (R-26: links two independently identified records; recorded time only); cardinality: exactly_one (part of the version's identity: two labs = two assay versions; a curator inference of the performing organization uses basisKind CURATOR_CLASSIFICATION); questions: CQ-DX-01, CQ-DX-03, Q-D4-04."""
  performingLab: [Organization!]!
    @relationship(type: "PERFORMED_BY_LAB", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: one fixed realization of a clock, risk score, wearable score, signal-processing or firmware build:
the publication reference version (DunedinPACE, Belsky 2022), a vendor implementation ('DunedinPACE™' in TruAge,
version not stated), a device software state pinned by a vendor change date (WHOOP heart-rate algorithm of
2026-07-06, CHANGE_EVENT_UNLABELED), or an unversioned service endpoint pinned by retrieval date. Absorbs the
pinned Algorithm family (`algorithmFamily`, `familyKey`) and FirmwareVersion (algorithmKind FIRMWARE).
Identity rule: (familyKey, realization, versionLabel) when a label exists; else (familyKey, realization, issuer,
versionPinnedAt) with versionBasis saying why. uid token: `algorithm-version`.
Questions: CQ-DX-02, CQ-DX-04, CQ-DX-05, CQ-DX-07, CQ-DX-09, Q-D4-04, Q-D4-05, Q-D4-06, Q-D4-14, Q-D4-15, Q-D4-20, Q-D4-23, Q-D4-26.
"""
type AlgorithmVersion implements Entity & Subjectable
  @node(labels: ["AlgorithmVersion", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Family name as sources write it (DunedinPACE, GrimAge, InnerAge, WHOOP heart rate)."
  algorithmFamily: String!
  "Normalized family slug (dunedinpace, grimage, innerage); questions group and filter by family."
  familyKey: String!
  algorithmKind: AlgorithmKind!
  realization: AlgorithmRealization!
  versionLabel: String
  versionBasis: AlgorithmVersionBasis!
  "Source-stated date of the change or release that pins this version (payload, not query validity)."
  versionPinnedAt: Date
  outputKind: AlgorithmOutputKind
  inputPlatforms: [MeasurementPlatform!]
  "Number of input features (173 CpG sites for DunedinPACE)."
  inputFeatureCount: Int
  trainingPopulationText: String
  "Component a device software state applies to (heart rate, sleep staging, firmware)."
  componentLabel: String
  notReported: [MeasurementField!]
  """class: structural; cardinality: one_or_more; questions: CQ-DX-02, CQ-DX-04, Q-D4-07, Q-D4-16, Q-D4-17, Q-D4-26."""
  outputs: [Metric!]!
    @relationship(type: "OUTPUTS_METRIC", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CREATE, CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many (ordered by orderIndex when the source orders components); questions: CQ-DX-04, CQ-DX-07, Q-D4-26 (traversed in reverse: which scores inherit a HARM signal on an input metric)."""
  inputs: [Metric!]!
    @relationship(type: "REQUIRES_INPUT_METRIC", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CREATE, CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: zero_or_one (vendor implementation → publication version; successor → predecessor); questions: Q-D4-06, Q-D4-20, CQ-DX-04."""
  derivedFrom: [AlgorithmVersion!]!
    @relationship(type: "DERIVED_FROM_ALGORITHM_VERSION", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (episode: which software state ran on a device model when); questions: CQ-DX-09, Q-D4-07, Q-D4-09, Q-D4-17, Q-D4-23."""
  devices: [Device!]!
    @relationship(type: "RUNS_ON_DEVICE", direction: OUT, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: one interval or limit a laboratory or vendor applies for one Metric on one AssayVersion and one population
partition, with its kind (reference interval, decision limit, guideline target, vendor 'optimal' target) and
derivation (usually NOT_REPORTED), the verbatim interval text, and the source-stated effective period as payload.
Absorbs the pinned legacy ReferenceRange (derivation NOT_REPORTED, partition as text). A Labcorp HbA1c page yields
four of these from one list. Insert-only; a change is a new version.
Identity rule: payloadHash over (assay version uid, metric uid, intervalKind, partition, bounds, unit, intervalText).
uid token: `ri-version`.
Questions: CQ-DX-06, Q-D4-12, Q-D4-02.
"""
type ReferenceIntervalVersion implements Entity & Subjectable
  @node(labels: ["ReferenceIntervalVersion", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  intervalKind: ReferenceIntervalKind!
  derivation: ReferenceIntervalDerivation!
  "Interval exactly as printed ('4.8% to 5.6%', 'Optimal 40–100 μM')."
  intervalText: String!
  lowerBound: Float
  upperBound: Float
  lowerInclusive: Boolean
  upperInclusive: Boolean
  "UCUM code of the bounds."
  unitCode: String
  "D3 population vocabulary (shared enum SexScope: ALL, FEMALE, MALE, NOT_REPORTED)."
  sex: SexScope
  minAgeYears: Float
  maxAgeYears: Float
  "Other partition as written (pregnancy, fasting state, ancestry)."
  partitionText: String
  "Source-stated effective period (payload; query validity is the publishing source's snapshot time)."
  effectiveFrom: Date
  effectiveTo: Date
  notReported: [MeasurementField!]
  payloadHash: String!
  """class: structural; cardinality: zero_or_one (null only for a vendor target published without any test procedure); questions: CQ-DX-06, Q-D4-12."""
  assayVersions: [AssayVersion!]!
    @relationship(type: "INTERVAL_FOR", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CREATE, CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: exactly_one; questions: CQ-DX-06, Q-D4-12."""
  metrics: [Metric!]!
    @relationship(type: "INTERVAL_FOR", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CREATE, CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: a device or instrument MODEL as its maker designates it, in its role as a measuring instrument (Oura Ring
Gen3, WHOOP MG, Dexcom G7, FreeStyle Libre 3 sensor, Roche cobas c513, Illumina iScan). Software states attach by
RUNS_ON_DEVICE episodes; the purchasable item is a D6 Product (DELIVERS); clearances, recalls and adverse-event
records are D8 records about that Product (D8 CONCERNS / STATUS_OF -> Product), reached from here through DELIVERS. Absorbs pinned ToolOrInstrument, Modality, Sensor and TechnologyPlatform as enums.
Identity rule: (maker, model designation, generation); UDI-DI / 510(k) numbers attach through the kernel
(schemes UDI_DI, FDA_510K requested). uid token: `device`.
Questions: CQ-DX-09, Q-D4-07, Q-D4-08, Q-D4-09, Q-D4-10, Q-D4-17, Q-D4-18, Q-D4-24.
"""
type Device implements Entity & Subjectable
  @node(labels: ["Device", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  deviceKind: DeviceKind!
  sensingModalities: [SensingModality!]
  "Model family as written (Oura Ring, WHOOP, FreeStyle Libre)."
  deviceFamily: String
  generationLabel: String
  "Maker as written on the source (identity of the Organization is a D6/D7 join)."
  makerName: String
  notReported: [MeasurementField!]
  """class: asserted; cardinality: many (stored Product → Device; the D6 Product that is or contains this model); questions: Q-D4-08, Q-D4-09, Q-D4-10, Q-D4-18, Q-D4-24."""
  products: [Product!]!
    @relationship(type: "DELIVERS", direction: IN, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}
