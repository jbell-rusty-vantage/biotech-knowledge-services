  WHOLE_BLOOD
  SERUM
  PLASMA
  RED_BLOOD_CELLS
  PBMC
  DRIED_BLOOD_SPOT
  CAPILLARY_BLOOD
  SALIVA
  BUCCAL_CELLS
  URINE
  STOOL
  INTERSTITIAL_FLUID
