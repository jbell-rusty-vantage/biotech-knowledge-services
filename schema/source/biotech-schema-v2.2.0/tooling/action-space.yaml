      - "D2:tool:firecrawl-cli: Marketing pages change in place; markdown has image/banner noise. Needed for product/test pages (FC-6, FC-8), not for D2 primary sources"
      - "D4:tool:firecrawl-scrape: markdown is a projection, not the HTTP bytes: the snapshot digest is of the markdown; 4 of 13 re-scraped pages changed bytes within ~45 min (all four vendor-hosted: TruDiagnostic, Jinfiniti, WHOOP community forum, InsideTracker blog; the 6 non-vendor pages and 3 other vendor pages were byte-identical) while quotes stayed put; cookie/consent and nav text pollute offsets; service-area gated sections (Quest LOINC, performing lab) not rendered"
      - "D5:tool:firecrawl-scrape: team concurrency ceiling; NCBI Bookshelf (LiverTox) returns reCAPTCHA; cached results unless `maxAge: 0`"
      - "D6:tool:firecrawl-scrape: renditions are not stable: 5 of 8 pages re-fetched with `--max-age 0` re-rendered differently on the same day (iHerb 16 KB → 105 KB, Amazon, camelcamelcamel, NSF) — quotes survived, offsets did not, so locators must re-anchor by quote+prefix/suffix; nutrition values duplicated and split; images (Nutrition Facts panels) need OCR; `--max-age 0` needed for a fresh fetch"
      - 'D6:tool:firecrawl-search: discovery only; found the MOGO Amazon brand store and ASIN B084FRXSTX that the FDA pages name only as "Amazon"'
      - "D7:tool:firecrawl-scrape: markdown is a projection: digest basis NORMALIZED_TEXT, and PDF parses differ run to run; modal content not captured"
      - "D8:tool:firecrawl-scrape: output is a **projection, not bytes**: its PDF parser printed NCT05040321 in place of NCT05038488 in an FDA footnote (E6), and re-selection against the projection passes — fetch the bytes when the host allows it, keep the projection only as `NORMALIZED_TEXT`"
      - 'D9:tool:firecrawl-scrape: Markdown is a projection (contentHashBasis NORMALIZED_TEXT), not origin bytes; digests change on every fetch for pages with widgets or session ids (HL "Local UV index", LongeCity session ids, YouTube view counts) so offsets drift while exact+context re-selects; refuses reddit.com; cookie banners precede content on peterattiamd.com; OCR errors on PDF letters.'
      - "D9:tool:firecrawl-search: Finds Reddit URLs it then refuses to scrape."
      - "D10:tool:firecrawl-cli: fallback for Cloudflare-protected ODS fact sheets (curl gets a challenge page); `maxAge: 0` forces a live fetch and returns content tvly extract misses (Examine's dated update history, \"Magnesium is most often used for Sleep\"); Bookshelf HTML → reCAPTCHA page; Wiley PDF blocked (`ERR_BLOCKED_BY_RESPONSE`); Consensus → sign-up wall"
      - "D12:tool:firecrawl-scrape: snapshot is Firecrawl's markdown, not origin bytes (NORMALIZED_TEXT basis); the options decide the bytes, so `captureMethod` must record them: with the same `--only-main-content` the FDA and Phenol-Explorer markdown re-scraped byte-identical (C2; review R2), without it the bytes differ (F5); the review also stores an origin-HTML RAW_BYTES sibling (curl) for both pages, so every locator needs quote + prefix/suffix re-anchoring; PDF markdown loses page numbers; failed on the PMC supplement URL (\"All scraping engines failed\")"
      - "D13:tool:firecrawl-scrape: emits no identifiers and its markdown is not byte-stable (a re-scrape of the Nature notice differs by a trailing newline), so it fits the scale's 2 like tool:tavily-extract (adversarial review: was 3); concurrency is team-wide; Metaculus API needs a token so scrape only"
