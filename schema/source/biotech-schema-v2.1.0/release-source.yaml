description: "Minor release of biotech-schema-v2.0.2, the first authored in biotech-knowledge-services (owner decision SV-D10): additive, nullable verification/report binding fields on kernel Activity, Report, Assessment and Assertion plus enums RunSealKind and UseDisposition (Sprint V V07/V08, R-SV10). PostgreSQL (Knowledge Services common component) owns runs, sealed manifests and use decisions; the graph holds immutable references. No label, relationship type or DDL statement change."
