openItems:
  - "1. D8 QualityResult.statedVerdict (CONFORMS / DOES_NOT_CONFORM) is a source-printed verdict on a record row; whether directive 3.2 allows it is an owner decision (packets/D8/11-open-questions.md OQ-D8-14)."
  - "2. Qualifier key for the measure a direction refers to: vocab-targets polarityRule writes `outcome:<uid>`, the final D5 register lists `outcomeUid`; the predicate registry (final/vocabularies/predicates.yaml, R-52) should fix one spelling."
