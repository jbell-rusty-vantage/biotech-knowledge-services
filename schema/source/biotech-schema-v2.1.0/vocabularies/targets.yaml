# Targets vocabulary — shared controlled vocabulary (00-DIRECTIVE 3.1, 3.2)
# Owner D5 (agent A5). Every other domain consumes it through 10-seams.yaml `sharedVocabularies`
# and NEVER re-declares a target node, a target enum or a typed edge to a target from a "means".
# Choices, alternatives and citations: _notes/vocab-targets-notes.md (citation ids [C1]..[C9] refer there).
# Research is not medical advice; a target is a goal people pursue, not a diagnosis or a treatment claim.

version: 0.2.2
status: review-stage              # 0.2.2 (A5 adversarial review, 2026-10-08): additive; ids unchanged since 0.1.0; consumers pinned to 0.2.0 / 0.2.1 stay valid
published: 2026-10-08
changes:
  - "0.2.2: targetKeys exception now names every non-means record that carries target keys as a captured or curated property: D5 ProtocolStep (captured purpose), D13 Frontier (curated frontier-to-goal mapping) and D10 DecisionCriterion (the goals a versioned criteria set serves); still forbidden on any means. Target vs D2 Outcome disambiguated (a Target is what a person pursues; an Outcome is a study endpoint concept; OPERATIONALIZED_BY is the bridge). Goal statements with a Target object use only the five predicates: D10's RECOMMENDS_AGAINST and D9's REPORTS_ADVERSE_EXPERIENCE are not goal predicates (D5 11-open-questions OQ-D5-40, OQ-D5-41)"
  - "0.2.1: measures seam gains D2.Outcome (union TargetMeasure = Biomarker | Metric | Outcome): D2's SDL keeps Outcome, the endpoint concept D3 OutcomeDefinitions MEASURE; the 0.2.0 premise 'D2 proposes no Outcome node' was stale (D2 11-open-questions item 27). Study path names from the D3 SDL: StudyResult -RESULT_FOR-> OutcomeDefinition -MEASURES-> measure"
  - "0.2.0: assessment direction uses the kernel enum EffectDirection (BENEFIT | HARM | MIXED | NO_EFFECT | UNKNOWN), not pinned OutcomeDirection"
  - "0.2.0: population qualifier = an entry `population:<PopulationGroup code | D3 StudyPopulation uid>` in kernel Assertion.qualifiers (no QUALIFIED_BY / APPLIES_TO_POPULATION qualifier assertion: the kernel has neither)"
  - "0.2.0: measures seam retargeted to D4 Biomarker | D4 Metric (D2 proposes no Outcome node); study outcomes reach a target through D3 OutcomeDefinition -> D4 Metric/Biomarker"
  - "0.2.0: seamRule amendment — ProtocolStep.targetKeys (D5-internal captured protocol content) is allowed; it is the protocol's stated purpose for its own step, hashed into the edition payload, never an effect claim"
  - "0.2.0: canonical query rebased on kernel edges HAS_EVIDENCE (Assertion -> SourceLocator), Adjudication -[:ASSESSES]-> Assertion, Assessment -[:ASSESSES]-> means/Target and -[:DERIVED_FROM]-> Assertion"
  - "0.2.0: node implements Entity & Subjectable (kernel pattern); identifier schemes MESH, WIKIDATA attach through the kernel"
owner: D5
agent: A5
consumers: [K, D1, D2, D3, D4, D6, D7, D8, D9, D10, D12, D13]   # synthesis: D11 removed (R-85)

# ---------------------------------------------------------------------------------------------
# 1. The node that carries the vocabulary
# ---------------------------------------------------------------------------------------------
node:
  type: Target                      # owner's word (directive 3.1 "Targets"); renames pinned FunctionalGoal
  labels: [Target, Entity]
  uidPattern: "hu:target:<slug>"    # e.g. hu:target:sleep ; slug = the part after "target:" in `id` below
  idPattern: "target:<slug>"        # stable vocabulary key, stored as property `key`; never reused, never renamed
  identityKeys: [key]
  properties:                       # as declared in 04-schema-proposal.graphql type Target (plus the 7 kernel Entity fields; implements Entity & Subjectable)
    key: "String! unique (e.g. target:sleep)"
    label: "String! display label"
    definition: "String! one-paragraph scope"
    parentKey: "String (null for top level) — hierarchy is a property, max 2 levels, no relationship type spent"
    level: "Int (1 top, 2 child)"
    synonyms: "[String!] — feeds the fulltext index TargetSearch(label, synonyms, definition) for entity linking"
    vocabVersion: "String! (this file's version at creation/last edit)"
    status: "TargetStatus enum ACTIVE | DEPRECATED (deprecated targets keep their node; replacedBy names the successor key)"
    replacedBy: "String"
  disambiguation:
    - "NOT a molecular/drug target (gene, protein, receptor): that is D2 (Mechanism / molecular entity). Agents translating 'what is the target of rapamycin' must go to D2, never to :Target."
    - "NOT the pinned W16 `Target` (a source-stated numeric threshold of a protocol, e.g. 'plasma lithium 0.6-0.8 mmol/L'). That concept stays inside D5 protocols as threshold properties on a measurement plan / step; it is renamed away from `Target` in the D5 SDL (see notes section 2)."
    - "NOT a Condition (D2). Disease treatment intent stays on Condition; a target is a function or state people try to improve. Mapping a target to related conditions is curated in `relatedConditions` below as names only."
    - "NOT a person's private goal. Private UserGoalVersion (PCS) references a Target by uid; nothing private is in the graph."
    - "NOT a Frontier (D13): a frontier is a field-level research goal ('senolytics in humans'); a target is a person-level goal."
  measuresSeam:
    # The only typed relationship the vocabulary spends (argued in 05-relationship-register.yaml, Q-D5-01/14/20).
    relationship: OPERATIONALIZED_BY        # name reused from pinned FunctionalGoal->Target and Outcome->Metric
    from: D5.Target
    to: [D4.Biomarker, D4.Metric, D2.Outcome, D2.Condition]   # union TargetMeasure (4; synthesis R-70 added D2.Condition: incidence of the condition measures the target); 0.1.0 [D2.Outcome, D4.Biomarker]; 0.2.0 [D4.Biomarker, D4.Metric]; 0.2.1 [+ D2.Outcome]
    class: "asserted, recorded time only (synthesis R-26: a curator states the mapping; the authorizing Assertion carries basisKind CURATOR_CLASSIFICATION, R-25); a curated vocabulary mapping, not a claim of effect"
    edgeProperties: AssertedRecordedProperties   # synthesis (final SDL Target.operationalizedBy); was StructuralEdgeProperties
    nestedOperations: [CONNECT]
    aggregate: false
    purpose: "Lets study evidence reach a target: StudyResult -RESULT_FOR-> OutcomeDefinition -MEASURES-> Metric|Biomarker|Outcome|Condition <-OPERATIONALIZED_BY- Target (D3 union OutcomeMeasureTarget, R-70), and lets 'how do I measure progress toward T' be answered."
  sdl: final/schema/D5.graphql (type Target, union TargetMeasure); assembled in final/schema/final_biotech_schema_v2.graphql   # was packets/D5/04-schema-proposal.graphql

# ---------------------------------------------------------------------------------------------
# 2. The targets (12 top level + 3 children = 15)
# Measures and biomarkers are NAMES ONLY (D4 owns measures; D2 owns Outcome concepts).
# frameworks: Examine.com category [C1], PROMIS adult core domain [C2], ICF body-function code (checklist) [C3],
# WHO ICOPE intrinsic-capacity domain [C4], wearable score [C5][C6]. A missing key means no clean match.
# pinned: every entry is an instance of pinned FunctionalGoal (uid hu:functional-goal:* -> hu:target:*; pinned
# goalType was a free String with no enumerated values, so it maps to `key`).
# ---------------------------------------------------------------------------------------------
targets:

  - id: target:longevity
    label: Longevity
    definition: >-
      Living longer and staying healthy for longer: lifespan, healthspan, and slowing the biological processes of
      aging, as people pursuing longevity frame it.
    includes: [lifespan, healthspan, biological aging rate, frailty avoidance, all-cause mortality risk]
    excludes: [treatment of a specific disease (Condition, D2), field-level research programs (Frontier, D13)]
    parent: null
    synonyms: [healthspan, lifespan, healthy aging, anti-aging, slow aging, live longer, extend life]
    exampleOutcomes: [all-cause mortality, incident frailty, intrinsic capacity composite, gait speed decline]
    exampleBiomarkers: [epigenetic clock age, DunedinPACE, phenotypic age, grip strength, VO2max]
    frameworks: {examine: "Healthy Aging & Longevity", icope: "intrinsic capacity (all five domains)"}
    relatedConditions: [frailty, sarcopenia]
    pinned: {type: FunctionalGoal, goalType: null}
    note: "Clock-age changes are surrogate outcomes; the direction of effect on a clock never implies a lifespan effect (D4 EndpointClass)."

  - id: target:sleep
    label: Sleep
    definition: Getting enough, timely, uninterrupted and restorative sleep.
    includes: [sleep duration, sleep onset latency, sleep continuity, sleep quality, circadian timing, daytime sleepiness]
    excludes: [diagnosed sleep disorders as conditions (insomnia disorder, sleep apnea: D2 Condition; linked by relatedConditions)]
    parent: null
    synonyms: [better sleep, sleep quality, fall asleep faster, deep sleep, sleep hygiene, restful sleep]
    exampleOutcomes: [PROMIS Sleep Disturbance, Pittsburgh Sleep Quality Index, sleep onset latency, total sleep time, wake after sleep onset]
    exampleBiomarkers: [polysomnography sleep stages, actigraphy sleep efficiency, wearable sleep score, dim-light melatonin onset]
    frameworks: {examine: "Sleep", promis: "Sleep Disturbance", icf: "b134 Sleep", wearable: "Oura Sleep Score; WHOOP Sleep Performance"}
    relatedConditions: [insomnia, obstructive sleep apnea]
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:brain-fitness
    label: Brain fitness
    definition: >-
      Cognitive performance and its preservation: attention and focus, memory, processing speed, executive function,
      and resistance to cognitive decline.
    includes: [focus, attention, memory, processing speed, executive function, cognitive decline prevention]
    excludes: [mood and anxiety (target:mood), dementia treatment (Condition)]
    parent: null
    synonyms: [cognition, cognitive function, focus, memory, mental performance, nootropic effect, brain health]
    exampleOutcomes: [PROMIS Cognitive Function, reaction time, digit span, Trail Making Test, incident MCI or dementia]
    exampleBiomarkers: [plasma p-tau217, brain MRI volumetry, cognitive test battery scores]
    frameworks: {examine: "Brain Health", promis: "Cognitive Function", icf: "b140 Attention; b144 Memory; b164 Higher level cognitive functions", icope: "cognition"}
    relatedConditions: [mild cognitive impairment, dementia]
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:mood
    label: Mood and stress
    definition: "Emotional well-being: positive mood, low anxiety, stress resilience."
    includes: [mood, anxiety, stress, emotional resilience, well-being]
    excludes: [diagnosed depressive or anxiety disorders as conditions (relatedConditions), cognitive performance (target:brain-fitness)]
    parent: null
    synonyms: [mood, stress, anxiety, calm, resilience, well-being, mental health, relaxation]
    exampleOutcomes: [PROMIS Anxiety, PROMIS Depression, Perceived Stress Scale, positive and negative affect]
    exampleBiomarkers: [salivary cortisol, heart rate variability]
    frameworks: {examine: "Mental Health", promis: "Anxiety; Depression", icf: "b152 Emotional functions", icope: "psychological"}
    relatedConditions: [major depressive disorder, generalized anxiety disorder]
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:energy
    label: Energy
    definition: Subjective energy and vitality across the day; absence of fatigue.
    includes: [fatigue, vitality, alertness, daytime energy]
    excludes: [exercise capacity (target:endurance), sleepiness caused by sleep loss (scored on target:sleep)]
    parent: null
    synonyms: [energy, fatigue, vitality, tiredness, alertness, stamina (everyday)]
    exampleOutcomes: [PROMIS Fatigue, Fatigue Severity Scale, vitality subscale]
    exampleBiomarkers: [ferritin, TSH, hemoglobin]
    frameworks: {examine: "Energy & Fatigue", promis: "Fatigue", icf: "b130 Energy and drive functions", icope: "vitality"}
    relatedConditions: [myalgic encephalomyelitis/chronic fatigue syndrome, hypothyroidism, iron deficiency anemia]
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:strength
    label: Strength
    definition: Muscular strength and power and the physical function they support.
    includes: [maximal strength, power, grip strength, physical function, mobility]
    excludes: [muscle size (target:muscle-mass), aerobic capacity (target:endurance)]
    parent: null
    synonyms: [strength, power, muscle function, physical function, functional fitness]
    exampleOutcomes: [one-repetition maximum, handgrip strength, chair-stand test, PROMIS Physical Function]
    exampleBiomarkers: [grip dynamometry, isokinetic torque]
    frameworks: {examine: "Muscle Gain & Exercise", promis: "Physical Function", icf: "b730 Muscle power", icope: "locomotion"}
    relatedConditions: [sarcopenia]
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:endurance
    label: Endurance
    definition: Cardiorespiratory fitness and the capacity to sustain aerobic work.
    includes: [VO2max, aerobic capacity, exercise tolerance, endurance performance]
    excludes: [everyday subjective energy (target:energy), strength]
    parent: null
    synonyms: [cardio fitness, aerobic fitness, VO2max, stamina, cardiorespiratory fitness, zone 2]
    exampleOutcomes: [VO2max, time to exhaustion, 6-minute walk distance, time-trial performance]
    exampleBiomarkers: [VO2max (CPET or wearable estimate), lactate threshold, resting heart rate]
    frameworks: {examine: "Muscle Gain & Exercise", icope: "locomotion; vitality"}
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:recovery
    label: Recovery
    definition: >-
      How well the body restores between loads (training, stress, illness): readiness to perform, soreness,
      autonomic balance.
    includes: [training recovery, readiness, muscle soreness, autonomic recovery]
    excludes: [sleep itself (target:sleep; sleep is an input to recovery), injury rehabilitation as a condition]
    parent: null
    synonyms: [recovery, readiness, soreness, bounce back, recovery score, overtraining]
    exampleOutcomes: [delayed-onset muscle soreness rating, performance recovery between sessions, wearable recovery/readiness score]
    exampleBiomarkers: [heart rate variability, resting heart rate, creatine kinase]
    frameworks: {wearable: "Oura Readiness Score; WHOOP Recovery"}
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:body-composition
    label: Body composition
    definition: The proportion and distribution of fat, lean mass and bone; includes weight management.
    includes: [body fat, visceral fat, lean mass, body weight, waist circumference]
    excludes: [glucose and lipid control (target:cardiometabolic-health)]
    parent: null
    synonyms: [body composition, physique, weight, body recomposition]
    exampleOutcomes: [body weight, waist circumference, DEXA fat and lean mass]
    exampleBiomarkers: [DEXA, bioimpedance, BMI]
    frameworks: {examine: "Fat Loss; Muscle Gain & Exercise", icf: "b530 Weight maintenance"}
    relatedConditions: [obesity, overweight]
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:fat-loss
    label: Fat loss
    definition: Reducing body fat, including visceral fat, and keeping it off.
    includes: [weight loss, fat mass reduction, visceral fat reduction, weight maintenance]
    excludes: [muscle loss during weight loss (scored on target:muscle-mass, usually WORSENS)]
    parent: target:body-composition
    synonyms: [weight loss, fat loss, lose weight, cutting, slimming]
    exampleOutcomes: [body weight change, fat mass change, visceral adipose tissue change]
    exampleBiomarkers: [DEXA fat mass, waist-to-height ratio]
    frameworks: {examine: "Fat Loss", icf: "b530 Weight maintenance"}
    relatedConditions: [obesity]
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:muscle-mass
    label: Muscle mass
    definition: Building or preserving skeletal muscle mass.
    includes: [hypertrophy, lean mass gain, lean mass preservation with age or weight loss]
    excludes: [strength and power (target:strength)]
    parent: target:body-composition
    synonyms: [muscle gain, hypertrophy, lean mass, bulking, muscle preservation]
    exampleOutcomes: [appendicular lean mass, muscle cross-sectional area]
    exampleBiomarkers: [DEXA lean mass, D3-creatine dilution muscle mass, ultrasound muscle thickness]
    frameworks: {examine: "Muscle Gain & Exercise"}
    relatedConditions: [sarcopenia]
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:cardiometabolic-health
    label: Cardiometabolic health
    definition: Healthy blood glucose, lipids, blood pressure and vascular function; lower cardiometabolic risk.
    includes: [glucose regulation, insulin sensitivity, blood lipids, blood pressure, vascular health]
    excludes: [body composition (target:body-composition), treatment of diagnosed cardiovascular disease (Condition)]
    parent: null
    synonyms: [heart health, metabolic health, cardiovascular health, blood sugar, cholesterol, blood pressure]
    exampleOutcomes: [major adverse cardiovascular events, systolic blood pressure, incident type 2 diabetes]
    exampleBiomarkers: [ApoB, LDL-C, triglycerides, HbA1c, fasting insulin, blood pressure, hsCRP]
    frameworks: {examine: "Cardiovascular Health; Diabetes & Blood Sugar", icf: "b410 Heart; b420 Blood pressure"}
    relatedConditions: [type 2 diabetes, dyslipidemia, hypertension, metabolic syndrome, cardiovascular disease]
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:glycemic-control
    label: Glycemic control
    definition: Stable, healthy blood glucose and insulin sensitivity.
    includes: [fasting glucose, postprandial glucose, glycemic variability, insulin sensitivity]
    excludes: [lipids and blood pressure (parent target)]
    parent: target:cardiometabolic-health
    synonyms: [blood sugar control, glucose control, insulin sensitivity, glucose spikes]
    exampleOutcomes: [HbA1c, CGM time in range, incident type 2 diabetes]
    exampleBiomarkers: [HbA1c, fasting glucose, fasting insulin, HOMA-IR, CGM glycemic variability]
    frameworks: {examine: "Diabetes & Blood Sugar"}
    relatedConditions: [prediabetes, type 2 diabetes]
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:gut-health
    label: Gut health
    definition: Comfortable, regular digestion and a healthy gut environment.
    includes: [digestive comfort, bowel regularity, bloating, gut microbiome composition]
    excludes: [diagnosed GI disease (IBD, celiac: Condition)]
    parent: null
    synonyms: [digestion, gut health, microbiome, bloating, regularity]
    exampleOutcomes: [stool frequency, Bristol stool form, GI symptom rating scale]
    exampleBiomarkers: [fecal calprotectin, microbiome diversity index]
    frameworks: {examine: "Gut Health", icf: "b515 Digestive; b525 Defecation"}
    relatedConditions: [irritable bowel syndrome, inflammatory bowel disease]
    pinned: {type: FunctionalGoal, goalType: null}

  - id: target:immune-function
    label: Immune function
    definition: Resistance to and recovery from infection; appropriate (not excessive) inflammation.
    includes: [infection frequency and duration, vaccine response, chronic low-grade inflammation]
    excludes: [autoimmune disease treatment (Condition), allergy treatment (Condition)]
    parent: null
    synonyms: [immunity, immune support, inflammation, inflammaging, fewer colds]
    exampleOutcomes: [upper respiratory infection incidence and duration, vaccine antibody titer]
    exampleBiomarkers: [hsCRP, IL-6, white blood cell count]
    frameworks: {examine: "Immunity & Infectious Disease", icf: "b435 Immunological"}
    pinned: {type: FunctionalGoal, goalType: null}

