# ---------------------------------------------------------------------------------------------
# 3. Polarity rule (directive 3.2: nothing is "good" or "bad" as a property of an entity)
# ---------------------------------------------------------------------------------------------
polarityRule:
  statement: >-
    Helping or hurting a target is never a property of the means (no `goodFor`, `benefits`, `risks`, `safe`,
    `helpsSleep` field, tag or enum on a Product, Compound, Food, Intervention, Protocol or Device, and no typed
    edge from a means to a Target). It is always either (a) an Assertion — one asserter, one located span on one
    captured snapshot, an adjudication — whose predicate carries the direction of effect, whose object is the
    Target node, and which is qualified by the population it applies to; or (b) an assessment (D10, or D3 for
    study-level synthesis) that weighs located evidence and carries `effectDirection`, the Target, the
    population and its method version. Harm uses exactly the same channel as benefit (WORSENS_TARGET), so
    "what helps T" and "what hurts T" are one query with a different direction filter.
  predicates:                         # closed list; values of Assertion.predicate (kernel field), owner D5 (sole registrar, R-52); subjects include D12.FoodCategory (R-85), see final/_work/registers/D5.relationship.yaml predicateOnly
    - {value: INTENDED_FOR_TARGET, direction: none, meaning: "the source states the means is for T (marketing category, protocol goal, label purpose) without asserting an effect"}
    - {value: IMPROVES_TARGET, direction: helps, meaning: "the source states or reports that the means improves T"}
    - {value: WORSENS_TARGET, direction: hurts, meaning: "the source states or reports that the means worsens T (harm, impairment, counter-effect)"}
    - {value: NO_EFFECT_ON_TARGET, direction: none-found, meaning: "the source reports no effect on T (null result, disconfirmation); never inferred from absence"}
    - {value: MIXED_EFFECT_ON_TARGET, direction: mixed, meaning: "the source reports opposite effects on T by dose, subgroup or measure"}
  qualifierSyntax: >-
    Kernel Assertion.qualifiers entries "<key>:<value>" (verification.v1 qualifiers that must survive retelling).
    0.1.0's qualifier assertions (APPLIES_TO_POPULATION via QUALIFIED_BY) are withdrawn: the kernel has no
    QUALIFIED_BY edge, and a string qualifier costs no node, edge or union.
  polarityField: "Assertion.polarity is POSITIVE on these predicates; a denial is written as NO_EFFECT_ON_TARGET or as a SUPPORT Adjudication with a CONTRADICTED verdict (HAS_EVIDENCE role CONTRADICTS) against the original claim, never as a NEGATIVE copy of IMPROVES_TARGET."
  assessmentDirection:
    property: effectDirection
    enum: EffectDirection             # kernel enum: BENEFIT | HARM | MIXED | NO_EFFECT | UNKNOWN (0.1.0 named pinned OutcomeDirection)
    mapping: {IMPROVES_TARGET: BENEFIT, WORSENS_TARGET: HARM, NO_EFFECT_ON_TARGET: NO_EFFECT, MIXED_EFFECT_ON_TARGET: MIXED}
    owner: K (Assessment type, kind EVIDENCE_SYNTHESIS / SAFETY_SIGNAL); D5 registers subkinds D5.target-effect, D5.safety-signal
    shape: "(:Assessment {effectDirection})-[:ASSESSES]->(means) and -[:ASSESSES]->(:Target); inputs -[:DERIVED_FROM]->(:Assertion)"
  requiredQualifiers:
    population: >-
      Mandatory "for whom": who the statement or evidence applies to. Written as one or more qualifier entries
      `population:<code>` with a code from the D5 enum PopulationGroup (UNSPECIFIED, GENERAL_ADULTS, OLDER_ADULTS,
      ADOLESCENTS, CHILDREN, INFANTS, PREGNANT, LACTATING, TRYING_TO_CONCEIVE, ATHLETES, PRE_SURGERY, IMMUNOSUPPRESSED,
      ON_PRESCRIPTION_MEDICATION, OTHER) or `population:<uid>` naming a D3 StudyPopulation. Diseases present are D2
      Conditions (USE_CONSTRAINED_IN object), not population codes. `population:UNSPECIFIED` is explicit, never a
      null that reads as "everyone".
    dose: "optional `dose:<min>-<max> <UCUM unit>/<period>` when the source states one (ranges kept as ranges; never midpoints)"
    coExposure: "optional `coExposure:<uid>` when the effect is conditional on another means (antioxidants x exercise training)"
    outcome: "optional `outcome:<D4 Metric | D4 Biomarker | D2 Outcome | D2 Condition uid>` naming the measure the direction refers to (keeps MIXED explainable). Synthesis note: the final D5 register (final/_work/registers/D5.relationship.yaml) lists this qualifier as `outcomeUid` and adds `duration`; the predicate registry fixes one spelling (goal-polarity.yaml open item 2)"
    basis: "Assertion.basisKind (kernel BasisKind: MANUFACTURER_CLAIM, EXPERT_OPINION, PERSONAL_EXPERIENCE, DIRECT_MEASUREMENT, CITED_FROM_PRIOR_WORK, ...)"
  notAllowed:
    - "a confidence or effect-size number on an edge between a means and a Target (directive 3.6)"
    - "deriving WORSENS from a contraindication or interaction: those are their own D5 safety assertions, which may cite a target-effect assertion"
    - "treating INTENDED_FOR_TARGET as evidence of effect"

# ---------------------------------------------------------------------------------------------
# 4. Canonical query: "what helps / hurts target T, by what evidence, for whom" (as of a time)
# Rebased (0.2.0) on A1's kernel pattern (packets/K/09-reasoning.md, 04-schema-proposal.graphql): HAS_SUBJECT /
# HAS_OBJECT / ASSERTED_BY / HAS_EVIDENCE / ASSESSES / DERIVED_FROM / WAS_GENERATED_BY. Full D5 versions with the
# protocol and study branches: 03-retrieval-patterns.md sections Q-D5-01, Q-D5-02, Q-D5-14, Q-D5-15.
# Parameters: $targetKey ('target:sleep'), $directions (['IMPROVES_TARGET'] helps | ['WORSENS_TARGET','MIXED_EFFECT_ON_TARGET']
# hurts | add NO_EFFECT_ON_TARGET for disconfirmation), $pop (PopulationGroup code or null), $asOf (recorded-time
# as-of), $validAt (valid-time point, optional).
# ---------------------------------------------------------------------------------------------
queryPattern:
  id: QP-TARGET-01
  answerKind: retrieved (assertion branch) + assessment (assessment branch); comparisons/rankings are computed (directive 3.5)
  cypher: |
    // 1. target node, including its children (hierarchy is a property, 2 levels)
    MATCH (t:Target)
    WHERE t.key = $targetKey OR t.parentKey = $targetKey
    // 2. assertions whose object is the target and whose predicate carries the direction
    MATCH (a:Assertion)-[:HAS_OBJECT]->(t)
    WHERE a.predicate IN $directions
      AND a.status IN ['ACCEPTED', 'DISPUTED']
      AND a.recordedAt <= $asOf AND (a.recordedTo IS NULL OR a.recordedTo > $asOf)
      AND ($validAt IS NULL OR ((a.validFrom IS NULL OR a.validFrom <= $validAt)
                            AND (a.validTo IS NULL OR a.validTo > $validAt)))
    MATCH (a)-[:HAS_SUBJECT]->(means)                  // product, compound, food, intervention, protocol, device
    // 3. for whom: population qualifier entries (kernel Assertion.qualifiers)
    WITH t, a, means, [q IN a.qualifiers WHERE q STARTS WITH 'population:' | substring(q, 11)] AS forWhom
    WHERE $pop IS NULL OR $pop IN forWhom OR 'UNSPECIFIED' IN forWhom
    // 4. by what evidence: asserter, located span, snapshot, adjudication, producing run
    MATCH (a)-[:ASSERTED_BY]->(asserter)
    MATCH (a)-[ev:HAS_EVIDENCE]->(loc:SourceLocator)<-[:HAS_LOCATOR]-(snap:SourceSnapshot)
    OPTIONAL MATCH (adj:Adjudication)-[:ASSESSES]->(a)
      WHERE adj.recordedAt <= $asOf AND (adj.recordedTo IS NULL OR adj.recordedTo > $asOf)
    OPTIONAL MATCH (a)-[:WAS_GENERATED_BY]->(act:Activity)
    // 5. weighed conclusions about the same means and target (kernel Assessment), current as of $asOf
    OPTIONAL MATCH (ass:Assessment)-[:ASSESSES]->(means), (ass)-[:ASSESSES]->(t)
      WHERE ass.recordedAt <= $asOf AND (ass.recordedTo IS NULL OR ass.recordedTo > $asOf)
    RETURN t.key AS target,
           labels(means)[0] AS meansType, means.uid AS meansUid, means.name AS means,
           a.predicate AS direction, a.basisKind AS basis, a.uid AS assertionUid, forWhom,
           asserter.uid AS asserterUid,
           collect(DISTINCT {locator: loc.uid, role: ev.role, exact: loc.exact, snapshot: snap.uid,
                             contentHash: snap.contentHash, retrievedAt: snap.retrievedAt}) AS evidence,
           collect(DISTINCT {verdict: adj.verdict, kind: adj.adjudicationKind}) AS adjudications,
           collect(DISTINCT {assessment: ass.uid, effectDirection: ass.effectDirection,
                             methodVersion: ass.methodVersion}) AS assessments,
           act.missionId AS missionId, act.runId AS runId
    ORDER BY meansType, means
  provenanceTrace: "every row carries assertionUid -> HAS_EVIDENCE locator (exact quote) -> snapshot (contentHash, retrievedAt) -> Adjudication verdict -> Activity (missionId, runId); the verifier re-selects the same locator (directive 3.8, 3.10)"
  asOf: "recorded-time as-of on Assertion, Adjudication and Assessment (half-open intervals); optional valid-time point; no edge in the path needs its own episode (the Assertion carries valid and recorded time)"
  protocolBranch: >-
    Protocol content reaches T through the captured purpose of its steps (0.2.0 amendment):
    (p:Protocol)-[he:HAS_EDITION]->(e)-[:HAS_STEP]->(s:ProtocolStep)-[:STEP_USES]->(means) WHERE t.key IN s.targetKeys,
    with the HAS_EDITION episode current at $asOf; rows are labelled STEP_STATES_PURPOSE (stated purpose, no effect)
    and cite the step's own locator (s.locatorUid).
  studyBranch: >-
    Study evidence without a per-result target assertion reaches T through the measures seam:
    (t)-[:OPERATIONALIZED_BY]->(m:Metric|Biomarker|Outcome|Condition)<-[:MEASURES]-(od:OutcomeDefinition)<-[:RESULT_FOR]-(r:StudyResult)
    with the direction from D3's result/assessment (edge names from the D3 SDL, 2026-10-08). Used to feed kernel assessments
    (EVIDENCE_SYNTHESIS, subkind D5.target-effect), not to answer "helps" directly from a single result.
  variants:
    whatIsThisFor: |
      // "what is this product / protocol / compound for" — reverse direction, same evidence trace
      MATCH (a:Assertion)-[:HAS_SUBJECT]->(m {uid: $meansUid})
      WHERE a.predicate IN ['INTENDED_FOR_TARGET','IMPROVES_TARGET','WORSENS_TARGET','NO_EFFECT_ON_TARGET','MIXED_EFFECT_ON_TARGET']
        AND a.recordedAt <= $asOf AND (a.recordedTo IS NULL OR a.recordedTo > $asOf)
      MATCH (a)-[:HAS_OBJECT]->(t:Target)
      MATCH (a)-[:HAS_EVIDENCE]->(loc:SourceLocator)<-[:HAS_LOCATOR]-(snap:SourceSnapshot)
      RETURN t.key, a.predicate, a.basisKind, [q IN a.qualifiers WHERE q STARTS WITH 'claimClass:'] AS claimClass, loc.exact, snap.contentHash
    whatToAvoidForTarget: "QP-TARGET-01 with $directions = ['WORSENS_TARGET','MIXED_EFFECT_ON_TARGET'], joined (UNION) with D5 safety assertions (USE_CONSTRAINED_IN, INTERACTS_WITH, HAS_UPPER_LIMIT) on the means intended for T that RESOLVE_TO a UseConstraint whose scopePopulations or condition matches the asker (03-retrieval-patterns.md Q-D5-03)"
    disconfirmation: "QP-TARGET-01 with $directions = ['NO_EFFECT_ON_TARGET','WORSENS_TARGET','MIXED_EFFECT_ON_TARGET'] on means that also carry IMPROVES_TARGET / INTENDED_FOR_TARGET for T, plus SUPPORT Adjudications with a CONTRADICTED verdict on the positive assertion (03-retrieval-patterns.md Q-D5-14)"
  indexes:
    - "range index :Target(key) unique; range :Target(parentKey)"
    - "range index :Assertion(predicate, recordedAt) (kernel decides)"
    - "fulltext TargetSearch on :Target(label, synonyms, definition) for entity linking of goal mentions"

# ---------------------------------------------------------------------------------------------
# 5. Seam rule: how anything declares what it is for (ONE mechanism: Assertion.predicate)
# ---------------------------------------------------------------------------------------------
seamRule:
  chosen: Assertion.predicate
  rule: >-
    Means never point at a Target with a typed edge or a property. A product, compound or ingredient form, food,
    intervention or protocol edition, device, or an organization's offering declares what it is for, or what it does
    to a target, only through a kernel Assertion: subject = the means (kernel HAS_SUBJECT), object = the Target node
    (kernel HAS_OBJECT), predicate from the closed list (INTENDED_FOR_TARGET, IMPROVES_TARGET, WORSENS_TARGET,
    NO_EFFECT_ON_TARGET, MIXED_EFFECT_ON_TARGET), with one asserter, a locator, valid time and a mandatory
    `population:` qualifier. Weighed conclusions are kernel Assessments that ASSESS the means and the Target and carry
    effectDirection (kernel EffectDirection). Measures are different: a D4 Biomarker or Metric counts toward a target
    through one curated asserted (recorded-time) edge Target-[OPERATIONALIZED_BY]->(Biomarker|Metric|Outcome|Condition) owned by D5 (R-26, R-70); study
    outcomes reach targets through D3 OutcomeDefinition -MEASURES-> D4 Metric/Biomarker or D2 Outcome.
  exception:
    what: "ProtocolStep.targetKeys: [String!] (D5-internal); also D13 Frontier.targetKeys and D10 DecisionCriterion.targetKeys (0.2.2: non-means records whose target keys are curated content, not effect claims)"
    why: >-
      A protocol step is not a means: it is captured, located, immutable edition content (stepKey + payloadHash, its
      own SourceLocator). "For sleep" is part of what the protocol says about its own step, hashed into the edition
      payload, so it needs no separate asserter or adjudication beyond the edition's attach Assertion. Settles the
      research-stage conflict (step -> Target edge vs this rule) at zero relationship types; D13 uses the same device
      (Frontier.targetKeys) and D10 uses it for the goals a criteria set serves (DecisionCriterion.targetKeys); neither
      is a means, so neither is a "good for" tag. Effect statements about a step's means still go through the Assertion
      channel. Disambiguation (0.2.2): a Target is a goal a person pursues (sleep); a D2 Outcome is a study-independent
      endpoint concept (sleep quality as scored, all-cause mortality); the Target is OPERATIONALIZED_BY the Outcome.
    notAllowed: "targetKeys on any means type (Product, ChemicalSubstance, IngredientMaterial, FoodItem, Intervention, Device): rejected below"
  why:
    - "Every 'for T' statement in the wild is a claim by someone (a label, a protocol author, a podcast host, a trial); an Assertion keeps the asserter, span and adjudication the directive requires (3.2, 3.9, 3.10)."
    - "Zero relationship types and zero union members are spent in any consuming module; a typed FOR_TARGET edge from 6+ means types would be a union-wide any-entity edge the directive forbids (rule 1)."
    - "Benefit, harm, null and mixed findings share one channel, so 'what helps' and 'what hurts' cannot drift apart."
  rejected:
    - {option: "typed edge Means-[:FOR_TARGET]->Target per consuming module", reason: "loses asserter/locator unless it is an asserted-edge projection; multiplies pairs across D1/D3/D5/D6/D12; would encode purpose as a fact of the entity"}
    - {option: "property targetKeys: [String] on Product/Compound/Food", reason: "a property is a 'good for' tag on the means, exactly what directive 3.2 forbids; no provenance"}
    - {option: "typed edge ProtocolStep-[:FOR_TARGET]->Target", reason: "costs a relationship type and a pair for what the step's own captured content already says; the property is filterable and hashed with the step"}
    - {option: "derived read-only projection SERVES_TARGET", reason: "may be added later as a materialized projection with a method version if a latency question needs it; not now"}
  consumerObligations:
    - "list `targets: final/vocabularies/targets.yaml@0.2.2` (synthesis R-60 / R-09: references point at final/vocabularies/; was packets/D5/vocab-targets.yaml@0.2.2; 0.2.0 and 0.2.1 also accepted) under sharedVocabularies in 10-seams.yaml (0.1.0 consumers: ids unchanged; rebase QUALIFIED_BY / OutcomeDirection / D2.Outcome references)"
    - "use only the five predicates above for goal statements (a Target as object); propose new ones to D5 in 11-open-questions.md. Not goal predicates: RECOMMENDS_AGAINST and RECOMMENDS_USE (registrar D9, R-83: the means is the subject, never a Target object; a goal goes in the qualifier target:<key>) and REPORTS_ADVERSE_EXPERIENCE (retired, R-84: adverse effects are CAUSES_ADVERSE_EFFECT with a D2 Condition object). The one other predicate with a Target object is D2's MEDIATES_TARGET (subject a D2 Mechanism, not a means; admitted by R-83, OQ-D5-37)"
    - "write the population qualifier on every goal statement (`population:UNSPECIFIED` when the source names none)"
    - "entity-link goal phrases in text to Target keys via synonyms; never mint a new Target node (D5 curates; new targets via a vocabulary version bump)"
    - "D4: accept the incoming curated OPERATIONALIZED_BY seam from Target to Biomarker and Metric (owner D5); D2: the same into Outcome and Condition (R-70)"
    - "K / D10: target-effect assessments ASSESS both the means and the Target and carry effectDirection (kernel EffectDirection)"

citations: "see _notes/vocab-targets-notes.md section 5"

