# ---- fragment D7 ----
# Module D7 — Organizations, people and money. Model stage (Wave 2) by A6, 2026-10-08; adversarial review (A6, 2026-10-08):
# `observedAt` removed from the four superset edge-property types, AWARDED_BY asserted (AssertedRecordedProperties), Award
# identity = award number + issuer as printed, BrandKind INGREDIENT_TRADE_NAME dropped (09-reasoning.md "Adversarial review").
# Synthesis (S module editor for D7, 2026-10-08), rulings in final/decision-report.md: R-30 removed
# RoleEdgeProperties.roleTitleVerbatim and StakeEdgeProperties.stakeClassVerbatim (the printed wording is the authorizing
# Assertion's qualifier `roleText:` / `stakeClass:`) and renamed ValueEdgeProperties.currency to `unitCode`
# (`iso4217:<CODE>`); docstrings of those three types and of OrgRoleKind follow. No type, relationship or pair changed.
# Kernel pattern: packets/K/09-reasoning.md "## Kernel pattern for subject, object, identifier and mention edges" (A1, published
# 2026-10-08) and packets/K/domain-template.graphql. Kernel types are referenced, never re-declared. Every @node:
# @query(aggregate: false) @mutation(operations: []). Every @relationship: aggregate: false, nestedOperations declared,
# @filterable(byValue: true, byAggregate: false). This module declares 4 node types, 7 relationship types, 9 from→to pairs.
#
# Hub split (R7, 00-DIRECTIVE 2 rule 7): Organization declares 2 relationship fields (pinned: 59). Every role edge that
# another domain asks about is declared by that domain on its own type pointing at Organization / Person / Brand / Award
# (Study → Organization in D3, Offer → Organization in D6, Lot/RegulatoryRecord → Organization in D8, Event → Organization
# in D13, ...); Organization declares no inverse field. Subjects, objects, identifiers, mentions, assessments and lineage
# reach these types through the kernel (Subjectable / Entity) and are not declared here.
#
# Financial-interest family (Shape B, see 09-reasoning.md "Shape A vs Shape B"): HOLDS_ROLE (governance and work),
# HOLDS_STAKE (ownership), RECEIVES_VALUE_FROM (money or things of value), each an asserted bitemporal episode authorized by
# one Assertion. A recommendation's reachable financial interest (00-DIRECTIVE 3.9) is the path
# (:Assertion {speechAct: RECOMMENDS})-[:ASSERTED_BY]->(:Person)-[:HOLDS_ROLE|HOLDS_STAKE|RECEIVES_VALUE_FROM]->(:Organization).
#
# The four edge-property types below copy AssertedEdgeProperties' eleven fields verbatim and in order (same names, types,
# nullability; executor-set) and then add the qualifiers a question filters on — the kernel's superset rule for
# domain-local edge-property types (K 09-reasoning M11; OQ-D7-01 resolved). The date at which a source states a tie held
# without bounds is the authorizing Assertion's kernel `validObservedAt`, read through `assertionUid` (rule OVERLAP in 03);
# it is not copied onto the edge (the kernel declined it on edges; OQ-D7-07 closed). AWARDED_BY and AWARDED_TO use kernel
# AssertedRecordedProperties (K M10: asserted, recorded time only).

# =====================================================================================================
# Edge-property types (asserted, bitemporal episode; specializations of kernel AssertedEdgeProperties)
# =====================================================================================================

"""
HOLDS_ROLE episode: AssertedEdgeProperties plus the role qualifier. `roleKind` is the normalized role; the title or code
exactly as printed ("B", "Director", "paid advisor", "Chief Executive Officer") is the authorizing Assertion's qualifier
`roleText:` (R-30: a field that only reproduces the source's wording stays on the Assertion). When no bound is
stated, the bounds stay null (basis OBSERVATION_ONLY / PUBLICATION_PROXY) and the date at which the source states the role
held (table as-of date, filing signature date, revision date of a present-tense statement) is the authorizing Assertion's
`validObservedAt`, read through `assertionUid`.
"""
type RoleEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  lastWriterRunId: String
  roleKind: OrgRoleKind!
}

"""
HOLDS_STAKE episode: AssertedEdgeProperties plus the ownership qualifiers. `stakePercent` only as stated by the source
(never computed; a computed share is a CALCULATED Assertion); `stakeBand` when the source gives a statutory band or a
threshold instead of a number; `ownershipBasis` keeps "may be deemed" apart from record ownership; voting and dispositive
power as stated. Investment is not control (control is PARENT_OF) and "investor" without an instrument is
INVESTOR_UNSPECIFIED, never EQUITY. The class or holding as printed ("1,269,072 shares of common stock", "E", "I") is the
authorizing Assertion's qualifier `stakeClass:` (R-30).
"""
type StakeEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  lastWriterRunId: String
  stakeKind: StakeKind!
  stakePercent: Float
  stakeBand: StakeBand
  ownershipBasis: OwnershipBasis
  votingPower: HoldingPower
  dispositivePower: HoldingPower
}

"""
RECEIVES_VALUE_FROM episode: AssertedEdgeProperties plus what was received. `amount` and `unitCode` (kernel convention
`iso4217:<CODE>`, R-30) only when stated; `valueBucket` is a source's own bucket verbatim (e.g. an institution's FCOI value range). A regulator's hedged
finding ("It appears that ... paid ...") keeps its modality on the authorizing Assertion, not here.
"""
type ValueEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  lastWriterRunId: String
  valueKind: ValueTransferKind!
  amount: Float
  unitCode: String
  valueBucket: String
}

"""
PARENT_OF episode: AssertedEdgeProperties plus `controlKind` (consolidation, wholly owned, general partner, group
membership as stated) and the stated ownership percent when the source gives one with the control fact.
"""
type ControlEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  validFrom: DateTime
  validTo: DateTime
  validFromPrecision: TimePrecision
  validToPrecision: TimePrecision
  validFromBasis: ValidTimeBasis!
  validToBasis: ValidTimeBasis!
  recordedFrom: DateTime!
  recordedTo: DateTime
  lastWriterRunId: String
  controlKind: ControlKind!
  stakePercent: Float
}

# =====================================================================================================
# Enums (controlled vocabularies)
# =====================================================================================================

"What kind of organizational record this is. Replaces the pinned LegalEntity type (LEGAL_ENTITY) and the CORPORATE_GROUP / fund-vehicle distinctions the ownership questions need."
enum OrganizationEntityKind {
  "One legal person registered in a jurisdiction (corporation, LLC, limited company, P.A., trust, fund LP)."
  LEGAL_ENTITY
  "A group named collectively by a source ('EdenRoc Sciences companies', 'Entities affiliated with Andreessen Horowitz'); never pushed to its members."
  CORPORATE_GROUP
  "A business unit, lab, division or programme office without separate legal personality."
  DIVISION_OR_UNIT
  "A government or intergovernmental body (regulator, funder agency)."
  PUBLIC_BODY
  UNSPECIFIED
}

"Coarse, filterable kind of organization (trimmed from the pinned 37-value OrganizationType). Never a role (pinned INV-009): what an organization does for a product, study or event is an edge in the domain that asks."
enum OrganizationKind {
  BIOTECH_OR_PHARMA
  SUPPLEMENT_OR_CONSUMER_HEALTH
  FOOD_OR_BEVERAGE
  DIAGNOSTICS_OR_DEVICE
  CONTRACT_SERVICE_PROVIDER
  TESTING_OR_CERTIFICATION_BODY
  CLINIC_OR_HEALTHCARE_PROVIDER
  RETAILER_OR_MARKETPLACE
  MEDIA_OR_CREATOR_BUSINESS
  INVESTOR_OR_FUND
  ACADEMIC_OR_RESEARCH_INSTITUTE
  NONPROFIT_OR_FOUNDATION
  GOVERNMENT_OR_REGULATOR
  TRADE_OR_PROFESSIONAL_ASSOCIATION
  OTHER
}

"Registry or self-declared status of an organization record; the dated history is in Assertions (predicate ORGANIZATION_STATUS)."
enum OrganizationStatus {
  ACTIVE
  INACTIVE
  DISSOLVED
  MERGED_OR_ACQUIRED
  UNKNOWN
}

"Normalized role kind on HOLDS_ROLE (source codes such as Sinclair's F/A/B, SEC 'Director' / 'Executive Officer' / 'Promoter', ICMJE items map here; the printed code stays in the authorizing Assertion's qualifier roleText:, R-30)."
enum OrgRoleKind {
  FOUNDER
  DIRECTOR
  CHAIR
  BOARD_OBSERVER
  EXECUTIVE_OFFICER
  EMPLOYEE
  ADVISOR
  CONSULTANT
  MANAGING_MEMBER_OR_GENERAL_PARTNER
  PROMOTER
  EDITOR
  OTHER
}

"Kind of holding on HOLDS_STAKE. INVESTOR_UNSPECIFIED keeps 'investor' (no instrument stated) apart from EQUITY (pinned rule: INVESTED_IN does not imply HOLDS_EQUITY_IN)."
enum StakeKind {
  EQUITY
  INVESTOR_UNSPECIFIED
  OPTIONS_OR_WARRANTS
  CONVERTIBLE_OR_SAFE
  LIMITED_PARTNER_INTEREST
  OTHER
}

"Statutory band or disclosure threshold when the source gives no number (UK PSC bands; SEC 5 % table and 10 % owner thresholds)."
enum StakeBand {
  OVER_25_TO_50
  OVER_50_TO_75
  OVER_75
  AT_LEAST_5
  AT_LEAST_10
  BELOW_DISCLOSURE_THRESHOLD
  UNSTATED
}

"Ownership basis as the source states it."
enum OwnershipBasis {
  OF_RECORD
  BENEFICIAL
  MAY_BE_DEEMED
  UNSTATED
}

"Voting or dispositive power over a holding, as stated."
enum HoldingPower {
  SOLE
  SHARED
  NONE
  UNSTATED
}

"What was received on RECEIVES_VALUE_FROM (ICMJE items, FTC material-connection kinds, Sinclair's IP/L codes, NIH FCOI kinds). A family or personal relationship is never stored (privacy rule; 11-open-questions.md)."
enum ValueTransferKind {
  SALARY_OR_FEES
  HONORARIA_OR_SPEAKING
  ROYALTY_OR_LICENSE_INCOME
  INVENTOR_ON_LICENSED_IP
  RESEARCH_FUNDING
  SPONSORSHIP_PAYMENT
  PAID_ENDORSEMENT
  AFFILIATE_COMMISSION
  FREE_OR_DISCOUNTED_PRODUCT
  TRAVEL_OR_MEETING_SUPPORT
  EXPERT_TESTIMONY
  UNSPECIFIED_PAYMENT
}

"Kind of control on PARENT_OF. GROUP_MEMBER_UNSPECIFIED is 'an X company' / 'entities affiliated with X' with no ownership detail; ownership-chain questions exclude it unless asked."
enum ControlKind {
  DIRECT_CONSOLIDATION
  ULTIMATE_CONSOLIDATION
  WHOLLY_OWNED
  MAJORITY_OWNED
  GENERAL_PARTNER_OR_MANAGING_MEMBER
  GROUP_MEMBER_UNSPECIFIED
  DIVISION_OR_UNIT
  OTHER
}

"What a brand is presented on. An ingredient trade name ('Niagen', 'KSM-66') is D1 IngredientMaterial.brandName plus D8 mark ownership, not a Brand."
enum BrandKind {
  CONSUMER_PRODUCT
  CLINIC_OR_SERVICE
  FOOD_OR_RESTAURANT
  MEDIA
  OTHER
}

"Funding instrument of an Award (ARPA-H programmes are contracts, NIH projects are grants, a company 'grant' to a lab may be a sponsored research agreement)."
enum AwardInstrument {
  GRANT
  CONTRACT
  COOPERATIVE_AGREEMENT
  OTHER_TRANSACTION
  SPONSORED_RESEARCH_AGREEMENT
  FELLOWSHIP
  PRIZE
  PHILANTHROPIC_GIFT
  IN_KIND
  UNSPECIFIED
}

"Why a natural person is a public actor (the privacy gate: a Person exists only in the role that makes them public)."
enum PublicActorBasis {
  OFFICER_OR_DIRECTOR
  FOUNDER_OR_INVESTOR
  AUTHOR_OR_INVESTIGATOR
  SPEAKER_OR_CREATOR
  CLINICIAN_PUBLIC_COMMENTATOR
  ENDORSER_NAMED_BY_REGULATOR
  OTHER_PUBLIC_ROLE
}

# =====================================================================================================
# Node types
# =====================================================================================================

"""
Purpose: an organized body as an enduring identity — company, legal entity, corporate group, fund vehicle, university,
lab, agency, clinic operator — that holds stakes, controls other organizations, holds brands, funds awards, and is the
counterparty of a person's role, stake or payment. Absorbs the pinned LegalEntity (entityKind LEGAL_ENTITY) and the
display fields of OrganizationSnapshot; name history is Assertions (predicate LEGAL_NAME / FORMER_NAME with valid time).
It declares only its two outgoing ownership/control fields: every other role (sponsor, seller, manufacturer, issuer,
event participant, content sponsor) is declared by the domain that asks, on its own type, pointing here.
Identity rule: registry identifier first (LEI, SEC_CIK, national company number, NPI-2, ROR), then (normalized legal name,
jurisdiction); a brand name never establishes an Organization (that is a Brand); a group named collectively is its own
record (entityKind CORPORATE_GROUP), never merged with a member. Identifiers attach through the kernel.
uid token: `org` (hu:org:<opaque>).
Questions: CQ-CL-05, CQ-EC-01, CQ-EC-02, CQ-EC-03, CQ-EC-04, CQ-MF-01, Q-D7-01, Q-D7-03, Q-D7-04, Q-D7-05, Q-D7-07,
Q-D7-09, Q-D7-10, Q-D7-13, Q-D7-14, Q-D7-15, Q-D7-19, Q-D7-21, Q-D7-22.
"""
type Organization implements Entity & Subjectable
  @node(labels: ["Organization", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "LEGAL_ENTITY, CORPORATE_GROUP, DIVISION_OR_UNIT, PUBLIC_BODY (Q-D7-01, Q-D7-14, Q-D7-19 filter on it)."
  entityKind: OrganizationEntityKind!
  "Coarse kind for filtering (Q-D7-11, Q-D7-13, Q-D7-22); never a role."
  organizationKind: OrganizationKind
  "Current registered legal name (display projection of the latest LEGAL_NAME Assertion); null when not a LEGAL_ENTITY."
  legalName: String
  "Legal form as printed (Delaware corporation, LLC, Limited, S.A., P.A.)."
  legalFormVerbatim: String
  "ISO 3166-1/-2 code of formation (LEGAL_ENTITY) or of authority (PUBLIC_BODY)."
  jurisdiction: String
  "Registry or self-declared status (projection of the latest ORGANIZATION_STATUS Assertion)."
  status: OrganizationStatus
  description: String
  """class: asserted; cardinality: many (one episode per authorizing Assertion; holder = this organization, e.g. a fund vehicle or holding company); questions: Q-D7-01, Q-D7-13, Q-D7-14, CQ-EC-01, CQ-EC-03."""
  holdsStakes: [Organization!]!
    @relationship(type: "HOLDS_STAKE", direction: OUT, properties: "StakeEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (parent → child; one episode per authorizing Assertion; GLEIF relationship period, acquisition and dissolution dates); questions: Q-D7-01, Q-D7-09, Q-D7-14, Q-D7-19, CQ-EC-03, CQ-EC-02."""
  subsidiaries: [Organization!]!
    @relationship(type: "PARENT_OF", direction: OUT, properties: "ControlEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: a natural person who is a public actor in sourced material — officer, director, founder, investor, author,
investigator, speaker, host, clinician who comments publicly, endorser named by a regulator — and only in that role. The
holder of roles, stakes and payments; a possible asserter (ASSERTED_BY) and the speaker whose recommendations reach a
financial interest. Never stores date of birth, residence or address, contact details, family members or transaction-level
personal payments (privacy rule, 09-reasoning.md); privacyClass must be set (null fails closed).
Identity rule: ORCID, SEC_CIK (Form 4 reporting owner) or NPI-1 when present, else (normalized full name, the public role
and organization that make the person public); a name match alone never merges two Persons (RESOLUTION / EQUIVALENCE
Assessment instead). A handle is not a Person (pseudonymous speakers are D9 accounts; 11-open-questions.md).
uid token: `person` (hu:person:<opaque>).
Questions: CQ-CL-05, CQ-EC-03, CQ-AX-18, CQ-EC-04, Q-D7-02, Q-D7-03, Q-D7-06, Q-D7-07, Q-D7-08, Q-D7-11, Q-D7-12,
Q-D7-17, Q-D7-18, Q-D7-20, Q-D7-24, Q-D7-25.
"""
type Person implements Entity & Subjectable
  @node(labels: ["Person", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Why this person is a public actor (privacy gate; Q-D7-18, Q-D7-24 filter on it)."
  publicActorBasis: [PublicActorBasis!]
  "Post-nominal credentials as printed (MD, PhD, RD); display and filter only, never a role fact."
  credentialsVerbatim: String
  "Display headline; facts in it are not queryable until asserted."
  description: String
  "Discourse projection cache (R-49, Q-D9-19): influence score of this person over the retelling graph (PageRank class), graph-wide, under influenceMethodVersion. A per-topic or per-frontier score is not stored here (open-questions FU-11). Authority: the occurrences and retellings it was computed from."
  influenceScore: Float
  "Method version of the influence cache, e.g. d9-influence/pagerank-v1 (R-45 condition 3)."
  influenceMethodVersion: String @filterable(byValue: false) @sortable(byValue: false)
  "When the PROJECTION Activity derived the influence cache (R-45 condition 3)."
  influenceDerivedAt: DateTime @filterable(byValue: false) @sortable(byValue: false)
  """class: asserted; cardinality: many (one episode per authorizing Assertion; two roles at one organization are two episodes); questions: Q-D7-02, Q-D7-03, Q-D7-08, Q-D7-12, Q-D7-17, Q-D7-25, CQ-CL-05, CQ-EC-03, CQ-AX-18, CQ-EC-04."""
  holdsRoles: [Organization!]!
    @relationship(type: "HOLDS_ROLE", direction: OUT, properties: "RoleEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (one episode per authorizing Assertion); questions: Q-D7-01, Q-D7-03, Q-D7-06, Q-D7-11, Q-D7-12, CQ-CL-05, CQ-EC-03, CQ-AX-18."""
  holdsStakes: [Organization!]!
    @relationship(type: "HOLDS_STAKE", direction: OUT, properties: "StakeEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (one episode per authorizing Assertion; the payer is the target); questions: Q-D7-06, Q-D7-07, Q-D7-16, Q-D7-18, CQ-CL-05, CQ-EC-03, CQ-AX-18, CQ-EC-04."""
  receivesValueFrom: [Organization!]!
    @relationship(type: "RECEIVES_VALUE_FROM", direction: OUT, properties: "ValueEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: a name under which products, services, clinics or media are presented ('Tru Niagen', 'InsideTracker', a clinic
chain name) — kept apart from the legal entity that is accountable for it, because brand ≠ legal entity is the central
identity confusion of this domain (CQ-EC-02, Q-D7-19). D6 points Product → Brand; D12 and D9 may point at it for food and
media brands. Absorbs the pinned ConsumerBrand.
Identity rule: (normalized brand name, brandKind, holder organization at first capture); a renamed brand is the same Brand
with a NAME Assertion episode; a brand registered as a trademark keeps the trademark in D8.
uid token: `brand` (hu:brand:<opaque>).
Questions: CQ-EC-02, Q-D7-06, Q-D7-10, Q-D7-11, Q-D7-19, CQ-CL-05.
"""
type Brand implements Entity & Subjectable
  @node(labels: ["Brand", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  brandKind: BrandKind!
  description: String
  """class: asserted; cardinality: many over time (one open owner episode expected; a licensed operator doing business under the brand is an episode whose authorizing Assertion carries the qualifier tieKind=OPERATOR_DBA); questions: Q-D7-19, Q-D7-10, CQ-EC-02, Q-D7-06, Q-D7-11."""
  owners: [Organization!]!
    @relationship(type: "OWNS_BRAND", direction: IN, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: one funding award — grant, contract, sponsored research agreement, prize, in-kind award — as the join point
between a funder, the recipient institution and investigator, and the studies and publications that cite it (D3 declares
Study → Award; funding statements in papers cite award numbers, FundRef award ids and NIH project numbers). Without it a
paper's "supported by AICO/2021/245" and the funder's own award list cannot meet.
Identity rule: the award number with its issuer as printed by the citing or issuing source, as a kernel Identifier
(scheme requested: AWARD_NUMBER, issuer = the funder name as printed; NIH_PROJECT for NIH core project numbers); else
(normalized title, start year, issuer as printed). Never the funder Organization uid: who funded the award is the asserted
AWARDED_BY edge, so a contested funder is two AWARDED_BY episodes plus a RESOLUTION Assessment, not two Award nodes. A
D13 AWARD Event (prize or funding announcement) points at the Award (EVENT_ABOUT) and carries no amount.
uid token: `award` (hu:award:<opaque>).
Questions: Q-D7-05, Q-D7-15, Q-D7-16, CQ-EC-04, Q-D7-22, Q-D7-25.
"""
type Award implements Entity & Subjectable
  @node(labels: ["Award", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  "Award title as published."
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  instrument: AwardInstrument!
  "Award number exactly as printed by the citing or issuing source (the normalized value is an Identifier)."
  awardNumberVerbatim: String
  "Funding programme as named by the funder (e.g. an ARPA-H programme acronym); a programme node is deferred."
  programName: String
  "Total amount as stated by the funder; null when not disclosed (ARPA-H per-team amounts are not public)."
  amount: Float
  "ISO 4217."
  currency: String
  "Award period as stated by the funder's record (the award's own clock, not an episode)."
  startDate: DateTime
  endDate: DateTime
  datePrecision: TimePrecision
  """class: asserted; cardinality: one or more (co-funded awards; one episode per authorizing Assertion; recorded time only, the period is the award's own); questions: Q-D7-05, Q-D7-15, Q-D7-22, CQ-EC-04."""
  funders: [Organization!]!
    @relationship(type: "AWARDED_BY", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (recipient institutions as stated per source; recorded time only, the period is the award's own); questions: Q-D7-05, Q-D7-15, Q-D7-16, CQ-EC-04."""
  recipientOrganizations: [Organization!]!
    @relationship(type: "AWARDED_TO", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (principal or contact investigator, or the individual recipient of a fellowship or prize; the PI/co-PI distinction is an Assertion qualifier); questions: Q-D7-15, Q-D7-16, Q-D7-25, CQ-EC-04."""
  recipientPersons: [Person!]!
    @relationship(type: "AWARDED_TO", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}
