"""
Purpose: one document-backed act of an authority — regulator, court or patent tribunal — with a record number:
an NDI or GRAS response, a citizen-petition response, a novel-food authorisation, an EFSA opinion, a Health Canada
licence, a Drugs@FDA action, a device 510(k) / De Novo / PMA decision, a warning letter, a recall, a Form 483, a court
or PTAB decision. It is the join point
for "what did the authority say, to whom, about what, when" and the record a LegalStatus is established by.
Enforcement actions are records of family ENFORCEMENT (the research-stage EnforcementAction type is folded in).
Identity rule: (issuer Organization uid, recordKind, normalized recordNumber); a revised letter or a new response is
a new record, never an edit (Q-D8-22 dedupes on this key). Identifiers (FDA_NDI, FDA_GRN, FDA_WARNING_LETTER,
FDA_RECALL, FDA_DOCKET, CELEX, NPN, FDA_APPLICATION, COURT_DOCKET) attach through the kernel.
uid token: `reg-record` (hu:reg-record:<issuer>-<kind>-<number>).
Questions: CQ-MF-02, Q-D8-01, CQ-AX-23, CQ-MF-03, CQ-PF-04, Q-D8-02, Q-D8-03, Q-D8-04, Q-D8-12, Q-D8-13, Q-D8-15,
Q-D8-16, Q-D8-17, Q-D8-18, Q-D8-20, Q-D8-22, Q-D8-23, CQ-EC-01, CQ-MF-06.
"""
type RegulatoryRecord implements Entity & Subjectable
  @node(labels: ["RegulatoryRecord", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "What kind of act this is; fixes what it can and cannot establish."
  recordKind: RegulatoryRecordKind!
  "Coarse family of recordKind (stored for one-hop filtering)."
  recordFamily: RegulatoryRecordFamily!
  "Programme or legal basis the record sits under."
  pathway: RegulatoryPathway
  "ISO 3166-1 alpha-2 code, or EU."
  jurisdiction: String!
  "The issuer's own number, as normalized for identity (e.g. 1259, GRN 000635, 724610, H-0483-2026, 32020R0016, 80112429, 2022-1116)."
  recordNumber: String!
  "Docket the record belongs to (e.g. FDA-2023-P-0872, FDA-2022-S-0023)."
  docketId: String
  "Issuer's date of the act."
  issuedAt: DateTime
  "Issuing office within the authority (e.g. HFP Office of Dietary Supplement Programs, CDER, Fed. Cir.)."
  issuingOffice: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "What the issuer decided or did, per the record."
  outcome: RegulatoryRecordOutcome
  "The record's own decisive sentence, verbatim (also a SourceLocator exact)."
  outcomeVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "The record's own scope-limiting sentence, verbatim (e.g. 'This letter is not an affirmation that ... is GRAS')."
  scopeLimitVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Conditions of use, dose, food categories, population, as written."
  conditionsVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Claims the record authorises (licence purposes), verbatim, one per entry."
  authorisedClaimsVerbatim: [String!] @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Statutory or regulatory citation the act rests on (e.g. 21 U.S.C. 321(ff)(3)(B)(ii)); replaces pinned RegulatoryPathwayVersion."
  legalBasisCitation: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "ENFORCEMENT: violation categories cited."
  violationCategories: [ViolationCategory!]
  "ENFORCEMENT: inspection window the record reports (warning letters state it)."
  inspectionStartedAt: DateTime @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  inspectionEndedAt: DateTime @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "ENFORCEMENT: inspected or cited facility as printed (address), and its FDA FEI when printed; stands in for the deferred Facility type."
  facilityAddressVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  facilityFei: String
  "RECALL: classification and status as last stated; terminatedAt when stated."
  recallClass: RecallClass
  recallStatus: RecallStatus
  terminatedAt: DateTime @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "RECALL / ENFORCEMENT: reason, product description and lot codes verbatim (openFDA reason_for_recall, product_description, code_info)."
  reasonVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  productDescriptionVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  lotCodesVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  """class: asserted; cardinality: exactly_one (the authority: regulator, court, tribunal, patent office); questions: CQ-MF-02, Q-D8-02, Q-D8-12, Q-D8-22."""
  issuedBy: [Organization!]!
    @relationship(type: "ISSUED_BY", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: one_or_more (notifier, applicant, petitioner, licence holder, warned or recalling firm, litigation party); questions: Q-D8-02, Q-D8-03, Q-D8-17, CQ-EC-01."""
  addressedTo: [Organization!]!
    @relationship(type: "ADDRESSED_TO", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (a lot only when the lot code resolves; the verbatim lot text stays in lotCodesVerbatim; a device record concerns the Product that DELIVERS the device, R-72); questions: Q-D8-02, Q-D8-04, Q-D8-16, Q-D8-17, Q-D8-18, Q-D8-23, CQ-EC-01."""
  concerns: [RegulatoryRecordTopic!]!
    @relationship(type: "CONCERNS", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: one legal standing of one subject — an ingredient's or product's market-access standing in one jurisdiction
under one pathway (excluded / not excluded from the supplement definition, no-questions, authorised, licensed,
approved), an exclusivity (EU data protection until 2025-02-20), or a patent's standing at claim level (claims 1–3
held invalid while the aggregator says "Active"). The node is immutable; WHEN it holds is the bitemporal episode on
STATUS_OF, and WHICH record established it is STATUS_FROM. NMN in the US is two statuses: EXCLUDED_FROM_DEFINITION
(valid 2022-10-11 → 2025-09-29, from NDI 1259 response) and NOT_EXCLUDED_FROM_DEFINITION (valid from 2025-09-29,
from the FDA-2023-P-0872 response). A device clearance is CLEARED with pathway US_DEVICE_510K, STATUS_OF the D6 Product
that DELIVERS the D4 Device (R-72); a prescription-only standing is PRESCRIPTION_ONLY in its jurisdiction (R-88); a
designation is DESIGNATED with its programme as pathway (US_BREAKTHROUGH_THERAPY, US_ORPHAN_DESIGNATION, EU_PRIME ...).
Merges pinned RegulatoryStatus, DrugApproval, OrphanDesignation, IpRightStatus.
Identity rule: (subject uid, jurisdiction, pathway, statusKind, marketStatus, sorted claimNumbers); a change of any of
these is a new LegalStatus whose STATUS_OF episode opens as the old one closes. uid token: `legal-status`.
Questions: CQ-MF-02, Q-D8-01, CQ-AX-23, Q-D8-12, Q-D8-13, Q-D8-18, Q-D8-20, Q-D8-14, Q-D8-23, CQ-EC-01.
"""
type LegalStatus implements Entity & Subjectable
  @node(labels: ["LegalStatus", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  statusKind: LegalStatusKind!
  statusFamily: LegalStatusFamily!
  "ISO 3166-1 alpha-2 code, or EU; for patents the office's country code."
  jurisdiction: String!
  pathway: RegulatoryPathway
  "The status words as the issuer or registry printed them (e.g. 'Licence Status: Active')."
  statusVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Licences only: marketed or not, as the registry states."
  marketStatus: MarketStatus
  "IP_RIGHT only: the claim numbers the status applies to; empty means the whole patent."
  claimNumbers: [Int!]
  """class: asserted; cardinality: exactly_one subject per status, many episodes (valid time = when the standing holds; recorded time = when BellLabs knew); questions: CQ-MF-02, Q-D8-01, CQ-AX-23, Q-D8-12, Q-D8-13, Q-D8-14, Q-D8-18, Q-D8-20, Q-D8-23."""
  statusOf: [LegalStatusSubject!]!
    @relationship(type: "STATUS_OF", direction: OUT, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: one_or_more (every record that establishes, confirms or ends this standing); questions: CQ-MF-02, Q-D8-01, CQ-AX-23, CQ-PF-04, Q-D8-12, Q-D8-20, Q-D8-23."""
  establishedBy: [RegulatoryRecord!]!
    @relationship(type: "STATUS_FROM", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: one production lot (batch) of one product or variant — the join key for "is the thing I hold real and lawful":
recall lot lists, COA lot numbers, certifier lot and batch tables, counterfeit reports ('outdated and out-of-market lot
numbers'), the consumer's bottle. Renames pinned ProductLot. Identity rule: (product or variant uid, normalized
lotCode); the printed form stays in lotCode and the scheme LOT_CODE identifier (issuer = brand or manufacturer).
uid token: `lot`. Questions: Q-D8-04, CQ-AX-19, Q-D8-05, Q-D8-07, Q-D8-08, CQ-PF-03a, Q-D8-18.
"""
type Lot implements Entity & Subjectable
  @node(labels: ["Lot", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Lot or batch code as printed (e.g. 216, LNA-199-0715, H26246, P043-01)."
  lotCode: String!
  "Expiry or best-before date as printed."
  expiresAt: DateTime
  "Manufacture date when printed."
  manufacturedAt: DateTime @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  """class: asserted; cardinality: exactly_one (variant when the source distinguishes it, else product); questions: Q-D8-04, CQ-AX-19, Q-D8-08, Q-D8-18."""
  lotOf: [LotOfTarget!]!
    @relationship(type: "LOT_OF", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: one reported outcome for one analyte or check, from one row of a COA, a lot test summary, a certifier batch
page, a lot-identified survey table or a paper — with HOW it was obtained (resultBasis), the criterion printed beside it and the
verdict the source printed. A survey row that names no lot is not a QualityResult: it stays the D1 predicate
MEASURED_CONTENT_IN_PRODUCT or CONTAINS_UNDECLARED_SUBSTANCE on the Product (R-73). A "Certificate of Analysis" is not a node: it is a kernel Source (genre COA or
TEST_SUMMARY) whose rows are QualityResults; "is it a real COA" is a kernel Assessment (QUALITY, subkind
D8.coa-classification) over its rows (Q-D8-05). Merges pinned MeasuredResult, TestExecution, TestSample,
TestMethod, SpecificationCriterion, PassFailInterpretation (source-stated part), CertificateOfAnalysis and
LotTestSummary (row content). Identity rule: (issuer Organization uid, reportNumber or source canonicalUri,
normalized analyteVerbatim, lot uid, testedAt); when the document names no issuer (a COA "manufactured for"
a brand with no laboratory), (source canonicalUri, snapshot contentHash, row selector) replaces issuer and reportNumber.
A re-capture of the same report re-anchors its locators and reuses the result. uid token: `quality-result`. Questions: CQ-AX-19, Q-D8-05, Q-D8-06, Q-D8-09, Q-D8-19.
"""
type QualityResult implements Entity & Subjectable
  @node(labels: ["QualityResult", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "How the row was obtained; MEASURED is the only basis that is a measurement."
  resultBasis: ResultBasis!
  "Analyte or check as printed (e.g. 'NMN', '2.5% Withanolides', 'Lead')."
  analyteVerbatim: String! @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  value: Float
  "UCUM unit of value (and of labelClaimValue)."
  unitCode: String
  valueQualifier: ResultValueQualifier
  "Value cell verbatim (keeps '<0.5', 'ND', 'Conforms', 'Quantity by Input')."
  valueVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Detection or reporting limit printed for the row."
  reportingLimit: Float @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Label claim the row compares against, when the source prints it."
  labelClaimValue: Float @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Percent of label claim when the source states it; otherwise computed at query time, never stored."
  percentOfLabelClaimStated: Float
  "Method as printed (e.g. HPLC-UV, ICP-MS, 'batch record review'); replaces pinned TestMethod."
  method: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Compendial or published method reference (e.g. USP <2091>, AOAC 2012.15)."
  methodReference: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  sampleKind: SampleKind
  "Lab report or certificate number (e.g. Eurofins 3921057-0)."
  reportNumber: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  testedAt: DateTime
  reportedAt: DateTime @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Criterion printed beside the result (inline; replaces pinned SpecificationCriterion). specComparator uses D1 QuantityComparator (R-57); UNKNOWN is kept because comparator glyphs are lost by some PDF extractions (tool-log E4)."
  specComparator: QuantityComparator @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  specLow: Float @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  specHigh: Float @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  specVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  specBasis: CriterionBasis
  specPeriod: SpecPeriod
  "Verdict as the source printed it; an evaluated verdict is a kernel Assessment."
  statedVerdict: PassFailVerdict
  """class: asserted; cardinality: exactly_one (the lot the source names; a row without a lot is a D1 predicate on the Product, R-73); questions: CQ-AX-19, Q-D8-05, Q-D8-06, Q-D8-09, Q-D8-18, Q-D8-19."""
  resultFor: [Lot!]!
    @relationship(type: "QUALITY_RESULT_FOR", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: zero_or_one (only when the analyte resolves; analyteVerbatim always kept); questions: Q-D8-06, CQ-AX-19."""
  analyte: [QualityAnalyte!]!
    @relationship(type: "MEASURES_ANALYTE", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: zero_or_one (the laboratory or tester that reported the row, when the document names one — fixture eurofins-coa-quantity-by-input has a COA that names none; its financial interest is a D7 join); questions: Q-D8-05, Q-D8-06, CQ-AX-19."""
  issuedBy: [Organization!]!
    @relationship(type: "ISSUED_BY", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: one listing record of a certifier (NSF Certified for Sport listing 1451522 'Basis'; an NSF/ANSI 173 listing
row; an Informed Sport product page with its batch table). The listing states a programme, a standard and a scope;
WHAT it covers and WHEN is the bitemporal episode on COVERS (a lot drops off the batch table = its episode closes).
Merges pinned CertificationListing, CertificationProgram (programme and standard properties) and CertificationScope
(scopeVerbatim + COVERS). Identity rule: (certifier Organization uid, programme, listingId; else canonical listing URL).
uid token: `cert-listing`. Questions: CQ-PF-03a, Q-D8-08, Q-D8-19, CQ-MF-06.
"""
type CertificationListing implements Entity & Subjectable
  @node(labels: ["CertificationListing", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Programme name as printed (e.g. NSF Certified for Sport, Informed Sport, USP Verified)."
  programme: String!
  "Standard or guideline (e.g. NSF/ANSI 173, NSF/ANSI 455-2, NSF Certification Guideline 306)."
  standard: String
  "Certifier's listing id when printed (e.g. 1451522)."
  listingId: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "What the listing says it certifies."
  coverageKind: CertifiedObjectKind!
  "Scope sentence verbatim (e.g. 'contain the identity and quantity of dietary ingredients declared on the product label')."
  scopeVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Date the certifier says the product was certified."
  certifiedAt: DateTime
  "Latest observed status (history: COVERS episodes and SourceSnapshots)."
  status: CertificationListingStatus!
  "Certifier's own category or goal labels, verbatim (e.g. 'Sleep Aid'); mapped to D5 targets only by Assertion."
  categoryLabelsVerbatim: [String!] @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  """class: asserted; cardinality: exactly_one (the certifier); questions: CQ-PF-03a, Q-D8-19."""
  issuedBy: [Organization!]!
    @relationship(type: "ISSUED_BY", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: zero_or_more, many episodes (valid time = observed coverage window; a facility-level listing covers no typed target); questions: CQ-PF-03a, Q-D8-08, Q-D8-19."""
  covers: [CertificationCoverageTarget!]!
    @relationship(type: "COVERS", direction: OUT, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: one patent publication at one office (application, grant, reissue). Ownership and licensing are bitemporal
episodes on ASSIGNED_TO and LICENSED_TO (Dartmouth assignee; ChromaDex/Niagen exclusive licensee; amended after the
litigation); claim-level standing is a LegalStatus (CLAIMS_HELD_INVALID with claimNumbers) established by the court
RegulatoryRecord, because the aggregator's 'Active' is an assumption. Merges pinned GrantedPatent, PatentApplication
(publicationType), PatentFamily (familyId, familyDefinition), PatentClaim (claim numbers on LegalStatus; claim text
stays in the snapshot), PatentLicense (LICENSED_TO episodes + Assertion qualifiers), IpRightStatus (LegalStatus).
Identity rule: (office country code, publication number, kind code) = PATENT_PUB identifier. uid token: `patent`.
Questions: Q-D8-11, Q-D8-12, Q-D8-13, Q-D8-14, Q-D8-21, CQ-EC-01.
"""
type Patent implements Entity & Subjectable
  @node(labels: ["Patent", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  "Title."
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Office country code (US, EP, WO, ...)."
  office: String!
  "Publication number without country and kind code (e.g. 8197807)."
  publicationNumber: String!
  "Kind code (e.g. B2, A1)."
  kindCode: String! @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  publicationType: PatentPublicationType!
  "Family id under the stated definition (e.g. DOCDB simple family id)."
  familyId: String
  "Definition the familyId follows (DOCDB, INPADOC, SOURCE_LIST)."
  familyDefinition: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  priorityDate: DateTime
  filingDate: DateTime @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  grantDate: DateTime @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Expiry as stated, with its basis; adjudicated or lapsed standing is a LegalStatus."
  expiresAt: DateTime
  expiryBasis: PatentDateBasis @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  "Aggregator legal-status text verbatim (e.g. 'Active , expires 2026-11-19'), never a conclusion."
  aggregatorStatusVerbatim: String @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  aggregatorStatusObservedAt: DateTime @filterable(byValue: false, byAggregate: false) @sortable(byValue: false)
  """class: asserted; cardinality: one_or_more, many episodes (assignments change; valid time = assignment period); questions: Q-D8-11, Q-D8-12, CQ-EC-01."""
  assignees: [Organization!]!
    @relationship(type: "ASSIGNED_TO", direction: OUT, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many, many episodes (grant, amendment, termination; exclusivity, field and territory are qualifiers on the authorizing Assertion); questions: Q-D8-11, Q-D8-21, CQ-EC-01."""
  licensees: [Organization!]!
    @relationship(type: "LICENSED_TO", direction: OUT, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (topical, not coverage; coverage is an APPLICABILITY assessment; typed ChemicalSubstance, the ingredient-material member was cut without a fixture, R-73); questions: Q-D8-11, Q-D8-13, CQ-EC-01."""
  concerns: [ChemicalSubstance!]!
    @relationship(type: "CONCERNS", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}
