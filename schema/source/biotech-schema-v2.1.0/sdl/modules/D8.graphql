"""
Kind of legal standing. Each value is narrow on purpose: NO_QUESTIONS is not APPROVED, NOTIFICATION_ON_FILE is not
AUTHORISED, FAVOURABLE_OPINION_ONLY is not AUTHORISED, REGISTERED is not CLEARED, PATENT_IN_FORCE says nothing about
which claims survive (CLAIMS_HELD_INVALID with claimNumbers does). Replaces pinned RegulatoryStatusKind.
"""
enum LegalStatusKind {
  APPROVED
  AUTHORISED
  LICENSED
  CLEARED
  DESIGNATED
  REGISTERED
  NO_QUESTIONS
  NOTIFICATION_ON_FILE
  NOTIFICATION_OBJECTED
  EXCLUDED_FROM_DEFINITION
  NOT_EXCLUDED_FROM_DEFINITION
  FAVOURABLE_OPINION_ONLY
  NOT_AUTHORISED
  ENFORCEMENT_DISCRETION
  WITHDRAWN
  REVOKED
  DATA_PROTECTED
  MARKET_EXCLUSIVITY
  PATENT_IN_FORCE
  PATENT_EXPIRED
  PATENT_LAPSED
  CLAIMS_HELD_INVALID
  CLAIMS_NOT_INVALID
  CLAIMS_CANCELLED
  "Prescription-only status of a product or substance, scoped by jurisdiction (R-88)."
  PRESCRIPTION_ONLY
}

"Family of a LegalStatusKind: market access (may it be sold, as what), exclusivity (who else may rely on the data or sell), IP right (patent and claim standing)."
enum LegalStatusFamily {
  MARKET_ACCESS
  EXCLUSIVITY
  IP_RIGHT
}

"Licence-level market status, separate from licence status (LNHPD: 'Licence Status: Active' with 'Market status: Not Marketed')."
enum MarketStatus {
  MARKETED
  NOT_MARKETED
  UNKNOWN
}

"""
How a reported result row was obtained (the decisive enum from fixture FC-3). MEASURED: an analytical value from a
method. INPUT_VERIFIED: 'quantity by input', batch-record review; nothing was measured. IN_PROCESS_CONTROL: a
manufacturing control value (IPC). STATED_WITHOUT_VALUE: a bare 'Conforms' or 'Pass'. NOT_REPORTED: the row names
the analyte but gives neither value nor statement.
"""
enum ResultBasis {
  MEASURED
  INPUT_VERIFIED
  IN_PROCESS_CONTROL
  STATED_WITHOUT_VALUE
  NOT_REPORTED
}

"Qualifier of a reported value."
enum ResultValueQualifier {
  EXACT
  APPROXIMATE
  NOT_DETECTED
  BELOW_DETECTION_LIMIT
  BELOW_REPORTING_LIMIT
  ABOVE_RANGE
  UNKNOWN
}

"Who set the criterion (pinned CriterionBasis kept)."
enum CriterionBasis {
  INTERNAL
  PHARMACOPEIAL
  REGULATORY
  CERTIFICATION_PROGRAM
  NOT_STATED
}

"Period a criterion applies to: release limit, shelf-life limit, both."
enum SpecPeriod {
  RELEASE
  SHELF_LIFE
