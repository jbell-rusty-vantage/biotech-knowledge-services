  NOT_STATED
}

"Verdict as printed by the source next to a result (pinned PassFailVerdict plus NOT_STATED). An evaluated verdict is a kernel Assessment, never this field."
enum PassFailVerdict {
  CONFORMS
  DOES_NOT_CONFORM
  INDETERMINATE
  NOT_STATED
}

"What was tested (replaces pinned TestSample node type)."
enum SampleKind {
  LOT_RETAIN
  RETAIL_PURCHASE
  INGREDIENT_MATERIAL
  FINISHED_PRODUCT_UNSPECIFIED
  NOT_STATED
}

"Certifier listing status, latest observed (history is COVERS episodes plus snapshots)."
enum CertificationListingStatus {
  LISTED
  SUSPENDED
  WITHDRAWN
  EXPIRED
  NOT_FOUND
}

"What a listing says it certifies (pinned CertifiedObjectKind plus PRODUCT_ALL_SIZES)."
enum CertifiedObjectKind {
