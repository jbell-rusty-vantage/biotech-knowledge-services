  NDI_NOTIFICATION
  NDI_RESPONSE
  GRAS_NOTICE
  GRAS_RESPONSE
  FOOD_ADDITIVE_PETITION
  CITIZEN_PETITION
  CITIZEN_PETITION_RESPONSE
  NOVEL_FOOD_AUTHORISATION
  SCIENTIFIC_OPINION
  NHP_LICENCE
  DRUG_APPLICATION_ACTION
  DEVICE_CLEARANCE
  DESIGNATION
  REGISTRATION
  INSPECTION_CLASSIFICATION
  FORM_483
  WARNING_LETTER
  CLOSE_OUT_LETTER
  RECALL
  IMPORT_ALERT
  SAFETY_COMMUNICATION
  COURT_DECISION
  PTAB_DECISION
  PATENT_OFFICE_ACTION
  OTHER
}

"Coarse family of a RegulatoryRecordKind, stored for one-hop filtering (all enforcement records of a firm; all market-access records of an ingredient)."
