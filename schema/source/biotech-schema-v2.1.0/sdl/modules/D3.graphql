"""
Purpose: one investigation (trial, cohort, preclinical experiment, systematic review) independent of how many
registrations, versions and papers describe it; the join point of every D3 question (arms, outcomes, results, sponsor,
registry history, papers) and the D13 frontier attachment; HAS_STUDY_ROLE and INVESTIGATES make it the entry point from a company,
funder, award or condition. Also absorbs pinned TrialRegistration (registration ids are
kernel Identifiers; the registry history is RegistrationVersion) and Dataset (a reused cohort or IPD set is a Study of
kind OBSERVATIONAL_COHORT that secondary analyses REPORT_ON).
Identity rule: any registry identifier (NCT, ISRCTN, EUCT, EUDRACT) attached through the kernel; two registrations of one
trial (NCT01038583 = ISRCTN83772183) are two Identifiers on one Study. Unregistered studies: (first reporting
publication DOI or PMID, studyKind, normalized design label, e.g. ITP cohort + compound).
uid token: `study` (hu:study:<opaque>).
Status fields are a read-only projection cache of the latest open HAS_REGISTRATION_VERSION episode (method in
projectionMethodVersion, e.g. study-registry-projection/v1; source uid in projectionOfRegistrationVersionUid; written by a
PROJECTION Activity at projectionDerivedAt); authority is the RegistrationVersion.
Questions: CQ-ST-01, CQ-ST-04, CQ-ST-07, CQ-ST-08, Q-D3-02, Q-D3-04, Q-D3-06, Q-D3-08, Q-D3-09, Q-D3-10, Q-D3-11, Q-D3-18.
"""
type Study implements Entity & Subjectable
  @node(labels: ["Study", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Design (filter: Q-D3-04 ranking, Q-D3-06 preclinical, CQ-ST-07)."
  studyKind: StudyKind!
  acronym: String @filterable(byValue: false) @sortable(byValue: false)
  "Projection cache: phase of the latest registry version (Q-D3-10)."
  phase: [TrialPhase!]
  "Projection cache: status of the latest registry version (Q-D3-02, Q-D3-10, Q-D3-18)."
  overallStatus: RegistryStatus
  "Projection cache: expected or actual primary completion of the latest version (Q-D3-02, Q-D3-10)."
  primaryCompletionDate: DateTime
  primaryCompletionDateType: RegistryDateType @filterable(byValue: false) @sortable(byValue: false)
  "Projection cache: true when the latest registry version has posted results (Q-D3-02)."
  resultsPosted: Boolean
  "uid of the RegistrationVersion the cache was projected from."
  projectionOfRegistrationVersionUid: String @filterable(byValue: false) @sortable(byValue: false)
  "Method version of the projection cache (directive rule 8)."
  projectionMethodVersion: String @filterable(byValue: false) @sortable(byValue: false)
  projectionDerivedAt: DateTime @filterable(byValue: false) @sortable(byValue: false)
  """class: asserted (state attachment); cardinality: many (EXCLUSIVE per registry: one open valid-time episode per registry, register field exclusive: true, executor-enforced (R-10); reconstructed versions carry the registry's stated date as valid time); questions: CQ-ST-04, CQ-ST-08, Q-D3-02, Q-D3-16, Q-D3-18."""
  registrationVersions: [RegistrationVersion!]!
    @relationship(type: "HAS_REGISTRATION_VERSION", direction: OUT, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many (one per arm per stating source); questions: CQ-ST-01, Q-D3-01, Q-D3-05, Q-D3-06."""
  arms: [StudyArm!]!
    @relationship(type: "HAS_ARM", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CREATE, CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many (eligible / enrolled / randomized / analyzed per stating source); questions: Q-D3-17, Q-D3-06, Q-D3-04, Q-D3-07."""
  populations: [StudyPopulation!]!
    @relationship(type: "HAS_POPULATION", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CREATE, CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many (one per distinct measure, timepoint and declared priority); questions: CQ-ST-05, CQ-ST-03, Q-D3-04, Q-D3-16."""
  outcomes: [OutcomeDefinition!]!
    @relationship(type: "HAS_OUTCOME", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CREATE, CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (one episode per party, role and asserting registry or paper; registries disagree: ASPREE lead sponsor Hennepin on CTG vs Monash on ISRCTN; D7 declares no inverse); questions: Q-D3-08, Q-D3-09, Q-D3-02, Q-D3-10."""
  roles: [StudyParty!]!
    @relationship(type: "HAS_STUDY_ROLE", direction: OUT, properties: "StudyRoleEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (conditions the registry or paper says the study investigates, resolved to D2 Condition; verbatim names stay on RegistrationVersion.conditionsVerbatim); questions: Q-D3-10."""
  conditions: [Condition!]!
    @relationship(type: "INVESTIGATES", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: one version of one registration as a registry stated it at a point in valid time — status, enrollment
(actual vs estimated), dates, results posting and submission events, design fields, verbatim sponsor/condition/
intervention names. Two populating modes: OBSERVED (BellLabs captured the registry record; its own snapshot) and
RECONSTRUCTED (a past version stated inside a later snapshot, e.g. ISRCTN 'Provided at time of registration' and
'Amended 02/03/2009'), each attached to the Study by a HAS_REGISTRATION_VERSION episode whose Assertion cites the
locator. Absorbs pinned TrialRegistration (registry, registrationId) and the registry side of ProtocolVersion.
Implements Subjectable (unlike most state payloads) because it is the object of HAS_REGISTRATION_VERSION and STATED_IN
Assertions (Assertion.object targets Subjectable).
Identity rule: (registry, registrationId, versionNumber) when the registry numbers versions (CTG history index, ISRCTN
XML version attribute); else (registry, registrationId, versionDate, populatingMode, payloadHash). Immutable.
Field facts are cited by the HAS_REGISTRATION_VERSION attach Assertion, one locator per field (reportsField naming the
field: overallStatus, enrollmentCount, masking, studyTypeVerbatim, resultsSubmissionEvents ...), the same rule as
STATED_IN; no per-field predicates. Labels `Entity` like every other version type (D4 AssayVersion, D6 LabelVersion);
the pinned VersionedState archetype label is dropped (adversarial-review stage).
uid token: `registration-version`.
Questions: CQ-ST-04, CQ-ST-08, Q-D3-02, Q-D3-16, Q-D3-18, Q-D3-10.
"""
type RegistrationVersion implements Entity & Subjectable
  @node(labels: ["RegistrationVersion", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  registry: RegistryKind!
  "Registration number as issued (NCT01038583, ISRCTN83772183)."
  registrationId: String!
  "Registry's own version counter when it has one."
  versionNumber: Int
  "Date the registry says this version took effect (CTG update posted, ISRCTN amendment date)."
  versionDate: DateTime
  versionDatePrecision: TimePrecision @filterable(byValue: false) @sortable(byValue: false)
  populatingMode: VersionPopulatingMode!
  "sha256:<hex> over the normalized version payload."
  payloadHash: String! @filterable(byValue: false) @sortable(byValue: false)
  officialTitle: String @filterable(byValue: false) @sortable(byValue: false)
  acronym: String @filterable(byValue: false) @sortable(byValue: false)
  overallStatus: RegistryStatus
  overallStatusVerbatim: String @filterable(byValue: false) @sortable(byValue: false)
  "Study type as the registry states it (CTG 'OBSERVATIONAL' for ASPREE vs ISRCTN 'Randomized controlled trial'; Q-D3-15)."
  studyTypeVerbatim: String @filterable(byValue: false) @sortable(byValue: false)
  whyStopped: String @filterable(byValue: false) @sortable(byValue: false)
  enrollmentCount: Int
  enrollmentCountType: EnrollmentCountType
  firstSubmittedDate: DateTime @filterable(byValue: false) @sortable(byValue: false)
  startDate: DateTime @filterable(byValue: false) @sortable(byValue: false)
  startDateType: RegistryDateType @filterable(byValue: false) @sortable(byValue: false)
  primaryCompletionDate: DateTime
  primaryCompletionDatePrecision: TimePrecision @filterable(byValue: false) @sortable(byValue: false)
  primaryCompletionDateType: RegistryDateType
  completionDate: DateTime @filterable(byValue: false) @sortable(byValue: false)
  completionDateType: RegistryDateType @filterable(byValue: false) @sortable(byValue: false)
  resultsPosted: Boolean
  resultsFirstPostedDate: DateTime @filterable(byValue: false) @sortable(byValue: false)
  "Results submission events as stated (CTG annotation), e.g. RELEASE:2018-03-14, RESET:2018-10-12."
  resultsSubmissionEvents: [String!] @filterable(byValue: false)
  phase: [TrialPhase!] @filterable(byValue: false)
  allocation: AllocationKind @filterable(byValue: false) @sortable(byValue: false)
  masking: MaskingKind @filterable(byValue: false) @sortable(byValue: false)
  primaryPurpose: String @filterable(byValue: false) @sortable(byValue: false)
  interventionModel: String @filterable(byValue: false) @sortable(byValue: false)
  conditionsVerbatim: [String!] @filterable(byValue: false)
  interventionNamesVerbatim: [String!] @filterable(byValue: false)
  sponsorNameVerbatim: String @filterable(byValue: false) @sortable(byValue: false)
  collaboratorNamesVerbatim: [String!] @filterable(byValue: false)
  funderNamesVerbatim: [String!] @filterable(byValue: false)
  siteCountries: [String!] @filterable(byValue: false)
}

# =====================================================================================================
# What was done to whom
# =====================================================================================================

"""
Purpose: one arm or group of a study as one source states it (registry arms/groups, paper randomization groups) — the
unit results, adverse events and administered components hang on. Absorbs pinned StudyIntervention (arm-level
intervention facts are on its InterventionComponents). Registry and paper arms are separate nodes (NCT04313634 has a
fisetin arm with a serious adverse event that the paper reports only as dropped), so Q-D3-01 is a set difference.
Identity rule: (study, sourceFamily, armKey, payloadHash of arm + components); sourceFamily = registry + registrationId
for registry versions, the work's DOI (else PMID) for a publication. Stable: a later version of the same registry that
states an identical arm adds a STATED_IN episode to the same node; a changed arm is a new node.
uid token: `study-arm`.
Questions: CQ-ST-01, CQ-ST-06, Q-D3-01, Q-D3-15, CQ-ST-02.
"""
type StudyArm implements Entity & Subjectable
  @node(labels: ["StudyArm", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  "Arm label as stated (e.g. 'Fisetin Treatment Group')."
