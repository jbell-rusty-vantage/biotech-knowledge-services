# ---- fragment D3 ----
# Module D3 — clinical and preclinical evidence. Wave 2 (model stage) by A4, 2026-10-08.
# Kernel pattern: packets/K/09-reasoning.md (A1, published 2026-10-08); template packets/K/domain-template.graphql.
# 8 node types · 14 relationship types · 31 from→to pairs (= packet-check field-pairs; the two inverse navigation fields
# Study.publications and OutcomeDefinition.results were removed in the adversarial-review stage, 2026-10-08).
# Edge-property types (kernel rule M10/M11, packets/K/09-reasoning.md "Edge-property types"): asserted edges no question
# reads in valid time use kernel AssertedRecordedProperties (STATED_IN, ADMINISTERS, MEASURES, REPORTS_ON, INVESTIGATES);
# two module types are supersets of a kernel base with one filterable qualifier each: StudyRoleEdgeProperties
# (AssertedEdgeProperties + roleKind, bitemporal) and RevisionEdgeProperties (AssertedRecordedProperties + revisionKind,
# typed with the kernel enum SourceRevisionKind since the adversarial-review stage).
# Source wording (role label, Retraction Watch reasons) stays in Assertion.qualifiers (kernel rule: verbatim text is not
# an edge field). Check stage 2026-10-08.
# Every node: implements Entity & Subjectable, 7 Entity fields verbatim, @query(aggregate: false), @mutation(operations: []).
# Every @relationship: aggregate: false, nestedOperations declared, @filterable(byValue: true, byAggregate: false).
# Not declared here (kernel pattern): subject/object/assertedBy, identifiers, mentions, generatedBy, evidence. Assessments
# (applicability, synthesis, strength, endpoint classification, interpretation) are kernel Assessment nodes that ASSESS
# these types (10-seams.yaml). Edges into this module owned by other modules: D13 Frontier.studies (ON_FRONTIER, IN) and
# D2 MechanismEvidenceContext (IN_STUDY_ARM) are declared by their owners.
# Seam target names checked against sibling SDL in worktrees A2/A3/A5/A6/A7/A8 on 2026-10-08.
# Per-source rule: registry and paper are separate asserters. StudyArm, StudyPopulation and StudyResult are one node per
# source family (registry + registrationId, or one publication) and payload: versions of the same registry that state an
# identical payload share the node through several STATED_IN episodes; values from two source families are never merged.
# OutcomeDefinition is the exception: one node per (study, outcomeKey, priority), shared by every source that declares
# it, each declaration a STATED_IN episode (adversarial-review stage, 2026-10-08).
# Neutral result fields (directive 3.2, adversarial-review stage): StudyResult.direction is the EstimateDirection of the
# point estimate (INCREASED / DECREASED ...), never IMPROVED / WORSENED; statisticalConclusion has no favorable /
# unfavorable values. Benefit or harm is a D3.result-interpretation Assessment (effectDirection) or a D5 target assertion.
# Synthesis (S module editor, 2026-10-08; final/decision-report.md, final/_work/rulings.yaml modules.D3):
#   R-10  HAS_REGISTRATION_VERSION uses AssertedEdgeProperties (StateEpisodeProperties removed); exclusivity is the
#         register field `exclusive: true`.
#   R-43  Publication.renditions: kernel-meaning RENDITION_OF (Source -> Publication, direction IN,
#         AssertedRecordedProperties, [CONNECT]); registered by D3.
#   R-44  enum PublicationRevisionStatus removed; Publication.revisionStatus typed by kernel SourceRevisionKind (null =
#         none known), the single work-level cache over REVISES and HAS_REVISION_STATUS.
#   R-58  enum QuantityBasis removed; InterventionComponent.quantityBasis typed by D6 AmountBasis; AdministrationRoute
#         adds IN_MEDIUM and INTRAPERITONEAL.
#   R-70  OutcomeDefinition docstring: D5 TargetMeasure = Biomarker | Metric | Outcome | Condition.
#   R-71  Publication.venueName: venue name only, no container node.
#   R-72  AdministeredMaterial drops D4 Device (6 -> 5 members).
#   After synthesis: 8 node types; 15 relationship types declared here (14 D3-owned + kernel-meaning RENDITION_OF,
#   counted once in K under R-01); 31 field-pairs (−1 ADMINISTERS -> Device, +1 RENDITION_OF).

