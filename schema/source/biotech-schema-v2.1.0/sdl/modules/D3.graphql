# =====================================================================================================
# What was measured and what came out
# =====================================================================================================

"""
Purpose: one outcome measure at one timepoint with one declared priority (the same measure at 2, 4 and 20 weeks is
three definitions; a measure demoted from primary to secondary in a later version is a second definition with the same
outcomeKey). Shared across sources (the exception to the per-source rule): every source that declares it gets a
STATED_IN episode, so "which versions and which paper declared CTx at
20 weeks as primary" is a traversal, and outcome switching (CQ-ST-04, Q-D3-16) is a group-by on outcomeKey. Adverse
event terms are definitions of measureKind ADVERSE_EVENT so every StudyResult has exactly one definition. MEASURES links
it to the D4 / D2 concept it measures, which is how study evidence reaches a D5 Target (D5 union TargetMeasure: Target
-OPERATIONALIZED_BY-> Metric | Biomarker | D2 Outcome | D2 Condition; R-70).
Identity rule: (study, outcomeKey = normalized measure title + normalized timepoint, priority).
uid token: `outcome-definition`.
Questions: CQ-ST-04, CQ-ST-05, CQ-ST-06, Q-D3-04, Q-D3-05, Q-D3-16, CQ-ST-03, Q-D3-14.
"""
type OutcomeDefinition implements Entity & Subjectable
  @node(labels: ["OutcomeDefinition", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  "Measure title as first stated."
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Normalized measure + timepoint; equal across sources and versions for the same measure."
  outcomeKey: String!
  priority: OutcomePriority!
  measureKind: MeasureKind!
  "Timepoint or time frame as stated ('20 weeks', 'median 4.7 years')."
  timepoint: String
  description: String @filterable(byValue: false) @sortable(byValue: false)
  """class: asserted; cardinality: one_or_more (each registration version and publication declaring this measure at this priority); questions: CQ-ST-04, CQ-ST-05, Q-D3-16."""
  statedIn: [StatingRecord!]!
    @relationship(type: "STATED_IN", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: zero_or_one (curated resolution of the measure; unresolved stays empty); questions: Q-D3-04, Q-D3-05, CQ-ST-03, CQ-ST-06."""
  measures: [OutcomeMeasureTarget!]!
    @relationship(type: "MEASURES", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

"""
Purpose: one reported number set for one outcome definition, one arm set, one analysis set, as one source states it
(registry results module row, paper table cell, abstract sentence, pooled review estimate). Two sources reporting the
same estimate are two nodes (registry 'Full Range' vs paper interquartile range for one median; n analyzed 28 vs 30), so
disagreement is visible and nothing is overwritten. Absorbs pinned AdverseEventResult (resultKind ADVERSE_EVENT_COUNT,
seriousness, participants affected / at risk, collection method). The STATED_IN Assertion's locators trace every number
(Q-D3-13). Filter properties per 02-questions.md: analysisKind, comparisonKind, statisticalConclusion, direction,
resultKind, sampleSize, analysisPopulation, dispersionKind (new), subgroupLabel (new), seriousness, collectionMethod,
participantsAffected;
range comparisons on estimate / intervalLower / intervalUpper only for pooled results (Q-D3-11) and thresholds (CQ-ST-10).
Identity rule: (outcome definition, arm set, analysisPopulation, subgroupLabel, timepoint, resultKind, sourceFamily,
payloadHash); sourceFamily as for StudyArm, so a later registry version restating identical numbers adds a STATED_IN
episode instead of a node.
uid token: `study-result`.
Questions: CQ-ST-05, CQ-ST-06, CQ-EV-03, Q-D3-01, Q-D3-04, Q-D3-05, Q-D3-06, Q-D3-11, Q-D3-13, Q-D3-15, CQ-ST-10.
"""
type StudyResult implements Entity & Subjectable
  @node(labels: ["StudyResult", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  resultKind: StudyResultKind!
  analysisKind: AnalysisKind!
  comparisonKind: ComparisonKind!
  statisticalConclusion: StatisticalConclusion!
  "Direction of the point estimate (EstimateDirection: neutral, never benefit / harm)."
  direction: EstimateDirection
  analysisPopulation: AnalysisSetKind
  sampleSize: Int
  estimate: Float
  estimateQualifier: EstimateQualifier @filterable(byValue: false) @sortable(byValue: false)
  "UCUM unit of estimate and interval."
  unitCode: String
  dispersionKind: DispersionKind
  "SD or SE value when dispersionKind is STANDARD_DEVIATION or STANDARD_ERROR."
  dispersionValue: Float @filterable(byValue: false) @sortable(byValue: false)
  "Bounds of a CI, IQR or full range (pinned ciLower / ciUpper)."
  intervalLower: Float
  intervalUpper: Float
  "Confidence level of a CI (0.95)."
  ciLevel: Float @filterable(byValue: false) @sortable(byValue: false)
  pValue: Float @filterable(byValue: false) @sortable(byValue: false)
  "p as printed ('<0.001', '0.611')."
  pValueText: String @filterable(byValue: false) @sortable(byValue: false)
  multiplicityAdjusted: Boolean @filterable(byValue: false) @sortable(byValue: false)
  "Subgroup the result is restricted to, as stated ('female', 'site: UM', 'highest p16 tertile'); null = the whole analysis population (replaces pinned HAS_ANALYZED_COHORT for sex-, site- and enrichment-limited results)."
  subgroupLabel: String
  "armKey of the reference arm of a BETWEEN_ARM comparison."
  comparatorArmKey: String @filterable(byValue: false) @sortable(byValue: false)
  timepointText: String @filterable(byValue: false) @sortable(byValue: false)
  "Verbatim result sentence or cell text."
  resultText: String @filterable(byValue: false) @sortable(byValue: false)
  seriousness: AeSeriousness
  participantsAffected: Int
  participantsAtRisk: Int @filterable(byValue: false) @sortable(byValue: false)
  eventCount: Int @filterable(byValue: false) @sortable(byValue: false)
  collectionMethod: AeCollectionMethod
  """class: structural; cardinality: exactly_one; nestedOperations [CONNECT] by design: binds an OutcomeDefinition that HAS_OUTCOME already created (deviation from rule 3 recorded in 09-reasoning.md); questions: CQ-ST-05, Q-D3-04, Q-D3-05, CQ-ST-06."""
  outcome: [OutcomeDefinition!]!
    @relationship(type: "RESULT_FOR", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: one_or_more (one arm for descriptive and within-arm results, two or more for comparisons; the reference arm is comparatorArmKey); nestedOperations [CONNECT] by design: binds arms HAS_ARM already created; questions: CQ-ST-06, Q-D3-01, Q-D3-04."""
  arms: [StudyArm!]!
    @relationship(type: "RESULT_FOR_ARM", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: one_or_more (each record of the result's source family that states these numbers, usually one; its Assertion cites one locator per number); questions: Q-D3-13, Q-D3-15, CQ-ST-06."""
  statedIn: [StatingRecord!]!
    @relationship(type: "STATED_IN", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}

# =====================================================================================================
# Scholarly works, their corrections and versions
# =====================================================================================================

"""
Purpose: one scholarly work or one version of it — journal article, preprint version, systematic review version,
protocol or analysis plan, conference abstract, correction / retraction / expression-of-concern / withdrawal notice —
the unit that reports on studies, states arms, outcomes and results, and is corrected, retracted or superseded per
asserter (REVISES). Its renditions (PubMed record, PMC JATS, DOI landing page, PDF) are kernel Sources grouped by the
kernel-meaning RENDITION_OF (Source -> Publication, asserted, recorded-only; R-43), never by a cross-type join through a
shared Identifier (R-42); locators live on their snapshots. Absorbs pinned ProtocolVersion
(publicationKind PROTOCOL / ANALYSIS_PLAN). Owner D3 (R-71; D9 MediaWork excludes scholarly works). Authors are
predicate-only AUTHORED_BY Assertions → D7 Person | Organization (registered by D3, R-80).
Identity rule: DOI (+ versionLabel for preprint versions and review updates such as CD007176.pub2), else PMID, else PMCID,
else (venue, title, publishedAt).
uid token: `publication`.
Questions: CQ-EV-05, Q-D3-03, Q-D3-11, Q-D3-12, CQ-ST-07, Q-D3-13, Q-D3-14, Q-D3-16.
"""
type Publication implements Entity & Subjectable
  @node(labels: ["Publication", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  "Title."
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  publicationKind: PublicationKind!
  "Version label (v1…v4 for medRxiv, pub2 for Cochrane)."
  versionLabel: String @filterable(byValue: false) @sortable(byValue: false)
  publishedAt: DateTime
  publishedAtPrecision: TimePrecision @filterable(byValue: false) @sortable(byValue: false)
  "Journal or server name as printed: venue name only, no container node (R-71)."
  venueName: String @filterable(byValue: false) @sortable(byValue: false)
  citationText: String @filterable(byValue: false) @sortable(byValue: false)
  "Read-only projection cache over incoming REVISES and kernel HAS_REVISION_STATUS Assertions (method publication-revision-status/v2), typed by the kernel SourceRevisionKind; null = none known (R-44). The single work-level cache; authority stays with those per-asserter Assertions. Filter to exclude retracted work."
  revisionStatus: SourceRevisionKind
  revisionStatusDerivedAt: DateTime @filterable(byValue: false) @sortable(byValue: false)
  "Method version of the revisionStatus cache (directive rule 8), e.g. publication-revision-status/v2."
  revisionStatusMethodVersion: String @filterable(byValue: false) @sortable(byValue: false)
  """class: asserted; cardinality: many (none for most notices; several for pooled or secondary analyses; asserted by the paper, by the registry references module or by NLM DataBank links); questions: CQ-ST-07, CQ-ST-04, Q-D3-02, Q-D3-03, Q-D3-18."""
  reportsOn: [Study!]!
    @relationship(type: "REPORTS_ON", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (this identified notice or newer version revises that work; one episode per asserter — NLM, publisher via Crossref, Retraction Watch via Crossref, preprint server, BellLabs curation — with that asserter's revisionKind; reasons in Assertion.qualifiers; status-only flags are kernel HAS_REVISION_STATUS Assertions); questions: CQ-EV-05, Q-D3-03, Q-D3-11, Q-D3-12."""
  revises: [Publication!]!
    @relationship(type: "REVISES", direction: OUT, properties: "RevisionEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted (kernel meaning, R-43; recorded time only, so regrouping is a supersession, R-26); cardinality: many (kernel Source → this work; one Source per rendition endpoint: PubMed record, PMC JATS, DOI landing page, PDF); source family of evidence with no OCCURS_IN container (K Q-K-21, Report.distinctSourceFamilyCount) and the scholarly branch of the revision patterns (Source -RENDITION_OF-> Publication <-REVISES- notice, R-44); questions: Q-K-21, CQ-EV-05."""
  renditions: [Source!]!
    @relationship(type: "RENDITION_OF", direction: IN, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}
