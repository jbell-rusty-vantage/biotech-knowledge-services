# ---- fragment D8 ----
# Module D8 — manufacturing, quality, regulation and IP. MODEL stage (Wave 2), agent A7, 2026-10-08; revised after the
# adversarial review (2026-10-08): RESULT_FOR renamed QUALITY_RESULT_FOR (D3 owns RESULT_FOR), D4 Device replaces Patent in
# RegulatoryRecordTopic and joins LegalStatusSubject, Organization leaves CertificationCoverageTarget, QualityResult.issuedBy is
# zero_or_one, properties outside 06 filterProperties are not GraphQL-filterable or sortable (they stay readable and Cypher-filterable).
# Kernel pattern: packets/K/09-reasoning.md "Kernel pattern for subject, object, identifier and mention edges" (A1, published 2026-10-08).
# Kernel types are referenced, never re-declared. Every @node: implements Entity & Subjectable, @query(aggregate: false),
# @mutation(operations: []). Every @relationship: aggregate: false, nestedOperations declared, @filterable(byValue: true, byAggregate: false).
# Edge properties: AssertedEdgeProperties (bitemporal episode) on STATUS_OF, COVERS, ASSIGNED_TO, LICENSED_TO; kernel
# AssertedRecordedProperties (recorded time only, K change 1) on the other seven (00-DIRECTIVE rule 9).
# Subjects/objects of assertions, identifiers, mentions, lineage and assessments are kernel edges: nothing is declared for them here.
# Synthesis (S module editor for D8, 2026-10-08), rulings in final/decision-report.md and final/_work/rulings.yaml (modules.D8):
#   R-57  enum SpecComparator removed; QualityResult.specComparator is D1 QuantityComparator (NOT_LESS_THAN->GTE,
#         NOT_MORE_THAN->LTE, RANGE->BETWEEN, EQUALS->EQ, ABSENT_IN->ABSENT; mapping recorded in migration/v1-map.yaml).
#   R-72  D4 Device leaves RegulatoryRecordTopic and LegalStatusSubject (a device is reached as Product -DELIVERS-> Device).
#   R-73  unions QualityResultFor and PatentTopic removed: QualityResult.resultFor is typed Lot, Patent.concerns is typed
#         ChemicalSubstance (QUALITY_RESULT_FOR -> Product and CONCERNS Patent -> IngredientMaterial cut, no fixture).
#   R-88  LegalStatusKind PRESCRIPTION_ONLY. R-66 RegulatoryPathway docstring (D13 consumes it). R-08 CQ-PF-03 -> CQ-PF-03a.
#
# 6 node types · 11 relationship types · from→to pair and union counts: final/_runlog/module-D8.md (measured).
# Seam targets (D8.seams.yaml): D1 ChemicalSubstance, IngredientMaterial, Constituent; D6 Product, ProductVariant; D7 Organization;
# enum D1 QuantityComparator (R-57).
# D8 owns the regulatory-pathway vocabulary (enum RegulatoryPathway, incl. approval routes and designations; R-56, R-66).
#
# Design rule of this module: almost every D8 fact is a dated record from one issuer with a fixed scope, and the main harm is
# reading more into a record than it says. Scope therefore lives in enums (recordKind, outcome, statusKind, resultBasis,
# coverageKind, claimNumbers), never in a boolean such as "approved", "certified" or "patented" (00-DIRECTIVE 3.2).

