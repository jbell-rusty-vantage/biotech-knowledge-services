  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "LEGAL_ENTITY, CORPORATE_GROUP, DIVISION_OR_UNIT, PUBLIC_BODY (Q-D7-01, Q-D7-14, Q-D7-19 filter on it)."
  entityKind: OrganizationEntityKind!
  "Coarse kind for filtering (Q-D7-11, Q-D7-13, Q-D7-22); never a role."
  organizationKind: OrganizationKind
  "Current registered legal name (display projection of the latest LEGAL_NAME Assertion); null when not a LEGAL_ENTITY."
  legalName: String
  "Legal form as printed (Delaware corporation, LLC, Limited, S.A., P.A.)."
  legalFormVerbatim: String
  "ISO 3166-1/-2 code of formation (LEGAL_ENTITY) or of authority (PUBLIC_BODY)."
  jurisdiction: String
  "Registry or self-declared status (projection of the latest ORGANIZATION_STATUS Assertion)."
  status: OrganizationStatus
  description: String
  """class: asserted; cardinality: many (one episode per authorizing Assertion; holder = this organization, e.g. a fund vehicle or holding company); questions: Q-D7-01, Q-D7-13, Q-D7-14, CQ-EC-01, CQ-EC-03."""
