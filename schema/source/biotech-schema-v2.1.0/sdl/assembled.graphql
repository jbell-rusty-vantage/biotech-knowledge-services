"""
Asserted reference statement (PART_OF_MECHANISM, PARTICIPATES_IN), recorded time only: one relationship per
recorded-time episode, authorized by exactly one Assertion per authority record and release (asserter = the authority
or, for BELLLABS_CURATED, the curation Agent; locator = JSON_POINTER into the authority record or the curation record).
The BellLabs hallmark mapping is a curation file held as a kernel Source with one snapshot per version; its mapping
Assertions use basisKind CURATOR_CLASSIFICATION (R-25, R-26).
The kernel AssertedRecordedProperties fields come first, verbatim (K rule M11). `referenceRelease` is the authority
release the authorizing Assertion read (e.g. Reactome stIdVersion R-HSA-196807.8, GO release date, GenAge build 21);
when a new release no longer states the edge, its episode is closed (`recordedTo`), never deleted.
Questions: Q-D2-11, Q-D2-02, Q-D2-12.
"""
type MechanismReferenceProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  recordedFrom: DateTime!
  recordedTo: DateTime
  lastWriterRunId: String
  referenceScheme: MechanismReferenceScheme
  referenceRelease: String
  participantRole: ParticipantRole
}

"""
Structural exposure attachment (EXPOSED_TO), recorded time only. Kernel StructuralEdgeProperties fields first,
then the exposure role. Questions: CQ-MX-02, CQ-MX-04, Q-D2-09.
"""
type ExposureRoleProperties @relationshipProperties {
  orderIndex: Int
  lastWriterRunId: String
  exposureRole: ExposureRole!
}

"""
Derived mechanism projection (AFFECTS_MECHANISM), recorded time only, read-only, regenerable by a PROJECTION Activity.
Kernel DerivedEdgeProperties fields first, verbatim (derivationRule names method + version, e.g.
`d2.affects-mechanism/v1`; derivedFromAssertionUids lists every input Assertion). The summary fields are computed from
the input Assertions and their MechanismEvidenceContexts and exist because questions filter on them (Q-D2-02 direction
and highest setting; CQ-MX-05 best basis; Q-D2-06 human yes/no). A superset of kernel DerivedEdgeProperties, an M11
base (R-47). `score` stays null on this edge: it links two domain entities, so the executor validates score = null
(00-DIRECTIVE 3.6); support scores and rankings (Q-D2-18) are D10 Association records (EVIDENCE_AGGREGATE, one per
modulator × mechanism). `direction` is D3 EstimateDirection (R-59): direction of change, never benefit or harm.
Questions: CQ-MX-05, Q-D2-02, Q-D2-03, Q-D2-06.
"""
type MechanismProjectionProperties @relationshipProperties {
  projectionOfAssertionUid: String
  derivationRule: String
  derivedFromAssertionUids: [String!]
  derivedFromAssessmentUids: [String!]
  score: Float
  derivedAt: DateTime
  lastWriterRunId: String
  direction: EstimateDirection
  "Strongest kernel BasisKind among the inputs, ranked by the one published kernel basis order (BasisKind docstring; R-25)."
  bestBasis: BasisKind
  highestSetting: MechanismSetting
  humanMeasured: Boolean
  nContexts: Int
  nHumanContexts: Int
  "True when the input assertions name a MolecularEntity or D1 metabolite that PARTICIPATES_IN the mechanism, not the mechanism itself."
  viaParticipant: Boolean
}

