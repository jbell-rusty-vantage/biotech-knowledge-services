  TRIAL_START
  READOUT
  DATA_PRESENTATION
  "A curated frontier milestone only (R-44): EVENT_ABOUT → D3 Publication; its clock cites the retraction notice's locator and no second date Assertion is written; the revision itself is D3 REVISES (or K HAS_REVISION_STATUS without an identified notice); authors and publisher are reached through the Publication."
  RETRACTION
  REGULATORY_SUBMISSION
  REGULATORY_ACCEPTANCE
  REGULATORY_DESIGNATION
  ADVISORY_COMMITTEE
  APPROVAL
  REJECTION
  CLINICAL_HOLD
  CLINICAL_HOLD_LIFTED
  REGULATORY_STATUS_CHANGE
  ENFORCEMENT_ACTION
  POLICY_CHANGE
  LAUNCH
  RECALL
  MARKET_WITHDRAWAL
  SAFETY_SIGNAL
  PROGRAM_DISCONTINUATION
  FINANCING
  ACQUISITION
  PARTNERSHIP
  AWARD
  LEGAL_ACTION
  OTHER
}

"Materialized lifecycle of an Event from its time Assertions (never truth, never a judgment). A slip or a missed date is computed (Q-D13-11), not a status."
enum EventStatus {
  "Only EVENT_SCHEDULED assertions exist (a guided readout, a PDUFA goal date, an expected launch)."
  PLANNED
  "A durative event has started (EVENT_OCCURRED with validFrom, no validTo yet)."
  IN_PROGRESS
  "An accepted EVENT_OCCURRED assertion exists."
  OCCURRED
  "An accepted EVENT_CANCELLED assertion exists (the sponsor or regulator called it off)."
  CANCELLED
}

"Stage of a readout as the source names it (qualifier on READOUT)."
enum ReadoutStage {
  TOPLINE
  INTERIM
  PRIMARY
  FINAL
  LONG_TERM_FOLLOW_UP
}

"What the source STATES about the primary endpoint(s) of a READOUT. A capture of the sponsor's or investigator's statement, never BellLabs' judgment of the result (that is a D3 StudyResult or an Assessment)."
enum EndpointStatement {
  MET
  NOT_MET
  MIXED
  NOT_STATED
}

"How much a PROGRAM_DISCONTINUATION stops: one trial, the whole program, or the company (wind-down, dissolution)."
enum DiscontinuationScope {
  TRIAL
  PROGRAM
  COMPANY
}

"Role of an organization or person in an event (INVOLVES). Merges the pinned HOSTS_EVENT, SPEAKS_AT, EXHIBITS_AT and EventRoleEdgeProperties.participantRole strings. What the source printed ('lead investor', 'sole book-running manager') is the authorizing Assertion's qualifier roleText:<label>, never an edge field (kernel rule M11(3))."
enum EventRole {
  "Runs the trial or program the event is about."
  SPONSOR
  "Files or holds the application (NDA/BLA/MAA holder). Written only while no D8 RegulatoryRecord documents the event (a submission, a hold); once DOCUMENTED_BY_RECORD exists the applicant is the record's ADDRESSED_TO (executor-enforced, R-66)."
  APPLICANT
  "Regulator or agency that acts (holds, rejects, designates, enforces). Written only while no D8 RegulatoryRecord documents the event (a clinical hold or a designation known only from the sponsor); once DOCUMENTED_BY_RECORD exists the regulator is the record's ISSUED_BY (executor-enforced, R-66)."
  REGULATOR
  "Issuer of the securities sold in a FINANCING (registered direct, ATM sales, IPO, follow-on). Written only while no DOCUMENTED_BY_RECORD exists; with one, the issuer is the record's ISSUED_BY (executor-enforced, R-66)."
  ISSUER
  "Borrower under a loan or credit facility in a FINANCING (adversarial review: the financed party of a loan tranche issues no securities)."
  BORROWER
  INVESTOR
  LEAD_INVESTOR
  LENDER
  "Underwriter, placement agent or at-the-market sales agent; the printed title is the authorizing Assertion's qualifier roleText."
  UNDERWRITER
  ACQUIRER
  ACQUIREE
  "Counterparty in a license, collaboration or option deal."
  PARTNER
  "Presents data or a paper (conference speaker, presenting author)."
  PRESENTER
  "Other party; the authorizing Assertion's qualifier roleText says what the source printed. Funder and recipient of an AWARD are not event roles: they are D7 Award AWARDED_BY / AWARDED_TO."
  OTHER
}

"Granularity of a frontier (vocab-frontiers.yaml section 1)."
enum FrontierGranularity {
  THEME
  MODALITY
  MECHANISM
  DISEASE_GOAL
  REGULATORY_PATH
  POPULATION
}

"Curation status of a frontier, set only by a vocabulary version bump with a rationale; never a judgment of success. MATURED is a vocabulary-retirement state (the frontier stops admitting new milestone attachments) whose bump rationale must cite an accepted BREAKTHROUGH_JUDGMENT Assessment about the Frontier; it is never set by a progress computation (vocab-frontiers.yaml 0.2.1)."
enum FrontierCurationStatus {
  ACTIVE
  DORMANT
  MATURED
  DEPRECATED
}

