"What kind of mechanism concept a Mechanism node is. Hallmarks and curated pathway records are kinds, not types."
enum MechanismKind {
  "One of the twelve hallmarks of aging (Lopez-Otin 2023), BellLabs-curated."
  HALLMARK
  "A biological process (GO biological process scope, e.g. cellular senescence, macroautophagy)."
  PROCESS
  "A curated pathway record (Reactome, WikiPathways, KEGG) with its own participant list."
  PATHWAY
  "A molecular function or activity (e.g. sirtuin protein deacylation, complex I NADH dehydrogenase activity)."
  MOLECULAR_FUNCTION
}

"Authority whose record a Mechanism mirrors; BELLLABS_CURATED for concepts with no single authority record."
enum MechanismReferenceScheme {
  REACTOME
  GO
  WIKIPATHWAYS
  KEGG
  BELLLABS_CURATED
}

"Role of a participant in a mechanism, as the reference authority states it (absorbs the pinned RegulatorySign)."
enum ParticipantRole {
  MEMBER
  CATALYST
  INPUT
  OUTPUT
  POSITIVE_REGULATOR
  NEGATIVE_REGULATOR
}

"Kind of molecular entity. Endogenous small molecules (NAD+, NAAD) are not here: they are D1 ChemicalSubstances."
enum MolecularEntityKind {
  GENE
  PROTEIN
  PROTEIN_COMPLEX
  PROTEIN_FAMILY
  NCRNA
}

"Organism class of an evidence context or molecular entity (replaces the pinned Species node; exact taxon in ncbiTaxonId)."
enum ModelOrganism {
  HUMAN
  NONHUMAN_PRIMATE
  MOUSE
  RAT
  DOG
  OTHER_MAMMAL
  ZEBRAFISH
  FLY
  WORM
  YEAST
  OTHER
  "Cell-free or in-silico contexts with no organism."
  NOT_APPLICABLE
}

"Experimental setting of a mechanism evidence context (round 0003 rule: measured where, in what)."
enum MechanismSetting {
  IN_SILICO
  IN_VITRO_CELL_FREE
  IN_VITRO_CELL
  EX_VIVO
  IN_VIVO_NONMAMMAL
  IN_VIVO_MAMMAL
  HUMAN_OBSERVATIONAL
  HUMAN_INTERVENTIONAL
}

"Kind of compartment measured (replaces the pinned AnatomicalContext and Organ nodes; exact term in compartmentOntologyId)."
enum CompartmentKind {
  WHOLE_ORGANISM
  ORGAN
  TISSUE
  CELL_TYPE
  CELL_LINE
  "Blood, plasma, serum, urine, CSF: the specimen matrix a D4 Metric also names."
  BODY_FLUID
  SUBCELLULAR
  CELL_FREE
  NOT_REPORTED
}

# SexScope and AdministrationRoute are D3's enums (D3 owns population and route descriptors) and AmountBasis is D6's
# (R-58: one amount-basis enum; D3 QuantityBasis retired); D2 consumes them on MechanismEvidenceContext (10-seams
# sharedVocabularies). Check stage: D2's own SexScope collided with D3's. Adversarial review: D2's ContextRoute and
# MechanismExposureBasis duplicated D3's enums with incompatible values and were deleted. Synthesis (R-58): D3 adds
# AdministrationRoute IN_MEDIUM and INTRAPERITONEAL; AmountBasis carries MEDIUM_CONCENTRATION for in-vitro contexts.

"Genetic manipulation that defines the context when a gene, not a compound, is the exposure (Q-D2-20)."
enum GeneticManipulation {
  NONE
  LOSS_OF_FUNCTION
  KNOCKDOWN
  GAIN_OF_FUNCTION
  VARIANT_CARRIER
}

"Role of an exposure attached to a context: the tested agent, a background co-exposure (e.g. exercise training), or the comparator."
enum ExposureRole {
  TESTED
  BACKGROUND
  COMPARATOR
}

"Kind of Condition (absorbs the pinned RiskFactor as RISK_STATE)."
enum ConditionKind {
  DISEASE
  SYNDROME
  PHENOTYPE
  RISK_STATE
}

"Kind of Outcome concept (study-independent endpoint concept; study-specific measures are D3 OutcomeDefinitions)."
enum OutcomeKind {
  SURVIVAL
  CLINICAL_EVENT
  FUNCTIONAL_PERFORMANCE
  PATIENT_REPORTED
  PHYSIOLOGICAL_STATE
  COMPOSITE
}

