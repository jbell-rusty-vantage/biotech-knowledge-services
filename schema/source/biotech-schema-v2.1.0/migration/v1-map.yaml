  valueMappings:
    QuantityComparator:
      v2Enum: QuantityComparator
      owner: D1
      ruling: R-57
      sources:
        - schema/program/final/decision-report.md R-57
        - schema/program/final/_work/rulings.yaml (remove-enum SpecComparator)
        - schema/program/final/node-register.yaml retiredEnums ThresholdComparator
      from:
        SpecComparator:
          owner: D8
          values:
            - v1: NOT_LESS_THAN
              v2: GTE
            - v1: NOT_MORE_THAN
              v2: LTE
            - v1: RANGE
              v2: BETWEEN
              note: quantity null; bounds in the Assertion qualifier range:<low>-<high>
            - v1: EQUALS
              v2: EQ
              note: packet D8 value; absent from the pinned v1 SpecComparator
            - v1: ABSENT_IN
              v2: ABSENT
            - v1: CONFORMS_TO_DESCRIPTION
              v2: CONFORMS_TO_DESCRIPTION
              note: same name in QuantityComparator
            - v1: REFERENCE_ONLY
              v2: REFERENCE_ONLY
              note: same name in QuantityComparator
            - v1: UNKNOWN
              v2: UNKNOWN
              note: packet D8 value; same name in QuantityComparator
        ThresholdComparator:
          owner: D5
          values:
            - v1: GT
              v2: GT
              note: 1:1 (R-57)
            - v1: GTE
              v2: GTE
              note: 1:1 (R-57)
            - v1: LT
              v2: LT
              note: 1:1 (R-57)
            - v1: LTE
              v2: LTE
              note: 1:1 (R-57)
            - v1: BETWEEN
              v2: BETWEEN
              note: 1:1 (R-57)
            - v1: OUTSIDE_REFERENCE_RANGE
              v2: OUTSIDE_REFERENCE_RANGE
              note: 1:1 (R-57)
    RegulatoryPathway:
      v2Enum: RegulatoryPathway
      owner: D8
      ruling: R-56, R-66 (OQ-D8-02)
      sources:
        - schema/program/final/vocabularies/frontiers.yaml synthesis.regulatoryPathwayMapping
        - schema/program/final/schema/D8.graphql enum RegulatoryPathway
