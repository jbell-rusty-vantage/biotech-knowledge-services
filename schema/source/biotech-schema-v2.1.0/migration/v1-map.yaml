              note: US_DRUG_NDA or US_BLA (by application type)
            - v1: ACCELERATED
              v2: US_ACCELERATED_APPROVAL
            - v1: CONDITIONAL
              v2: EU_CONDITIONAL_MA
            - v1: SUPPLEMENTAL
              v2: null
              disposition: unmapped
              reason: "no pathway value: the D8 RegulatoryRecord recordKind DRUG_APPLICATION_ACTION with the supplement in recordNumber"
            - v1: CLEARANCE_510K
              v2: US_DEVICE_510K
            - v1: DE_NOVO
              v2: US_DEVICE_DE_NOVO
            - v1: PMA
              v2: US_DEVICE_PMA
            - v1: EMERGENCY_USE
              v2: US_EUA
        DesignationType:
          owner: D13
          field: Event.designationType
          values:
            - v1: BREAKTHROUGH_THERAPY
              v2: US_BREAKTHROUGH_THERAPY
            - v1: FAST_TRACK
              v2: US_FAST_TRACK
            - v1: RMAT
              v2: US_RMAT
            - v1: PRIORITY_REVIEW
              v2: US_PRIORITY_REVIEW
            - v1: PRIORITY_REVIEW_VOUCHER
              v2: US_PRIORITY_REVIEW_VOUCHER
            - v1: PRIME
              v2: EU_PRIME
            - v1: SAKIGAKE
              v2: JP_SAKIGAKE
            - v1: ORPHAN
