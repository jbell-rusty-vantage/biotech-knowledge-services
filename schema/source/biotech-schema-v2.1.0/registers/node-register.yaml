      graphql: none
      executor: create (node.upsert); a new version is a new node naming supersedesUid; never update or delete
    writes: intent node.upsert by the criteria-registry agent (tool:bks-criteria-registry); new version = new node naming supersedesUid; never updated after a Report uses it; validFrom/validTo are BellLabs policy validity, not world valid time (R-24)
  - module: D10
    name: ReportItem
    uidToken: report-item
    identityKeys:
      - reportUid
      - itemKey
    identifierSchemes: []
    labels:
      - ReportItem
      - InformationArtifact
    whyNode: CQ-RC-06 filters rows by disposition BLOCKED and traverses BLOCKED_BY to the D5 UseConstraint (and on to the resolving Assertion and its locator) or the harm Assessment (R-75); CQ-RC-01 lists options by disposition and rank with the reason (ASSESSES → option); Q-D10-13 / CQ-AX-11 traverse DERIVED_FROM from a superseded or re-adjudicated input back to the exact row or section that cited it; CQ-AX-01 / Q-D10-14 filter sections with uncitedSentenceCount > 0. All four need a record below the report level; parsing the stored body at query time would make them unanswerable in Cypher and in GraphQL.
    filterProperties:
      - itemKind
      - sectionKind
      - itemKey
      - disposition
      - rank
      - uncitedSentenceCount
      - citationCompleteness
    otherProperties: 8
    archetype: InformationArtifact
    implements:
      - Entity
    mutations:
      graphql: none
      executor: create only, with its Report (report.publish); insert-only
    writes: intent report.publish (tool:bks-report-publish) in the same transaction as the kernel Report; insert-only
  - module: D10
    name: Association
    uidToken: association
    identityKeys:
      - associationKind
      - memberUids
      - methodVersion
      - inputSetDigest
    identifierSchemes: []
    labels:
      - Association
    whyNode: "Q-D10-05 filters associations by member and kind and returns score, components, method version and inputs; CQ-AX-08 traverses Association → DERIVED_FROM → Assertion to find records citing withdrawn inputs and checks the input digest. Directive 3.6 forbids the alternative (a plain edge between two domain entities carrying a score), and a derived edge cannot carry a breakdown, a statistic, an input set or supersession. Only BellLabs-computed projections are Associations (fixture: FAERS PRR from four openFDA counts); external scores are Assertions by their producer. Adversarial-review stage: no longer Subjectable (Q-D10-06's interpretation ASSESSES the drug and the event, not the record). Q-D2-18's ranking reads EVIDENCE_AGGREGATE Associations, one per modulator × mechanism (R-47). Discourse metrics are not Associations (projection-cache properties, R-49)."
    filterProperties:
      - associationKind
      - anchorUid
      - score
      - methodVersion
      - computedAt
      - staleAfter
      - recordedTo
    otherProperties: 9
    archetype: Entity
    implements:
      - Entity
    mutations:
      graphql: none
      executor: "projection job only: create; close with recordedTo on recompute; may delete a superseded record no Report or ReportItem cites (R-48)"
    writes: projection job only (tool:bks-projection-job; GDS through tool:neo4j-gds), as a PROJECTION Activity with methodVersion (WAS_GENERATED_BY, R-48); planner rejects other writers (DERIVED_EDGE_READ_ONLY extended to Association)
  - module: D11
    name: CaptureAttempt
    uidToken: capture-attempt
    identityKeys:
      - uid
    identityRule: "uid = hu:capture-attempt:<sha256(runId of the generating Activity | toolId | requestDigest | attemptedAt)>; enforced by the kernel uid uniqueness constraint. runId is not a CaptureAttempt property; for an immutable attempt lastWriterRunId equals it (adversarial review: the earlier key list named generatingActivity.runId, which no constraint can see)"
    identifierSchemes: []
    whyNode: "It holds the one fact the kernel cannot: a request that FAILED or yielded only a PARTIAL capture, which leaves no complete SourceSnapshot and no Assertion (the ICTRP timeout left no bytes at all). Questions: Q-D11-17 (D11, value 1, harm: what failed in mission M's runs, Activity.missionId ← WAS_GENERATED_BY ← attempt, joined to the registry by toolId for the questions left unanswerable) and K:CQ-AX-04 (owner K: value 2, neutral), where the attempt is what tells \"unknown: blocked\" (FAILED / PARTIAL for the subject and tool) from \"unknown: never queried\" (no attempt, no snapshot). \"Not reported by the source\" is NOT an attempt: an authoritative empty result is a COMPLETE kernel SourceSnapshot plus the kernel FIELD_NOT_REPORTED Assertion (adversarial review dropped the EMPTY_RESULT and CAPTURED outcomes, resultCount and the ToolActionKind enum; K's CQ-AX-04 reads CaptureAttempt only for \"blocked\", R-09). Making failed requests into Sources/Snapshots would turn every search URL and error page into a Source. Also read by Q-D11-01 (recent failure kinds per tool), Q-D11-07 (optional evidence for the registry-history floor; the floor itself is registry gap G1) and Q-D11-20 (rendition problems per tool). Volume is bounded by failures, never by captures. Kept as a graph record by R-41 (deciding question Q-D11-17)."
    filterProperties:
      - toolId
      - outcome
      - failureKind
      - subjectUid
      - attemptedAt
    otherProperties: 9
    archetype: "Occurrence (implements Entity only; not Subjectable: nothing is asserted about an attempt). Stored labels [CaptureAttempt, Occurrence] per R-17: the :Entity label is only on Subjectable implementers and Identifier"
    mutations:
      graphql: none
      executor: create only (immutable; a retry is a new attempt); never update or delete
    labels:
      - CaptureAttempt
      - Occurrence
    relationshipFields: 0
    lineage: "kernel WAS_GENERATED_BY → the run's Activity (declared once on Activity.generated: [Entity]); not a second lineage mechanism: no run identity of its own (R-41)"
    privacy: privacyClass INTERNAL by default (R-41; the kernel PrivacyClass has no stricter value). requestUri, queryText and errorText never carry credentials (the executor strips api_key, key, token and email query parameters before hashing and storing). When a request names a person (e.g. an NPPES name search for Q-D11-16), queryText and the name inside requestUri / errorText are stored only as sha256:<hex>. No other personal data.
    fixture: final/fixtures/D11/capture-failures-coverage
    populatedBy:
      - ctgov-record-history
      - firecrawl-cli
      - usda-fdc
      - cas-common-chemistry
      - who-ictrp
      - sec-edgar
      - regulations-gov-attachments
      - semantic-scholar
      - openalex
      - publisher-pages
    populatedByNote: "observed producers so far (publisher-pages: fixtures-stage ca-aps-notice-curl). ncbi-eutils-pubmed's empty [si] search is no longer an attempt (kernel snapshot + FIELD_NOT_REPORTED). In production every adapter in tooling/action-space.yaml emits FAILED / PARTIAL attempts through the gap-G10 recorder."
  - module: D12
    name: FoodItem
    uidToken: food
    identityKeys:
      - definingSystem
      - sourceRecordId
    identityNote: "(definingSystem, sourceRecordId) whenever the system issues a record id; only CURATED / OTHER records without one use (definingSystem, normalized descriptionVerbatim: NFC, case-folded, whitespace-collapsed) (adversarial review 2026-10-08: FDC descriptions change case and suffix across releases)"
    identifierSchemes:
      - FDC_ID
      - NDB_NUMBER
      - FNDDS_FOOD_CODE
      - FOODON
      - PHENOL_EXPLORER_FOOD
      - WIKIDATA
    whyNode: Composition (Q-D12-01, 21, 24), preparation (Q-D12-02, 03), product-to-reference mapping (Q-D12-04, 05, 30), entity linking (Q-D12-34) and food claims (Q-D12-09) all join or traverse through one reference-food record at a named preparation; it is the subject of FOOD_CONTAINS, IN_FOOD_CATEGORY, the predicate-only VARIANT_OF and the object of HAS_REFERENCE_FOOD and PATTERN_COMPONENT, and the subject/object of food assertions (target effects, interactions with drugs via D5, preparation effects).
    filterProperties:
      - definingSystem
      - sourceRecordId
      - descriptionVerbatim
      - preparationMethod
      - variantKind
      - isHistoricalReference
      - sourcePublishedAt
      - brandNameVerbatim
      - name
      - synonyms
    otherProperties: 2
    archetype: Entity & Subjectable (reference concept)
    mutations:
      graphql: none
      executor: create; update; never delete
    indexes:
      - "uniqueness: (FoodItem.uid); composite range (definingSystem, sourceRecordId)"
      - fulltext food_item_search ON [name, descriptionVerbatim, synonyms, brandNameVerbatim] (Q-D12-34)
      - vector food_item_embedding ON FoodItem.descriptionEmbedding (executor-written, not in GraphQL) — optional, Q-D12-34 fallback
  - module: D12
    name: FoodCategory
    uidToken: food-category
    identityKeys:
      - system
      - systemVersion
      - code
    identifierSchemes:
      - WWEIA_CATEGORY
      - FOODEX2
      - LANGUAL
    whyNode: Group-level harm and benefit is stated about categories, not foods (NOVA 4 and cardiometabolic outcomes, Q-D12-26; IARC processed meat Group 1, Q-D12-15), so the category must be an Assertion subject (Subjectable) and a traversal hop from a food or menu item to that evidence (Q-D12-08, 14, 31); patterns limit or exclude categories (Q-D12-11).
    filterProperties:
      - system
      - code
      - systemVersion
      - parentCode
      - label
    otherProperties: 1
    archetype: Entity & Subjectable (classification concept)
    mutations:
      graphql: none
      executor: create; update; never delete
    indexes:
      - "uniqueness: (FoodCategory.uid); composite range (system, code)"
      - fulltext food_category_search ON [label, definitionVerbatim] (entity linking of 'ultra-processed food', 'processed meat')
  - module: D12
    name: DietaryPattern
    uidToken: dietary-pattern
    identityKeys:
      - definedBySourceUid
      - patternKey
      - version
    identityNote: "definedBySourceUid = kernel Source uid of the defining document (DOI / PMID / normalized URL); patternKey non-null; version '' when the source names none; definedBy (free-text citation) is presentation only (adversarial review 2026-10-08); definedBySourceUid is a frozen identity key, never the provenance path: the defined-by trace is the attach Assertion's HAS_EVIDENCE (R-46)"
    identifierSchemes:
      - WIKIDATA
    whyNode: "Trial arms administer patterns (Q-D12-12, D3 seam), guidelines define them (Q-D12-11), and pattern-level claims are retracted or disconfirmed (Q-D12-09, 13, 23); the question must filter patterns by kind and scope and traverse to their components (PATTERN_COMPONENT) and to the arms that tested them. Synthesis R-63: the only node for any eating pattern defined by what, when or how much is eaten (time-restricted eating and fasting-mimicking diets included); D3 AdministeredMaterial administers it and D5 STEP_USES reaches it through Subjectable."
    filterProperties:
      - name
      - definedBySourceUid
      - patternKey
      - version
      - patternKind
      - definitionScope
      - synonyms
    otherProperties: 2
    archetype: Entity & Subjectable (definition concept)
    mutations:
      graphql: none
      executor: create; update; never delete
    indexes:
      - "uniqueness: (DietaryPattern.uid); composite range (definedBySourceUid, patternKey, version)"
      - fulltext dietary_pattern_search ON [name, synonyms, definitionVerbatim]
  - module: D13
    name: Event
    uidToken: event
    identityKeys:
      - eventKind
      - primarySubjectUid
      - jurisdiction
      - firstStatedTimeAtPrecision
      - discriminator
    identityRule: "Adversarial-review pass. identityKey is a MINT-TIME key, written once when the Event is created and never recomputed: eventKind | primary subject uid | jurisdiction or '-' | the time anchor as first stated (startedAt, or the scheduled window, at its stated precision) | discriminator when required. Primary subject = the object of the one EVENT_ABOUT Assertion with qualifier primary=true; for FINANCING the ISSUER or BORROWER participant, for ACQUISITION the ACQUIREE, for PARTNERSHIP the party whose asset is licensed (the INVOLVES Assertion with primary=true). Discriminator, required when one subject can have several events of one kind on one day: FINANCING instrument (loan-tranche, registered-direct, atm-sales, ipo, follow-on, private-round, grant). Matching never compares key strings: a candidate shares eventKind, primary subject and jurisdiction and has an overlapping time window (scheduled window or occurrence at its precision); a sure match attaches the new Assertions, a doubtful one mints a new Event plus a proposed EQUIVALENCE Assessment, and Events merge only through an accepted EQUIVALENCE Assessment. So a re-guided window, PLANNED → OCCURRED, or a more precise later date is a new Assertion on the SAME Event (Q-D13-11), never a new Event. Several artifacts about one occurrence (8-K, press-release exhibit, registry change, regulator record) are several Assertions about ONE Event; an acquisition's agreement and closing are one Event with two clocks. Fixtures: every Event records `mintedFrom` (snapshot and assertions its key came from)."
    identifierSchemes: []
    identifierNote: an event has no external id of its own; accession numbers, NCT ids, DOIs and FDA application numbers identify the documents (kernel Source) or the subjects (D3 Study, D8 record), reached through the event's assertions. SEC accession numbers are requested as a kernel scheme in 11-open-questions.md (for Sources).
    whyNode: "Every D13 question filters events by kind and clocks, joins them to frontiers (ON_FRONTIER) and participants (INVOLVES), and traverses event-to-event chains (LEADS_TO, RESPONDS_TO): Q-D13-01 timeline, Q-D13-02 ladder and firstness, Q-D13-05 readout-to-approval chain, Q-D13-06 financing after a result, Q-D13-08 / Q-D13-14 harm and responses, Q-D13-10 / Q-D13-11 scheduled milestones and slips. It is also the subject of time assertions, breakthrough and impact assessments, and claims (kernel subject pattern)."
    filterProperties:
      - eventKind
      - eventStatus
      - jurisdiction
      - startedAt
      - endedAt
      - announcedAt
      - effectiveFrom
      - scheduledFrom
      - scheduledTo
      - readoutStage
      - primaryEndpointStatement
      - approvalPathway
      - designationType
      - discontinuationScope
      - name
    otherProperties: 17
    filterPropertiesNote: approvalPathway and designationType are typed D8 RegulatoryPathway (R-66; OQ-D8-02 mapping); their FIELD assertions APPROVAL_PATHWAY / DESIGNATION_TYPE carry the D8 values
    otherPropertiesList:
      - eventKindNote
      - identityKey
      - summaryText
      - startedAtPrecision
      - startedAtBasis
      - endedAtPrecision
      - timeAssertionUid
      - announcedAtPrecision
      - announcementAssertionUid
      - effectiveFromPrecision
      - effectiveFromBasis
      - effectiveAssertionUid
      - localTimeZone
      - scheduledFromPrecision
      - scheduledToPrecision
      - scheduleAssertionUid
      - clockRule
    relationshipFields: 6
    archetype: Occurrence
    mutations:
      graphql: none
      executor: create (node.upsert); re-materialize clocks from Assertions; never delete
    mutationsNote: "GraphQL API is read-only (@mutation(operations: [])); the intent executor creates Events (node.upsert) and re-materializes clocks from Assertions; nothing is deleted (R-03 reading)"
  - module: D13
    name: Frontier
    uidToken: frontier
    identityKeys:
      - key
    identityRule: vocabulary key frontier:<slug> from vocab-frontiers.yaml; never reused or renamed; DEPRECATED frontiers name replacedBy
    identifierSchemes: []
    identifierNote: Wikidata QIDs exist for anchor concepts (cellular senescence, MASH), not for the frontiers; they attach as WIKIDATA identifiers on the D2 anchors, never on the Frontier
    whyNode: "The grouping key of every frontier question (Q-D13-01..04, Q-D13-08, Q-D13-09, Q-D13-16, Q-D13-23): events and studies attach to it by the asserted ON_FRONTIER classification (with asserter, vocab version and supersession, which a tag cannot carry), and it is the subject of breakthrough assessments (Q-D13-30), frontier briefs (Q-D13-29) and claims about a field. A controlled vocabulary with a node per frontier (00-DIRECTIVE 3.7), ~25 nodes."
    filterProperties:
      - key
      - name
      - level
      - parentKey
      - granularity
      - targetKeys
      - curationStatus
    otherProperties: 4
    otherPropertiesList:
      - definition
      - synonyms
      - replacedBy
      - vocabVersion
    relationshipFields: 1
    archetype: Vocabulary
    mutations:
      graphql: none
      executor: create / update only by a vocabulary version bump; never delete
    mutationsNote: created and edited only by a vocabulary version bump (vocab-frontiers.yaml) applied by the executor (R-03 reading)
deferred:
  - module: K
    name: Mention
    reason: "cut in the adversarial review (SLIM; owner confirms the non-additive removal, R-09): its identity (locator, surfaceForm) is the SourceLocator (surfaceForm = exact); Q-K-13 is value 2 and joins competing RESOLUTION / EQUIVALENCE Assessments through the shared span; Q-K-14 never touched it; its resolvedTo restated the accepted Assessment. typeHint / normalizedForm move to Assessment.facets. Promote when a value-1 question needs to filter unresolved surface forms in GraphQL"
  - module: K
    name: VerificationRun
    reason: "PLAN 6.2 decision 1: the run is an Activity (VERIFICATION) with bundleDigest; a node would be a second lineage mechanism"
  - module: K
    name: Mission
    reason: missionId on Activity answers Q-K-04 / Q-K-05; a Mission node would be a hub over its runs with nothing a question traverses; the mission lives in Mission Control
  - module: K
    name: ClaimReview / ThirdPartyVerdict
    reason: a RATES_CLAIM Assertion by the reviewer (third-party verdicts are never our Assessment)
  - module: K
    name: RetractionNotice
    reason: an identified notice is a D3 Publication that REVISES the work (R-44); otherwise the notice is a Source and status is a HAS_REVISION_STATUS Assertion per authority; SourceSnapshot.revisionKind is a capture cache
  - module: K
    name: EvidenceLine
    reason: Assessment EVIDENCE_SYNTHESIS (SEPIO EvidenceLine) with DERIVED_FROM inputs and HAS_EVIDENCE roles
  - module: K
    name: ReportStatement
    reason: report sentences live in the sealed ledger (ledgerDigest); D10 ReportItem rows carry item-level citations
  - module: K
    name: Nanopublication / Bundle
    reason: bundle and record digests are properties
  - module: K
    name: Attempt
    reason: Mission Control internal; retries keep the run identity and the KsIntentMarker dedupes effects
  - module: K
    name: PolicyVersion
    reason: string id on Report and Activity; D10 decides promotion
  - module: D1
    name: ChemicalForm
    reason: No D1 question traverses a physical form shared by several materials; crystal form, polymorph and grade are IngredientMaterial properties. A crystal-form patent concerns the ChemicalSubstance (D8 CONCERNS typed ChemicalSubstance, R-73); if patent → crystal-form coverage must be shared across suppliers' materials (Q-D1-17), D8 can request the node back (OQ-D1-04).
  - module: D1
    name: FoodItem
    reason: W05 type; owned by D12 (A2's other packet) as a standalone food node that references D1 identity through its own composition edge (seam).
  - module: D1
    name: Exposure
    reason: W05 type; out of D1 scope — D5 (interventions, protocols, safety) decides whether an exposure characterization is a node.
  - module: D1
    name: Lifestyle
    reason: W05 type; out of D1 scope — D5 (practices are interventions/protocols).
  - module: D2
    name: Species
    reason: no question traverses through a species; ModelOrganism enum + ncbiTaxonId + strainOrLine on MechanismEvidenceContext and MolecularEntity cut IN_SPECIES, APPLIES_TO_SPECIES (×2), STUDIED_IN. Reverse if a question needs a taxonomic hierarchy beyond the enum's grouping (D1 Taxon could then serve both, 11-open-questions).
  - module: D2
    name: AnatomicalContext
    reason: filter and equality-join only (Q-D2-04 compartment match with D4 Metric.systemOntologyId); CompartmentKind enum + compartmentOntologyId (UBERON/CL/Cellosaurus) + compartmentLabel cut MEASURED_IN, ACTS_IN, MEASURED_IN_MATRIX, EXPRESSED_IN_CONTEXT.
  - module: D2
    name: Organ
    reason: same as AnatomicalContext (CompartmentKind.ORGAN); cuts AFFECTS_ORGAN (×2) and EXPRESSED_IN.
  - module: D2
    name: MechanismChain
    reason: "OPEN-QUESTIONS item 7 stays deferred: an ordered chain is a query-time path (Q-D2-26) or a published Report; a source-asserted chain is a claim occurrence plus per-step Assertions."
  - module: D2
    name: Hallmark
    reason: "not a separate type: Mechanism{mechanismKind: HALLMARK}, 12 nodes seeded from Lopez-Otin 2023 (FC-12)."
  - module: D2
    name: Association
    reason: "not a D2 type: generic materialized associations are D10's Association records (ASSOCIATES → Subjectable); D2 keeps only the unscored AFFECTS_MECHANISM facet shortcut and Q-D2-18 ranks Associations (R-47 option b; closes 11-open-questions item 1)."
  - module: D3
    name: Dataset
    reason: independence counting (CQ-ST-07) works through REPORTS_ON to a cohort Study (UK Biobank, a trial's IPD) plus predicate-only SHARES_PARTICIPANTS_WITH; a Dataset node would cost a type and two relationships for one value-1 question already answered as a lower bound. Promote if data-access questions (Vivli/YODA access level) become value 1.
  - module: D3
    name: UseContextProfile
    reason: W10; the use context of an applicability assessment is the assessed D6 ProductVariant / D5 Intervention or Protocol plus assessment fields; a free-standing profile has no question that traverses it (11-open-questions, kernel/D10)
  - module: D3
    name: ApplicabilityDimension
    reason: W10; one child kernel Assessment per dimension (kind APPLICABILITY, subkind D3.applicability.dimension, facet dimension=<dose|population|material|outcome|duration|setting>, conclusionCode per-dimension verdict) that the parent DERIVES_FROM (09-reasoning.md Assessment vocabularies)
  - module: D4
    name: DiagnosticResult (interface)
    reason: "private-store contract only (biotech-meta competency question DX-08, deliberately not a D4 row: no personal results in the shared graph); the shared graph exposes AssayVersion/AlgorithmVersion/Metric uids the private store references (CQ-AX-21)"
  - module: D4
    name: Specimen
    reason: no question traverses from a specimen; comparisons are equality on specimenOntologyIds / systemOntologyId (D2 agrees). Reverse if a question needs specimen-level stability or collection-device relationships
  - module: D4
    name: MeasurementMethod
    reason: "'all labs using method M' is a property filter on AssayVersion.methodPrinciple; reverse if methods need their own interference or performance records at scale"
  - module: D4
    name: Algorithm (family node)
    reason: "questions group and filter by family, none traverses from a family: algorithmFamily + familyKey properties"
  - module: D4
    name: ComparabilityAssessment
    reason: "kernel Assessment (A1 ownership map: equivalence assessments are K type, kind and questions by the domain)"
  - module: D5
    name: AdverseEffect
    reason: "closed (R-84, OQ-D5-03): effect terms (nausea, GI upset, hypermagnesemia, lymphoma) are D2 Conditions (conditionKind PHENOTYPE | DISEASE), object of CAUSES_ADVERSE_EFFECT; no AdverseEffect node; one condition resolver (D11); the MedDRA licence is a separate owner item"
  - module: D5
    name: SafetySignal
    reason: kernel Assessment assessmentKind SAFETY_SIGNAL, subkind D5.safety-signal; inputs via kernel DERIVED_FROM; signal status = conclusionCode, severity = gradeScheme + grade (kernel M9; vocabulary registered in final/vocabularies/assessment-vocabularies.yaml, R-54; OQ-D5-04 closed)
  - module: D5
    name: Population
    reason: non-study populations are the PopulationGroup enum (scopePopulations, appliesToPopulations, population qualifier); study populations are D3 StudyPopulation referenced by uid in the qualifier
  - module: D5
    name: Observation
    reason: public before/after numbers are kernel Assertions (assertionKind METRIC) about the protocol or person, with a D4 Metric object; promote if a question traverses observations
  - module: D5
    name: ProtocolResult
    reason: same as Observation
  - module: D5
    name: MeasurementPlan
    reason: ProtocolStep stepKind MEASURE + STEP_USES -> D4 Metric + occurrence range
  - module: D5
    name: ProtocolAdjustmentRule
    reason: ProtocolStep stepKind REVIEW + threshold* + reviewAction (CQ-PR-04, value 3)
  - module: D5
    name: Constraint
    reason: "protocol-stated conditions: UseConstraint via STATES_CONSTRAINT (derived) for cautions; conditionText + appliesToPopulations + requirementLevel CONDITIONAL for eligibility conditions"
  - module: D5
    name: ContraindicationAssertion
    reason: kernel Assertion predicate USE_CONSTRAINED_IN (level CONTRAINDICATED in valueString); specializations re-declared kernel subject/object (PLAN section 1 item 3)
  - module: D5
    name: InteractionAssertion
    reason: kernel Assertion predicate INTERACTS_WITH
  - module: D5
    name: Exposure (characterized exposure / contaminant side)
    reason: contaminant exposures are D8 measurements and D12 composition; the practice side merged into Intervention
  - module: D6
    name: InventoryItem
    reason: no public source exposes merchant inventory records; no question ≥ value 2
  - module: D6
    name: IndividualUnit
    reason: a physically tested unit is a D8 sample (QualityResult on Lot or Product)
  - module: D6
    name: AffiliateLink
    reason: D9 owns tracked links as media/occurrence artifacts (they are published inside pages and episodes); D9 declares the edge into D6 Offer/MerchantListing (OQ-D6-07)
  - module: D6
    name: CommerceMatch
    reason: kernel Assessment (assessmentKind EQUIVALENCE or OTHER; subkinds D6.listing-to-package, D6.identifier-equivalence, D6.recall-scope, D6.authorized-channel, D6.change-kind, D6.seller-account-to-organization; claim-vs-label verdicts are kernel SUPPORT Adjudications, no D6 subkind); directive 3.6 and A1's ownership map
  - module: D6
    name: ProductLot
    reason: D8 owns Lot (coordinator default; D8's recall/COA/certification questions all join on it); D8 declares LOT_OF → Product | ProductVariant (Package declined, R-74; OQ-D6-13 closed)
  - module: D7
    name: Facility
    reason: "Closed by R-67 (OQ-D7-05): no Facility node. A certified site is the operating Organization plus verbatim scope, and the facility branch uses the D8 predicate LISTING_COVERS_FACILITY_OF. D8 is the designated future owner; promotion trigger FDA Data Dashboard access plus a value-1 question joining two records through one FEI."
  - module: D7
    name: PseudonymousActor
    reason: "A handle is an account on a platform (D9 owns platforms, channels and accounts); D9 research lists actor types as D7 (contested, OQ-D7-06). Check stage: D9 models the handle as a Channel (platform handle, platformAccountId); resolution to Person is a kernel RESOLUTION Assessment over the Channel and the Person. The channel operator is the D9 predicate OPERATED_BY (R-79)."
  - module: D7
    name: AnonymousActor
    reason: "An unnamed class of asserter ('anonymous commenter', 'unnamed employee') is the kernel asserter pattern's concern (ASSERTED_BY → the publishing Organization or the D9 account with an asserterClass qualifier). Owner: kernel (OQ-D7-06)."
  - module: D7
    name: CohortParticipant
    reason: A participant token issued by a study is study data; no D7 question. Owner D3 if any D3 question needs it.
  - module: D7
    name: FinancialInterest (intermediate node)
    reason: The interest edges plus their authorizing Assertions carry kind, interval, stake and value; the conflict assessment cites the Assertion (DERIVED_FROM). Revisit only if one disclosure must bind several kinds, one value bucket and one project into a single unit (NIH FCOI record). Shape B kept (R-78).
  - module: D7
    name: FinancingRound
    reason: A financing is a D13 Event (eventKind FINANCING) INVOLVES the issuer and named investors (round participation INVESTOR | LEAD_INVESTOR; HOLDS_STAKE only when a source states the holding, R-69); amounts are Assertions on the Event under FINANCING_AMOUNT, DATE_OF_FIRST_SALE and INVESTOR_COUNT, registered by D13 (R-92); related persons are HOLDS_ROLE (Q-D7-04).
  - module: D7
    name: ConflictRelevanceAssessment
    reason: Kernel Assessment with assessmentKind CONFLICT_RELEVANCE; one register entry D7.conflict-relevance, registrar D7 (conclusionCode DIRECT | INDIRECT | NOT_RELEVANT | UNDETERMINED; facets relevanceBasis, temporalOverlap); the disclosure facets disclosureFinding, disclosurePlacement and completeness are contributed by D9 (R-55; final/vocabularies/assessment-vocabularies.yaml). D9 owns the occurrence. The Assessment ASSESSES the Claim and the speaker and is DERIVED_FROM the occurrence (R-20; OQ-D7-15 closed).
  - module: D7
    name: FundingProgram
    reason: An ARPA-H or Hevolution programme is Award.programName until a question traverses programme → awards → recipients across funders.
  - module: D7
    name: InvestorGroup
    reason: Organization with entityKind CORPORATE_GROUP and PARENT_OF to its vehicles (Q-D7-14).
  - module: D8
    name: EnforcementAction
    reason: research-stage candidate; folded into RegulatoryRecord (recordFamily ENFORCEMENT) — same identity rule (issuer, kind, number), same issuer edge; recall-only properties are nullable on one type (measured — 6 types, 11 relationship types, 29 pairs)
  - module: D8
    name: Facility
    reason: R-67 — no Facility node; D8 is the designated future owner; promotion trigger FDA Data Dashboard access plus a value-1 question joining two records through one FEI. Packet reason — no D8 question at value 1 traverses a facility; inspections and GMP findings name the firm, the address and an FEI; facility address stays verbatim on the record, a facility-level certification names its operator through predicate-only LISTING_COVERS_FACILITY_OF (Organization left COVERS in the adversarial review); promote when FDA Data Dashboard (FEI-keyed inspection classifications) access exists — see 11-open-questions (D7 offered the type to D8)
  - module: D8
    name: Specification (ManufacturingSpecification, SpecificationVersion, SpecificationCriterion)
    reason: specifications are mostly invisible; they surface as a limit beside a result (inline on QualityResult), as regulator text (RegulatoryRecord.conditionsVerbatim / snapshot) or as a certifier scope sentence; no value ≤ 2 question traverses a specification
  - module: D8
    name: ManufacturingProcess / ManufacturingStep
    reason: process text appears only inside regulator letters; no question
  - module: D8
    name: ManufacturingCapability
    reason: CQ-MF-04 is value 3; predicate HAS_CAPABILITY_STAGE with valid time
  - module: D8
    name: Trademark
    reason: no question at value ≤ 2; USPTO TSDR needs an API key; brand identity is D6/D7
  - module: D8
    name: PatentClaim
    reason: claim-level standing is LegalStatus.claimNumbers; claim text stays in the captured snapshot; coverage is an APPLICABILITY assessment
  - module: D8
    name: PatentFamily
    reason: familyId + familyDefinition on Patent; no question traverses a family as a thing
  - module: D8
    name: CertificationProgram
    reason: programme and standard are listing properties
  - module: D9
    name: EpisodeSegment
    reason: Segment kind (sponsor read, editorial, intro, correction note) is a property of the span; carried as the occurrence qualifier `segment:<KIND>` until the kernel adds Assertion.segmentKind (K-5), and as MEDIA_TIMECODE locators. Promote only if a question must traverse one segment shared by many occurrences.
  - module: D9
    name: DiscourseAssessment
    reason: research-stage candidate; kernel Assessment kinds RETELLING_FIDELITY / CONFLICT_RELEVANCE / SOURCE_AUTHORITY cover it (A1's map)
  - module: D9
    name: PseudonymousActor
    reason: a handle is a Channel with channelKind ACCOUNT and isPseudonymous (D7 says handles are D9 accounts); kernel request K-6 admits it as an asserter
  - module: D9
    name: Community (offline)
    reason: no D9 question at value ≤ 2; online communities are Channels (FORUM)
  - module: D9
    name: GraphView
    reason: a saved view specification is application state, not knowledge; no question
  - module: D9
    name: MediaSuitabilityAssessment
    reason: no D9 question; if needed it is a kernel Assessment (QUALITY) about an IMAGE MediaWork
  - module: D9
    name: MediaRightsRecord
    reason: rights as captured are MediaWork.rightsStatementVerbatim; no question needs rights versions as nodes in pass one
  - module: D9
    name: ProductLabelRegion
    reason: label regions are kernel BOUNDING_BOX locators on a D6 label snapshot (A1's map); D6 owns label content
  - module: D9
    name: DocumentTextVersion
    reason: folded into Chunk properties (textBasis, textVersionHash, extractorVersion, normalizationVersion, textReviewNote); no question filters text versions without their chunks
  - module: D9
    name: Segmentation
    reason: folded into Chunk.chunkerVersion (operational envelope, not knowledge)
  - module: D9
    name: Publication (scholarly)
    reason: D3 owns scholarly works (agreed with A4's research notes); MediaWork excludes them
  - module: D10
    name: PolicyVersion
    reason: 'Kernel map gives it to D10 "as a node only if a question traverses it". None does: CQ-RC-02 reads the policy id on the Report; "which reports were published under policy P" is a property filter on Report.policyVersion / Activity.policyVersion. The policy document itself is a registered artifact in the store (payloadHash). Promote when a question asks for policy → criteria → reports traversals across policy versions (11-open-questions #21). Confirmed: PolicyVersion stays a string (R-33).'
  - module: D10
    name: Insight
    reason: "PLAN 6.1: an insight is a kernel Assessment (assessmentKind INSIGHT)."
  - module: D10
    name: Recommendation (BellLabs)
    reason: A BellLabs recommendation is a kernel Report (reportKind RECOMMENDATION or COMPARISON) whose ROW items have disposition SELECTED; a person's recommendation is a kernel claim occurrence (speechAct RECOMMENDS, predicate RECOMMENDS_USE / RECOMMENDS_AGAINST registered by D9, R-83).
  - module: D10
    name: Community / Cluster
    reason: Q-D10-20 runs GDS Leiden over a per-question projection; community ids are streamed or written by a PROJECTION Activity as non-schema properties; a cluster summary that leaves the graph is a Report (PROFILE) re-grounded on assertions. Value-3 question; no node.
  - module: D10
    name: SimilarityResult
    reason: Q-D10-19 similarity is an Association of kind SIMILARITY; no separate type.
  - module: D10
    name: EntitySnapshot (frozen state of X at T)
    reason: Kernel decision 3 (computed state cites DERIVED_FROM + inputSetDigest); a compound profile is a Report whose items cite assertions; no D10 snapshot type.
  - module: D10
    name: UseContextProfile (W10)
    reason: Personalization is out of scope (brief); a comparison's context (population, dose, target) is recorded as the read intent's parameters (Report.queryDigest) and the criteria's targetKeys. Flagged 'possibly never used' in OPEN-QUESTIONS.
  - module: D10
    name: Comparison / Ranking (unpublished)
    reason: "Directive 3.5: an unpublished comparison is computed at query time; nothing is stored but the criteria."
  - module: D10
    name: AnswerLog (ad hoc answers)
    reason: Only published answers are kernel Reports (reportKind ANSWER); ad hoc answer traces stay in the answer service's logs (Activity of kind ANSWER may be written when an answer is published).
  - module: D11
    name: ToolCapability / SourceAccessProfile (one node per action-space entry)
    reason: The registry is versioned config read by the agent's tool layer (Q-D11-01, Q-D11-20). As a node it would be a ~60-member low-cardinality vocabulary that every snapshot and attempt points at (the modeling skill's "low-cardinality value as node" supernode anti-pattern) while no question traverses past it. The action-space id is a property (SourceSnapshot.captureMethod prefix, CaptureAttempt.toolId; R-39). Promote only if a question must join tool metadata inside one Cypher query at scale.
  - module: D11
    name: IdentifierScheme
    reason: "kernel decision: Identifier.scheme is a String code from final/vocabularies/identifier-schemes.yaml; scheme metadata (pattern, normalization, authority, bridges) lives in that register and in identifier-bridges.yaml"
  - module: D11
    name: IdentifierBridge
    reason: a bridge is never a stored identifier→identifier link (kernel rule); authority-asserted bridges are co-attachment of HAS_IDENTIFIER assertions on one entity, inferred ones are RESOLUTION / EQUIVALENCE Assessments; one (scheme, issuer, normalized value) identifies at most one Subjectable (R-42)
  - module: D11
    name: CaptureFailure as an Activity of its own
    reason: the kernel keeps one Activity per run (the lineage spine, R-13); one Activity per HTTP request would multiply lineage nodes and mix operational granularity into the spine; a CaptureAttempt generated by the run's Activity keeps the spine clean
  - module: D11
    name: TextMinedAnnotation (Europe PMC annotation as a node)
    reason: annotations are part of the linking method of the derived MENTIONS projection (derivationRule entity-link/vN), never asserted links and never evidence (R-27; the kernel Mention type was cut, R-09); observed mislinks (ChEBI dihydrozeatin riboside for NR) argue against storing them as facts
  - module: D11
    name: RegistryVersion (D11 copy)
    reason: a registry version is a kernel SourceSnapshot of the registry-record Source plus D3 RegistrationVersion state; diffs are computed at query time (Q-D11-07)
  - module: D11
    name: AuthorityRecord / AuthoritySnapshot
    reason: an authority record (GSRS, PubChem, GLEIF, NPPES) is a kernel Source + SourceSnapshot; authority per claim kind is a kernel Assessment SOURCE_AUTHORITY (content owned by D9)
  - module: D11
    name: ReadinessScore on Source
    reason: "readiness is a property of a tool/route in the registry, not of an entity (00-DIRECTIVE 3.2: no good/bad on entities)"
  - module: D11
    name: Identifier.registrationStatus (kernel field requested by D11)
    reason: "declined by R-42: assignment status lives on the HAS_IDENTIFIER episode, and a lapse is an Assertion"
  - module: D12
    name: Preparation / PreparationEffect (node per cooking method or per preparation effect)
    reason: Preparation is an enum on FoodItem plus the predicate-only VARIANT_OF between records and the predicates PREPARATION_CHANGES_CONTENT / FORMS_DURING_PREPARATION; no question filters through a preparation as an entity.
  - module: D12
    name: Exposure (pinned W05)
    reason: No D12 question filters or traverses a characterized exposure; contaminant levels are D8 QualityResult, intake limits and route-specific risk are D5 safety knowledge. Offered to D5/D8.
  - module: D12
    name: Lifestyle (pinned W05)
    reason: Practice concepts move to D5 Intervention (A5 research notes); dietary patterns split out into DietaryPattern here.
  - module: D12
    name: ExposureAgentTarget (pinned union), ExposureRoute, ExposureDurationCategory, ExposureSetting (pinned enums)
    reason: Belong to Exposure; deferred with it.
  - module: D12
    name: Recipe / Meal / IntakeRecord
    reason: Recipes are FNDDS FoodItems with HAS_RECIPE_INGREDIENT (predicate-only); a person's meals or intake are private (PCS) and out of scope.
  - module: D12
    name: FoodCompositionRecord (intermediate node per food × component × source)
    reason: The authorizing Assertion already is that intermediate record (value, unit, basis, derivation, asserter, locator, valid time); a node would duplicate it.
  - module: D12
    name: LongevityFood / Superfood / HarmfulFood (flag, label or node)
    reason: "Forbidden by 00-DIRECTIVE 3.2: 'alleged longevity food' is a food that is the subject of IMPROVES_TARGET claims on target:longevity; 'harmful' is WORSENS_TARGET assertions and HARM assessments."
  - module: D12
    name: MenuItem / FoodProduct / PreparedFood
    reason: "Anything sold is a D6 Product (productKind PREPARED_FOOD / CONVENTIONAL_FOOD / BEVERAGE; an FDC Branded Foods record is a Product with FDC_ID as an Identifier); live FoodProduct stays retired into Product. Ruled R-62: linked to a FoodItem only by HAS_REFERENCE_FOOD, never merged."
  - module: D13
    name: NarrativeArc
    reason: "→ kernel Report (reportKind PROFILE with skeletonKey d10.frontier-brief@1, kernel change 4; composition method D10): an arc selects and orders events into a story, which is a published artifact citing the events' assertions (Q-D13-29), never a fact node in D13"
    owner: K / D10
  - module: D13
    name: EventImpactAssessment
    reason: → kernel Assessment (assessmentKind EVENT_IMPACT, accepted by the kernel model stage; impact domain in facets impactDomain=<MARKET|...>); Q-D13-31 is value 3; one assessment archetype in the kernel, not one per domain
    owner: K / D10
  - module: D13
    name: Conference
    reason: "no node in either module: the recurring meeting is D9 Channel (channelKind EVENT_SERIES, D9 06 mergedInto); a conference edition or session is a qualifier on the PRESENTED_AT_CONFERENCE Assertion (edition=, session=), and a presentation itself is a D13 DATA_PRESENTATION Event (one with a data claim; no Event per edition, R-65); D13 owns the predicate, D9 owns Channel (Q-D13-25, value 3)"
    owner: D9 (Channel EVENT_SERIES) + D13 (predicate)
  - module: D13
    name: Community
    reason: "cut: no D13 question; membership is private data; pinned HOSTS_EVENT/INVOLVES from Community dropped"
    owner: none
  - module: D13
    name: Milestone
    reason: "not a node: a milestone is a lens over eventKind + qualifiers + computed firstness (vocab-frontiers.yaml section 4)"
    owner: D13 (vocabulary)
  - module: D13
    name: Breakthrough
    reason: "not a node or property: computed criteria BC-* over events, or a kernel Assessment (assessmentKind BREAKTHROUGH_JUDGMENT) citing a criterion (vocab-frontiers.yaml section 6)"
    owner: D13 / K
  - module: D13
    name: Forecast
    reason: "not a node: a forecast is a captured Source snapshot plus a FORECASTS assertion with value and capture time (Q-D13-20, value 3)"
    owner: D13 / D9
  - module: D13
    name: FinancingRound
    reason: "not a node: a FINANCING Event with FINANCING_AMOUNT assertions and INVOLVES {INVESTOR, LEAD_INVESTOR, LENDER, UNDERWRITER}; D7 agreed (D7 research notes §3); D7 HOLDS_STAKE only when a source states the holding (R-69)"
    owner: D13
  - module: D13
    name: Guidance
    reason: "not a node: guided dates are EVENT_SCHEDULED assertions on a PLANNED Event; every restatement is a new assertion, so slips are computed (Q-D13-11)"
    owner: D13
