"""
Purpose: one fixed realization of a clock, risk score, wearable score, signal-processing or firmware build:
the publication reference version (DunedinPACE, Belsky 2022), a vendor implementation ('DunedinPACE™' in TruAge,
version not stated), a device software state pinned by a vendor change date (WHOOP heart-rate algorithm of
2026-07-06, CHANGE_EVENT_UNLABELED), or an unversioned service endpoint pinned by retrieval date. Absorbs the
pinned Algorithm family (`algorithmFamily`, `familyKey`) and FirmwareVersion (algorithmKind FIRMWARE).
Identity rule: (familyKey, realization, versionLabel) when a label exists; else (familyKey, realization, issuer,
versionPinnedAt) with versionBasis saying why. uid token: `algorithm-version`.
Questions: CQ-DX-02, CQ-DX-04, CQ-DX-05, CQ-DX-07, CQ-DX-09, Q-D4-04, Q-D4-05, Q-D4-06, Q-D4-14, Q-D4-15, Q-D4-20, Q-D4-23, Q-D4-26.
"""
type AlgorithmVersion implements Entity & Subjectable
  @node(labels: ["AlgorithmVersion", "Entity"])
  @query(aggregate: false)
  @mutation(operations: []) {
  id: ID!
  uid: String!
  name: String
  privacyClass: PrivacyClass
  lastWriterRunId: String
  createdAt: DateTime
  updatedAt: DateTime
  "Family name as sources write it (DunedinPACE, GrimAge, InnerAge, WHOOP heart rate)."
  algorithmFamily: String!
  "Normalized family slug (dunedinpace, grimage, innerage); questions group and filter by family."
  familyKey: String!
  algorithmKind: AlgorithmKind!
  realization: AlgorithmRealization!
  versionLabel: String
  versionBasis: AlgorithmVersionBasis!
  "Source-stated date of the change or release that pins this version (payload, not query validity)."
  versionPinnedAt: Date
  outputKind: AlgorithmOutputKind
  inputPlatforms: [MeasurementPlatform!]
  "Number of input features (173 CpG sites for DunedinPACE)."
  inputFeatureCount: Int
  trainingPopulationText: String
  "Component a device software state applies to (heart rate, sleep staging, firmware)."
  componentLabel: String
  notReported: [MeasurementField!]
  """class: structural; cardinality: one_or_more; questions: CQ-DX-02, CQ-DX-04, Q-D4-07, Q-D4-16, Q-D4-17, Q-D4-26."""
  outputs: [Metric!]!
    @relationship(type: "OUTPUTS_METRIC", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CREATE, CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: structural; cardinality: many (ordered by orderIndex when the source orders components); questions: CQ-DX-04, CQ-DX-07, Q-D4-26 (traversed in reverse: which scores inherit a HARM signal on an input metric)."""
  inputs: [Metric!]!
    @relationship(type: "REQUIRES_INPUT_METRIC", direction: OUT, properties: "StructuralEdgeProperties", nestedOperations: [CREATE, CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: zero_or_one (vendor implementation → publication version; successor → predecessor); questions: Q-D4-06, Q-D4-20, CQ-DX-04."""
  derivedFrom: [AlgorithmVersion!]!
    @relationship(type: "DERIVED_FROM_ALGORITHM_VERSION", direction: OUT, properties: "AssertedRecordedProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
  """class: asserted; cardinality: many (episode: which software state ran on a device model when); questions: CQ-DX-09, Q-D4-07, Q-D4-09, Q-D4-17, Q-D4-23."""
  devices: [Device!]!
    @relationship(type: "RUNS_ON_DEVICE", direction: OUT, properties: "AssertedEdgeProperties", nestedOperations: [CONNECT], aggregate: false)
    @filterable(byValue: true, byAggregate: false)
}
