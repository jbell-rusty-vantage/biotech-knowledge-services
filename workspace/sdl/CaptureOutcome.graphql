"How one attempt ended. Both values mean the attempt left no complete capture; neither supports an absence statement."
enum CaptureOutcome {
  "Bytes were received but not all of the requested content (truncated page, image-only PDF, lossy rendition). When the bytes are kept, snapshotUid names the kernel SourceSnapshot (captureCompleteness PARTIAL_EXCERPT)."
  PARTIAL
  "No usable content: transport, policy, quota or parser failure (failureKind says which). Usually no snapshot exists."
  FAILED
}
