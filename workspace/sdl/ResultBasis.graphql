"""
How a reported result row was obtained (the decisive enum from fixture FC-3). MEASURED: an analytical value from a
method. INPUT_VERIFIED: 'quantity by input', batch-record review; nothing was measured. IN_PROCESS_CONTROL: a
manufacturing control value (IPC). STATED_WITHOUT_VALUE: a bare 'Conforms' or 'Pass'. NOT_REPORTED: the row names
the analyte but gives neither value nor statement.
"""
enum ResultBasis {
  MEASURED
  INPUT_VERIFIED
  IN_PROCESS_CONTROL
  STATED_WITHOUT_VALUE
  NOT_REPORTED
}
