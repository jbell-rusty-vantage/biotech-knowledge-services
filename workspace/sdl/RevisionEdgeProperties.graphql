"""
REVISES episode: AssertedRecordedProperties fields verbatim (no question reads its valid time; the notice date is the
revising Publication's publishedAt and the Assertion's valid time) plus the revision kind as this asserter states it, so
that one notice labelled 'retraction' by Retraction Watch and 'erratum' by the publisher stays two typed, filterable
episodes (CQ-EV-05). The asserter's stated reasons are `Assertion.qualifiers` `reason:<text>`, not an edge field.
revisionKind uses the kernel enum SourceRevisionKind (one vocabulary with the kernel's HAS_REVISION_STATUS convention):
publisher 'erratum' / correction -> ERRATUM; preprint -> journal version and review pub1 -> pub2 -> NEW_VERSION (the two
ends' publicationKind tell them apart). REVISES is recorded when the revising work is identified (a notice or newer
version with a DOI or PMID), one episode per asserter; a status flag without an identified notice (OpenAlex
is_retracted) is a kernel HAS_REVISION_STATUS Assertion, not a REVISES episode, and one (asserter, notice) is never
recorded both ways (R-44).
"""
type RevisionEdgeProperties @relationshipProperties {
  relationshipUid: String!
  assertionUid: String!
  recordedFrom: DateTime!
  recordedTo: DateTime
  lastWriterRunId: String
  revisionKind: SourceRevisionKind!
}
