enum BasisKind {
  DIRECT_MEASUREMENT
  INFERRED_FROM_MEASUREMENT
  CITED_FROM_PRIOR_WORK
  PERSONAL_EXPERIENCE
  THIRD_PARTY_ANECDOTE
  MANUFACTURER_CLAIM
  EXPERT_OPINION
  HYPOTHESIS
  MECHANISM_REASONING
  CALCULATED
  CURATOR_CLASSIFICATION
  UNSTATED
}
