"""
Basis of a stated amount. The one program-wide amount-basis enum (R-58), owned by D6: declared label lines (D6
ComponentLineProperties.amountBasis), administered doses (D3; replaces QuantityBasis), protocol and constraint doses
(D5; replaces DosePeriod), food amounts (D12), and cell-free exposure contexts (D2, MEDIUM_CONCENTRATION). Consumers
reference it and never re-declare it (R-56). Salt-vs-moiety mass basis is a separate dimension (D1 MassBasis).
"""
enum AmountBasis {
  PER_SERVING
  PER_UNIT
  PER_100G
  PER_100ML
  PER_PACKAGE
  PER_ITEM
  PER_DOSE
  PER_DAY
  PER_WEEK
  PER_CYCLE
  PER_KG_BODY_WEIGHT_PER_DAY
  PER_KG_DIET
  SINGLE_DOSE
  "Concentration in a culture or assay medium (D2 cell-free contexts, route IN_MEDIUM)."
  MEDIUM_CONCENTRATION
  NOT_STATED
  OTHER
}
