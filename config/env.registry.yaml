# Database and graph environment variables of biotech-knowledge-services (names only; never values).
# Source of the database/graph block of .env.example and of docs/ENVIRONMENT.md. Plane BIOTECH only.
# readers are file:line (re-check after edits). No aliases and no fallback to the older NEO4J_*, NEO4J_AURA_*,
# SUPABASE_*, BKS_VERIFICATION_DSN / BKS_VERIFICATION_READ_DSN names.
# status: active (a process reads it) | library_only (an exported fromEnv reads it; no process wires it yet)
#         | by_name (never read directly; passed to a tool as an env var NAME) | declared_unread
variables:
  # --- Supabase / PostgreSQL (biotech-db) -----------------------------------------------------------------------
  - name: BKS_BIOTECH_DB_PROJECT_REF
    description: Supabase project ref of the Biotech plane. When set, the executor refuses to start unless every set BKS_BIOTECH_DB_* URL/DSN names it in its host or pooler user (loopback hosts exempt).
    kind: identifier
    secret: false
    plane: BIOTECH
    role: PROJECT_REF
    status: active
    readers:
      - packages/kg-ops/src/db-plane.ts:20   # assertBiotechDbPlane
      - apps/executor/src/index.ts:27
      - apps/executor/src/mcp.ts:21
  - name: BKS_BIOTECH_DB_URL
    description: Supabase API base URL (https://<ref>.supabase.co). Storage REST base of knowledge-artifacts custody; product BFF session issuer fallback (<url>/auth/v1) when BFF_SESSION_ISSUER is unset.
    kind: url
    secret: false
    plane: BIOTECH
    role: URL
    status: active
    readers:
      - apps/product-bff/src/config.ts:46
      - packages/kg-ops/src/admission/custody-supabase.ts:74   # SupabaseStorageObjectStore.fromEnv (library_only)
      - packages/kg-ops/src/db-plane.ts:8
  - name: BKS_BIOTECH_DB_PUBLISHABLE_KEY
    description: Supabase publishable (client) key. Declared for the shared .env; nothing in this repository reads it.
    kind: api_key
    secret: false
    plane: BIOTECH
    role: PUBLISHABLE_KEY
    status: declared_unread
    readers: []
  - name: BKS_BIOTECH_DB_SECRET_KEY
    description: Supabase server-side secret key used for the private knowledge-artifacts Storage bucket. Never logged or written to an artifact.
    kind: api_key
    secret: true
    plane: BIOTECH
    role: SECRET_KEY
    status: library_only
    readers:
      - packages/kg-ops/src/admission/custody-supabase.ts:74   # SupabaseStorageObjectStore.fromEnv; no process calls it yet
  - name: BKS_BIOTECH_DB_JWKS_URL
    description: Supabase Auth JWKS URL (https://<ref>.supabase.co/auth/v1/.well-known/jwks.json) the product BFF verifies application sessions against. Non-secret; set in apps/product-bff/fly.toml [env].
    kind: url
    secret: false
    plane: BIOTECH
    role: JWKS_URL
    status: active
    readers:
      - apps/product-bff/src/config.ts:44
      - packages/kg-ops/src/db-plane.ts:9
  - name: BKS_BIOTECH_DB_ADMIN_DSN
    description: Schema-owner (migration authority) DSN of the Biotech Supabase project; Supavisor session pooler, port 5432, sslmode=require. The installers never read a fixed name - pass this NAME with --pg-admin-dsn-env or as a target.toml database_url_env.
    kind: dsn
    secret: true
    plane: BIOTECH
    role: ADMIN_DSN
    status: by_name
    readers:
      - scripts/install-target.mjs:115   # resolveTargetDsn reads the variable NAMED by database_url_env
      - scripts/install-biotech.mjs:128  # pgTarget reads the variable NAMED by --pg-admin-dsn-env
      - packages/kg-ops/src/db-plane.ts:10
    notes: platform/mission-control/deployments/biotech/target.toml currently names BIOTECH_DB_ADMIN_DSN (owned by Mission Control); export that name, or point the target at this one, before a --remote-reinstall from this repository.
  - name: BKS_BIOTECH_DB_VERIFICATION_DSN
    description: Login role holding knowledge_verification_outbox_worker in the Biotech application PostgreSQL (common component knowledge_verification). Enables the dispatch consumer (POST /kg/admission/dispatch/consume, bks admission consume) and is the official-read authority fallback.
    kind: dsn
    secret: true
    plane: BIOTECH
    role: VERIFICATION_DSN
    status: active
    readers:
      - packages/kg-ops/src/admission/verification.ts:244   # PgVerificationAuthority.fromEnv default name
      - packages/kg-ops/src/admission/consumer-config.ts:29
      - apps/executor/src/modules/dispatch.ts:27
      - apps/executor/src/modules/read.ts:62
      - scripts/install-biotech.mjs:98   # EXECUTOR_ENV presence check (never the value)
      - packages/kg-ops/src/db-plane.ts:11
  - name: BKS_BIOTECH_DB_VERIFICATION_READ_DSN
    description: Optional read-only role (SELECT on knowledge_verification use decisions) for official-use reads (biotech-knowledge-read-intent.v3); defaults to BKS_BIOTECH_DB_VERIFICATION_DSN.
    kind: dsn
    secret: true
    plane: BIOTECH
    role: VERIFICATION_READ_DSN
    status: active
    readers:
      - apps/executor/src/modules/read.ts:62
      - packages/kg-ops/src/db-plane.ts:12
  # --- Neo4j Aura (biotech-graph) -------------------------------------------------------------------------------
  - name: BKS_BIOTECH_GRAPH_INSTANCE_ID
    description: Aura instance id of the Biotech graph. Declared for the shared .env; nothing in this repository reads it (scripts derive the id from the URI host).
    kind: identifier
    secret: false
    plane: BIOTECH
    role: GRAPH_INSTANCE_ID
    status: declared_unread
    readers: []
  - name: BKS_BIOTECH_GRAPH_URI
    description: Bolt/neo4j URI of the Biotech graph (neo4j+s://<id>.databases.neo4j.io on Aura). Aura hosts are refused unless BKS_TARGET=production.
    kind: url
    secret: false
    plane: BIOTECH
    role: GRAPH_URI
    status: active
    readers:
      - packages/kg-ops/src/neo4j.ts:26   # neo4jConfigFromEnv (executor, CLI, GraphClient.fromEnv)
      - apps/executor/src/index.ts:26
      - apps/executor/src/mcp.ts:20
      - apps/graphql-api/src/config.ts:80
      - scripts/install-biotech.mjs:517
      - scripts/install-target.mjs:555
      - scripts/ops/aura-principals.mjs:57
      - scripts/migration/lib/common.mjs:37
  - name: BKS_BIOTECH_GRAPH_USERNAME
    description: Primary graph login (writer bks_writer_svc for the executor; admin for scripts/ops). The GraphQL API uses it only as a warned fallback when no reader login is set.
    kind: username
    secret: false
    plane: BIOTECH
    role: GRAPH_USERNAME
    status: active
    readers:
      - packages/kg-ops/src/neo4j.ts:27
      - apps/graphql-api/src/config.ts:85
      - scripts/ops/aura-principals.mjs:58
      - scripts/migration/lib/common.mjs:38
  - name: BKS_BIOTECH_GRAPH_PASSWORD
    description: Password of BKS_BIOTECH_GRAPH_USERNAME.
    kind: password
    secret: true
    plane: BIOTECH
    role: GRAPH_PASSWORD
    status: active
    readers:
      - packages/kg-ops/src/neo4j.ts:28
      - apps/graphql-api/src/config.ts:86
      - scripts/ops/aura-principals.mjs:59
      - scripts/migration/lib/common.mjs:39
  - name: BKS_BIOTECH_GRAPH_DATABASE
    description: Database name inside the graph instance (default neo4j; required explicitly by the GraphQL API in production). Non-secret; set in fly.toml [env].
    kind: identifier
    secret: false
    plane: BIOTECH
    role: GRAPH_DATABASE
    status: active
    readers:
      - packages/kg-ops/src/neo4j.ts:32
      - apps/graphql-api/src/config.ts:91
      - apps/executor/src/modules/read.ts:74
      - scripts/migration/lib/common.mjs:40
  - name: BKS_BIOTECH_GRAPH_READER_USERNAME
    description: Optional read-only graph login for the consumer GraphQL API (bks_reader_public_svc). Unset - the API falls back to BKS_BIOTECH_GRAPH_USERNAME/_PASSWORD with a warning.
    kind: username
    secret: false
    plane: BIOTECH
    role: GRAPH_READER_USERNAME
    status: active
    readers:
      - apps/graphql-api/src/config.ts:81
  - name: BKS_BIOTECH_GRAPH_READER_PASSWORD
    description: Password of BKS_BIOTECH_GRAPH_READER_USERNAME.
    kind: password
    secret: true
    plane: BIOTECH
    role: GRAPH_READER_PASSWORD
    status: active
    readers:
      - apps/graphql-api/src/config.ts:82
